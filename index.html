ನು, ಬಹುಮಾನಗಳನ್ನು ಗಳಿಸಿದ್ದಾಳೆ. ಜ್ಞಾಪಕ ಶಕ್ತಿ ಚೆನ್ನಾಗಿದೆ. ಓದಿದ್ದನ್ನು ಚೆನ್ನಾಗಿ ಗ್ರಹಿಸುತ್ತಾಳೆ. ವಿದ್ಯೆಯಲ್ಲಿ ಮಾತ್ರವಲ್ಲದೆ ಕರಕುಶಲ ಮತ್ತು ಚಿತ್ರ ಕೆಲಸಗಳಲ್ಲಿಯೂ ಪ್ರವೀಣೆ. ಚಿಕ್ಕಂದಿನಲ್ಲಿ ಇವಳ ಅಜ್ಜಿ ಸೌ. ಅಲಮೇಲಳಿಂದ ಈ ಕರಕುಶಲತೆ, ಚಿತ್ರಗಳ ಕಲಿಕೆಗೆ ಅಭ್ಯಾಸ. ಮನೆ ಕೆಲಸದಲ್ಲಿ ಸಹ ಈ ಇಬ್ಬರು ಮಕ್ಕಳೂ ಜಾಣರು. ಈ ಇಬ್ಬರೂ ತುಂಬಾ ಸಂಕೋಚ ಪ್ರವೃತ್ತಿಯವರು. ತಾಯಿ ತಂದೆಯ ಜೊತೆಯಲ್ಲಿ ಸಹ ಬೇರೆಯವರ ಮನೆಗೆ ಹೋಗುತ್ತಿರಲಿಲ್ಲ. ನನ್ನ ಮನೆಗೆ ಮಾತ್ರ ಬರುತ್ತಾರೆ. ಇವರ ಅಜ್ಜ ಸೌ. ಅಲಮೇಲ ಜೀವಂತವಾಗಿದ್ದು ಇವಳ ವ್ಯಾಸಂಗ, ಕರಕುಶಲ, ಚಿತ್ರಕಲೆಗಳನ್ನು ನೋಡಿ ಎಷ್ಟು ಆನಂದಿಸುತ್ತಿದ್ದಳೋ, ಆ ಭಾಗ್ಯ ಅವಳಿಗಿಲ್ಲ. ಇವಳ ಹುಟ್ಟು ಮಲ್ಲೇಶ್ವರ ಕೆ.ಸಿ. ಜನರಲ್‌ ಆಸ್ಪತ್ರೆ.", "ಸೌ. ದೇವಕಿ: ನನ್ನ 3ನೇ ಮಗಳು. ಬಿ.ಎ. ಪದವೀಧರೆ. ತುಂಬಾ ಧೈರ್ಯಸ್ಥೆ. ಮಿತಭಾಷಿ. ಟೆಲಿಫೋನ್‌ ಇಲಾಖೆಯಲ್ಲಿ ನೌಕರಿಯಿದೆ. ಶ್ರೀ ವಿಜಯಸಿಂಹ ಬಿಎಸ್ಸಿ (ಡಿಪ್ಲೋಮೊ) ಪದವೀಧರ. ಇವರ ಮಾತಾ ಪಿತೃಗಳಿಗೆ ಏಕಮಾತ್ರ ಪುತ್ರ. ಟೆಲಿಫೋನ್‌ ಇಲಾಖೆಯಲ್ಲಿ ನೌಕರರಾಗಿದ್ದಾರೆ. ಇವರು ಮಾಧ್ವ ವೈಷ್ಣವ ಸಂಪ್ರದಾಯದವರು. ಇವರಿಬ್ಬರೂ ಪ್ರೀತಿಸಿ ರಿಜಿಸ್ಟರ್ಡ್‌ ಮದುವೆ ಮಾಡಿಕೊಂಡರು. ಒಳ್ಳೆ ವಂಶಸ್ಥರು. ಆಚಾರವಂತರೂ ಬುದ್ಧಿವಂತರು. ಈ ಸಂಪ್ರದಾಯ ಬೇರೆಯಾದ ವಿವಾಹಕ್ಕೆ ಸೌ. ದೇವಕಿ ತಂದೆ ತಾಯಿಗಳಾದ ನಾವು ಮತ್ತು ಶ್ರೀ ವಿಜಯಸಿಂಹರ ತಂದೆ ತಾಯಿಗಳೂ, ಎರಡೂ ಕಡೆ ಒಪ್ಪಿಗೆ ಇಲ್ಲದೆ ಈ ರೀತಿ ವಿವಾಹಕ್ಕೆ ಅವಕಾಶವಾಯಿತು. ಸೌ. ದೇವಕಿಯ ಈ ವಿವಾಹದಿಂದ ಸಂಪ್ರದಾಯದಿಂದ"], ["ನಡೆದು ಬಂದಿದ್ದ ನಮ್ಮ ವಂಶಕ್ಕೆ ಸ್ವಲ್ಪ ಕೊರತೆಯೇ ಆಯಿತು. ಹೊಟ್ಟೆಯಲ್ಲಿ ಹೊತ್ತು. ಹೆತ್ತು ಸಾಕಿ, ವಿದ್ಯಾ ವ್ಯಾಸಂಗ ಮಾಡಿಸಿ ಶಾಸ್ತ್ರೋಕ್ತವಾಗಿ ಧಾರೆ ಎರೆಯಲು ಅವಕಾಶ ಸಿಕ್ಕಲಿಲ್ಲವೆಂಂಬುದೇ ಉಭಯ ಕಡೆ ಇರುವ ಹಿರಿಯರ ಕೊರಗು. ಸೌ. ದೇವಕಿಯ ಈ ರೀತಿಯ ವಿವಾಹ ಸ್ವಲ್ಪ ಅಪರೂಪವೇ ಆಗಿತ್ತು. ಮತ್ತು ಉಭಯ ಕಡೆಯಲ್ಲಿ ಪ್ರಥಮ ದೃಷ್ಟಾಂತರ. ಅವರು ವೈಷ್ಣವರು. ನಾವು ಶ್ರೀವೈಷ್ಣವರು. ಯಣಾನುಬಂಧ ತಪ್ಪಿಸಲು ಯಾರಿಂದಲೂ ಸಾಧ್ಯವಿಲ್ಲ. ಇವಳ ವಿವಾಹಕ್ಕೆ ಖರ್ಚು ಮಾಡಬೇಕಾದ ಮೊಬಲಗು ಉಳಿತಾಯ ಆಗಿರಬಹುದು. ಇವಳ ಈ ರೀತಿಯ ವಿವಾಹದಿಂದ ಗಾಬರಿಗೊಂಡ ನಾವು, ಇವಳ ತಂಗಿ ಸೌ, ನಳಿನಿ ವಿವಾಹವನ್ನು ಆತುರಪಟ್ಟು ಮಾಡಿದ್ದಾಯಿತು. ಸೌ. ದೇವಕಿಗೆ ನಮ್ಮ ಮನೆಯಲ್ಲಿದ್ದಾಗ, ಅಡಿಗೆ ಕೆಲಸ ಸ್ವಲ್ಪವೂ ಬರುತ್ತಿರಲಿಲ್ಲ. ಈಗ ಬೇರೆ ಮನೆ ಮಾಡಿಕೊಂಡು ಎಲ್ಲಾ ಕೆಲಸ ಕಾರ್ಯಗಳನ್ನು ಕಲಿತುಕೊಂಡು ಮನೆಗೆ ಅವಶ್ಯಕವಾದ ಪದಾರ್ಥಗಳನ್ನು ಕೊಂಡು ಸರ್ಕಾರಿ ಕೆಲಸದ ಜೊತೆಯಲ್ಲಿ ಸಂಸಾರ ನಿರ್ವಹಣೆ ಮಾಡಿಕೊಂಡು ರೀತಿಯಾಗಿ ಮಕ್ಕಳು, ಗಂಡನ ಜೊತೆ ಸಾಕಷ್ಟು ಸಂಪಾದನೆಯಿಂದ ಸುಖವಾಗಿ ಜೀವಿಸುತ್ತಿರುತ್ತಾಳೆ. ಯಾರ ಸಹಾಯವನ್ನು ಪಡೆಯದೆ, ಮಕ್ಕಳ ಹೆರಿಗೆಯನ್ನೂ ತಾನೇ ಮಾಡಿಕೊಂಡಳು. ನಮ್ಮ ಎಲ್ಲಾ ಮಕ್ಕಳಿಗೆ ಮಾಡಿದ ರೀತಿಯಲ್ಲಿ, ಇವಳಿಗೆ ಏನೂ ಮಾಡಲಾಗಲಿಲ್ಲವೆಂಬುದೇ ನಮ್ಮ ಕೊರಗು.", "ಚಿ. ಅಕ್ಷೋಭ್ಯ: ಸೌ. ದೇವಕಿ, ವಿಜಯಸಿಂಂಹರ ಪ್ರಥಮ ಪುತ್ರ. ಪ್ರೈಮರಿ ಶಾಲೆಯಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದಾನೆ. ಬುದ್ಧಿವಂತ ವಿಪರೀತ ಚೇಷ್ಟೆ.", "ಚಿ. ಆನಂದ: ಸೌ. ದೇವಕಿ, ಶ್ರೀ ವಿಜಯಸಿಂಹರ ದ್ವಿತೀಯ ಪುತ್ರ. ನರ್ಸರಿ ಎಲ್‌.ಕೆ.ಜಿ.ಯಲ್ಲಿ ಓದುತ್ತಿದ್ದಾನೆ. ಮಾತು ಕಮ್ಮಿ ಚೇಷ್ಟೆ ಜಾಸ್ತಿ. ಬುದ್ಧಿವಂತ.", "ಸೌ. ನಳಿನಿ, ಶ್ರೀ ಪ್ರಸನ್ನಕುಮಾರ್‌: ಇವರ ವಿವಾಹ 29.11.1979, ಸಿದ್ಧಾರ್ಥಿನಾಮ ಸಂವತ್ಸರ, ಮಾರ್ಗಶಿರ ಶುಕ್ಷ ದಶಮಿ, ಗುರುವಾರ, ಬೆಂಗಳೂರು ಪ್ಯಾಲೆಸ್‌ ಗುಟ್ಟಹಳ್ಳಿ ಆಚಿಜನೇಯ ದೇವಸ್ಥಾನದ ದತ್ತಿ ಛತ್ರದ್ಲಿ ವಿಜೃಂಭಣೆಯಿಂದ ನೆರವೇರಿತು. ಶ್ರೀ ಪ್ರಸನ್ನಕುಮಾರ್‌ ೫.50, ಪದವೀಧರರು. ಸದ್ವಂಶಸ್ಥರು. ಮಿತಭಾಷಿ. ನಿಧಾನಿ. ಬೆಂಗಳೂರು ಸಿಲ್ಕ್‌ ಮರ್ಚೆಂಟ್ಸ್‌ ಸೊಸೈಟಿಯಲ್ಲಿ ಕೆಲಸ. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಪ್ರಯತ್ನಪಟ್ಟಿದ್ದರೆ, ಇನ್ನೂ ಉತ್ತಮ ನೌಕರಿಗೆ ಹೋಗಬಹುದಿತ್ತು. ತಂದೆ ತಾಯಿ ಸಹ"], ["ಒಳ್ಳೆಯವರು. ತಂದೆ ರೇಷ್ಮೆ ಇಲಾಖೆಯಲ್ಲಿ ಡೆಪ್ಯೂಟಿ ಡೈರೆಕ್ಟರ್‌ ಆಗಿದ್ದು ನಿವೃತ್ತರಾಗಿದ್ದಾರೆ. ಮಾಗಡಿ ಬ 5 ಸ್ರಿ ಲಪ ದ ಲಿ ತ್ತಾ", "ಸ್ಥಳ. ಉತಮ ವಂಶಸ್ಪರು.", "ಸೌ. ನಳಿನಿ ಬಿ.ಎಸ್ಸಿ. ಪರವೀಧರೆ. 560108 77706771೮0೧ ತೇರ್ಗಡೆಯಾಗಿದ್ದಾಳೆ. ಸ್ವಲ್ಪ ಸಿಟ್ಟು ಜಾಸ್ತಿ ಇತ್ತು ಈಗ ಕಡಿಮೆಯಾಗಿದೆ. ಛಾಪಿನಂತೆ ದಕ್ಷೆ. ಸೌ. ದೇವಕಿ ಘಟನೆಯ ನಿದರ್ಶನದಿಂದ, ಇವಳಿಗೆ ತಕ್ಕ ವಯಸ್ಸಿಲ್ಲದಿದ್ದರೂ ವಿವಾಹಕ್ಕೆ ಆತುರಪಟ್ಟು ಮಾಡಿದ್ದಾಯಿತು. ಇವಳಿಗೆ ಯಾವುದಾದರೂ ನೌಕರಿಗೆ ಪ್ರಯತ್ನ ಮಾಡಬಹುದಿತ್ತು ಸೌ. ದೇವಕಿ ನೌಕರಿಯಲ್ಲಿದ್ದು ಆದ ಘಟನೆಯಿಂದ ಇವಳಿಗೆ ನೌಕರಿ ಪಡೆಯಲು ಪ್ರಯತ್ನ ಪಡಲಿಲ್ಲ. ನನ್ನ ಗಂಡು ಮಕ್ಕಳು ಆ ಕಾಲದಲ್ಲಿ ತಮ್ಮ ವ್ಯಾಸಂಗದಲ್ಲಿ ನಿರತರಾಗಿದ್ದ ಕಾರಣ ಅವರು ಇವಳ ನೌಕರಿಗೆ ಪ್ರಯತ್ನ ಪಡಲಿಲ್ಲ. ನಾನೂ ಸಹ ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದ ಕಾರಣ ಅವಕಾಶವಾಗಲಿಲ್ಲ. ಎದ್ಯಾ ವ್ಯಾಸಂಗ ಪೂರ್ತಿಯಾಗಿದ್ದು ವಿವಾಹಕ್ಕೆ ತಕ್ಕ ವಯಸ್ಸಾಗಿದ್ದರಿಂದ ಬೆಳೆದ ಹೆಣ್ಣು ಮಕ್ಕಳನ್ನು ವಿವಾಹ ಮಾಡದೆ ಮನೆಯಲ್ಲಿಟ್ಟುಕೊಳ್ಳುವುದು ಉಚಿತವಲ್ಲವೆಂಂದು ಇವಳ ವಿವಾಹವನ್ನು ಸ್ವಲ್ಪ ಆತರುಪಟ್ಟೇ ಮಾಡಲಾಯಿತು. ಇವಳ ವಿವಾಹಕ್ಕೆ ನನ್ನ ಬಾಬ್ತು ಕಡಬದಲ್ಲಿದ್ದ ಜಮೀನನ್ನು ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟದ್ದಾಯಿತು. ಸೌ. ನಳಿನಿ ತನ್ನ ದಕ್ಷತೆಯಿಂದ ಬೇರೆಯವರ ಸಹಾಯವನ್ನು ಕೋರದೆ ತನ್ನ ನೌಕರಿಯನ್ನು ಸಂಪಾದಿಸಿಕೊಂಡು, ಬೇರೆ ಮನೆಯನ್ನು ಬಾಡಿಗೆಗೆ ಪಡೆದು ಮನೆಗೆ ಅಗತ್ಯವಾಗ ಆಧುನಿಕ ಸಲಕರಣೆಗಳನ್ನೆಲ್ಲಾ ಪಡೆದು ಬುದ್ಧಿವಂತಿಕೆಯಿಂದ ಸಂಸಾರ ನಿರ್ವಹಿಸುತ್ತಿದ್ದಾಳೆ. ಧೈರ್ಯ, ದಕ್ಷತೆ, ಕರ್ತವ್ಯ ನಿರ್ವಹಣೆಯಲ್ಲಿ ಬುದ್ಧಿವಂತಳು. ಸ್ವಲ್ಪ ಆತುರ ಜಾಸ್ತಿ ಇಷ್ಟಕ್ಕೆಲ್ಲಾ ಇವಳ ತಾಯಿಯ ಶಿಕ್ಷಣವೇ ಕಾರಣ.", "ಸೌ. ಶ್ರುತಿ: ಹಿರಿಯ ಮಗಳು. ತಂದೆಯಂತೆ ಮಿತಭಾಷಿ. ಬುದ್ಧಿವಂತೆ. ಪ್ರೈಮರಿ ಶಾಲೆಯಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದಾಳೆ.", "ಶ್ರೀವತ್ಸ: 2ನೇ ಮಗ. ಬುದ್ಧಿವಂತ. ಪ್ರೈಮರಿ ಶಾಲೆಯಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದಾನೆ.", "ಸೌ. ಶೈಲಾ ಮತ್ತು ಚಿ. ಶ್ರೀಧರ್‌: ಬಿಎಸ್ಸಿ ಪದವೀಧರ. ರಾಜಸ್ಥಾನ ಕೋಟಾದಲ್ಲಿ ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದಾರೆ. ಸದ್ವಂಶಸ್ಥರು. ತುಂಬಾ ತಾಳೆ ನಿಧಾನಿ. ಜನಗಳಲ್ಲಿ ಹೆಚ್ಚು ಅಭಿಮಾನಿ. ಇವರ ತಂದೆ ಎಚ್‌.ಆರ್‌. ಅಯ್ಯಂಗಾರ್‌. ಪೂರ್ವಸ್ಮಳ ಹಾಸನ ಜಿಲ್ಲೆಯ ಹಾಲ್ತೊರೆ. ಇವರ ತಾಯಿ, ಕಡಬದ"], ["ದೀಕ್ಷಿತರ ವಂಶದ ದಿವಂಗತ ಅಣ್ಣಾದೊರೈ ಅವರ ಅಕ್ಕ. ಸೌ. ಅಲಮೇಲಳ ತಾಯಿ ರಂಗಮ್ಮನವರಿಗೆ ಸೋದರ ಮಾವನ ಮಗಳು. ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರ ತಾಯಿಯೂ ಕಡಬದ ದೀಕ್ಷಿತರ ಮನೆ ಮಗಳು.", "ಚಿ. ಶ್ರೀಧರ್‌ ತಾತ ರಾಜಾಸ್ಥಾನದ ಕೋಟಾದಲ್ಲಿ ರೈಲ್ವೆ ಇಲಾಖೆಯಲ್ಲಿ ನೌಕರಿಯಲ್ಲಿದ್ದರು. ಚಿ. ಶ್ರೀಧರ್‌ ತಂದೆ. ಎಚ್‌.ಆರ್‌. ಅಯ್ಕಂಗಾರ್‌ ಸಹ ಕೋಟಾದಲ್ಲೇ ನೌಕರಿಯಲ್ಲಿದ್ದರು. ಚಿ. ಶ್ರೀಧರ್‌ ವ್ಯಾಸಂಗ ಸಹ ಕೋಟಾದಲ್ಲೇ ಆದ್ದರಿಂದ ಅವರಿಗೆ ರಾಜಾಸ್ಥಾನ ಚೆನ್ನಾಗಿ ಪರಿಚಯವಿದೆ. ಶ್ರೀಧರ್‌ ತಾಯಿ ನುಗ್ಗೆಹಳ್ಳಿ ಸ್ಥಳದ ದಿವಂಗತ ರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಪುತ್ರಿ. ರಾಜ ಅಯ್ಯಂಗಾರ್‌ ನನಗೆ ತುಂಬಾ ಪರಿಚಯದವರೇ ಆಗಿದ್ದರು. ಶ್ರೀ ಎಚ್‌.ಆರ್‌. ಅಯ್ಯಂಗಾರ್‌ಗೆ 2 ಗಂಡು ಮಕ್ಕಳು. 3 ಜನ ಹೆಣ್ಣು ಮಕ್ಕಳು. ಚಿ. ಶ್ರೀಧರ್‌ ಹೊರತಾಗಿ ಉಳಿದವರೆಲ್ಲರೂ ಕರ್ನಾಟಕದಲ್ಲಿಯೇ ಇದ್ದಾರೆ. ಸೌ. ಶೈಲಾ ಬಿ.ಎ. ಪದವೀಧರೆ. ತುಂಬಾ ವಾಚಾಳಿ. ಧೈರ್ಯಸ್ಥೆ. ದಕ್ಷತೆ, ತುಂಬಾ ವಾಚಾಳಿ. ಕುಟುಂಬ ನಿರ್ವಹಣೆಯಲ್ಲಿ ತುಂಬಾ ಜಾಣೆ.", "ನಾವು ಅವಳ ವಿವಾಹಕ್ಕೆ ಸಿದ್ಧತೆಯಾಗಿರಲಿಲ್ಲ. ಅವಳ ಬಿ.ಎ. ಪರೀಕ್ಷೆ ಫಲಿತಾಂಶ ಬಂದಿರಲಿಲ್ಲ. ಅವಳ ವಿವಾಹಕ್ಕೆ ಆರ್ಥಿಕವಾಗಿ ಸಿದ್ಧರಿರಲಿಲ್ಲವಾಗಿ ವಿವಾಹದ ಸಿದ್ಧತೆಗಾಗಿ. ಮೂರು ತಿಂಗಳ ಕಾಲಾವಕಾಶ ಕೇಳಿದೆವು. ಇಷ್ಟರಲ್ಲಿಯೇ ನನ್ನ ಅಕ್ಕ ದೈವಾಧೀನಳಾದಳು. ಕಡೆಗೆ ಶೈಲಳ ಭಾಗ್ಯವೆಂಬಂತೆ ತುಂಕೂರಿನಲ್ಲಿದ್ದ ನನ್ನ ಮನೆಯನ್ನು ಕೊಳ್ಳಲು ಸಿದ್ಧರಾಗಿ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಮುಂದೆ ಬಂದರು. ಆ ಮನೆಯನ್ನು ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟು ಸ್‌. ಶೈಲಾ ಮತ್ತು ಶ್ರೀ ಶ್ರೀಧರ್‌ ಅವರ ವಿವಾಹ ದಿನಾಂಕ 26.1.2082 ದುಂಧುಬಿ ಸಂವತ್ಸರ, ಕಾರ್ತಿಕ ಶುಕ್ರ ದಶಮಿ ಶುಕ್ರವಾರ ಮಲ್ಲೇಶ್ವರಂ ಶ್ರೀರಾಮ ಕಲ್ಯಾಣ ಮಂಟಪದಲ್ಲಿ ಬಹಳ ಅದ್ದೂರಿಯಾಗಿ ನಡೆಯಿತು. ಈ ವಿವಾಹದ ಏರ್ಪಾಡನ್ನು ಚಿ. ಜೈರಾಂ ಮುಂದಾಳತ್ವದಲ್ಲಿ ಯಶಸ್ವಿಯಾಗಿ ಸರ್ವ ಸಮ್ಮೃತಿಯಾಗಿ ನೆರವೇರಿತು. ಇದರಿಂದಾಗಿ ನನ್ನ 5 ಹೆಣ್ಣು ಮಕ್ಕಳು ವಿವಾಹಗಳಾಗಿ ನನ್ನ ಜವಾಬ್ದಾರಿ ಕಳೆಯಿತು. ಸೌ. ಶೈಲಾ ರಾಜಾಸ್ಥಾನಕ್ಕೆ ಪ್ರಯಾಣ ಮಾಡಿದ ನಂತರ ಶೇಷಾದ್ರಿಪುರಂನಲ್ಲಿನ ನಮ್ಮ ವಾಸವನ್ನು ಮಲ್ಲೇಶ್ವರಂ ಮನೆಗೆ ಬದಲಾಯಿಸಲಾಯಿತು.", "ಚಿ. ಅಭಿಜಿತ್‌ ಉರುಫ್‌ ರಂಗನಾಥ್‌: ಸೌ. ಶೈಲಾ ಮತ್ತು ಚಿ. ಶ್ರೀಧರ್‌ ಅವರುಗಳ ಮೊದಲನೆಯ ಮಗ. ಪ್ರೈಮರಿ ಶಾಲೆಯಲ್ಲಿ ವ್ಯಾಸಂಗ. ಎಲ್ಲಾ ತರಗತಿಯಲ್ಲಿ ರ್ಯಾಂಕ್‌. ಬುದ್ಧಿವಂತ, ಜಾಣ, ಧೈರ್ಯ ಮಾತ್ರ ಕಮ್ಮಿ ಹಿಂದಿಯಲ್ಲಿ ಚೆನ್ನಾಗಿ ಮಾತನಾಡುತ್ತಾನೆ. ಆದರೆ ಕನ್ನಡ ಬರುವುದಿಲ್ಲ."], ["ಚಿ. ಸಣ್ಣು: 2ನೇ ಮಗ. ಇನ್ನೂ ಈಗ ಒಂದೂವರೆ ವರ್ಷ ವಯಸ್ಸು. ಇಲ್ಲಿಗೆ ನನ್ನ ಹೆಣ್ಣು ಮಕ್ಕಳ ಎಚಾರ ಪೂರ್ತಿಯಾಯಿತು.", "ಗಂಡು ಮಕ್ಕಳ ವಿಚಾರ", "ಚಿ. ಡಾ. ನಾಗರಾಜ್‌ ಮತ್ತು ಸೌ. ಹೇಮ: ಬಾಲ್ಯದಲ್ಲಿ ನನ್ನ ತಂದೆ, ಅಕ್ಕನವರ ಆಶ್ರಯದಲ್ಲಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬೆಳೆದು ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿಯಲ್ಲಿ ಮೊದಲನೇ ದರ್ಜೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾದನು. ಬುದ್ಧಿವಂತ, ಜಾಣ. ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನವರ ಆದೇಶದಲ್ಲಿ. ಬಹಳ ಭಯ ಮತ್ತು ನಿಷ್ಠೆಯಿಂದ ಬೆಳೆದವನು. ದೇವರಲ್ಲಿ, ಹಿರಿಯರಲ್ಲಿ ಭಕ್ತಿ ಮತ್ತು ಶ್ರದ್ಧೆ. ಇದರಿಂದ ಇವನಿಗೆ, ನನ್ನ ಇತರೆ ಗಂಡು ಮಕ್ಕಳಿಗಿರುವ ಧೈರ್ಯ ಸ್ವಲ್ಪ ಕಮ್ಮಿ", "ಇವನಿಗೆ ಎಲೆಕ್ಟ್ರಿಕಲ್‌ ಇಂಜಿನಿಯರಿಂಗ್‌ನಲ್ಲಿ ಹೆಚ್ಚು ಆಸಕ್ತಿ. ನನ್ನ ವೈದ್ಯಕೀಯ ವೃತ್ತಿಯ ಅಭ್ಯಾಸದ ಬಗ್ಗೆ ಸರ್ಕಾರದಿಂದ ಹೊರಡಿಸಬೇಕೆಂದಿದ್ದ ಆದೇಶದ ಬಗ್ಗೆ ಅನಿಶ್ಚಿತತವಾಗಿದ್ದರಿಂದ, ನನ್ನ ವೈದ್ಯಕೀಯ ನೆರವಿಗಾಗಿ, ಇವನನ್ನು 1.41/8ಗೆ ಸೇರಿಸಬೇಕಾಯಿತು. ಮುಂದೆ ಸರ್ಕಾರದ ಆದೇಶವೂ ನನ್ನ ವೃತ್ತಿಗೆ ಅನುಕೂಲವಾಗಿ ಪ್ರಕಟವಾಯಿತು. ನನ್ನ ನಿರೀಕ್ಷೆಯಂತೆ ಇವನು ಖಾಸಗಿಯಾಗಿ ವೈದ್ಯಕೀಯ ವೃತ್ತಿಯನ್ನು ಅವಲಂಬಿಸಿದ್ದರೆ ಅದರಲ್ಲಿ ಅಭಿವೃದ್ಧಿ ಹೊಂದಿರುತ್ತಿರಲಿಲ್ಲ.. ಇವನ ಅದೃಷ್ಟ ಜಚೆನ್ನಾಗಿದ್ದುದ್ದರಿಂದ, ಸರ್ಕಾರದ ವೈದ್ಯಕೀಯ ಇಲಾಖೆಯಲ್ಲಿ ನೌಕರಿ ಸಿಕ್ಕಿದ್ದು ಉತ್ತಮವಾಯಿತು. ಈಗ ಸರ್ಕಾರದಲ್ಲಿ ಗೆಜಿಟೆಡ್‌ ಹುದ್ದೆಯಲ್ಲಿದ್ದು ಹೆಚ್ಚು ವೇತನ ಪಡೆಯುತ್ತಿದ್ದಾನೆ. ವೃತ್ತಿಯಲ್ಲಿ ಹೆಚ್ಚು ಆಸಕ್ತಿ ತೋರಿಸುತ್ತಿಲ್ಲ. ವೈದ್ಯನಾಗಿ ಹೆಚ್ಚು ಜನಾನುರಾಗಿಯಾಗಲಿಲ್ಲ. ಇವನಿಗೆ ಮದುವೆಯಲ್ಲಿ ಆದ ಮೋಸದಿಂದ ಇವನ ಬುದ್ಧಿ ಸ್ವಲ್ಪ ಕುಂಠಿತವಾಗಲು ಕಾರಣವಾಯಿತು. ಆದರೂ ತನ್ನ ಪಾಲಿಗೆ ಬಂದ ಹೆಣ್ಣನ್ನೇ ಒಳ್ಳೆಯದೆಂದು ಭಾವಿಸಿ, ತಕ್ಕ ಚಿಕಿತ್ಸೆಯೊಂದಿಗೆ ಸಂಸಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ. ಇವನ ಪತ್ನಿ ಹೆಚ್ಚು ವಿವೇಕಸ್ಮಳಾಗಿದ್ದರೆ, ಇವನ ಬಾಳು ಇನ್ನೂ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತು ಯಣಾನುಬಂಧವನ್ನು ಯಾರೂ ಮೀರುವುದಕ್ಕಾಗುವುದಿಲ್ಲ. ಇವನು ಹೆಚ್ಚು ಮಿತವ್ಯಯಿ. ಈಚೆಗೆ ಬೆಂಗಳೂರು ಕಮಲಾನಗರದಲ್ಲಿ ಒಂದು ಮನೆಯನ್ನು ಶಕಟ್ಟಿಸಿಕೊಂಡಿದ್ದಾನೆ. ಕಾನೂನಿಗೆ ಬಹಳ ನಿಷ್ಠೆ. ಸಾಲಕ್ಕೆ ಅಂಜುವುದು ಇವನ ಸ್ವಭಾವ. ಬಂಧುಗಳಲ್ಲೂ ಹೆಚ್ಚು ಪ್ರೇಮ. ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನಿಗೆ ಇವನ ಮೇಲೆ ಎಲ್ಲರಿಗಿಂತ ಹೆಚ್ಚು ಅಭಿಮಾನ."], ["ಜೆ. ನಾಗರಾಜನ ಪತ್ನಿ ಮತ್ತು ನನ್ನ ಹಿರಿಯ ಸೊಸೆ ಸೌ. ಹೇಮ ಬಹಳ ಒಳ್ಳೆಯ ಸ್ವಭಾವದವಳು. ಇವಳ ತಂದೆ ತಾಯಿಗಳು ಬಾಲ್ಯದಲ್ಲಿ ತಕ್ಕ ಚಿಕಿತ್ಸೆಯನ್ನಾಗಲಿ, ಬೆಂಗಳೂರಲ್ಲೇ ಇದ್ದ ಅವರು ಇವಳಿಗೆ ತಕ್ಕಷ್ಟು ವಿದ್ಯೆಯನ್ನಾಗಲಿ, ಗೃಹಕೃತ್ಯ ಕೆಲಸಗಳನ್ನಾಗಲಿ ಕಲಿಸದೆ, ಇವಳ ಜೀವನವನ್ನೇ ಹಾಳು ಮಾಡಿದರು. ಇವಳಿಗೆ ಬಾಲ್ಯದಲ್ಲಿ ತಕ್ಕ ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿಸಿದ್ದರೆ ಇವಳು ಬುದ್ಧಿವಂತಳೇ ಆಗುತ್ತಿದ್ದಳು. ಇವಳನ್ನು ಹೆತ್ತಿದ್ದಕ್ಕೆ ಮೋಸದಿಂದ, ಸುಳ್ಳಿನಿಂದ ಇವಳನ್ನು ಬೇರೆಯವರಿಗೆ ಕಟ್ಟ ಕೈ ತೊಳೆದುಕೊಳ್ಳಬೇಕೆಂಬುದೇ ಇವರ ಉದ್ದಿಶ್ಯ. ಹಾಗೇ ಮಾಡಿದರು. ಇವಳಿಗೆ ನಮ್ಮ ಸಂಸಾರದ ಜನಗಳಲ್ಲಿ ಹೆಚ್ಚು ಪ್ರೇಮ. ಇವಳ ತಂದೆ ತಾಯಿಗಳು ಮಾಡಿದ ಮೋಸ ಈಗ ಅರಿವಾಗಿದೆ. ಸರಿಯಾದ ಬಾಲ್ಯದ ವಿದ್ಯಾಭ್ಯಾಸ ಇಲ್ಲದ್ದರಿಂದ ಸ್ವಲ್ಪ ಹಟಮಾರಿತನ, ಮೊಂಡು ಬುದ್ಧಿ. ವಿವೇಕ ಕಮ್ಮಿ ಇವಳು ಸ್ವಲ್ಪ ಬುದ್ಧಿವಂತಳಾಗಿದ್ದರೆ, ಇವಳ ಸಂಸಾರ ಆದರ್ಶವಾಗಿಯೇ ಇರುತ್ತಿತ್ತು. ಈಗ ಗೃಹಕೃತ್ಯ ಕಲಿತುಕೊಂಡಿದ್ದಾಳೆ. ಸ್ವಲ್ಪ ವಿವೇಕ ಕಮ್ಮಿ ಇವಳು ನನ್ನ ಪತ್ನಿ ಬಳಿ ಸ್ವಲ್ಪ ಇರಲು ಅವಕಾಶ ಸಿಕ್ಕಿದ್ದರೆ ಎಲ್ಲಾ ಕಲಿಯಬಹುದಾಗಿತ್ತು. ಆದರೆ ಪರಊರಿನಲ್ಲಿ ವಾಸ ಇದ್ದುದ್ದರಿಂದ ಅದಕ್ಕೆ ಅವಕಾಶವಾಗಲಿಲ್ಲ. ಇವರಿಗೆ ಒಬ್ಬ ಗಂಡು ಮತ್ತು ಒಂದು ಹೆಣ್ಣು ಮಕ್ಕಳು.", "ಚಿ. ಗರುಡಧ್ವಜ ಉರುಫ್‌ ದೀಪು: ಇವನು ಚಿ. ನಾಗರಾಜ ಮತ್ತು ಸೌ. ಹೇಮರ ಪ್ರಥಮ ಪುತ್ರ. ಹಾಗೂ ನನ್ನ ಮೊಮ್ಮಗ. ಇವನು ಎಳೆ ವಯಸ್ಸಿನಲ್ಲಿ ತನ್ನ ತಾಯಿಯ, ತಂದೆ ತಾಯಿಯೊಡನೆ ಇದ್ದು ಬಹಳ ತುಂಟನಾಗಿದ್ದ. ಮುಂದೆ ಅವರೊಡನೆ ಇವನು ಇದ್ದರೆ. ಇವನ ತಾಯಿಯಂತೆಯೇ ಆಗುತ್ತಾನೆ ಎಂದು ತಿಳಿದು, ನನ್ನ ಪತ್ನಿ, ಇವನ ಅಜ್ಜಿ ಸೌ. ಅಲಮೇಲ, ಇವನನ್ನು ನಮ್ಮ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಬಂದು ನರ್ಸರಿಯಿಂಂದಲೇ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಇಟ್ಟುಕೊಂಡು ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಪ್ರಾರಂಭಿಸಿದಳು... ನಮ್ಮ ಮನೆಯ ವಾತಾವರಣದಿಂದ ಹೆಚ್ಚು ಪ್ರಗತಿಯನ್ನು ಹೊಂದಿ ಬುದ್ಧಿವಂತನಾದನು. ಇವನು 7ನೇ ತರಗತಿಯಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದಾಗ ನನ್ನ ಪತ್ನಿ ಸೌ. ಅಲಮೇಲ ಮೃತಳಾದಳೂ. ಹೀಗಾಗಿ ಬೇರೆ ಊರಿನಲ್ಲಿ ಇವನನ್ನು 8ನೇ ತರಗತಿಗೆ ಸೇರಿಸಲಾಯಿತು. ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿಯಲ್ಲಿ ಮೊದಲ ದರ್ಜೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣ ಹೊಂದಿದನು. ನಂತರ ಇವನು ಪಿಯುಸಿಗೆ ಪ್ರವೇಶ ಪಡೆದು ಕಾಲೇಜು ವ್ಯಾಸಂಗಕ್ಕೆ ಅನುವಾದಾಗ, ಮೈಕೋ ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ತರಬೇತಿಗೆ ಚುನಾಯಿಸಲ್ಪಟ್ಟವನಾಗಿ, ಕಾಲೇಜು ವ್ಯಾಸಂಗ ಬಿಟ್ಟು, ಮೈಕೋ ಫ್ಯಾಕ್ಟರಿ ಸೇರಿ: ತರಬೇತಿ ಮುಂದುವರೆಸುತ್ತಿದ್ದಾನೆ. ನನ್ನ ಇಚ್ಛೆ, ಇವನನ್ನು ಇಂಜಿನಿಯರ್‌ ಆಗಿ ಮಾಡಬೇಕೆಂದಿತ್ತು. ಚಿಕ್ಕ ವಯಸ್ಸು ಹೆಚ್ಚು ಓದಿದವರಿಗೆ ಸರ್ಕಾರಿ ಕೆಲಸ ಸಿಕ್ಕುವುದು ಕಷ್ಟ ಎಂಬುದು ಇವನ ತಂದೆಯ ಅಭಿಪ್ರಾಯ. ಎಲ್ಲರೂ"], ["ಕೆಲಸ ಸಿಕ್ಕುವುದೆಂದು ವ್ಯಾಸಂಗ ಮಾಡುವುದಿಲ್ಲ-ವಿದ್ಯಾರ್ಹತೆಗಾಗಿ. ಇದಕ್ಕೆ ದೃಷ್ಟಾಂತ, ಇವನ ತಂದೆಯ ವ್ಯಾಸಂಗವೇ ಸಾಕ್ಷಿ. ಹೆಚ್ಚು ವಿದ್ಯೆಯಿದ್ದರೆ. ಹೇಗಾದರೂ ಆಗುತ್ತೀಯಾ ಎಂಬುದು ನನ್ನ ವೈಯಕ್ತಿಕ ಅಭಿಪ್ರಾಯ. ಜವಾಬ್ದಾರಿ ಹೊತ್ತಿರುವ ಇವನ ತಂದೆ ಅಭಿಪ್ರಾಯಕ್ಕೆ ನಾನು ವಿರೋಧ ವ್ಯಕ್ತ ಪಡಿಸಲಿಲ್ಲ. ಇವನ ಗರ್ಭಿಣಿಯಲ್ಲಿ ಇವನ ತಾಯಿಯ ಅಚಾತುರ್ಯದಿಂದ ಇವನ ಕಣ್ಣಿಗೆ ಸ್ವಲ್ಪ ಅಪಾಯವೇ ಆಯಿತು. ನನ್ನ ಅಕ್ಕನಿಗಂತೂ ಈ ಹುಡುಗನ ಮೇಲೆ ಅಪಾರ ಪ್ರೀತಿಯಿತ್ತು. ಈಗಲೂ ಈ ಹುಡುಗನಿಗೆ ನಮ್ಮ ಮನೆ ಜನಗಳ ಮೇಲೆ ತುಂಬಾ ಪ್ರೇಮ. ಆದರೆ ನನಗೆ ಒಂದು ಕೊರತೆ. ಇವನ ತಂದೆ, ಇವನಿಗೆ ತಕ್ಕ ವಯಸ್ಸು ಮೀರಿದ್ದರೂ ಇವನಿಗೆ ಉಪನಯನ ಮಾಡಲಿಲ್ಲವೆಂಬುದು ಇವನ ಅಜ್ಜಿ ಜೀವಂತವಾಗಿದ್ದಿದ್ದರೆ ಈವರೆಗೆ ಉಪನಯನ ಮಾಡದೆ ಬಿಡುತ್ತಿರಲಿಲ್ಲ. ಆ ಜವಾಬ್ದಾರಿ ನನ್ನಿಂದ ಸಾಧ್ಯವಿಲ್ಲ. ಇವನಿಗೂ ತಂದೆಯಂತೆಯೇ ಎಲೆಕ್ಟಿಕ್‌ನಲ್ಲಿ ತುಂಬಾ ಆಸಕ್ತಿ ಬುದ್ಧಿವಂತ. ಇವನೂ ಕಾಲೇಜು ವಿದ್ಯಾಭ್ಯಾಸ ಮುಂದುವರೆಸಲು ಉತ್ಸುಕನಾಗಲಿಲ್ಲ. ಇವನ ಅಜ್ಜಿ ತೀರಿಕೊಂಡ ನಂತರ ಇವನಿಗೆ ನನ್ನ ಬಳಿ ವಾಸಕ್ಕೆ ಅವಕಾಶವಿರಲಿಲ್ಲ.", "ಸೌ. ಜ್ಯೋತಿ: ಚಿ. ನಾಗರಾಜ ಮತ್ತು ಸೌ. ಹೇಮ ಇವರ ಪುತ್ರಿ. ಬಾಲ್ಯದಲ್ಲಿ ತಂದೆ ತಾಯಿಗಳ ಬಳಿ ಇದ್ದು ಹೈಸ್ಕೂಲು ವ್ಯಾಸಂಗಕ್ಕೆ ಹಳ್ಳಿಯಲ್ಲಿ ಅವಕಾಶಯಿಲ್ಲದೆ ತನ್ನ ಅಜ್ಜಿ (ತಾಯಿಯ ತಾಯಿ) ಬಳಿ ಇದ್ದು ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿ ತೇರ್ಗಡೆಯಾಗಿ. ಈಗ ಪಿಯುಸಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದಾಳೆ. ಇವಳು ತಂದೆ ತಾಯಿ ಬಳಿ ಇದ್ದಿದ್ದ ಪಕ್ಷದಲ್ಲಿ ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿಯಲ್ಲಿ ಉತ್ತಮ ದರ್ಜೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾಗುವ ಸಂದರ್ಭ ಇತ್ತು. ನನ್ನ ಪತ್ನಿಯೇ ಜೀವಂತವಾಗಿದ್ದಿದ್ದಲ್ಲಿ ಈ ಮಕ್ಕಳನ್ನು ಬೇರೆಯವರ ವಶಕ್ಕೆ ಒಪ್ಪಿಸುತ್ತಿರಲಿಲ್ಲ. ಚಿ. ನಾಗರಾಜ, ಸ್ವಲ್ಪ ಪ್ರಯತ್ನ ಪಟ್ಟದ್ದರೆ ಹೈಸ್ಕೂಲ್‌ ಇರುವ ಊರಿಗೇ ವರ್ಗ ಮಾಡಿಸಿಕೊಳ್ಳಬಹುದಿತ್ತು. ಮಕ್ಕಳನ್ನು ಬೇರೆಯವರ ಮನೆಯಲ್ಲಿ ಬಿಟ್ಟು, ಸಾಕಷ್ಟು ಮೊಬಲಗನ್ನು ಖರ್ಚು ಮಾಡಿದರೂ, ಬೇರೆಯವರು ನಾನು ಸಾಕಿದೆ ಎಂದು ಹೇಳುತ್ತಾರೆ. ಇದು ನನ್ನ ಅನುಭವ. ನಾವು ಎಷ್ಟೇ ಮೊಬಲಗು ಖರ್ಚು ಮಾಡಿದರೂ, ಬೇರೆಯವರ ಮನೆಯಲ್ಲಿ ಮಕ್ಕಳಿದ್ದರೆ ಅವರಿಗೂ ಶಾಂತಿ ಇಲ್ಲ. ನಮಗೂ ಶಾಂತಿ ಇಲ್ಲ. ಮಕ್ಕಳು ಬಾಲ್ಯದಲ್ಲಿ ತಂದೆ ತಾಯಿಗಳ ಬಳಿ ಇಲ್ಲದಿದ್ದರೆ, ತಂದೆ ತಾಯಿಗಳಿಗೆ ಜವಾಬ್ದಾರಿ ಇರುವುದಿಲ್ಲ. ಸೌ. ಹೇಮ ಸ್ವಲ್ಪ ಏವೇಕಸ್ಥಳಾಗಿದ್ದಿದ್ದರೆ ಇದಕ್ಕೆ ಅವಕಾಶವಿರುತ್ತಿರಲಿಲ್ಲ. ಸೌ. ಜ್ಯೋತಿ ಬಹಳ ಒಳ್ಳಯೆ ಹುಡುಗಿ. ಬುದ್ಧಿವಂತೆ. ಇವಳ ಅಜ್ಜಿಯ ಮನೆಯಲ್ಲಿ ಸರಿಯಾದ ಶಿಕ್ಷಣ ದೊರೆಯುವುದಿಲ್ಲವೆಂಬುದೇ ನನ್ನ ಚಿಂತೆ. ಇದಕ್ಕೆ ದೃಷ್ಟಾಂತ, ಇವಳ ತಾಯಿ. ಮಕ್ಕಳೊಂದು ಕಡೆ, ತಂದೆತಾಯಿಗಳೊಂದು ಕಡೆ ಇರುವುದು ನನಗೆ ಸಮಾಧಾನವಿಲ್ಲ."], ["ಚಿ. ಸುಪರ್ಣ, ಸೌ. ಪ್ರಭಾ: ಚಿ. ಸುಪರ್ಣ ಪ್ರಾರಂಭದಲ್ಲಿ ಐಟಿಐ ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ನೌಕರಿಯಲ್ಲಿದ್ದು, ನಂತರ ಪೋಸ್ಟಲ್‌ ಇಲಾಖೆಗೆ ಸೇರಿ ಬೆಂಗಳೂರಲ್ಲಿದ್ದ. ಇವನ ಆಶ್ರಯದಿಂದಲೇ ನನ್ನ ಸಂಸಾರ ಬೆಂಗಳೂರಿಗೆ ಬರಲು ಕಾರಣ. ನನ್ನ ಸಂಸಾರಕ್ಕೆ ಮೊದಲು ಚೆನ್ನಾಗಿ ನೆರವು ಆಗುತ್ತಿದ್ದ. ಬುದ್ಧಿವಂತ. ತನ್ನ ಕಷ್ಟ ಸುಖ, ತಾಪತ್ರಯಗಳನ್ನು ಇನ್ನೊಬ್ಬರೊಡನೆ ಹೇಳಿಕೊಳ್ಳುವುದು, ಇನ್ನೊಬ್ಬರ ನೆರವನ್ನು ಅಪೇಕ್ಷಿಸುವುದು ಇವನ ಜಾಯಮಾನದಲ್ಲೇ ಇಲ್ಲ. ತನ್ನ ಪಾಡಿಗೆ ತಾನಿರುವುದು ಇವನ ಸ್ವಭಾವ. ತನ್ನ ಸ್ವಶಕ್ತಿ. ಬುದ್ಧಿಯಿಂದ ಇಲಾಖಾ ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆ ಹೊಂದಿ ಈಗ ಆಫೀಸರ್‌ ಆಗಿ ಪ್ರೊಮೊಷನ್‌ ಪಡೆದಿರುತ್ತಾನೆ. ಇವನ ಅಣ್ಣ ಚಿ. ನಾಗರಾಜನಿಗೆ ವಿವಾಹದಲ್ಲಿ ಆಗ ಮೋಸವನ್ನು ಗ್ರಹಿಸಿ, ತನ್ನ ವಿವಾಹದ ಜವಾಬ್ದಾರಿಯನ್ನು ತಾವೇ ವಹಿಸಿದನು. ನಾವೂ ಸಹ ಇದಕ್ಕೆ ಅನುಮೋದಿಸಿ, ಅವನ ವಿವಾಹದ ವಿಷಯವನ್ನು ನಿರ್ಧರಿಸಲು ಅವನಿಗೇ ಬಿಟ್ಟೆವು. ತನ್ನ ಜವಾಬ್ದಾರಿಯಿಂದ, ತನ್ನ ಖರ್ಚಿನಿಂದ, ನಮ್ಮಗಳ ಅನುಮೋದನೆಯೊಡನೆ ವಿವಾಹವಾದನು. ನಮ್ಮ ಬಂಧುಗಳ ಅನೇಕರ ಪರಿಚಯವೇ ಇವನಿಗಿಲ್ಲ. ಜನಗಳಲ್ಲಿ, ಕಡೆಗೆ ಅಕ್ಕ ತಂಗಿ, ಅಣ್ವ ತಮ್ಮಂದಿರೊಡನೆ ಸಹ ಸಲಿಗೆ ಇಲ್ಲ. ನನಗೆ ಇದೊಂದು ದೊಡ್ಡ ಕೊರಗು. ಇವನೂ ಬೆಂಗಳೂರಲ್ಲಿ ಮನೆಯೊಂದನ್ನು ಕಟ್ಟಕೊಂಡು ಬಾಡಿಗೆಗೆ ಕೊಟ್ಟಿರುವ ವಿಚಾರ ತಿಳಿದಿದೆ. ಅವನು ನನ್ನ ಬಳಿ ಹೇಳಿಲ್ಲ. ಮನೆಯನ್ನು ನೋಡಿಯೂ ಇಲ್ಲ. ವಾರಕ್ಕೆ ಒಂದು ಸಾರಿ ನನ್ನ ಬಳಿ ಬಂದು ಆರೋಗ್ಯ ವಿಚಾರಿಸಿಕೊಂಡು ಹೋಗುತ್ತಿದ್ದಾನೆ. ಮದುವೆ ಆದ ನಂತರ ಪತ್ನಿಯೊಡನೆ ಕೆಲವು. ಕಾಲ ನಮ್ಮ ಮನೆಯಲ್ಲಿಯೇ ವಾಸ ಇದ್ದನು. ನಂತರ, ನನಗೆ ಹೇಳಿ, ನನ್ನ ಅನುಮೋದನೆಯೊಡನೆ ಬೇರೆ ವಾಸಕ್ಕೆ ಯಾವುದೇ ಮನಸ್ತಾಪ ಇಲ್ಲದೆ ಬೇರೆ ಮನೆಗೆ ಹೋದನು.", "ಸೌ. ಪ್ರಭಾ: ನಂಜನಗೂಡು ದಿವಂಗತ ಟಿ. ನರಸಿಂಹ ಅಯ್ಯಂಗಾರ್‌ರವರ 2ನೇ ಮಗಳು. ಬಿ.ಎ. ಪದವೀಧರೆ. ಟೈಲರಿಂಗ್‌ ಚೆನ್ನಾಗಿ ಬರುತ್ತದೆ. ಈ ಆದಾಯದಿಂದ ಚಿ. ಸುಪರ್ಣನ ಗೃಹಕೃತ್ಯಕ್ಕೆ ಸ್ವಲ್ಪ ನೆರವು ಸಿಕ್ಕುತ್ತದೆ ಎಂದು ತಿಳಿದಿದೆ. ಒಳ್ಳೆ ವಂಶಸ್ಥರು. ಸೌ. ಪ್ರಭಾ ಸಹ, ಚಿ. ಸುಪರ್ಣರಂತೆಯೇ, ನಮ್ಮ ಬಂಧುಗಳ ಪರಿಚಯ ಕಮ್ಮಿ ನಡವಳಿಕೆಯೂ ಇಲ್ಲ. ತನ್ನ ಅತ್ತೆ (ಸೌ. ಅಲಮೇಲಳ) ವರ್ಷಾಬ್ಬಿಕ ದಿನ ಬಂದು, ಆತ್ಮಕ್ಕೆ ಶಾಂತಿ ಕೋರುವುದಷ್ಟೆ ತನ್ನ ಕರ್ತವ್ಯ ಎಂದು ತಿಳಿದುಕೊಂಡಿಲ್ಲ. ಊರಿನಲ್ಲಿಯೇ ಆರೋಗ್ಯದಿಂದುದ್ದರೂ ಬರಲಿಲ್ಲ. ಇದಕ್ಕೆ ಬೇಜಾರಾಗಿ, ನಾನು ಈ ವಿಚಾರ ಪಸ್ತಾಪಿಸಲಿಲ್ಲ. ಇದು ಇವಳ ಕರ್ತವ್ಯ ಲೋಪ ಖಂಡಿತ. ತನ್ನ ಅತ್ತೆ ಸೌ. ಅಲಮೇಲ ಜೀವಂತಳಾಗಿರುವವರೆಗೆ ಆಗಾಗ್ಗೆ ಮನೆಗೆ ಬರುತ್ತಿದ್ದಳು. ನನ್ನ ಪತ್ನಿ ಮೃತಳಾದ ಮೇಲಾದರೂ ನನ್ನ ಕಷ್ಟ ಸುಖಗಳನ್ನು ಬಂದು ವಿಚಾರಿಸುತ್ತಿರಲಿಲ್ಲ."], ["ಬಹುಶಃ ಇವಳ ಮದುವೆಗೆ ಚಿ. ಸುಪರ್ಣನಿಗೆ ಅವಳ ತಂದೆ 10,000/- ರೂಗಳನ್ನು, ಚಿ. ಸುಪರ್ಣ ಕೇಳಿಕೆಯಂತೆ ಅವನಿಗೆ ಕೊಟ್ಟಿದ್ದರು. ಇದರಿಂದಾಗಿ. ನನ್ನ ಮನೆಯಿಂದ ಅವನನ್ನು ಕೊಂಡು ಕೊಂಡಿರುವುದಾಗಿ ಭಾವಿಸಿರಬಹುದೆಂಂದು ನನ್ನ ಭಾವನೆ. ಕಾರಣಗಳೇನಾದರೂ ಇದ್ದಲ್ಲಿ, ದೊಡ್ಡವನಾದ ನಾನು ಸಂಸಾರದಲ್ಲಿ ಜೀವಂತವಾಗಿರುವಾಗ ನನಗೆ ತಿಳಿಸಬಹುದಿತ್ತು. ಯಾವ ವಿಚಾರವನ್ನು ನನ್ನ ಬಳಿ ಪ್ರಸ್ತಾಪಿಸಿಲ್ಲ. ನನ್ನ ಮಗ ಮತ್ತು ಸೊಸೆ ಎಂದು ಹೇಳಿಕೊಳ್ಳುವುದಕ್ಕೆ ಸಂದೇಹವಾಗಿದೆ. ಯಾವುದೇ ವಿಚಾರದಲ್ಲಿ ಕಲಹಗಳೇನೂ ನಡೆದಿಲ್ಲ. ಇವಳಿಗೆ, ನನ್ನ ಹೆಣ್ಣು ಮಕ್ಕಳೊಡನೆ ಸಹ ಸಂಪರ್ಕವಿಲ್ಲ. ನನ್ನ 4ನೇ ಮಗಳು ಸೌ. ನಳಿನಿ ವಿವಾಹವಾದಾಗ, ಅವಳನ್ನೂ, ಅವಳ ಪತಿಯನ್ನು ಔತಣಕ್ಕೆ ತನ್ನ ಮನೆಗೆ ಆಹ್ವಾನಿಸಿ, ಆ ದಿನ ಅವರು ಬಂದಾಗ್ಗೆ, ಮನೆಯಲ್ಲಿರದೆ, ಬೀಗ ಹಾಕಿಕೊಂಡು ಹೋಗಿದ್ದು ಕ್ಷಮಿಸಲಾಗದು. ಈ ಸಂಸಾರದ ಸಂಪರ್ಕವೇ ಇಲ್ಲದಿರುವ ನಾನು, ಈ ಬಗ್ಗೆ ಹೆಚ್ಚು ಪ್ರಸ್ತಾಪಿಸುವುದಿಲ್ಲ. ಇದರಲ್ಲಿ ನನ್ನ ಮಗ ಜಿ. ಸುಪರ್ಣನ ತಪ್ಪೋ ಅಥವಾ ನನ್ನ ಸೊಸೆ ಸೌ. ಪ್ರಭಾಳ ತಪ್ಪೋ ಅಥವಾ ಇಬ್ಬರದ್ದು ತಪ್ಪೋ ಹೇಳಲು ಸಾಧ್ಯವಿಲ್ಲ.  ಒಟ್ಟನಲ್ಲಿ ಈ ಸಂಸಾರ ತಮ್ಮ ಪಾಡಿಗೆ ತಾವು ಸುಖವಾಗಿರುವುದಕ್ಕೆ ಸಂತೋಷಪಡುತ್ತೇನೆ.", "ಚಿ. ಆದರ್ಶ ಉರುಫ್‌ ಮಧುಸೂದನ: ಚಿ. ಸುಪರ್ಣ ಮತ್ತು ಸೌ. ಪ್ರಭಾ ಇವರ ಹಿರಿಯ ಮಗ. ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿ ತೇರ್ಗಡೆಯಾಗಿ ಪಿಯುಸಿ ಓದುತ್ತಿರುವನೆಂದು ತಿಳಿದಿದೆ. ಇವನನ್ನು ನೋಡಿ ಎಷ್ಟೋ ವರ್ಷಗಳೇ ಆಯಿತು. ಎದುರಿಗೆ ಬಂದರೂ ಗುರುತು ಸಿಕ್ಕುವುದಿಲ್ಲ. ನನ್ನ ಮೊಮ್ಮಗ ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿ ತೇರ್ಗಡೆಯಾದಾಗ ಬಂದು ಹೇಳಿದನು. ಸಂತೋಷಪಟ್ಟೆನು.", "ಚಿ. ಅಭಿಷೇಕ್‌: ಚಿ. ಸುಪರ್ಣ ಮತ್ತು ಸೌ. ಪ್ರಭಾ ಎರಡನೇ ಮಗ. ಮೊದಲನೇ ಮಗು ಹುಟ್ಟ 12 ವರ್ಷಗಳ ನಂತರ 2ನೇ ಮಗನ ಜನನ. ತಂದೆಯ ಜೊಗೆ ಆಗಾಗ್ಗೆ ಮನೆಗೆ ಬಂದು ನನ್ನನ್ನು ನೋಡಿಕೊಂಡು ಹೋಗುತ್ತಾನೆ. ನೋಡಿದ್ದರಲ್ಲಿ ಬುದ್ಧಿವಂತನ ಹಾಗೆ ಕಾಣುತ್ತಾನೆ.", "ಜೆ. ಸುಪರ್ಣನ ಸಂಸಾರ, ನನಗಾಗಲಿ, ನನ್ನ ಮಕ್ಕಳಿಗಾಗಲಿ ತಿಳಿದಿಲ್ಲ. ದೇವರು ಇವರಿಗೆ ಒಳ್ಳೆ ಬುದ್ಧಿ ಆರೋಗ್ಯ ಕೊಟ್ಟು ಕಾಪಾಡಲೆಂದು ಕೋರಿ ಆಶೀರ್ವದಿಸುತ್ತೇನೆ. ಚಿ. ಜೈರಾಂನ ವಿವಾಹಕ್ಕೆ ಮಗ, ಸೊಸೆ ಬಂದಿದ್ದರು. ಆಗ ತೆಗೆದಿರುವ ಫೋಟೊ ಮನೆಯಲ್ಲಿದೆ. ಆಗಾಗ್ಗೆ ಫೋಟೋದಲ್ಲಿ ನೋಡುತ್ತೇನೆ."], ["ಮಕ್ಕಳ ನಾಮಕರಣಕ್ಕಾಗಲಿ, ಚೌಲಕ್ಕಾಗಲಿ ನನ್ನನ್ನು ಪ್ರಸ್ತಾಪಿಸಿಲ್ಲ. ಆಹ್ವಾನಿಸಿಲ್ಲ. ಮಗನಾದರೂ ತಂದೆ ತಾಯಿ ಇರುವುದನ್ನು ಗಮನಿಸಬಹುದಿತ್ತು.", "ಚಿ. ಜೈರಾಂ ಮತ್ತು ಸೌ. ಜಯಲಕ್ಷ್ಮಿ: ಚಿ. ಜೈರಾಂ ನನ್ನ ತೃತೀಯ ಪುತ್ರ. ಕೆಇಬಿ, ಬೆಂಗಳೂರಿನಲ್ಲಿ ನೌಕರಿಯಲ್ಲಿದ್ದಾನೆ. ಬಹಳ ಉದಾರಿ. ಅತಿಥಿಗಳನ್ನು ಸತ್ಕರಿಸುವುದರಲ್ಲಿ ತುಂಬಾ ಆಸಕ್ತಿ. ತಂದೆ ತಾಯಿ, ಅಕ್ಕ ತಂಗಿಯರು, ಅಣ್ಣ ತಮ್ಮಂದಿರು ಮತ್ತು ಬಂಧುಗಳಲ್ಲಿ ಅಪಾರ ಪ್ರೇಮ. ಧಾರಾಳಿ. ಹಬ್ಬ ಹರಿದಿನಗಳಲ್ಲಿ ಮಿತಿಮೀರಿ ಖರ್ಚು ಮಾಡುವುದು ಇವನ ಸ್ವಭಾವ. ಈಗಲೂ ನನ್ನ ಪತ್ನಿ, ದಿವಂಗತಳಾದ ನಂತರ, ಅಕ್ಕ ತಂಗಿಯರು, ಅಣ್ಣ ತಮ್ಮಂದಿರು ಮತ್ತು ಬಂಧುಗಳು ಇವನ ಮನೆಗೆ ಬರುತ್ತಾರೆ. ಇವನ ಮನೆಯನ್ನು ಅಮ್ಮಾ ಮನೆ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ. ಸೌ. ಶೈಲಾ ವಿವಾಹವನ್ನು ಇವನೇ ಮುಂದಾಳತ್ವವಹಿಸಿ ಬಹಳ ಅದ್ಧೂರಿಯಿಂದ ನಿರ್ವಹಿಸಿದನು. ತನ್ನ ತಾಯಿಯ ಮೃತ ಕರ್ಮದಿನಗಳ ಕಾರ್ಯಕ್ಕೆ ಇವನೇ ಮುಂದಾಗಿ 20,000/- ರೂಗಳ ಖರ್ಜಿನಿಮದ ಮಾಡಿದನು. ಇವನ ಇತರ ಸಹೋದರರೂ ಈ ಖರ್ಚಿನಲ್ಲಿ ಪಾಲುದಾರರಾಗಿದ್ದರು.", "ಕೆಇಬಿಯಲ್ಲಿ ಸಾಮಾನ್ಯ ದರ್ಜೆ ಅಧಿಕಾರದಲ್ಲಿದ್ದರೂ, ದಕ್ಷತೆಯುಳ್ಳವನಾಗಿದ್ದಾನೆ. ಹಿರಿಯ ಅಧಿಕಾರಿಗಳ ಸ್ನೇಹ, ಪ್ರೀತಿಗಳಿಸಿಕೊಂಂಡು ಇಲಾಖೆಯಲ್ಲಿ ಅನೇಕ ನೌಕರರಿಗೆ ಸೂಕ್ತ ಸಹಾಯ ಮಾಡುತ್ತಿದ್ದಾನೆ. ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲೇ ಭಾರತ ಪ್ರವಾಸ ಕೈಗೊಂಡು ಎಲ್ಲಾ ಭಾರತದ ಸ್ಥಳಗಳ ಪರಿಚಯ ಚೆನ್ನಾಗಿ ಗೊತ್ತಿದೆ. ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ತುಂಬಾ ಕಷ್ಟ ಅನುಭವಿಸಿರುವುದರಿಂದ ಎಲ್ಲರ ಬಗ್ಗೆ ತುಂಬಾ ಅನುಕಂಪವಿದೆ. ಕಷ್ಟ ತೊಂದರೆಗಳಿರುವ ಯಾರನ್ನೇ ಆಗಲಿ, ತಕ್ಕ ಸಹಾಯ ಮಾಡುವುದು ಇವನ ಸ್ವಭಾವ. ಹಿಂದಿ ಭಾಷೆಯ ಪರಿಚಯ ಚೆನ್ನಾಗಿದೆ. ಇವನ ತಾಯಿ ಜೀವಂಂತಳಾಗಿದ್ದ ಕಾಲದಲ್ಲಿ. ಇವನಿಗೆ ವಿವಾಹಕ್ಕೆ ತಕ್ಕ ವಯಸ್ಸಾಗ್ಗಿದ್ದಾಗ, ವಿವಾಹಕ್ಕೆ ಅನೇಕ ಕನ್ಕಾಗಳೂ ಬಂದಿದ್ದರೂ ವಿವಾಹವಾಗಲು ಒಪ್ಪಲಿಲ್ಲ... ಕಾರಣ ಇವನು ವಿವಾಹವಾದ ಹೆಣ್ಣು ತನ್ನ ತಂದೆ. ತಾಯಿಗಳನ್ನು ಸರಿಯಾಗಿ ನೋಡಿಕೊಳ್ಳುತ್ತಾಳೋ ಇಲ್ಲವೋ ಎಂಬ ಶಂಕೆಯಿಂದ ತನಗೆ ವಿವಾಹವೇ ಬೇಡ ಎಂದು ಹೇಳುತ್ತಾ. ತಾಯಿ ಬದುಕಿರುವವರೆಗೂ ವಿವಾಹ ಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ. ತಾಯಿ ಬದುಕಿದ್ದಾಗ, ಇವನು ವಿವಾಹವಾಗಿದ್ದರೆ ತಕ್ಕ ಸಹಾಯದಿಂದ ತಾಯಿ ಇನ್ನೂ ಸ್ವಲ್ಪ ಕಾಲ ಬದುಕಿರುತ್ತಿದ್ದಳೋ ಏನೋ. ವಿವಾಹದ ಮಾತೆತ್ತಿದರೆ, ಈಗಾಗಲೇ ನಿನಗೆ 2 ಜನ ಸೊಸೆಯಂದಿರು ಬಂದಿದ್ದಾರೆ, ಅವರಿಂದ ನಿನಗಾಗುತ್ತಿರುವ ಉಪಕಾರವೇನು? ನಾನು ವಿವಾಹ ಮಾಡಿಕೊಂಡರೂ ಅಷ್ಟೇ ಎಂದು ಅವನ ತಾಯಿಗೆ ಹೇಳುತ್ತಿದ್ದ. ತಾಯಿಯ"], ["ಮರಣಾನಂತರ ಊಟ ವಗೈರೆಗಳಿಗೆ ಎಲ್ಲರೂ ಆಹ್ವಾನಿಸಿದರೂ, ಎಲ್ಲಿಗೂ ಹೋಗದೆ, ದೇಹಕ್ಕೆ ಸ್ವಲ್ಪ ಅನಾರೋಗ್ಯವನ್ನು ತಂದುಕೊಂಡನು. ಇತರ ಎಲ್ಲಾ ವಿಚಾರಗಳಲ್ಲಿ ಧೈರ್ಯಸ್ಥನಾಗಿದ್ದರೂ, ನನಗೆ ಅಥವಾ ಇತರೆಯವರಿಗೆ ಖಾಯಿಲೆಯಾದರೆ ತುಂಬಾ ಅಧೈರ್ಯಸ್ಥ. ತಾಯಿಯ ಮರಣದ ನಂತರ ಹಾಸನದಲ್ಲಿರುವ ಇವನ ಹಿರಿಯ ಅಕ್ಕ ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿ ಕನ್ಯಾವನ್ನು ನೋಡಿ ಇನವ ವಿವಾಹಕ್ಕೆ ನೆರವಾದಳು. ತಾ. 11.5.1986, ಅಕ್ಷಯ ನಾಮ ಸಂವತ್ಸರದ, ವೈಶಾಖ ಶುದ್ಧ ಪದಿಗೆ, ಭಾನುವಾರ, ಸೌ. ಜಯಲಕ್ಷ್ಮಿಯೊಡನೆ ಇವನ ವಿವಾಹ ಹಾಸನದಲ್ಲಿ ನಡೆಯಿತು. ವಿವಾಹಕ್ಕಾಗಿ ಇವನು ಯಾರಿಂದಲೂ ಆರ್ಥಿಕ ಸಹಾಯ ಪಡೆಯಲಿಲ್ಲ. ಇವನ ವಿವಾಹಕ್ಕೆ ಎಲ್ಲಾ ಅಣ್ಣ ತಮ್ಮಂದಿರೂ, ಅಕ್ಕ ತಂಗಿಯರೂ, ಭಾವ, ಅತ್ತಿಗೆ ಮತ್ತು ಮಕ್ಕಳು ಬಂದಿದ್ದರು. ಈ ಗ್ರೂಫ್‌ ಫೋಟೊ ಮನೆಯಲ್ಲಿದೆ. ಇವನ ವಿವಾಹ ಸಂದರ್ಭದಲ್ಲಿ ನನ್ನ ಸೂಕ್ತ ಸಲಹೆಯನ್ನು ನಿರಾಕರಿಸಿದನು. ನಾನು ಈಗ ವಾಸಿಸುತ್ತಿರುವುದು ಇವನ ಆಶ್ರಯದಲ್ಲಿ. ನನ್ನ ಬಗ್ಗೆ ಇವನಿಗೆ ಅಪಾರ ಪ್ರೇಮ. ಸಾಕಷ್ಟು ಸಂಬಳ ಬರುತ್ತಿದೆ. ಇಲಾಖಾ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣತೆ ಹೊಂದಲು ಪ್ರಯತ್ನ ಪಟ್ಟಿದ್ದರೆ, ಇಲಾಖೆಯಲ್ಲಿ ಇನ್ನೂ ಉತ್ತಮ ದರ್ಜೆಗೆ ಏರಬಹುದಿತ್ತು. ಏಕೋ ಪ್ರಯತ್ನ ಪಡಲಿಲ್ಲ. ಆಸಕ್ತಿಯೂ ಇಲ್ಲ.", "ಸೌ. ಜಯಲಕ್ಷ್ಮಿ: ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿ ಪಾಸಾಗಿದೆ. ಟಿಸಿಎಚ್‌ ಸಹ ಪಾಸಾಗಿದೆ. ವಿವಾಹಕ್ಕೆ ಮುನ್ನ ಶಿಕ್ಷಕಿಯಾಗಿದ್ದಳು. ಚಿ. ಜೈರಾಂನ ಆದೇಶದಂತೆ ಶಿಕ್ಷಕಿಯ ಕೆಲಸಕ್ಕೆ ರಾಜೀನಾಮೆ ಕೊಟ್ಟಳು. ಬಹಳ ಒಳ್ಳೇ ಹುಡುಗಿ. ಸ್ವಲ್ಪ ನಿಧಾನ ಪ್ರವೃತ್ತಿ. ಹೊರಗಿನ ವ್ಯವಹಾರಗಳಲ್ಲಿ ಅನುಭವ ಸ್ವಲ್ಪ ಕಮ್ಮಿ ಈಗೀಗ ಅನುಭವವಾಗುತ್ತದೆ. ಇವಳ ತಂದೆ. ತಾಯಿಗಳು ಬೇಲೂರು ಸ್ಥಳದವರು. ತಂದೆ. ಪೊಲೀಸ್‌ ಇಲಾಖೆಯಲ್ಲಿ, ತಾಯಿ ವಿದ್ಯಾ ಇಲಾಖೆಯಲ್ಲಿ ನೌಕರಿಯಲ್ಲಿದ್ದು ವಿಶ್ರಾಂತರಾಗಿದ್ದಾರೆ. ಒಬ್ಬ ಅಕ್ಕ ಮತ್ತು ಮೂರು ಜನ ಸಹೋದರರು ಇದ್ದಾರೆ. ಇವರೆಲ್ಲಾ ಈಗ ಬೆಂಗಳೂರಿನಲ್ಲೇ ವಾಸವಾಗಿದ್ದಾರೆ. ಈಗೀಗ ನಮ್ಮ ಮನೆ ಪದ್ಧತಿಗಳು ಅನುಭವವಾಗುತ್ತಿದೆ. ಸ್‌. ಅಲಮೇಲ ಜೀವಂತವಾಗಿದ್ದ ಕಾಲದಲ್ಲಿ ಸೊಸೆಯಾಗಿ ಬಂದಿದ್ದರೆ ಇನ್ನೂ ಸ್ವಲ್ಪ ಹೆಚ್ಚು ಅನುಭವ ಬರುತ್ತಿತ್ತು ಸೌ. ಅಲಮೇಲಳ ಮಾಂಗಲ್ಯ ಇವಳಿಗೆ ಲಭ್ಯವಾಗುವ ಪುಣ್ಯ ಇತ್ತೆಂದು ಕಾಣುತ್ತೆ. ಇವಳ ವಿವಾಹವನ್ನು ತಂದೆ, ತಾಯಿಗಳು ಚೆನ್ನಾಗಿಯೇ ಮಾಡಿಕೊಟ್ಟರು. ಎದುರು ಮನೆಯಲ್ಲಿ ಇನ್ನೊಬ್ಬ ಜಯಲಕ್ಷ್ಮಿ ಇರುವುದರಿಂದ, ಇವಳಿಗೆ ಲಕ್ಷ್ಮಿ ಎಂದು ನಾಮಕರಣ ಮಾಡಿದ್ದೇವೆ. ಇವಳ ನಿಧಾನ ಪ್ರವೃತ್ತಿ, ಅಡಿಗೆ ರುಚಿಯಿಂದ ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನವರನ್ನು ಹೋಲುತ್ತಾ, ಅವಳ ಜ್ಞಾಪಕ ನನಗೆ ಬರುತ್ತಿದೆ. ನನ್ನನ್ನು ಮಾತ್ರ ಯಾವುದೇ ರೀತಿಯ ಲೋಪವಾಗದಂತೆ"], ["ನೋಡಿಕೊಳ್ಳುತ್ತಿರುತ್ತಾಳೆ. ಹುಟ್ಟಿದ ಮನೆ ಮತ್ತು ಸೇರಿದ ಮನೆಗಳನ್ನು ಏಕರೀತಿಯಲ್ಲಿ ನೋಡಿಕೊಳ್ಳುವುದು ಸರಿಯಾದ ಮಾರ್ಗ. ಇವರಿಗೆ ಸಂತಾನ ಪ್ರಾಪ್ತಿಯಾಗಿಲ್ಲದಿರುವ ಕೊರತೆ ಇದೆ. ದೈವ ಯತ್ನ.", "ಚಿ. ಶ್ರೀಧರ ಮತ್ತು ಸೌ. ಶ್ರೀದೇವಿ: ಚಿ. ಶ್ರೀಧರ ಧೈರ್ಯಶಾಲಿ. ಹೆಚ್ಚು ಕಷ್ಟ ಅನುಭವ ಪಡೆದಿರುವವನು. ವ್ಯವಹಾರದಲ್ಲಿ ತುಂಬಾ ದಕ್ಷ. ಅನುಭವಿ. ಪತ್ರಿಕೋದ್ಯಮದಲ್ಲಿ ತುಂಬಾ ಪರಿಶ್ರಮ. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ವಿದ್ಯೆ ಕಮ್ಮಿ ಇದ್ದರೂ ತುಂಬಾ ಬುದ್ಧಿವಂತ. ಆದರೆ ಅದೃಷ್ಟ ಕೋಟ. ಈಗೀಗ ತನ್ನ ತಪ್ಪಿ ಅರಿವಾಗಿ ಪಶ್ಚಾತಾಪ ಪಡುತಿದ್ದಾನೆ. ಎಷೇ ಕಷಗಳು ಬಂದರೂ, ಅಣ್ಣ ತಮಂದಿರಿಗಾಗಲಿ, ಅಕ್ಷ ಖು ಜ.೨ ಂ ೮೪ಂ ಕ 0 ಣ ಅ್ರ ಸ ತಂಗಿಯರಿಗಾಗಲಿ ಹೇಳುವುದಿಲ್ಲ. ಇವನು ಸರಿಯಾದ ನೆಲೆ ಇಲ್ಲದವನಾದ್ದರಿಂಂದ ಇವನ ವಿವಾಹಕ್ಕೆ ಏರ್ಪಾಡು ಮಾಡಲಿಲ್ಲ. ತಾನೇ ಒಪ್ಪಿ ವಿವಾಹ ಮಾಡಿಕೊಂಡಿದ್ದಾನೆ. ವಿವಾಹದ ನಂತರ ಇವನ ಅಕ್ಕ ತಂಗಿಯರು ಮತ್ತು ನಾನು ಆರ್ಥಿಕ ರೂಪವಾಗಿ ಸ್ವಲ್ಪ ಸಹಾಯ ಮಾಡಿದ್ದಾಯಿತು. ಇವನ ಸಂಸಾರಕ್ಕೆ ಸೂಕ್ತ ಸಂದರ್ಭದಲ್ಲಿ ಇವನ ಅಣ್ಣ ತಮ್ಮಂದಿರಿಂದ ಇವನ ಸಂಸಾರಕ್ಕೆ ಸಹಾಯ ಲಭ್ಯವಾದರೆ ಉತ್ತಮ. ಎಷ್ಟೇ ಕಷ್ಟ ಬಂದರೂ ಯಾರಿಗೂ ಹೇಳಿಕೊಳ್ಳುವುದಾಗಲಿ, ಯಾಚಿಸುವುದೇ ಆಗಲಿ ಇವನ ಸ್ವಭಾವದಲ್ಲಿ ಇಲ್ಲ. ದೇವರು ಇವನನ್ನು ಕಾಪಾಡಬೇಕು. ಚಿ. ಜೈರಾಂಂನಿಗೆ ಇವನ ಬಗ್ಗೆ ಹೆಚ್ಚು ಅನುಕಂಪ ಇದೆ.", "ಸೌ. ಶ್ರೀದೇವಿ: ಇವಳ ಬಗ್ಗೆ ನನಗೆ ಹೆಚ್ಚು ಪರಿಚಯ ಇಲ್ಲ. ವೀಕ್ಷಿಸಿದಾಗ, ಒಳ್ಳೆ ಸ್ವಭಾವದವಳಾಗಿ ಕಾಣುತ್ತಾಳೆ. ಇವರ ವಿವಾಹ ಬೆಂಗಳೂರು ರಾಜಾಜಿನಗರದ ಶ್ರೀ ಶ್ರೀನಿವಾಸರ ದೇವಸ್ಥಾನದಲ್ಲಿ ನಡೆಯಿತು. ವಿವಾಹಕ್ಕೆ ಜಿ. ಜೈರಾಂ, ಸೌ. ಲಕ್ಷ್ಮಿ ಮತ್ತು ಸೌ. ಚೇಚಮ್ಮ ಹೋಗಿದ್ದರು. ಸೌ. ಅಲಮೇಲ ಧರಿಸುತ್ತಿದ್ದ ಓಲೆಯನ್ನು ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿ ಕ್ರಯಕ್ಕೆ ತೆಗೆದುಕೊಂಡಿದ್ದನ್ನು, ಇವಳಿಗೆ ಸದರಿ ಓಲೆಯನ್ನು ಕೊಟ್ಟಳು. ಸೌ. ಅಲಮೇಲು ಧರಿಸುತ್ತಿದ್ದ ಓಲೆ ಇವಳಿಗೆ ಲಭ್ಯವಾಯಿತು. ಇವರ ಸಂಸಾರಕ್ಕೆ ದೇವರೇ ನೆರವಾಗಬೇಕು. ಇವನ ಬಗ್ಗೆ ಇವನ ತಾಯಿಗೆ ಕಡೆಯವರೆಗೆ ತುಂಬಾ ಕೊರಗು ಇತ್ತು.", "ಚಿ. ಮೋಹನ್‌ರಾಂ (ರಮೇಶ) ಮತ್ತು ಸೌ. ರತ್ನ: ನನ್ನ 5ನೇ ಮಗನಾದ ಚಿ. ರಮೇಶ ಬಿ.ಎಸ್ಸಿ", "ಪದವಿಯ ನಂತರ ಬಿಇಎಂಎಲ್‌ ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ನೌಕರಿಯಲ್ಲಿದ್ದುಕೊಂಡು, ತನ್ನ ಮುಂದಿನ ವ್ಯಾಸಂಗವನ್ನು ಮುಂದುವರೆಸಿ, ಪತ್ರಿಕೋದ್ಯಮದಲ್ಲಿ ಮಾಸ್ಟರ್‌ ಪದವಿಗಳಿಸಿದ ನಂತರ ಗುಲ್ಬರ್ಗ ಆಕಾಶವಾಣಿ ನಿಲಯಕ್ಕೆ ಪ್ರೋಗ್ರಾಂ ಎಕ್ಸಿಕ್ಯೂಟಿವ್‌ ಕೆಲಸಕ್ಕೆ ನೇಮಕಗೊಂಡು ಬಿಇಎಂಎಲ್‌ ಕೆಲಸಕ್ಕೆ ರಾಜೀನಾಮೆ ಸಲ್ಲಿಸಿದನು. ಗುಲ್ಬರ್ಗ ಆಕಾಶವಾಣಿಯಿಂದ ದೆಹಲಿ ಟವಿ ಕೇಂದ್ರಕ್ಕೆ ವರ್ಗಾಯಿಸಲ್ಪಟ್ಟು"], ["ನಂತರ ಬೆಂಗಳೂರು ಟವಿ ಕೇಂದ್ರದ ಉದ್ಭಾಟನೆಗೆ ಕಾರಣವಾದನು. ನಂತರ ಕೆಲವು ದಿನ ಮದ್ರಾಸ್‌ ಟಿವಿ ಕೇಂದ್ರಕ್ಕೆ ವರ್ಗವಾಗಿ ಪುನಃ ಬೆಂಗಳೂರು ಕೇಂದ್ರದಲ್ಲಿ ನೌಕರಿಯಲ್ಲಿದ್ದಾನೆ. ಇವನು ಕಮ್ಯುನಿಸ್ಟ್‌ರ ಸಹವಾಸದಲ್ಲಿದ್ದು, ದೇವರು, ಆಚಾರ, ಧರ್ಮಗಳಲ್ಲಿ ನಂಬಿಕೆ ಕಡಿಮೆ. ಒಳ್ಳೆಯ ವಿದ್ಯಾವಂತರ ಸಹವಾಸ ಇದೆ. ಬಂಧುಗಳ ಪರಿಚಯವೇ ಇವನಿಗಿಲ್ಲ. ಸ್ವಲ್ಪ ಖಂಡಿತವಾದಿ. ಇದರಿಂದ ಕೆಲವರಿಂದ ಸ್ವಲ್ಪ ನಿಷ್ಠೂರ ಇವನಿಗೆ. ಅಣ್ಣಂದಿರು, ಅಕ್ಕ ತಂಗಿಯರಲ್ಲಿ ವಿಶ್ವಾಸ ಹೆಚ್ಚಾಗಿದ್ದರೂ ಹೊರಗಡೆ ತೋರಿಸಿಕೊಳ್ಳುವುದಿಲ್ಲ.", "ಇವನಿಗೆ ವಿವಾಹಕ್ಕೆ ಅನೇಕ ಶ್ರೀಮಂತರು ಮುಂದೆ ಬಂದಿದ್ದರು. ಎಲ್ಲವನ್ನೂ ತ್ಯಜಿಸಿ, ಏನೂ ಅಪೇಕ್ಷೆ ಪಡದೆ, ತನಗೆ ಇಷ್ಟವಾದ ಹೆಣ್ಣನ್ನು ಮದುವೆ ಮಾಡಿಕೊಂಡನು. ತನ್ನ ತಂಗಿ ಸೌ ಶೈಲಾಳ ವಿವಾಹವಾಗುವವರೆಗೆ ನಿರೀಕ್ಷಿಸಿದ ನಂತರ, ಗುಲ್ಬರ್ಗದಲ್ಲಿ ಒಳ್ಳೆಯ ಸಂಸಾರಬದ್ಧರಾದ ಮನೆಯಲ್ಲಿ ಹೆಣ್ಣನ್ನು ಲಗ್ನವಾಗುವುದಾಗಿಯೂ ಇದಕ್ಕೆ ನಮ್ಮ ಅನುಮತಿ ಕೊಡಬೇಕೆಂದು ಕೇಳಿಕೊಂಡನು. ನಮ್ಮ ಅನುಮತಿ ಹೊಮದಿ ನಮಗಾಗಿ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಶ್ರೀ ವೈಷ್ಣವ ಸಂಪ್ರದಾಯದಂತೆ ಮದುವೆ ಮಾಡಿಕೊಡುವಂತೆ ಕನ್ಯಾ ಹಿತ್ಯಗಳಿಗೆ ಹೇಳಿ, ತಾ. 8.4.1983ರಂದು ಶಾಸ್ತ್ರೋಕ್ತವಾಗಿ ಉಪನಯನ ಮತ್ತು ಲಗ್ನ ಮಾಡಿಕೊಂಡನು. ಕಮ್ಯುನಿಸ್ಟ್‌ ಪಕ್ಷದಲ್ಲಿದ್ದದ್ದರಿಂದ ಈ ಮುಂಚೆ ಉಪನಯನಕ್ಕೆ ಒಪ್ಪಿರಲಿಲ್ಲ. ನಮ್ಮ ಸ್ವಜನ ಬಂಧುಗಳೊಡನೆ ಇವನಿಗೆ ಪರಿಚಯವೇ ಇಲ್ಲ. ಸ್ನೇಹಿತರ ಬಗ್ಗೆ ಹೆಚ್ಚು ಅಭಿಮಾನ. ತಂದೆ ತಾಯಿಗಳಲ್ಲಿ ತುಂಬಾ ಅಭಿಮಾನ.", "ಇವನ ಹೆಂಡತಿ ಅದ್ವೈತ ಸಂಪ್ರದಾಯ. ಸೌ. ದೇವಕಿ ದ್ವೈತ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಮದುವೆ. ಹೀಗಾಗಿ ನಮ್ಮ ಮನೆಯಲ್ಲಿ, ಅದ್ವೈತ, ವಿಶಿಷ್ಟಾದ್ವೈತ ಮತ್ತು ದ್ವೈತ ಸಂಪ್ರದಾಯಗಳು ಸೇರಿವೆ. ಇವನು ಪರೋಪಕಾರಿ. ತನಗಾಗಿ ಯಾರನ್ನೂ ಸಹಾಯ ಕೋರುವ ಸ್ವಭಾವ ಇವನಿಗಿಲ್ಲ. ಈಗ ಇವನು ಸ್ವಸಂಪಾದನೆಯಿಂದ ಒಂದು ಮನೆಯನ್ನು ಕಟ್ಟಿಕೊಂಡಿದ್ದಾನೆ. ಒಳ್ಳೇ ಬಟ್ಟೆಗಳನ್ನು ಸಹ ತೊಡುವುದಿಲ್ಲ. ಅಧಿಕಾರದ ಅಹಂಕಾರ ಇಲ್ಲ. ತನಗಾಗಿ ಒಂದು ಮೋಟಾರ್‌ ಕಾರ್‌ ಸಹ ಇಟ್ಟುಕೊಂಡಿದ್ದಾನೆ. ಇವನಿಗೆ ಇಬ್ಬರು ಹೆಣ್ಣು ಮಕ್ಕಳು.", "ಸೌ, ರತ್ನ: ಬಿಎ ಪದವೀಧರೆ ಸ್ಟೋರ್ಟ್ಸ್‌ನಲ್ಲಿ ಮೆಡಲ್‌ ಸಹ ಪಡೆದಿದ್ದಾಳೆ. ದೇವರಲ್ಲಿ, ಹಿರಿಯರಲ್ಲಿ ಅಪಾರ ಭಕ್ತಿ. ಬಂಧುಗಳಲ್ಲಿ. ಸ್ನೇಹಿತರಲ್ಲಿ ಹೆಚ್ಚು ಅಭಿಮಾನ, ಸಂಸಾರ ನಿರ್ವಹಣೆಯಲ್ಲಿ"], ["ತುಂಬಾ ಜಾಣೆ. ಗೃಹಕೃತ್ಯದ ಜೊತೆಗೆ, ಹೊರಗಿನ ವ್ಯವಹಾರಗಳನ್ನೂ ನಿರ್ವಹಿಸುವ ಶಕ್ತಿ ಇದೆ. ಸಂಸಾರದಲ್ಲಿ ಮಿತವ್ಯಯ. ಅತಿಥಿಗಳನ್ನು ಚೆನ್ನಾಗಿ ಆದರಿಸುವ ಸ್ವಭಾವ ಇವಳದು.", "ತಂದೆ ತಾಯಿಗಳು ದಕ್ಷಿಣ ಕನ್ನಡಕ್ಕೆ ಸೇರಿದ ಸಂಪ್ರದಾಯಸ್ಥ ಅದ್ವ್ಯೈತಿ ಬ್ರಾಹ್ಮಣರು. 4 ಜನ ಅಣ್ಣ ತಮ್ಮಂದಿರು, ಒಬ್ಬ ಅಕ್ಕ ಭಾವ ಇದ್ದಾರೆ. ಇವರೆಲ್ಲಾ ತುಂಬಾ ಸಜ್ಜನರು ಮತ್ತು ಸಾಧುಗಳು. ನಮ್ಮ ಬಂಧುಗಳ ಮೇಲೆ ಅಪಾರ ಪ್ರೀತಿ. ಬೇರೆ ಸಂಪ್ರದಾಯದಿಂದ ಬಂದವಳಾದರೂ, ತನ್ನ ಅತ್ತೆ ಅಲಮೇಲಳ ನೇತೃತ್ವದಿಂದ,|. ನಮ್ಮ ವಿಶಿಷ್ಟಾದ್ವೈತ ಸಂಪ್ರದಾಯಗಳನ್ನೆಲ್ಲಾ ತಿಳಿದುಕೊಂಡು, ರೂಢಿಸಿಕೊಂಡು ಆಚರಿಸುತ್ತಿದ್ದಾಳೆ. ನಮ್ಮ ರೀತಿಯ ಅಡಿಗೆ ಸಹ ತಿಳಿದುಕೊಂಡಿದ್ದಾಳೆ. ಪತಿ ರಮೇಶ ಕಮ್ಯುನಿಸ್ಟ್‌ ತತ್ವಕ್ಕೆ ಬದ್ಧನಾಗಿದ್ದರೂ, ನಮ್ಮ ಮನೆತನದ ಎಲ್ಲಾ ಆಚರಣೆಗಳನ್ನು, ವ್ರತ, ದೇವತಾ ಕೆಲಸಗಳನ್ನು ಅರಿತುಕೊಂಡು ಆಆರಿಸುತ್ತಿದ್ದಾಳೆ. ಸಂಸಾರದಲ್ಲಿ ಪತಿಗೆ ಹೆಚ್ಚು ನೆರವಾಗುತ್ತಿದ್ದಾಳೆ. ಯಾವ ಸಂಪ್ರದಾಯದ ಬ್ರಾಹ್ಮಣರೇ ಆಗಲೀ, ಶ್ರೀ ರಾಮಾನುಜರ ತತ್ವದಂತೆ ಸಮಾಶ್ರಮಣ ಅಂದರೆ, ಚಕ್ರಾಂಕಿತ ಮಾಡಿಸಿಕೊಂಡರೆ, ಶ್ರೀ ವೈಷ್ಟವ ಸಂಪ್ರದಾಯಕ್ಕೆ ಸೇರಬಹುದು. ಇದರಂತೆ, ಇವಳಿಗೆ ಚಕ್ರಾಂಕಿತವಾದರೆ ಶ್ರೀವೈಷ್ಣವ ಸಂಪ್ರದಾಯಕ್ಕೆ ಸೇರಬಹುದು. ನನ್ನ ಪತ್ನಿ ಅಲಮೇಲಳಿಗೆ ಇವಳ ಗುಣ, ಸ್ವಭಾವ, ತುಂಬಾ ಮೆಚ್ಚುಗೆಯೇ ಆಗಿತ್ತು. ನನ್ನ ಕಂಡರೂ ಅಪಾರ ಪ್ರೇಮ ಇವಳಿಗೆ. ಒಟ್ಟಿನಲ್ಲಿ ಒಳ್ಳೆ ಸ್ವಭಾವದ ಹೆಣ್ಣು ಮಗಳು.", "ಸೌ. ಅಲಮೇಲು (ಚಿನ್ನು): ಚಿ. ರಮೇಶ, ಸೌ. ರತ್ನ ಇವರ ಹಿರಿಯ ಮಗಳು. ಪ್ರೈಮರಿ ವಿದ್ಯಾಭ್ಯಾಸದಲ್ಲಿದ್ದಾಳೆ. ಇವಳ ಹೆರಿಗೆಯಾದಾಗ, ಸೌ. ಅಲಮೇಲು ಖಾಯಿಲೆಯಲ್ಲಿದ್ದರೂ ಗುಲ್ಬರ್ಗಕ್ಕೆ ಹೋಗಿ ಮಗುವನ್ನು ನೋಡಿಕೊಂಡು ಬಂದು, ರೂಪಕ್ಕೆ ಮಾರು ಹೋಗಿ ಹೊಗಳುತ್ತಿದ್ದಳು. ಇದಕ್ಕಾಗಿಯೇ, ಈ ಮಗುವಿಗೆ ರಂಗನಾಯಕಿ ಎಂದು ಇಟ್ಟಿದ್ದ ಹೆಸರನ್ನು ಬಿಟ್ಟು ಅಲಮೇಲು ಎಂದು ಹೆಸರು ಬದಲಾಯಿಸಲಾಯಿತು.", "ಸೌ. ಮಾತಂಗಿ (ಕಾಳು/ಪಂಕಜ): ಚಿ. ರಮೇಶ ಮತ್ತು ರತ್ನ ಇವರ 2ನೇ ಮಗಳು. ಇನ್ನೂ ಸ್ಕೂಲಿಗೆ ಸೇರಿಲ್ಲ. ಅಕ್ಕನಂತೆಯೇ ರೂಪವತಿ. ತುಂಬಾ ಚಟುವಟಿಕೆ. ಧೈರ್ಯಸ್ಥೆ. ದಿವಂಂಗರ ನನ್ನ ಅಕ್ಕನ ಹೆಸರು ಪಂಕಜ ಎಂದು ಹೆಸರು ಇಟ್ಟರುತ್ತೇನೆ."], ["ಸೌ. ಅಲಮೇಲ ಬದುಕಿದ್ದರೆ ಈ ಎರಡೂ ಮಕ್ಕಳ ರೂಪವನ್ನು ನೋಡಿ, ಇವುಗಳನ್ನು ಬಿಡದೆ. ತಾನೇ ಸಾಕುತ್ತಿದ್ದಳು ಎಂಬುದು ನನ್ನ ನಿರೀಕ್ಷೆ.", "ಆಸ್ತಿ, ಆದಾಯ ನಷ್ಟ", "ನನ್ನ ತಾತ (ಅಂದರೆ ತಂದೆಯ ತಂದೆ) ಅಷ್ಟೇನೂ ಅನುಕೂಲ ಹೊಂದಿದವರಲ್ಲವೆಂದು ಕಾಣತ್ತೆ. ಇವರ ಬಾಬ್ತು ಪಿತ್ರಾರ್ಜಿತವಾದ ಆಸ್ತಿ. ವಗೈರೆಗಳಿರಲಿಲ್ಲ. ಇವರ ಸಂಸಾರವನ್ನೆಲ್ಲಾ ನಿರ್ವಹಿಸುತ್ತಿದ್ದದ್ದು ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನ ತಂಗಿ ನಾಚಾರಮ್ಮ ಇವರ ಪತಿ ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌. ಇವರಿಗೆ ಸಂತಾನವಿಲ್ಲ. ಹೀಗಾಗಿ ಇವರು ನನ್ನ ತಂದೆಯ ಅಣ್ಣ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ (ದೇಶಿಕನ ತಂದೆ) ದತ್ತು ತೆಗೆದುಕೊಂಡಿದ್ದು. ನಮ್ಮ ಸಂಸಾರವನ್ನು ನಿರ್ವಹಿಸುತ್ತಿದ್ದರು. ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮನವರು, ತಮ್ಮ ನೊಣವಿನಕೆರೆಯ ಮನೆಯ ಒಂದು ಭಾಗವನ್ನು ನನ್ನ ತಂದೆಗೆ ಕೊಟ್ಟಿದ್ದರೂ, ಅದು ಹಳೆಯ ಮನೆ, ಕೊಟ್ಟಿಗೆ. ನನ್ನ ತಂದೆ ಕೆಲವು ದಿನಗಳು ಮಾತ್ರ ಇದರಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದು, ಅನೇಕ ವರ್ಷ ಬೇರೆ ಮನೆಗಳಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದರು. ಈ ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿಯನ್ನು ಕೆಡವಿ, ಹೊಸದಾಗಿ ನಿರ್ಮಿಸಲು, ನಾನು ನನ್ನ ವಿವಾಹದ ನಂತರ ಉದ್ದೇಶಿಸಿ ಮನೆಯನ್ನು ಕೆಡವಿ, ತಳಹದಿ, ಪಾಯ ಕೆಲಸ ಪೂರ್ತಿ ಮಾಡಿದಾಗ, ನಮಗೆ ಆಗದವರಾದ ನಮ್ಮ ಜನರೇ ಆದ ಒಬ್ಬರಿಂದ ಕೋರ್ಟಿನಲ್ಲಿ ತಕರಾರು ಆಗಿ ಅರ್ಧಕ್ಕೆ ಕೆಲಸ ನಿಲ್ಲಿಸಿದ್ದಾಯಿತು. ಇದಕ್ಕೆ ಸಿದ್ಧವಾಗಿದ್ದ ಇಟ್ಟಿಗೆ ಮತ್ತು ಮರದ ಸಾಮಾನುಗಳು ಬೇರೆಯವರ ಪಾಲಾಗಿ ನಷ್ಟವೇ ಆಯಿತು. ಈ ಕಾಲದಲ್ಲಿಯೇ ನನಗೆ ಸರ್ಕಾರಿ ಕೆಲಸ ಸಿಕ್ಕಿ ನೊಣವಿನಕೆರೆ ಬಿಟ್ಟಿದ್ದರಿಂದಲೂ, ಬೇಜಾರಿನಿಂದಲೂ ಈ ಕೆಲಸವನ್ನು ಮುಂದುವರೆಸಲಿಲ್ಲ. ಈ ಸೈಟನ್ನು ನನ್ನ ತಂದೆ ಬೇರೆಯವರಿಗೆ ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟರು. ಈಗ ಅಲ್ಲಿ ಬೇರೆಯವರು ಮನೆ ಕಟ್ಟಿರುತ್ತಾರೆ. (ಈ ಮನೆ ಇದ್ದದ್ದು) ನೊಣವಿನಕೆರೆಯ ಬೇಟೆರಾಯ ಸ್ವಾಮಿ ದೇವಸ್ಥಾನದ ಹಿಂಭಾಗದ ಬೀದಿಯಲ್ಲಿ.", "ನನ್ನ ತಾಯಿ ಜೀವಂತವಾಗಿದ್ದಾಗ ನನ್ನ ತಂದೆ, ನನ್ನ ತಾಯಿಯ ಒಡವೆಗಳನ್ನು ಮಾರಿ, ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಒಂದು ತೋಟ ಕ್ರಯಕ್ಕೆ ಪಡೆದಿದ್ದರು. ಇದಕ್ಕೆ (ಓಡಾಡಲು) ದಾರಿಗಾಗಿ ಕೋರ್ಟಿನಲ್ಲಿ ವ್ಯಾಜ್ಯವಾಗಿ, ಈ ತೋಟವನ್ನು ವ್ಯಾಜ್ಯದಾರರಿಗೇ ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟರು. ಬರವಣಿಗೆ ವ್ಯತ್ಯಾಸ ಮತ್ತು ನಂಬಿದ್ದ ಮಿತ್ರರಿಂದ ಮೋಸವಾಗಿ ಕ್ರಯದ ಮೊಬಲಗು ಹೋಗಿ, ವ್ಯಾಜ್ಯದಾರರ ಕೋರ್ಟು ಖರ್ಚನ್ನು ನಮ್ಮ ತಂದೆ ತೆತ್ತರು."], ["ಕಡಬದಲ್ಲಿ ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನ ಜೀವನಾಂಶಕ್ಕೆ ಒಂದು ಗದ್ದೆ 2 ಎಕರೆ, ಸಾವೇಮೇಡು ಬಯಲಿನಲ್ಲಿ ಬಂದಿತ್ತು. ಇದನ್ನು ಮಾರಿ ಕಡಬದಲ್ಲಿ ಉತ್ತಮ ಸ್ಥಳದಲ್ಲಿ 4 ಎಕರೆ ಗದ್ದೆ ಕೊಂಡೆನು, ನನ್ನ ಕಾಲದಲ್ಲಿ. ನನ್ನ ಅಕ್ಕನ ಬಾಬ್ತು 2 ಎಕರೆ ಗದ್ದೆ ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟು ಮಿಕ್ಕ ಮೊಬಲಗನ್ನು ಸೇರಿಸಿ ತುಂಕೂರು ಸೋಮೇಶ್ವರಪುರಂನಲ್ಲಿ 7500/- ರೂಗಳಿಗೆ ಒಂದು ಮನೆಯನ್ನು ಕ್ರಯಕ್ಕೆ ಪಡೆದೆನು. ಕಡಬದಲ್ಲಿನ ಮಿಕ್ಕ 2 ಎಕರೆ ಗದ್ದೆಯನ್ನು ಮಾರಿ ಹೆಣ್ಣುಮಕ್ಕಳ ಲಗ್ನ ಮಾಡಿದ್ದಾಯಿತು. ತುಂಕೂರು ಮನೆಯ್ದು 90,000/- ರೂಗಳಿಗೆ ಮಾರಿ ಶೈಲಾ ಮದುವೆ ಮಾಡಿದ್ದಾಯಿತು.*", "* ನಳಿನಿ ಮದುವೆ ಕಾಲದಲ್ಲಿ, ಜೈರಾಮನು ತುಂಕೂರು ಮನೆಯನ್ನು ತನ್ನ ಹೆಸರಿಗೆ ಮಾಡಿಸಿಕೊಂಡು, ಅದನ್ನು ಖರೀದಿ ಎಂದು ತೋರಿಸಿ ಆಫೀಸಿನಿಂದ ರೂ. 30,000/- ಸಾಲ ಹಡೆದು ನಳಿನಿ ಮದುವೆಗೆ ಸುಮಾರು 25,000/- ಖರ್ಚು ಮಾಡಿದನು. ಮುಂದೆ ಶೈಲಾ ಮದುವೆ ಕಾಲದಲ್ಲಿ ಅದನ್ನು ರೂ. 90,000/- ಗಳಿಗೆ ಮಾರಿ ಶೈಲ ಮದುವೆಗೆ ಸುಮಾರು 30,000/- ಖರ್ಚು ಮಾಡಿ, ಆಫೀಸು ಸಾಲ ಸುಮಾರು 39,000/- ತೀರಿಸಿ ಉಳಿದ 30,000/- ಗಳಿಗೆ ಲೆಕ್ಕವನ್ನು ಯಾರಿಗೂ ಕೊಡಲಿಲ್ಲ.", "ಹುಳಿಯಾರಿನಲ್ಲಿ ಒಂದು ಸೈಟು ಮಾಡಿದ್ದೆನು. ಅದು ಉಪಯೋಗ ಇಲ್ಲವೆಂದು 2000/- ರೂಗಳಿಗೆ ಮಾರಿ ಚಿ. ನಾಗರಾಜನ ವಿವಾಹಕ್ಕೆ ಖರ್ಚು ಮಾಡಿದೆನು.", "ನನಗೆ ಸರ್ಕಾರಿ ನೌಕರಿ ಕೆಲಸ ಸಿಕ್ಕುವ ಮೊದಲು ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಒಂದು ಅಂಗಡಿ ನಡೆಸುತ್ತಿದ್ದೆ. ವ್ಯಾಪಾರ ಬಹಳ ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತಾ ಆ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಹೆಸರು ಗಳಿಸಿತ್ತು. ಮಧ್ಯದಲ್ಲಿ ನನಗೆ ಸರಕಾರಿ ಕೆಲಸ ಸಿಕ್ಕಿದ್ದರಿಂದ ಅಂಗಡಿಯನ್ನು ನನ್ನ ಪಾರ್ಟನರ್‌ಗೆ ವಹಿಸಿದೆನು. ಅವರು ಕೆಲವು ಭಾಗ ಮೊಬಲಗು ಕೊಟ್ಟು ಉಳಿದ ಮೊಬಲಗನ್ನು ಕೊಡದೆ ಅಂಗಡಿಯನ್ನು ಮುಚ್ಚಿಬಿಟ್ಟರು. ಒಟ್ಟನಲ್ಲಿ ಆಸ್ತಿಗಳಿಂದ ನನಗೆ ನಷ್ಟವೇ ಆಯಿತಲ್ಲದೆ, ಲಾಭವಾಗಲಿಲ್ಲ. ಇಷ್ಟು ನಷ್ಟವಾದರೂ ದೇವರು ನನ್ನನ್ನು ಮತ್ತು ಸಂಸಾರವನ್ನು ಸುಖವಾಗಿಯೇ ನಡೆಸಿಕೊಟ್ಟದ್ದು ನನ್ನ ಅದೃಷ್ಟ ಮತ್ತು ಹಿರಿಯರ ಆಶೀರ್ವಾದ. ನನ್ನ ಮಕ್ಕಳಿಗೆ ನಾನು ಯಾವುದೇ ರೀತಿಯ ಆಸ್ತಿಯನ್ನು ಗಳಿಸಿಕೊಟ್ಟಿಲ್ಲ. ಇದು ನನಗೆ ಒಂದು ರೀತಿಯ ಕೊರಗು. ಮಕ್ಕಳನ್ನು ಸಾಕಿ, ವಿದ್ಯೆ ಕಲಿಸಿ, ವಿವಾಹಗಳನ್ನು ಮಾಡಿದ್ದೇ ನನ್ನ ಕರ್ತವ್ಯ. ಮಕ್ಕಳು ಅವರ ಪಾಡಿಗೆ ಅವರಿದ್ದು ಮನೆ, ವಗೈರೆ ಮಾಡಿಕೊಂಡಿದ್ದಾರೆ. ಇದೇ ನನಗೆ ಸಮಾಧಾನ ಮತ್ತು ನನ್ನ ಆಶೀರ್ವಾದ. ದೇವರ ಅನುಗ್ರಹ.", "ನನ್ನ ಪತ್ನಿ ಸೌ. ಅಲಮೇಲಳ ಬಾಬ್ತು ಇದ್ದ ಚಿನ್ನದ ಬಳೆಗಳನ್ನು ಮಾರಿ ಬಂದ ಹಣದಲ್ಲಿ 10,000/-ರೂಗಳನ್ನು ಯೂನಿಟ್‌ ಟ್ರಸ್ಟ್‌ ಆಫ್‌ ಇಂಡಿಯಾದಲ್ಲಿ ಠೇವಣಿಯಾಗಿಟ್ಟು ಚಿ. ನಾಗರಾಜ ಮತ್ತು ಚಿ. ಜೈರಾಂನನ್ನು ನಾಮಿನೇಟ್‌ ಮಾಡಿರುತ್ತೇನೆ. ಈ ಬಾಬ್ತು ಬಡ್ಡಿ ವರ್ಷಕ್ಕೆ 1,200/- ರೂಗಳನ್ನು"], ["ತೆಗೆದುಕೊಳ್ಳುತ್ತಿರುತ್ತೇನೆ. ಬಡ್ಡಿ ತೆಗೆದುಕೊಳ್ಳುವುದು ಬೇಡ ಎಂದು ಹೇಳಿದಾಗ, ಬಡ್ಡಿ ತೆಗೆದುಕೊಳ್ಳಲು ಮಕ್ಕಳು ಒತ್ತಾಯಿಸಿದ್ದರಿಂದ ತೆಗೆದುಕೊಳ್ಳುತ್ತಿದ್ದೇನೆ. ನನ್ನ ಮೊಮ್ಮಗಳು ಸೌ. ಜ್ಯೋತಿ ಬಾಬ್ತು ಒಂದು ಜೊತೆ ಚಿನ್ನದ ಜುಂಕಿಯನ್ನು ಸೌ. ಅಲಮೇಲ ಏನು ಮಾಡಿದಳೆಂಬುದು ತಿಳಿಯದ ಕಾರಣ, ಇದಕ್ಕೆ ಮತ್ತು ನನ್ನ ಅಕ್ಕನ ಆಸೆಯಂತೆ ಸೌ, ಜ್ಯೋತಿಗೆ 5.000/- ರೂಗಳನ್ನು ಕೊಟ್ಟು ಚಿ. ನಾಗರಾಜನ ಹೆಸರಿನಲ್ಲಿ ಯುಟಐನಲ್ಲಿ ಕ್ಯುಮ್ಕುಲೇಟಿವ್‌ ಡಿಪಾಸಿಟ್‌ ಇಟ್ಟಿದೆ. 3 ವರ್ಷಗಳಾಯಿತು ಇನ್ನು ಎರಡು ವರ್ಷ ಕಳೆದರೆ 10,000/- ರೂ. ಅವನಿಗೆ ಬಂದು ಸೌ. ಜ್ಯೋತಿಯ ವಿವಾಹಕ್ಕೆ ಅನುಕೂಲವಾಗಲಿದೆ. ಜೆ. ನಾಗರಾಜನ ಬಾಬ್ತು ಒಂದು ಬೆಳ್ಳಿ ದೇವರ ಸಂಪುಟ ಕಳೆದು ಹೋಗಿದ್ದರಿಂದ ಮನೆಯಲ್ಲಿರುವ ಬೆಳ್ಳಿ ದೊಡ್ಡ ದೇವರ ಸಂಪುಟವನ್ನು ಅವನ ಗೃಹಪ್ರವೇಶದ ಕಾಲದಲ್ಲಿ ಓದಿಸಿ ಮನೆಯಲ್ಲಿಟ್ಟದ್ದೇನೆ. ಚಿ. ನಾಗರಾಜ, ಚಿ. ಸುಪರ್ಣ, ಚಿ. ರಮೇಶ ಕ್ರಮವಾಗಿ ಕಮಲಾನಗರ, ಮೈಸೂರು ರಸ್ಕೆ ಮತ್ತು ಬನಶಂಕರಿಗಳಲ್ಲಿ ತಮ್ಮ ಸಂಪಾದನೆಯಿಂದ ಮನೆ ಕಟ್ಟಿರುತ್ತಾರೆ. ನಾನು ಮಕ್ಕಳಿಗೆ ಏನೂ ಆಸ್ಥಿ ಮಾಡಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೂ ಅವರ ಸ್ವಪ್ರಯತ್ನದಿಂದ ಮನೆ ಕಟ್ಟಕೊಂಡಿರುವುದಕ್ಕೆ ಸಂತೋಷವೇ ಆಗಿದೆ. ಚಿ. ಸುಪರ್ಣ ಬೆಂಗಳೂರು, ಮೈಸೂರು ರಸ್ಕೆಯಲ್ಲಿ ಮನೆ ಕಟ್ಟಿಕೊಂಡಿರುವ ಸಮಾಚಾರ ನನಗೆ ಬೇರೆಯವರಿಂದ ತಿಳಿದಿದೆ. ಮನೆ ಕಟ್ಟಸಿದ್ದೇನೆಂದು ಇಲ್ಲಿಯ ತನಕ ಅವನು ನನಗೆ ಹೇಳಿಲ್ಲ. ಮನೆ ನೋಡಲೂ ಸಹ ಕರೆದಿಲ್ಲ. ಗೃಹ ಪ್ರವೇಶ ಸಮಾರಂಭವನ್ನು ಸಹ ಮಾಡಿಲ್ಲ. ಏಕೆ ಹೀಗೆ ಮಾಡಿದ್ದಾನೆಂದು ನನಗೆ ಅರ್ಥವಾಗಿಲ್ಲ. ಹೇಗೂ ದೇವರು ಅವನಿಗೆ ಒಳ್ಳೆಯದನ್ನು ಮಾಡಿ, ಒಳ್ಳೇ ಬುದ್ಧಿ ಕೊಡಲೆಂದು ಪ್ರಾರ್ಥಿಸುತ್ತೇನೆ. ಚಿ. ಜೈರಾಂ ಸ್ವಂತ ಮನೆ ಕಟ್ಟಲು ಪ್ರಯತ್ನಿಸಿಲ್ಲ. ಮನಸ್ಸು ಮಾಡಿದರೆ ಆಗುತ್ತಿತ್ತು. ಅವನಿಗೆ ಬೇಕಿಲ್ಲವೆಂದು ಕಾಣತ್ತೆ.", "ನಾನು ಬಾಲ್ಯದಲ್ಲಿ ನನ್ನ ತಂದೆ ಮತ್ತು ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನ (ತಾಯಿ ನನ್ನ 4ನೇ ವಯಸ್ಸಿನಲ್ಲಿ ಗತಿಸಿದರು). ಆಶ್ರಯದಲ್ಲಿ ಸುಖವಾಗಿ ಬೆಳೆದನು. ಯೌವನದಲ್ಲಿ, ಹಿಂದೆ ಬರೆದಂತೆ, ನಾನಾ ವೃತ್ತಿಗಳಲ್ಲಿದ್ದು ಕಡೆಗೆ ಹುಳಿಯಾರಿನಲ್ಲಿ ಸ್ವಂತ ವೈದ್ಯಕೀಯ ವೃತ್ತಿಯಲ್ಲಿದ್ದು 10 ಮಕ್ಕಳನ್ನು ಸಾಕಿ, ವಿದ್ಯಾಭ್ಯಾಸ, ಲಗ್ನ ವಗೈರೆಗಳನನು ಮಾಡಿ, ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ, ಬೆಂಗಳೂರಿನಲ್ಲಿ ನನ್ನ 3ನೇ ಮಗ ಜೈರಾಂ ಮತ್ತು 3ನೇ ಸೊಸೆ. ಸೌ. ಲಕ್ಷ್ಮಿ ಆಶ್ರಯದಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದೇನೆ. ಯೌವನದಲ್ಲಿ ಮಾತ್ರ ಸ್ವಲ್ಪ ಕಷ್ಟಪಟ್ಟದ್ದಾಯಿತು. ನನ್ನ ಪತ್ನಿ ಸೌ. ಅಲಮೇಲಳ ಚಾಣಕ್ಕತೆ, ದಕ್ಷತೆ, ಜನಾನುರಾಗಿ, ಸಂಸಾರ ನಿರ್ವಹಣೆಯಲ್ಲಿ ಬುದ್ಧಿವಂತಿಕೆಯಿಂದಲೇ ನನ್ನ ಕಷ್ಟಗಳೆಲ್ಲಾ ಪರಿಹಾರವಾಯಿತು. ಸಂಸಾರದಲ್ಲಿ ನನ್ನ ಪತ್ನಿ ಸೌ. ಅಲಮೇಲಳ ಬುದ್ಧಿವಂತಿಕೆ, ಸಹಕಾರದಿಂದ ನನಗ ಯಾವುದೇ ರೀತಿಯ ತೊಂದರೆ, ನೋವು."], ["ಕಷ್ಪಕೊಡದೆ ಸಂಸಾರವನ್ನು ನಿರ್ವಹಿಸಿದ್ದಾಳೆ. ಇದರ ಪೂರ್ಣ, ಕೀರ್ತಿ, ಯಶಸ್ಸು ಸೌ. ಅಲಮೇಲಳಿಗೆ ಸಲ್ಲತಕ್ಕದ್ದಾಗಿದೆ. ಎಲ್ಲಾ ಮಕ್ಕಳನ್ನೂ ಸಾಕಿ, ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿಸಿ, ಹೆಣ್ಣು ಮಕ್ಕಳಿಗೆಲ್ಲಾ ವಿವಾಹ ಮಾಡಿ. ಗಂಡು ಮಕ್ಕಳೆಲ್ಲಾ ದುಡಿಯುತ್ತಾ ಸುಖವಾಗಿರುವ ಕಾಲಕ್ಕೆ ತನ್ನ ಇಹಲೋಕದ ಕರ್ತವ್ಯ ಮುಗಿಸಿ, ನನಗೆ ಯಾವುದೇ ರೀತಿಯಲ್ಲಿ ತೊಂದರೆಯಾಗದಂತೆ ಮಾಡಿ ತನ್ನ ಹುಟ್ಟು ಸಾರ್ಥಕವಾಯಿತೆಂದು ಕಣ್ಣು ಮುಚ್ಚಿದಳು. ನನ್ನ ಸಂಸಾರದ ಪೂರ್ತಿ ಕೀರ್ತಿ, ಯಶಸ್ಸು ನನ್ನ ಪತಶ್ಚಿ ಸೌ. ಅಲಮೇಲಳಿಗೆ ಸಲ್ಲತಕ್ಕದಾಗಿದೆ. ನನ್ನ ಮಕ್ಕಳಿಗೆ ನಾನು ಯಾವುದೇ ಸ್ಥಿರ ಆಸ್ಥಿಗಳನ್ನು ಮಾಡಲಿಲ್ಲವೆಂಬುದು ನನ್ನ ಕೊರಗು. ಆದರೆ. ಯಾವುದೇ ರೀತಿಯ ಸಾಲ ವಗೈರೆ ಮಾಡಿ ನನ್ನ ಮಕ್ಕಳನು ಯಣಿಗಳಾಗಿ ಮಾಡಲಿಲ್ಲವೆಂಬುದೇ ನನ್ನ ತೃಪ್ತಿ. ನನಗೆ ಆದಿಯಿಂದಲೂ ಸಾಲ ಎಂಬುದಕ್ಕೆ ಭಯ. ಸಾಲಗಾರ ಮನೆಯ ಬಾಗಿಲಿಗೆ ಬಂದರೆ ನನಗೆ ಒಂದು ರೀತಿಯ ಉದ್ರೇಕ. ದೇವರ ಅನುಗ್ರಹದಿಂದ, ಹಿರಿಯರ ಆಶೀರ್ವಾದದಿಂದ ಆದಷ್ಟು ಸಮಾಧಾನದಿಂದ ಈ ಸಂಸಾರವನ್ನು ನಿರ್ವಹಿಸಿದೆನೆಂಬ ತೃಪ್ತಿ ನನಗಿದೆ. ಸ್ಥಿರಾಸ್ತಿಗಳನ್ನು ಮಾಡದಿದ್ದರೂ ಗೃಹೋಪಯೋಗಿ ಪದಾರ್ಥಗಳನ್ನೆಲ್ಲಾ ಮಾಡಿ, ಹೆಣ್ಣು ಮಕ್ಕಳಿಗೂ ಕೊಟ್ಟ ವಿಚಾರ ನನ್ನ ಪತ್ನಿ ಸೌ. ಅಲಮೇಲಳ ದಕ್ಷತೆ.", "ವಾರ್ಧಿಕ್ಕದಲ್ಲಿ ಹಿಂದೆ ಹೇಳಿರುವಂತೆ ನನ್ನ 3ನೇ ಮಗ ಚಿ. ಜೈರಾಂ ಅವನ ಪತ್ನಿ ಸೌ. ಲಕ್ಷ್ಮಿಯ ಆಶ್ರಯದಲ್ಲಿ ಯಾವುದೇ ರೀತಿಯ ಕಿರುಕುಳ, ಲೋಪಗಳಿಲ್ಲದೆ ಸುಖವಾಗಿರುತ್ತೇನೆ. ವೃದ್ಧಾಪ್ಯದ ನನ್ನ ಮಿತ್ರರು ಅನೇಕರ ಅನುಭವಗಳನ್ನು ಕೇಳುತ್ತಿರುವ ನನಗೆ ಯಾವುದೇ ರೀತಿಯ ನೋವುಗಳನ್ನು ಅನುಭವಿಸದೆ ಶಾಂತಿಯಿಂದ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ. ಬೇರೆ ಮಕ್ಕಳೂ ತಮ್ಮ ಮನೆಗೆ ಬಂದಿರಲು ಹೇಳುತ್ತಿದ್ದಾರೆ. ನನ್ನ ಮೇಲೆ ಚಿ. ಜೈರಾಂನಿಗೆ ಅಪಾರ ಪ್ರೇಮ. ನಾನು 1 ದಿನ ಮನೆಯಲ್ಲಿಲ್ಲದಿದ್ದರೆ, ಅವನಿಗೆ ಶಾಂತಿಯೇ ಇರುವುದಿಲ್ಲ. ಜೊತೆಗೆ ಅವನದೇ ಆರೋಗ್ಯ ಉತ್ತಮವಾಗಿಲ್ಲ. ನನ್ನ ಸಹವಾಸ ಅವನಿಗೆ ಒಂದು ದಿನ ಇಲ್ಲದಿದ್ದರೂ, ಅವನ ಮನಸ್ಸಿನ ಮೇಲೆ ಒಂದು ರೀತಿಯ ಪರಿಣಾಮವಾಗಿ ಅಸ್ಪಸ್ಥವಾಗುವುದು ನನಗೆ ತಿಳಿದಿದೆ. ಆದ್ದರಿಂದ ಅವನ ಸಹವಾಸದಲ್ಲಿರುವುದು ಉಭಯರಿಗೂ ಉತ್ತಮ ಎಂದು ಭಾವಿಸಿದ್ದೇನೆ. ಬೇರೆ ಮಕ್ಕಳೂ ನನಗೆ ಆಶ್ರಯ ಕೊಡುತ್ತಾರೆಂಬ ನಂಬಿಕೆಯೂ ಇದೆ. ಒಟ್ಟನಲ್ಲಿ ಈ ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ ಯಾವ ರೀತಿಯಲ್ಲಿಯೂ ತೊಂದರೆ ಇಲ್ಲದೆ ಇರುವುದೇ ನನ್ನ ಸಮಾಧಾನ. ಇದೇ ರೀತಿ ಅಂತ್ಯದವರೆಗೆ ಇದ್ದು, ಇಹಲೋಕವನ್ನು ತ್ಯಜಿಸಲು ದೇವರನ್ನು ಪ್ರಾರ್ಥಿಸುತ್ತೇನೆ."], ["ನನ್ನ ಮತ್ತು ಸೌ. ಅಲಮೇಲಳ ಪ್ರವಾಸ", "1. ಸೌ. ಅಲಮೇಲ ಮೊಟ್ಟ ಮೊದಲ ಬಾರಿಗೆ ಉತ್ತರ ಭಾರತ ಪ್ರವಾಸ ಮಾಡಿಕೊಂಡು ಬಂದಳು.", "2. ಚಿ. ಜೈರಾಂನ 17ಲಯಲ್ಲಿ ನಾನು, ಸೌ. ಅಲಮೇಲ, ಜೆ. ಜೈರಾಂ, ಸ್ನೇಹಿತನೊಡನೆ ದೆಹಲಿ, ಹರಿದ್ವಾರ, ಖುಷಿಕೇಶ, ಲಕ್ಷ್ಮಣಜೂಲ, ಮಸ್ಸೂರಿ, ವಾರಣಾಸಿ, ಅಲಹಾಬಾದ್‌, ಗಯಾ, ಆಗ್ರಾ, ಮಹುರಾ ಪ್ರವಾಸ.", "3. ಚಿ. ನಾಗರಾಜ, ಜಿ. ಜೈರಾಂ ಜೊತೆ ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನ ಕರ್ಮಕ್ಕೆ ಗಯಾ, ವಾರಣಾಸಿ ಪ್ರವಾಸ (1982).", "4. ಚಿ. ನಾಗರಾಜನ 187ಲಿಯಲ್ಲಿ ನಾನು, ಸೌ. ಅಲಮೇಲ, ಚಿ. ನಾಗರಾಜ, ಸೌ. ಹೇಮ, ಚಿ. ಗರುಡ, ಸೌ. ಜ್ಯೋತಿ ಜೊತೆ 2ನೇ ಬಾತಿ 177ಲಿಯಲ್ಲಿ ಉತ್ತರ ಭಾರತದ ಪ್ರವಾಸ (1983).", "5. ನಾನು, ಚಿ. ಜೈರಾಂ, ಸೌ. ಲಕ್ಷ್ಮಿ ಸೌ. ಜೇಚಮೃ ಸೌ. ನಳಿನಿಯ ಮಕ್ಕಳು ಉತ್ತರ ಭಾರತ ಪ್ರವಾಸ.", "6. ಮದ್ರಾಸ್‌, ತಂಜಾವೂರು, ಕಂಚಿ, ಕಾಳಹಸ್ವಿ, ಶ್ರೀರಂಗಂ, ಚಿದಂಬರಂ, ರಾಮೇಶ್ವರ, ಧನಷ್ಠೋಟಿ, ಮಧುರೈ, ಪಳನಿಗೆ- ನನ್ನ ದಕ್ಷಿಣ ಭಾರತ ಪ್ರವಾಸ. ಈ ಹಿಂದೆಯೇ ಮಾಡಿದ್ದೇನೆ (1962) ಬದರಿ ಪ್ರವಾಸ ಮಾತ್ರ ಲಭ್ಯವಾಗಲಿಲ್ಲ.", "ಆಸ್ಪತ್ರೆ ವಾಸ", "ನನಗೆ ಕೆಲವಾರು ತಿಂಗಳಿಂದ (ವರ್ಷಗಳಿಂದ) ೫£೦8£೩ರರೂ ಆಗಿ ಮೂತ್ರ ವಿಸರ್ಜನೆಯಲ್ಲಿ", "ಸ್ವಲ್ಪ ತೊಂದರೆಯಾಗುತ್ತಿದ್ದದು ತಿಳಿದಿತ್ತು. ಬೇಸಿಗೆಯಲ್ಲಿ ಆಪರೇಷನ್‌ಗೆ ಹೋಗೋಣ ಎಂದು ನಿರ್ಲಷ್ಟ", "ಮಾಡಿದ್ದೆ. ಚಳಿಗಾಲದಲ್ಲಿ ಬೇಲೂರಿಗೆ ಹೋಗಿ ಮಳೆಯಲ್ಲಿ ನೆನೆದು ರಾತ್ರಿ ಅಲ್ಲಿದ್ದಾಗ ಮೂತ್ರ ಕಟ್ಟ", "ತೊಂದರೆಯಾಯಿತು. ಬೆಳಗ್ಗೆ ಅಲ್ಲಿ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಮೂತ್ರ ತೆಗೆಸಿಕೊಂಡು ಕಾರಿನಲ್ಲಿ ಹಾಸನಕ್ಕೆ ಬಂದು ಸೌ.", "ವಿನತಾ ಅಲ್ಲಿದ್ದುದರಿಂದ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿ ಸಾಯಂಕಾಲ 77/1೧0೦: ೦0೮£೩ಂ೧ ಮಾಡಿಸಿಕೊಂಡೆನು.", "ನಂತರ 20 ದಿನಗಳ ನಂತರ ಮಾಡಬೇಕಾದ 1/8]: ೦೮೫೩೮ಂ೫ ಗೆಂದು ಬೆಂಗಳೂರಿಗೆ ಬಂದಿದ್ದರೆ", "ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತು. 20 ದಿನಗಳ ನಂತರ 7/೦: ೦0೮೯೩೮ಂ೧ ಹಾಸನದಲ್ಲಿಯೇ ಮಾಡಿಸಿಕೊಂಡು 1"], ["ತಿಂಗಳು. ಹಾಸನದ ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದೆನು. ನಂತರ ಬೆಂಗಳೂರಿಗೆ ಬಂದಾಗ ಪುನಃ ಮೂತ್ರದ ತೊಂದರೆಯಾಗಿ, ನನ್ನ ಬಲಗಾಲು ಸ್ವಾಧೀನ ತಪ್ಪಿತು. ಮಲ್ಲೇಶ್ವರದ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಒಂದು ತಿಂಗಳಿದ್ದರೂ, ಮೂತ್ರದ ತೊಂದರೆ ಕಮ್ಮಿಯಾಯಿತಾದರೂ, ಬಲಗಾಲು ಸ್ವಾಧೀನಕ್ಕೆ ಬರಲಿಲ್ಲ. ನಂತರ ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿ, ಡಾ. ಬಿ.ಟಿ. ಸಂಪತ್‌ಕುಮಾರ್‌ ಅವರಿಂದ 3ನೇ ಆಪರೇಷನ್‌ ಆಗಿ ಒಂದು ತಿಂಗಳು ಅಲ್ಲಿದ್ದ ನಂತರ ಬಲಗಾಲು ಸ್ವಾಧೀನಕ್ಕೆ ಬಂದಿತು. ಕೆಲವಾರು ತಿಂಗಳ ನಂತರ 17085100 180771 ಆಗಿ. ತೊಂದರೆ ಆಯಿತು. ಪುನಃ ಮನೆಯಲ್ಲಿ ಚಿ. ಸೌಗಳಿಗೆ ಇಷ್ಟವಿಲ್ಲದಿದ್ದರೂ ಮಲ್ಲೇಶ್ವರಂ ಕೆ.ಸಿ.ಜನರಲ್‌ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿ, ಅಲ್ಲಿ ಡಾ. ಶ್ರೀನಿವಾಸ್‌ ಅವರಿಂದ 4ನೇ ಆಪರೇಷನ್‌ ಆಯಿತು. ಈ ಸಾರಿ ಆಪರೇಷನ್‌ ಆದ ನಂತರ 3-4 ದಿನಗಳವರೆಗೆ ನನಗೆ ಪ್ರಜ್ಞೆಯೇ ಇರಲಿಲ್ಲ. ಎಲ್ಲರೂ ನಾನು ಬದುಕುವುದೇ ಇಲ್ಲ ಎಂದು ನಿರ್ಧರಿಸಿದ್ದದ್ದು ನಂತರ ತಿಳಿಯಿತು. ಈ ಕಾಲದಲ್ಲಿ ಡಾಕ್ಟರರ ಸಲಹೆಯ ಮೇರೆಗೆ 3-4 ಬಾಟೆಲ್‌ ರಕ್ತವನ್ನು ನನ್ನ ದೇಹಕ್ಕೆ ಕೊಟ್ಟರೆಂದು ತಿಳಿಯಿತು. ಇದು ಯಾರ್ಯಾರ ರಕ್ತವೋ ನನ್ನ ದೇಹಕ್ಕೆ ಸೇರಿತು. ನನಗೆ ಪ್ರಜ್ಞೆ ಇದ್ದಿದ್ದರೆ, ಸಾಯಲು ಸಿದ್ಧನಾಗಿ ನಾನು ಇದಕ್ಕೆ ಒಪ್ಪುತ್ತಿರಲಿಲ್ಲ. ಇದರಿಂದ ಗುಣಮುಖನಾಗೇನೋ ಇದ್ದೇನೆ. ಈ ರಕ್ತದ ಶಂಕೆ ಮಾತ್ರ ಹೋಗಿಲ್ಲ. ನನ್ನ ಕರ್ತವ್ಯಗಳೆಲ್ಲವೂ ಮುಗಿದಿದ್ದರಿಂದ, ಸೌ. ಅಲಮೇಲು ಆ ವೇಳೆ ಮೃತಪಟ್ಟಿದ್ದಾಗಿದ್ದರಿಂದಲೂ ಸಾಯುವುದಕ್ಕೆ ಸಿದ್ಧನಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿದ್ದೆ. ನನ್ನ ಇಹಲೋಕದ ಯಣ ಇನ್ನೂ ತೀರಲಿಲ್ಲದ್ದರಿಂದಲೇ ಜೀವಂತವಾಗಿ ಉಳಿದುಕೊಂಡೆ. ಒಟ್ಟಿನಲ್ಲಿ ಈ ವಯಸ್ಸಿಗೆ 1 ಮೈನರ್‌, 3 ಮೇಜರ್‌ ಆಪರೇಷನ್‌ಗಳಾಗಿ ಉಳಿದುಕೊಂಡಿದ್ದೇನೆ.", "ಸೌ. ಅಲಮೇಲಳಿಗೆ ಡಯಾಬಿಟಿಕ್‌ ಆಗಿ ಮಲ್ಲೇಶ್ವರದ ಕೆ.ಸಿ. ಜನರಲ್‌ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ 3 ಬಾರಿ ಸೇರಿದ್ದಳು. ನಂತರ 1/%6000% ೫ಂ೫7 ಸಹ ಆಯಿತು. ಸೌ. ಶೈಲಾ ವಿವಾಹದ ನಂತರ ಯಾವಾಗಲೂ 10 ಜನಕ್ಕೆ ಕಡಿಮೆ ಇಲ್ಲದಂತೆ ಇದ್ದ ನಮ್ಮ ಮನೆಯಲ್ಲಿ 3 ಜನ ಮಾತ್ರ ಇದ್ದಾಗ ಮತ್ತು ಶೇಷಾದ್ರಿಮರಂ ಮನೆ ಬಿಟ್ಟು ಮಲ್ಲೇಶ್ವರ ಮನೆ ವಾಸಕ್ಕೆ ಬಂದಾಗ ಅವಳಿಗೆ 1೧ 8೫0 ಇದ್ದು, ಗಂಜ '7೦೮%1೮ ಪ್ರಾರಂಭವಾಯಿತು. ಇದಕ್ಕೆ ಮುನ್ನ ಏಕಕಾಲದಲ್ಲಿ ಸೌ. ನಳಿನಿಗೆ 2ನೇ ಹೆರಿಗೆ, ಸೌ. ಶೈಲಾಗೆ ಮೊದಲನೇ ಹೆರಿಗೆಯಾಗಿ ಹೆಚ್ಚು ದೇಹ ಶ್ರಮ ತೆಗೆದುಕೊಂಡ ಕಾರಣ ಅವಳ ದೇಶಸ್ಥಿತಿ ಉಲ್ಬಣಗೊಂಡಿತು. ನಂತರ ಜಯದೇವ ಹೃದ್ರೋಗ ಆಸ್ಪತ್ರೆ, ಬೌರಿಂಗ್‌ ಆಸ್ಪತ್ರೆ ಸೇರಿ ಕಡೆಯಲ್ಲಿ ಜಯದೇವ ಹೃದ್ರೋಗ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಕೊನೆಯುಸಿರೆಳೆದಳು. ಹೆತ್ತು. ಸಾಕಿ, ವಿದ್ಯಾಭ್ಯಾಸ, ಮದುವೆ,"], ["ಬಾಣಂತನಗಳನ್ನು ಪೂರೈಸಿ ಇಹಲೋಕದ ವ್ಯಾಪಾರ ಪೂರ್ತಿ ಮಾಡಿ ಯಾಗಿಗೂ ಭಾರವಾಗದೆ.", "ಎಲ್ಲರೂ ಸುಖವಾಗಿರುವಾಗ ತನ್ನ ಕರ್ತವ್ಯ ಪೂರ್ತಿಯಾಯಿತೆಂದು ಶ್ರೀ ವೈನತೇಯರ ಪಾದ ಸೇರಿದಳು.", "ನನ್ನ ರಾಜಕೀಯ", "1. ಅಧ್ಯಕ್ಷ - ಅಖಿಲ ಭಾರತ ಕಾಂಗ್ರೆಸ್‌, ಹೋಬಳಿ ಸಮಿತಿ, ಹುಳಿಯಾರು.", "2. ಅಧ್ಯಕ್ಷ - ದಕ್ಷಿಣ ಭಾರತ ಹಿಂದಿ ಪ್ರಚಾರ ಸಭಾ, ಹೋಬಳಿ ಸಮಿತಿ, ಹುಳಿಯಾರು.", "3. ಅಧ್ಯಕ್ಷ - ಖಾದಿ ಗ್ರಾಮೋದ್ಯೋಗ ಮಂಡಳಿ, ಹೋಬಳಿ ಸಮಿತಿ, ಹುಳಿಯಾರು.", "4. ಅಧ್ಯಕ್ಷ - ಟೌನ್‌ ಕೊ ಆಪರೇಟವ್‌ ಸೊಸೈಟಿ, ಹುಳಿಯಾರು.", "5. ಅಧ್ಯಕ್ಷ - ಸಂಸ್ಥಾಪಕ, ಹೌಸ್‌ ಬಿಲ್ಡಿಂಗ್‌ ಕೋ ಆಪರೇಟವ್‌ ಸೊಸೈಟಿ, ಹುಳಿಯಾರು.", "6, ಸಂಸ್ಥಾಪಕ ನಿರ್ದೇಶಕ - ತಾಲ್ಲೂಕು ವಿವಿಧೋದ್ದೇಶ ಸಹಕಾರ ಸಂಘ, ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿ.", "7. ಸಂಸ್ಥಾಪಕ ನಿರ್ದೇಶಕ - ವಿವಿಧೋದ್ದೇಶ ಸಹಕಾರ ಸಂಘ, ಹುಳಿಯಾರು.", "8. ಸದಸ್ಯ - ಅಖಿಲ ಭಾರತ ಕಾಂಗ್ರೆಸ್‌ ಜಿಲ್ಲಾ ಸಮಿತಿ, ತುಂಕೂರು.", "9, ಸದಸ್ಯ - ಅಖಿಲ ಭಾರತ ಕಾಂಗ್ರೆಸ್‌ ತಾಲ್ಲೂಕು ಸಮಿತಿ, ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿ.", "10. ಸದಸ್ಯ - ತಾಲ್ಲೂಕು ಅಭಿವೃದ್ಧಿ ಮಂಡಳು, ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿ.", "11. ಸದಸ್ಯ - ಜಿಲ್ಲಾ ಬೋರ್ಡ್‌ ಹೈಸ್ಕೂಲು ಸಮಿತಿ, ಹುಳಿಯಾರು.", "12. ಅಧ್ಯಕ್ಷ - ಅಖಿಲ ಭಾರತ ಕಾಂಗ್ರೆಸ್‌ ಸೇವಾದಳ, ಹುಳಿಯಾರು ಹೋಬಳಿ.", "13. ಸದಸ್ಯ - ಶಾಂತಿ ಸಮಿತಿ, ಹುಳಿಯಾರು", "14. ಸರ್ಕಾರಿ ಪ್ರತಿನಿಧಿ ಸದಸ್ಯ - ರೆಗ್ಯಲೇಟರ್‌ ಮಾರ್ಕೆಟ್‌, ತಿಪ್ಪೂರು."], ["ರಾಜಕೀಯ", "ಈ ರಾಜಕೀಯ ಪ್ರವೇಶದಿಂದ ನನ್ನ ವೃತ್ತಿಯಲ್ಲಿ ವೈಯಕ್ತಿಕ ಆದಾಯದಲ್ಲಿ ನಷ್ಟವಾಗಿರುವುದು ವಾಸ್ತವ. ಆದರೆ ರಾಜಕೀಯ ಪ್ರವೇಶದಿಂದ ನನ್ನ ಹೆಸರು ಗ್ರಾಮದಿಂದ ವಿಧಾನಸೌಧದವರೆಗೆ ಪ್ರಚಾರವಾಗಿ, ಜನತೆಯ, ಅಧಿಕಾರಿಗಳ, ಶಾಸಕರ, ಕಡೆಗೆ ಸಚಿವರವರೆಗೆ ನನ್ನ ಕಾರ್ಯದಕ್ಕತೆ, ನಿಸ್ವಾರ್ಥತೆ, ಜನಾನುರಾಗದಿಂದ, ಅರ್ಥ ವ್ಯವಸ್ಥೆ ಇಲ್ಲದಿದ್ದರೂ ಖ್ಯಾತಿಗಳಿಸುವಂತಾಯಿತು. ಅನೇಕ ಸರ್ಕಾರಿ ಸಮಸ್ಯೆಗಳಲ್ಲಿ ಅಧಿಕಾರಿಗಳು ನನ್ನೊಡನೆ ಪರಿಹಾರಕ್ಕಾಗಿ ಸಮಾಲೋಚಿಸುತ್ತಿದ್ದರು. ಈ ಕಾಲದಲ್ಲಿ ನಾನ ಆಸೆಪಟ್ಟು, ಸ್ವಾರ್ಥಕ್ಕೆ ಬೇಕಾದಷ್ಟು ಪ್ರಯೋಜನ ಪಡೆಯಲು ಅವಕಾಶವಿತ್ತು. ನಾನು ಸ್ವಾರ್ಥದ ಆದಾಯಕ್ಕೆ ಪ್ರಯತ್ನ ಪಟ್ಟಿದ್ದರೆ, ಜನಾನುರಾಗ ಕಳೆದುಕೊಳ್ಳಬೇಕಾಗಿತ್ತು. ಸ್ವಜನ, ಬಂಧುಗಳು, ಆರ್ಥಿಕವಾಗಿ ಸ್ವಾವಲಂಬಿಯಾಗಿಲ್ಲದ ಕಡೆಗೆ, ನಾನು ಹುಟ್ಟದ ಸ್ಥಳವೂ ಅಲ್ಲದ, ನನಗೆ ಇಷ್ಟೊಂದು ಗೌರವ, ಜನತೆಯಿಂದ, ಅಧಿಕಾರಿಗಳಿಂದ, ರಾಜಕಾರಣಿಗಳಿಂದ, ಅಭಿಸಿದ್ದು, ನನ್ನ ನಿಸ್ವಾರ್ಥ, ಜನತೆಯ ಅನುರಾಗಗಳೇ ಮುಖ್ಯ ಕಾರಣ. ಕಡೆಗೆ ನನ್ನ ಮಕ್ಕಳ ವಿದ್ಯಾಭ್ಯಾಸದ ಕಾಲೇಜು ಸೀಟಿಗಾಗಲಿ, ಅವರಿಗೆ ಸರ್ಕಾರಿ ನೌಕರಿಗಾಗಲಿ ಯಾವ ರಾಜಕಾರಣಿಗಳ ಶಿಫಾರಸ್ಸು ಪಡೆಯಲಿಲ್ಲ. ಈ ದಿನ ನನ್ನ ಮಕ್ಕಳು ಹೆಚ್ಚಿನ ಎದ್ಯಾಭ್ಯಾಸ ಪಡೆದು, ಉತ್ತಮ ನೌಕರಿಗಳಿಸಿ, ಅಧಿಕಾರದಲ್ಲಿ ಉಳಿದಿದ್ದರೆ, ಅವರುಗಳ ಸ್ವಂತ ಪ್ರತಿಭೆ ಮತ್ತು ಅವರ ಅದೃಷ್ಟ ಎಂದು ಹೇಳಬಹುದು. ನನ್ನ ಪತ್ನಿಗೂ ರಾಜಕೀಯದಲ್ಲಿ ಸಕ್ರಿಯವಾಗಿ ಭಾಗವಹಿಸಲು, ರಾಜಕಾರಣಿಗಳಿಂದ ಮತ್ತು ಅಧಿಕಾರಿಗಳಿಂದ ಬಂದಿದ್ದ ಸಲಹೆ, ಆಹ್ವಾನಗಳನ್ನು ನಿರಾಕರಿಸಿದ್ದಾಯಿತು. ಕಾರಣ, ಹೆಚ್ಚು ಮಕ್ಕಳನ್ನು ಹೊಂದಿರುವ ನನ್ನ ಪತ್ನಿಗೆ, ಸಂಸಾರದ ನಿರ್ವಹಣೆಯಲ್ಲಿ ಹೆಚ್ಚು ಜವಾಬ್ದಾರಿ ಇದ್ದುದ್ದರಿಂದ. ಆದರೂ ನನ್ನ ಪತ್ನಿ ಪರೋಕ್ಷವಾಗಿ ರಾಜಕೀಯದಲ್ಲಿ ಮಾಡುತ್ತಿದ್ದ ಕಾರ್ಯಗಳು, ರಾಜಕಾರಣಿಗಳಿಂದ ಮತ್ತು ಅಧಿಕಾರಿಗಳಿಮದ ಪ್ರಶಂಸೆಗೆ ಒಳಪಡುತ್ತಿದ್ದವು. ಕಡೆಗೆ ಬೇರೆ ಮಹಿಳಾ ಪ್ರತಿನಿಧಿಗಳು ಸಿಕ್ಕದಿದ್ದುದರಿಂದ, ನನ್ನ ಪತ್ನಿಯನ್ನು ಹೋಬಳಿ ಕಾಂಗ್ರೆಸ್‌ ಸಮಿತಿಯ ಮಹಿಳಾ ಸಂಘಟನೆಗೆ ಅಧ್ಯಕ್ಷೆಯನ್ನಾಗಿ ಮಾಡಲಾಯಿತು."], ["ಈ ರಾಜಕೀಯ ಪ್ರವಾಶದಿಂದ ನನ್ನ ವೃತ್ತಿಯಲ್ಲಿ ಸ್ವಲ್ಪ ಆರ್ಥಿಕ ಸಹಾಯಕ್ಕೆ ತೊಂದರೆಯಾಯಿತಾದರೂ, ಬೇರೆ ರೀತಿಯಲ್ಲಿ ನನಗೆ ಹೆಚ್ಚು ಸಹಾಯವೂ ಆಯಿತು. ನಾನು ಸರ್ಕಾರಿ ನೌಕರಿಯನ್ನು ಬಿಟ್ಟಾಗ, ವಯಸ್ಸು ಆದ ನಂತರ ನಿವೃತ್ತಿ ವೇತನ ಪಡೆಯುವ ಅವಕಾಶ ತಪ್ಪಿತಲ್ಲಾ ಎಂಬ ಕಳಕಳಿ ನನ್ನ ತಂದೆಗೆ ಮತ್ತು ಬಂಧುಗಳಿಗೆ ಉಂಟಾಗಿತ್ತು. ನನಗೂ ವಯಸ್ಸಾದ ನಂತರ ಆರ್ಥಿಕ ಸಹಾಯಕ್ಕೆ ಬೇರೊಬ್ಬರನ್ನು ಯಾಚಿಸಬೇಕಾದ ಸಂದರ್ಭಗಳು ವಯಸ್ಸಾದ ಮೇಲೆ ಅರಿವಾಯಿತು. ಆದರೆ ಸರ್ಕಾರದ ಆಣತಿಯಂತೆ ಫ್ರೀಡಂ ಫೈಟರ್ಸ್‌ ಪೆನ್‌ಷೆನ್‌, ಆರಂಭದಲ್ಲಿ ಮಾಹೆಯಾನ 100/- ರೂನಿಂದ ಈಗ ಮಾಹೆಯಾನ ರೂ. 300/- ರೂಗಳನ್ನು ಪಡೆಯುತ್ತಿದ್ದೇನೆ. ಇಷ್ಟರಲ್ಲೇ 500/- ರೂಗೆ ಹೆಚ್ಚು ಮಾಡುವುದಾಗಿ ಮುಖ್ಯಮಂತ್ರಿಗಳು ಹೇಳಿದ್ದಾರೆ.     D.book.forEach(pg=>{const kb=(D.bookKn[pg.n-1]||[])[0]||'';const a=$('a','tp','<b>'+pg.n+'</b><span>'+esc(LANG==='kn'?kb.slice(0,70):((D.psum&&D.psum[pg.n])||(pg.b[0]||'').slice(0,60)))+'</span>');a.href='#book-p'+pg.n;g.appendChild(a)});
    m.appendChild(g);return;
  }
  const n=+mt[1];const pg=D.book.find(x=>x.n===n);if(!pg){location.hash='book';return}
  m.appendChild($('div','lab',(LANG==='kn'?'ನನ್ನ ಬದುಕು · ಪುಟ '+n+' / '+D.book.length:'My Life · page '+n+' of '+D.book.length)));
  const art=$('article','page');
  if(LANG==='kn'){(D.bookKn[n-1]||[]).forEach(b=>art.appendChild($('p',null,esc(b))))}else pg.b.forEach(b=>{art.appendChild($('p',null,linkText(b)))});m.appendChild(art);
  const nav=$('div','pnav');
  if(n>1){const a=$('a','chip','← Page '+(n-1));a.href='#book-p'+(n-1);nav.appendChild(a)}
  const c=$('a','chip','Contents');c.href='#book';nav.appendChild(c);
  if(n<D.book.length){const a=$('a','chip','Page '+(n+1)+' →');a.href='#book-p'+(n+1);nav.appendChild(a)}
  m.appendChild(nav);
}
function conns(){

  if(LANG==='kn')m.appendChild($('p','sub',KNCI));else m.appendChild($('p','sub','Ordinary marriages bring in a spouse’s family. These are the cases where two families were already related, or married into each other more than once. The map shows which families they join. Each one is also drawn in the tree: open it and look for the dashed gold link between relatives.'));

function everyone(){
  const m=document.getElementById('m');m.innerHTML='';
  m.appendChild($('h2',null,'Everyone in the memoir'));
  const inp=$('input');inp.type='search';inp.placeholder='Search by name…';m.appendChild(inp);
  const box=$('div');m.appendChild(box);
  function r(q){
    box.innerHTML='';q=q.toLowerCase();
    D.roots.forEach((rn,ri)=>{
      const ids=Object.values(P).filter(p=>!p.grp&&p.fams[0]===rn&&(p.name+' '+p.note+' '+(p.en||'')).toLowerCase().includes(q)).map(p=>p.id);
      if(!ids.length)return;
      box.appendChild($('div','lab',esc(rn)));box.appendChild(chips(ids));
    });
  }
  inp.oninput=()=>r(inp.value);r('');
}
const KNW={ck:'ಒಂದು ಪುಸ್ತಕದಲ್ಲಿ ಹೇಳಿದ ಒಂದು ಕುಟುಂಬ',h:'ನೊಣವಿನಕೆರೆ ಕುಟುಂಬ ವೃಕ್ಷ',lead:'ಡಾ. ನೊಣವಿನಕೆರೆ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಆತ್ಮಕಥೆ “ನನ್ನ ಬದುಕು” (1991) ಆಧಾರದ ಮೇಲೆ ಇದನ್ನು ರಚಿಸಲಾಗಿದೆ. ಪುಸ್ತಕದಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಎಲ್ಲರೂ ಇಲ್ಲಿದ್ದಾರೆ: ಅವರ ನಡುವಿನ ಸಂಬಂಧ, ಅವರ ಬಗ್ಗೆ ಪುಸ್ತಕ ಹೇಳುವ ಮಾತುಗಳು, ಮತ್ತು ಮದುವೆಯ ಮೊದಲೇ ಕುಟುಂಬಗಳು ಬೆಸೆದಿದ್ದ ಸ್ಥಳಗಳು.',how:'ಬಳಸುವ ವಿಧಾನ',
li:['<b>ಮಧ್ಯದಿಂದ ಪ್ರಾರಂಭಿಸಿ.</b> ಕುಟುಂಬ ವೃಕ್ಷ ಪುಟದಲ್ಲಿ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಪೂರ್ವಜರು ಮೇಲೆ, ಸಂಗಾತಿ ಪಕ್ಕದಲ್ಲಿ ಮತ್ತು ವಂಶಸ್ಥರು ಕೆಳಗೆ ಕಾಣುತ್ತಾರೆ.','<b>ಯಾವುದೇ ಕಾರ್ಡ್ ಒತ್ತಿ.</b> ಆ ವ್ಯಕ್ತಿಯನ್ನು ಮಧ್ಯದಲ್ಲಿಟ್ಟು ಅವರದೇ ವೃಕ್ಷ ತೆರೆಯುತ್ತದೆ; ಅದರ ಕೆಳಗೆ ಅವರ ಬಗ್ಗೆ ಪುಸ್ತಕದಲ್ಲಿರುವ ಭಾಗಗಳು ಲೇಖಕರ ಮಾತುಗಳಲ್ಲೇ ಇರುತ್ತವೆ. ಪುಟ ಸಂಖ್ಯೆ ಒತ್ತಿದರೆ ಪುಸ್ತಕದ ಆ ಪುಟ ತೆರೆಯುತ್ತದೆ.','<b>ಚುಕ್ಕೆಯ ಚಿನ್ನದ ಬಣ್ಣದ ಕಮಾನುಗಳು</b> ಬೇರೆ ಬೇರೆ ಮನೆಗಳಿಗೆ ಮದುವೆಯಾದ ಅಕ್ಕತಂಗಿಯರು ಅಥವಾ ಅಣ್ಣತಮ್ಮಂದಿರಂತಹ ಬೇರೆ ರೀತಿಯಲ್ಲಿ ಸಂಬಂಧಿಕರಾದವರನ್ನು ಜೋಡಿಸುತ್ತವೆ.','<b>ಕುಟುಂಬಗಳು</b> ಪುಟ ಪ್ರತಿ ಕುಟುಂಬವನ್ನು ಕೆಲವೇ ಸಾಲುಗಳಲ್ಲಿ ಮತ್ತು ಅವರ ನಡುವಿನ ಸಂಬಂಧವನ್ನು ವಿವರಿಸುತ್ತದೆ; ನಕ್ಷೆಗೂ ಮೊದಲು ಇದನ್ನು ಓದಿ.','<b>ಅಡ್ಡ ಸಂಬಂಧಗಳು</b> ಕುಟುಂಬಗಳ ನಕ್ಷೆಯನ್ನು ತೋರಿಸುತ್ತದೆ. ಸಂಖ್ಯೆ ಇರುವ ಚಿನ್ನದ ರೇಖೆಗಳು ಮೊದಲೇ ಸಂಬಂಧವಿದ್ದ ಅಥವಾ ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾರಿ ಮದುವೆಯಾದ ಕುಟುಂಬಗಳನ್ನು ಸೂಚಿಸುತ್ತವೆ; ಪ್ರತಿಯೊಂದಕ್ಕೂ ಒಂದು ಕಥೆ ಮತ್ತು ವೃಕ್ಷದಲ್ಲಿ ನೋಡಲು ಕೊಂಡಿ ಇದೆ.','<b>ಎಲ್ಲರೂ</b> ಹೆಸರು ಹುಡುಕಲು ಪಟ್ಟಿ. <b>ಪುಸ್ತಕ ಓದಿ</b> ಇಡೀ ಪುಸ್ತಕವನ್ನು ಪುಟ ಪುಟವಾಗಿ ಮೂಲ ಕನ್ನಡದಲ್ಲಿ ಓದಲು.','<b>← ಹಿಂದೆ</b> ಗುಂಡಿ ನೀವು ನೋಡಿದ ವ್ಯಕ್ತಿಗಳ ಹಾದಿಯಲ್ಲೇ ಹಿಂದೆ ಕರೆದೊಯ್ಯುತ್ತದೆ.'],
note:'ಪುಸ್ತಕದ ಭಾಗಗಳನ್ನು ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ ಪುಟಗಳಿಂದ ಯಂತ್ರದ ಮೂಲಕ ಓದಲಾಗಿದೆ; ಪದಗಳನ್ನು ಬದಲಾಯಿಸಿಲ್ಲ, ಆದರೆ ಅಕ್ಷರ ದೋಷಗಳಿರಬಹುದು. ಪುಸ್ತಕದಲ್ಲಿ ಹೆಸರಿಲ್ಲದವರಿಗೆ (“ಮೂವರು ಹೆಣ್ಣುಮಕ್ಕಳು”) ಪ್ರತ್ಯೇಕ ಪುಟ ಇಲ್ಲ.',go:'ವೃಕ್ಷ ತೆರೆಯಿರಿ →'};
const KNF=[
["ಕುಟುಂಬಗಳು ಹೇಗೆ ಹೊಂದಿಕೊಳ್ಳುತ್ತವೆ","ಪುಸ್ತಕ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಂದೆಯ ವಂಶ ಮತ್ತು ತಾಯಿಯ ವಂಶದಿಂದ ಪ್ರಾರಂಭವಾಗುತ್ತದೆ. ಇವು ಇಬ್ಬರು ಅಪರಿಚಿತರ ಕುಟುಂಬಗಳಲ್ಲ: ತಾಯಿ ತಂದೆಯ ತಾಯಿಯ ಅಣ್ಣನ ಮಗಳು, ಹೀಗಾಗಿ ಎರಡೂ ಬದಿಗಳು ನುಗ್ಗೆಹಳ್ಳಿಯ ಒಂದೇ ಮನೆಯಿಂದ ಬಂದಿವೆ. ನಂತರ ಅವರು ಕಡಬದ ಅಲಮೇಲು ಅವರನ್ನು ಮದುವೆಯಾದರು, ಇದು ಎರಡನೇ ಕುಟುಂಬ ಗುಚ್ಛವನ್ನು ತರುತ್ತದೆ. ಅವರ ಹತ್ತು ಮಕ್ಕಳ ಮದುವೆಗಳು ಇನ್ನೂ ಸುಮಾರು ಹತ್ತು ಕುಟುಂಬಗಳನ್ನು ತರುತ್ತವೆ. ಈ ಮನೆಗಳಲ್ಲಿ ಹಲವು ಮೊದಲೇ ಪರಸ್ಪರ ಪರಿಚಿತ ಅಥವಾ ಸಂಬಂಧಿಕರಾಗಿದ್ದ ಕಾರಣ ಕೆಲವು ಕೊಂಡಿಗಳು ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾರಿ ಕಾಣುತ್ತವೆ. ಅವೇ ಅಡ್ಡ ಸಂಬಂಧಗಳು."],
["ಗರುಡಾಚಾರ್ ಅವರ ತಂದೆಯ ವಂಶ (ಬಿಂಡಿಗನವಿಲೆ, ಕುತ್ಸ ಗೋತ್ರ)","ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಂದೆಯ ತಂದೆಯ ಕುಟುಂಬ; ಬಹುಶಃ ಮನೆದೇವರು ಶ್ರೀ ವೈನತೇಯರು ನೆಲೆಸಿರುವ ಬಿಂಡಿಗನವಿಲೆಯ ಮೂಲದವರು. ಗರುಡಾಚಾರ್ ಮತ್ತು ಲಕ್ಷ್ಮಮ್ಮ ಅವರ ಏಕೈಕ ತಿಳಿದ ಮಗ “ಭಲ್ಯದ” ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್. ಅವರು ನುಗ್ಗೆಹಳ್ಳಿಯ ಚನ್ನಮ್ಮ ಅವರನ್ನು ಮದುವೆಯಾದರು; ಅವರಿಗೆ ಶ್ರೀನಿವಾಸ (ದೊಡ್ಡಪ್ಪ), ಶ್ರೀರಂಗಮ್ಮ, ಗರುಡಮ್ಮ (ಅಕ್ಕಾಚಿ), ಎಗ್ಗಮ್ಮ ಮತ್ತು ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಂದೆ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್ ಜನಿಸಿದರು. ಗರುಡಾಚಾರ್ ಅವರ ಹಿಂದಿನ ತಲೆಮಾರುಗಳ ಬಗ್ಗೆ ಏನೂ ತಿಳಿದಿಲ್ಲ. ತಂದೆಯ ಸೋದರ ಸಂಬಂಧಿಗಳು (ಎಗ್ಗಮ್ಮನ ಮಕ್ಕಳು, ಶ್ರೀರಂಗಮ್ಮನ ಮಗ) ಸಹ ಈ ವಂಶಕ್ಕೆ ಸೇರುತ್ತಾರೆ."],
["ನುಗ್ಗೆಹಳ್ಳಿ ಕುಟುಂಬ (ಮೌದ್ಗಲ್ಯ ಗೋತ್ರ, ವಡಗಲೈ)","ಚನ್ನಮ್ಮ ಅವರ ಮತ್ತು ತಾಯಿಯ ಕಡೆ ರಾಮಕ್ಕಮ್ಮ ಅವರ ಮನೆ. ಇದು ಚನ್ನಕೇಶವ ಅಯ್ಯಂಗಾರ್ ಮತ್ತು ರಾಮಕ್ಕಮ್ಮ, ನಂತರ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್ ಮತ್ತು ಲಕ್ಷ್ಮಮ್ಮ, ನಂತರ ಕೇಶವ ಅಯ್ಯಂಗಾರ್ ಮತ್ತು ಅಜಮ್ಮ ಎಂದು ಸಾಗುತ್ತದೆ; ಹಿಂದಿನ ತಲೆಮಾರಿನಲ್ಲಿ ಚನ್ನಮ್ಮ ಮತ್ತು ನಾಚಾರಮ್ಮ ಅಕ್ಕತಂಗಿಯರು. ಕೇಶವ ಅವರ ಮಕ್ಕಳು ಅತ್ತಾವರದ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್, ಯದುಗಿರಿಯಮ್ಮ, ಹಿರಿಯ ಮಗಳು ಮತ್ತು ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಾಯಿ ರಾಮಕ್ಕಮ್ಮ. ಆದ್ದರಿಂದ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಂದೆತಾಯಿ ಸೋದರ ಸಂಬಂಧಿಗಳಾಗಿದ್ದರು: ತಾಯಿ ತನ್ನ ತಂದೆಯ ಸೋದರಿಯ ಮಗನನ್ನು ಮದುವೆಯಾದರು. ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅಜಮ್ಮನ ತವರೂರಾದ ಅತ್ತಾವರದಲ್ಲಿ, ಗ್ರಾಮ ಲೆಕ್ಕಿಗರ ತೊಟ್ಟಿ ಮನೆಯಲ್ಲಿ ಜನಿಸಿದರು."],
["ನೊಣವಿನಕೆರೆಯ ಕೊಬ್ಬರಿ ಕುಟುಂಬ (ಕಡಬ, ಶ್ರೀವತ್ಸ ಗೋತ್ರ)","ಚನ್ನಮ್ಮನ ತಂಗಿ ನಾಚಾರಮ್ಮ ಕಡಬದ ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್ ಅವರನ್ನು ಮದುವೆಯಾದರು; ಅವರು ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನೆಲೆಸಿ ಕೊಬ್ಬರಿ ವ್ಯಾಪಾರ ಮಾಡಿ “ಕೊಬ್ಬರಿ” ಎಂಬ ಹೆಸರು ಪಡೆದರು. ಅವರಿಗೆ ಮಕ್ಕಳಿರಲಿಲ್ಲ; ಆದ್ದರಿಂದ ಚನ್ನಮ್ಮ ತನ್ನ ಚೊಚ್ಚಲ ಮಗ ಶ್ರೀನಿವಾಸ (ದೊಡ್ಡಪ್ಪ) ಅವರನ್ನು ದತ್ತು ಕೊಟ್ಟರು, ಇದರಿಂದ ಅವರು ಶ್ರೀವತ್ಸ ಗೋತ್ರಕ್ಕೆ ಸೇರಿದರು. ಅವರ ಮಗ ದೇಶಿಕಾಚಾರ್, ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಅಣ್ಣ ಸೋದರ. ವೆಂಕಟಾಚಲರ ತಮ್ಮ ಕಡಬದ ವಾಧ್ಯಾರ್ ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್, ಚನ್ನಮ್ಮನ ಮಗಳು ಎಗ್ಗಮ್ಮನನ್ನು ಮದುವೆಯಾದರು. ಹೀಗೆ ಕೊಬ್ಬರಿ ಮನೆ ಮತ್ತು ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಂದೆಯ ಕುಟುಂಬ ಎರಡು ಬಾರಿ ಬೆಸೆದವು: ಇಬ್ಬರು ಅಕ್ಕತಂಗಿಯರ ಮೂಲಕ, ಮತ್ತು ದತ್ತು ಹಾಗೂ ಸಹೋದರರು–ಸೋದರಿಯರ ಮಕ್ಕಳ ನಡುವಿನ ಮದುವೆಯ ಮೂಲಕ. ನೊಣವಿನಕೆರೆಯ ಅವರ ಜಂಟಿ ಮನೆ, ಕಾಲರಾ ಕುಟುಂಬವನ್ನು ಚದುರಿಸುವವರೆಗೂ ಅವರಿಗೆ ಆಶ್ರಯ ನೀಡಿತು."],
["ಕಡಬದ ಅಲಮೇಲು ಅವರ ತಂದೆಯ ಕುಟುಂಬ (ಹಿರಿಯೂರು ಜೊಕ್ಕಣ್ಣ ಅವರ ಮನೆ)","ಅಲಮೇಲು ಅವರ ತಂದೆಯ ಕಡೆ. ವೇದ ಪಂಡಿತ, ಅಂಚೆ ಮಾಸ್ತರ್ ಮತ್ತು ಪ್ರಸಿದ್ಧ ತೋಟದ ಒಡೆಯ ಜೊಕ್ಕಣ್ಣ (ಚೊಕ್ಕಣ್ಣ) ಅಯ್ಯಂಗಾರ್ ಮತ್ತು ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಅವರಿಗೆ ಇಬ್ಬರು ಗಂಡುಮಕ್ಕಳು, ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್ (ಅಲಮೇಲು ಅವರ ತಂದೆ) ಮತ್ತು ಸುಂದರರಾಜ ಅಯ್ಯಂಗಾರ್, ಹಾಗೂ ಇಬ್ಬರು ಹೆಣ್ಣುಮಕ್ಕಳು, ಪುಟ್ಟತಾಯಮ್ಮ ಮತ್ತು ಕಮಲಮ್ಮ. ಪುಟ್ಟತಾಯಮ್ಮ ಅಲಮೇಲುಗೆ ಸಂಗೀತ ಮತ್ತು ಕೈಕೆಲಸ ಕಲಿಸಿ ಮದುವೆ ಏರ್ಪಡಿಸಿದರು; ಕಮಲಮ್ಮ ಮತ್ತು ಅವರ ಪತಿ ರಾಜ ಅಯ್ಯಂಗಾರ್ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಓದುವಾಗ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರಿಗೆ ಮನೆ ನೀಡಿದರು. ಅಪ್ಪಣ್ಣನಿಗೆ ಇಬ್ಬರು ಪತ್ನಿಯರು, ಇಬ್ಬರೂ ರಂಗಮ್ಮ. ಅಲಮೇಲು ಅವರ ತಾಯಿ ಎರಡನೆಯವರು, ಕಡಬದಲ್ಲಿ ಹೆಣ್ಣುಮಕ್ಕಳನ್ನು ಬೆಳೆಸಿದರು; ಅಲಮೇಲು ಅವರ ತಂಗಿ ಪದ್ಮಮ್ಮ (ಪದ್ದು) ಮೈಸೂರಿನ ಮನೆಗೆ ಮದುವೆಯಾದರು, ಅದು ನಂತರ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಮಕ್ಕಳಿಗೆ ಆಶ್ರಯ ನೀಡಿತು. ಸುಂದರರಾಜರ ಮಗ ಅಣ್ಣಯ್ಯ ನಂತರ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಸೋದರ ದೇಶಿಕಾಚಾರ್ ಅವರ ಮಗಳು ಮಹಾಲಕ್ಷ್ಮಿಯನ್ನು ಮದುವೆಯಾದರು."],
["ಅಲಮೇಲು ಅವರ ತಾಯಿಯ ಕುಟುಂಬ: ಅಳಸಿಂಗಾಚಾರ್ ಮತ್ತು ಕಡಬದ ದೀಕ್ಷಿತರು","ಅಲಮೇಲು ಅವರ ತಾಯಿ ರಂಗಮ್ಮ ಕಡಬದ ಅಳಸಿಂಗಾಚಾರ್ ಅವರ ಏಕೈಕ ಮಗಳು; ಅವರು ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಂದೆಯ ಜೊತೆ ಓದಿದವರು ಮತ್ತು ದೀಕ್ಷಿತ ಶ್ರೀ ರಂಗಾಚಾರ್ ಅವರ ಸೋದರಿಯನ್ನು ಮದುವೆಯಾಗಿದ್ದರು. ರಂಗಮ್ಮನ ಮದುವೆಯ ನಂತರ ಅಳಸಿಂಗಾಚಾರ್ ತಮ್ಮ ಗಂಡುಮಕ್ಕಳೊಂದಿಗೆ ಕರಾಚಿಗೆ ಹೋದರು. ಕಡಬದ ದೀಕ್ಷಿತರ ಕುಟುಂಬ, ಶ್ರೀ ರಂಗಾಚಾರ್ ಮತ್ತು ನಂತರ ಅಣ್ಣ ದೊರೆ ಅವರ ನೇತೃತ್ವದಲ್ಲಿ, ಮತ್ತೆ ಮತ್ತೆ ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತದೆ: ಅಣ್ಣ ದೊರೆ ಅವರ ತಂದೆಯ ಸೋದರಿ ಅಲಮೇಲು ಅವರ ತಾಯಿಯ ತಾಯಿ; ಅಣ್ಣ ದೊರೆ ಅವರ ಅಕ್ಕ ಹೆಚ್.ಆರ್. ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಾಯಿ, ಅವರ ಮಗ ಶ್ರೀಧರ್ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಕಿರಿಯ ಮಗಳು ಶೈಲಾ ಅವರನ್ನು ಮದುವೆಯಾದರು. ಇದೇ ಅಡ್ಡ ಸಂಬಂಧಗಳಲ್ಲಿ ವಿವರಿಸಿದ ದೀಕ್ಷಿತರ ಬಾಂಧವ್ಯ."],
["ಹಾಸನದ ರಾಜು ಅವರ ಕುಟುಂಬ (ಶಿಂಗಯ್ಯಂಗಾರ್ ಅವರ ಮನೆ)","ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಹಿರಿಯ ಮಗಳು ವಿನತಾಲಕ್ಷ್ಮಿ ಅವರ ಅತ್ತೆ ಮಾವನ ಮನೆ. ವಕೀಲ ವೆಂಕಟರಂಗ ಅಯ್ಯಂಗಾರ್ (ರಾಜು) ವಕೀಲ ಶಿಂಗಯ್ಯಂಗಾರ್ ಅವರ ಎರಡನೇ ಕುಟುಂಬದ, ತಾಯಿ ಜಯಮ್ಮನವರ ಹಿರಿಯ ಮಗ. ಅವರ ಅಣ್ಣಂದಿರು ಮತ್ತು ಬಾವಂದಿರು, ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್, ಅಪ್ಪು ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್ ಮತ್ತು ಕಸ್ತೂರಿರಂಗ ಅಯ್ಯಂಗಾರ್ ಸೇರಿದಂತೆ, ಹಲವು ವಿಧಗಳಲ್ಲಿ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಕಡೆಗೆ ಸಂಬಂಧಿಸಿರುವುದು ಕಂಡುಬರುತ್ತದೆ: ರಾಮಕೃಷ್ಣರ ಅತ್ತೆ ಅತ್ತಾವರದ ಅಲಮೇಲಮ್ಮ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ತಾಯಿಯ ಹತ್ತಿರದ ಬಂಧು; ಕಸ್ತೂರಿರಂಗ ಶಾಂತಿಗ್ರಾಮದ ದೀಕ್ಷಿತರೊಂದಿಗೆ ಮತ್ತು ಅಣ್ಣ ದೊರೆ ಅವರೊಂದಿಗೆ ಸಂಬಂಧ ಹೊಂದಿದ್ದರು. ಈ ಗುಪ್ತ ಸಂಬಂಧಗಳು ವಿನತಾ ಅವರ ಮದುವೆಯ ಮೊದಲಿನ ಅನಾಮಧೇಯ ಪತ್ರದ ಪ್ರಸಂಗವನ್ನು ಬಗೆಹರಿಸಿದವು. ಸರಳಾ ಅವರ ಮದುವೆಯ ಮೊದಲು ಬಾಬಣ್ಣ ಮತ್ತು ರಂಗಧಾಮ ಕೂಡ ರಾಜು ಅವರನ್ನು ವಿಚಾರಿಸಿ, ನಿಜವಾದ ಆರೋಪಗಳಿಲ್ಲವೆಂದು ತಿಳಿದುಕೊಂಡರು."],
["ಬಾಬಣ್ಣ ಅವರ ಕುಟುಂಬ, ಸುದರ್ಶನ ಮತ್ತು ಹೇಮಲತಾ","ಬಳೇಪೇಟೆ ಬೆಂಗಳೂರಿನ ಶ್ರೀ ಬಾಬಣ್ಣ, ರಂಗಧಾಮ ಅವರನ್ನು ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಎರಡನೇ ಮಗಳು ಸರಳಾ ಅವರಿಗೆ ಪರಿಚಯಿಸಿ ಅವರ ಮದುವೆಗೆ ಸಹಾಯ ಮಾಡಿದರು. ಪ್ರತಿಯಾಗಿ, ಬಾಬಣ್ಣ ಅವರ ಸೋದರಿ ರುಕ್ಕಮ್ಮನ ಪತಿ ಸುದರ್ಶನ ತಮ್ಮ ಏಕೈಕ ಮಗಳು ಹೇಮಲತಾ ಅವರನ್ನು ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಹಿರಿಯ ಮಗ ನಾಗರಾಜ ಅವರಿಗೆ ಮದುವೆ ಮಾಡಿಕೊಡುವ ಪ್ರಸ್ತಾಪ ತಂದರು, ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಒಪ್ಪಿದರು. ಬಾಬಣ್ಣ ಹಾಸನದ ಹಿರಿಯ ಅಳಿಯನಿಗೂ ಪರಿಚಿತರಾಗಿದ್ದರು. ರುಕ್ಕಮ್ಮ ಮತ್ತು ಬಾಬಣ್ಣ ಅಕ್ಕತಂಗಿ–ಅಣ್ಣತಮ್ಮ; ಆ ಮದುವೆಯ ನಂತರ ನಡೆದ ಘಟನೆಗಳ ಬಗ್ಗೆ ಡಾ. ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್ ಅವರ ಹೇಳಿಕೆ ಅವರದೇ ಆಗಿದ್ದು ಅವರಿಗೇ ಆರೋಪಿತವಾಗಿದೆ."],
["ಬೇಲೂರಿನ ರಂಗಧಾಮ ಅವರ ಕುಟುಂಬ","ಸರಳಾ ಅವರ ಪತಿ ರಂಗಧಾಮ ಅವರ ಕುಟುಂಬ: ಬೇಲೂರಿನ ಮೇಳಗೋಡು ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್ ಅವರ ಏಕೈಕ ಮಗ, ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲೇ ತಂದೆತಾಯಿಯನ್ನು ಕಳೆದುಕೊಂಡವರು, ಸಿಕಂದರಾಬಾದ್‌ನಲ್ಲಿ ಒಬ್ಬಳೇ ಸೋದರಿ. ಹಾಸನದ ದೂರದ ಬಂಧು ವಕೀಲ ಅಳಸಿಂಗಾಚಾರ್ ಅವರ ಮನೆಯಲ್ಲಿದ್ದು ಓದಿದರು, ಬೆಂಗಳೂರಿನಲ್ಲಿ ಬಾಬಣ್ಣ ಅವರ ಮನೆಯಲ್ಲಿ ವಾಸಿಸಿದರು. ಅವರು ಎಚ್.ಎಂ.ಟಿ.ಯಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಾರೆ; ದಂಪತಿಗೆ ನಂದಿನಿ ಮತ್ತು ಸೌಮಿನಿ ಎಂಬ ಇಬ್ಬರು ಹೆಣ್ಣುಮಕ್ಕಳು."],

const FAMS=[
{h:"How the families fit together",t:"The book begins with Dr. Krishna Iyengar's father's line and his mother's line. These are not two strangers' families: the mother was the daughter of the brother of the father's mother, so both sides come from the same house in Nuggehalli. Dr. Krishna Iyengar then marries Alamelu of Kadaba, which brings in a second cluster of families. His ten children's marriages bring in about ten more. Because many of these houses already knew or were related to each other, a few links appear more than once. Those are the cross-connections.",ps:[[73,"Dr. N. Krishna Iyengar"],[74,"Alamelu"]]},
{h:"Garudachar's paternal line (Bindiganavile, Kutsya gotra)",t:"Dr. Krishna Iyengar's father's father's family, probably natives of Bindiganavile, where the family deity Sri Vainateya is enshrined. Garudachar and Lakshmamma's only known son was Krishna Iyengar \"Bhalyada\". He married Chennamma of Nuggehalli and they had Srinivasa (Doddappa), Sriranagamma, Garudamma (Akkachi), Eggamma and Dr. Krishna Iyengar's father Narayana Iyengar. Nothing is known of the generations before Garudachar. Dr. Krishna Iyengar's first cousins (Eggamma's daughters, Sriranagamma's son) belong to this line too.",ps:[[30,"Garudachar"],[32,"Krishna Iyengar \"Bhalyada\""],[26,"Chennamma"],[66,"Narayana Iyengar (Dr. Krishna Iyengar's father)"],[42,"Sriranagamma"],[48,"Garudamma (Akkachi)"],[49,"Eggamma"]]},
{h:"The Nuggehalli family (Maudgalya gotra, Vadagalai)",t:"The house of Chennamma and, on the mother's side, of Ramakkamma. It runs Channakeshava Iyengar and Ramakkamma, then Ramaswamy Iyengar and Lakshmamma, then Keshava Iyengar and Ajamma, with Chennamma and Nacharamma as sisters in the earlier generation. Keshava's children were Narayana Iyengar of Attavara, Yadugiriyamma, an eldest daughter and Dr. Krishna Iyengar's mother Ramakkamma. This is why Dr. Krishna Iyengar's parents were cousins: his mother married her father's sister's son. Dr. Krishna Iyengar was born at Attavara, Ajamma's birthplace, in the courtyard house of the village accountant.",ps:[[1,"Channakeshava Iyengar"],[3,"Ramaswamy Iyengar"],[5,"Keshava Iyengar"],[6,"Ajamma"],[25,"Ramakkamma (Dr. Krishna Iyengar's mother)"],[8,"Narayana Iyengar of Attavara"],[13,"Yadugiriyamma"]]},
{h:"The Kobbari family of Nonavinakere (Kadaba, Srivatsa gotra)",t:"Nacharamma, Chennamma's younger sister, married Venkatachala Iyengar of Kadaba, who settled at Nonavinakere and traded in copra (kobbari), earning the name Kobbari. They were childless, so Chennamma gave them her firstborn Srinivasa (Doddappa) to adopt, which moved him into the Srivatsa gotra. His son was Deshikachar, Dr. Krishna Iyengar's elder cousin. Venkatachala's younger brother was the priest Srinivasa Raghavachar of Kadaba, who married Chennamma's daughter Eggamma. So the Kobbari house and Dr. Krishna Iyengar's father's family were joined twice: by two sisters, and by an adoption and a marriage between brothers and the sisters' children. Their joint house at Nonavinakere sheltered the family until the cholera epidemic scattered it.",ps:[[27,"Nacharamma"],[28,"Kobbari Venkatachala Iyengar"],[29,"Srinivasa (Doddappa)"],[35,"Kobbari Deshikachar"],[50,"Srinivasa Raghavachar"]]},
{h:"Alamelu's paternal family of Kadaba (Hiriyuru Jokkanna's house)",t:"Alamelu's father's side. Jokkanna (Chokkanna) Iyengar, a Vedic scholar and postmaster with a famous garden, and Mahalakshmamma had two sons, Appanna Iyengar (Alamelu's father) and Sundararaja Iyengar, and two daughters, Puttatayamma and Kamalamma. Puttatayamma trained Alamelu in music and handicrafts and arranged the wedding; Kamalamma and her husband Raja Iyengar housed Dr. Krishna Iyengar when he studied in Bangalore. Appanna had two wives, both called Rangamma. Alamelu's mother was the second, who raised the girls at Kadaba, and Alamelu's sister is Padmamma (Paddu), who married into the Mysore household that later sheltered Dr. Krishna Iyengar's children. Sundararaja's son Annayya later married Mahalakshmi, daughter of Dr. Krishna Iyengar's cousin Deshikachar.",ps:[[116,"Jokkanna Iyengar"],[117,"Mahalakshmamma"],[119,"Appanna Iyengar"],[120,"Rangamma (Alamelu's mother)"],[131,"Puttatayamma"],[132,"Kamalamma"],[128,"Sundararaja Iyengar"],[126,"Paddu"]]},
{h:"Alamelu's maternal family: Alasingachar and the Dikshitars of Kadaba",t:"Alamelu's mother Rangamma was the only daughter of Alasingachar, a Kadaba man who studied with Dr. Krishna Iyengar's father and was married to the sister of Dikshita Sri Rangachar. After Rangamma's wedding Alasingachar took his sons to Karachi. The Dikshitar family of Kadaba, led by Sri Rangachar and then Anna Durai, appears again and again: Anna Durai's father's sister was Alamelu's mother's mother, and Anna Durai's elder sister is the mother of H.R. Rangaswamy Iyengar, whose son Sridhar married Dr. Krishna Iyengar's youngest daughter Shaila. This is the Dikshitar tie described in the cross-connections.",ps:[[135,"Alasingachar"],[136,"Alasingachar's wife"],[142,"Sri Rangachar Dikshita"],[144,"Anna Durai"],[145,"Anna Durai's elder sister"]]},
{h:"Raju's family of Hassan (Shingayyangar's house)",t:"The in-laws of Dr. Krishna Iyengar's eldest daughter Vinatalakshmi. Lawyer Venkataranga Iyengar (Raju) was the eldest son of Lawyer Shingayyangar's second family, with his mother Jayamma. His elder brothers and brothers-in-law, among them Ramakrishna Iyengar, Appu Srinivasa Raghavachar and Kasturiranga Iyengar, turn out to be tied to Dr. Krishna Iyengar's side in several ways: Ramakrishna's mother-in-law Alamelamma was a close relative of Dr. Krishna Iyengar's mother, and Kasturiranga was connected to the Dikshitars of Shantigrama and to Anna Durai. These hidden relationships cleared up the anonymous-letter episode before Vinata's wedding. Before Sarala's wedding, Babanna and Rangadhama also checked with Raju, and learned that no real accusations existed.",ps:[[77,"Venkataranga Iyengar (Raju)"],[76,"Vinatalakshmi"],[152,"Lawyer Shingayyangar"],[153,"Jayamma"],[154,"Ramakrishna Iyengar"],[155,"Appu Srinivasa Raghavachar"],[159,"Kasturiranga Iyengar"],[9182,"Alamelamma"]]},
{h:"Babanna's family, Sudarshana and Hemalata",t:"Sri Babanna, of Balepet in Bangalore, introduced Rangadhama to Dr. Krishna Iyengar's second daughter Sarala and so helped her marriage. In return Dr. Krishna Iyengar agreed to the proposal of Babanna's sister Rukkamma's husband Sudarshana, for their only daughter Hemalata to marry Dr. Krishna Iyengar's eldest son Nagaraja. Babanna was also acquainted with Dr. Krishna Iyengar's eldest son-in-law of Hassan. Rukkamma and Babanna are sisters, and Dr. Krishna Iyengar's account of what followed that wedding is his own and is attributed to him.",ps:[[164,"Sri Babanna"],[167,"Sri Sudarshana"],[168,"Rukkamma"],[85,"Hemalata"],[84,"Dr. Nagaraj"]]},
{h:"Rangadhama's family of Belur",t:"The family of Sarala's husband Rangadhama: only son of Melagodu Rangaswamy Iyengar of Belur, orphaned young, with an only sister in Secunderabad. He studied in the house of his distant relative Lawyer Alasingachar of Hassan, and lived in Babanna's household in Bangalore. He works at HMT, and the couple have two daughters, Nandini and Saumini.",ps:[[89,"Rangadhama"],[161,"Melagodu Rangaswamy Iyengar"],[165,"Lawyer Alasingachar of Hassan"],[88,"Sarala (Chechamma)"]]},
{h:"The families of the other children's spouses",t:"Suparna married Prabha, daughter of T. Narasimha Iyengar of Tondavadi (Nanjangud); her mother is the younger sister of the wife of Ramaswamy Iyengar, son of Dr. Krishna Iyengar's aunt Sriranagamma, so Prabha was already related. Devaki married Vijayasimha, a Madhva Vaishnava of the Telephone Department, in a registered marriage; his parents are devout and from a different tradition. Nalini married Prasannakumar of Magadi, whose father was a Deputy Director in Sericulture. Shaila married Sridhar of Kota (H.R. Rangaswamy Iyengar's son), tied to the Dikshitars. Ramesh married Ratna, daughter of the Advaita Brahmin Narayana Rao of South Kanara. Jairam married Jayalakshmi, daughter of Keshava Iyengar and Sitalakshmi of Belur, found by Vinatalakshmi.",ps:[[169,"T. Narasimha Iyengar"],[171,"Vijayasimha's father"],[173,"Prasannakumar's father"],[147,"H.R. Rangaswamy Iyengar"],[180,"Narayana Rao"],[176,"Keshava Iyengar of Belur"]]},
{h:"Dr. Krishna Iyengar's own household",t:"Dr. Krishna Iyengar and Alamelu had ten children: Vinatalakshmi, Nagaraja, Sarala (Chechamma), Devaki, Nalini, Suparna, Jairam, Sridhara, Shaila and Ramesh. Most were born at Kadaba, in Alamelu's mother's house, and Shaila at Huliyar. Their spouses and their children, down to the great-grandchildren in an Arab country, are described on each person's page.",ps:[[76,"Vinatalakshmi"],[84,"Dr. Nagaraj"],[88,"Sarala"],[92,"Devaki"],[96,"Nalini"],[100,"Suparna"],[104,"Jairam"],[106,"Sridhara"],[108,"Shaila"],[112,"Ramesh"]]}
];

function families(){

  m.appendChild($('p','sub','A short guide to each family and how they connect, to read before the family map on the Cross-connections page. Names are links to each person’s tree.'));

function route(){
  let h=location.hash.slice(1);
  ['nh','nc','na','nb','nf'].forEach(i=>document.getElementById(i).classList.remove('on'));
  if(!h||h==='welcome'){welcome()}
  else if(h==='connections'){document.getElementById('nc').classList.add('on');conns()}
  else if(h==='book'||/^book-p\d+$/.test(h)){document.getElementById('nb').classList.add('on');reader(h)}
  else if(h==='families'){document.getElementById('nf').classList.add('on');families()}
  else if(h==='everyone'){document.getElementById('na').classList.add('on');everyone()}
  else{
    if(h==='home'){h=AU;document.getElementById('nh').classList.add('on')}
    if(!P[h])h=AU;person(h);
  }
  trDom();window.scrollTo(0,0);
}

}
