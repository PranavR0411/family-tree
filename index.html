  return personDesk(id);
}
function personDesk(id){
  const p=P[id];const m=document.getElementById('m');m.innerHTML='';LINKS=[];
  m.appendChild($('h2',null,esc(p.name)));
  m.appendChild($('p','sub',esc(p.note||'')));
  const sc=$('div','scroll');const stage=$('div','stage');sc.appendChild(stage);
  const col=$('div','col');
  // ancestors
  const cen=$('div','col');
  const dn=desc(id,0,true);
  // ancestors as a shared graph: each person once, placed by generation
  const lvl={};lvl[id]=0;const st=[id];
  const roots=[id].concat(P[id].spouses);
  roots.forEach(r=>{lvl[r]=0});
  st.push(...P[id].spouses);
  while(st.length){const n=st.pop();P[n].parents.forEach(q=>{if((lvl[q]===undefined)||lvl[q]<lvl[n]+1){lvl[q]=lvl[n]+1;st.push(q)}})}
  const reach=r=>{const s=new Set();const q=[r];while(q.length){const n=q.pop();P[n].parents.forEach(x=>{if(!s.has(x)){s.add(x);q.push(x)}})}return s};
  const rc=reach(id);const rs=new Set();P[id].spouses.forEach(s=>reach(s).forEach(x=>rs.add(x)));
  const ghost={};
  Object.keys(lvl).slice().forEach(n=>{(P[n].kin||[]).forEach(k=>{if(lvl[k.to]===undefined){lvl[k.to]=lvl[n];ghost[k.to]=n;P[k.to].spouses.forEach(sp=>{if(lvl[sp]===undefined){lvl[sp]=lvl[n];ghost[sp]=n}})}})});
  const maxL=Math.max(0,...Object.values(lvl));
  const levels=[];for(let k=0;k<=maxL;k++)levels.push([]);
  Object.keys(lvl).forEach(n=>levels[lvl[n]].push(n));
  const rank={};roots.forEach((r,i)=>rank[r]=i);
  for(let k=1;k<=maxL;k++){
    const kids=levels[k-1];
    const sc=n=>{const cs=kids.filter(c=>P[c].parents.includes(n));return cs.reduce((a,c)=>a+(rank[c]||0),0)/(cs.length||1)};
        const ng=levels[k].filter(n=>!ghost[n]).sort((x,y)=>sc(x)-sc(y));
    const out=[];ng.forEach(n=>{out.push(n);levels[k].filter(g=>ghost[g]===n).forEach(g=>out.push(g))});
    levels[k].filter(g=>ghost[g]&&!out.includes(g)).forEach(g=>out.push(g));
    levels[k]=out;
    levels[k].forEach((n,i)=>rank[n]=i);
  }
  const cardOf={};cardOf[id]=dn.card;P[id].spouses.forEach(s=>{if(dn.sc[s])cardOf[s]=dn.sc[s]});
  const AN=['','Parent','Grandparent','Great-grandparent','2nd great-grandparent','3rd great-grandparent','4th great-grandparent'];
  for(let k=maxL;k>=1;k--){
    const row=$('div','apars');
    // units = spouses on the same level kept together
    const nodes=levels[k].slice();const used={};const units=[];
    nodes.forEach(n=>{if(used[n])return;used[n]=1;const u=[n];P[n].spouses.forEach(sp=>{if(!used[sp]&&nodes.includes(sp)){used[sp]=1;u.push(sp)}});units.push(u)});
    units.forEach(u=>{const cp=$('div','cp');u.forEach((n,i)=>{if(i)cp.appendChild($('div','mar'));const side=rc.has(n)&&rs.has(n)?'Shared ancestor':(rs.has(n)?'Spouse’s '+AN[Math.min(k,6)].toLowerCase():AN[Math.min(k,6)]);const c=card(n,{rel:ghost[n]?'Linked relative':side,ghost:!!ghost[n]});cardOf[n]=c;cp.appendChild(c)});row.appendChild(cp)});
    cen.appendChild(row);
  }
  const g0=levels[0].filter(n=>ghost[n]);const done={};
  g0.forEach(n=>{if(done[n])return;done[n]=1;const sp=$('div');sp.style.width='40px';dn.row.appendChild(sp);const c=card(n,{rel:'Linked relative',ghost:true});cardOf[n]=c;dn.row.appendChild(c);
    P[n].spouses.forEach(q=>{if(ghost[q]&&!done[q]){done[q]=1;dn.row.appendChild($('div','mar'));const c2=card(q,{rel:'Linked relative',ghost:true});cardOf[q]=c2;dn.row.appendChild(c2)}})});
  Object.keys(cardOf).forEach(n=>{(P[n].kin||[]).forEach(k=>{if(cardOf[k.to]&&n<k.to)LINKS.push({type:'kin',a:cardOf[n],b:cardOf[k.to],label:k.label})})});
  const grpd={};
  Object.keys(lvl).forEach(n=>{if(cardOf[n]&&P[n].parents.length&&P[n].parents.every(q=>cardOf[q])){const key=P[n].parents.slice().sort().join('|');(grpd[key]=grpd[key]||{ps:P[n].parents,ks:[]}).ks.push(n)}});
  const offs={};
  Object.values(grpd).forEach(g=>{const lv=Math.max(...g.ps.map(q=>lvl[q]));offs[lv]=(offs[lv]||0);LINKS.push({type:'down',from:g.ps.map(q=>cardOf[q]),kids:g.ks.map(q=>cardOf[q]),off:offs[lv]++})});
  cen.appendChild(dn.el);
  stage.appendChild(cen);m.appendChild(sc);
  // relatives
  const sib=[...new Set(p.parents.flatMap(q=>P[q].children))].filter(x=>x!==id);
  if(sib.length){m.appendChild($('div','lab','Siblings'));m.appendChild(chips(sib))}
  const rel=D.conn.filter(c=>c.ids.includes(id)||c.focus===id);
  if(rel.length){m.appendChild($('div','lab','Cross-connections involving '+esc(p.name)));rel.forEach(c=>m.appendChild(story(c)))}
  storySection(id,m);
  m.appendChild($('p','legend','Click any card to open that person’s own family tree with them in the centre — ancestors above, descendants below, spouses beside. Gold line = marriage; the spouse’s own parents appear above too; a “↔ in N families” tag marks a person who belongs to more than one branch of the family; open them to move across.'));
  requestAnimationFrame(()=>{draw(stage);const t=stage.querySelector('.me');if(t){const s=sc;s.scrollLeft=Math.max(0,t.offsetLeft+t.offsetWidth/2-s.clientWidth/2)}});
  window.onresize=()=>draw(stage);
}

function network(){
  const wrap=$('div','netwrap');
  const N={au:['Dr. Krishna Iyengar’s family',0],raj:['Raju’s family, Hassan'],nug:['Nuggehalli family'],kob:['Kobbari family, Kadaba'],pat:['Garudachar’s paternal line'],pra:['Prabha’s family'],ala:['Alamelu’s family'],dik:['Dikshitars of Kadaba'],sha:['Shaila’s in-laws, Kota'],hem:['Hemalata’s family'],bab:['Babanna of Balepet']};
  const ring=['raj','nug','kob','pat','pra','ala','dik','sha','hem','bab'];
  const X={cross:[['nug','kob',0],['pat','kob',1],['pat','nug',2],['pat','ala',3],['ala','dik',4],['dik','sha',4],['pat','pra',5],['raj','nug',6],['hem','bab',7]],
           plain:[['au','pat'],['au','nug'],['au','ala'],['au','sha'],['au','pra'],['au','raj'],['au','hem']]};
  const W=1040,H=800;const pos={au:{x:420,y:390},raj:{x:420,y:100},nug:{x:720,y:100},kob:{x:930,y:250},pat:{x:720,y:370},pra:{x:930,y:520},ala:{x:720,y:640},dik:{x:420,y:720},sha:{x:130,y:640},hem:{x:130,y:390},bab:{x:130,y:130}};
  const NS='http://www.w3.org/2000/svg';const el=(n,at)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);return e};
  const svg=el('svg',{viewBox:'0 0 '+W+' '+H,class:'net'});
  const info=$('div','netinfo','Gold lines are cross-connections; the number matches the story below. Grey lines are ordinary marriage and descent, shown for context. Click a family or a gold line.');
  X.plain.forEach(([a,b])=>svg.appendChild(el('line',{x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y,class:'pl'})));
  const eg=[];
  X.cross.forEach(([a,b,s])=>{
    const A=pos[a],B=pos[b];
    const g=el('g',{class:'eg'});g.appendChild(el('path',{d:`M${A.x} ${A.y}L${B.x} ${B.y}`,class:'ed'}));
    const bx=(A.x+B.x)/2,by=(A.y+B.y)/2;
    g.appendChild(el('circle',{cx:bx,cy:by,r:12,class:'eb'}));const tx=el('text',{x:bx,y:by+4,class:'et'});tx.textContent=s+1;g.appendChild(tx);
    g.onclick=()=>show(N[a][0]+'  ↔  '+N[b][0],[s],g,[a,b]);eg.push({g,a,b,s});svg.appendChild(g);
  });
  const nodes={};
  Object.keys(N).forEach(k=>{
    const f=N[k][0];const g=el('g',{class:'ng'+(k==='au'?' au':'')});const w=Math.max(130,f.length*7.6+26);
    g.appendChild(el('rect',{x:pos[k].x-w/2,y:pos[k].y-18,width:w,height:36,rx:18,class:'nr'}));
    const tx=el('text',{x:pos[k].x,y:pos[k].y+5,class:'nt'});tx.textContent=f;g.appendChild(tx);nodes[k]=g;
    g.onclick=()=>{const ss=[...new Set(eg.filter(e=>e.a===k||e.b===k).map(e=>e.s))];if(k==='au'){location.hash='home';return}show(f,ss,null,[k])};
    svg.appendChild(g);
  });
  function show(title,ss,g,fl){
    eg.forEach(e=>e.g.classList.remove('sel'));Object.values(nodes).forEach(n=>n.classList.remove('sel'));
    if(g)g.classList.add('sel');fl.forEach(f=>nodes[f].classList.add('sel'));
    if(!g)eg.forEach(e=>{if(fl.includes(e.a)||fl.includes(e.b))e.g.classList.add('sel')});
    info.innerHTML='<b>'+esc(title)+'</b>';
    ss.forEach(s=>{const c=D.conn[s];const b=$('div','mini','<b>'+(s+1)+'. '+esc(c.t)+'</b><span>'+esc(c.x)+'</span>');const go=$('a','go','See it in the tree →');go.href='#'+c.focus;b.appendChild(go);info.appendChild(b)});
  }
  wrap.appendChild(svg);wrap.appendChild(info);return wrap;
}
function story(c){
  const b=$('div','cx','<h3>'+esc(c.t)+'</h3><p>'+esc(c.x)+'</p>');
  b.appendChild(chips(c.ids));
  const go=$('a','go','See it in the tree →');go.href='#'+c.focus;b.appendChild(go);return b;
}

const AL=[];Object.values(P).forEach(p=>(p.al||[]).forEach(a=>AL.push([a,p.id])));
AL.sort((x,y)=>y[0].length-x[0].length);
const ALMAP={};AL.forEach(([a,i])=>{if(!ALMAP[a])ALMAP[a]=i});
const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const ALRX=new RegExp('(?<![A-Za-z])('+AL.map(x=>rxEsc(x[0])).join('|')+')(?![A-Za-z]|-in-law)','g');
function linkText(txt,skip){return esc(txt).replace(ALRX,(m)=>{const i=ALMAP[m.replace(/&amp;/g,'&')]||ALMAP[m];if(!i||i===skip)return m;return '<a class="nl" href="#'+i+'">'+m+'</a>'})}
function markText(txt,als){const rx=new RegExp('(?<![A-Za-z])('+als.map(rxEsc).join('|')+')(?![A-Za-z]|-in-law)','g');return esc(txt).replace(rx,'<mark>$1</mark>')}
function passages(id){
  const als=P[id].al||[];if(!als.length)return [];
  const rx=new RegExp('(?<![A-Za-z])('+als.map(rxEsc).join('|')+')(?![A-Za-z]|-in-law)');
  const out=[];D.book.forEach(pg=>pg.b.forEach(b=>{if(rx.test(b))out.push({n:pg.n,t:b})}));return out;
}
function pcard(x,als){const d=$('div','pg','<div class="pn"><a href="#book-p'+x.n+'">Page '+x.n+'</a></div><p>'+markText(x.t,als)+'</p>');return d}
function citeLinks(txt){
  return esc(txt).replace(/\((pp?\.) ([^)]*)\)/g,(a,pp,nums)=>'<span class="cite">('+pp+' '+nums.replace(/\d+/g,n=>'<a href="#book-p'+n+'">'+n+'</a>')+')</span>');
}
function storySection(id,m){
  const p=P[id];
  if(id===D.author){const b=$('div','cx','<h3>His own story</h3><p>This whole book is Dr. Krishna Iyengar’s account of his life. Names in the text link to each person’s tree.</p>');const a=$('a','go','Start reading →');a.href='#book-p1';b.appendChild(a);m.appendChild(b)}
  const s=(D.sums||{})[id];if(!s)return;
  m.appendChild($('div','lab','Their story, from the book'));
  const box=$('div','story');
  s.split('\n\n').forEach(t=>box.appendChild($('p','sum',citeLinks(t))));
  m.appendChild(box);
}
function reader(h){
  const m=document.getElementById('m');m.innerHTML='';
  const mt=/^book-p(\d+)$/.exec(h);
  if(!mt){
    m.appendChild($('h2',null,'My Life'));
    m.appendChild($('p','sub','The memoir by Dr. Nonavinakere Krishna Iyengar (1991), in English translation. Open any page; names link to family trees.'));
    const g=$('div','toc');
    D.book.forEach(pg=>{const a=$('a','tp','<b>'+pg.n+'</b><span>'+esc((pg.b[0]||'').slice(0,60))+'</span>');a.href='#book-p'+pg.n;g.appendChild(a)});
    m.appendChild(g);return;
  }
  const n=+mt[1];const pg=D.book.find(x=>x.n===n);if(!pg){location.hash='book';return}
  m.appendChild($('div','lab','My Life · page '+n+' of '+D.book.length));
  const art=$('article','page');pg.b.forEach(b=>{art.appendChild($('p',null,linkText(b)))});m.appendChild(art);
  const nav=$('div','pnav');
  if(n>1){const a=$('a','chip','← Page '+(n-1));a.href='#book-p'+(n-1);nav.appendChild(a)}
  const c=$('a','chip','Contents');c.href='#book';nav.appendChild(c);
  if(n<D.book.length){const a=$('a','chip','Page '+(n+1)+' →');a.href='#book-p'+(n+1);nav.appendChild(a)}
  m.appendChild(nav);
}
function conns(){
  const m=document.getElementById('m');m.innerHTML='';
  m.appendChild($('h2',null,'Cross-connections'));
  m.appendChild($('p','sub','Ordinary marriages bring in a spouse’s family. These are the cases where two families were already related, or married into each other more than once. The map shows which families they join. Each one is also drawn in the tree: open it and look for the dashed gold link between relatives.'));
  m.appendChild(network());
  D.conn.forEach((c,i)=>{const b=story(c);b.querySelector('h3').insertAdjacentText('afterbegin',(i+1)+'. ');m.appendChild(b)});
}
function everyone(){
  const m=document.getElementById('m');m.innerHTML='';
  m.appendChild($('h2',null,'Everyone in the memoir'));
  const inp=$('input');inp.type='search';inp.placeholder='Search by name…';m.appendChild(inp);
  const box=$('div');m.appendChild(box);
  function r(q){
    box.innerHTML='';q=q.toLowerCase();
    D.roots.forEach((rn,ri)=>{
      const ids=Object.values(P).filter(p=>!p.grp&&p.fams[0]===rn&&(p.name+' '+p.note).toLowerCase().includes(q)).map(p=>p.id);
      if(!ids.length)return;
      box.appendChild($('div','lab',esc(rn)));box.appendChild(chips(ids));
    });
  }
  inp.oninput=()=>r(inp.value);r('');
}
function welcome(){
  const m=document.getElementById('m');m.innerHTML='';
  const c=$('div','cover','<div class="ck">A family, as told in one book</div><h2>The Nonavinakere Family Tree</h2><p class="lead">Built from <i>My Life</i>, the memoir of Dr. Nonavinakere Krishna Iyengar (1991), translated into English. Everyone named in the book is here, with how they are related, what the book says about them, and the places where the families were already linked before a marriage joined them.</p>'
  +'<h3>How to use it</h3><ol class="how"><li><b>Start at the centre.</b> The home page shows Dr. Krishna Iyengar with his ancestors above, his spouse beside him and his descendants below.</li>'
  +'<li><b>Click any card.</b> That person’s own tree opens with them at the centre, followed by a summary of everything the book says about them. Page numbers in the summary open the book at that page.</li>'
  +'<li><b>Dashed gold arcs</b> on a tree join relatives who are kin in some other way, such as sisters or brothers who married into different houses.</li>'
  +'<li><b>Cross-connections</b> shows the family map. Numbered gold lines mark families that were already related or intermarried more than once, with a story for each and a link to see it in the tree.</li>'
  +'<li><b>Everyone</b> is an alphabetical list for finding a name. <b>Read the book</b> is the full translation, page by page, and names in it link back to trees.</li>'
  +'<li>The <b>← Back</b> button retraces the people you have visited.</li></ol>'
  +'<p class="note">Summaries are written from the English translation. Where the book gives two dates or a view of a person, it is attributed to the author. Unnamed people (“three daughters”) have no page of their own.</p>');
  const a=$('a','go','Open the tree →');a.href='#home';c.appendChild(a);m.appendChild(c);
}
function route(){
  let h=location.hash.slice(1);
  ['nh','nc','na','nb'].forEach(i=>document.getElementById(i).classList.remove('on'));
  if(!h||h==='welcome'){welcome()}
  else if(h==='connections'){document.getElementById('nc').classList.add('on');conns()}
  else if(h==='book'||/^book-p\d+$/.test(h)){document.getElementById('nb').classList.add('on');reader(h)}
  else if(h==='everyone'){document.getElementById('na').classList.add('on');everyone()}
  else{
    if(h==='home'){h=AU;document.getElementById('nh').classList.add('on')}
    if(!P[h])h=AU;person(h);
  }
  window.scrollTo(0,0);
}
document.getElementById('back').onclick=()=>history.back();
document.getElementById('mode').onclick=()=>{MODE=MODE==='phone'?'desktop':'phone';try{localStorage.setItem('mode',MODE)}catch(e){}applyMode();route()};
applyMode();
addEventListener('hashchange',route);route();
</script>
