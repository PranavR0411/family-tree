ere was stopped by a court order. He was then appointed Pharmacist at Suttur Hospital in Nanjangud taluk, a gift of the Suttur Swamiji (Sri Shivaratri Swamiji), where he learned astrology and the Panchanga from Dr. Subrahmanya Iyer. He was then posted to Hosa Agrahara in K.R. Nagar taluk, transferred to Huliyar, then Bukkapatna, then Sira, after a complaint by the incompetent doctor at Huliyar who resented people taking the well-dressed pharmacist for the doctor. He studied privately and obtained a Homeopathic Diploma, and, on Rs. 35 a month, resigned in about 1944 to open his \"Vinata Aushadhalaya\" clinic at Huliyar, with his father's reluctant agreement. He bought a bicycle for Rs. 100 and learned to ride it. (pp. 35–42)\n\nIn 1945, before Independence, Advocate K. Rangayyangar, President of the Tumkur District Congress, announced at a public meeting that he was President of the new Congress branch at Huliyar. He became a political notable up to taluk, district and regional levels, but his practice suffered. After Independence ministers such as T. Subrahmanya, M.V. Ramarao and Chennigaramayya respected his word, and villagers came to him to settle family disputes. He held a long list of offices (Hobli Congress President, Hindi Prachar Sabha, Khadi Gramodyoga Mandal, town and house-building co-operative societies at Huliyar, founding director of two multipurpose societies, member of the Tumkur District Congress Committee and the Taluk Development Board, and others) and now receives the Freedom Fighters' pension, Rs. 300 a month. He never sought a politician's recommendation for his children's colleges or jobs. He declined invitations for Alamelu to enter politics, though she did indirect work and was made President of the Women's wing of the Hobli Committee. (pp. 42–44, 111–113)\n\nHe raised ten children, kept households in two places (Huliyar and Tumkur) while his father, Ammalakka and the studying children lived at Tumkur and Tiptur, and bought a house in Somesvarapuram, Tumkur, for Rs. 7,500. His father died on 9.6.1964 at Tumkur; the rites were done at Mysore with the help of Krishna Iyengar and Thirumalachar. Nagaraja's government job, Suparna's job at the Bangalore ITI Factory and RMS and his rented house in Seshadripuram brought the family to Bangalore from 1966 onwards, and Dr. Krishna Iyengar stayed on at Huliyar and visited monthly. He arranged the weddings of his five daughters (Vinata in Tumkur on 24.5.1957, Sarala on 17.5.1970, Nalini on 29.11.1979, Shaila on 26.11.1982, with Devaki marrying by registered marriage) and his sons' (Nagaraja on 16.5.1971, Suparna's own arrangement, Ramesh on 8.4.1983, Jairam on 11.5.1986). He sold the Kadaba paddy fields, the Tumkur house (for Rs. 90,000) and a Huliyar site to pay for weddings. (pp. 44–106)\n\nHe had an enlarged prostate that he neglected; urinary retention struck at Belur, and he underwent a minor and a major operation at Hassan, a third at Victoria Hospital under Dr. B.T. Sampathkumar, and a fourth for an incisional hernia at K.C. General under Dr. Srinivas, after which he lay unconscious for three or four days and received blood. Alamelu died on 23.9.1985; he writes that she closed her eyes feeling her birth fulfilled. He now lives in Bangalore under the shelter of his third son Jairam and his wife Lakshmi, who he says give him no harassment. He regrets that he made no property for his children but takes comfort that none was made a debtor, since he has always feared debt, and that they built their own houses. The book closes with his accounts of travel (a South India tour in 1962, North India tours with Alamelu and others), the prices of the old days, and his sweet memories of walking to Melukote with friends. (pp. 72–116)", "p81-satyaprakash": "Husband of Jayashri (Vinatalakshmi's only daughter) and a distant relative of Dr. Krishna Iyengar's family. Jayashri was married to him at a very young age. He works in an Arab country, where the family lives with their two children, Sandeepa and Durga. They come to India for one month each year and stay with everyone. (p. 89)", "p82-sandeepa": "Eldest son of Jayashri and Satyaprakash and Dr. Krishna Iyengar's great-grandson. He is doing his primary education in an Arab country with his parents. (p. 89)", "p83-durga": "Daughter of Jayashri and Satyaprakash and Dr. Krishna Iyengar's great-granddaughter. She is doing her primary education in an Arab country with her father and mother. The family comes to India for one month each year. (p. 89)", "p123-his-wife": "Wife of Raju, Alamelu's half-brother. She is the daughter of Dr. Krishna Iyengar's friend Ramaswamy Iyengar, who was the son of Seshamma, the elder sister of Tirunarayana Iyengar of Nonavinakere. Raju and she settled in Mysore. She is not named in the book. (p. 28)", "p141-dikshitar-family-of-kada": "The Dikshitar family of Kadaba, from which two lines of Dr. Krishna Iyengar's connections descend. Alamelu's mother's mother and the mother of Shaila's father-in-law were both daughters of this family. Alamelu's mother Rangamma's mother came from it, and Dikshita Sri Rangachar and his son Anna Durai belonged to it. Through this the families of Alamelu's mother and of Shaila's husband were joined again. The Dikshitars of Shantigrama, to whom Kasturiranga Iyengar was related, are said to be relatives of Anna Durai. (pp. 30, 47)", "p143-his-wife": "Wife of Dikshita Sri Rangachar of Kadaba and mother of Dikshita Anna Durai. The book does not name her. (p. 29)", "p146-her-husband": "Husband of Dikshita Anna Durai's elder sister and the father of H. R. Rangaswamy Iyengar, Shaila's father-in-law. He worked in the Railway Department at Kota in Rajasthan. He is not named in the book. (p. 74)", "p151-first-wife-of-shingayyan": "An earlier wife of Lawyer Shingayyangar of Hassan. The book says only that Raju was the eldest son of the late lawyer's second family, with Srimati Jayamma, which implies a first family. She is not named. (p. 45)", "p158-a-sister-of-raju": "Wife of Kasturiranga Iyengar, who is called Raju's brother-in-law; the book does not say whose sister she is. When the Hassan wedding was called off, she and her husband tried to console Dr. Krishna Iyengar at their house. She is not named. (pp. 46–47)", "p161-melagodu-rangaswamy-iyen": "Father of Rangadhama, of Melagodu and the Kaushika gotra, Vadagalai tradition. Rangadhama was his only son. Both he and his wife had died before Sarala's wedding. (p. 64)", "p162-his-wife": "Wife of Melagodu Rangaswamy Iyengar and mother of Rangadhama. She had died before Sarala's wedding, as had her husband. She is not named. (p. 64)", "p163-a-sister": "Rangadhama's only sister, who lived in Secunderabad. Since she was his nearest family, Sarala was taken there to be shown to her and her approval obtained, and the engagement was settled there. She is not named. (pp. 63–64)", "p170-his-wife": "Mother of Prabha, Suparna's wife, and wife of the late T. Narasimha Iyengar of Tondavadi. Her elder sister was the wife of Ramaswamy Iyengar, the engineer who was the son of Dr. Krishna Iyengar's paternal aunt Sriranagamma, so her family is joined to Dr. Krishna Iyengar's own. She is not named. (pp. 6, 70)", "p171-vijayasimha-s-father": "Father of Vijayasimha, Devaki's husband. He and his wife were devout, and Vijayasimha was their only son. Neither they nor Devaki's family approved the match, since each side said the other was not their own community, and they did not attend the registered wedding. He is not named. (pp. 71–72, 91)", "p172-his-mother": "Mother of Vijayasimha, Devaki's husband. She and her husband were devout, and Vijayasimha was their only son. Neither she nor Devaki's family approved the match, and she did not attend the registered wedding. She is not named. (pp. 71–72, 91)", "p174-his-mother": "Mother of Prasannakumar, Nalini's husband. Dr. Krishna Iyengar calls her and her husband good, worthy people of good tradition. She is not named. (p. 73)", "p181-his-wife": "Wife of the late Narayana Rao and mother of Ratna, Ramesh's wife. Ratna's parents were orthodox Advaita Brahmins of South Kanara; Ratna has four brothers and an elder sister, all gentle. Ratna went to her mother's house for her delivery and was there when Alamelu died. She is not named. (pp. 79, 82, 104)"}, "psum": {"1": "Title page: My Life, by Dr. Nonavinakere Krishna Iyengar (1908–2006), written in 1991.", "2": "Note from his son Ramesh (Mohanram), July 2022, saying the text is exactly as his father wrote it.", "3": "Opening invocations to the family deity, and the start of the memoir in his eighty-third year.", "4": "His father's lineage: great-grandfather Garudachar, grandfather Krishna Iyengar, and grandmother Chennamma's family.", "5": "How Chennamma's son Srinivasa was adopted by Nacharamma and Kobbari Venkatachala Iyengar, the copra trader of Nonavinakere.", "6": "His father's sisters: Sriranagamma's family, Garudamma (Akkachi), and Eggamma with her three daughters.", "7": "Eggamma's daughters Seetha (Kuttamma) and Jokkamma, and their husbands and children.", "8": "His father's history begins: grandfather \"Bhalyada\" Krishna Iyengar, and the blind Chennamma carried to Nonavinakere.", "9": "His father's schooling at Kadaba and Bangalore, the SSLC, and the railway signalman's job.", "10": "His father's 35 years as a schoolmaster, with a list of the villages he served.", "11": "His father's death in 1964, and his mother's lineage, with Yadugiriyamma's family.", "12": "The rest of his mother's side: Kamalamma, his maternal uncle Narayana Iyengar of Attavara, and her ancestors.", "13": "His birth house at Attavara, and Nacharamma's joint household at Nonavinakere.", "14": "His mother Ramakkamma, and his eldest sister Ammalakka married as a child.", "15": "Ammalakka's widowhood, and the birth of his sister Bhagirathi (Bai).", "16": "Bhagirathi's marriage to Shamanna, and the cholera epidemic that killed four in the house in a week.", "17": "The joint family scatters after the epidemic; his sister Pankaja; his own birth in 1908.", "18": "His birth at Attavara, how he was named, and his father's postings in Smarta villages.", "19": "The clay Ganapati brought by Devirmma, and the family's early life at Nonavinakere.", "20": "His mother's death in childbirth when he was three, and the household that remained.", "21": "His father does not remarry; Ammalakka raises the children; the move to Kandikere.", "22": "His brother Dore's illness and death; schooling at Kandikere; his father as Head Master.", "23": "Passing the Kannada L.S. exam in 1922, and his first struggle to continue English schooling.", "24": "Leaving high school, his father's retirement, and his own first teaching job.", "25": "His stalled education, and the offers of marriage, including one he refused at Nonavinakere.", "26": "His marriage is arranged through Cheluva Bhatta, and his wife's family background.", "27": "The eight-day wedding at Kadaba, and the family of Alamelu's father's father, Jokkanna Iyengar.", "28": "Alamelu's father Appanna Iyengar and his two wives, her uncle Sundararaja, and her aunt Puttatayamma.", "29": "Alamelu's aunt Kamalamma, and the family of her mother's father, Alasingachar.", "30": "Alasingachar's Dikshitar connection, and how the families rejoin through Shaila's husband.", "31": "The deaths of Alamelu's grandmother and Puttatayamma, and her aunt's skills.", "32": "The ages at the wedding, Alamelu's first years as a young bride, and his worries about livelihood.", "33": "Alamelu comes to his house; his pharmacist training in Bangalore at his wife's aunt's house.", "34": "Puttatayamma's death, his training at Victoria Hospital, and a falling-out that sent him to a hotel.", "35": "Starting practice at Nonavinakere, his coffee and provision shop, and gramophone evenings.", "36": "Alamelu's domestic skills, the wait for children, and Vinata's birth.", "37": "Dates of birth lost, Paddu's wedding, the birth of Nagaraja, and the house planned at Nonavinakere.", "38": "The court stay order stops the house; the move to government service and Suttur hospital.", "39": "The Suttur hospital and Swamiji, the family's life there, and travel by bullock cart.", "40": "Life at Suttur, Nagaraja's plague lump, and the first haircut at Bindiganavile.", "41": "Transfer to Huliyar, the poor doctor there, and his decision to leave government service.", "42": "Resigning in about 1944 to open his own clinic at Huliyar, and his first public work.", "43": "Being named President of the Huliyar Congress branch, and his work for the people.", "44": "Respect from officials and ministers, and buying a house in Tumkur.", "45": "The children's Upanayana, and the search for Vinata's groom, with the false anonymous letter.", "46": "The anonymous letter from Kadaba, and the groom's side calling off the arrangements.", "47": "His four-page letter, and how the truth emerged through Dikshita Anna Durai and others.", "48": "Meeting Alamelamma at Hassan, the wedding of Vinata, and the start of Nagaraja's medical education.", "49": "Nagaraja's schooling at Nonavinakere, and the decision to send him for medical studies.", "50": "Nagaraja's under-age admission, and Suparna sent to live with his grandfather.", "51": "Suparna's SSLC, and the beginning of the Tumkur household with his aged father.", "52": "Jairam sent to Tumkur, Nagaraja's last year of medical college, and two births at once.", "53": "Suparna fails his B.Sc., and Vinata's troubles in her husband's house at Hassan.", "54": "Vinata's difficulties with her in-laws and her husband's complaint letters.", "55": "Shinganna is taken back to Hassan, and the choice not to go to court.", "56": "Why he refused court action for Vinata, and how that household later became happy.", "57": "His father's illness and death in Tumkur in 1964, in his 97th year.", "58": "Tiptur clinic, two households, and Jairam and Sridhara left with their grandmother at Kadaba.", "59": "The government scheme for mixed-system doctors, and Suparna's job at the ITI factory.", "60": "Suparna in Bangalore, Ramesh's SSLC, and the Kadaba house sold in 1964.", "61": "The family comes to live in Bangalore through Suparna.", "62": "Everyone moves to Bangalore; Jairam at KGF; Sridhara at NGEF; the search for Sarala's groom begins.", "63": "Rangadhama is found through Babanna, and the rumours are cleared.", "64": "Sarala's engagement at Secunderabad and her wedding on 17.5.1970.", "65": "Rangadhama's household, and the proposal of Hemalata for Nagaraja.", "66": "Nagaraja's wedding to Hemalata on 16.5.1971, and the family's betrayal.", "67": "The concealed illness, and his grief at the deceit.", "68": "Nagaraja refuses to annul the marriage; his transfers; and the start of Suparna's wedding.", "69": "Suparna chooses his own bride from Nanjangud, and the wedding arrangements.", "70": "The Nanjangud wedding, Suparna's separate household, and the start of Devaki's story.", "71": "Devaki's career, her refusal of the chosen groom, and her registered marriage.", "72": "The aftermath of Devaki's marriage and its effect on Nalini's search.", "73": "Nalini's wedding, and the start of Shaila's story.", "74": "Ammalakka's death, selling the Tumkur house, and Shaila's groom's family.", "75": "Shaila's husband's family, and Ramesh's early training in drama.", "76": "Ramesh's drama studies, journalism, and leaving BEML for All India Radio.", "77": "Ramesh at Gulbarga, his house in Banashankari, and the first mention of a bride he found.", "78": "Ramesh asks consent to marry outside the community, and the father's reflections.", "79": "He consents; Ratna's family; and her adoption of the household's customs.", "80": "Ratna and the Sri Vaishnava initiation he suggests for her, and the household after Shaila's wedding.", "81": "Alamelu's diabetes, blood pressure and heart trouble, and her treatment in hospital.", "82": "The birth of Ramesh's daughter, Alamelu's last illness and death.", "83": "A summing up of Alamelu's life and character.", "84": "Alamelu died a sumangali; Jairam's decision not to marry while she lived.", "85": "Jairam agrees to marry; Jayalakshmi's family; the wedding in 1986.", "86": "Sridhara, \"the unfortunate\": training abandoned and his entry into politics.", "87": "Sridhara's papers and patrons, and his hardships.", "88": "Details of the family begin: his eldest son-in-law Raju, and the household's history.", "89": "Vinata's children, and Jayashri's family; his second son-in-law Rangadhama.", "90": "Rangadhama's character and his household, and the story of Sarala's good fortune.", "91": "Sarala's daughters Nandini and Saumini, and Devaki's family.", "92": "Devaki's life in her own home, her sons, and Nalini's wedding details.", "93": "Nalini's household, and the family of Shaila's husband.", "94": "Shaila's in-laws' Dikshita connection, and their son Abhijit.", "95": "The account of the daughters ends; the sons begin, with Nagaraj.", "96": "Hema and Nagaraj's household, and their son Garudadhwaja (Deepu).", "97": "Their daughter Jyothi, and his views on children's upbringing.", "98": "Suparna and Prabha, and his sadness at their distance from the family.", "99": "Prabha's family and the Rs. 10,000, and their sons Adarsh and Abhishek.", "100": "Jairam: his nature, his refusal to marry, and his devotion to his father.", "101": "Jayalakshmi and Jairam's wedding in 1986, and how she cares for him.", "102": "Sridhara's hardships and character, his wife Sridevi, and the start of Ramesh's account.", "103": "Ramesh's career in radio and television, his views, and his wife Ratna.", "104": "Ratna's family and character, and the two grandchildren, Alamelu and Pankaja.", "105": "Loss of property and income: his grandfather's lack of inherited wealth, and his father's losses.", "106": "The Kadaba field, the Tumkur house, and the use of the money.", "107": "Gifts to his grandchildren, savings, and his tribute to Alamelu's managemen ಹಿಂದಿನ ತಲೆಮಾರು ಗೊತ್ತಿಲ್ಲ. ಇವರುಗಳು ನಮ್ಮ ಮನೆ ದೇವರಾದ ಶ್ರೀ ವೈನತೇಯರು ನೆಲೆಸಿರುವ ಬಿಂಡಿಂಗನವಿಲೆ ಗ್ರಾಮದವರೆಂದು ನಂಬಲಾಗಿದೆ.", "ಈ ದಂಪತಿಗಳ ಏಕ ಮಾತ್ರ ಪುತ್ರ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌, ನನ್ನ ತಂದೆಯ ತಂದೆ (ನನ್ನ ತಾತ). ಇವರ ಸಹೋದರ ಸಹೋದರಿಯರ ಬಗ್ಗೆ ತಿಳಿದಿಲ್ಲ. ಬಹುಶಃ ಇವರು ಏಕಮಾತ್ರ ಪುತ್ರರಿರಬಹುದು. ಇವರ ಧರ್ಮಪತ್ನಿ ಚನ್ನಮ್ಮ (ನನ್ನ ತಂದೆಯ ತಾಯಿ) ಅಂದರೆ ನನ್ನ ಅಜ್ಜಿ. ಚನ್ನಮ್ಮ (ಹಾಸನ ಜಿಲ್ಲೆಯ) ನುಗ್ಗೆಹಳ್ಳಿ ಸ್ಥಳದವರು. ಅವರು ಹುಟ್ಟದ ಮನೆ ಗೋತ್ರ ಮೌದ್ಧಲ್ಬ. ವಡಗಲೈ ಸಂಪ್ರದಾಯ. ನನ್ನ ತಂದೆಯ ತಾಯಿ, (ನನ್ನ ಅಜ್ಜು ಚನ್ನಮ್ಮನವರ ತಂದೆ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌. ಅವರ ಧರ್ಮಪತ್ನಿ ಲಕ್ಷ್ಮಮ್ಮ ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರ ತಂದೆಯ ತಂದೆ (ತಾತ) ಚನ್ನಕೇಶವ ಅಯ್ಯಂಗಾರ್‌. ಅವರ ಧರ್ಮಪತ್ನಿ ರಾಮಕ್ಕಮ್ಮ ಇವರ ಹಿಂದಿನ ತಲೆಮಾರು ತಿಳಿದಿಲ್ಲ.", "ನನ್ನ ತಂದೆಯ ತಂದೆ, (ನನ್ನ ತಾತ) ಕೃಷ್ಣ ಅಯ್ಕಂಗಾರ್‌ ಅವರ ಧರ್ಮಪತ್ನಿ ಚನ್ನಮ್ಮ (ನನ್ನ ಅಜ್ಜಿಯವರ ಗರ್ಭಾಂಬುಧಿಯಲ್ಲಿ 2 ಗಂಡು ಮಕ್ಕಳು ಮತ್ತು 3 ಹೆಣ್ಣು ಮಕ್ಕಳು ಜನಿಸಿದರು. ಮೊದಲನೇ ಪುತ್ರ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌. (ನನ್ನ ತಂದೆಯ ಅಣ್ಣ). ನನ್ನ ದೊಡ್ಡಪ್ಪ ಎರಡನೆಯವರು ಶ್ರೀರಂಗಮ್ಮ ಮೂರನೆಯವರು ಗರುಡಮ್ಮ ನಾಲ್ಕನೆಯವರು ಎಗ್ಗಮ್ಮ - ಇವರುಗಳು ನನ್ನ ಸೋದರ ಅತ್ತೆಗಳು. ಐದನೆಯವರು (ಕೊನೆಯವರು), ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌. ಇವರೇ ನನ್ನ ತಂದೆ.", "ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರ ಕಿರಿಯ ಸಹೋದರಿ ನಾಚಾರಮ್ಮ ಇವರನ್ನು ಕಡಬ ಗ್ರಾಮದ ಶ್ರೀವತ್ಸ ಗೋತ್ರದ ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು. ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌ ಕಡಬದಿಂಂದ ತೆಂಗಿನ ನಾಡಾದ ನೊಣವಿನಕೆರೆಗೆ ಬಂದು ನೆಲೆಸಿ ಕೊಬ್ಬರಿ ವ್ಯಾಪಾರ ಮಾಡುತ್ತಿದ್ದರು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಎತ್ತಿನ ಬಂಡಿಗಳು ಇದ್ದಿಲ್ಲ. ಎತ್ತಿನ ಬೆನ್ನಿನ ಎರಡು ಪಕ್ಕಗಳಿಗೆ ಬಟ್ಟೆಯ ಎರಡು ದೊಡ್ಡ ಚೀಲಗಳನ್ನು ಕಟ್ಟಿ- ಇದಕ್ಕೆ ಹೇರು ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ಈ ಚೀಲಗಳಲ್ಲಿ ಎರಡೂ ಕಡೆಗಳಲ್ಲಿ ಕೊಬ್ಬರಿ ಹಾಕಿಕೊಂಡು (ಸುಲಿದದ್ದು) ಎತ್ತಿನ ಹಿಂಭಾಗದಲ್ಲಿ ಕಾಲ್ನಡಿಗೆಯಲ್ಲಿ, ನೊಣವಿನಕೆರೆಯಿಂದ ಬಳ್ಳಾರಿಗೆ, ಸುಮಾರು ಇನ್ನೂರು ಮೈಲಿ ಅಂದರೆ ಹೋಗಿ ಬರಲು 400 ಮೈಲಿ ಪ್ರಯಾಣ"], ["ಮಾಡಿಕೊಂಡು ವ್ಯಾಪಾರ ಮಾಡುತ್ತಿದ್ದರು. ಒಂದು ಸಾರಿ ನೊಣವಿನಕೆರೆಯಿಂದ ಬಳ್ಳಾರಿಗೆ ಹೋಗಿಬರಲು 15 ದಿನಗಳಾಗುತ್ತಿತ್ತು.", "ದಾರಿಯ ಮಧ್ಯೆ ರಾತ್ರಿಯಾದಾಗ, ಸಿಕ್ಕುವ ಗ್ರಾಮಗಳಲ್ಲಿ ತಂಗಿ, ಪ್ರಾತಃಕಾಲ ಎದ್ದು ಸ್ನಾನ ಸಂಧ್ಯಾವಂದನೆ, ಅಹ್ನಿಕ, ಅಡಿಗೆಗಳ ಮಾಡಿ ಊಟ ಮಾಡಿಕೊಂಡು ಮುಂದಕ್ಕೆ ಪ್ರಯಾಣ. ಇವರ ಬಟ್ಟೆ- ಉಡಲು ಪಂಚೆ, ಹೊದೆಯಲು ಒಂದು ಪಂಚೆ, ತಲೆಗೆ ಟವಲು ಸುತ್ತಿಕೊಳ್ಳುವುದು. ರಾತ್ರಿ ಹೊದೆಯಲು ಒಂದು ಕಂಬಳಿ. ರಾತ್ರಿ ಮಲಗಲು, ತಂಗಿರುವ ಗ್ರಾಮದಲ್ಲಿ ಕೇಳಿ ಒಂದು ಚಾಪೆ ಎರವಲು ಪಡೆಯುವುದು. ಗ್ರಾಮದಿಂದ ಹೊರಡುವಾಗ ಆ ಚಾಪೆ ಹಿಂತಿರುಗಿಸುವುದು. ಎತ್ತಿಗೆ ತಂಗಿರುವ ಗ್ರಾಮದಲ್ಲಿ ಹುಲ್ಲು ಕೇಳಿ ತಂದು ಹಾಕುವುದು. ಇವರು ಕೊಬ್ಬರಿ ವ್ಯಾಪಾರ ಮಾಡುತ್ತಿದ್ದುದ್ದರಿಂದ ಇವರಿಗೆ ಕೊಬ್ಬರಿ ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌ ಎಂಬ ಹೆಸರು ಬಂದಿತು. ಇವರು ಕೊಬ್ಬರಿ ವ್ಯಾಪಾರ ಮಾಡುತ್ತಿದ್ದುದ್ದರಿಂದ ಆಗಿನ ಕಾಲದಲ್ಲಿ ವ್ಯವಹಾರ ನಡೆಸುತ್ತಾ ಸಾಹುಕಾರರೆಂದು ಪರಿಗಣಿಸುತ್ತಿದ್ದರು.", "ಆಗಿನ ಕಾಲದಲ್ಲಿ 2-3 ಸಾವಿರ ರೂಪಾಯಿಗಳಿರುವವರೇ ಸಾಹುಕಾರರು. ಈ ದಂಪತಿಗಳಿಗೆ ಸಂತಾನ ಇರಲಿಲ್ಲ. ಆದ ಕಾರಣ, ನಾಚಾರಮ್ಮನ ಅಕ್ಕ, ಅಂದರೆ ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮ ತನ್ನ ಪ್ರಥಮ ಪುತ್ತ, ಅಂದರೆ ಜೇಷ್ಠ ಪುತ್ತ (ನನ್ನ ದೊಡ್ಡಪ್ಪ. ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ರನ್ನು ಹೆತ್ತ ತಕ್ಷಣ ತಂಗಿ ನಾಚಾರಮ್ಮನ ತೊಡೆಯ ಮೇಲೆ ಹಾಕಿ, ಇದು ನಿನ್ನ ಮಗು ಸಾಕಿಕೋ ಎಂದು ಹೇಳಿದರು. ಇದರಿಂದಾಗಿ ನನ್ನ ದೊಡ್ಡಪ್ಪ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌, ಕುತ್ಸ್ಯ ಗೋತ್ರದಿಂದ ಶ್ರೀವತ್ಸ ಗೋತ್ರಕ್ಕೆ ದತ್ತು ಆಗಿ ಇವರಿಗೂ ಮುಂದೆ ಕೊಬ್ಬರಿ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಎಂದೇ ಹೆಸರು ಬಂದಿತು. ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ಮೊದಲ ಪತ್ನಿ ಮೃತಳಾಗಿ, ಎರಡನೇ ಪತ್ನಿಯಲ್ಲಿ ಒಂದು ಗಂಡು ಮಗು ಇದ್ದು, ಅವನೇ ಹಾಲಿ ಮಲ್ಲೇಶ್ವರದಲ್ಲಿರುವ ನನ್ನ ಅಣ್ಣ ದೇಶಿಕಾಚಾರ್‌. ಇವನಿಗೂ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಕೊಬ್ಬರಿ ದೇಶಿಕಾಚಾರ್‌ ಎಂದೇ ಹೆಸರು. ಈ ದೇಶಿಕಾಚಾರ್‌ಗೆ ಬಿಂಂಡಿಂಗನವಿಲೆ ಗರುಡಾಚಾರ್‌ ಮತ್ತು ಯಗ್ಗಮ್ಮನವರ ಪುತ್ರಿ ತಿಮ್ಮಾಜಮ್ಮನವರೊಂದಿಗೆ ವಿವಾಹವಾಗಿ, (ಅವನಿಗೆ) ಮೂರು ಜನ ಗಂಡು ಮಕ್ಕಳು ಮತ್ತು ಐದು ಜನ ಹೆಣ್ಣು ಮಕ್ಕಳು ಆಗಿ, ಕಿರಿಯ ಮಗಳು ರುಕ್ಮಿಣಿ ಮೊನ್ನೆ ತಾನೇ ಮೃತಳಾದಳು. ಈ ಲೇಖನ ಬರೆಯುತ್ತಿರುವ ಕಾಲದಲ್ಲಿ ನನ್ನ ಅಣ್ಣ ಕೊಬ್ಬರಿ ದೇಶಿಕಾಚಾರ್‌ರವರಿಗೆ 90 ವರ್ಷ ವಯಸ್ಸಾಗಿ, ಕುಟುಂಬ ತಿಮ್ಮಾಜಮ್ಮ ಸಹ ಆರೋಗ್ಯದಿಂದಿದ್ದಾರೆ."], ["ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಕಂಗಾರ್‌ ಮತ್ತು ಚನ್ನಮ್ಮನವರ 2ನೇ ಸಂತಾನ ಶ್ರೀರಂಗಮ್ಮ ಶ್ರೀರಂಗಮ್ಮನನ್ನು, ಶ್ರೀನಿವಾಸ ಅಯ್ಕಂಗಾರ್‌ ಎಂಬುವವರಿಗೆ ಕೊಟ್ಟು ವಿವಾಹ. ಈ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಹೈಸ್ಕೂಲ್‌ ಅಧ್ಯಾಪಕರು. ಇವರ ಪುತ್ರ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌, ಇಂಜನಿಯರ್‌ ಆಗಿ ರಿಟೈರ್ಡ್‌ ಆಗಿದ್ದವರು. ಇವರ ಮಕ್ಕಳು ಬೆಂಗಳೂರು ಮಲ್ಲೇಶ್ವರಂ ಭಾಷ್ಕಂ ಪಾರ್ಕ್‌ ಬಳಿ ಮನೆ ಕಟ್ಟಿಕೊಂಡಿದ್ದಾರೆ. ಇವರುಗಳು ನನ್ನ ಎರಡನೇ ಸೊಸೆ ಪ್ರಭಾಳ ತಾಯಿ ಅಕ್ಕನ ಮಕ್ಕಳು. (ಈ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಹೆಸರು, ಅಮ್ಮಣ್ಳಿಯ ಮದುವೆ ಆಹ್ವಾನ ಪತ್ರಿಕೆಯಲ್ಲಿ, ತಮ್ಮ ಸುಖಾಗಮನ ಕೋರುವ ಪಟ್ಟಿಯಲ್ಲಿದೆ. ಹಾಗೂ ಈ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಮಗ ಕೆ.ಆರ್‌. ಅನಂತರಾಮನ್‌ ಭಾರತ್‌ ಅರ್ತ್‌ ಮೂವರ್ಸ್‌ ಲಿಮಿಟೆಡ್‌, (ಬಿಇಎಂಎಲ್‌) ಮಾರ್ಕೆಟಂಗ್‌ ಡೈರೆಕ್ಟರ್‌ ಆಗಿದ್ದರು).", "ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಚನ್ನಮ್ಮ ದಂಪತಿಗಳ 3ನೇ ಮಗಳು ಗರುಡಮ್ಮ ಇವರನ್ನು \"“ಅಕ್ಕಾಚಿ' ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ಇವರಿಗೆ ಕಶ್ಯಪ ಗೋತ್ರಕ್ಕೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು. ಇವರಿಗೆ ಸಂತಾನವಿಲ್ಲ. ವಿಧವೆ. ಆದ ನಂತರ ನಮ್ಮ ಮನೆಯಲ್ಲೇ ಇದ್ದರು. ಹೆಂಗಸಾದರೂ ವ್ಯವಹಾರದಲ್ಲಿ ತುಂಬಾ ದಕ್ಷೆ. ಇವರ ತಲೆ ಕೂದಲು ಮೊಣಕಾಲವರೆಗೂ ಮುಟ್ಟುತ್ತಿತ್ತು. ಇವರ ಮೊಣಕಾಲುದ್ದರ ಜಡೆ ನೋಡಿದ. ಇತರೇ ಹೆಣ್ಣು ಮಕ್ಕಳೆಲ್ಲರೂ ನನಗೆ ಗರುಡಮ್ಮನ ಜಡೆ ಹಾಕು ಎಂದು ಕೇಳಿ ಚೌರಿ ಹಾಕಿಸಿಕೊಂಡು ಜಡೆ ಹಾಕಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರಂತೆ. ಗರುಡಮ್ಮ ತುಂಬಾ ಧೈರ್ಯಸ್ಥೆ. ಮುಂದೆ ಇವರ ಚಿಕ್ಕಮ್ಮ (ತಾಯಿಯ ತಂಗಿ) ನಾಚಾರಮ್ಮನ ಯಜಮಾನರಾದ ಕೊಬ್ಬರಿ ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌ ದಿವಂಗತರಾದ ನಂತರ ಅವರ ಮನೆ ವ್ಯವಹಾರವನ್ನೆಲ್ಲಾ ದಕ್ಷತೆ ಇಂದ ನೋಡಿಕೊಳ್ಳುತ್ತಾ ಇದ್ದು, ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌ ನಡೆಸುತ್ತಿದ್ದ ಲೇವಾದೇವಿಯ ಕಾರ್ಯಕ್ರಮವನ್ನು ನಡೆಸುತ್ತಿದ್ದರು. (ಲೇವಾದೇವಿ ಅಂದರೆ ಹಣಕಾಸಿನ ಬಡ್ಡಿ ವ್ಯವಹಾರ).", "ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರ 4ನೇ ಮಗಳು ಎಗ್ಗಮ್ಮ ಇವರನ್ನು ಕಡಬದ ಶ್ರೀವತ್ಸ ಗೋತ್ರದ ಪ್ರಸಿದ್ಧ ವಾದ್ಕಾರ್‌ ಶ್ರೀನಿವಾಸ ರಾಘವಚಾರ್‌ಗೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು. ಸದರಿ ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್‌ ಮೇಲ್ಕಂಡ ಕೊಬ್ಬರಿ ವೆಂಕಟಾಚಲ ಅಯ್ಕಂಗಾರ್‌ರವರ ತಮ್ಮ ಅಂದರೆ ನಾಚಾರಮ್ಮನವರ ಮೈದುನ. ಎಗ್ಗಮ್ಮನವರಿಗೆ ಗಂಡು ಸಂತಾನವಿಲ್ಲ. 3 ಜನ ಹೆಣ್ಣು ಮಕ್ಕಳು ಮಾತ್ರ ಮೊದಲನೆಯವರು ರಾಜಮ್ಮ ಇವರ ಪತಿ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌, ಸಿವಿಲ್‌ ಮುನ್ಸಿಫ್‌ ಕೋರ್ಟಿನಲ್ಲಿ ಅಧಿಕಾರಿಯಾಗಿದ್ದರು. ಇವರಿಗೆ 3 ಗಂಡು ಮಕ್ಕಳು ಮತ್ತು 2 ಹೆಣ್ಣು ಮಕ್ಕಳು. ಗಂಡು ಮಕ್ಕಳು"], ["ನಿಧನರಾಗಿ, ಹೆಣ್ಣು ಮಕ್ಕಳು ಮಾತ್ರ ಬೆಂಗಳೂರಲ್ಲಿಯೇ ಇದ್ದಾರೆಂದು ತಿಳಿದು ಬಂದಿದೆ. ನನಗೆ ಮಾತ್ರ ಭೇಟಿಯಾಗಿಲ್ಲ.", "ಎಗ್ಗಮ್ಮನವರ ಎರಡನೇ ಮಗಳು ಸೀತಾ ಉರುಫ್‌ ವನಜಮ್ಮ ಉರುಫ್‌ ಕುಟ್ಟಮ್ಮ ಇವರನ್ನು ನೊಣವಿನಕೆರೆ ದರೋಗ ಫ್ಯಾಮಿಲಿಗೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು ಇವರ ಪತಿ ಆಂಧ್ರದ ಅನಂತಪುರ ಮತ್ತು ಗುತ್ತಿಯಲ್ಲಿ ತಹಸೀಲ್ದಾರ್‌ ಆಗಿದ್ದರು. ಮದುವೆಯಾದ ತರುವಾಯ ಹೆಂಡತಿ ಸೀತಮ್ಮನವರಿಗೆ ಮನೆಯಲ್ಲಿ ಇಂಗ್ಲೀಷ್‌ ಭಾಷೆ ಹೇಳಿಕೊಡುತ್ತಿದ್ದರು. ಇಂಗ್ಲೀಷ್‌ನಲ್ಲಿ ಸೀತಮ್ಮ ಪ್ರವೀಣೆಯಾಗಿ ಮಾತನಾಡುತ್ತಾ ಭಾಷಣ ಮಾಡುತ್ತಿದ್ದದ್ದನ್ನು ನಾನು ನೋಡಿದ್ದೆ. ಕೆಲವು ಕಾಲ ಮೈಸೂರು ಸರಕಾರದ ನಿಮ್ನ ಮರ್ಗದ ವಿದ್ಯಾಭ್ಯಾಸ ಇಲಾಖೆಯಲ್ಲಿ ಅಧಿಕಾರಿಯಾಗಿದ್ದರು. ಇವರಿಗೆ ಪಿಟೀಲು ವಾದನ ಮತ್ತು ಜ್ಯೋತಿಷ್ಯ ಅಂದರೆ ಭವಿಷ್ಯ ಹೇಳುವುದು ಕರಗತವಾಗಿತ್ತು. ಮೈಸೂರು ಅರಮನೆಯ ರಾಣಿಯವರು ಇವರಿಂದ ಭವಿಷ್ಯ ಕೇಳಲು ಆಗಾಗ್ಗೆ (ಅವರನ್ನು) ಅರಮನೆಗೆ ಆಹ್ವಾನಿಸುತ್ತಿದ್ದರು. ಆ ಕಾಲದಲ್ಲಿ ಇವರು, (ಸೀತಮ್ಮ ಮತ್ತು ಅವರ ಗಂಡ) ದೆಹಲಿಗೆ ಹೋಗಿ ಬಂದಿದ್ದರ ಕಾರಣ ಇವರಿಗೆ “ಡೆಲ್ಲಿ ಕುಟ್ಟಿ' ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ಇವರಿಗೆ ಒಂದು ಪುತ್ರ ಮತ್ತು 3 ಜನ ಪುತ್ರಿಯರು. ಇವರ ಪುತ್ರ ವೆಟರ್ನರಿ ಡಾಕ್ಟರ್‌ ಆಗಿ ಆಂಧ್ರ ಸರ್ಕಾರದ ಸೇವೆಯಲ್ಲಿದ್ದು ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿಯೇ ಮೃತಪಟ್ಟರು. ಇವರ ಮಕ್ಕಳು ಮತ್ತು ಹೆಂಡತಿ ಮತ್ತು 3 ಸಹೋದರಿಯರು ಇರುತ್ತಾರೆಂದು ತಿಳಿದೆದೆ. ನನಗೆ ಮಾತ್ರ ಭೇಟಿಯಾಗಿಲ್ಲ. ಈ ಮಕ್ಕಳನ್ನೆಲ್ಲಾ ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ನೋಡಿದ್ದೆ. ಮಗನ ಹೆಸರು ರಾಜ ಅಯ್ಯಂಗಾರ್‌. ಹೆಣ್ಣು ಮಕ್ಕಳ ಹೆಸರು, ಅಂಂಬುಜಮ್ಮ ಸರೋಜಮ್ಮ ಮತ್ತು ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಈ ಪೈಕಿ ವೆಟರ್ನರಿ ಡಾಕ್ಟರಾಗಿದ್ದು ನಿಧನವಾಗಿದ್ದ ರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಕುಟುಂಬ ಬೇಲೂರಿನಲ್ಲಿರುತ್ತದೆ ಎಂದು ತಿಳಿದಿದೆ. ಅಂಬುಜಮ್ಮ ಬೆಂಗಳೂರಿನ ಜಯನಗರದಲ್ಲಿರುವುದಾಗಿ ತಿಳಿದಿದೆ. ನನಗೆ ಮಾತ್ರ ಭೇಟಿಯಾಗಿಲ್ಲ.", "ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರ ಮಗಳು ಜೊಕ್ಕಮ್ಮ ಮೂರನೆಯವಳು. ಈಕೆಯನ್ನು ಹೊಳೆನರಸೀಪುರ ತಾಲ್ಲೂಕು ಮಾವನೂರಿನ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಎಂಬುವರಿಗೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು ಇವರಿಬ್ಬರೂ ಮೃತರಾಗಿದ್ದಾರೆ. ಇವರಿಗೆ ಒಂದು ಹೆಣ್ಣು ಮತ್ತು ಒಂದು ಗಂಡು ಮಗನಿದ್ದಾರೆ. ಗಂಡು ಮಗ ರಂಗರಾಜ ಬೆಂಗಳೂರಿನಲ್ಲಿರುವುದು ತಿಳಿದಿದೆ. ನನಗೆ ಭೇಟಿಯಾಗಿಲ್ಲ."], ["ನನ್ನ ತಂದೆಯ ಇತಿಹಾಸ", "ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಚನ್ನಮ್ಮನ ಗರ್ಭಾಂಬುಧಿಯಲ್ಲಿ ಹಿರಿಯ ಮಗ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಅವರ ಮೂರು ಸೋದರಿಯರ ಇತಿಹಾಸವನ್ನು ಮೇಲೆ ವಿವರಿಸಿದೆ. ಈ ತಂದೆ ತಾಯಿಗಳ 5ನೇ ಮತ್ತು ಕಿರಿಯ ಪುತ್ರ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ನನ್ನ ತಂದೆ.", "ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ಗೆ “ಭಲ್ಯದ” ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಅಂತ ಹೆಸರು. ಇವರು ಮೈಸೂರು ಅರಮನೆಯಲ್ಲಿ “ಭಲ್ಕ' ಹಿಡಿಯುತ್ತಿದ್ದುದರಿಂದ.. ಈ ಹೆಸರು ಬಂದಿತ್ತು ಅಂದರೆ ಮಹಾರಾಜರಿಗೆ ಔಂ6/ ೮೬೩೬6. ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರಿಗೆ 0೩1೮7೩ಂ೬ ಆದ್ದರಿಂದ ಅವರಿಗೆ ಕಣ್ಣು ಕುರುಡಾಗಿದ್ದರಿಂದಲೂ ಮತ್ತು ಆಗಿನ ಕಾಲದಲ್ಲಿ ಎತ್ತಿನ ಬಂಡಿ ವಗೈರೆ ಸಂಚಾರ ವಿಧಾನಗಳಿಲ್ಲವಾಗಿ ನನ್ನ ತಾತ ಅವರನ್ನು ಹೆಗಲ ಮೇಲೆ ಕೂರಿಸಿಕೊಂಡು ನುಗ್ಗೇಹಳ್ಳಿಯಿಂದ ನೊಣವಿನಕೆರೆಗೆ, ಸುಮಾರು 100 ಮೈಲು ಕಾಲ್ದಡಿಗೆಯಲ್ಲಿ ಬರುತ್ತಿದ್ದರಂತೆ.", "ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಅಧಿಕಾರಿಗಳನ್ನು ಭೇಟಿಯಾಗುತ್ತಿದ್ದದ್ದು ಒಂದು ಇತಿಹಾಸವೇ ಆಗಿದೆ. (ಆಗಿನ ರಾಜರ) ಅಧಿಕಾರಿಗಳು ಪ್ರತಿದಿನ ಒಂದು ಊರಿಗೆ ಹೋಗುತ್ತಿದ್ದಾಗ್ಗೆ ಇವರೂ ಕಾಲ್ನಡಿಗೆಯಲ್ಲಿ ಅವರು ಹೋಗುವ ಊರುಗಳಿಗೆ ಹೋಗಿ, ಪ್ರಾತಃಕಾಲ ಸ್ನಾನ ಮಾಡಿ ಹಣೆಗೆ ನಾಮ ಇಟ್ಟುಕೊಂಡು ಅಧಿಕಾರಿ ಇರುವ ಊರಿಗೆ ಹೋಗಿ ಪ್ರತಿದಿನವೂ ನಮಸ್ಕಾರ ಮಾಡುವುದು ಇವರ ಕೆಲಸ.", "ಪ್ರತಿದಿನವೂ ಅಧಿಕಾರಿ ತಾವು ಬಂದಿರುವ ಊರಿನಲ್ಲಿ (ಇವರನ್ನು) ನೋಡಿ ಅನೇಕ ದಿನಗಳ ಮೇಲೆ ಏಕೆ ಹೀಗೆ ದಿನವೂ ನಾನು ಬರುತ್ತಿರುವ ಊರಿಗೆ ಬಂದು ನನ್ನನ್ನು ಕಾಣುತ್ತೀರಾ ಎಂದು ಕೇಳಿದಾಗ, ನನಗೆ ಒಂದು ಕೆಲಸ ಕೊಡಿ ಎಂದು, ನನ್ನ ತಾತ ಅಧಿಕಾರಿಯನ್ನು ಕೇಳಿಕೊಂಡರಂತೆ*. ಆಗ ಇವರಿಗೆ ಅರಮನೆಯಲ್ಲಿ ಔಂ6/ ೮೬೩೯6 ಕೆಲಸ ಕೊಟ್ಟರಂತೆ. ಹೀಗಿರುವಾಗ ನನ್ನ ತಂದೆಗೆ ಐದು ವರ್ಷ ವಯಸ್ಸಿನಲ್ಲಿ ನನ್ನ ತಾತ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ತೀರಿಕೊಂಡರಂತೆ. ನಂತರ ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮ ಅವರ ಐದು ಮಕ್ಕಳು; ಚನ್ನಮ್ಮನ ತಂಗಿ ನಾಚಾರಮ್ಮ ಅವರ ಯಜಮಾನರು ಕೊಬ್ಬರಿ ವೆಂಕಟಾಚಲ ಅಯ್ಯಂಗಾರ್‌ (ನನ್ನ ಚಿಕ್ಕಜ್ಜಿ ಮತ್ತು ಚಿಕ್ಕ ತಾತ) ಇವರುಗಳ ಆಶ್ರಯದಲ್ಲಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬೆಳೆದರು.", "9 ಇದು ಸ್ಪಲ್ಪ ಅನುಮಾನ. ಏಕೆಂದರೆ ರಾಜರ ಬಾಡಿಗಾರ್ಡ್‌ ಆದರೆ ಇವರ ವಾಸ ಮೈಸೂರಲ್ಲಿರಬೇಕಿತ್ತು. ಅದರ ಬಗ್ಗೆ ಯಾವ ವಿವರಗಳು ಅಲ್ಲ. ಶಸ್ತ್ರವಿದ್ಯೆಯನ್ನು ಕಲಿಯದ ಅವರನ್ನು ರಾಜರ ಬಾಡಿಗಾರ್ಡ್‌ ಆಗಿ ನೇಮಿಸುವುದು ಸಾಧ್ಯವಿಲ್ಲ. ಬಹುಶಃ, ಅವರು ಯಾರೋ ಅಧಿಕಾರಿಯ ಹಿಂದೆ ಓಡಾಡುವ ಕೆಲಸ ಕೊಟ್ಟರಬಹುದು."], ["ಅವರೇ ಈ ಐದೂ ಮಕ್ಕಳನ್ನು ಸಾಕಿ ವಿವಾಹ ವಗೈರೆ ಮಾಡಿದರು. ಇವರಿಗೇ ನನ್ನ ದೊಡ್ಡಪ್ಪ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ರವರನ್ನು ಅವರಿಗೆ ಸಂತಾನವಿಲ್ಲವಾಗಿ ದತ್ತು ಕೊಟ್ಟಿದ್ದರು.", "ನನ್ನ ತಂದೆ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ನನ್ನ ದೊಡ್ಡಪ್ಪ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ರವರ ಪ್ರಾಥಮಿಕ ಮತ್ತು ಮಾಧ್ಯಮಿಕ ವಿದ್ಯಾಭ್ಯಾಸ ನೊಣವಿನಕೆರೆ ಮತ್ತು ಅವರ ಭಾವನವರಾದ ಪ್ರಸಿದ್ಧ ವಾದ್ಕಾರ್‌ ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್‌ ಆಶ್ರಯದಲ್ಲಿ ಕಡಬದಲ್ಲಿ ನಡೆಯಿತೆಂದು ತಿಳಿದು ಬಂದಿದೆ. ಕಡಬದಲ್ಲಿ ಆಗ ಮಿಷನ್‌ ಸ್ಕೂಲ್‌ ಇತ್ತು* ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಇಂಗ್ಲಿಷ್‌ ಶಾಲೆ ಇರಲಿಲ್ಲ. ಶಾಲೆಯಲ್ಲಿ ಇಂಗ್ಲಿಷ್‌ ಮತ್ತು ಕನ್ನಡ ಪಾಠ ಪ್ರವಚನಗಳೊಂದಿಗೆ, ವೇದ ಮತ್ತು ಜ್ಯೋತಿಷ್ಯ ಪಾಠಗಳು ಮನೆಯಲ್ಲಿ ಅವರ ಭಾವ ವಾದ್ಕಾರ್‌ ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್‌ ಅವರಿಂದ ಭೋದಿಸಲ್ಪಡುತ್ತಿತ್ತು. ಅವರ ಭಾವ ವಾದ್ಕಾರ್‌ ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್‌ ಜ್ಯೋತಿಷ್ಯ ಮತ್ತು ವೇದಗಳಲ್ಲಿ ದೊಡ್ಡ ವಿದ್ವಾಂಸರೇ ಆಗಿದ್ದರು.", "ನನ್ನ ತಂದೆ ಮತ್ತು ಅವರ ಅಣ್ಣ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಇಬ್ಬರಿಗೂ, ಅವರ ಭಾವ ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್‌ರವರಿಂದ ವೇದ ಮತ್ತು ಪೂರ್ವ ಮತ್ತು ಅಪರ ಪ್ರಯೋಗ ಪಾಠಗಳು ನಡೆದಿದ್ದು ಎರಡರಲ್ಲೂ ಚೆನ್ನಾಗಿ ಅನುಭವ ಪಡೆದಿದ್ದರು. ಕಡಬದಲ್ಲಿ ಇಂಗ್ಲಿಷ್‌ ಮಾಧ್ಯಮಿಕ ಶಾಲಾ ವ್ಯಾಸಂಗ ಪೂರ್ತಿಯಾದ ನಂತರ, ನನ್ನ ತಂದೆ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಲಂಡನ್‌ ಮಿಷನ್‌ ಹೈಸ್ಕೂಲ್‌ನಲ್ಲಿ ಈಗ ಸೆಂಟ್ರಲ್‌ ಹೈಸ್ಕೂಲ್‌ ಎಂದು ಕರೆಯಲ್ಪ್ಬಡುತ್ತಿದೆ. (ಇದು ಈಗಲೂ ಮೈಸೂರು ಬ್ಯಾಂಕ್‌ ಸರ್ಕಲ್‌ನಲ್ಲಿದೆ. (ಆದರೆ) ಈಗ ಸೆಂಟ್ರಲ್‌ ಸ್ಕೂಲನ್ನು ಮುಚ್ಚಲಾಗಿದೆ. ಆ ಶಾಲೆಯಲ್ಲಿ ಹೈಸ್ಕೂಲ್‌ ವ್ಯಾಸಂಗದ ನಂತರ ರೈಲ್ವೆ ಇಲಾಖೆಯಲ್ಲಿ ಸಿಗ್ನಲ್‌ ಕೆಲಸಕ್ಕೆ ಸೇರಿ ಶ್ರೀರಂಗಪಟ್ಟಣದ ರೈಲ್ವೆ ಸ್ಟೇಷನ್ನಿನಲ್ಲಿ ಸಿಗ್ನಲ್‌ಮನ್‌ ಆಗಿದ್ದರು. (ತಿಳಿದ ಹಾಗೆ, ತಾತ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಎಸ್‌ಎಸ್‌ಎಲ್‌ಸಿಯಲ್ಲಿ ಫಸ್ಟ್‌ಕ್ಲಾಸ್‌ನಲ್ಲಿ ಪಾಸ್‌ ಆಗಿದ್ದರು. ಆಗಿನ ಕಾಲಕ್ಕೆ ಅದು ದೊಡ್ಡ ಸಾಧನೆ). ಆಗ ಸಿಗ್ನಲಿಂಗ್‌ನಲ್ಲಿ ೫೧೬೧8 ತರಬೇತಿ ಹೊಂದಲು ಇವರನ್ನು ಕಲ್ಕತ್ತಾಗೆ ಚುನಾಯಿಸಿ ಆರ್ಡರ್‌ ಬಂದಿತು.", "ಅದೇ ವರ್ಷ ಭಾರತಕ್ಕೆ, ಕಲ್ಕಿತ್ತಾಗೆ, ಫ್ಲೇಗ್‌ ಬಂದಿದ್ದರಿಂದ ಅವರ ಹಿರಿಯರು ಸಿಗ್ನಲಿಂಗ್‌ ತರಬೇತಿ ಪಡೆಯುವುದಕ್ಕೆ ಕಲ್ಕತ್ತಗೆ ಕಳುಹಿಸಲು ಒಪ್ಪದೆ ರೈಲ್ವೆ ಕೆಲಸಕ್ಕೆ ರಾಜಿನಾಮೆ ಸಲ್ಲಿಸಿದರು. ಇವರು", "* ಮಿಷನ್‌ ಸ್ಕೂಲ್‌ ಎಂದರೆ ಕ್ರಿಶ್ಚಿಯನ್‌ ಫಾದರಿಗಳು ನಡೆಸುವ ಶಾಲೆ. ಅಲ್ಲಿ 5ನೇ ಕ್ಲಾಸಿನಿಂದ ಇಂಗ್ಲಿಷ್‌ ಹೇಳಿಕೊಡುತ್ತಿದ್ದರು."], ["ನಂತರ ವಿದ್ಯಾಭ್ಯಾಸ ಇಲಾಖೆಯಲ್ಲಿ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸಕ್ಕೆ ಸೇರಿದರು. ಪ್ರಾರಂಭದಲ್ಲಿ ಇವರಿಗೆ ತಿಂಗಳಿಗೆ 8/-ರೂ ಸಂಬಳ. ಮೊಟ್ಟ ಮೊದಲು ಇವರು ಕುಣಿಗಲ್‌ ತಾಲ್ತೂಕು ಕರೇದಕುಪ್ಪ ಗ್ರಾಮದ ಶಾಲೆಗೆ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿ ಸೇರಿದರು. ನಂತರ ಅದೇ ತಾಲ್ಲೂಕಿನ ಎಲಿಯೂರು, ಹುಲಿಯೂರು ದುರ್ಗ, ಗುಬ್ಬಿ ತಾಲ್ಲೂಕಿನ ಚಂದ್ರಶೇಖರಪುರ, ತುಂಕೂರು ತಾಲ್ಲ್ದೂಕಿನ ಹೊನ್ನುಡಿಕೆ; ತುರುವೇಕೆರೆ ತಾಲ್ಲೂಕಿನ ಕಣತೂರು ಮತ್ತು ತಂಡಗ, ತಿಪಟೂರು ತಾಲ್ಲೂಕಿನ ನೊಣವಿನಕೆರೆ; ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿ ತಾಲ್ಲೂಕಿನ ಕಂದಿಕೆರೆ, ಯಳನಡು; ತುಂಕೂರು ತಾಲ್ಲೂಕಿನ ನಾಗವಲ್ಲಿ ಗ್ರಾಮಗಳಲ್ಲಿ ಹೆಡ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿ ಪೆನಷನ್‌ ಪಡೆದರು. ಪೆನ್‌ಷನ್‌ ಆದಾಗ ಇವರಿಗೆ ಮಾಹೆಯಾನ 25/- ರೂ. ಸಂಬಳ. ಇವರ ವಿಶೇಷವೆಂದರೆ ಇವರು ಎಲ್ಲಿಗೆ ಹೋದರೂ ಪೋಸ್ಟ್‌ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಸಿಗುತ್ತಿತ್ತು ಆಗಿನ ಕಾಲದಲ್ಲಿ ಗ್ರಾಮಗಳಲ್ಲಿನ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟಾಫೀಸುಗಳ ಕೆಲಸವನ್ನು ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸದೊಂದಿಗೆ, ವಿರಾಮಕಾಲದಲ್ಲಿ, ಪೋಸ್ಟ್‌ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದರು. ಅದಕ್ಕಾಗಿ ಅಂಚೆ ಇಲಾಖೆಯಿಂದ ಮಾಹೆಯಾನ 4 ರೂನಿಂದ 8 ರೂವರೆಗೆ ಕೊಡುತ್ತಿದ್ದರು. ಇವರು ಚಂಂದ್ರಶೇಖರಪರ, ಹೊನ್ನುಡಿಕೆ. ಕಂದಿಕೆರೆ, ನಾಗವಲ್ಲಿ ಗ್ರಾಮಗಳಲ್ಲಿ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಜೊತೆಗೆ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದರು. ಕೆಲಸದಿಂದ ನಿವೃತ್ತಿಯಾದ ಮೇಲೂ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿ ತಿಂಗಳಿಗೆ 12/- ರೂ. ಸಂಬಳ ಪಡೆಯುತ್ತಿದ್ದರು. ಇವರ ಅಣ್ಣ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಸಹ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಮತ್ತು. ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿದ್ದರು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಇಂಗ್ಲಿಷ್‌ ಮತ್ತು ವೇದ ಪಾಠ ತಿಳಿದವರು ಅಷ್ಟಾಗಿ ಹೆಚ್ಚಾಗಿಲ್ಲದಿದ್ದದ್ದುದ್ದರಿಂದ ಇವರಿಗೆ ಊರಿನಲ್ಲಿ ಹೆಚ್ಚು ಗೌರವ, ಆದರಗಳಿತ್ತು ನನ್ನ ತಂದೆ ವಿದ್ಯಾ ಇಲಾಖೆಯಲ್ಲಿ 35 ವರ್ಷ ಕೆಲಸ ಮಾಡಿದ ನಂತರ 40 ವರ್ಷ ಪೆನ್‌ಷನ್‌ ಪಡೆದರು. ಇವರಿಗೆ ಪೆನ್‌ಷನ್‌ 15/- ರೂ. ತಿಂಗಳಿಗೆ ಬರುತ್ತಿತ್ತು. *", "ನನ್ನ ತಂದೆ ವ್ಯವಹಾರದಲ್ಲಿಯೂ ಸಾಕಷ್ಟು ತಿಳುವಳಿಕೆಯುಳ್ಳವರಾದ್ದರಿಂದ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ತುಂಬಾ ಜನಾನುರಾಗ ಗಳಿಸಿದ್ದರು. ಆಯುರ್ವೇದದಲ್ಲೂ ಸಾಕಷ್ಟು ಅನುಭವ ಪಡೆದಿದ್ದರು. ಇವರ ಹಸ್ತ ಗುಣವೋ ಏನೋ ಎಂಬಂತೆ ಇವರು ಕಟ್ಟುತ್ತಿದ್ದ ತಾಯಿತಗಳಿಂದ ಅನೇಕ ಖಾಯಿಲೆಗಳು ಗುಣಮುಖವಾಗುತ್ತಿತ್ತು. ಇವರಲ್ಲಿದ್ದ ನಂಬಿಕೆಯೇ ಇದಕ್ಕೆ ಕಾರಣವಿರಬಹುದೆಂದು ಊಹಿಸಬಹುದಾಗಿದೆ.", "* ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಯಾವ ವರ್ಷದಲ್ಲಿ ಕೆಲಸಕ್ಕೆ ಸೇರಿದರು ಎಂಬುದರ ವಿವರಗಳಿಲ್ಲ. ಸುಮಾರಾಗಿ 1866ರಲ್ಲಿ ಹುಟ್ಟಿರಬೇಕು. ಈ ಲೆಕ್ಕದಲ್ಲಿ ಅವರು 1890ರಲ್ಲಿ ಕೆಲಸಕ್ಕೆ ಸೇರಿರಬಹುದು. 58ನೇ ವಯಸ್ಸಿನಲ್ಲಿ, ಅಂದರೆ 1924ರಲ್ಲಿ ಮೇಸ್ಟರ ಕೆಲಸದಿಂದ ರಿಟೈರ್ಡ್‌ ಆಗಿರಬಹುದು."], ["ಇವರ 95ನೇ ವರ್ಷ ವಯಸ್ಸಿನಲ್ಲಿಯೂ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದರು. 9.6.1964ರಂದು ತುಂಕೂರಿನಲ್ಲಿ ದೇವರ ಪಾದಾರವಿಂದಕ್ಕೆ ಸೇರಿದರು. ಮುಂದೆ ಇವರ ಜೀವನ ಚರಿತ್ರೆಯನ್ನು ತಿಳಿಸಬೇಕಾಗಿದೆ.", "ನನ್ನ ತಾಯಿಯ ವಂಶಾವಳಿ", "ನನ್ನ ತಾಯಿ ರಾಮಕ್ಕಮ್ಮನವರು ನುಗ್ಗೇಹಳ್ಳಿ ಸ್ಥಳದ ಮೌದ್ಗಲ್ಯ ಗೋತ್ರದ ವಡಗಲೈ ಸಂಪ್ರದಾಯದ ಕೇಶವ ಅಯ್ಯಂಗಾರ್‌, ಆಚಮ್ಮ ಚಂಪತಿಗಳ ಕಿರಿಯ ಪುತ್ರಿ. ನನ್ನ ತಂದೆಯ ತಾಯಿ (ಅಂದರೆ ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರೂ ಸಹ ಇದೇ ಮನೆಯ ಹೆಣ್ಣು ಮಗಳು. ಅಂದರೆ ನಮ್ಮ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರ ಅಣ್ಣನ ಮಗಳೇ ನಮ್ಮ ತಾಯಿ. ನನ್ನ ತಂದೆಗೆ, ನನ್ನ ತಾಯಿ, ಅವರ ಸೋದರ ಮಾವನ ಮಗಳು. ನನ್ನ ದೊಡ್ಡಪ್ಪ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ರ ದತ್ತು ತಾಯಿ ನಾಚಾರಮ್ಮನವರೂ, ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರೂ ಅಕ್ಕ ತಂಗಿಯರಾಗಿ ನುಗ್ಗೇಹಳ್ಳಿಯ ನನ್ನ ತಾಯಿಯ ಹುಟ್ಟಿದ ಮನೆಯ ಹೆಣ್ಣು ಮಕ್ಕಳಾಗಿದ್ದಾರೆ.", "ನನ್ನ ತಾಯಿ ರಾಮಕ್ಕನವರಿಗೆ ಇಬ್ಬರು ಅಕ್ಕಂದಿರು ಮತ್ತು ಒಬ್ಬ ಅಣ್ಣ ಇದ್ದರು. ನನ್ನ ತಾಯಿಯ ಹಿರಿಯ ಅಕ್ಕನ ಹೆಸರು ತಿಳಿದು ಬಂದಿಲ್ಲ. ಇವರನ್ನು ಹಿರೇಮಗಳೂರಿಗೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು. ಇವರ ಮೊಮ್ಮಕ್ಕಳು ಬೆಂಗಳೂರಿನಲ್ಲಿದ್ದಾರೆ. ನನ್ನ ತಾಯಿಯ ಎರಡನೇ ಅಕ್ಕ ಯದುಗಿರಿಯಮ್ಮ ಇವರನ್ನು ಶಂಖಗ್ರಾಮ, ಹಾಸನ ತಾಲ್ಲೂಕು ರಂಗಣ್ಣ ಎಂಬುವರಿಗೆ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು", "ನನ್ನ ದೊಡ್ಡಮ್ಮ ಯದುಗಿರಿಯಮ್ಮರಿಗೆ ಒಬ್ಬ ಗಂಡು ಮತ್ತು ಮೂರು ಜನ ಹೆಣ್ಣು ಮಕ್ಕಳು. ಗಂಡು ಮಗ ವಿವಾಹವಾಗಿ ಚಿಕ್ಕವಯಸ್ಸಿನಲ್ಲೇ ಮೃತಪಟ್ಟರು. ಮೂರು ಜನ ಹೆಣ್ಣು ಮಕ್ಕಳ ಪೈಕಿ ಹಿರಿಯ ಮಗಳು ರುಕ್ಕಮ್ಮನನ್ನು ನೊಣವಿನಕೆರೆಯ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ರವರ ಚಿಕ್ಕ ತಾತ ಕುಟ್ಟ ಶ್ಯಾಮ ಅಯ್ಯಂಗಾರ್‌ಗೆ ಕೊಟ್ಟು 3ನೇ ವಿವಾಹವಾಗಿತ್ತು. ಇವರಿಗೆ ಸಂತಾನವಿಲ್ಲ.. ಎರಡನೇ ಮಗಳು ತಿರುಮಲಮ್ಮನನ್ನು ನನ್ನ ಮಲ ಸೋದರಮಾವ ಅಟ್ಟಾವರದ ದೇಶಿಕಾಚಾರ್‌ರವರಿಗೆ 2ನೇ ವಿವಾಹವಾಗಿತ್ತು. ದೇಶಿಕಾಚಾರ್‌ರವರು ಸಬ್‌ರಿಜಿಸ್ಟಾರ್‌ ಕೆಲಸದಲ್ಲಿದ್ದು ನಿವೃತ್ತರಾಗಿದ್ದರು. ಇವರ ಮಕ್ಕಳೇ ಬೆಂಗಳೂರು ಮಲ್ಲೇಶ್ವರದಲ್ಲಿರುವ ಗೋಪಾಲ ಮತ್ತು ನರಸಿಂಹ. ನೊಣವಿನಕೆರೆಗೆ ಕೊಟ್ಟು ವಿವಾಹ ಆಗಿದ್ದ ರುಕ್ಕಮ್ಮ ಪತಿಯ ನಿಧನದ ನಂತರ ತಂಗಿ ತಿರುಮಲಮ್ಮನ ಮನೆಯಲ್ಲಿ ಇದ್ದು ನಿಧನರಾದರು."], ["ನನ್ನ ದೊಡ್ಡಮ್ಮನ ಮೂರನೆಯ ಮಗಳು ಕಮಲಮ್ಮರನ್ನು ಶಾಂತಿಗ್ರಾಮದ ದೀಕ್ಷಿತರ್‌ ರಾಮಾನುಜ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ಕೊಟ್ಟು ವಿವಾಹ ಮಾಡಲಾಗಿತ್ತು ಪತಿ ನಿಧನದ ನಂತರ ಮಕ್ಕಳೊಡನೆ ಬೆಂಗಳೂರು ಮಲ್ಲೇಶ್ವರದಲ್ಲಿದ್ದಾರೆ. ಕಮಲಮ್ಮನ ಮಲ ಮಗನೇ ವಾದ್ಯಾರ್‌ ಶ್ರೀನಿವಾಸ ದೇಶಿಕಾಚಾರ್‌. ಹಾಲಿ ಬೆಂಗಳೂರಿನಲ್ಲಿದ್ದಾರೆ. ಕಮಲಮ್ಮ ನನ್ನ ಸರಿ ಸಮಾನ ವಯಸ್ಕರು.", "ನನ್ನ ತಾಯಿಯ ಹಿರಿಯ ಸಹೋದರ, ಅಂದರೆ ನನ್ನ ಸೋದರಮಾವ, ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌. ಇವರು ಕಡಬದಲ್ಲಿ ಜರುಗಿದ ನನ್ನ ವಿವಾಹಕ್ಕೆ ಬಂದಿದ್ದರು. ನನ್ನ ಸೋದರ ಮಾವ ನುಗ್ಗೇಹಳ್ಳಿ ಸ್ಥಳದವರಾದರೂ, ಇವರು ವಾಸವಾಗಿದ್ದದ್ದು ಹಾಸನ ತಾಲ್ಲೂಕು ಅಟ್ಟಾವರದಲ್ಲಿ. ಇದು ಅವರ ತಾಯಿ, ಅಂದರೆ ನನ್ನ ಅಜ್ಜಿ, ಅಂದರೆ ತಾಯಿಯ ತಾಯಿ ಆಜಮ್ಮನವರ ಹುಟ್ಟಿದ ಮನೆ ಅಟ್ಟಾವರದಲ್ಲಿ ನನ್ನ ಸೋದರ ಮಾವ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಸಂಸಾರ ಸಮೇತ ವಾಸವಾಗಿದ್ದು ಪಿ.ಡಬ್ರ್ಯೂ.ಡಿ. ಕಂಟ್ರಾಕ್ಟರ್‌ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದರು. ದಿವಾನ್‌ ವಿಶ್ವೇಶ್ವರಯ್ಯನವರ ಕಾಲದಲ್ಲಿ, ಅರಸೀಕೆರೆ- ಮೈಸೂರು ರೈಲ್ವೆ ಮಾರ್ಗದ ದುದ್ಬ ಸ್ಟೇಷನ್‌ ಸಮೀಪದಲ್ಲಿ, ನನ್ನ ಸೋದರಮಾವ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ರೈಲ್ವೆ ಕಂಟ್ರ್ಯಾಕ್ಟ್‌ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದರು. ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ಗೆ ಗಂಡು ಸಂತಾನವಿಲ್ಲ. ಮೂರು ಮಂದಿ ಹೆಣ್ಣುಮಕ್ಕಳು. ಒಬ್ಬರು ಶಾಂತಿಗ್ರಾಮದಲ್ಲಿದ್ದಾರೆ- ಆಂಡಾಳಮ್ಮ ಎರಡನೆಯವರು ಬೇಲೂರಿನ ದಾಸರ ಮನೆಯವರು, ಜೊಕ್ಕಮ್ಮ ಎಂದು. ಮೂರನೆಯವರು ಶ್ರಿಂಗಾರತ್ತೆ ಎಂದು ಕರೆಯುತ್ತಾರೆ. ಇವರು ಹಾಸನದಲ್ಲಿ ನನ್ನ ಅಳಿಯಂದಿರು ಶ್ರೀ ರಾಜುರವರ ಅಣ್ಣ ರಾಮಕೃಷ್ಣಯ್ಯಂಗಾರ್‌ ಮನೆಯಲ್ಲಿರುತ್ತಾರೆ. ಶ್ರೀ ರಾಮಕೃಷ್ಣಯ್ಯಂಗಾರ್‌ ಅವರ ಹೆಂಡತಿ ಮಣಿ ಎನ್ನುವರು ನನ್ನ ತಾಯಿ ಕಡೆ ಸಂಬಂಧದವರು. ನನ್ನ ತಂದೆಯ ವಿವಾಹ ಹಾಸನ ತಾಲ್ಲೂಕು ಶಂಖ ಗ್ರಾಮದಲ್ಲಿ ನನ್ನ ತಾಯಿಯ ಅಕ್ಕ ಯುದುಗಿರಿಯಮ್ಮನವರ ಮನೆಯಲ್ಲಿ ನಡೆಯಿತಂತೆ. ಆಶ್ಚರ್ಯದ ಸಂಗತಿಯೆಂದರೆ ವಿವಾಹದ ಸಂದರ್ಭದಲ್ಲಿ ಓಲಗವೇ ಇರಲಿಲ್ಲವಂತೆ. ಕೇಳಿದರೆ ಈ ಊರಿನಲ್ಲಿ ಓಲಗದವರೇ ಇಲ್ಲ ಎಂದು ಹೇಳಿದರಂತೆ. ಈ ವಿಚಾರವನ್ನು ನನ್ನ ತಂದೆಯ ಅಕ್ಕ ಯಗ್ಗಮ್ಮನವರು ಆಗಾಗ್ಗೆ ನನ್ನ ತಂದೆಯ ಎದುರಿಗೇ ಹೇಳುತ್ತಿದ್ದರು. ನನ್ನ ತಾಯಿಯ ತಂದೆ ಮತ್ತು ತಾಯಿ- ಕೇಶವ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಆಜಮ್ಮ ನನ್ನ ತಾಯಿಯ ತಾತ ಮತ್ತು ಅಜ್ಜಿ- ರಾಮಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಲಕ್ಷ್ಮಮ್ಮ ನನ್ನ ತಾಯಿಯ ಮುತ್ತಾತ ಚನ್ನಕೇಶವ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ರಾಮಕೃಮ್ಮ"], ["ನನ್ನ ಸೋದರಮಾವ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಅಟ್ಟಾವರದಲ್ಲಿ ವಾಸವಾಗಿದ್ದರಿಂದ, ನಾನು ಹುಟ್ಟಿದ್ದು ಅಟ್ಟಾವರ ಗ್ರಾಮದ ತೊಟ್ಟಿ ಮನೆಯಲ್ಲಿ. ಈಗ ಆ ತೊಟ್ಟಿಮನೆ ಬಿದ್ದು ಹೋಗಿದೆ. ಈ ಮನೆ ಅಟ್ಟಾವರ ಶಾನುಭೋಗರ ಮನೆ ಎಂದು ಪ್ರಸಿದ್ಧವಾಗಿತ್ತು. ಅಟ್ಟಾವರದಲ್ಲಿದ್ದದ್ದು ಒಂದೇ ಶ್ರೀವೈಷ್ಣವರ ಮನೆ. ಆ ಮನೆಯು ದೊಡ್ಡದಾಗಿದ್ದರಿಂದ 5-6 ಸಂಸಾರಗಳು ಒಂದೇ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿದವರಾಗಿ ಬೇರೆ ಬೇರೆ ವಾಸವಾಗಿದ್ದರು. ಚಿಕ್ಕವಯಸ್ಸಿನಲ್ಲೇ ಈ ಮನೆ ನೋಡಿದ್ದ ಕಾರಣ ನನಗೆ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಜ್ಞಾಪಕ ಇದೆ. ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಮ್ಮನವರಿಗೆ ಈ ಮನೆಯ ಪರಿಚಯ ಚೆನ್ನಾಗಿತ್ತು ನನ್ನ ತಾಯಿಯ ಮನೆ ವಿಚಾರ ಇಷ್ಟು ಮಾತ್ರಗೊತ್ತು ಇನ್ನು ಮುಂದೆ ನನ್ನ ತಂದೆ, ತಾಯಿ, ನನ್ನ ಸಹೋದರಿ, ಸಹೋದರರ ಬಗ್ಗೆ ತಿಳಿಸುತ್ತೇನೆ.", "ನನ್ನ ಅಕ್ಕ ತಂಗಿಯರು ಮತ್ತು ಅಣ್ಣ ತಮ್ಮಂದಿರು", "ನನ್ನ ತಂದೆ. ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ಅವರ ಸೋದರಮಾವನವರ ಮಗಳು ರಾಮಕ್ಕಮ್ಮನವರನ್ನು ವಿವಾಹವಾಗಿದ್ದ ವಿಚಾರ ಈ ಹಿಂದೆಯೇ ತಿಳಿಸಿದ್ದೇನೆ. ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮ ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಾಮ್ಮ ನನ್ನ ದೊಡ್ಡಪ್ಪ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌. ನನ್ನ ದೊಡ್ಡ ಅತ್ತೆ ಗರುಡಮ್ಮ ಚಿಕ್ಕ ಅತ್ತೆ ಎಗ್ಗಮ್ಮ ಇವರುಗಳೆಲ್ಲಾ ವಿಧವೆ ಆಗಿದ್ದರಿಂದ, ಇವರುಗಳ ಮಕ್ಕಳ ಸಮೇತ ಎಲ್ಲರೂ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ, ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮನವರ ಮನೆಯಲ್ಲಿಯೇ ಒಟ್ಟು ಕುಟುಂಬದಲ್ಲಿ ವಾಸವಾಗಿದ್ದು, ಹೆಂಗಸರಾಗಿದ್ದಾಗ್ಗೂ ದಕ್ಷರಾಗಿ, ಜನಾನುರಾಗಿಗಳಾಗಿದ್ದರು. ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮನವರಿಗೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಒಂದು ಮನೆ, ತೋಟ, ಹೊಳೆನರಸೀಪುರದ ಬಳಿ ನಾಲಾ ಆಶ್ರಯದಲ್ಲಿ ಒಂದು ಗದ್ದೆ. ನನ್ನ ಚಿಕ್ಕ ಅತ್ತೆ ಎಗ್ಗಮ್ಮನವರಿಗೆ ಕಡಬದಲ್ಲಿ ಒಂದು ಮನೆ ಮತ್ತು ಗದ್ದೆ ಇತ್ತು. ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮನವರ ಆಸ್ಥಿ ಅವರ ದತ್ತು ಮೊಮ್ಮಗ ದೇಶಿಕಾಚಾರ್‌ರವರಿಗೆ ಸೇರಿತು. ನನ್ನ ಅತ್ತೆ ಎಗ್ಗಮ್ಮನವರ ಆಸ್ತಿ ಅವರ 3 ಜನ ಹೆಣ್ಣು ಮಕ್ಕಳಿಗೆ ಸೇರಿತು. ನನ್ನ ತಂದೆಗೆ ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿಗಳೇನೂ ಇರಲಿಲ್ಲ. (ಇದ್ದದ್ದು) ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿಯ ನೊಣವಿನಕೆರೆ ಮನೆಯ ಒಂದು ಭಾಗ, ಹಳೆಮನೆ ಮಾತ್ರ. ಇದನ್ನು ಕೊಟ್ಟಿಗೆಯಾಗಿ ಉಪಯೋಗಿಸುತ್ತಿದ್ದರು. ಇದು ಮಾತ್ರ ನನ್ನ ತಂದೆಗೆ ಸೇರಿ, ನನ್ನ ತಂದೆ. ನೊಣವಿನಕೆರೆ ಬಿಡುವಾಗ ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟರು. ನನ್ನ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌ರವರಿಗೆ ಕೇವಲ ಬಾಲ್ಯದಲ್ಲಿಯೇ, ತಂದೆತಾಯಿಗಳು ನಿಧನರಾದ್ದರಿಂದ, ಅವರು ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ಮತ್ತು ಅತ್ತೆಗಳೊಡನೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ವಾಸವಾಗಿದ್ದನು."], ["ನನ್ನ ತಂದೆ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿ ಪರಸ್ಥಳಗಳಲ್ಲಿದ್ದುದರಿಂದ ಅವರ ಸಂಸಾರ ಬೇರೆಯೇ ವಾಸ ಮಾಡುತ್ತಿದ್ದರು. ಮುಂದೆ ನನ್ನ ತಂದೆಗೆ ನೊಣವಿನಕೆರೆಗೆ ವರ್ಗವಾದಾಗಲೂ, ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ಮನೆ ಕಿಷ್ಠಿಂದವಾಗಿದ್ದು, ಅಲ್ಲಿ ಸಾಕಷ್ಟು ಮಂದಿ ಮಕ್ಕಳ ಸಮೇತ ಇದ್ದ ಕಾರಣ, ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಪ್ರತ್ಯೇಕ ಮನೆಯಲ್ಲಿ ವಾಸವಾಗಿದ್ದರು. ನನ್ನ ತಾಯಿ ರಾಮಕ್ಕಮ್ಮ ನನ್ನ ಎರಡನೇ ಮಗಳು ಜೇಚಮ್ಮ (ಸರಳ) ಇದ್ದಹಾಗೇ ಇದ್ದ ಜ್ಞಾಪಕ ಮಾತ್ರ ಸ್ವಲ್ಪ ಇದೆ. ನನ್ನ ತಾಯಿ ನಿಧನರಾದಾಗ ನನಗೆ ಕೇವಲ 4 ವರ್ಷ ವಯಸ್ಸು. ನನ್ನ ತಾಯಿ ನನ್ನ ತಂದೆಯವರೊಡನೆ ಪರಸ್ಥಳಗಳಲ್ಲಿ ವಾಸವಿದ್ದಾಗ್ಗೆ. ತುಂಬಾ ಜನಾನುರಾಗಿಯೂ, ಜಾಣೆಯೂ, ಬುದ್ಧಿವಂತಳಾಗಿದ್ದಳೆಂದು ನನ್ನ ತಂದೆಯವರು ಹೇಳುತ್ತಿದ್ದರು. ನನ್ನ ತಾಯಿ ಕರಕುಶಲತೆಯಲ್ಲಿ, ಅಂದರೆ ಆಗಿನ ಕಾಲದಲ್ಲಿ ರಂಗೋಲಿ, ಮಣಿಗಳಲ್ಲಿ ವಿವಿಧ ಬಣ್ಣದ ದೇವರ ಫೋಟೋಗಳು ಮತ್ತು ಉಲ್ಲನ್‌ ನೂಲಿನಲ್ಲಿ, ಕಸೂತಿ ಕೆಲಸದಲ್ಲಿ ಪ್ರವೀಣೆಯಾಗಿದ್ದರು. ಆ ವಸ್ತುಗಳೆಲ್ಲಾ ಅವರ ನಿಧನಾನಂತರ, ನಮ್ಮ ಮನೆಯಲ್ಲಿದ್ದದ್ದನ್ನು ನಾನು ನೋಡಿದ್ದೆ. ನನ್ನ ತಂದೆ ತಾಯಿ ಇಬ್ಬರೂ ಪಗಡೆಯಾಟದಲ್ಲಿ ಪ್ರವೀಣರಾಗಿದ್ದುದಾಗಿ ನನ್ನ ಹಿರಿಯರು ಹೇಳುತ್ತಿದ್ದರು.", "ನನ್ನ ತಂದೆ ತಾಯಿಗೆ ಮೊದಲನೆ ಮಗು ಗಂಡು. ಇದು ಶಿಶು ಹಂತದಲ್ಲಿಯೇ ಮೃತ ಹೊಂದಿತು. ನಂತರ 2, 3, 4ನೇ ಮಕ್ಕಳು ಹೆಣ್ಣು. 5ನೇ ಮಗನೇ ನಾನು. 6ನೇ ಮಗು ಗಂಡು. ನನ್ನ ತಮ್ಮ 6ನೇ ಮಗು ಹೆರಿಗೆ ಹೆರಿಗೆಯ ಸಂದರ್ಭದಲ್ಲಿ ನಂಜು ಉಂಟಾಗಿ ನನ್ನ ತಾಯಿ ಮೃತಪಟ್ಟಳು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಹೆರಿಗೆ ನಂಜಿಗೆ ಈಗಿನಂತೆ ಔಷಧೋಪಚಾರಗಳು ಇರಲಿಲ್ಲ. ನನ್ನ ತಾಯಿ ಮೃತಪಟ್ಟಾಗ ನನ್ನ ತಂದೆ ನೊಣವಿನಕೆರೆಯಲ್ಲೇ ಉಪಾಧ್ಯಾಯರಾಗಿದ್ದರು.", "ನನ್ನ ತಂದೆ, ತಾಯಿಗೆ ಮೊದಲನೆ ಗಂಡು ಮಗು ಶಿಶು ಹಂತದಲ್ಲಿಯೇ ಮೃತಪಟ್ಟ ನಂತರ 2ನೇ ಹೆಣ್ಣು ಮಗುವೇ ಗರುಡಮ್ಮ ಇವಳನ್ನು ಅಮ್ಮಾಳಕ್ಕ ಎಂದು ಕರೆಯುತ್ತಿದ್ದೆವು. ಕಾರಣ, ಮಗು ಚಿಕ್ಕದಾಗಿರುವಾಗ್ಗೆ ನನ್ನ ತಂದೆ ತಾಲ್ಲೂಕು ಚಂದ್ರಶೇಖರಪುರದಲ್ಲಿ ಉಪಾಧ್ಯಾಯರಾಗಿದ್ದರು. ಪಕ್ಕದ ಮನೆಯಲ್ಲಿ ಒಬ್ಬ ಅಯ್ಕರ್‌ ಶೇಕದಾರರು ವಾಸವಾಗಿದ್ದರು. ಅವರು ಈ ಮಗುವನ್ನು \"ಅಮ್ಮಾಳ' ಎಂದು ತಮಿಳಿನಲ್ಲಿ ಕರೆಯುತ್ತಿದ್ದರಂತೆ. ಮುಂದೆ ಅದೇ ಹೆಸರಾಗಿ ಅಮ್ಮಾಳಕ್ಕ ಎಂದು ಆಯಿತು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಹತ್ತನೇ ವರ್ಷ ವಯಸ್ಸಿನಲ್ಲೇ ಮದುವೆ ಮಾಡುವ ಪದ್ಧತಿಯಂತೆ, ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನಿಗೆ ಕಡಬದ ರೆಕಾರ್ಡ್‌ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಎಂಬುವರಿಗೆ ನಾನು ಹುಟ್ಟುವ ಮೊದಲೇ ವಿವಾಹವಾಗಿತ್ತು ಈ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಕಡಬದ ಸೀತಾರಾಮ ಅಯ್ಯಂಗಾರ್‌ ಚಿಕ್ಕಪ್ಪ ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕ"], ["ಮೈನೆರೆಯುವುದಕ್ಕೆ ಮುಂಚೆಯೇ ಆಕೆಯ ಪತಿ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಮೃತಪಟ್ಟು ನನ್ನ ಅಕ್ಕ ಬಾಲ ವಿಧವೆಯಾದಳು. ನನ್ನ ಅಕ್ಕ ಬಾಲವಿಧವೆಯಾದ ನಂತರ, ನನ್ನ ತಾಯಿ ಹೂವು ಮುಡಿದುಕೊಂಂಡರೆ, ನನಗೂ ಹೂವು ಮುಡಿಸು ಎಂದೂ, ಬೇರೆಯವರ ಮನೆಗೆ ಅರಿಶಿನ ಕುಂಕುಮಕ್ಕೆ ಹೋದರೆ, ನಾನು ಬರುತ್ತೇನೆಂದೂ ಹಟ ಮಾಡುತ್ತಿದ್ದಳಂತೆ. ಆಗಿನ ಕಾಲದಲ್ಲಿ ವಿಧವೆಯರು ಹೂವು ಮುಡಿದುಕೊಳ್ಳುವುದು, ಅರಿಶಿನ ಕುಂಕುಮ ಹಚ್ಚಿಕೊಳ್ಳುವುದು ನಿಶೇಧವಾಗಿತ್ತು. ಇದನ್ನು ನನ್ನ ತಾಯಿ ಗ್ರಹಿಸಿ, ತಾನು ಹೂವು. ಮುಡಿಯುವುದನ್ನೂ, ಬೇರೆಯವರ ಮನೆಗೆ ಅರಿಶಿನ ಕುಂಕುಮಕ್ಕೆ ಹೋಗುವುದನ್ನೂ ಬಿಟ್ಟು ಬಿಟ್ಟರಂತೆ.", "ನನ್ನ ತಾಯಿ ರಾಮಕ್ಕಮ್ಮ ಮೃತಪಟ್ಟ ನಂತರ, ಈ ಅಕ್ಕನೇ ನಮ್ಮನ್ನೆಲ್ಲಾ ಸಾಕಿ ನಮಗೆ ತಾಯಿಯಾದಳು. ಕಡೆಯವರೆಗೆ ನನ್ನ ಸಂಸಾರದಲ್ಲಿಯೇ ಇದ್ದು, ನನ್ನ ಮಕ್ಕಳನ್ನೆಲ್ಲಾ ಸಾಕಿ, ನನ್ನ ಜೊತೆಯಲ್ಲಿಯೇ ಇದ್ದು ಗಣಪತಿ ಹಬ್ಬದ (1982) ಮಾರನೆಯ ದಿನ ಬೆಳಿಗ್ಗೆ ಎದ್ದು, ಚೆನ್ನಾಗಿರುವಂತೆಯೇ ಮೃತಪಟ್ಟಳು. ಈಗೆ. ಮೃತಪಟ್ಟಿದ್ದು ನಮಗಪ್ಪೇ ಆಶ್ಚರ್ಯವಲ್ಲದೆ, ನಮ್ಮ ಬೀದಿಯವರಿಗೆಲ್ಲಾ ಆಶ್ಚರ್ಯವಾಯಿತು. ಇರುವವರೆಗೆ. ಯಾರಿಗೂ ತೊಂದರೆ ಕೊಡದೆ. ಖಾಯಿಲೆಯಾಗದೆ, ನರಳದೆ ಮೃತಪಟ್ಟಳು - ಬೆಂಗಳೂರು ಶೇಷಾದ್ರಿಪುರದಲ್ಲಿ. ಆಗ ನನ್ನ ಕಿರಿಯ ಮಗಳು ಶೈಲಾಳಿಗೆ ಮದುವೆ ಗೊತ್ತಾಗಿತ್ತು. ಲಗ್ನಪತ್ರಿಕೆ ಮಾತ್ರ ಆಗಿರಲಿಲ್ಲ. ಸಾಯುವ ಹಿಂದಿನ ದಿನ ಮದುವೆಗೆ ತಂದಿದ್ದ ಜವಳಿಯನ್ನೆಲ್ಲಾ ನೋಡಿ, ಸಾಯುವ ದಿನ ಎಲ್ಲರೊಡನೆ ಮಾತನಾಡಿ ಸುಖವಾಗಿ ಪ್ರಾಣಬಿಟ್ಟಳು. 2 ದಿನಗಳ ಮೃತರ ಕೆಲಸ ಬೆಂಗಳೂರಲ್ಲೇ ನಡೆಸಿ, ನಂತರ ನಾನು, ನನ್ನ ಹಿರಿಯ ಮಗ ನಾಗರಾಜ್‌ ಮತ್ತು ಜೈರಾಂ ಗಯಾಕ್ಕೆ ಹೋಗಿ 13 ದಿನ ಕೆಲಸ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಿಕೊಂಡು ಬಂದೆವು.", "ನನ್ನ ಅಕ್ಕನ ಪತಿಯ ಮರಣಾನಂತರ ನನ್ನ ತಂದೆ ಅವಳ ಭವಿಷ್ಯದ ಜೀವನೋಪಾಯಕ್ಕೆ ಅನುಕೂಲವಾಗಲೆಂದು ಕೋರ್ಟ್‌ ವ್ಯವಹಾರ ನಡೆಸಿ ಪತಿಯ ಬಾಬ್ತು ಕಡಬದಲ್ಲಿದ್ದ 2 ಎಕರೆ ತರಿ ಜಮೀನನ್ನು ಪಡೆದಿದ್ದರು. ಕಡೆಗೆ ಆ ಜಮೀನು ನನ್ನ ಪಾಲಿಗೆ ಬಂದಿತ್ತು.", "ನನ್ನ ತಂದೆ ತಾಯಿಗಳಿಗೆ 3ನೇ ಮಗು ಹೆಣ್ಣು. ಹೆಸರು ಭಾಗೀರಥಿ. ಎಲ್ಲರೂ \"ಬಾಯಿ' ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ಇವಳು ನನ್ನ ಹಿರಿಯ ಮಗಳು ರೂಪ ಬಣ್ಣಗಳಲ್ಲಿ ವಿನತಾಲಕ್ಷ್ಮಿಯನ್ನು ಹೋಲುತ್ತಿದ್ದಳು."], ["ಇವಳನ್ನು ಶಿವಮೊಗ್ಗೆಯಲ್ಲಿ ಜಿಲ್ಲಾ ಕಛೇರಿಯಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದ ಕಡಬ ಸ್ಥಳದವರಾದ ಮರಾಮತ್‌ ಶಾಮಣ್ಣ, ಶ್ರೀವತ್ಸ ಗೋತ್ರಕ್ಕೆ 2ನೇ ವಿವಾಹವಾಗಿ ಕೊಟ್ಟು ಲಗ್ನವಾಗಿತ್ತು. ಬಹುಶಃ 1917ನೇ ಇಸವಿ. ಶಾಮಣ್ಣನವರ ಮೊದಲನೆ ಹೆಂಡತಿಗೆ 7 ಮಕ್ಕಳಿದ್ದರು. ಮೊದಲನೆ ಮಗಳಿಗೆ ಆಗಲೇ ಲಗ್ನವಾಗಿತ್ತು ಸಂಸಾರ ನಿರ್ವಹಣೆಗಾಗಿ 2ನೇ ಮದುವೆ ಮಾಡಿಕೊಂಡರು. ಆ ಮಲ ಮಕ್ಕಳಿಂದ ನನ್ನ ಅಕ್ಕ ಬಾಯಮ್ಮ ಬಹಳ ಕಿರುಕುಳವನ್ನೇ ಅನುಭವಿಸಿದರು. ನನ್ನ ಅಕ್ಕ ಲಗ್ನವಾಗಿ ಪತಿಯ ಮನೆಗೆ ಪ್ರಥಮವಾಗಿ ಹೋದಾಗ್ಗೆ. ನಾನೂ ಅವಳ ಜೊತೆ ಶಿವಮೊಗ್ಗಕ್ಕೆ ಹೋಗಿ ಒಂದು ವರ್ಷ ಇದ್ದು, ಅಲ್ಲಿನ ಪ್ರಾಥಮಿಕ ಶಾಲೆಯಲ್ಲಿ ಓದುತ್ತಿದ್ದೆನು. ಆ ಮಲ ಮಕ್ಕಳು ನನಗೂ ಕಿರುಕುಳ ಕೊಡುತ್ತಿದ್ದರು.", "ನನ್ನ ಅಕ್ಕ ಬಾಯಮ್ಮ ಗರ್ಭಿಣಿಯಾಗಿ ಹೆರಿಗೆಗೆ ನೊಣವಿನಕೆರೆಗೆ ಕರೆದುಕೊಂಡು ಬಂದಿದ್ದರು. ಹೆರಿಗೆಗಾಗಿ ಬಂದವಳು, ಹೆರಿಗೆಗೆ ಮುಂಚೆಯೇ ಕಾಲರ ಖಾಯಿಲೆಯಿಂದ ಅಕಾಲ ಮರಣಕ್ಕೆ ತುತ್ತಾದಳು. ಪುನಃ ಪತಿಯ ಮನೆಗೆ ಹೋಗಲಿಲ್ಲ. ಈ ಕಾಲದ ಖಾಯಿಲೆಯಲ್ಲಿ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಒಂದೇ ವಾರದಲ್ಲಿ 4 ಜನ ಮೃತಪಟ್ಟರು. ಅದರಲ್ಲಿ ಒಂದೇ ದಿನ ಇಬ್ಬರು ಮೃತಪಟ್ಟರು.", "ಮೊದಲನೆಯದಾಗಿ ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮ ಯಾರ ಆಶ್ರಯದಲ್ಲಿ ಈ ಸಂಸಾರ ಬೆಳೆಯುತ್ತಿತ್ತೋ ಅವರು ಮೃತಪಟ್ಟರು. ಇವರು ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮನವರ ತಂಗಿ. ಇವರಿಗೇ ನನ್ನ ದೊಡ್ಡಪ್ಪ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರನ್ನು ದತ್ತು ಕೊಟ್ಟಿದ್ದರು. ಈ ನಾಚಾರಮ್ಮ ಸಾವನ್ನು ಅಪ್ಪುವ ಮುಂಚೆಯೇ ಇವರ ದತ್ತು ಮಗ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಅವರ ಕುಟುಂಬ (ಪತ್ನಿ) ಮೃತ ಹೊಂದಿದ್ದರು. ಇವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌ ಇನ್ನೂ ಚಿಕ್ಕವರು. ಇವರು ಈಗಲೂ ಇದ್ದಾರೆ. ನನ್ನ ದೊಡ್ಡಪ್ಪ ಮತ್ತು ಅವರ ಪತ್ನಿಯನ್ನು ನಾನು ನೋಡಿಯೇ ಇಲ್ಲ. ಇವರ (ನಾಚಾರಮ್ಭ ಮರಣದ ಮೂರನೇ ದಿನದಲ್ಲಿ ನನ್ನ ಸೋದರತ್ತೆ ಗರುಡಮ್ಮ ಮತ್ತು ನನ್ನ ಗರ್ಭಿಣಿ ಅಕ್ಕ ಬಾಯಮ್ಮ ಮೃತಪಟ್ಟರು, ಕಾಲರಾದಿಂದ. ನಂತರ ಎರಡು ದಿನಕ್ಕೆ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನ ಮಗಳು ಕುಟ್ಟಮ್ಮನ ಮಗ 9 ವರ್ಷದ ಶೇಷಾದ್ರಿ ಎಂಬ ಮಗು ಕಾಲರಾದಿಂದ ಮೃತಪಟ್ಟನು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಕಾಲರಾಕ್ಕೆ ಸರಿಯಾದ ಔಷಧಿಗಳಾಗಲಿ, ಮುಂಜಾಗ್ರತೆ ಕ್ರಮಗಳಾಗಲಿ ಇರಲಿಲ್ಲ. ಒಂದೇ ವಾರದಲ್ಲಿ ಕಾಲರಾದಿಂದ ನಮ್ಮ ಮನೆಯಲ್ಲಿ 4 ಜನರು ಮೃತಹೊಂದಿದ ನಂತರ, ಆವರೆಗೂ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮನವರ ಮನೆಯಲ್ಲಿದ್ದ ಒಟ್ಟು ಕುಟುಂಬವೆಲ್ಲಾ ಚೆಲ್ಲಾಪಿಲ್ಲಿಯಾಗಿ ಪುನಃ ಒಂದುಗೂಡಲಿಲ್ಲ."], ["ಆ ವೇಳೆಯಲ್ಲಿ ಮೈಸೂರಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರ ಮಗಳು ಕುಟ್ಟೆಯಮ್ಮ ನಮ್ಮಗಳನ್ನೆಲ್ಲಾ ಕರೆದುಕೊಂಡು ಮೈಸೂರಿಗೆ ಹೋದರು. ಈವರೆಗೆ ತಂದೆ ತಾಯಿಗಳಿಲ್ಲದೆ ಒಟ್ಟು ಕುಟುಂಬದಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದ ನನ್ನ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌ ನಮ್ಮಿಂದ ಬೇರೆಯಾದರು. ನನ್ನ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌ ಕೆಲವು ದಿನ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರ ಮನೆಯಲ್ಲಿ ವಾಸವಾಗಿದ್ದರು. ಈ ದೇಶಿಕಾಚಾರ್‌ಗೆ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರ ಮಗಳು ಕುಟ್ಟಿಯಮ್ಮನ ಹಿರಿಯ ಮಗಳು. ಅಂಬುಜಮ್ಮ ಎಂಬುವರೊಂದಿಗೆ ವಿವಾಹ ಮಾಡಬೇಕೆಂಬ ಸಂಕಲ್ಪವಿತ್ತು. ಆದರೆ ಅಂಬುಜಮ್ಮನಿಗೆ ಬೇರೆ ಕಡೆ ವಿವಾಹವಾದ ನಂತರ ದೇಶಿಕಾಚಾರ್‌ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರಿಂದ ಬೇರೆಯಾದ ದೇಶಿಕಾಚಾರ್‌ ಒಬ್ಬರೇ ಆ ಮನೆಯಲ್ಲಿ ಉಳಿದರು. ಈ ವೇಳೆಗೆ ನನ್ನ ತಂದೆಗೆ ನೊಣವಿನಕೆರೆಯಿಂದ ಕಂದಿಕೆರೆಗೆ, ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿ ತಾಲ್ಲೂಕು, ವರ್ಗವಾಗಿ ನಮ್ಮ ಸಂಸಾರ ನೊಣವಿನಕೆರೆಯನ್ನು ಬಿಟ್ಟಿತು. ಆಗ ಇನ್ನೂ ವಿವಾಹವಾಗದೇ ಇದ್ದ ದೇಶಿಕಾಚಾರ್‌ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಒಬ್ಬರೇ ಇದ್ದು ಯಾರದೋ ಸಲಹೆಯಂತೆ ಮಾಯಸಂದ್ರದಲ್ಲಿ ಮದುವೆಯಾದರು. ಈ ಮದುವೆ ವಿಚಾರವಾಗಿ ನನ್ನ ದೊಡ್ಡಪ್ಪನ ಮಗ ದೇಶಿಕಾಚಾರ್‌, ತನ್ನ ಚಿಕ್ಕಪ್ಪ ನನ್ನ ತಂದೆಯನ್ನು ಯಾವ ಬಗ್ಗೆಯೂ ಪಸ್ತಾಪಿಸಲಿಲ್ಲ. ಮದುವೆ ಆಹ್ವಾನ ಪತ್ರಿಕೆ ಬೇರೆಯವರ ಹೆಸರಿನಲ್ಲಿದ್ದು ಪೋಸ್ಟಿನಲ್ಲಿ ಕಂದಿಕೆರೆಗೆ ನನ್ನ ತಂದೆಗೆ ಬಂದಿತ್ತು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಲಗ್ಗಪತ್ರಿಕೆಗಳು ಪ್ರಿಂಟ್‌ ಆಗುತ್ತಿರಲಿಲ್ಲ. ಅಂಚೆ ಕಾರ್ಡಿನಲ್ಲಿ ಬರೆಯುತ್ತಿದ್ದರು. ಯಾರ ಹೆಸರಿನಲ್ಲಿಯೋ ಲಗ್ನಪತ್ರಿಕೆ ಬರೆಯಲ್ಪಟ್ಟಿದ್ದು, ಸ್ವಂತ ಚಿಕ್ಕಪ್ಪನೊಡನೆ ಯಾವ ವ್ಯವಹಾರಿಕೆಗಾಗಿಯೂ ಪ್ರಸ್ತಾಪ ಮಾಡದ ಉದಾಸೀನಕ್ಕಾಗಿ ನನ್ನ ತಂದೆ ಈ ವಿವಾಹಕ್ಕೆ ಹೋಗಲಿಲ್ಲ. ಬಹಳ ವರ್ಷಗಳು ದೇಶಿಕಾಚಾರ್‌ಗೂ ನಮಗೂ, ನಾವುಗಳು, ಬೇರೆ ಊರಿನಲ್ಲಿದ್ದದ್ದರಿಂದ ಭೇಟಿಯೇ ಆಗಿರಲಿಲ್ಲ. ಪುನಃ ನನ್ನ ತಂದೆ ನೊಣವಿನಕೆರೆಗೆ ವರ್ಗವಾಗಿ ಬಂದ ನಂತರ, ಕೆಲವು ವರ್ಷಗಳ ತರುವಾಯ, ನಮಗೂ ದೇಶಿಕಾಚಾರ್‌ಗೂ ಭೇಟಿಯಾಗಿ ಸಂಬಂಧ ಮುಂದುವರೆಯಿತು.", "ನನ್ನ ತಂದೆ ತಾಯಿಗೆ 4ನೇ ಸಂತಾನ ಹೆಣ್ಣು ಪಂಕಜ ಎಂಬ ಹೆಸರುಳ್ಳ ಮಗು. ಗಾಜಿನ ಗೊಂಬೆಯಂತೆ ಬೆಳ್ಳಗೆ ಬಹು ಮುದ್ದಾಗಿ ಇತ್ತೆಂದು ಹಿರಿಯರು ಹೇಳುತ್ತಿದ್ದರು. (ಸೌ.ಚಿನ್ನು ತರಹ). ನಾನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮುಂಜೆಯೇ ಈ ಮಗು ಅಕಾಲ ಮರಣವಾಗಿತ್ತು", "ನನ್ನ ತಂದೆ ತಾಯಿಗೆ 5ನೇ ಮಗುವಾಗಿ ನನ್ನ ಜನ್ಮವಾಯಿತು. ಕೀಲಕನಾಮ ಸಂವತ್ಸರದ ಆಶ್ವೀಜ ಮಾಸ, ಶುಕ್ಷ ಪಕ್ಷ. ಪಾಡ್ಯಮಿ ಶನಿವಾರ ಮಧ್ಯಾಹ್ನ ನಾಲ್ಕು ಗಂಟೆಗೆ ನನ್ನ ಜನನ. ದಿನಾಂಕ"], ["26.09.1908. ಆದಿನ ನವರಾತ್ರಿ ಪ್ರಾರಂಭ. ನನ್ನ ಸೋದರಮಾವ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ನನ್ನ ತಾಯಿಯ ಆಜಮ್ಮೃ ಹಾಸನ ತಾಲ್ಲೂಕು ದುದ್ದ ಬಳಿಯಿರುವ ಅಟ್ಟಾವರದಲ್ಲಿ ನನ್ನ ಹುಟ್ಟು, ಅಟ್ಟಾವರದ ಶ್ಯಾನುಭೋಗರ ತೊಟ್ಟಿ ಮನೆಯಲ್ಲಿ ನನ್ನ ಜನನ. ಅಟ್ಟಾವರದ ಶ್ಯಾನುಭೋಗದ ಸಂಸಾರದವರೂ, ನನ್ನ ತಾಯಿಯ ತಾಯಿಯೂ ಸಹೋದರರು. ಆ ತೊಟ್ಟಿ ಮನೆ ಈಗ ಬಿದ್ದು ಹೋಗಿದೆ. ಮಧ್ಯೆ ಮಳೆ ನೀರು ಬೀಳಲು ತೊಟ್ಟಿ, ಸುತ್ತ ಮನೆಗಳು, ಮುಂಭಾಗದಲ್ಲಿ ಹೆಬ್ಬಾಗಿಲು ಮತ್ತು ಎರಡೂ ಕಡೆ ವಿಶಾಲವಾದ ಜಗುಲಿ. ಜಗುಲಿಯ ಮೇಲೆ ಪುರುಷರು ಇಸ್ಪೀಟು, ಪಗಡೆಯಾಡುತ್ತಿದ್ದದ್ದು ನನಗೆ ಜ್ಞಾಪಕವಿದೆ. ಈ ತೊಟ್ಟಿ ಮನೆಯಲ್ಲಿ ಐದಾರು ಸಂಬಂಧ ಕುಟುಂಬಗಳು ಬೇರೆ ಬೇರೆಯಾಗಿ ವಾಸ ಮಾಡುತ್ತಿದ್ದರು. ನಾನು ನವರಾತ್ರಿ ಪಾಡ್ಯದ ದಿನ ಹುಟ್ಟದ್ದರಿಂದ, ಆ ದಿನ ರಾಮ ದೇವರ ಪಾರಾಯಣ ಪ್ರಾರಂಭವಾಗಿವ ಕಾರಣ ಮತ್ತು ನನ್ನ ತಂದೆಯ ತಂದೆ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಹೆಸರಿಡಲು ಉದ್ದೇಶಿಸಿ ನನಗೆ “ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌' ಎಂದು ನಾಮಕರಣ ಮಾಡಿದರು. ಮುಂದೆ ಶಾಲೆಗೆ ಸೇರುವ ಕಾಲಕ್ಕೆ ರಾಮ ಹೋಗಿ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಎಂದು ಆಯಿತು. ಈಗಲೂ ನನ್ನ ಪ್ರವರದಲ್ಲಿ “ರಾಮಕೃಷ್ಣ ಶವರ್ಣಣವಾಂ ಅಹಂ ಅಸ್ಮ್ಥಿಭೋ” ಎಂದೆ ಹೇಳುತ್ತಿರುತ್ತೇನೆ. ನನ್ನ ಮಾತಾಪಿತೃಗಳ ಮೊಟ್ಟ ಮೊದಲನೆ ಗಂಡು ಅಕಾಲ ಮರಣಕ್ಕೆ ತುತ್ತಾಗಿ 3 ಹೆಣ್ಣು ಮಕ್ಕಳ ನಂತರ ಗಂಡು ಮಗುವಾಗಿ ನಾನು ಹುಟ್ಟಿದ್ದರಿಂದ ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ನನ್ನನ್ನು ಅತಿ ಮುದ್ದಿನಿಂದ ಸಾಕುತ್ತಿದ್ದರೆಂದು ಕೇಳಿದ್ದೇನೆ. ಈ ಬಹು ಮುದ್ದಿನಿಂದ ತುಂಬಾ ಚೇಷ್ಟೆ ಮಾಡುತ್ತಿದ್ದೆನೆಂದು ನನ್ನ ಹಿರಿಯರು ಹೇಳುತ್ತಿದ್ದರು. ನಾನು 3 ವರ್ಷದ ಮಗುವಾಗಿದ್ದಾಗ. ನನ್ನ ತಂದೆಯ ತಾಯಿ ಚನ್ನಮ್ಮ ಜೀವಂತವಾಗಿದ್ದರು. ಅವರಿಗೆ ಕಣ್ಣಿನ ಪೊರೆಯಿಂದಾಗಿ ಕಣ್ಣು ಕಾಣಿಸುತ್ತಿರಲಿಲ್ಲ. ನನ್ನನ್ನು ಮುದ್ದಿನಿಂದ ಹತ್ತಿರದಲ್ಲಿ ಕೂರಿಸಿಕೊಂಡು ನನ್ನನ್ನು ಮುಟ್ಟಿ ನೋಡಿ ನನ್ನ ಆಕಾರವನ್ನು ಗ್ರಹಿಸಿ ಮುದ್ದು ಮಾಡುತ್ತಿದ್ದದ್ದು ನನಗೆ ಜ್ಞಾಪಕ. ನನ್ನ ತಾತನ ಹೆಸರು ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಆದದ್ದರಿಂದ, ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮ ಯಜಮಾನರ ಹೆಸರು ಹೇಳಲು ಸಂಕೋಚದಿಂದ ನನ್ನನ್ನು “ಮೂರ್ತಿ” ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ನನ್ನ ಅಜ್ಜಿ ಚನ್ನಮ್ಮ ಹೆತ್ತವರಿಗೆ ತಕ್ಕಂತೆ ರೂಪವತಿಯಾಗಿ ಬೆಳ್ಳಗೆ ಇದ್ದರು. ಸ್ವಲ್ಪ ಕಾಲದ ನಂತರ ಅವರು ಮೃತ ಹೊಂದಿದರು.", "ನಾನು ಹುಟ್ಟಿದಾಗ, ನನ್ನ ತಂದೆ ನೊಣವಿನಕೆರೆಗೆ ನಾಲ್ಕು ಮೈಲಿ ದೂರದಲ್ಲಿರುವ ಕಣತೂರು ಎಂಬ ಊರಿನಲ್ಲಿ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸದಲ್ಲಿದ್ದರು. ನನ್ನ ತಂದೆ ಕಣತೂರು, ಚಂದ್ರಶೇಖರಪುರ, ಹೊನ್ನುಡಿಕೆ ಊರುಗಳಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದುದರಿಂದ, ಆ ಊರುಗಳಲ್ಲಿ ಸ್ಮಾರ್ತರ ವಾತಾವರಣದಲ್ಲಿದ್ದುದರಿಂದ ನನ್ನ ತಾಯಿಗೆ ಮುಂದೆ ನನ್ನ ಪತ್ನಿ ಮತ್ತು ಮಕ್ಕಳಿಗೆ ಸ್ಮಾರ್ತರಲ್ಲಿ ಹೆಚ್ಚು ಅಭಿಮಾನವೇ ಇದ್ದಿತು. ಈ"], ["ಸ್ಮಾರ್ತರ ಸಂಪರ್ಕದಲ್ಲೇ ಇದ್ದುದರ ಕಾರಣ, ನನ್ನ ಅಕ್ಕ ಬಾಯಮ್ಮನಿಗೆ ತನ್ನ 10 ವರ್ಷ ವಯಸ್ಸಿನವರೆಗೆ ತಮಿಳು ಮಾತನಾಡಲು ಬರುತ್ತಿರಲಿಲ್ಲ. ನಾನು ಹುಟ್ಟಿದಾಗ, ನನ್ನ ತಂದೆ ಕಣತೂರು ಎಂಬ ಊರಿನಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದದ್ದನ್ನು ಹಿಂದೆಯೇ ಉದಹರಿಸಿದ್ದೇನಪ್ಪೆ.", "ನಾನು ಹುಟ್ಟದ 11 ತಿಂಗಳಿಗೆ ಬಂದ ಗಣಪತಿ ಹಬ್ಬದ ದಿನ ಮಧ್ಯಾಹ್ನ 12 ಗಂಟೆಗೆ ಒಂದು ಗೂಡೆಯಲ್ಲಿ ಗಣಪತಿ ಮಣ್ಣಿನ ವಿಗ್ರಹವನ್ನು ಇಟ್ಟುಕೊಂಡು ನನ್ನ ತಂದೆಯ ಆತ್ಮೀಯ ದೇವಿರಮ್ಮ ಎಂಬ ಹೆಸರಿನ ಲಿಂಗಾಯತ ಮಹಿಳೆ ನೊಣವಿನಕೆರೆಯಿಂದ ಕಾಲ್ನಡಿಗೆಯಲ್ಲಿ ಬಂದು, ಮೇಷ್ಟೆ ನಿಮಗೆ ಗಂಡು ಮಗು ಆಗಿದೆ. ಇದಕ್ಕಾಗಿ ಊರಿನಿಂದ ಗಣಪತಿ ತಂದಿದ್ದೇನೆ ಎಂದು ಹೇಳಿ, ಮನೆಯಲ್ಲಿ ಗಣಪತಿ ಇಟ್ಟಳಂತೆ. ನನ್ನ ತಂದೆ ತಾಯಿಗೆ ಆಶ್ಚರ್ಯವಾಗಿ, ಅನಿರೀಕ್ಷಿತವಾಗಿ ಬಂದ ಗಣಪತಿಯನ್ನು ಆದಿನ ಪೂಜಿಸಿದರಂತೆ. ಶ್ರೀವೈಷ್ಣವರಲ್ಲಿ ಗಣಪತಿ ಪೂಜಿಸುವ ಪದ್ಧತಿ ಇರದಿದ್ದರೂ, ಆ ದಿನದಿಂದ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಗಣಪತಿ ಹಬ್ಬದ ದಿನ ಗಣಪತಿ ವಿಗ್ರಹವನ್ನು ಇಟ್ಟು ಪೂಜೆ ಮಾಡುವ ಕಾರ್ಯಕ್ರಮ ಆರಂಭವಾಯಿತು.", "ನನ್ನ ತಂದೆ ಕಣತೂರಿನಲ್ಲಿ ಹೆಡ್‌ ಮಾಸ್ಟರ್‌. ಇವರಿಗೆ ತಿಂಗಳಿಗೆ 15/- ರೂ. ಸಂಬಳ. ಅಸಿಸ್ಟೆಂಟ್ಟ ಮಾಸ್ಟರುಗಳಿಗೆ 12/- ರೂ, 10/- ರೂ; ಜವಾನನಿಗೆ 5/-ರೂ. ಸಂಬಳ. ಹೀಗಿದ್ದರೂ, ಈಗ ತಿಂಗಳಿಗೆ 1000/- ರೂ ಸಂಬಳ ಪಡೆಯುವವರಿಗಿಂತ ಉತ್ತಮ ಜೀವನ ನಡೆಸುತ್ತಿದ್ದರು. 1 ರೂ. ಗೆ 15 ಸೇರು ಅಕ್ಕಿ, 1 ರೂ ಗೆ 6ಸೇರು ತೊಗರಿಬೇಳೆ, 2ರೂಗೆ ಒಂದು ಟಿನ್‌ ಸೀಮೆಎಣ್ಣೆ, 18 ಕಾಸಿಗೆ 26 1/2 ತೊಲ ಬೆಣ್ಣೆ, 1 ಸವರನ್ನಿನ ಬೆಲೆ (ಚಿನ್ಫ) 13 ರೂ. ನಮ್ಮ ತಂದೆ ಹೆಡ್‌ ಮಾಸ್ಟರ್‌, ಆ ಊರಿಗೆಲ್ಲಾ ಅವರೇ ದೊಡ್ಡ ಆಫೀಸರು.", "ನಮ್ಮ ತಂದೆ ಎಲ್ಲ ಊರುಗಳಲ್ಲಿಯೂ ದಕ್ಷತೆಯಿಂದ ಜನಾನುರಾಗಿಗಳಾಗಿದ್ದು, ಇವರಿಗೆ ಬೇರೆ ಊರಿಗೆ ವರ್ಗವಾಗಿ ಹೋಗುವಾಗ ಜನರೆಲ್ಲಾ ಒಂದು ರೀತಿಯಲ್ಲಿ ವ್ಯಸನಪಡುತ್ತಾ ಬೀಳ್ಳ್ಕೊಡುತ್ತಿದ್ದರು. ನಮ್ಮ ತಂದೆಗೆ ಕಣತೂರಿನಿಂದ ನೊಣವಿನಕೆರೆಗೆ ವರ್ಗವಾಗಿ ಬಂದ ಮೇಲೆ ನಮ್ಮ ಸಂಸಾರ ಬೇರೆ ಮನೆಯಲ್ಲೇ ವಾಸಮಾಡುತ್ತಿತ್ತು ನೊಣವಿನಕೆರೆಯಲ್ಲೇ ಇಪ್ಪತ್ತು ವರ್ಷಗಳ ಕಾಲ ಉಪಾಧ್ಯಾಯರಾಗಿದ್ದರು. ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬಹಳ ಮಂದಿ ಹಿರಿಯರು ಇವರ ವಿದ್ಯಾರ್ಥಿಗಳಾಗಿದ್ದು, ಇವರು ಪಾಠ ಮಾಡುತ್ತಿದ್ದ ರೀತಿ, ಇವರು ಶಿಕ್ಷಿಸುತ್ತಿದ್ದದ್ದನ್ನು ಸ್ಮರಿಸಿಕೊಳ್ಳುತ್ತಾ ಹೆಚ್ಚು ವಯಸ್ಕರಾಗಿದ್ದ ಇವರ"], ["ವಿದ್ಯಾರ್ಥಿಗಳು ಕಡೆಯವರೆಗೂ ಇವರನ್ನು \"ಮೇಷ್ಟೇ' ಎಂದು ಸಂಂಭೋದಿಸುತ್ತಾ ಗೌರವವನ್ನು ಕೊಡುತ್ತಿದ್ದರು.", "ನಮ್ಮ ತಂದೆ ನೊಣವಿನಕೆರೆಗೆ ವರ್ಗವಾಗಿ ಬಂದ ನಂತರ, ನನ್ನ ತಾಯಿಗೆ ಕಡೇ ಮಗುವಾಗಿ ಒಂದು ಗಂಡು ಮಗು ಹುಟ್ಟಿತು. ಇವರ ಹೆರಿಗೆಯಲ್ಲಿಯೇ ನಮ್ಮ ತಾಯಿಗೆ ಹೆರಿಗೆ ನಂಜಿನಿಂದ (ಇನ್‌ಫೆಕ್ಷನ್‌) ಮೃತಪಟ್ಟಳು. ಆಗ್ಲೆ ಆಸ್ಪತ್ರೆಗಳಾಗಲಿ, ಡಾಕ್ಟರುಗಳಾಗಲೀ ಇರಲಿಲ್ಲ. ನಾಟಿ ಪಂಡಿತರ ಔಷಧಿಯಿಂದ ನನ್ನ ತಾಯಿಗೆ ಗುಣಮುಖವಾಗಲಿಲ್ಲ. ನನ್ನ ತಾಯಿ ಮೃತಳಾದಾಗ ನನಗೆ ಕೇವಲ 3 ವರ್ಷ ತುಂಬಿತ್ತು. ನನ್ನ ತಾಯಿ ಮೃತಳಾಗಿ ಬಾಯಿಗೆ ಅಕ್ಕಿಕಾಳು ಹಾಕಿದ್ದು ಕನಸಿನಂತೆ ಜ್ಞಾಪಕ. ಆಗ ನನಗೆ ಹುಟ್ಟು ಕೂದಲು (ಚೌಲ) ಬಿಡಿಸಿರಲಿಲ್ಲ. ನನ್ನ ಚೌಲವನ್ನು ನಮ್ಮ ಕುಲದೇವರು ಇರುವ ಬಿಂಡಿಂಗನವಿಲೆಯಲ್ಲಿ ಮಾಡಬೇಕೆಂದು ಹರಸಿಕೊಂಂಡು 4 ವರ್ಷ ತುಂಬಿ 5ನೇ ವರ್ಷಕ್ಕೆ ಬಿದ್ದಾಗ ಚೌಲಕ್ಕೆ ಏರ್ಪಾಡು ಮಾಡಿಕೊಂಡಿದ್ದರಂತೆ. ಈ ಮಧ್ಯದಲ್ಲಿಯೇ ನನ್ನ ತಾಯಿ ಮೃತಪಟ್ಟಿದ್ದರಿಂಂದ, ನನಗೆ ಚೌಲ ನಡೆಯಲಿಲ್ಲ. ನನ್ನ ತಾಯಿಗೆ ನಾನೇ ಕರ್ತೃವಾಗಿದ್ದರಿಂದ ಮುಂದಿನ ನನ್ನ ತಾಯಿಯ ಕರ್ಮಗಳನ್ನು ನನ್ನ ಹೆಸರಿನಲ್ಲಿ ನನ್ನ ತಂದೆ ಮಾಡುತ್ತಿದ್ದರು. ನನಗೆ ಉಪನಯನ ಆಗುವವರೆಗೆ.", "ನನ್ನ ತಾಯಿ ಮೃತಪಟ್ಟ ದಿನ, ನನ್ನನ್ನು ನೊಣವಿನಕೆರೆ ಏರಿ (ಕೆರೆ) ಮೇಲೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ, ಮಂಟಪದಲ್ಲಿ ಕೂರಿಸಿ ತಲೆಯನ್ನು ಬೋಳಿಸಿದ್ದು ಜ್ಞಾಪಕ. ನಂತರ ಶವವನ್ನು ಶುದ್ಧಿಗೊಳಿಸಲು ಕೆರೆಯಿಂದ ಓಲಗದೊಡನೆ ನೀರು ತರುವ ಪದ್ಧತಿ ಈಗಲೂ ಹಳ್ಳಿಗಳಲ್ಲಿದೆ. ಅದರಂತೆ ನನ್ನ ಕೈಗೆ ಒಂದು ಸಣ್ಣ ತಾಮ್ರದ ಮಿಳ್ಳೆಯಲ್ಲಿ ನೀರು ತುಂಬಿಕೊಟ್ಟರು. ಅದನ್ನು ಮನೆಗೆ ತಂದು ಶವದ ಮೇಲೆ ಹಾಕಿಸಿದರು. ಅನಂತರ ಯಾರೋ ನಮ್ಮವರೊಬ್ಬ ಹೆಂಗಸರು ಸ್ಮಶಾನಕ್ಕೆ ನನ್ನನ್ನು ಎತ್ತಿಕೊಂಡು ಹೋದರು. ಶವಕ್ಕೆ ಅಗ್ನಿ ಸ್ಪರ್ಷವಾದ ನಂತರ ನನ್ನನ್ನು ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಬಂದು ಸ್ನಾನ ಮಾಡಿಸಿದ್ದು ಜ್ಞಾಪಕವಿದೆ.", "ನಮ್ಮ ತಾಯಿ ಮರಣಾನಂತರ, ನಮ್ಮ ಮನೆಯಲ್ಲಿ (ಇದ್ದದ್ದು) ನನ್ನ ತಂದೆ, ವಿಧವೆಯಾದ ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕ, ಮತ್ತೊಬ್ಬ ಮದುವೆಯಾಗದಿರುವ ನನ್ನ ಅಕ್ಕ ಭಾಗೀರಥಿ, ನಾನು ಮತ್ತು ನನ್ನ ತಾಯಿಯ ಕಡೆಯ ಹೆರಿಗೆಯ ನನ್ನ ತಮ್ಮ ನನ್ನ ಚಿಕ್ಕ ಅಜ್ಜಿ ನಾಚಾರಮ್ಮ ನಮ್ಮ ಸೋದರತ್ತೆ ಗರುಡಮೃ್ಮ ಮತ್ತೊಬ್ಬ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮ ಮತ್ತು ನಮ್ಮ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌. ಈ ವೇಳೆಗೆ ನನ್ನ ದೊಡ್ಡಪ್ಪ ಮತ್ತು ದೊಡ್ಡಮ್ಮ ಮೃತರಾಗಿ ದೇಶಿಕಾಚಾರ್‌ ತಬ್ಬಲಿಯಾಗಿ ಅಜ್ಜಿ ಮತ್ತು ಸೋದರತ್ತೆಯರು"], ["ಪಾಲಕರಾಗಿದ್ದರು. ನನ್ನ ತಾಯಿ ಮೃತಳಾದಾಗ ನನ್ನ ತಂದೆಗೆ 35-40 ವರ್ಷ ವಯಸ್ಸು ಬೇರೆ ಮದುವೆಯಾಗುವಂತೆ ಅವರ ಮನಸ್ಸನ್ನು ಪರಿವರ್ತಿಸಲು ಬಹಳಷ್ಟು ಜನಗಳು ಪ್ರಯತ್ನಪಟ್ಟರೂ, ಮಕ್ಕಳ ಯೋಗಕ್ಷೇಮಕ್ಕಾಗಿ ತ್ಯಾಗ ಮಾಡಿ ಕಡೆಯವರೆಗೂ ಬೇರೆ ಮದುವೆ ಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ. ಇನ್ನು, ಅವರ ಪ್ರಾಯದಲ್ಲಿ ಪತ್ನಿ, ನಮ್ಮ ತಾಯಿ ಮೃತಪಟ್ಟ ಕಾರಣ, ನಮ್ಮ ತಂದೆಗೆ ಪರಸ್ತ್ರೀ ವ್ಯಾಮೋಹ ಇತ್ತೆಂದರೆ ಅತಿಶಯೋಕ್ತಿಯಲ್ಲ.", "ಹೀಗಾಗಿ ನಮ್ಮಗಳನ್ನೆಲ್ಲಾ ಸಾಕಬೇಕಾದ ಜವಾಬ್ದಾರಿ ನನ್ನ ಹಿರಿಯಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನ ಪಾಲಿಗೆ ಬಂತು. ಇನ್ನೂ ನನ್ನ ಅಕ್ಕನಿಗೆ ಚಿಕ್ಕ ವಯಸ್ಸು. ನೆರೆಹೊರೆಯರ ಮತ್ತು ನನ್ನ ಚಿಕ್ಕಜ್ಜಿ ಮತ್ತು ಸೋದರ ಅತ್ತೆಗಳ ನೆರವಿನಿಂದ ನಮ್ಮ ನಮ್ಮ ಸಂಸಾರದ ಜವಾಬ್ದಾರಿ ಹೊತ್ತು ನಮ್ಮಗಳನ್ನು ಕಡೆಯವರೆಗೂ ಸಾಕಿ ಮರಣಾನಂತರ ನನ್ನ ಸಂಸಾರದಲ್ಲಿದ್ದು ನನ್ನ ಮಕ್ಕಳನ್ನೆಲ್ಲಾ ನೋಡಿ ಮೃತಳಾದಳು. ನಮ್ಮಗಳ ಜೊತೆಗೆ, ನನ್ನ ತಾಯಿಯ ಕಡೆ ಹೆರಿಗೆಯ ಗಂಡು ಮಗುವನ್ನು ಸಾಕುವ ಜವಾಬ್ದಾರಿಯೂ ಅವಳಿಗೆ ಲಭಿಸಿತ್ತು.", "ಈ ಮಧ್ಯೆ, ನಮ್ಮ ಚಿಕ್ಕಜ್ಜಿ, ಸೋದರತ್ತೆ ಗರುಡಮ್ಮ ಮದುವೆಯಾಗಿ ಹೆರಿಗೆಗೆ ಬಂದಿದ್ದ ನನ್ನ ಅಕ್ಕ ಭಾಗೀರಥಿ ಒಂದು ವಾರದಲ್ಲಿ ಕಾಲರಾದಿಂದ 4 ಜನ ಮೃತಪಟ್ಟ ವಿಚಾರ ಹಿಂದೆಯೇ ಬರೆದಿದ್ದೇನೆ.", "ನಂತರ ನಮ್ಮ ತಂದೆಗೆ ನೊಣವಿನಕೆರೆಯಿಂಂದ ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿ (ತಾಲ್ಲೂಕು) ಕಂದಿಕೆರೆಗೆ ವರ್ಗವಾಗಿ, ನನ್ನ ತಂದೆ, ನಾನು, ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಜಕ್ಕ, ನನ್ನ ತಮ್ಮ ಎಳೆಮಗು ಇಷ್ಟು ಮಂದಿ ಕಂದಿಕೆರೆ. ವಾಸಕ್ಕೆ ಹೋದೆವು. ಈವರೆಗೂ ಒಟ್ಟಗಿದ್ದ ನನ್ನ ದೊಡ್ಡಪ್ಪನ ಮಗ ದೇಶಿಕಾಚಾರ್‌ ಒಬ್ಬಂಟಿಗನಾಗಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿದ್ದು, ಅವನ ಮದುವೆ. ನಂತರವೇ ಪುನಃ ಒಬ್ಬರನ್ನೊಬ್ಬರು ನೋಡಿದ್ದು. (ಮತ್ತೆ ನನ್ನ ತಂದೆಗೆ ವರ್ಗವಾಗಿ ನೊಣವಿನಕೆರೆಗೆ ಬಂದಾಗಲೇ).", "ನೊಣವಿನಕೆರೆಯಿಂದ ಕಂಡಿಕೆರೆಗೆ 35 ಮೈಲಿ ಫಾಸಲೆ. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಲಾರಿ ಬಸ್ಸುಗಳು ಇಲ್ಲವಾಗಿ ಎತ್ತಿನ ಗಾಡಿಯಲ್ಲಿ ಸಾಮಾನುಗಳ ಸಹಿತ ಪ್ರಯಾಣ ಮಾಡಿದೆವು. 1 1/2 ದಿನದ ಪ್ರಯಾಣ ಮಧ್ಯದಲ್ಲಿ ಅಡಿಗೆ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದೆವು. ನಮ್ಮ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನವರಿಗೆ ಗಾಡಿ, ಬಸ್ಸು, ರೈಲು ಪ್ರಯಾಣದಲ್ಲಿ ವಾಂತಿ. ಗಾಡಿ ಪ್ರಯಾಣದಲ್ಲಿ ಉಪವಾಸದಿಂದ ಸುಸ್ತಾಗಿ ಗಾಡಿಯಲ್ಲಿ ಮಲಗಿರುತ್ತಿದ್ದಳು."], ["ಗಾಡಿಯಲ್ಲಿ ಶವ ಹೇರಿಕೊಂಡು ಹೋಗುತ್ತಿದ್ದೇವೆ ಎಂದು ನನ್ನ ತಂದೆ ಹೇಳುತ್ತಿದ್ದರು. ನನಗೆ ಆಗ 10 ವರ್ಷ ವಯಸ್ಸು", "ನನ್ನ ತಮ್ಮ ಬಹು ಮುದ್ದಾಗಿ ಲಕ್ಷಣವಾಗಿದ್ದ. ಅವನಿಗೆ ದೊರೆ, ದೊರೈಸ್ವಾಮಿ ಎಂದು ಹೆಸರಿಟ್ಟಿದ್ದರು. ತಾಯಿ ಇಲ್ಲದ ಮಗುವಿಗೆ ಹಸು ಮತ್ತು ಎಮ್ಮೆಯ ಹಾಲಿನಿಂದಾಗಿ ಅವನಿಗೆ ೮1೯೧ಂಂ೬5 ೦8 1೫೮: ಎಂಬ ಪಿತ್ತಕೋಶದ ಕಾಯಿಲೆಯಿಂದಾಗಿ ಹೊಟ್ಟೆ ಊದಿಕೊಂಡು, ನರಗಳೆಲ್ಲಾ ಹಸಿರು ಬಣ್ಣವಾಗಿ ಕ್ಸ ಕಾಲು ಕಡ್ಡಿಯಂತಾಗಿತ್ತು. ಆಸ್ಪತ್ರೆ, ಔಷಧಿಗಳಿಲ್ಲದೆ ಖಾಯಿಲೆ ಉಲ್ಬಣವಾಗಿತ್ತು. ಮುಖದ ಕಳೆ ಮಾತ್ರ ಬಹಳ ಚೆನ್ನಾಗಿತ್ತು. ಅವನಿಗೆ ವಿಪರೀತ ಬುದ್ಧಿ. ನಾನು ಮನೆಯಲ್ಲಿ ಓದಿಕೊಳ್ಳುವುದನ್ನು ಕೇಳುತ್ತಾ ಎಲ್ಲಾ ಪದ್ಯ, ಪಾಠ ಮತ್ತು ಮಗ್ಗಿಗಳನ್ನು ಹೇಳುತ್ತಿದ್ದನು. ಆ ಖಾಯಿಲೆಗೆ ಸರಿಯಾದ ಔಷಧ ಗೊತ್ತಿಲ್ಲದೆ. ಬೊಂಬಾಯಿಯಿಂದ ನಮ್ಮ ತಂದೆ, ಡೋಂಗರೆಯವರ ಬಾಲಾಮೃತ ಎಂಬ ಔಷಧಿಯನ್ನು ಜಾಹೀರಾತು ನೋಡಿ 708 7೫-೦೮1 ಮೂಲಕ ತರಿಸಿಕೋಮಡು ಅವನಿಗೆ ಕೊಡುತ್ತಿದ್ದರು. ಈಗಿನಷ್ಟು ವೈದ್ಯ (ಕೀಯ) ಆಗ ನನಗೆ ಅಥವಾ ನನ್ನ ತಂದೆಗೆ ಗೊತ್ತಿದ್ದರೆ ಅವನನ್ನು ಉಳಿಸಿಕೊಳ್ಳ ಬಹುದಿತ್ತು. ಇದೇ ಖಾಯಿಲೆ ನನ್ನ 4ನೇ ಮಗ ಶ್ರೀಧರನಿಗೆ ಬಂದಿದ್ದು ಸರಿಯಾದ ನನ್ನ ಔಷಧ ಮತ್ತು ಅವನ ತಾಯಿಯ ಉಪಚಾರದಿಂದ ಗುಣಮುಖನಾದನು. ಹೀಗೆ ನನ್ನ ತಮ್ಮ 8 ವರ್ಷದವರೆಗೆ ಬದುಕಿ ಇದೇ ಖಾಯಿಲೆಯಿಂದ ಮೃತಪಟ್ಟನು. ನನ್ನ ತಂದೆ ಅವನ ದೇಹವನ್ನು ಎತ್ತಿಕೊಂಡು ಹೋಗಿ ದಹನ ಕ್ರಿಯೆ ಮಾಡಿದರು. ಇನ್ನು ಉಳಿದವರು ನನ್ನ ತಂದೆ, ನನ್ನ ಅಕ್ಕ ಮತ್ತು ನಾನು ಮಾತ್ರ. ಇಲ್ಲಿಯೂ ನನ್ನ ತಂದೆಗೆ ಸ್ಕೂಲ್‌ ಹೆಡ್‌ ಮಾಸ್ಟರ್‌ ಜೊತೆಗೆ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಸಿಕ್ಕಿತ್ತು. ತಿಂಗಳಿಗೆ 6/- ಸಂಬಳ. ವಾರಕ್ಕೆ 2 ದಿನ ಮಾತ್ರ ಪೋಸ್ಟ್‌ ಬರುತ್ತಿತ್ತು. ಕಂದಿಕೆರೆಯಲ್ಲಿ ನನ್ನ ವಿದ್ಯಾರ್ಥಿ ಜೀವನ ಚೆನ್ನಾಗಿತ್ತು. ಮುಂದೆ ನಾನು ಹುಳಿಯಾರಿನಲ್ಲಿರುವಾಗ, ನನ್ನ ಮಗ ನಾಗರಾಜ್‌ ಇದೇ ಊರಿಗೆ ಮೆಡಿಕಲ್‌ ಆಫೀಸರಾಗಿದ್ದಾಗ್ಗೆ. ಆಗಾಗ್ಗೆ ಅಲ್ಲಿಗೆ ಹೋಗಿ, ನನ್ನ ಹಳೆಯ ಸಹಪಾಠಿಗಳನ್ನು ನೋಡುತ್ತಾ ಹಿಂದಿನ ದಿನಗಳನ್ನು ನೆನೆಸಿಕೊಳ್ಳುತ್ತಿದ್ದೆನು. ಈಗ ನನ್ನ ಇಬ್ಬರು ಸಹಪಾಠಿಗಳು ಮಾತ್ರ ಅಲ್ಲಿ ಜೀವಂತವಾಗಿದ್ದಾರೆ.", "ಕಂದಿಕೆರೆಯಲ್ಲಿ 20 ಮನೆ ಸ್ಮಾರ್ತ ಬ್ರಾಹ್ಮಣರು ಇದ್ದವು. ಇಲ್ಲಿಯೂ ನಮಗೆ ಸ್ಮಾರ್ತ ಬ್ರಾಹ್ಮಣರ ಸಂಪರ್ಕ. ಇಲ್ಲಿ ನಮ್ಮ ತಂದೆ ಹೆಡ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿ ನಾಲ್ಕು ವರ್ಷ ಇದ್ದರು. 4 ವರ್ಷವೂ 1.8. ಪರೀಕ್ಷೆಗೆ ಕಟ್ಟುತ್ತಿದ್ದ ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳು ಪಾಸ್‌ ಆಗುತ್ತಿದ್ದರು. ಕಾರಣ ನಮ್ಮ ತಂದೆ ರಾತ್ರಿಯಲ್ಲಿ ಎಲ್ಲಾ"], ["ವಿದ್ಯಾರ್ಥಿಗಳಿಗೂ ನಮ್ಮ ಮನೆಯಲ್ಲೇ ಪಾಠ ಮಾಡುತ್ತಿದ್ದರು. ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳೂ ರಾತ್ರಿ ನಮ್ಮ ಮನೆಯಲ್ಲೇ ಓದಿ, ಅಲ್ಲಿಯೇ ಮಲಗಿ ಬೆಳಗಿನ ಜಾವ ಎದ್ದು ಓದುವುದು ನಂತರ ಸ್ಕೂಲು. ಇದಕ್ಕಾಗಿ ನಮ್ಮ ತಂದೆ ಯಾವ ಶುಲ್ಕವನ್ನೂ ಪಡೆಯುತ್ತಿರಲಿಲ್ಲ. ವಿದ್ಯಾರ್ಥಿಗಳು ಪಾಸ್‌ ಆದ ನಂತರ ಅವರ ತಂದೆ ತಾಯಿಗಳು ಯಥಾಶಕ್ತಿ ಗುರುದಕ್ಷಿಣೆ ಕೊಡುತ್ತಿದ್ದರು. ಈ ಪರೀಕ್ಷೆ ಫಲಿತಾಂಶದಿಂದ ನನ್ನ ತಂದೆಗೆ ಇಲಾಖೆಯಲ್ಲಿ ಶ್ರೇಷ್ಠತೆ ಮತ್ತು ದಕ್ಷ ಉಪಾಧ್ಯಾಯರೆಂದು ಪ್ರಶಸ್ತಿ ಬಂದಿತ್ತು. ಈ ಊರಿನಲ್ಲಿ 1922ನೇ ಇಸವಿಯಲ್ಲಿ ಕನ್ನಡ ಎಲ್‌.ಎಸ್‌. ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆ ಹೊಂದಿದೆನು.", "ಈ ಊರಿನಲ್ಲಿ ಇಂಗ್ಲಿಷ್‌ ಶಾಲೆ ಇರಲಿಲ್ಲ. ನಾನೊಬ್ಬನೇ ನೊಣವಿನಕೆರೆಗೆ ಹೋಗಿ ಬೇರೆಯವರ ಮನೆಯಲ್ಲಿದ್ದು ಇಂಗ್ಲಿಷ್‌ ಶಾಲೆಗೆ ಸೇರಿಕೊಂಡೆನು. ಆರು ತಿಂಗಳ ತರುವಾಯ ನನ್ನ ತಂದೆ ನೊಣವಿನಕೆರೆಗೆ ವರ್ಗ ಮಾಡಿಸಿಕೊಂಡು ಬಂದರು. ಆಗ್ಲೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನನಗೆ ಉಪನಯನ ಆಯಿತು. ನನ್ನ ತಾಯಿ ಇಲ್ಲದ್ದರಿಂದ, ನೊಣವಿನಕೆರೆಯಲ್ಲೇ ಇದ್ದ ನನ್ನ ತಾಯಿಯ ಅಕ್ಕನ (ದೊಡ್ಡಮೃ) ಮಗಳಾದ ರುಕ್ಕಮ್ಮ ಅವರ ಯಜಮಾನರಾದ ಕುಟ್ಟಿ ಶ್ಯಾಮ ಅಯ್ಯಂಗಾರ್‌ ನನ್ನ ಉಪನಯನದ ಸಂದರ್ಭದಲ್ಲಿ ಮಣೆ ಮೇಲೆ ಕೂತಿದ್ದರು. ಅವರಿಗೆ ಮಕ್ಕಳಿರಲಿಲ್ಲ. ರುಕ್ಕಮ್ಮ ಎಂದರೆ, ಬೆಂಗಳೂರಿನಲ್ಲಿರುವ ಗೋಪಾಲ ಮತ್ತು ನರಸಿಂಹನ ದೊಡ್ಡಮ್ಮ", "1925ರಲ್ಲಿ ನಾನು ಇಂಗ್ಲಿಷ್‌ ೬5 ನಲ್ಲಿ ತೇರ್ಗಡೆಯಾದೆನು. ಆ ಕಾಲದಲ್ಲಿ ಹೈಸ್ಕೂಲ್‌ ಕೇವಲ ಡಿಸ್ಟ್ರಿಕ್ಟ್‌ 11686-0೬೩167 ನಲ್ಲಿ ಮಾತ್ರ ಇತ್ತು ನಂತರ ನಮ್ಮ ತಂದೆಗೆ ತುಂಕೂರು ತಾಲ್ಲೂಕು ನಾಗವಲ್ಲಿ ಎಂಬ ಊರಿಗೆ ವರ್ಗವಾಯಿತು. ಇಲ್ಲಯೂ ಅವರು ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸದ ಜೊತೆಗೆ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿದ್ದರು.", "ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನನಗೆ ಇಂಗ್ಲಿಷ್‌ 15 7886 ಆದ ನಂತರ ಮೈಸೂರಿನಲ್ಲಿ ವಾಸವಾಗಿದ್ದ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರ ಮಕ್ಕಳು ರಾಜಮ್ಯ ಕುಟ್ಟಿಯಮ್ಮನವರ ಮನೆಯಲ್ಲಿದ್ದು ಮಹಾರಾಜಾಸ್‌ ಹೈಸ್ಕೂಲು ಸೇರಿದೆ. ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕ ನಾಗವಲ್ಲಿ ಊರಿನಲ್ಲಿದ್ದರು. ಕೆಲವು ದಿನಗಳು ಮೈಸೂರಿನಲ್ಲಿ ಕುಟ್ಟಿಯಮ್ಮನವರ ಮನೆಯಲ್ಲಿದ್ದು, ಊಟಕ್ಕೆ ಸರಿಯಾಗಿ ಆಗದೆ, ತೊಂದರೆಯಾಗಿ ಬೇರೆ ರೂಮು ಮಾಡಿಕೊಂಡು ವಾರ ಮಾಡಿಕೊಂಡಿದ್ದೆ. ನನ್ನ ಈ ತೊಂದರೆಯನ್ನು ನನ್ನ ತಂದೆಗೆ ತಿಳಿಸಿ ನಾಗವಲ್ಲಿಯ ಹತ್ತಿರದಲ್ಲಿದ್ದ ತುಂಕೂರಿನಲ್ಲಿ ನನ್ನ ವ್ಯಾಸಂಗಕ್ಕೆ ಅನುಕೂಲ ಮಾಡಿಕೊಡಿರೆಂದೂ, ಅಡಿಗೆ ಮಾಡಿಕೊಂಡು"], ["ವ್ಯಾಸಂಗ ಮಾಡಿಕೊಳ್ಳುತ್ತೇನೆಂದೂ ಹೇಳಿದಾಗ, ನನ್ನ ತಂದೆ ಮನಸ್ಸು ಮಾಡಲಿಲ್ಲ. ಬೇರೆಯವರ ಮನೆಯಲ್ಲಿ ಊಟ ವಗೈರೆಗಳು ಸರಿಯಾಗದೆ ನನ್ನ ಹೈಸ್ಕೂಲು ವ್ಯಾಸಂಗವನ್ನು ಬಿಟ್ಟು ನನ್ನ ತಂದೆಯಿದ್ದ ನಾಗವಲ್ಲಿ ಗ್ರಾಮಕ್ಕೆ ಹೋದೆನು. ನನ್ನ ತಂದೆಗೆ 34 (19259) ವರ್ಷ ಕೆಲಸ ಮಾಡಿ 40 ವರ್ಷ ಪೆನ್‌ಷನ್‌ನನ್ನು ತಂದೆ ಪಡೆದರು. ನನ್ನ ತಂದೆ ಪೆನ್‌ಷನ್‌ ಆದಾಗ ನಡೆದ ಸತ್ಕಾರ ಕೂಟದ ನನ್ನ ತಂದೆಯ ಫೋಟೋ (ನನ್ನ ಮಗ ನಾಗರಾಜನ) ಮನೆಯಲ್ಲಿದೆ.", "ನನ್ನ ತಂದೆಯ ಪೆನ್‌ಷನ್‌ ಆದ ನಂತರ ನನಗೆ ನಾಗವಲ್ಲಿಯಲ್ಲಿಯೇ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಸಿಕ್ಕಿ ಆರು ತಿಂಗಳ ತರುವಾಯ ನನ್ನ ತಂದೆಗೆ ಆಗದಿರುವ ಒಬ್ಬ ಅಧಿಕಾರಿಯಿಂದ ನನ್ನ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಹೋಯಿತು. ಈ ಕೆಲಸ ಹೋದದ್ದು ನನ್ನ ಮುಂದಿನ ಜೀವನೋಪಾಯಕ್ಕೆ ಒಳ್ಳೆಯದೇ ಆಯಿತು.", "ಪೆನಷನ್‌ ಆಗಿ ತನ್ನ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಹೋದ ನಂತರ, ನನ್ನ ತಂದೆ ತಮ್ಮ ಸ್ಥಳವಾದ ನೊಣವಿನಕೆರೆಗೆ ಬಂದು ನೆಲೆಸಿದರು. ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಒಂದು ಹಳೇ ಮನೆ ಚಿಟ್ಟು ಬೇರೆ ಯಾವುದೇ ರೀತಿಯ ಆಸ್ತಿಗಳಿರಲಿಲ್ಲ. ಪೌರೋಹಿತ್ಯದಲ್ಲಿ ಪಾಂಡಿತ್ಯಗಳಿಸಿದ್ದು, ಪೆನ್‌ಷನ್‌ ಸಹ ಪಡೆಯುತ್ತಾ, ಅವರ ಇನ್‌ಶ್ಕೂರೆನ್ಸ್‌ ಬಾಬ್ತು ಬಂದ ಸ್ವಲ್ಪ ಹಣ ಇದ್ದುದರಿಂದ ಅವರು ನೊಣವಿನಕೆರೆಗೆ ಬದಲಾಗಿ ಬೆಂಗಳೂರಿಗೆ ಬಂದು ನೆಲೆಸಿದ್ದರೆ ಬಹಳ ಉಪಯೋಗವಾಗುತ್ತಿತ್ತು", "ನನ್ನ ತಂದೆಯ ಸ್ನೇಹಿತರು ಈ ವಿಚಾರವನ್ನು ಅವರ ಮುಂದಿಟ್ಟಾಗ, ನನ್ನ ತಂದೆ ಕೇಳದೆ, ಸ್ಥಳವೆಂಬ ಅಭಿಮಾನದಿಂದ ನೊಣವಿನಕೆರೆಯಲ್ಲಿಯೇ ವಾಸಿಸಲು ನಿರ್ಧರಿಸಿದರು. ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಇವಾಗ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಸಿಕ್ಕಿತು. ಪೆನ್‌ಷನ್‌ ತಿಂಗಳಿಗೆ 15ರೂ, ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸದಲ್ಲಿ ತಿಂಗಳಿಗೆ 15ರೂ ಸಂಬಳ ಪಡೆಯುತ್ತಿದ್ದರು. ಜೊತೆಗೆ ಪೌರೋಹಿತ್ಯೆಯ. ಒಂದು ಶ್ರಾದ್ಧಕ್ಕೆ ಹೋದರೆ 1/- ರೂ ತರುತ್ತಿದ್ದರು. ಒಂದು ಮದುವೆಗೆ ಹೋದರೆ 15/- ರೂ ತರುತ್ತಿದ್ದರು. ಯಾರನ್ನೂ ಇಷ್ಟು ಕೊಡಿ ಎಂದು ಬಲವಂತ ಮಾಡುತ್ತಿರಲಿಲ್ಲ. ಅವರು ಕೊಟ್ಟಷ್ಟಕ್ಕೆ ತೃಪ್ತಿಯಾಗುತ್ತಿದ್ದರು. ಇದರಿಂದ ಅವರು ತುಂಬಾ ಜನಾನುರಾಗಿಯಾಗಿದ್ದರು."], ["ಮನೆಯಲ್ಲಿದ್ದವರು ನಾವು 3 ಜನ ಮಾತ್ರ. ನನ್ನ ವಿದ್ಯಾಭ್ಯಾಸ ಹೈಸ್ಕೂಲ್‌ ಮಟ್ಟಕ್ಕೆ ನಿಂತು ಹೋಗಿದ್ದು ನನ್ನ ತಂದೆಗೆ ಮತ್ತು ನನ್ನ ಅಕ್ಕನಿಗೆ ಸಮಾಧಾನವಾಗದೇ ಇದ್ದದ್ದು ಮತ್ತು ಪರಸ್ಕಳದಲ್ಲಿ ಊಟ ಉಪಚಾರಗಳಿಗೆ ಅನುಕೂಲವಿಲ್ಲದೆ, ವಿಧಿ ಇಲ್ಲದೆ ಹೈಸ್ಕೂಲ್‌ ವ್ಯಾಸಂಗ ಮಟ್ಟಕ್ಕೆ ನನ್ನ ವಿದ್ಯಾ ವ್ಯಾಸಂಗ ನಿಂತು ಹೋದದ್ದು ನನಗೂ ಮನಸ್ಸು ಸಮಾಧಾನ ಇಲ್ಲವಾಗಿತ್ತು. ನಾನು ಹೈಸ್ಕೂಲಿನಲ್ಲಿ ಕೊಡುತ್ತಿದ್ದ ಮಾಹೆಯಾನ ಫೀಸು 2/- ರೂ, 8 ೧-೮೮6/1) ಆಗಿದ್ದರಿಂದ. ಹೀಗಾಗಿ ಎಲ್ಲರ ಮನಸ್ಸು ದುಗುಡದಿಂದ ಕೂಡಿತ್ತು. ಅಷ್ಟರಲ್ಲಿ ಚಿಕ್ಕನಾಯಕನಹಳ್ಳಿಯಲ್ಲಿ ಶಾಲಾ ಇನ್ಸ್‌ಪೆಕ್ಟರ್‌, ಬೇಲೂರು ಸ್ಥಳದ ಬಿ.ಜೆಲುವಯ್ಯಂಗಾರ್‌ರವರು ನನ್ನ ತಂದೆಗೆ ಪರಿಚಯದವರು. ನನಗೆ ಹಂಗಾಮಿಯಾಗಿ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಕೆಲಸ ಕೊಟ್ಟು ಹುಳಿಯಾರಿಗೆ ನೇಮಕ ಮಾಡಿದರು.", "ನನ್ನ ಅಕ್ಕ ತಿಂಗಳ ಮೂರು ದಿನ ರಜಾ ಇದ್ದಾಗ ನನ್ನ ತಂದೆ ಅಡಿಗೆ ಮಾಡುತ್ತಿದ್ದರು. ನಾನೂ ಸಹ ಅನ್ನ ಸಾರು ಮಾಡುವುದನ್ನು ಕಲಿತುಕೊಂಡಿದ್ದೆನು. ಇದರಿಂದ ಪರಸ್ಥಳದಲ್ಲಿ ಅಡಿಗೆ ಮಾಡಿಕೊಳ್ಳುವುದಕ್ಕೆ ಸಹಾಯವಾಯಿತು.", "ಇದು. ನನ್ನ ಪ್ರಥಮ ಭೇಟಿ ಹುಳಿಯಾರಿಗೆ. ಮತ್ತು ನನ್ನ ಮುಂದಿನ ಸ್ವಂತ ಜೀವನಕ್ಕೆ ಆದಿಯಾಯಿತು. ಈ ಕಾಲದಲ್ಲಿ ಹುಳಿಯಾರಿನಲ್ಲಿ ನನಗೆ ಬಹಳ ಜನ ಮಿತ್ರರೂ, ಆತ್ಮೀಯರೂ ಆದರು. ಇದರಿಂದ ಮುಂದೆ ನಾನು ಹುಳಿಯಾರಿನಲ್ಲಿ ನೆಲೆಸಲು ಸಾಧನವಾಯಿತು. ನನಗೆ ಆಗ ಬರುತ್ತಿದ್ದ ಸಂಬಳ ತಿಂಗಳಿಗೆ 13/- ರೂ ಮಾತ್ರ ಹಂಗಾಮಿಯಾದ ಈ ಉಪಾಧ್ಯಾಯ ಕೆಲಸ 1 ವರ್ಷಕ್ಕೆ ಮುಗಿಯಿತು. ನಂತರ ಚಿಕ್ಕಮಗಳೂರು ಡಿಸ್ಟ್ರಿಕ್ಟ್‌ನಲ್ಲ ಉಪಾಧ್ಯ್ಕಾಯನ ಕೆಲಸ ಸಿಕ್ಕಿ ಕಳಕಸಾಪುರದ ಹತ್ತಿರವಿರುವ ಶಿಂಡಿಗೆರೆ ಗ್ರಾಮಕ್ಕೆ ಉಪಾಧ್ಯಾಯನಾಗಿ ಹೋದೆ. ನಂತರ ಮೂಡಿಗೆರೆಗೆ ಸಮೀಪದ ಕೆಳಗೂರು ಗ್ರಾಮಕ್ಕೆ ವರ್ಗವಾಯಿತು.", "ಈ ವೇಳೆಗೆ ನನ್ನ ವಿವಾದಕ್ಕೆ 4-5 ಹೆಣ್ಣುಗಳು ಬಂದಿದ್ದು ಒಪ್ಪಿಗೆಯಾಗಲಿಲ್ಲ. ನೊಣವಿನಕೆರೆಯ ಒಂದು ಹೆಣ್ಣನ್ನು ನಾನು ಒಪ್ಪಿಗೆ ಕೊಡಲಿಲ್ಲವಾಗಿ ಇದೇ ದ್ವೇಷವನ್ನು ಸಾಧಿಸಿ, ನಾನು ಮುಂದೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಮನೆ ಕಟ್ಟಲು ಆರಂಭಿಸಿದಾಗ, ತೊಂದರೆ ಮಾಡಿ ಕಡೆಗೂ ಅಲ್ಲಿ ನಾನು ಮನೆ ಕಟ್ಟಲಾಗಲಿಲ್ಲ."], ["ಈ ಮಧ್ಯೆ ನನ್ನ ತಂದೆ ಜಮೀನು ವ್ಯವಹಾರಕ್ಕೆ ಆಗಾಗ್ಗೆ ಕಡಬಕ್ಕೆ ಹೋಗಿ ಬರುತ್ತಿದ್ದರು. (ಅಮ್ಮಾಳಮ್ಮ ಉರುಫ್‌ ಗರುಡಮ್ಮನ ಗಂಡನ ಕಡೆಯಿಂದ ಬಂದ 2 ಎಕರೆ ಜಮೀನು). ಅದೇ ಸ್ಥಳದವರಾದ ರಿಟೈರ್ಡ್‌ ಸ್ಕೂಲ್‌ ಮಾಸ್ಟರ್‌ ಮತ್ತು ಕಡಬದಲ್ಲಿ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿದ್ದ ಚಲುವಾ ಭಟ್ಟರು ನನ್ನ ತಂದೆಯ ಬಾಲ್ಯ ಸ್ನೇಹಿತರು ಮತ್ತು ಕಡಬದಲ್ಲಿ ಅವರು ಸಹಪಾಠಿಗಳು. ಇವರ ಸಲಹೆಯ ಮೇರೆಗೆ ನನಗೆ ಕಡಬದ ಹೆಣ್ಣು ಗೊತ್ತಾಗಿ ವಿವಾಹ ನಡೆಯಿತು. ಇನ್ನು ಮುಂದೆ ನನ್ನ ವಿವಾಹದ ಮತ್ತು ಪತ್ನಿಯ ಪೂರ್ವೋತ್ತರಗಳನ್ನು ವಿವರಿಸಿ ಮುಂದೆ, ನನ್ನ ಭಾವಿ ಜೀವನವನ್ನು ವಿವರಿಸುತ್ತೇನೆ.", "ಈ ನನ್ನ ವಿವಾಹ ಸಂಧಾನಕ್ಕೆ ಚೆಲುವಾ ಭಟ್ಟರೇ ಮುಖ್ಯ ಕಾರಣ. ನನ್ನ ತಂದೆ ಯಾವುದೋ ವ್ಯವಹಾರಕ್ಕೆ ಕಡಬಕ್ಕೆ ಹೋಗಿದ್ದಾಗ್ಗೆ, ಅವರ ಮೇಲ್ಕಂಡ ಸ್ನೇಹಿತರು, ನನ್ನ ಭಾವಿ ಪತ್ನಿಯನ್ನು ನೋಡಿ, ಅವರ ಮನೆಯವರು ನನ್ನ ತಂದೆಗೆ ಚೆನ್ನಾಗಿ ಪರಿಚಿತರಾಗಿದ್ದು, ನನ್ನ ಒಪ್ಪಿಗೆಗಾಗಿ ಹೆಣ್ಣಿನ ಫೋಟೋ ಸಮೇತ ನೊಣವಿನಕೆರೆಗೆ ಅವರ ಆಪ್ತರಾದ ಚೆಲುವಾಭಟ್ಟರ ಸಮೇತ ಬಂದರು. ನನ್ನನ್ನು ಅವರು ಭೇಟಿ ಮಾಡಿ ವಿಚಾರ ತಿಳಿಸಿ ಹೆಣ್ಣನ್ನು ನೋಡಲು ನನ್ನನ್ನು ಕಡಬಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋದರು.", "ಆ ಕಾಲದಲ್ಲಿ ನನ್ನ ಸೋದರತ್ತೆ (ಎಗ್ಗಮೃ ಕಡಬದಲ್ಲಿಯೇ ಇದ್ದರು. ಕಡಬದಲ್ಲಿ ಹೆಣ್ಣಿನವರಿಗೆ ನಮ್ಮ ಎಚಾರ ತಿಳಿಸುವಾಗ್ಗೆ ಭಟ್ಟರು, ಎಲ್ಲಾ ಸರಿಯಾಗಿದೆಯಮ್ಮ ಆದರೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಅವರು ಇರುವ ಮನೆ ಮಾತ್ರ ಚೆನ್ನಾಗಿಲ್ಲ. ಕಡಬದಲ್ಲಿರುವ ನಿಮ್ಮ ಮನೆಯ ಕೊಟ್ಟಿಗೆ ಅವರ ಮನೆಗಿಂತ ಎಷ್ಟೋ ವಾಸಿ ಎಂದು ತಿಳಿಸಿದ್ದರಂತೆ. ಈ ಹೆಣ್ಣಿನವರು ನನ್ನ ತಂದೆ ಮತ್ತು ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರಿಗೆ ತುಂಬಾ ಪರಿಚಯವಿದ್ದದ್ದರಿಂದ ಮತ್ತು ನಾನು ಹೆಣ್ಣು ಒಪ್ಪಿಗೆ ಇತ್ತಿದ್ದರಿಂದ ಈ ಹೆಣ್ಣು ನನಗೆ ಗೊತ್ತಾಗಿ ವಿವಾಹವೂ ನಡೆಯಿತು.", "ಆಗಿನ ಕಾಲದಲ್ಲಿ ಹೆಣ್ಣು ರಜಸ್ವತಿಯಾಗುವುದಕ್ಕಿಂತ ಮುಂಚೆಯೇ ವಿವಾಹ ಮಾಡುವ ಪದ್ಧತಿ. ಅದರಂತೆ ನನ್ನ ಹೆಂಡತಿ ಅಲಮೇಲುಗೆ 12 ವರ್ಷ ವಯಸ್ಸು ನನಗೆ 22 ವರ್ಷ ವಯಸ್ಸು. ನನಗೆ ಸರಿಯಾದ ಸರ್ಕಾರಿ ಕೆಲಸ ಇಲ್ಲದಿದ್ದದ್ದು ಮತ್ತು ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿಗಳಿಲ್ಲದಿದ್ದರೂ ನಮ್ಮ ವಂಶ ಮತ್ತು ನನ್ನ ತಂದೆಯ ಪರಿಚಯವಿದ್ದದ್ದರಿಂದ ಇದಾವುದನ್ನೂ ಗಣನೆಗೆ ತಂದುಕೊಳ್ಳದೆ ಈ ಸಂಬಂಧಕ್ಕೆ ಒಪ್ಪಿಗೆ ಅತ್ತರು. ಮುಂದೆ ಈ ನನ್ನ ಪತ್ನಿ ಅದೃಷ್ಟದಿಂದ ಮತ್ತು ಸಂಸಾರ ಜೀವನ ಸುಖಮಯವೇ ಆಯಿತು."], ["ಬಹುಶಃ 1932ನೇ ಇಸವಿ (22 ವರ್ಷ ಅಂದರೆ 1930 ಆಗತ್ರೆ) ಕಾರ್ತಿಕ ಮಾಸದಲ್ಲಿ ಕಡಬದಲ್ಲಿ ನನ್ನ ವಿವಾಹ 8 ದಿನಗಳು, ಆಗಿನ ಕಾಲಕ್ಕೆ ತಕ್ಕಂತೆ, ವಿಜೃಂಭಣೆಯಾಗಿಯೇ ನೆರವೇರಿತು. ನನ್ನ ವಿವಾಹಕ್ಕೆ ನನ್ನ ತಂದೆ, ಅಕ್ಕ, ನನ್ನ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌ ಮತ್ತು 3 ಮಕ್ಕಳು, ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮ ಅವರ ಮಗಳು ಕುಟ್ಟಮ್ಮ ನನ್ನ ಹಿರಿಯ ಸೋದರತ್ತೆ ಮಗ ಬೆಂಗಳೂರಿನಲ್ಲಿ 'ನಂ766 ೩5515187 806176೦: ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ನನ್ನ ತಾಯಿಯ ಸಹೋದರ (ನನ್ನ ಸೋದರ ಮಾವ) ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ನನ್ನ ಸ್ನೇಹಿತ ದಂಪತಿಗಳು-ಒಟ್ಟು 12 ಮಂದಿ ಹೋಗಿದ್ದೆವು.", "ಇನ್ನು ನನ್ನ ಪತಿ ಅಲಮೇಲ ಹುಟ್ಟಿದ ಮನೆಯವರನ್ನು ಪರಿಚಯಿಸುತ್ತೇನೆ.", "ಅಲಮೇಲ ಮನೆ ವಂಶಾವಳಿ", "ಅಲಮೇಲಳ ತಂದೆಯ ತಂದೆ (ಅಂದರೆ ತಾತ) ಹಿರಿಯೂರು ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌. ಶ್ರೀವತ್ಸ ಗೋತ್ರ. ವಡಗಲೈ ಸಂಪ್ರದಾಯ. ಪ್ರಸಿದ್ಧ ವೈದಿಕ ವಿದ್ವಾಂಸರೂ, ಜನಾನುರಾಗಿಗಳೂ ಮತ್ತು ಲೌಕಿಕದಲ್ಲಿ ತುಂಬಾ ಪ್ರತಿಭಾವಂತರು, ನನ್ನ ತಂದೆಯ ಹಾಗೆ. ಇವರ ಧರ್ಮಪತ್ನಿ ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಇವರು ನನ್ನ ಮದುವೆಯ ಕಾಲದಲ್ಲಿ ನಂತರ ಸ್ವಲ್ಪ ವರ್ಷಗಳು ಜೀವಿಸಿದ್ದರು. ನನ್ನ ಮದುವೆ ಕಾಲದಲ್ಲಿ ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಗತಿಸಿ ಸ್ವಲ್ಪ ವರ್ಷಗಳಾಗಿತ್ತು ಚೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಸಹ ಕಡಬದಲ್ಲಿ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿದ್ದರು. ನನ್ನ ತಂದೆ ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ಕಡಬದಲ್ಲಿದ್ದುದ್ದರಿಂದ ನನ್ನ ತಂದೆಗೆ ಅವರ ಪರಿಚಯ ಚೆನ್ನಾಗಿತ್ತು. ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ತೋಟಗಾರಿಕೆಯಲ್ಲಿ ತುಂಬಾ ಆಸಕ್ತಿ ವಹಿಸಿದ್ದರು. ಇವರ ತೋಟದಲ್ಲಿ ತೆಂಗು, ಅಡಿಕೆ, ಬಾಳೆ ಅಲ್ಲದೆ ಎಲ್ಲಾ ರೀತಿಯ ಹೂವಿನ ಗಿಡಗಳೂ, ಹಣ್ಣು ಮರಗಳೂ; ಗುಲಾಬಿ, ಕ್ರೋಟಿನ್‌ ಗಿಡಗಳೂ ಇತ್ತು (ತೋಟದಲ್ಲಿ) ಪಾರ್ಕ್‌ ರೀತಿ ಮಾಡಿ ಕಾಲುದಾರಿಗಳನ್ನು ನಿರ್ಮಿಸಿದ್ದರು. ಕೂರಲು ಕಲ್ಲು ಬೆಂಚುಗಳು, ಒಂದು ಸಣ್ಣ ಮನೆ ಬಾವಿ ಸಹ ತೋಟದಲ್ಲಿತ್ತು. ಇವರು ಪ್ರತಿದಿನ ಬೆಳಗ್ಗೆ ಮತ್ತು ಸಾಯಂಕಾಲಗಳಲ್ಲಿ ತೋಟಕ್ಕೆ ಹೋಗಿ ಆನಂದ ಪಡೆಯುತ್ತಿದ್ದರು. ಇಡೀ ಕಡಬಕ್ಕೆ ಇವರ ತೋಟ ಪ್ರಸಿದ್ಧಿ ಪಡೆದಿತ್ತು ಈ ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಇವರುಗಳ ಹಿಂದಿನ ತಲೆಮಾರು ನನಗೆ ಗೊತ್ತಿಲ್ಲ. ಇವರಿಗೆ ಶ್ರೀನಿವಾಸ ದೇಶಿಕಾಚಾರ್‌ ಉರುಫ್‌ ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಸುಂದರರಾಜ ಅಯ್ಕಂಗಾರ್‌ ಎಂಬ ಇಬ್ಬರು ಗಂಡು ಮಕ್ಕಳು, ಪುಟ್ಟತಾಯಮ್ಮ"], ["ಮತ್ತು ಕಮಲಮ್ಮ ಎಂಬ ಇಬ್ಬರು ಹೆಣ್ಣು ಮಕ್ಕಳು ಇದ್ದರು. ಹಿರಿಯ ಮಗ ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮಗಳೇ ನನ್ನ ಹೆಂಡತಿ ಅಲಮೇಲ.", "ಈ ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ಗೆ ಇಬ್ಬರು ಹೆಂಡತಿಯರು. ನನ್ನ ಮದುವೆಯ ಕಾಲದಲ್ಲಿ ಇಬ್ಬರು ಹೆಂಡತಿಯರೂ ಜೀವಂತವಾಗಿದ್ದರು. ಇಬ್ಬರ ಹೆಂಡತಿಯರ ಹೆಸರೂ ರಂಗಮ್ಮ ಇವರುಗಳನ್ನು ದೊಡ್ಡರಂಗಮ್ಮ ಚಿಕ್ಕರಂಗಮ್ಮ ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ಮೊದಲನೇ ಹೆಂಡತಿ ರಂಗಮ್ಮ ನಮ್ಮ ಕುತ್ಸ ಗೋತ್ರದವರೇ ಆದ ಬಿಡದಿಯ ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮಗಳು. ಹಿರಿಯ ಹೆಂಡತಿ ರಂಗಮ್ಮನವರಿಗೆ ಶ್ರೀನಿವಾಸ, ರಾಜು ಎಂಬ ಇಬ್ಬರು ಗಂಡು ಮಕ್ಕಳು; ಇಂದಿರಮ್ಮ ಮತ್ತು ಅಂಬುಜಮ್ಮ ಎಂಬ ಇಬ್ಬರು ಹೆಣ್ಣು ಮಕ್ಕಳು ಈಗ ಅಂಬುಜಮ್ಮ ಮತ್ತು ರಾಜು ಮಾತ್ರ ಇದ್ದಾರೆ. ರಾಜುಗೆ ನೊಣವಿನಕೆರೆಯ ತಿರುನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ಅಕ್ಕ ಶೇಷಮ್ಮನವರ ಮಗ, ನನ್ನ ಸ್ನೇಹಿತ ರಾಮಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಮಗಳು ಕೊಟ್ಟು ವಿವಾಹವಾಗಿದೆ. ಈಗ (ಅವನು) ಮೈಸೂರಿನಲ್ಲಿ ನೆಲೆಸಿದ್ದಾನೆ.", "ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ 2ನೇ ಮಗ ಸುಂದರರಾಜ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ಚಿಕ್ಕಮಗಳೂರು ಕಾಫಿ ಪ್ಲಾಂಟರ್‌ ಮಗಳು ರಂಗನಾಯಕಮ್ಮ (ಬಾಪಾಚಿತ್ರಿ) ನವರನ್ನು ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು. ಈ ರಂಗನಾಯಕಮ್ಮ ಈಗಲೂ ಬೆಂಗಳೂರಲ್ಲಿದ್ದಾರೆ. ಸುಂದರರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಕೆಲವು ದಿನ ಕಡೂರಿನಲ್ಲಿ ಮತ್ತು ಚಿಕ್ಕಮಗಳೂರಿನಲ್ಲಿ, ನಂತರ ಕಡಬಕ್ಕೆ ಬಂದು ನೆಲೆಸಿ ದೈವಧೀನರಾದರು. ಸುಂದರರಾಜ ಅಯ್ಯಂಗಾರ್‌ರನ್ನು ಅವರ ತಾಯಿ ಮಹಾಲಕ್ಷ್ಮಮ್ಮನವರ ತಂದೆಗೆ, ಅಂದರೆ, ತಾತನವರಿಗೆ ದತ್ತು ಕೊಟ್ಟದ್ದರು. ಕಾರಣ ಅವರಿಗೆ ಸಂತಾನವಿರಲಿಲ್ಲ. ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಅಂದರೆ (ಅಲಮೇಲಳ) ನನ್ನ ಹೆಂಡತಿಯ ಅಜ್ಜ, ಅವರ ತಾಯಿ ಬೆಳಗಾಂ ಜಾನಕಮ್ಮನವರು. ಇವರು ನನ್ನ ಮದುವೆಯ ಕಾಲದಲ್ಲಿ ಜೀವಂತವಾಗಿದ್ದರು. ಈ ಸುಂದರರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಹಿರಿಯ ಮಗ ಅಣ್ಣಯ್ಯನಿಗೆ, ನನ್ನ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್‌ ಮಗಳು ಮಹಾಲಕ್ಷ್ಮಿಯನ್ನು ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು.", "ಚೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಹಿರಿಯ ಮಗಳು ಪುಟ್ಟತಾಯಮ್ಮ ಇವರ ಗಂಡ ರೈಲ್ವೆ ಇಲಾಖೆಯಲ್ಲಿ ಗಾರ್ಡ್‌ ಕೆಲಸದಲ್ಲಿದ್ದು ಮೃತ ಹೊಂದಿದ್ದರು. ಗಂಡ ಮೃತಪಟ್ಟ ನಂತರ, ಪುಟ್ಟತಾಯಮ್ಮ (ತನ್ನ) ತಂದೆ ಚೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ರವರ ಆಶ್ರಯದಲ್ಲಿ ಕಡಬದಲ್ಲಿದ್ದರು. ಪುಟ್ಟತಾಯಮ್ಮ ಬಹಳ ಬುದ್ಧಿವಂತೆ ಮತ್ತು ಜಾಣೆ. ಸಂಗೀತ, ಕರಕುಶಲ ವಿದ್ಯೆಯಲ್ಲಿ ಪ್ರವೀಣೆ. ಇವರೇ ನನ್ನ ಹೆಂಡತಿ ಅಲಮೇಲಳಿಗೆ ಸಂಗೀತ,"], ["ಹಾರ್ಕೊನಿಯಂ ನುಡಿಸುವುದು, ಕರಕುಶಲ ವಿದ್ಯೆಯಲ್ಲಿ ತರಬೇತಿ ಕೊಟ್ಟಿದ್ದರು. ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ನನ್ನ ವಿವಾಹಕ್ಕೆ ಮೊದಲೇ ಮೃತಪಟ್ಟಿದ್ದರು. ಮನೆಯ ಮತ್ತು ಜಮೀನುಗಳ ವ್ಯವಹಾರವನ್ನು ತಂದೆಯ ಮರಣದ ನಂತರ ಪುಟ್ಟತಾಯಮ್ಮನವರೇ ನಿರ್ವಹಿಸುತ್ತಿದ್ದರು. ನನ್ನ ವಿವಾಹ ಕಾರ್ಯಗಳನ್ನೆಲ್ಲಾ ಪುಟ್ಟತಾಯಮ್ಮನವರೇ ಮಾಡಿದರು.", "ಚೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ (ಅವರ) ಕಡೆಯ ಮಗಳು ಕಮಲಮ್ಮ ಇವರ ಪತಿ ರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಬೆಂಗಳೂರಿನ (ಚಾಮರಾಜಪೇಟೆಯಲ್ಲಿರುವ) ಡಿ೧೮ಂ: ಔಯ ನಲ್ಲಿ ೦ಂಂ೬೧1೫! ಆಗಿದ್ದರು. ಇವರಿಬ್ಬರೂ ಈಗಿಲ್ಲ. ಇವರ ಮಕ್ಕಳು ಇರುತ್ತಾರೆ.", "ಇನ್ನು ನನ್ನ ಹೆಂಡತಿ ಅಲಮೇಲ ತಾಯಿಯ ಮನೆ ಪರಿಚಯ", "ಅಲಮೇಲಳ ತಾಯಿಯ ಅಂದರೆ ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರ ತಂದೆ ಕಡಬ ಸ್ಥಳದವರೇ ಆದ ಅಳಸಿಂಗಾಚಾರ್ಯ. ಇವರು ನನ್ನ ತಂದೆಗೆ ಕಡಬದಲ್ಲಿ ಸಹಪಾಠಿ. ಅಳಸಿಂಗಾಚಾರ್‌ಗೆ ಕಡಬದ ದೀಕ್ಷಿತ ಶ್ರೀರಂಗಾಚಾರ್‌ (ಅಣ್ಣಾ ದೊರೈ ತಂದೆ) ರವರ ಸಹೋದರಿ ಕೊಟ್ಟು ವಿವಾಹವಾಗಿತ್ತು.", "ಅಳಸಿಂಂಗಾಚಾರ್‌ ಹಿರಿಯ ಮಗಳು ರಂಗಮ್ಮ ನನ್ನ ಹೆಂಡತಿ ಅಲಮೇಲಳ ತಾಯಿ. ಕಿರಿಯರು ಮೂರು ಜನ ಗಂಡು ಮಕ್ಕಳು- ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌, ವರದರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌. ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ತೀರಿ ಹೋಗಿದ್ದಾರೆ. ಅವರ ಹೆಂಡತಿ ಮೋಹನಮ್ಮ (ಅಮಾಮಿ) ಮತ್ತು ಮಕ್ಕಳು ಬೆಂಗಳೂರಿನಲ್ಲಿದ್ದಾರೆ. ವರದರಾಜು, ಮದುವೆಗೆ ಮುಂಚೆಯೇ ಮಡುವಿನಲ್ಲಿ ಈಜಲು ಹೋಗಿ ಮೃತಪಟ್ಟನು. ಕಡೆಯ ಮಗ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಸಹ ಈಗ ಇಲ್ಲ. ಈ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ದಂಪತಿಗಳೇ ನನ್ನ ಮದುವೆಯಲ್ಲಿ ಮಣೆ ಮೇಲೆ ಕೂತಿದ್ದರು. ಅಳಸಿಂಗಾಚಾರ್‌, ಪತ್ನಿ ತೀರಿಕೊಂಡನಂತರ, ಮಗಳು ರಂಗಮ್ಮನ ವಿವಾಹವಾದ ನಂತರ ಮಕ್ಕಳೊಡನೆ ಕರಾಚಿಗೆ ಹೋಗಿ ನೆಲೆಸಿದ್ದರು. ಅಲ್ಲಿ ಹಿರಿಯ ಮಗ ಶ್ರೀನಿವಾಸ ಅಯ್ಯಂಗಾರ್‌ ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ, ಕಿರಿಯ ಮಗ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ರೈಲ್ವೆ ಇಲಾಖೆಯಲ್ಲಿ ಮತ್ತು ಅಳಸಿಂಗಾಚಾರ್‌ ಸಹ ಅಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದರು. ನನ್ನ ಮದುವೆ ಕಾಲದಲ್ಲಿ ಅವರು ಕರಾಜಿಯಲ್ಲಿಯೇ ಇದ್ದು ಮದುವೆಗೆ ಬಂದಿದ್ದರು. ನನ್ನ ಮದುವೆಗೆ ಅವರೂ ಸ್ವಲ್ಪ ಸಹಾಯ ಮಾಡಿದ್ದರೆಂದು ಹೇಳುತ್ತಿದ್ದರು."], ["ಅಲಮೇಲಳ ಅಜ್ಜಿ (ತಾಯಿಯ ತಾಯಿ) ಮತ್ತು ನನ್ನ ಕಿರಿಯ ಮಗಳು ಶೈಲಾ ಮಾವನವರ ತಾಯಿ ಇಬ್ಬರೂ ಕಡಬದ ದೀಕ್ಷಿತರ್‌ ಮನೆಯ ಹೆಣ್ಣು ಮಕ್ಕಳು. ಅಲಮೇಲಳ ತಾಯಿಯ ತಾಯಿ ದೀಕ್ಷಿತ ಅಣ್ಣಾ ದೊರೈಗೆ ಸೋದರತ್ತೆ (ತಂದೆಯ ಅಕ್ಕ). ಶೈಲಾ ಮಾವನವರ ತಾಯಿ ಅಣ್ಣಾ ದೊರೈಯ ಅಕ್ಕ, (ಅಂದರೆ ಅಲಮೇಲಳ ಅಜ್ಜಿಯ ತಮ್ಮನ ಮಗಳು) ಇಬ್ಬರ ಸಂಬಂಧ ಮತ್ತೆ ಒಂದುಗೂಡಿತು. ಅಳಸಿಂಗಾಚಾರ್‌ ಮನೆ ಕಡಬದಲ್ಲಿ ಸೊಪ್ಪಿನಕಟ್ಟೆ ಅಪ್ರಮೇಯ ಅಯ್ಯಂಗಾರ್‌ ಮನೆ ಎದುರುಗಡೆ ಇತ್ತು.", "ಅಲಮೇಲಳ ತಂದೆ, ನನ್ನ ಮಾವ ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ಗೆ ಇಬ್ಬರು ಹೆಂಡತಿಯರೆಂದು ಈ ಹಿಂದೆ ತಿಳಿಸಿದ್ದೇನೆ. ನನ್ನ ವಿವಾಹ ಕಾಲದಲ್ಲಿ ಈ ಇಬ್ಬರು ಹೆಂಡತಿಯರು ಜೀವಂಂತವಾಗಿದ್ದರು. ಈ ರೀತಿ ಇಬ್ಬರು ಹೆಂಡತಿಯರು ಇದ್ದದ್ದಕ್ಕೆ ಕಾರಣ, ಹಿರಿಯ ಹೆಂಡತಿಗೆ ೫1೪ (ಮೂರ್ಛೆ) ಖಾಯಿಲೆ ಇತ್ತಂತೆ. ಅದಕ್ಕಾಗಿ ನನ್ನ ಮಾವ ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ರವರ ತಂದೆ. ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌, ತಮಗೆ ಪರಿಚಯದ, ಕಡಬದಲ್ಲೇ ಇದ್ದ ಅಳಸಿಂಗಾಚಾರ್‌ರವರ ಏಕಮಾತ್ರ ಪುತ್ರಿ ರಂಗಮ್ಮನವರನ್ನು 2ನೇ ವಿವಾಹವನ್ನು ತಮ್ಮ ಮಗನಿಗೆ ಮಾಡಿದರು. ಇವರೇ ನನ್ನ ಹೆಂಡತಿಯ ತಾಯಿ ರಂಗಮ್ಮ", "ನನ್ನ ಮಾವ ಅಪ್ಪಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮೈಸೂರಿನಲ್ಲಿ ರೈಲ್ವೆ ವರ್ಕ್‌ಶಾಪ್‌ನಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದರು. ಇವರ 2ನೇ ವಿವಾಹದ ತರುವಾಯ ಮೊದಲನೇ ಹೆಂಡತಿಗೆ ಬರುತ್ತಿದ್ದ ೫೬ ವಾಸಿಯಾಯಿತಂತೆ. ನಂತರ ಇಬ್ಬರು ಹೆಂಡತಿಯರೂ ಸ್ವಲ್ಪಕಾಲ ಮೈಸೂರಿನಲ್ಲಿ ಗಂಡನ ಮನೆಯಲ್ಲಿರುತ್ತಿದ್ದು, ನಂತರ ಒಬ್ಬರಿಗೊಬ್ಬರಿಗೆ ಹೊಂದಾಣಿಕೆ ಆಗದಿದ್ದುದರಿಂದ, ಅಲಮೇಲಳ ತಾಯಿ, ನನ್ನ ಅತ್ತೆ ಕಡಬಕ್ಕೆ ಬಂದು ಮಾವ ಅತ್ತೆಯರೊಡನೆ ವಾಸಿಸುತ್ತಿದ್ದರೆಂದು ಗೊತ್ತಾಗಿರುತ್ತೆ.", "ತಂದೆ ಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಜೀವಂತವಾಗಿರುವಾಗ ನನ್ನ ಮಾವ ಕಡಬಕ್ಕೆ ಬಂದು ಮನೆಯಲ್ಲಿರುತ್ತಿದ್ದರಂತೆ. ಚಜೊಕ್ಕಣ್ಣ ಅಯ್ಕಂಗಾರ್‌ ಮೃತಪಟ್ಟ ತರುವಾಯ, ನನ್ನ ಮದುವೆಗೆ ಮುಂಚೆ, ನನ್ನ ಮಾವ ಕಡಬಕ್ಕೆ ಬಂದರೂ ಇವರ ಮನೆಗೆ ಬರದೆ. ಬೇರೆಯವರ ಮನೆಯಲ್ಲಿ ಇಳಿದುಕೊಳ್ಳುತ್ತಿದ್ದರಂತೆ. ಕಾರಣ ತಂದೆಯ ಆಸ್ಮಿಯ ಬಗ್ಗೆ ಇದ್ದ ವಿವಾದ ಮತ್ತು ತಕರಾರು. ನನ್ನ ಮದುವೆಗೂ ಈ ನನ್ನ ಮಾವ, ಅಲಮೇಲಳ ತಂದೆ, ಬರಲಿಲ್ಲ. ಮದುವೆಯಲ್ಲಿ ಮಣೆಯ ಮೇಲೆ ಅಲಮೇಳ ಸೋದರ ಮಾವ (ತಾಯಿಯ ತಮ್ಮ ಕೃಷ್ಣಮೂರ್ತಿ) ಮತ್ತು ಸೋದರತ್ತೆ ಕೂತಿದ್ದರು. ನಾನು ಈ ಹಿಂದೆ ಮೈಸೂರಿನಲ್ಲಿ ಓದುತ್ತಿದ್ದಾಗ ಒಮ್ಮೆ ಇವರನ್ನು ನೋಡಿದ್ದೆ."], ["ಚೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮೃತಪಟ್ಟ ನಂತರ ಅವರ ಪತ್ನಿ ಅಲಮೇಲಳ ಅಜ್ಜಿ, (ಮಹಾಲಕ್ಷಮಮೃ) ಅನೇಕ ವರ್ಷಗಳು ಜೀವಂತವಾಗಿದ್ದರೂ, ಊರಿನಲ್ಲಿ ಯಾರಿಗೂ ಸಾಯುವವರೆಗೆ ಮುಖ ತೋರಿಸದೆ ಒಳಗಡೆ ಇರುತ್ತಿದ್ದರು. ನಾನು ಅವರ ಮನೆಯಲ್ಲಿ ಬಹಳ ದಿನಗಳಿದ್ದರೂ ಅವರು ಮುಖ ತೋರಿಸುತ್ತಿರಲಿಲ್ಲ. ಅವರು ಮೃತಪಟ್ಟಾಗ, ನಾನು ಕಡಬದಲ್ಲಿಯೇ ಇದ್ದೆ. ಆದಿನ ಅವರ ಮುಖವನ್ನು ನೋಡಿದೆ. ಈ ಮಧ್ಯೆ ಮನೆಗೆ ಯಜಮಾನಿಯಾಗಿ ಎಲ್ಲ ವ್ಯವಹಾರಗಳನ್ನು ಬುದ್ಧಿವಂತಿಕೆಯಿಂದ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದ ಅಲಮೇಲಳ ಅತ್ತೆ ಪುಟ್ಟತಾಯಮ್ಮ ೫:೩8 ೮೩7೦೮: ನಿಂದ ಬೆಂಗಳೂರು ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಮೃತರಾದರು. ಆಗ ನಾನು ಬೆಂಗಳೂರಲ್ಲಿ ಅದೇ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದೆ. ಇದಾದ. ನಂತರ ಅಲಮೇಲು ಅಜ್ಜಿ ಮಹಾಲಕ್ಷ್ಮಮ್ಮನವರು ರಂಗಮ್ಮನವರ ಆಶ್ರಯದಲ್ಲಿದ್ದರು. ಅತ್ತೆ-ಸೊಸೆ ವೈಮನಸ್ಕದಿಂಂದ ಕಡಬದಲ್ಲಿಯೇ ವಾಸವಾಗಿದ್ದ ಮಗಳು ಕಮಲಮ್ಮಳ ಮನೆಯಲ್ಲಿದ್ದು ಮೃತಪಟ್ಟರು. ನನ್ನ ಪತ್ನಿ ಅಲಮೇಲಳ ತಂದೆ. ಮನೆಯವರ ಪರಿಚಯ ಪೂರ್ತಿಯಾಯಿತು. ಇನ್ನು ಮುಂದೆ ನನ್ನ ವಿವಾಹದ ನಂತರದಲ್ಲಿ ನನ್ನ ಮತ್ತು ನನ್ನ ಮನೆಯ ಬಗ್ಗೆ ವಿವರಗಳನ್ನು ತಿಳಿಸುತ್ತೇನೆ.", "ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರಿಗೆ ಇಬ್ಬರು ಹೆಣ್ಣು ಮಕ್ಕಳು. ಅಲಮೇಲ ಮತ್ತು ಪದ್ಮಮ್ಮ ಇವರಿಬ್ಬರೂ ಕಡಬದಲ್ಲಿ ತಾತ ಚೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌, ಅಜ್ಜಿ ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಅತ್ತೆ ಪುಟ್ಟತಾಯಮ್ಮ ತಾಯಿ ರಂಗಮ್ಮನವರೊಂದಿಗೆ ವಾಸವಾಗಿದ್ದರು. ಈ ಮಕ್ಕಳಿಗೆ ತಂದೆಯ ಸಂಪರ್ಕವೇ ಇಲ್ಲ. ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ಇವರುಗಳೂ ಒಮ್ಮೆ (ತಮ್ಮ ತಾತ ಮತ್ತು ಸೋದರಮಾವಂದಿರನ್ನು ನೋಡಲು) ಕರಾಜಿಗೆ ಹೋಗಿ ಬಂದಿದ್ದರು. ಇವರ ಸೋದರತ್ತೆ ಪುಟ್ಟತಾಯಮ್ಮ ವಿಧವೆ. ಇವರಿಗೆ ಸಂತಾನ ಇಲ್ಲ. ಪುಟ್ಟತಾಯಮ್ಮ ಸುಸಂಸ್ಕೃತ ಮಹಿಳೆ. ಬುದ್ಧಿವಂತೆ, ಜಾಣೆ. ತಂದೆ ಚಜೊಕ್ಕಣ್ಣ ಅಯ್ಯಂಗಾರ್‌ ನಿಧನದ ನಂತರ ಸಂಸಾರದ ಜವಾಬ್ದಾರಿ ಹೊತ್ತು ಚೆನ್ನಾಗಿ ನಿರ್ವಹಿಸುತ್ತಿದ್ದರು. ಇವರು ಸಂಗೀತ, ಹಾರ್ಮೋನಿಯಂ, ಕರಕುಶಲ ವಿದ್ಯೆಯಲ್ಲಿ ಪರಿಣಿತರು. ನನ್ನ ಪತ್ನಿ ಅಲಮೇಲಳಿಗೆ ಮೇಲ್ಕಂಡ ಎಲ್ಲಾ ವಿದ್ಯೆಗಳನ್ನು ಹೇಳಿಕೊಟ್ಟಿದ್ದರು. ನನ್ನ ಮದುವೆಯ ಜವಾಬ್ದಾರಿಯನ್ನು ಹೊತ್ತು ಚೆನ್ನಾಗಿ ನಿರ್ವಹಿಸಿದರು."], ["ನನ್ನ ಮದುವೆಯ ಕಾಲದಲ್ಲಿ ನನಗೆ 22 ವರ್ಷ. ಅಲಮೇಲಳಿಗೆ 12 ವರ್ಷ ವಯಸ್ಸು ಇವಳ ತಂಗಿ ಪದ್ಮಳಿಗೆ 8 (ಪದ್ದಕ್ಕ ಪ್ರಕಾರ ಇಬ್ಬರಿಗೂ ಆರು ವರ್ಷ ವ್ಯತ್ಯಾಸವಂತೆ) ವರ್ಷ ವಯಸ್ಸು ನನ್ನ ವಿವಾಹವಾದ ಎರಡನೇ ವರ್ಷಕ್ಕೆ ಅಲಮೇಲ ರಜಸ್ವತಿಯಾದಳು.", "ನನಗೆ ವಿವಾಹವೇನೋ ಆಯಿತು. ಆದರೆ ಸಾಕಷ್ಟು ವಿದ್ಯೆ ಇಲ್ಲ. ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ಮಿಯೂ ಇಲ್ಲ. ಸರಕಾರಿ ಕೆಲಸವೂ ಇಲ್ಲ. ಇದು ನನ್ನ ಮನಸ್ಸಿನಲ್ಲಿಯೇ ಕೊರಗು ಇತ್ತು. ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನವರಿಗೂ ಇದೇ ಕೊರಗು ಇತ್ತು. ಆದರೆ. ಈ ವಿಚಾರವನ್ನು ನಾವು ಬಹಿರಂಗವಾಗಿ ತೋರ್ಪಡಿಸಿಕೊಳ್ಳುತ್ತಿರಲಿಲ್ಲ. ಆಗ ಮನೆಯಲ್ಲಿ ಒಂದು ಆಕಳು (ಹಸು) ಇತ್ತು ಬೆಳಗ್ಗೆ 11 ಗಂಟೆಗೆ ಉಟ ಮಾಡಿ, ಆಕಳನ್ನು ಮೇಯಿಸುವುದಕ್ಕೆ ತೋಟಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ ಸಾಯಂಕಾಲ 6 ಗಂಟೆಗೆ ಮನೆಗೆ ಬಂದು, ನನ್ನ ಬಟ್ಟೆ ಒಗೆದುಕೊಳ್ಳಲು ಮಹಂತಯ್ಯನ ಬಾವಿಗೆ ಹೋಗುತ್ತಿದ್ದೆ. ನನ್ನ ತಂದೆಯೂ ಅವರ ಉಟ್ಟ ಬಟ್ಟೆಯನ್ನು ಅವರೇ ಒಗೆದುಕೊಳ್ಳುತ್ತಿದ್ದರು. ನನ್ನ ತಂದೆಯ ಸಂಪಾದನೆ ಇದ್ದದ್ದರಿಂದ ಊಟಕ್ಕೆ ತೊಂದರೆ ಏನೂ ಇರಲಿಲ್ಲ. ನನ್ನ ತಂದೆಗೆ ಬಿಡುವಿಲ್ಲದಾಗ, ಪೋಸ್ಟ್‌ ಆಫೀಸ್‌ ಕೆಲಸವನ್ನು ನಾನೇ ನಿರ್ವಹಿಸುತ್ತಿದ್ದೆ.", "ಈ ಮಧ್ಯೆ ನನ್ನ ತಂದೆ ಉತ್ತರ ಭಾರತದ ಪ್ರವಾಸಕ್ಕೆ ನೊಣವಿನಕೆರೆಯ 4 ಜನಗಳ ಜೊತೆ ಪ್ರವಾಸ ಹೊರಟರು ಬಾಂಬೆ, ಅಹಮದಾಬಾದ್‌, ಡೆಲ್ಲಿ, ಹರಿದ್ವಾರ, ಖಷಿಕೇಶ, ಲಕ್ಷಣಜೂಲ, ವಾರಣಾಸಿ, ಪ್ರಯಾಗ, ಗಯಾ, ಕಲ್ಕತ್ತಾ, ಅಯೋಧ್ಯೆ, ಪುರಿ, ಮದ್ರಾಸು ಮೂಲಕ್ಕ 1 9) ತಿಂಗಳ ಪ್ರವಾಸ ಮಾಡಿದರು. ಇದು ಅವರ 2ನೇ ಉತ್ತರ ಭಾರತದ ಪ್ರವಾಸ. ಮೊಟ್ಟಮೊದಲು, ಪ್ರವಾಸ ನನ್ನ ಸೋದರತ್ತೆ ಗರುಡಮ್ಮನವರ ಜೊತೆ ಪ್ರವಾಸ ಮಾಡಿದ್ದರು.", "ನನ್ನ ವಿವಾಹದ ನಂತರ, ಆಗಾಗ್ಗೆ ಕಡಬಕ್ಕೆ ಅತ್ತೆಯ ಮನೆಗೆ ಹೋಗಿಬುರತ್ತಿದ್ದ ಪದ್ಧತಿ. ನಾನು ಕಡಬಕ್ಕೆ ಹೋದಾಗ ನನ್ನ ಪತ್ನಿ, ತನ್ನ ಸ್ನೇಹಿತರ ಜೊತೆ ಆಟವಾಡಲು ರಾಮದೇವರ ದೇವಸ್ಥಾನದ ಪ್ರಾಕಾರದೊಳಗಿರುತ್ತಿದ್ದಳು. ಇನ್ನೂ ಚಿಕ್ಕ ವಯಸ್ಸು. ಗಂಡ ಎಂದರೆ ಏನೆಂಬುದೇ ಅವಳಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ. ನಿನ್ನ ಗಂಡ ಬಂದಿದ್ದಾರೆ ಮನೆಗೆ ಬಾ ಎಂದು ಆಟವಾಡುತ್ತಿದ್ದ ಹುಡುಗಿಯನ್ನು ಅವರ ಸೋದರತ್ತೆ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಬರುತ್ತಿದ್ದರು. ಅಲಮೇಲುಗೆ ನನಗೆ ಕಾಫಿ ಕೊಡಲು ಸಹ ಅಂಜಿಕೆ. ಸಾಲದ್ದಕ್ಕೆ ನಾನು ಜುಟ್ಟು ಬಿಟ್ಟಿದ್ದೆ. ಬಾಚಿ ಗಂಟು ಹಾಕಬೇಕಿತ್ತು. ತಲೆಗೆ ನೀರು ಹಾಕಬೇಕಿತ್ತು ಇದೆಲ್ಲವನ್ನೂ ಒಲ್ಲದ"], ["ಮನಸ್ಸಿನಿಂದ ಅಲಮೇಲು ಅಂಜಿಕೆಯಿಂದ ಮಾಡುತ್ತಿದ್ದಳು. ನನ್ನ ವಿವಾಹದ ನಂತರ 2 ವರ್ಷದ ಮೇಲೆ ಅಲಮೇಲು ನಮ್ಮ ಮನೆಗೆ ಬಂದಳು. ನಾವು ವಾಸವಾಗಿದ್ದ ಹಳೆಯ ಮನೆ ಬಿಟ್ಟು ಬಾಡಿಗೆಗೆ ಬೇರೆ ಮನೆ ಮಾಡಿಕೊಂಡೆವು. ನಮ್ಮ ಮನೆಗೆ ಅಲಮೇಲು ಬಂದಾಗ ಮನೆ ಕೆಲಸ ಏನೂ ಬರುತ್ತಿರಲಿಲ್ಲ. ಇನ್ನೂ ಚಿಕ್ಕ ವಯಸ್ಸು. ನನ್ನ ಅಕ್ಕ ಮನೆ ಕೆಲಸದ ತರಬೇತಿ ನೀಡುತ್ತಿದ್ದರು. ಅಲಮೇಲು ನಮ್ಮ ಮನೆಗೆ ಬಂದ ಸ್ವಲ್ಪ ದಿನಗಳಲ್ಲಿಯೇ, ನನ್ನ ಅಕ್ಕನವರಿಗೆ ನ್ಯೂಮೋನಿಯಾ ಖಾಯಿಲೆಯಾಗಿ ಸುಮಾರು ಒಂದು ತಿಂಗಳು ಮಲಗಿಬಿಟ್ಟರು. ಆಗ ಮನೆಯ ಕೆಲಸವೆಲ್ಲಾ ಅಲಮೇಲಳ ಜವಾಬ್ದಾರಿಗೆ ಬಿತ್ತು ಆಗ ಊರಿನ ನಮ್ಮ ಆಪ್ತ ಮಹಿಳೆಯರು ಅಲಮೇಲುಗೆ ಮನೆ ಕೆಲಸದ ತರಬೇತಿ ಕೊಟ್ಟರು. ಅಲಮೇಲು ಮನೆಗೆ ಬಂದ ತರುವಾಯದಲ್ಲಿಯೇ ನನ್ನ ಅಕ್ಕ ಖಾಯಿಲೆ ಬಿದ್ದು ಉಳಿಯುವ ಸ್ಥಿತಿಯಲ್ಲಿಲ್ಲದುದ್ದರಿಂದ ಅಲಮೇಲು ನಮ್ಮ ಮನೆಗೆ ಬಂದದ್ದು ಒಳ್ಳೆಯದಾಗಲಿಲ್ಲವೆಂಂಬ ಊರಿನ ಜನತೆಯ ಆಕ್ಷೇಪಣೆಗೂ ಗುರಿಯಾದಳು.", "ನಿರುದ್ಯೋಗದಿಂದ ಕೊರಗುತ್ತಿದ್ದ ನನಗೆ ಮೈಸೂರು ಗೆಜಿಟ್‌ನಲ್ಲಿ ಬಂದ ಒಂದು ಜಾಹೀರಾತು ನನ್ನ ಪಾಲಿಗೆ ಅಮೃತವಾಯಿತು. ಗೆಜಿಟ್‌ ಜಾಹೀರಾತಿನಲ್ಲಿ ೫817೩ಂ15 ಯ೧1೧6ಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಲು ಕರೆದಿದ್ದರು. ಯಾರಿಗೂ ತಿಳಿಸದಂತೆ ಪೋಸ್ಟ್‌ನಲ್ಲಿ ಅಪ್ಲಿಕೇಷನ್‌ ಹಾಕಿಕೊಂಡೆ. ಆಗ ವೈದ್ಯಕೀಯ ಇಲಾಖೆಯ ಮುಖ್ಯಸ್ಥ ಡಾ. ಎಸ್‌. ಸುಬ್ಬರಾವ್‌, ಸೀನಿಯರ್‌ ಸರ್ಜನ್‌, ಅರ್ಜಿ ಹಾಕಿ ಅವರಿಗೆ ಆತ್ಮೀಯರಿಂದ ಶಿಫಾರಸ್ಸು ಸಹ ಮಾಡಿಸಿದ್ದೆ. ನನಗ ಬೆಂಗಳೂರು ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಫಾರ್ಮಸಿಸ್ಟ್‌ ಟ್ರೈನಿಂಗ್‌ಗೆ ಚುನಾಯಿಸಿ 1934ರಲ್ಲಿ ಆರ್ಡರ್‌ ಸಹ ಬಂತು. ಆಗ್ಲೆ ನನ್ನ ಪತ್ನಿ ಅಲಮೇಲಳ ಸೋದರತ್ತೆ ಕಮಲಮ್ಮ ಮತ್ತು ಅವರ ಪತಿ ರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಮಕ್ಕಳು ಚಾಮರಾಜ ಪೇಟೆಯ ಅಪೆಕ್ಸ್‌ ಬ್ಯಾಂಕ್‌ ಹಿಂಭಾಗದಲ್ಲಿ ವಾಸವಾಗಿದ್ದರು. ನನ್ನ ಹೆಂಡತಿಯ ಹಿರಿಯ ಸೋದರತ್ತೆ ಪುಟ್ಟತಾಯಮ್ಮನವರು ನನ್ನ ಬಗ್ಗೆ ತಂಗಿಗೆ ಹೇಳಿ, ನಾನು ಅವರ ಮನೆಯಲ್ಲಿದ್ದುಕೊಂಡು ವ್ಯಾಸಂಗ ಮಾಡಲು ಏರ್ಪಾಡು ಮಾಡಿದರು ಇದು ನನ್ನ ಜೀವನೋಪಾಯದ ಪ್ರಾರಂಭಿಕ ಘಟ್ಟ ಎಂದು ಹೇಳಬಹುದು.", "ನಂತರ ನಾನು ಬೆಂಗಳೂರಿಗೆ ಬಂದು ಅವರ ಮನೆಯಲ್ಲಿದ್ದುಕೊಂಡು ನನ್ನ ವ್ಯಾಸಂಗವನ್ನು ಪ್ರಾರಂಭಿಸಿದೆನು. ಈ ಕಾಲದಲ್ಲಿ ನನ್ನ ಪತ್ನಿ ಅಲಮೇಲು, ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಜೊತೆಯಲ್ಲಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿದ್ದಳು. ಈ ವ್ಯಾಸಂಗದ ಮಧ್ಯದಲ್ಲಿಯೇ ಅತ್ತೆ ಪುಟ್ಟತಾಯಮ್ಮನವರಿಗೆ 31-685"], ["೮8೩೧ಂ೮೯ ಆಗಿ ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಮೃತಪಟ್ಟರು. ನಂತರ ಕಡಬದಲ್ಲಿ ಉಳಿದವರು ಅಜ್ಜಿ ಮಹಾಲಕ ಮ, ಅತೆ ರಂಗಮ ಮತು ಬಾಲಕಿ ಪದಮ", "ಬೆಂಗಳೂರಿನಲ್ಲಿ ಅತ್ತೆ ಕಮಲಮ್ಮನವರ ಮನೆಯಲ್ಲಿ ನನಗೆ ಎಲ್ಲಾ ಸೌಲಭ್ಯಗಳೂ ಇದ್ದವು. ಆದರೆ ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರಿಗೂ, ಅತ್ತೆ ಕಮಲಮ್ಮನವರಿಗೂ ಯಾವುದೋ ವಿಚಾರದಲ್ಲಿ ಮನಸ್ತಾಪ ಬಂದು, ನನ್ನ ವ್ಯಾಸಂಗದ ಅವಧಿ 1 ತಿಂಗಳಿರುವಾಗ್ಗೆ, ನನಗೆ ಅವರ ಮನೆಯಲ್ಲಿ ಉದಾಸೀನವಾಗಿ 1 ತಿಂಗಳು ಹೋಟೆಲಿನಲ್ಲಿರಬೇಕಾಯಿತು. ನನ್ನ ಜೀವನೋಪಾಯಕ್ಕೆ ಹೆಚ್ಚು ಉಪಕಾರ ಮಾಡಿದ ಕಮಲಮ್ಮ ಮತ್ತು ಅವರ ಯಜಮಾನರು ಮಾಡಿದ ಉಪಕಾರವನ್ನು ನನ್ನ ಜೀವನಪರ್ಯಂತ ಅವರಿಗೆ ಚಿರಖುಣಿಯಾಗಿ ದಿನವೂ ಅವರನ್ನು ಸ್ಮರಿಸುವುದು ನನ್ನ ಆದ್ಯ ಕರ್ತವ್ಯ", "ನಾನು ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಯಲ್ಲಿದ್ದಾಗ ನನಗೆ ತರಬೇತಿ ಕೊಟ್ಟ ಪ್ರಸಿದ್ಧ ವೈದ್ಯರುಗಳಾದ ಡಾ. ರಾಮಲಿಂಗಾ ರೆಡ್ಡಿ, ಡಾ. ಶ್ರೀನಿವಾಸಾಚಾರ್‌, ಡಾ. ನಾರಾಯಣ ಪಸಾದ್‌. ಡಾ. ನಂಜಪ್ಪ- ಇವರ ತರಬೇತಿಯೇ ನನಗೆ ವೈದ್ಯಕೀಯದಲ್ಲಿ ಪರಿಣಿತವಾಗಲು ಸಾಧ್ಯವಾಯಿತು.", "1935ರಲ್ಲಿ ನನ್ನ ತರಬೇತಿ ಪೂರ್ತಿಯಾಗಿ ತೇರ್ಗಡೆಯಾದ ನಂತರ, ಪುನಃ ನೊಣವಿನಕೆರೆಗೆ ಹೋಗಿ ನನ್ನ ತಂದೆ, ಅಕ್ಕ ಹೆಂಡತಿ ಜೊತೆಯಲ್ಲಿದ್ದೆ. ಸರಕಾರಿ ಕೆಲಸಕ್ಕೆ 7/೧ 16೬ ನಲ್ಲಿ ಹೆಸರಿದ್ದು ನನ್ನ ಆಯ್ಕೆಗೆ ಕಾಯುತ್ತಿದ್ದೆ. ನಾನು ಈ ತರಬೇತಿ ಪಡೆಯುವವರೆಗೆ ಓದುವ ಕಾಲದಲ್ಲಿ ತಲೆಯ ತುಂಬಾ ಇದ್ದ ಜುಟ್ಟನ್ನು ಕ್ರಾಪು ಮಾಡಿಸಿಕೊಂಡಿದ್ದೆನು. ಆ ಕಾಲದಲ್ಲಿ ಕ್ರಾಮ ಬಿಡುವುದು ತುಂಬಾ ಮನೆಯಲ್ಲಿ ಮತ್ತು ಸಮಾಜದಲ್ಲಿ ನಿಷಿದ್ಧವಾಗಿತ್ತು.", "ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆ ಮತ್ತು ಮೆಡಿಕಲ್‌ ಸ್ಕೂಲಿನಲ್ಲಿ ಪರಿಣಿತರಿಂದ ತರಬೇತಿ ಮತ್ತು ಪ್ರತ ವಾರ್ಡುಗಳಲ್ಲಿ ಕೆಲಸ ಮಾಡಿದ್ದರಿಂದ, ಥಿಯರಿ ಕಮ್ಮಿಯಾದರೂ, ಪ್ರಾಕ್ಟಿಕಲ್‌ ಆಗಿ ವೈದ್ಯ ಪದ್ಧತಿಯಲ್ಲಿ ತುಂಬಾ ಅನುಭವವಾಗಿತ್ತು."], ["ಈ ತರಬೇತಿ ಪಡೆದ ನಂತರ ನೊಣವಿನಕೆರೆಗೆ ಹೋಗಿ ನೆಲೆಸಿ, ಬರೀ ಔಷಧಿಗಳ ೧೫೮1೮5 ಮಾಡಿ ನನ್ನ ಮೆಡಿಕಲ್‌ ಪ್ರಾಕ್ಟೀಸ್‌ ಪ್ರಾರಂಭ ಮಾಡಿದೆನು. ಆಗಿನ ಕಾಲದಲ್ಲಿ 16೭ ಗಳೇನೂ ಇರಲಿಲ್ಲ. ಇದು ನನ್ನ ಸಂಪಾದನೆಯ ಜೀವನೋಪಾಯಕ್ಕೆ ನಾಂದಿಯಾಯಿತು.", "ಆಗ್ಗೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಕಾಫಿ ಬೀಜ ಸಿಕ್ಕದೆ, ಪ್ರತಿಯೊಬ್ಬರೂ ಕಾಫಿ ಬೀಜವನ್ನೂ ತಿಪ್ಪೂರಿನಿಂದ ತರುತ್ತಿದ್ದರು. ಚಿಕ್ಕಮಗಳೂರು ನನಗೆ, ಅಲ್ಲಿ ಉಪಾಧ್ಯಾಯನಾಗಿದ್ದಾಗ್ಗೆ ಪರಿಚಯ ಇದ್ದದ್ದರಿಂದ ಚಿಕ್ಕಮಗಳೂರಿನಿಂದ ಕಾಫಿ ಬೀಜ ಮತ್ತು ಕಾಫಿಪುಡಿ ರೈಲ್ವೆ ಮೂಲಕ ತರಿಸಿ ಔಷಧಗಳ ಜೊತೆ ವ್ಯಾಪಾರಕ್ಕೆ ಆರಂಭ ಮಾಡಿದೆ. ಇದಕ್ಕೆ ಬಂಡವಾಳಕ್ಕೆ ನನ್ನ ತಂದೆಯವರು ಸ್ವಲ್ಪ ಮೊಬಲಗು ಕೊಟ್ಟರು. ವ್ಯಾಪಾರ ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತಿತ್ತು. ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಶಾಲಾ ಪುಸ್ತಕಗಳೂ, ಸ್ಟೇಷನರಿ ಸಹ ಸಿಗುತ್ತಿರಲಿಲ್ಲ. ನನ್ನ ಮಿತ್ರರ ಸಲಹೆಯಂತೆ ಕಾಫಿ ಬೀಜದ ಜೊತೆಗೆ ಶಾಲೆ ಪುಸ್ತಕಗಳ ಮತ್ತು ಸ್ಪೇಷನರಿ ವ್ಯಾಪಾರ ಪ್ರಾರಂಭವಾಯಿತು. ಈ ಷಾಪಿಗೆ (ಅಂಗಡಿಗೆ) ವಿನತಾ ಮೆಡಿಕಲ್‌ ಮತ್ತು ಪ್ರಾವಿಷನ್‌ ಸ್ಟೋರ್ಸ್‌ ಅಂತಾ ನಾಮಕರಣ ಮಾಡಿದೆ. (ಅಂದರೆ ಆ ವೇಳೆಗೆ, 1936 ಅಮ್ಮಣ್ಯಿ ಹುಟ್ಟಿದ್ದಳುು. ನಂತರ ನನ್ನ ಜೊತೆಗೆ ಅದೇ ಊರಿನ ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಎಂಬುವರು ಪಾರ್ಟನರ್‌ ಆಗಿ ಸೇರಿದರು. ಈಗ ಇವರು ಬೆಂಗಳೂರು ಜಯನಗರದಲ್ಲಿ ಮಗನೊಂದಿಗೆ ವಾಸಿಸುತ್ತಿದ್ದಾರೆ. ನಂತರ ನಮ್ಮ ವ್ಯಾಪಾರವನ್ನು ಆರಂಭಿಸಿ ಬೆಂಗಳೂರಿನಿಂದ ಪದಾರ್ಥಗಳನ್ನು ತರಿಸಿ ಮಾರಾಟ ಮಾಡುತ್ತಿದ್ದೆವು. ನೊಣವಿನಕೆರೆಗೆ ಅಲ್ಲದೆ, ಸುತ್ತ ಇರುವ ಗ್ರಾಮಗಳಿಗೆ ನಮ್ಮ ವ್ಯಾಪಾರ ಸಂಸ್ಥೆ ಹೆಸರುಗಳಿಸಿ ವ್ಯಾಪಾರ ಅಭಿವೃದ್ಧಿಯಾಯಿತು.", "ಗಡಿಯಾರ, ಸೈಕಲ್‌, ಗ್ರಾಮಾಘೋನ್‌ಗಳ ಮಾರಾಟ ಸಹ ನಡೆಯುತ್ತಿತ್ತು. ನೊಣವಿನಕೆರೆಗೆ ಗ್ರಾಮಾಫೋನ್‌ ಮೊಟ್ಟ ಮೊದಲು ತಂದಿದ್ದು ನಾನು. ಈ ಗ್ರಾಮಾಘೋನ್‌ ಹಾಕುವುದನ್ನೂ ಕೇಳಲು, ನೋಡಲು ಹಳ್ಳಿಗಳಿಂದ ಜನಗಳು ಬರುತ್ತಿದ್ದರು. ದೇವಸ್ಥಾನದಲ್ಲಿ ಮಂಗಳಾರತಿ ಆದರೆ ನಮ್ಮ ಗ್ರಾಮಾಫೋನ್‌ ತರಿಸಿ (ರೆಕಾರ್ಡ್‌) ಹಾಕಿಸಲು ಒತ್ತಾಯಿಸುತ್ತಿದ್ದರು. ಆಗ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಎಲೆಕ್ಟ್ರಿಕ್‌ ದೀಪ ಬಂದಿರಲಿಲ್ಲ. ರಾತ್ರಿ ಷಾಪ್‌ ಮುಚ್ಚಿ ಊಟದ ನಂತರ, ಬೀದಿಯಲ್ಲಿ ಮನೆ ಮುಂಭಾಗದಲ್ಲಿ ಪೆಟ್ಟೋಮ್ಯಾಕ್ಸ್‌ (ಒಂದು ರೀತಿಯ ೩೮೫೩೧ಂಂ೮ 18/೩070) ಲೈಟ್‌ ಇಟ್ಟುಕೊಂಡು ಬೀದಿಯಲ್ಲಿ ಚಾಪೆ ಹಾಸಿ, ಗ್ರಾಮಾಫೋನ್‌ ಹಾಕುತ್ತಿದ್ದರೆ, ನಾಟಕನೋಡಲು ಬರುವಂತೆ ಊರಿನವರೆಲ್ಲಾ ರಾತ್ರಿ 12 ಗಂಟೆಯವರೆಗೆ ಕೂತು ಕೇಳುತ್ತಿದ್ದರು. ನಮಗೆ ಇದೇ ಒಂದು ಹೆಮ್ಮೆ"], ["ನನ್ನ ಪತಿ ಮದುವೆಯಾದ ಎರಡು ವರ್ಷದ ನಂತರ (1934) ನಮ್ಮ ಮನೆಗೆ ಬಂದಳು. ನಂತರ ಎರಡು ವರ್ಷ ಮಕ್ಕಳಾಗಲಿಲ್ಲ. ನನ್ನ ಅಕ್ಕ, ನನ್ನ ಪತ್ನಿಯ ತಾಯಿ ಮತ್ತು ನನ್ನ ಆಪ್ತರು ನನಗೆ ಮಕ್ಕಳಾಗಲಿಲ್ಲ ಎಂದು ಕೊರಗುತ್ತಾ, ದೇವರುಗಳಿಗೆ ಹರಕೆ ಹಾಕುತ್ತಿದ್ದರು. ಏನೂ ಮನೆ ಕೆಲಸ ಮಾಡದಿದ್ದ ನನ್ನ ಪಶ್ಚಿ ಅಲಮೇಲು ಈ ವೇಳೆಗೆ ಎಲ್ಲಾ ಮನೆ ಕೆಲಸ, ಅಡಿಗೆ ಕಲಿತುಕೊಂಡಿದ್ದಳು ಮತ್ತು ಅಚ್ಚುಕಟ್ಟಾಗಿ ಮಾಡುವುದನ್ನೂ ಕಲಿತಿದ್ದಳು. ಹಾರ್ಮೋನಿಯಂ ನುಡಿಸುತ್ತಾ ದೇವರ ನಾಮ ಹಾಡುತ್ತಿದ್ದಳು. ಇದು ಅವರ ಸೋದರತ್ತೆಯಿಂದ ದೊರಕಿದ ಶಿಕ್ಷಣ. ಮಣಿ ಹಾಕುವುದು, ಚಿತ್ರಕಲೆ, ಕಸೂತಿ ಮುಂತಾದ ಕರಕುಶಲಗಳಲ್ಲಿ ಜಾಣೆಯಾಗಿ, ಊರಿನ ಇತರೆ ಹೆಣ್ಣು ಮಕ್ಕಳೂ ಕಲಿತುಕೊಳ್ಳಲಿ ಇವಳಲ್ಲಿಗೆ ಬರುತ್ತಿದ್ದರು.", "ಅಲಮೇಲು ನಮ್ಮ ಮನೆಗೆ ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಮನೆಯಲ್ಲಿ ನಾನು, ನನ್ನ ವಿಧವೆ ಅಕ್ಕ ಮತ್ತು ನನ್ನ ತಂದೆ. 3 ಜನ ಮಾತ್ರ. ಇದ್ದು ಪೂಜೆ, ಪುನಸ್ಕಾರಗಳನ್ನು ಸಂಕ್ಷೀಪ್ತವಾಗಿ ನಡೆಸುತ್ತಿದ್ದೆವು. ಅಲಮೇಲು ಮನೆಗೆ ಬಂದ ನಂತರ, ಎಲ್ಲಾ ಪೂಜೆ ಪುನಸ್ಕಾರಗಳು ವಿವರವಾಗಿ ನಡೆಸಲು ಪ್ರಾರಂಭಿಸಿದಳು. ಅಲಮೇಲು ನಮ್ಮ ಮನೆಗೆ ಬಂದ ತರುವಾಯದಲ್ಲಿ, ನನ್ನ ಅಕ್ಕ ಮರಣೋನ್ಮುಖ ಖಾಯಿಲೆಯಿಂದ ಮಲಗಿದ್ದಾಗ್ಗೆ, ಈ ಹೆಣ್ಣು ನಮ್ಮ ಮನೆಗೆ ಬಂದದ್ದು ಒಳ್ಳೆಯದಾಗಲಿಲ್ಲ ಎಂದು ಬಂದಿದ್ದ ಕಳಂಕ ಮಾಯವಾಗಿ, ನನಗೆ ಸರ್ಕಾರಿ ಕೆಲಸ ಸಿಕ್ಕದಿದ್ದರೂ ವ್ಯಾಪಾರದಲ್ಲಿ ಅಭಿವೃದ್ಧಿ ಹೊಂದುತ್ತಿದ್ದು, ನನ್ನ ಸಂಸಾರದಲ್ಲಿ ಸುಖ ಸಂತೋಷಗಳೇ ಇತ್ತು.", "ನನ್ನ ಈ ವ್ಯಾಪರದ ಬಂಡವಾಳಕ್ಕೆ ನನ್ನ ತಂದೆಯವರೂ, ನಂತರ ಪಾರ್ಟನರ್‌ ಆಗಿ ಬಂದ ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಸಹ ಕೊಟ್ಟಿದ್ದರು. ಊರಿನ ಮತ್ತು ಸುತ್ತ ಗ್ರಾಮಗಳಲ್ಲಿ ನಮ್ಮ ವ್ಯಾಪಾರದ ಸಂಸ್ಥೆ ತುಂಬಾ ಹೆಸರು ಗಳಿಸಿ, ಎಲ್ಲಾ ಪದಾರ್ಥಗಳೂ, ಸೂಜಿಯಿಂದ ಗಡಿಯಾರ, ಗ್ರಾಮಾಫೋನ್‌, ಸೈಕಲ್‌ ಮತ್ತು ಸ್ಟೇಷನರಿ ಪದಾರ್ಥಗಳು ಜನಗಳಿಗೆ ಸೂಕ್ತ ಕ್ರಯಕ್ಕೆ ದೊರೆಯುತ್ತಿತ್ತು.", "ನನ್ನ ಪತ್ನಿ ಅಲಮೇಲ ನಮ್ಮ ಮನೆಗೆ ಬಂದ 2 ವರ್ಷದ ನಂತರ, ಬಹುಶಃ 1936ರಲ್ಲಿ ನನಗೆ ಪ್ರಥಮ ಪುತ್ರಿ ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿ ಜನಿಸಿದಳು ಆಗ್ಗೆ ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮನವರು, ಅಲಮೇಲಳ ಅಜ್ಜಿ ಮಹಾಲಕ್ಷ್ಮಮ್ಮ ಜೀವಂತವಾಗಿದ್ದರು. ನನಗೆ ಸಂತಾನ ಪ್ರಾಪ್ತವಾಗಿದ್ದು, ನಮ್ಮ ತಂದೆ ಮನೆಯವರಿಗೇ ಅಲ್ಲದೆ ನಮ್ಮ ಆಪ್ತರೆಲ್ಲರಿಗೂ ತುಂಬಾ ಆನಂದವೇ ಆಗಿತ್ತು."], ["ನಮ್ಮ ಮಕ್ಕಳು ಹುಟ್ಟದ ದಿನಾಂಕವನ್ನು ಆಯಾ ವರ್ಷದ ಡೈರಿಗಳಲ್ಲಿ ಗುರ್ತು ಹಾಕಿದ್ದೆ. ನನ್ನ ಮಕ್ಕಳು ಹುಟ್ಟಿದ ದಿನಾಂಕವನ್ನು ಕಡಬದಲ್ಲಿದ್ದ ಅಹೋಬಲ ಶಾಸ್ತ್ರಿಗಳು, ನಮ್ಮ ಮನೆಯ ಎದುರಿಗಿದ್ದವರು, ಗುರುತು ಹಾಕಿರುತ್ತಾರೆಂದು ಅತ್ತೆಯವರು ಹೇಳುತ್ತಿದ್ದರು. ಮನೆ ಮತ್ತು ಊರುಗಳು ಬದಲಾಯಿಸುವಾಗ ಹಳೇ ಡೈರಿಗಳನ್ನೆಲ್ಲಾ ನಾಶಪಡಿಸಿದ್ಧಾಯಿತು. ನನ್ನ ಅತ್ತೆಯವರು ಹೇಳುತ್ತಿದ್ದಂತೆ, ಕಡಬದಲ್ಲಿ ಶಾಸ್ತ್ರಿಗಳು ಗುರುತು ಹಾಕಿರುತ್ತಾರೆ ಎಂಬ ನಂಬಿಕೆಯಿಂದ, ಕಡೆಗೆ ನನ್ನ ಮಕ್ಕಳ ಹುಟ್ಟದ ಸರಿಯಾದ ದಿನಾಂಕ ಅವರಲ್ಲಿಯೂ ಸಿಕ್ಕಲಿಲ್ಲ. ಹೀಗಾಗಿ ಅವರ ಜನ್ಮ ದಿನಾಂಕ ಗೊತ್ತಾಗಲಿಲ್ಲ.", "ಅಪರೂಪವಾಗಿ ಜನಿಸಿದ ನನ್ನ ಜೇಷ್ಠ ಪುತ್ರಿ ತುಂಬಾ ರೂಪು, ಚೂಟಿಯಾಗಿದ್ದು, ಎಲ್ಲರಿಂದಲೂ ಮುದ್ದಿಸಲ್ಪಡುತ್ತಿದ್ದಳೂ. ಇವಳ ಜನನದಿಂದ, ನನ್ನ ಅಕ್ಕ, ತಂದೆ ಮತ್ತು ಅಲಮೇಲಳ ಮನೆಯವರಿಗೆ ಆದ ಆನಂದಕ್ಕೆ ಪಾರವೇ ಇರಲಿಲ್ಲ.", "ಇದಾದ ಎರಡು ವರ್ಷಗಳ ನಂತರ, ನನಗೆ ಎರಡನೇ ಮಗುವಾಗಿ ಜಿ. ನಾಗರಾಜನ ಜನನವಾಯಿತು. ನನ್ನ ಪ್ರಥಮ ಪುತ್ರಿ ವಿನತಾ ನನ್ನ ವಿವಾಹವಾದ ನಂತರ ಸ್ವಲ್ಪ ಹೆಚ್ಚು ಕಾಲಾವಕಾಶವಾಗಿ ಹುಟ್ಟ ಅನೇಕ ವರ್ಷಗಳಿಂದ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಚಿಕ್ಕ ಮಕ್ಕಳು ಇರಲಿಲ್ಲವಾಗಿ ಎಲ್ಲರಿಗೂ ಮುದ್ದಾಗಿದ್ದ ಈ ಮಗುವನ್ನು \"“ಅಮ್ಮಣ್ಣಿ' ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ನನ್ನ ತಂದೆ, ಅಕ್ಕ ಮತ್ತು ನನ್ನ ಸೋದರತ್ತೆ ಎಗ್ಗಮ್ಮ ಮತ್ತು ಅಲಮೇಲಳ ತಾಯಿ ಮತ್ತು ಅಜ್ಜಿಗೆ ಇವಳು ಹುಟ್ಟಿನಿಂದ ಆದ ಆನಂದಕ್ಕೆ ಪಾರವೇ ಇರಲಿಲ್ಲ. ಇವಳು ಹುಟ್ಟಿದ್ದು ಕಡಬದಲ್ಲಿ. ಇವಳು ಹುಟ್ಟಿದ ನಂತರ ಅಲಮೇಲಳ ತಂಗಿ ಪದ್ದುಗೆ ಮೈಸೂರು ಗುಂಡ್ಲಪಂಂಡಿತರ ಮಗಳ ಮಗ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ರೊಡನೆ ವಿವಾಹ ಸಂಪಿಗೆ ಶ್ರೀನಿವಾಸ ದೇವಸ್ಥಾನದಲ್ಲಿ ನಡೆಯಿತು. ಆಗಲೂ ಇವರ ತಂದೆ ವಿವಾಹಕ್ಕೆ ಬರಲಿಲ್ಲ. ಅಲಮೇಲು ಚಿಕ್ಕಪ್ಪ ಸುಂದರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಮತ್ತು ಚಿಕ್ಕಮ್ಮ ರಂಗನಾಯಕಮ್ಮ ಧಾರೆ ಎರೆದರು.", "ನಂತರ ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರೊಬ್ಬರೇ ಕಡಬದ ಮನೆಯ್ಗಲಿ ವಾಸ. ಈ ಮಧ್ಯೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನಾನು ಪ್ರಾರಂಭಿಸಿದ ಸ್ಪೋರ್ಸ್‌ನಲ್ಲಿ ವ್ಯಾಪಾರ ಬಹಳ ಜನಪ್ರಿಯವಾಗಿ ನಡೆಯುತ್ತಾ ಸಾಕಷ್ಟು ಲಾಭಗಳಿಸುತ್ತಿತ್ತು ನೊಣವಿನಕೊರೆಯಲ್ಲಿ ನಮ್ಮ ಹಳೇ ಮನೆ ಕೆಡವಿಸಿ ಹೊಸದಾಗಿ ಕಟ್ಟಲು ಇಟ್ಟಿಗೆ, ಮರದ ಸಾಮಾನುಗಳನ್ನು ಶೇಖರಿಸಿ, ಮನೆಯನ್ನು ಕೆಡವಿ, ಅಸ್ಥಿಭಾರವನ್ನೂ ಹಾಕಲಾಯಿತು."], ["ನಾನು ಹೀಗೆ ಮುಂದುವರೆಯುತ್ತಿರುವುದನ್ನು ಸಹಿಸಲಾರದೆ, ಯಾವ ನೊಣವಿನಕೆರೆಯಲ್ಲಿನ ಹೆಣ್ಣನ್ನು ವಿವಾಹವಾಗಲು ತಿರಸ್ಕರಿಸಿದ್ದೆನೋ, ಅವರು ನಾನು ಮನೆ ಕಟ್ಟಲು ಕೋರ್ಟಿನಿಂದ ತಡೆ ಆರ್ಡರ್‌ ತಂದು ಮನೆ ಕಟ್ಟುವ ಕೆಲಸಕ್ಕೆ ಅಡ್ಡಿ ಪಡಿಸಿದರು. ಇದರಿಂದ ಮನೆ ಕಟ್ಟುವ ಕೆಲಸವನ್ನು ನಿಲ್ಲಿಸಲಾಯಿತು. ಮುಂದೆ ಮನೆ ಕಟ್ಟಲು ಸಿದ್ಧವಾಗಿದ್ದ ಇಟ್ಟಿಗೆ, ಮರದ ಸಾಮಾನುಗಳು ಬೇರೆಯವರ ಪಾಲಾಯಿತು. ಇಲ್ಲಿಂದ ಮುಂದೆ ನಾನು ಸರ್ಕಾರಿ ಕೆಲಸಕ್ಕೆ ಹೋಗಿದ್ದರಿಂದ ಮತ್ತು ತುಂಕೂರಿನಲ್ಲಿ ಮನೆ ಕ್ರಯಕ್ಕೆ ಪಡೆದ ಕಾರಣ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಮನೆ ಕಟ್ಟಲಿಲ್ಲ. ಈ ಮನೆ ನಿವೇಶನವನ್ನು ಬೇರೆಯವರಿಗೆ ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟುಬಿಟ್ಟೆವು.", "ಈ ಮಧ್ಯೆ ಬೆಂಗಳೂರು ವೈದ್ಯಕೀಯ ಮುಖ್ಯ ಕಚೇರಿಯಲ್ಲಿ ನನ್ನ ಹೆಸರು ೫1780161 ಹುದ್ದೆಗಾಗಿ ೫ಂ/8 1161 ನಲ್ಲಿದ್ದು ಅನಿರೀಕ್ಷಿತವಾಗಿ ನನಗೆ ವೈದ್ಯಕೀಯ ಇಲಾಖೆಯಲ್ಲಿ 7೩೧7೩ಂ16! ಕೆಲಸಕ್ಕೆ ನಂಜನಗೂಡು ತಾಲ್ಲೂಕು ಸುತ್ತೂರು ಆಸ್ಪತ್ರೆಗೆ ನೇಮಕವಾದ ಆರ್ಡರ್‌ ತಲಪಿತು. ಒಂದು ವಾರದ ಒಳಗಾಗಿ ಕೆಲಸದ ಮೇಲೆ ಹಾಜರಾಗಬೇಕೆಂದಿತ್ತು.. ನಮ್ಮ ವ್ಯಾಪಾರದ ಸ್ಟೋರ್ಸ್‌ ಜನಾನುರಾಗಿಯಾಗಿ ಸಾಕಷ್ಟು ಲಾಭ ಗಳಿಸುತ್ತಿತ್ತು. ಸರಕಾರಿ ಕೆಲಸಕ್ಕೆ ಹೋಗಲೇ ಬೇಡವೇ ಎಂಬ ಜಿಜ್ಞಾಸೆಗೆ ಕಾರಣವಾಯಿತು. ಸರಕಾರಿ ಕೆಲಸ ಸಿಕ್ಕಿರುವುದೇ ಅದೃಷ್ಟ. ಕೆಲಸಕ್ಕೆ ಹೋಗಿ ಸ್ವಲ್ಪ ದಿನ ಕಾದು, ನಂತರ ಕೆಲಸ ಬೇಡವಾದಲ್ಲಿ ರಾಜೀನಾಮೆ ನೀಡಬಹುದು. ಸಿಕ್ಕಿರುವ ಸರ್ಕಾರಿ ಕೆಲಸವನ್ನು ಸದ್ಯಕ್ಕೆ ಬಿಡುವುದು ಬೇಡ, ಸ್ಪೋರ್ಸ್‌ನ್ನು ಪಾರ್ಟನರ್‌ ನೋಡಿಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು ಮನೆಯವರು ಮತ್ತು ಆಪ್ತರು ಹೇಳಿದ್ದರಿಂದ ಸರ್ಕಾರಿ ಕೆಲಸಕ್ಕೆ ಹೋಗಲು ನಿರ್ಧರಿಸಿ ಮೈಸೂರಿಗೆ ಹೊರಟೆ.", "ಸುತ್ತೂರು ಗ್ರಾಮ ನಂಂಜನಗೂಡು- ಟಿ. ನರಸೀಪುರ ರಸ್ತೆಯಲ್ಲಿ, ನಂಜನಗೂಡಿನಿಂದ 15 ಮೈಲಿ, ಟಿ. ನರಸೀಪುರದಿಂದ 8 ಮೈಲಿ ಫಾಸಲೆಯಲ್ಲಿತ್ತು ಸುತ್ತೂರಿಗೆ ಬಸ್ಸು ಇರಲಿಲ್ಲ. ಕುಪ್ಪರವಳ್ಳಿ ಎಂಬ ಊರಿನಲ್ಲಿಳಿದು 2 ಮೈಲಿ ನಡೆದು ಅಥವಾ ಎತ್ತಿನ ಬಂಡಿಯಲ್ಲಿ ಹೋಗಬೇಕು.", "ಸ್ವಲ್ಪ ಸಾಮಾನುಗಳೊಡನೆ ನಾನು ಮತ್ತು ಅಲಮೇಲು ತಾಯಿಯೊಡನೆ ಬಸ್ಸಿನಲ್ಲಿ ಪ್ರಯಾಣ ಮಾಡಿ, ಕುಪ್ಪರವಳ್ಳಿ ಗ್ರಾಮದಲ್ಲಿಳಿದು, ನನ್ನ ಅತ್ತೆ ಮತ್ತು ಸಾಮಾನುಗಳನ್ನು ಇಟ್ಟು, ಬಂಡಿ ತರಲು ನಾನು ಸುತ್ತೂರಿಗೆ ಹೋದೆನು. ಸುತ್ತೂರು ಊರ ಮುಂಭಾಗದಲ್ಲಿಯೇ ನಮ್ಮ ಆಸ್ಪತ್ರೆ. ಅಲ್ಲಿ ಡಾಕ್ಟರ್‌ರನ್ನು"], ["ನೋಡಿ ವಿಚಾರ ತಿಳಿಸಿದ ನಂತರ ಸುತ್ತೂರು ಮಠದ ಸ್ವಾಮಿಗಳನ್ನು ಭೇಟಿ ಮಾಡಿ, ಎತ್ತಿನ ಬಂಡಿಯನ್ನು ಪಡೆದು ಕುಪ್ಪರವಳ್ಳಿಗೆ ಹೋಗಿ, ನನ್ನ ಅತ್ತೆಯನ್ನು, ಸಾಮಾನುಗಳನ್ನು ಸುತ್ತೂರಿಗೆ ತಂದದ್ದಾಯಿತು.", "ಸುತ್ತೂರು ಗ್ರಾಮದ ಪ್ರದೇಶದಲ್ಲೇ ನಮ್ಮ ಆಸ್ಪತ್ರೆಯ ಕಟ್ಟಡ. ಸ್ವಾಮಿಗಳಿಂದ ಧರ್ಮಾರ್ಥವಾಗಿ ಕಟ್ಟಲ್ಪಟ್ಟಿತ್ತು ಕಟ್ಟಡ ಹುಳಿಯೂರು ಮಿಡ್ಲ್‌ ಸ್ಕೂಲ್‌ ತರಹ, ದೊಡ್ಡದಾಗಿ ವಿಶಾಲವಾಗಿತ್ತು. ಕಟ್ಟಡದ ಕಾಂಪೌಂಡ್‌ ಒಳಗಡೆಯಲ್ಲಿ ಡಾಕ್ಟರಿಗೆ, ಫಾರ್ಮಾಸಿಸ್ಟ್‌ ಮತ್ತು ಮಿಡೆಲೈಫ್‌ಗೆ ಕ್ವಾರ್ಟರ್ಸ್‌ ಇತ್ತು. ಸುತ್ತೂರು ಸ್ವಾಮಿಗಳು ಸರ್ಕಾರದಲ್ಲಿ ಬಹಳ ಪ್ರಭಾವ ಉಳ್ಳವರಾಗಿದ್ದರು. ಮತ್ತು ಆಸ್ಪತ್ರೆ ಕಟ್ಟಡ ದಾನ ರೂಪವಾಗಿ ನಿರ್ಮಿಸಿ ಕೊಟ್ಟಿದ್ದರಿಂದ ಆ ಊರಿಗೆ ಆಸ್ಪತ್ರೆ ಮಂಜೂರಿಯಾಗಿತ್ತು ನಾವೇ ಆಸ್ಪತ್ರೆಗೆ ಪ್ರಥಮ ಅಧಿಕಾರಿಗಳಾಗಿ ಹೋಗಿದ್ದು. ಊರಿನಲ್ಲಿ ಸಾಕಷ್ಟು ಜನಸಂಖ್ಯೆ ಇದ್ದರೂ ಆಸ್ಪತ್ರೆಗೆ ಬರುತ್ತಿದ್ದ ರೋಗಿಗಳ ಸಂಖ್ಯೆ ದಿನಕ್ಕೆ 20. ನಮ್ಮಗಳಿಗೆ ಕೆಲಸವೇ ಇರಲಿಲ್ಲ. ಸುತ್ತೂರು ಆ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಪ್ರಸಿದ್ಧವಾದ ವೀರಶೈವ ಮಠ. ಆಗ್ಲೆ ಶ್ರೀ ಶಿವರಾತ್ರಿ ಸ್ವಾಮಿಗಳು ಪೀಠಾಧಿಪತಿಯಾಗಿದ್ದರು. ನನಗಂತೂ ಬಹಳ ಆತ್ಮೀಯರಾಗಿದ್ದು. ಏನು ಸಹಾಯ ಬೇಕಿದ್ದರೂ ಮಠದಿಂದ ಮಾಡುತ್ತಿದ್ದರು.", "ನಮ್ಮ ಆಸ್ಪತ್ರೆಯ ಹಿಂದೆಯೇ ಕಪಿಲಾ ನದಿ. ಕಪಿಲಾ ನದಿಯಲ್ಲಿ ದೋಣಿ ನಡೆಸುತ್ತಿದ್ದವನು, ನಮ್ಮ ಆಸ್ಪತ್ರೆಯ ಜವಾನ, ಅದೇ ಊರಿನ ಪುಟ್ಟಮಾದಯ್ಯ.", "ನಂತರ, ಸ್ವಲ್ಪ ದಿನಗಳ ನಂತರ ಅಲಮೇಲ ಮತ್ತು ಆ ನನಗೆ ಇದ್ದ ಎರಡು ಮಕ್ಕಳು, ವಿನತ ಮತ್ತು ನಾಗರಾಜರನ್ನು ಕರೆದುಕೊಂಡು ಸುತ
