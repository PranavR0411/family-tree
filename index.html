ಲರೊಡನೆ ಬಿಂಡಿಂಗನವಿಲೆಗೆ ಹೋಗಿ ದೇವರ ಸಾನಿಧ್ಯದಲ್ಲಿ ಶಾಸ್ತೋಕ್ತವಾಗಿ ಹುಟ್ಟು ಕೂದಲು ತೆಗೆಸಿದ್ದಾಯಿತು. ಆಗ ಬಿಂಡಿಂಗನವಿಲೆಗೆ ಬಸ್‌ ಸೌಕರ್ಯ ಇರಲಿಲ್ಲ. ನಾಗಮಂಂಗಲಕ್ಕೆ ಬಸ್ಸಿನಲ್ಲಿ ಹೋಗಿ, ನಂತರ ಎತ್ತಿನ ಬಂಡಿಯಲ್ಲಿ ಬಿಂಡಿಗನವಿಲೆಗೆ ಹೋಗಿ ಬಂದಿದ್ದೆನು."], ["ಹೊಸ ಅಗ್ರಹಾರದಿಂದ ಹುಳಿಯಾರಿಗೆ. ವರ್ಗವಾಗಿ ಹೋದ ನಂತರ, ಈ ಹಿಂದೆ ಹುಳಿಯಾರಿನಲ್ಲಿ ನಾನು ಉಪಾಧ್ಯಾಯನಾಗಿದ್ದ ಕಾಲದಲ್ಲಿ ಅಲ್ಲಿನ ಬಹುಜನರು, ನನ್ನ ಆಪ್ತರು ಇದ್ದದ್ದರಿಂದ ಅಲ್ಲಿ ನನಗೆ ಹೆಚ್ಚು ಅನುಕೂಲವಾಗಿತ್ತು. ನಾನು ಹುಳಿಯಾರಿಗೆ ಹೋದಾಗ್ಗೆ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಶಂಖ ಗ್ರಾಮದ ಅನಂತರಾಮ ಅಯ್ಯಂಗಾರ್‌ ಎಂಬುವವರು ಡಾಕೃರಾಗಿದ್ದರು. ಇವರ ಪತ್ನಿ ಕಮಲಮ್ಮ ನೊಣವಿನಕೆರೆ ಹೆಣ್ಣು ಮಗಳು. ಈ ಡಾಕ್ಟರು ವೃತ್ತಿಯಲ್ಲಿ ಅಷ್ಟೇನೂ ಪರಿಣಿತರಾಗಿರಲಿಲ್ಲ. ಮುಂಚೆಯೇ, ಹುಳಿಯಾರಿನ ಜನ ನನಗೆ ಪರಿಚಿತರಾಗಿದ್ದುದ್ದರಿಂದ. ಅಲ್ಲಿಯ ಜನತೆ ಚಿಕಿತ್ತೆಗಾಗಿ ನನ್ನ ಮನೆಗೆ ಬರುತ್ತಿದ್ದರು. ಆಗ ನಾನು ಡ್ಯೂಟಿಗೆ ಹೋಗುವಾಗ್ಗೆ ಸೂಟ್‌, ಟೈ, ಬೂಟ್ಸ್‌ ಧರಿಸಿಕೊಂಡು ಹೋಗುತ್ತಿದ್ದೆ. ನನ್ನ ಡ್ರೆಸ್‌ ನೋಡಿ ಜನಗಳು ಮತ್ತು ಅಧಿಕಾರಿಗಳೂ ನಾನೇ ಡಾಕ್ಟರೆಂದು ತಿಳಿದು ಅಭಿನಂದಿಸಿದ್ದೂ ಉಂಟು. ಇದನ್ನು ಡಾಕ್ಟರು ಸಹಿಸದೆ, ಮೇಲಧಿಕಾರಿಗಳಿಗೆ ನನ್ನ ಮೇಲೆ ದೂರು ಸಲ್ಲಿಸಿರು. ಈ ದೂರಿನ ಮೇಲೆ ನನ್ನನ್ನು ಹುಳಿಯಾರಿನಿಂದ (ಅಲ್ಲಿಂದ 15 ಮೈಲಿ ದೂರದ) ಬುಕ್ಕಾಪಟ್ಟಣ ಆಸ್ಪತ್ರೆಗೆ ವರ್ಗ ಮಾಡಿದರು. ನನ್ನನ್ನು ಬೀಳ್ಕೊಡಲು ಹುಳಿಯಾರಿನ ಜನತೆ ಸತ್ಕಾರ ಕೂಟವನ್ನು ವಿಜೃಂಭಣೆಯಿಂದ ನಡೆಸಿದರು. ನನ್ನ ಈ ವರ್ಗವನ್ನು ರದ್ದು ಪಡಿಸಲು ಕೋರಿ ಮೇಲಧಿಕಾರಿಗಳ ಬಳಿ ನಿಯೋಗ ಸಹ ಹೋಗಿದ್ದರು. ಆದರೆ ಅದು ಫಲಿಸಲಿಲ್ಲ. ಬುಕ್ಕಾಪಟ್ಟಣ ಆಸ್ಪತ್ರೆಗೆ ಡ್ಯೂಟಿಗೆ ಹೋದ ನಂತರವೂ ಅಲ್ಲಯೂ ಇದೇ ಪರಿಸ್ಥಿತಿಯಾಗಿ, ಕೆಲವು ತಿಂಗಳಲ್ಲಿಯೇ ನನ್ನನ್ನು ಸಿರಾ ಆಸ್ಪತ್ರೆಗೆ ವರ್ಗ ಮಾಡಿದರು.", "ಸರ್ಕಾರಿ ಕೆಲಸಕ್ಕೆ ರಾಜೀನಾಮೆ: ಪ್ರೈವೆಟ್‌ ಪ್ರ್ಯಾಕ್ಟೀಸ್‌ ಆರಂಭ", "ಈವರೆಗೆ ನಾನು ಹೋಮಿಯೋಪತಿಕ್‌ ಡಿಪ್ಲೊಮಗೆ ಪ್ರೈವೇಟ್‌ ಆಗಿ ವ್ಯಾಸಂಗ ಮಾಡಿ ಸದರಿ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣವಾಗಿ ಡಿಪ್ಲೋಮಾ ಸಹ ಸಿಕ್ಕಿತು. ಈ ಡಿಪ್ಲೋಮ ಇಂದ ನಾನು ಪ್ರೈವೆಟ್‌ ಪ್ರಾಕ್ಟೀಸ್‌ ಮಾಡಲು ಅವಕಾಶ ಸಿಕ್ಕಿತು. ಹೊಮಿಯೋಪತಿ ಸಿಸ್ಟಮ್‌ ಆಫ್‌ ಮೆಡಿಸನ್‌, ಆಗ ಮೈಸೂರು ಸರಕಾರದಲ್ಲಿ 16೦ಂ8೧1೮ ಆಗಿರಲಿಲ್ಲ. ಆದರೂ ಡಾಕ್ಟರ್‌ ಎಂದು ಹಾಕಿಕೊಂಡು 8೩ಂ೮ಂ೮ ಮಾಡಬಹುದಿತ್ತು ಈ ವೇಳೆಗೆ ನನಗೆ ಬರುತ್ತಿದ್ದ ಸಂಬಳ ತಿಂಗಳಿಗೆ 35/-ರೂ. ಈ (ವರ್ಗಗಳ) ಉಪದ್ರವದಿಂದ ರೋಸಿ ಹೋಗಿತ್ತು. ಸರ್ಕಾರಿ ಕೆಲಸಕ್ಕೆ ರಾಜಿನಾಮೆ ಕೊಟ್ಟು ಹುಳಿಯಾರಿನಲ್ಲಿ ೫೪೫೮ 7೩ಂ೪ಂ೮ ಮಾಡಬೇಕೆಂದು ನಿರ್ಧರಿಸಿದ್ದನ್ನು ನನ್ನ ತಂದೆಯ ಬಳಿ ಪಸ್ತಾಪಿಸಿದ್ದಾಗೆ. ಅವರು ವಿಶ್ರಾಂತಿ ವೇತನದ ಸೌಲಭ್ಯವುಳ್ಳ ಸರ್ಕಾರಿ ಕೆಲಸವನ್ನು ಬಿಡಲು ಒಪ್ಪಲಿಲ್ಲ. ನನ್ನ ಧೈರ್ಯವನ್ನು ಅವರಿಗೆ ತಿಳಿಸಿದ"], ["ಮೇಲೆ ಅರೆಮನಸ್ಸಿನಿಂದ ಕೆಲಸ ಬಿಡಲು ಒಪ್ಪಿದರು ಬಹುಶಃ 1944ರಲ್ಲಿ ನನ್ನ ಕೆಲಸಕ್ಕೆ ರಾಜಿನಾಮೆ ನೀಡಿ, ಹುಳಿಯಾರಿನಲ್ಲಿ ನನ್ನ ಔ:೩ಂ೮ಂ೮ ಮಾಡಲು *ಕಿನಿಕ್‌' (ವಿನತಾ ಔಷಧಾಲಯ) ಪ್ರಾರಂಭಿಸಿದೆನು.", "ನನಗೆ. ಈ ಕ್ಲಿನಿಕ್‌ ಉತ್ತೇಜನಕಾರಿಯಾಗಿ ಧೈರ್ಯ ತಂದಿತು. ಸರಕಾರಿ ಕೆಲಸ ಬಿಟ್ಟಿದ್ದಕ್ಕೆ ಯೋಚನೆ, ತೊಂದರೆಗಳಾಗಲಿಲ್ಲ. ಆಗ್ಗೆ ನನಗೆ ಸೈಕಲ್ಲು ನಡೆಸಲು ಬರುತ್ತಿರಲಿಲ್ಲ. 100/- ರೂಗಳಿಗೆ ನನ್ನ ಸ್ನೇಹಿತನ ಬಳಿ ಸೈಕಲ್‌ ಕ್ರಯಕ್ಕೆ ಪಡೆದು ಅದರಲ್ಲಿಯೇ ಸೈಕಲ್‌ ನಡಸಲು ಕಲಿತು, ಕಡೆಯವರೆಗೆ ಆ ಸೈಕಲ್ಲನ್ನು ಉಪಯೋಗಿಸುತ್ತಿದ್ದೆ. ಹುಳಿಯಾರಿನಲ್ಲಿ ನನ್ನ ಮೆಡಿಕಲ್‌ ಪ್ರಾಕ್ಟೀಸ್‌ ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತಿದ್ದು. ಅಲ್ಲಿಗೆ ಬರುತ್ತಿದ್ದ ಡಾಕ್ಟರುಗಳಿಗೆ ಹೊಟ್ಟೆಕಿಚ್ಚು ಆಗುತ್ತಿತ್ತು. ಈ ಕಾಲದಲ್ಲಿ ನನಗೆ ಯಾವುದಾದರೂ ರೂಪದಲ್ಲಿ ತೊಂದರೆ ಮಾಡಬೇಕೆಂಬ ಅವರ ಪ್ರಯತ್ನ ನನ್ನ ಜನಾನುರಾಗದಿಂದ ಫಲಿಸಲಿಲ್ಲ.", "ನನ್ನ ಪಶ್ಚಿ ಅಲಮೇಲ ಮತ್ತು ನನ್ನ ಮೂರು ಮಕ್ಕಳು ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದೆವು. ಅಲಮೇಲ ಆ ಊರಿನ ಮಹಿಳೆಯರಲ್ಲಿ ತುಂಬಾ ಜನಾನುರಾಗಿಯಾಗಿ, ಜಾಣೆಯಾಗಿದ್ದಳು. ಆಗ ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದ ಬ್ರಾಹ್ಮಣ ಮತ್ತು ವೈಶ್ಯ ಮಹಿಳೆಯರು ಅಷ್ಟೇನೂ ನಾಗರೀಕತೆಯಲ್ಲಿರಲಿಲ್ಲ. ಅಲ್ಲಿನ ಮಹಿಳೆಯರು ಕರಕುಶಲ ವಿದ್ಯೆಗಳಿಗೆ, ನಾಗರೀಕತೆಗೆ ಅಲಮೇಲಳ ಬಳಿ ಬರುತ್ತಿದ್ದರು. ಅಲಮೇಲಳ ಜನಾನುರಾಗವೂ ನನ್ನ ಮೆಡಿಕಲ್‌ ಪ್ರಾಕ್ಟೀಸ್‌ಗೆ ತುಂಬಾ ಸಹಕಾರಿಯಾಯಿತು.", "ನನ್ನ ರಾಜಕೀಯ ಪ್ರವೇಶ", "ಹೀಗಿರುವಲ್ಲಿ ಅನಿರೀಕ್ಷಿತವಾಗಿ ನಾನು ರಾಜಕೀಯ ಪ್ರವೇಶಿಸುವಂತಾಯಿತು. ಒಂದು ದಿನ, ಆಗ ತುಂಕೂರು ಜಿಲ್ಲಾ ಕಾಂಗ್ರೆಸ್‌ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದ ಅಡ್ವೋಕೇಟ್‌ ಶ್ರೀ ಕೆ. ರಂಗಯ್ಯಂಗಾರ್‌ರವರು ನನ್ನ ಕ್ಲಿನಿಕ್‌ಗೆ ಬಂದರು. (ಇವರು ಸಹ ಕಡಬ ಮೂಲದವರೆ) ಅವರು ನನಗೆ ಈ ಹಿಂದೆ ಚೆನ್ನಾಗಿ ಪರಿಚಯವಿದ್ದುದ್ದರಿಂದಲೂ, ಹಿರಿಯ ಶ್ರೀವೈಷ್ಣವರಾಗಿದ್ದರಿಂದಲೂ ಅವರನ್ನು ಮತ್ತು ಅವರ ಜೊತೆ ಬಂದಿದ ಇತರೆ ಕಾಂಗ್ರೆಸ್ಸಿಗರನ್ನು ಸತ್ಕರಿಸಿದೆನು.", "ಮೊದಲು ಅವರುಗಳು ನನಗೆ ಯಾವ ವಿವರಗಳನ್ನೂ ತಿಳಿಸಿರೆ, ಈ ಊರಿನಲ್ಲಿ ಒಂದು ಕಾಂಗ್ರೆಸ್‌ ಸಮಿತಿ ಸ್ಥಾಪಿಸುವ ಉದ್ದೇಶದಿಂದ ಒಂದು ಬಹಿರಂಗ ಸಭೆ ಕರೆದಿರುವುದಾಗಿಯೂ, ಸಭೆಗೆ ನನ್ನನ್ನು ಆಹ್ವಾನಿಸಿದರು. ನನ್ನನ್ನು ಮುಂಚಿತವಾಗಿ ಏನನ್ನೂ ಕೇಳದೆ, ವಿಚಾರವನ್ನೂ ತಿಳಿಸದೆ, ಆ"], ["ಸಭೆಯಲ್ಲಿ ಈ ಊರಿನಲ್ಲಿ ಕಾಂಗ್ರೆಸ್‌ ಪಕ್ಷದ ಶಾಖೆ ಪ್ರಾರಂಭಿಸುತ್ತಿರುವುದಾಗಿಯೂ, ಅದಕ್ಕೆ ನನ್ನನ್ನು ಅಧ್ಯಕ್ಷರನ್ನಾಗಿ ನೇಮಕ ಮಾಡಿರುವುದಾಗಿಯೂ, ಜಿಲ್ಲಾ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದ ಶ್ರೀ ಕೆ. ರಂಗಯ್ಯಂಗಾರ್‌ರವರು ಬಹಿರಂಗ ಸಭೆಯಲ್ಲಿ ಘೋಷಿಸಿಯೇ ಬಿಟ್ಟರು. ಈ ಸಮಿತಿಯ ಸ್ಥಳೀಯ ಶಾಖೆಯ ಕಾರ್ಯಕಾರಿ ಮಂಡಳಿಯ ಸದಸ್ಯರನ್ನು ನಾನೇ ಆಗಿಸಿಕೊಳ್ಳಬಹುದೆಂದೂ ಘೋಷಿಸಿದರು. ಅನಿರೀಕ್ಷಿತವಾಗಿ ಬಂದ ಈ ಅಧಿಕಾರವನ್ನು ವಿಧಿಯಿಲ್ಲದೆ ನಾನು ಒಪ್ಪಿಕೊಂಡದ್ದಾಯಿತು.", "ನಾನು ಆದಿಯಿಂದಲೂ ದೇಶದ ಸ್ವಾತಂತ್ರ್ಯದ ಪರಂಪರೆಯಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತಿದ್ದು, ಇದನ್ನು ಒಪ್ಪಲೇ ಬೇಕಾಯಿತು. ಇದು ನಡೆದದ್ದು 1945, ಸ್ವಾತಂತ್ರ್ಯ ಪೂರ್ವದಲ್ಲಿ. ಇಲ್ಲಿಂದ ಮುಂದೆ ನಾನು, ನನ್ನ ಮಡಿಕಲ್‌ ಪ್ರಾಕ್ಟೀಸ್‌ ಜೊತೆಗೆ ರಾಜಕಕೀಯಕ್ಕೆ ಪ್ರವೇಶ ಮಾಡಿದ್ದಾಯಿತು. ದೇಶದ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕೆ ವಿರೋಧಿಗಳಾದ ಸರಕಾರಿ ಅಧಿಕಾರಿಗಳ ಕೋಪಕ್ಕೆ ಒಳಗಾಗಿ ಸ್ಪಲ್ಪ ತೊಂದರೆ ಅನುಭವಿಸಬೇಕಾಯಿತು. ಆದರೂ ಕಷ್ಟಪಟ್ಟು ಸ್ಥಳೀಯ ಕಾಂಗೆಸ್‌ ಶಾಖೆಯನ್ನು ಪ್ರಾರಂಭಿಸಿ, ಕಾರ್ಯಕಾರಿ ಸಮಿತಿ ರಚಿಸಿ ಕಾರ್ಯೋನ್ಮುಖವಾಗಿ ಹೆಚ್ಚಿನ ಜನ ಬೆಂಬಲಗಳಿಸಿದ್ದಾಯಿತು. ಇದರಿಂದ ನನ್ನ ಮೆಡಿಕಲ್‌ ಪ್ರಾಕ್ಟೀಸ್‌ಗೆ ಸ್ವಲ್ಪ ತೊಂದರೆಯಾಯಿತು. ಮುಂದೆ ರಾಜಕೀಯ ಕಾರ್ಯ ಯಶಸ್ವಿಯಾಗಿ, ತಾಲ್ಲೂಕು, ಜಿಲ್ಲೆ ಮತ್ತು ಪ್ರದೇಶದವರೆಗೂ ನನ್ನ ಕಾರ್ಯ ಯಶಸ್ವಿಯಾಗಿ, ನಾನೊಬ್ಬ ರಾಜಕೀಯ ಗಣ್ಯ ವ್ಯಕ್ತಿಯೆಂಂಬ ಕೀರ್ತಿಯು ನನ್ನ ಪಾಲಿಗೆ ಲಭಿಸಿತು.", "ಈ ರಾಜಕೀಯ ವ್ಯವಹಾರದಿಂದ ನನ್ನ ವೈದ್ಯಕೀಯ ಅಭ್ಯಾಸಕ್ಕೆ ಹೆಚ್ಚು ನಷ್ಟವೇ ಆಯಿತು. ಈ ರಾಜಕೀಯದ ವೇಳೆಯ ನನ್ನ ನಿಸ್ವಾರ್ಥ ಸೇವೆಯು ಮೆಚ್ಚುಗೆಯಾಗಿ ಸರ್ಕಾರದಲ್ಲಿ ಸ್ವಾತಂತ್ರ್ಯಾನಂತರ ಸ್ಥಳೀಯ ಸರಕಾರಿ ಅಧಿಕಾರಿ ಮೊದಲ್ಗೊಂಡು ತಾಲ್ಲೂಕು. ಜಿಲ್ಲೆ ಸಚಿವರವರೆಗೆ ನನ್ನ ಪ್ರತಿಭೆ ಹೆಚ್ಚಿತ್ತು. ಸ್ಥಳೀಯ ಸಮಸ್ಯೆ ಉದ್ಭವಿಸಿದಾಗ, ಅಧಿಕಾರಿಗಳು ನನ್ನ ಸಲಹೆಯಂತೆ ಪರಿಶೀಲಿಸುತ್ತಿದ್ದರು. ಸ್ವಜನ ಬಂಧುಗಳು, ಆಸ್ತಿ ಐಶ್ವರ್ಯ ಇಲ್ಲದ ಮತ್ತು ಊರಿನ ಸ್ಥಳದವನೂ ಅಲ್ಲದ ನನಗೆ ಆ ಗೌರವ ಲಭಿಸಿದ್ದಕ್ಕೆ ನನ್ನ ನಿಸ್ವಾರ್ಥ ಜನ ಸೇವೆಯೇ ಕಾರಣವಾಗಿತ್ತು.", "ನನ್ನ ರಾಜಕೀಯ ಪ್ರಭಾವದಿಂದ ಸ್ವಂತಕ್ಕೆ ಸಾಕಷ್ಟು ಆಸ್ತಿಗಳನ್ನು ಮಾಡಿಕೊಳ್ಳುವ ಅವಕಾಶವಿತ್ತು. ಈ ಅವಕಾಶದಿಂದ ನಾನು ಸ್ವಾರ್ಥಕ್ಕೆ ಇಳಿದಿದ್ದರೆ ನಾನು ಜನಾನುರಾಗವನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತಿದ್ದ. ಮುಂದೆ ಆ ಊರಿನಲ್ಲಿರಲು ಅವಕಾಶವಾಗುತ್ತಿರಲಿಲ್ಲ. ನನ್ನ ನಿಸ್ವಾರ್ಥ ಸೇವೆಯೇ ಈ ಪ್ರಭಾವಕ್ಕೆ ಕಾರಣವಾಯಿತು."], ["ಆ ಜಿಲ್ಲೆಯ ಎಲ್ಲಾ ಅಧಿಕಾರಿಗಳ, ಐಶ್ವರ್ಯವಂತರ, ವಿದ್ಯಾವಂತರುಗಳ ಸರಿಸಮಾನರಾಗಿ ಗೌರವ ಲಭಿಸಿತು.", "ಸ್ವಾತಂತ್ರ್ಯಾನಂತರ ತುಂಕೂರು ಜಿಲ್ಲೆಯವರೇ ಆದ, ಮಾನ್ಯ ಸಚಿವರಾದ ದಿ. ಟಿ. ಸುಬ್ರಹ್ಮಣ್ಯ, ಎಂ.ವಿ. ರಾಮರಾವ್‌, ಚೆನ್ನಿಗರಾಮಯ್ಯ, ಮತ್ತು ಶಾಸಕರಾದ ಮಾಲಿ ಮರಿಯಪ್ಪ ಹುಚ್ಚಮಾಸ್ಕಿ ಗೌಡ, ಎನ್‌. ಬಸವಯ್ಯ, ಎಲ್ಲರೂ ನನ್ನ ಮಾತನ್ನು ಗೌರವಿಸುತ್ತಿದ್ದರು. ಹುಳಿಯಾರು ಸುತ್ತಮುತ್ತಲ ಗ್ರಾಮಸ್ಥರು ವೈದ್ಯ ವೃತ್ತಿಗೇ ಅಲ್ಲದೆ, ರಾಜಕೀಯ, ಅಣ್ಣತಮ್ಮ ಅಪ್ಪ ಮಕ್ಕಳು, ಗಂಡ ಹೆಂಡತಿ ವ್ಯವಹಾರಗಳಿಗೂ ನನ್ನಲ್ಲಿ ಬಂದು ಪರಿಹರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು.", "ನನ್ನ ಪತ್ಸಿ ಅಲಮೇಲ ಸಹ ಪರೋಕ್ಷವಾಗಿ ರಾಜಕೀಯ ಮತ್ತು ಸಾಮಾಜಿಕ ಕಾರ್ಯ ಮಾಡುತ್ತಿದ್ದಳು. ಸರಕಾರ ತಾಪತ್ರಯಗಳ ಕಾರಣ, ಅವಳು ನೇರವಾಗಿ ರಾಜಕೀಯ ಪ್ರವೇಶ ಪಡೆಯಲು ಅವಕಾಶವಾಗಲಿಲ್ಲ. ಈ ಕಾಲದಲ್ಲಿ ನನ್ನ ಹಿರಿಯ ಮಗಳು, ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿಯನ್ನು ನಗರದ ವಾತಾವರಣದಲ್ಲಿರಲು ಮತ್ತು ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಮೈಸೂರಿನಲಿಟ್ಟು ಹೈಸ್ಕೂಲ್‌ ವ್ಯಾಸಂಗ ಪೂರ್ತಿಯಾಗುವವರೆಗೆ ನನ್ನ ನಾದಿನಿ ಪದ್ದು ಮನೆಯಲ್ಲಿ ಮೈಸೂರಿನಲ್ಲಿಯೇ ಇದ್ದಳು. ನನ್ನ ಮಗ ಜಿ. ನಾಗರಾಜನನ್ನು ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಜೊತೆಯಲ್ಲಿದ್ದು ವಿದ್ಯಾ ವ್ಯಾಸಂಗಕ್ಕೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬಿಡಲಾಯಿತು. ಈ ಮಧ್ಯೆ ನನಗೆ ಇನ್ನೂ ಕೆಲವು ಮಕ್ಕಳು ಹುಟ್ಟಿದರು. ಮಕ್ಕಳೆಲ್ಲಾ ಕಡಬದ ನನ್ನ ಅತ್ತೆಯ ಮನೆಯಲ್ಲಿ ಹುಟ್ಟಿದರು. ಅತ್ತೆಯವರೂ ನನ್ನ ಮಕ್ಕಳ ಸಾಕುವಿಕೆಗೆ ನೆರವಾಗಿದ್ದರು.", "ಈ ಮಧ್ಯೆ ತುಂಂಕೂರು ಸೋಮೇಶ್ವರಪುರಂನಲ್ಲಿ 7500/- ರೂಗಳಿಗೆ, ನನ್ನ ಅತ್ತೆಯವರ ಮಾತಿನ ಸಹಕಾರದಿಂದ ಒಂದು ಮನೆಯನ್ನು ಕ್ರಯಕ್ಕೆ ಪಡೆದೆನು ಮುಂದೆ ಮಕ್ಕಳ ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಮತ್ತು ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ ನಾನು ವಾಸಿಸಲು ತಿಂಗಳಿಗೆ ಮನೆ ಬಾಡಿಗೆ 25/-ರೂ ಬರುತ್ತಿತ್ತು. ಮುಂದೆ ಬೆಂಗಳೂರಿಗೆ ಬಂದು ವಾಸಿಸುತ್ತೇನೆಂಬುದು ಕನಸಿನಲ್ಲಿಯೂ ಇರಲಿಲ್ಲ. ಈ ಯೋಚನೆ ಆಗ ಹೊಳೆದಿದ್ದ ಪಕ್ಷದಲ್ಲಿ ತುಂಕೂರಿನ ಬದಲಾಗಿ ಬೆಂಗಳೂರಿನಲ್ಲೇ ಕೊಳ್ಳಬಹುದಿತ್ತು ಆಗಿನ ಕಾಲದಲ್ಲಿ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಮನೆ ಸುಲಭ ರೀತಿಯಲ್ಲಿ ಕ್ರಯಕ್ಕೆ ಸಿಗುತ್ತಿತ್ತು."], ["ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನನ್ನ ತಂದೆ ಜೊತೆ ಇದ್ದ ನಾಗರಾಜನಿಗೆ ಮತ್ತು ನನ್ನ ದೊಡ್ಡಪ್ಪನವರ ಮಗ ದೇಶಿಕಾಚಾರ್ಯನ ದ್ವಿತೀಯ ಪುತ್ರ ನಾರಾಯಣನಿಗೆ, ಇಬ್ಬರಿಗೂ ಒಟ್ಟಿಗೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಉಪನಯನ ಮಾಡಿದೆನು. ಇನ್ನು ನನ್ನ ಮಗಳು ವಿನತಾಲಕ್ಷ್ಮಿಗೆ ವಿವಾಹದ ವಯಸಾದ್ದರಿಂದ ವಿವಾಹಕ್ಕೆ ಪ್ರಯತ್ನ ಪ್ರಾರಂಭವಾಯಿತು. ಮೊಟ್ಟಮೊದಲು ಕಡೂರು ತಾಲ್ಲೂಕು ತಂಗ್ಲಿ ಗ್ರಾಮಕ್ಕೆ ಹೋಗಿ ಎಲೆಕ್ಟ್ರಿಕಲ್‌ ಕಂಟ್ರಾಕ್ಟರ್‌ ಮತ್ತು ಜಮೀನುದಾರ್‌ ಮತ್ತು ಎಲೆಕ್ಟ್ರಿಕಲ್‌ ಡಿಪ್ಲೊಮೊ ಹೋಲ್ಡರ್‌ ಮನೆಗೆ ವಿನತಾ ಜೊತೆ ಹೋಗಿದ್ದೆ. ವರ ಹೆಣ್ಣನ್ನು ಒಪ್ಪಿಗೆ ಕೊಟ್ಟಾಗ ವಿನತಾ, ತಂಗ್ರಿ ಹಳ್ಳಿ, ಅವರ ಮನೆ ಬೇಡವೆಂದು ಹೇಳಿದಳು. ವರನ ಕಡೆಯವರು ಮೂರು ಪತ್ರ ಬರೆದು ಒತ್ತಾಯಿಸಿದ್ದರು. ಜಾತಕ ಅನುಕೂಲವಾಗಲಿಲ್ಲವೆಂದು ತಿಳಿಸಿದ್ದಾಯಿತು.", "ವಿನತಾ (ಅಮ್ಮಣ್ಣಿ) ಮದುವೆ", "ನನ್ನ ಅತ್ತೆ ಹಾಸನಕ್ಕೆ ವರಾನ್ವೇಷಣೆಗಾಗಿ ಹೋಗಿ ಈಗ ವಿನತಾ ಲಗ್ನವಾಗಿ ಸೇರಿರುವ ಮನೆಗೆ ಹೋಗಿ ಪ್ರಸ್ತಾಪ ಮಾಡಿ ಹೆಣ್ಣನ್ನು ನೋಡಲು ಕರೆದಿಕೊಂಡು ಬರುವಂತೆ ಹೇಳಿದರು. ಇದರಂತೆ ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿಯನ್ನು ಆರು ಜನರ ಸಮೇತ (ಅಪ್ಪ, ಅಮ್ಚ ಪದ್ದಕ್ಕ, ಚಿಕ್ಕಪ್ಪ, ಜಿತ್ತಿ ಮತ್ತು ಅಮ್ಮಣ್ರಿ ಹಾಸನಕ್ಕೆ ದಿವಂಗತ ಲಾಯರ್‌ ಶಿಂಗಯ್ಯಂಗಾರ್‌ರವರ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಹೋದೆವು. ದಿವಂಗತ ಲಾಯರ್‌ ಶಿಂಗಯ್ಯಂಗಾರ್‌ ಎರಡನೇ ಕುಟುಂಬ ಶ್ರೀಮತಿ ಜಯಮ್ಮನವರ ಜ್ಯೇಷ್ಠ ಪುತ್ರ ಮತ್ತು ಲಾಯರ್‌ ವೆಂಕಟರಂಗ ಅಯ್ಯಂಗಾರ್‌ (ರಾಜು) ಇವರೇ ವರ. ಇವರೇ ನನ್ನ ಹಿರಿಯ ಅಳಿಯಂದಿರು.", "ಈ ಮುಂದೆ ಹೆಣ್ಣನ್ನು ನೋಡಿ ಒಪ್ಪಿಗೆಯಾಗಿದ್ದಕ್ಕೆ ಪತ್ರ ಬರೆಯುವುದಾಗಿ ಹೇಳಿದ ನಂತರ ನಾವೆಲ್ಲರೂ ಹುಳಿಯಾರಿಗೆ ಹೊರಟೆವು. ಕೆಲವು ದಿನಗಳ ನಂತರ ಹೆಣ್ಣು ಒಪ್ಪಿಗೆಯಾಗಿರುವುದಾಗಿಯೂ, ಮುಂದಿನ ವಿವಾಹದ ಏರ್ಪಾಡುಗಳಿಗೆ ಮೊಖ್ತಾ ಹಾಸನಕ್ಕೆ ಬರುವಂತೆ ಪತ್ರ ತಲಪಿತು. ಅದರಂತೆ ನಾನು ಹಾಸನಕ್ಕೆ ಹೋಗಿ ಅವರು ಕೇಳಿದಂತೆ ವರೋಪಚಾರಕ್ಕೆ 1000/- ರೂಗಳ ಬ್ಯಾಂಕ್‌ ಡಿ.ಡಿ. ಕೊಟ್ಟು ಬಂದೆನು.", "ಈ ಹಾಸನದ ವರ ನನ್ನ ಮಗಳು ಸೌ. ವಿನತಾಗೆ ನಿಷ್ಕರ್ಷೆಯಾದ ವಿಚಾರ, ಕಡಬ ಮತ್ತು ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನಮ್ಮ ಎಲ್ಲಾ ಸ್ವಜನರಿಗೆ ಗೊತ್ತಾಗಿ, ಹೊಟ್ಟೆಕಿಚ್ಚುಪಟ್ಟು ಈ ವಿವಾಹವನ್ನು ತಪ್ಪಿಸಬೇಕೆಂಬ ಉದ್ದಿಶ್ಶ ಹೊಂದಿ ನಮ್ಮಗಳ ಮೇಲೆ ಇಲ್ಲದ ಅಪಪ್ರಚಾರವನ್ನು ಹೊರೆಸಿ ಹಾಸನಕ್ಕೆ ವರನ"], ["ಎಳಾಸಕ್ಕೆ ಬೇನಾಮಿ ಪತ್ರವೊಂದನ್ನು ಕಡಬದಿಂದ ಬರೆದಿದ್ದರು. ಈ ಪತ್ರ ಬರೆದವರು ಯಾರೆಂದು ಮುಂದೆ. ನನಗೆ ಗೊತ್ತಾಯಿತು. ಈ ಬೇನಾಮಿ ಪತ್ರದ ವಿಚಾರ, ಮುಂದೆ ವಿವಾಹದ ಏರ್ಪಾಡಿಗೆ ಹಾಸನಕ್ಕೆ ಹೋದಾಗಲೇ ನನಗೆ ತಿಳಿದದ್ದು. ವಿವಾಹದ ಏರ್ಪಾಡು ಇಟ್ಟುಕೊಂಡು, ವಿವಾಹಕ್ಕೆ ನನ್ನ ಮಗಳಿಗೆ ಸೀರೆಯನ್ನು ಕೊಂಡು, ಅದಕ್ಕೆ ಸರಿಯಾದ ಸೀರೆ ತರಲು ವರನ ಕಡೆಯವರಿಗೆ ತೋರಿಸಲು ಮತ್ತು ವಿವಾಹದ ನಿರ್ದಿಷ್ಟ ದಿನ ಗೊತ್ತು ಮಾಡಿಕೊಂಡು ಬರಲು ನಾನು ಹಾಸನಕ್ಕೆ ಹೋದೆನು. ಹಾಸನದ ವರನ ಮನೆಯಲ್ಲಿ ಆ ದಿನ ನಾನು ಹಾಸನಕ್ಕೆ ಬರುವುದನ್ನು ಮುಂಚೆಯೇ ಕಾಗದ ಬರೆದಿದ್ದೆನಾದ್ದರಿಂದ, ನನ್ನ ಆಗಮನವನ್ನು ಅವರು (ತಿಳಿದಿದ್ದರಿಂದ), ವರನ ಇಬ್ಬರು ಅಣ್ಣಂದಿರು, ನಾನು ಅವರ ಮನೆಗೆ ಹೋದಾಗ ಅಲ್ಲಿ ಸೇರಿದ್ದರು. ಎಲ್ಲರ ಮುಖವೂ ಕಳೆಗುಂದಿ, ನಿರುತ್ಸಾಹದ ಭಾವನೆ ಅಲ್ಲಿಗೆ ಹೋದಾಗ ಕೂಡಲೇ ವ್ಯಕ್ತವಾಯಿತು.", "ನಾನು ಮದುವೆಗೆ ತಂದಿದ್ದ ಸೀರೆಯನ್ನು ತೋರಿಸಿ, ಮದುವೆಯ ದಿನಾಂಕದ ಬಗ್ಗೆ ಕೇಳಿದಾಗ, ಶ್ರೀ ರಾಜು ಅವರ ಅಣ್ಣ ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌, ಸದ್ಯಕ್ಕೆ ಈ ವಿವಾಹ ಏರ್ಪಾಡು ನಿಲ್ಲಿಸಿದೆ ಎಂದು ನನಗೆ ಹೇಳಿದರು. ನಾನು ತೆಗೆದುಕೊಂಡು ಹೋಗಿದ್ದ ಸೀರೆ ಸಹ ಅವರುಗಳು ನೋಡಲಿಲ್ಲ. ಮದುವೆಯ ಉತ್ಸಾಹದಿಂದ ಹಾಸನಕ್ಕೆ ಹೊಗಿದ್ದ ನನಗೆ ಅವರ ಮಾತಿನಿಂದ ದಿಗ್ಭಮೆಯಾಗಿ ಮೌನವಾಗಿ ಬಿಟ್ಟೆ. ಮದುವೆ ಏರ್ಪಾಡು ನಿಲ್ಲಿಸಿದ್ದಕ್ಕೆ ಅವರು ಯಾವ ಕಾರಣವನ್ನೂ ಕೊಡಲಿಲ್ಲ. ದಿಗ್ಭಮೆಯಿಂದಾಗಿ ನಾನು ಕಾರಣ ಕೇಳಲಿಲ್ಲ. ತಕ್ಷಣವೇ ಅವರ ಮನೆಯಿಂದ ಹೊರಗೆ ಬಂದು ಬಿಟ್ಟೆ. ಡಿಡಿ ಮೂಲಕ ನಾನು ಕೊಟ್ಟಿದ್ದ 1000/- ರೂಗಳನ್ನು ಕೇಳಲಿಲ್ಲ. ನನ್ನ ಈ ಅನಿರೀಕ್ಷಿತ ದುಃಖವನ್ನು ಗ್ರಹಿಸಿದ ರಾಜುರವರ ಭಾವ ದಿವಂಗತ ಕಸ್ತೂರಿರಂಗ ಅಯ್ಯಂಗಾರ್‌ರವರು ನನ್ನನ್ನು ಅವರ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ, ಅವರೂ ಮತ್ತು ಅವರ ಪತ್ನಿಯವರೂ ಸಾಂತ್ವನಗೊಳಿಸಲು ಯತ್ನಿಸಿದರೂ ನನ್ನ ದುಃಖ ಶಮನವಾಗಲಿಲ್ಲ.", "ಹಾಸನದಿಂದ ಸೀದಾ ನೊಣವಿನಕೆರೆಗೆ ಹೋಗಿ ಈ ವಿವಾಹಕ್ಕೆ ಆದ ಅಡಚಣೆಯನ್ನು ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನವರಿಗೆ ತಿಳಿಸಿ, ಹುಳಿಯಾರಿಗೆ ಹೋಗಿ ಮನೆಯಲ್ಲಿ ವಿಚಾರ ತಿಳಿಸಿದ ನಂತರ ಎಲ್ಲರೂ ಒಂದು ರೀತಿಯ ದುಃಖವನ್ನೇ ಅನುಭವಿಸಿದರು. ಹಾಸನದಲ್ಲಿ ನನ್ನ ಮಗಳಿಗೆ ವರ ಗೊತ್ತಾಗಿದ್ದು, ತಪ್ಪಿ ಹೋದ ವಿಚಾರ ತಿಳಿದು ನಮವೆ ಆಗದವರು ಕಡಬ ಮತ್ತು ನೊಣವಿನಕೆರೆಗಳಲ್ಲಿ ಸಂತೋಷವನ್ನೇ ಪಡುತ್ತಿದ್ದರು, ಪರೋಕ್ಷವಾಗಿ."], ["ಇದಾದ ಎರಡು ದಿನಗಳ ನಂತರ, ಎಲ್ಲಾ ಮಾತುಕತೆಗಳು ನಿರ್ಧಾರವಾಗಿ, ವಿವಾಹದ ವರ್ತಾಡು ಸಂದರ್ಭದಲ್ಲಿ ಯಾವುದೇ ರೀತಿಯ ಕಾರಣ ಕೊಡದೆ, ಏಕಾಏಕಿ ಈ ಏರ್ಪಾಡು ನಿಲ್ಲಿಸಿದೆ ಎಂದು ಹೇಳಿದ್ದಕ್ಕೆ ವರನ ಎಲ್ಲಾ ಅಣ್ಣಂದಿರು ಮತ್ತು ಭಾವನವರುಗಳ ಅಡ್ರೆಸ್‌ಗೆ 4 ಪುಟಗಳ ಕಾಗದ ಬರೆದನು. ಈ ರೀತಿಯಾಗುವುದಕ್ಕೆ ಯಾವುದೋ ಒಂದು ಬೇನಾಮಿ ಪತ್ರ ಅವರುಗಳಿಗೆ ತಲುಪಿರಬಹುದೆಂದು ಊಹಿಸಿ, ಆ ಕಾಗದದ ವಿಚಾರವನ್ನು ನನಗೆ ತಿಳಿಸದೆ, ನಿಜಾಂಶವನ್ನು ಅರಿಯುವ ಪ್ರಯತ್ನ ಮಾಡದೆ. ಈ ರೀತಿ ನೀವುಗಳೆಲ್ಲ ನ್ಯಾಯವಾದಿಗಳಾಗಿದ್ದು ವಿಷಯ ಪರಿಶೀಲಿಸದೆ ಮತ್ತು ಯಾವುದೇ ಕಾರಣಗಳನ್ನು ಕೊಡದಿದ್ದದ್ದನ್ನು ಉಲ್ಲೇಖಿಸಿ ಪತ್ರ ಬರೆದೆನು. ಈ ವರ ತಷ್ಪಿದ್ದಕ್ಕೆ ಚಿಂತೆಯಿಲ್ಲ. ವರನಿಗಾಗಿ ನಾವು ಬೇರೆ ಕಡೆ ಹೋದಾಗ ಹಾಸನದ ವರ ತಷ್ಪಿದ್ದಕ್ಕೆ ಕಾರಣ ಕೇಳಿದರೆ, ಏನು ಹೇಳಬೇಕೆಂಬುದಕ್ಕೆ ನೀವುಗಳು ಕಾರಣ ಕೊಡಬೇಕಿತ್ತೆಂದು ಸಹ ಕಾಗದದಲ್ಲಿ ಬರೆದಿದ್ದೆನು.", "ಈ ಮಧ್ಯೆ ಶ್ರೀ ರಾಜು ಅವರ ಅಣ್ಣ ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ನನ್ನ ತಾಯಿ ಸಂಬಂಧ ಅಟ್ಟಾವರದ ಹೆಣ್ಣು ಕೊಟ್ಟು ಲಗ್ನವಾಗಿತ್ತು. ನನ್ನ ತಾಯಿ ಚಿಕ್ಕವಯಸ್ಸಿನಲ್ಲೇ ಗತಿಸಿದ್ದದ್ದರಿಂದ, ಈ ಸಂಬಂಧ ನನಗೆ ಗೊತ್ತಿರಲಿಲ್ಲ. ಎರಡನೆಯದಾಗಿ ಶ್ರೀ ರಾಜು ಅವರ ಹಿರಿಯ ಭಾವ ಕಸ್ತೂರಿರಂಗ ಅಯ್ಯಂಗಾರ್‌ರವರು ಶಾಂತಿಗ್ರಾಮದ ದೀಕ್ಷಿತರ ಸಂಬಂಧ. ಶಾಂತಿಗ್ರಾಮದ ದೀಕ್ಷಿತರೂ, ಕಡಬದ ದೀಕ್ಷಿತ ಅಣ್ಣಾದೊರೈಯವರೂ ಸಂಬಂಧಿಕರು. ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರ ತಾಯಿ ಕಡಬದ ದೀಕ್ಷಿತರ ಮನೆಯವರು. ಈ ಯಾವ ಸಂಬಂಧಗಳೂ ನನಗೆ ಮೊದಲು ತಿಳಿದಿರಲಿಲ್ಲ ಕಡಬದ ದಿವಂಗತ ದೀಕ್ಷಿತ ಅಣ್ಣಾದೊರೈಯವರು ತಮ್ಮ ಬಾಲ್ಯ ಸ್ನೇಹಿತ ರಾಜುರವರ ಭಾವ ಕಸ್ತೂರಿರಂಗ ಅಯ್ಯಂಗಾರ್‌ರವರಿಗೆ ನನ್ನ ಸಂಸಾರದ ಪರಿಚಯದ ಪತ್ರ ಬರೆದಿದ್ದರು. ಶ್ರೀ ಕಸ್ತೂರಿರಂಗ ಅಯ್ಯಂಗಾರ್‌, ದೀಕ್ಷಿತ ಅಣ್ಣಾದೊರೈ ಮತ್ತು ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರು ಬಾಲ್ಯದಲ್ಲಿ ಸೇರಿ ಆಟಗಳನ್ನಾಡುತ್ತಿದ್ದದ್ದನ್ನು ಪಸ್ತಾಪಿಸಿದ್ದರು. ಶ್ರೀ ರಾಜು ಅವರ ಅಣ್ಣ ಶ್ರೀ ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ರವರ ಹೆಣ್ಣು ಕೊಟ್ಟ ಅತ್ತೆ ಅಲಮೇಲಮ್ಮ ಅಟ್ಟಾವರದವರಾಗಿ, ನನ್ನ ತಾಯಿಯ ಹತ್ತಿರ ಸಂಬಂಧದಿಂದ ನನ್ನ ತಂದೆ. ಕಡೆ ಪರಿಚಯ ಮಾಡಿಕೊಟ್ಟದ್ದರು.", "ಇದಾದ ನಂತರ ಸದ್ರಿ ಬೇನಾಮಿ ಪತ್ರ ಹೊಟ್ಟಿಕಿಚ್ಚಿನಿಂದ ನಮಗೆ ಆಗದವರು ಬರೆದಿದ್ದುದುದು ವರನ ಕಡೆಯವರಿಗೆ ಅರಿವಾಗಿ ಕೆಲ ದಿನಗಳ ನಂತರ ವಿವಾಹದ ಏರ್ಪಾಡು ಮುಂದುವರೆಸಲು ನನ್ನನ್ನು"], ["ಹಾಸನಕ್ಕೆ ಆಹ್ವಾನಿಸಿದರು. ಈಗ ಹಾಸನಕ್ಕೆ ಹೋದಾಗ್ಗೆ ಶ್ರೀ ರಾಜುರವರ ಅಣ್ಣ, ಶ್ರೀ ರಾಮಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಅವರ ಮನೆಗೆ ನನ್ನನ್ನು ಕರೆದುಕೊಂಡು ಹೋದರು. ಅಲ್ಲಿ ಅವರ ಅತ್ತೆ ಅಲಮೇಲಮ್ಮನವರು ಇದ್ದು ನನ್ನ ಮತ್ತು ನನ್ನ ತಂದೆಯ ಕ್ಷೇಮ ವಿಚಾರಿಸಿ ಮಾತನಾಡಿದರು. ಅಲಮೇಲಮ್ಮನವರು ನನ್ನ ತಾಯಿಯ ಹತ್ತಿರದ ಸಂಬಂಧಿಕರಾಗಿ ನನಗೆ ಪರಿಚಯವಿತ್ತು. ಇದರಿಂದಾಗಿ ಅವರಿಗೆ. ಬಂದಿದ್ದ ಬೇನಾಮಿ ಪತ್ರ ಹೊಟ್ಟಿಕಿಚ್ಚಿನಿಂದ ಬರೆದಿರುತ್ತಾರೆಂಲಬ. ಅಂಶ ಅವರಿಗೆ ಮನವರಿಕೆಯಾಯಿತು. ಈ ಮಧ್ಯೆ ಶ್ರೀ ರಾಜು ಅವರ ಅಣ್ಣ ಶ್ರೀ (\"ಅಪ್ಪು ಶ್ರೀನಿವಾಸ ರಾಘವಾಚಾರ್‌ ಗುಬ್ಬಿಯಲ್ಲಿ ಸ್ಕೂಲ್‌ ಇನ್ಸ್‌ಪೆಕ್ಟರ್‌ ಆಗಿದ್ದರು. ಅವರು ಕಡಬಕ್ಕೆ ಹೋಗಿ ಎಲ್ಲಾ ವಿಚಾರಗಳನ್ನು ಸಂಗ್ರಹಿಸಿದ್ದರು. ಅವರು ಗುಬ್ಬಿಯಲ್ಲಿರುವ ಸಮಾಚಾರ ನನಗೆ ತಿಳಿದಿರಲಿಲ್ಲ. ಒಟ್ಟನಲ್ಲಿ ಸತ್ಯಕ್ಕೆ ಜಯ ಖಂಡಿತ ದೊರೆಯುತ್ತದೆ ಎಂಬುದು ಈ ಪ್ರಸಂಗದಿಂದ ಪ್ರತ್ಯಕ್ಷವಾಯಿತು. ಇದಾದ ನಂತರ ಈ ವಿವಾಹದ ಲಗ್ನಪತ್ರಿಕೆ ಕಾರ್ಯಕ್ರಮಕ್ಕಾಗಿ ನನ್ನ ತಂದೆ ಇದ್ದ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ವರ್ತಾಡಿಸಿ ಲಗ್ನಪತ್ರಿಕೆ ಶುಭ ಕಾರ್ಯ ಮಾಡಿದ್ದಾಯಿತು.", "ನಾನಿದ್ದದ್ದು ಹುಳಿಯಾರಿನಲ್ಲಿ. ನನ್ನ ತಂದೆ ವಯಸ್ಸಾಗಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿದ್ದರು. ಕಡಬದಲ್ಲಿ ಮದುವೆ ಸಹಾಯಕ್ಕೆ ಅನುಕೂಲಗಳಿರಲಿಲ್ಲ. ಇದರಿಂದಾಗಿ ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿಯ ವಿವಾಹವನ್ನು ತುಂಕೂರಿನಲ್ಲಿ. ನಡೆಸಲು ಏರ್ಪಡಿಸಿ, ಧರ್ಮರತ್ನಾಕರ ರುದ್ರಯ್ಕನವರ ಛತ್ರದಲ್ಲಿ ನಡೆಸಲು ನಿರ್ಧರಿಸಿದೆನು. ಹೇವಿಳಂಬ ನಾಮ ಸಂವತ್ಸರದ ವೈಶಾಖ ಶುದ್ಧ ದಶಮಿಯಂದು (24.5.1957), ತುಂಕೂರಿನಲ್ಲಿ ವಿವಾಹ ಆಗಿನ ಕಾಲಕ್ಕೆ ತಕ್ಕಂತೆ ವಿಜೃಂಭಣೆಯಾಗಿ ನೆರವೇರಿತು. ಈ ವಿವಾಹಕ್ಕೆ ಶ್ರೀ ರಾಜುರವರ ಅಣ್ಣ ತಮ್ಮಂದಿರು, ಅತ್ತಿಗೆ, ಶ್ರೀ ರಾಜುರವರ ತಾಯಿ, ತಂಗಿಯರೂ, ಭಾವಂದಿರೂ ಬಂದಿದ್ದರು.", "ಪ್ರಾರಂಭದಿಂದಲೂ ಶ್ರೀ ರಾಜು ಅವರ ತಾಯಿ ವಿಚಾರದಲ್ಲಿ ಸ್ವಲ್ಪ ನಿರಾಸಕ್ತಿಯಾಗಿಯೇ ಇದ್ದದ್ದು ಅರಿವಾಯಿತು, ಇದರಿಂದಾಗಿಯೇ ವಿವಾಹದ ನಂತರ ಸಂಭವಿಸಿದ ದುರ್ಫಟನೆಗೆ ನಾಂದಿಯಾಯಿತು. ದುರ್ಫಟನೆಗಳನ್ನು ಮುಂದೆ ವಿವರಿಸುತ್ತೇನೆ. ಈ ವಿವಾಹ ಮುನ್ನಾದಿನ ನನ್ನ 2ನೇ ಮಗ ಚಿ. ಸುಪರ್ಣನಿಗೆ ಕಡಬದಲ್ಲಿ ಉಪನಯನ ಮಾಡಿದೆನು.", "ನಾಗರಾಜನ ಮೆಡಿಕಲ್‌ ವಿದ್ಯಾಭ್ಯಾಸ"], ["ನನ್ನ ಹಿರಿಯ ಮಗ ಜಿ. ನಾಗರಾಜನನ್ನು ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಜೊತೆಯಲ್ಲಿರಲೆಂದು ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬಿಟ್ಟಿದ್ದೆನು... ಅವನು ಅಲ್ಲಿ. ಪ್ರೈಮರಿ ಸ್ಕೂಲಿನಿಂದ  8.6.1.0. ಪೂರ್ತಿಯಾಗುವವರೆಗೆ ಅಲ್ಲಿಯೇ ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನಿಗೆ ಪ್ರೀತಿ ಪಾತ್ರನಾಗಿ, ಚೆನ್ನಾಗಿ ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡುತ್ತಿದ್ದ. ನನ್ನ ಅಕ್ಕ ಎಲ್ಲಾ ವಿಚಾರಗಳಲ್ಲೂ ಭಯಗ್ರಸ್ತಳು. ಇದರಿಂದಾಗಿ ನಾಗರಾಜನನ್ನು ತುಂಬಾ ಭಯದಿಂದ ಸಾಕಿದಳು. ಇದರಿಂದಾಗಿ ನನ್ನ ಮಗ ನಾಗರಾಜನಿಗೆ ನನ್ನ ಇತರೆ ಮಕ್ಕಳಿಗಿರುವ ಧೈರ್ಯ ಇಲ್ಲ. ಇವನು 5.5.1.0. ಪರೀಕ್ಷೆಯಲ್ಲಿ ಹೆಚ್ಚು ಅಂಕಗಳನ್ನು ಪಡೆದು ಮೊದಲನೇ ತರಗತಿಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾದನು. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಗ್ರಾಮಾಂತರ ಪ್ರದೇಶಗಳಲ್ಲಿ 5.5.1.0೮. ಯಲ್ಲಿ ಮೊದಲನೇ ದರ್ಜೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾಗುತ್ತಿದ್ದುದು ಅಪರೂಪ. ಇವನು ಮೊದಲನೇ ದರ್ಜೆಯಲ್ಲಿ 5.8.1.0. ತೇರ್ಗಡೆಯಾದದ್ದಕ್ಕೆ ಅವನ ತಾತ, ಅವನ ಉಪಾಧ್ಯಾಯರುಗಳ ಮತ್ತು ಹಿತೈಷಿಗಳಿಗೆ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಭಾರಿ ಔತಣಕೂಟವನ್ನು ಏರ್ಪಡಿಸಿದ್ದರು.", "ಆ ಕಾಲದಲ್ಲಿ ವೈದ್ಯರುಗಳ ರಿಜಿಸ್ಟ್ರೇಷನ್‌ ಕಾಯಿದೆ ಜಾರಿಯಲ್ಲಿರಲಿಲ್ಲ. ವೈದ್ಯರುಗಳ ರಿಜಿಸ್ಟ್ರೇಷನ್‌ ಕಾಯಿದೆ ತಂದು ಕಾನೂನು ಮಾಡಲು ಸರ್ಕಾರ ಯೋಚಿಸುತ್ತಿತ್ತು ಈ ರೀತಿಯ ಕಾನೂನು ಜಾರಿಗೆ ಬಂದಲ್ಲಿ, ನಾನು ನನ್ನ ವೈದ್ಯಕೀಯ ವೃತ್ತಿಯನ್ನು ಮಾಡುವಂತಿರಲಿಲ್ಲ. ನನ್ನ ವೈದ್ಯಕೀಯ ಸರ್ಟಿಫಿಕೇಟ್‌ ಹೋಮಿಯೋಪತಿ ಪದ್ಧತಿಯದು. ಆಗ ರಾಜ್ಯದಲ್ಲಿ ಹೊಮಿಯೋಪತಿ ವೈದ್ಯ ಪದ್ಧತಿ ಅಂಗೀಕಾರ ಪಡೆದಿರಲಿಲ್ಲ. ಇದ್ದ ಸರ್ಕಾರಿ ಕೆಲಸವನ್ನು ಬಿಟ್ಟದ್ದಾಯಿತು. ವ್ಯಾಪಾರವನ್ನು ತ್ಯಜಿಸಿದ್ಧಾಯಿತು. ಸಾಲದ್ದಕ್ಕೆ ಮಕ್ಕಳೂ ಜಾಸ್ತಿ ಮುಂದೇನಪ್ಪ ಎಂದು ಯೋಚಿಸುತ್ತಿದ್ದು, ಭಯವಾಯಿತು- ಜೀವನೋಪಾಯಕ್ಕೆ. ಈಗಿನಂತೆ ಆಗ ಕುಟುಂಬ ಯೋಜನೆ ವ್ಯವಸ್ಥೆ ಇರಲಿಲ್ಲ.", "ನಾಗರಾಜನಿಗೆ ಇಂಜಿನಿಯರಿಂಗ್‌ ಕಾಲೇಜಿನಲ್ಲಿ ಸೀಟು ಸಿಗುವಷ್ಟು 5.5.1.0. ಯಲ್ಲಿ ಅಂಕಗಳು ಬಂದಿದ್ದವು. ನನ್ನ ಸ್ನೇಹಿತರು, ಅನೇಕರು ಅವನನ್ನು 7.೪.೮. ಹಾಗೂ ಇಂಜಿನಿಯರಿಂಗ್‌ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿಸಲು ಒತ್ತಾಯ ಮಾಡಿದರು. ೫0೦ ಗೆ ಇವನನ್ನು ಸೇರಿಸಿದರೆ, ಇನ್ನು ಎರಡು ವರ್ಷಕ್ಕೆ ಇವನ ತಮ್ಮ 5.8.1೮, ಪಾಸು ಮಾಡುತ್ತಾನೆ. ಇವರುಗಳ ವಿದ್ಯಾಭ್ಯಾಸ ಮತ್ತು ನನ್ನ ಸಂಸಾರ ನಿರ್ವಹಣೆ ಮತ್ತು ಬೆಳೆಯುತ್ತಿರುವ ಹೆಣ್ಣು ಮಕ್ಕಳ ಮುಂದಿನ ವಿವಾಹದ ಯೋಜನೆಯಾಯಿತು. ಅಲ್ಲದೆ ನಾನಿದ್ದದ್ದು ಹೈಸ್ಕೂಲು ಇಲ್ಲದ ಹಳ್ಳಿ ಹುಳಿಯಾರಿನಲ್ಲಿ. ಇದರಿಂದಾಗಿ ಇವನನ್ನು ವೈದ್ಯಕೀಯ ವ್ಯಾಸಂಗಕ್ಕೆ ಕಳುಹಿಸಲು ನಿರ್ಧರಿಸಿದೆನು. ಅವನ ವೈದ್ಯಕೀಯ ವ್ಯಾಸಂಗದಿಂದ, ಮುಂದೆ. ಸರಕಾರ ತರಲಿರುವ ವೈದ್ಯರ"], ["ರಿಜಿಸ್ಟ್ರೇಷನ್‌ ಸೌಲಭ್ಯ ಸಿಕ್ಕಿ ನನ್ನ ವೈದ್ಯಕೀಯ ವೃತ್ತಿ. ಮುಂದುವರೆಸಿಕೊಂಡು ಸಂಸಾರ ನಿರ್ವಹಿಸಬಹುದೆಂದು ಯೋಚಿಸಿ ಇವನನ್ನು ವೈದ್ಯಕೀಯ ವ್ಯಾಸಂಗಕ್ಕೆ ಕಳುಹಿಸಲು ನಿರ್ಧರಿಸಿ, ೬1/೧ ಮತ್ತೆ 1.41/5 ಗೆ ಅರ್ಜಿ ಹಾಕಿಸಿದೆನು.", "17/೧ ಕೋರ್ಸ್‌ಗೆ ಅದೇ ಕಡೇ ವರ್ಷ. ಮುಂದಿನ ವರ್ಷದಿಂದ 1/7 ೮ಂ೬5೮ ನಿಲ್ಲಿಸುವ ಸರ್ಕಾರಿ ಆದೇಶವಿತ್ತು. ಚಿ. ನಾಗರಾಜನಿಗೆ 580 ಪಾಸ್‌ ಆದಾಗ್ಗೆ 16 ವರ್ಷ ತುಂಬಿರಲಿಲ್ಲ. 16 ವರ್ಷ ಪೂರ್ತಿಯಾಗಿರಬೇಕೆಂದು ವೈದ್ಯಕೀಯ ವ್ಯಾಸಂಗಕ್ಕೆ ಸರ್ಕಾರದ ಆದೇಶವಿತ್ತು. ಇದರಿಂದ 11/೫ ಗೆ ಸೇರಲು ಇವನಿಗೆ ಇಂಟರ್‌ವ್ಯೂಗೆ ಬರಲಿಲ್ಲ. ನನ್ನ ಷಡ್ಡಕ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ತಾತ ಗುಂಡ್ಲುಪಂಡಿತರು ಮೈಸೂರು ಆಯುರ್ವೇದಿಕ್‌ ಕಾಲೇಜಿನ ಕಟ್ಟಡಕ್ಕೆ ಡೋನರ್‌ ಆಗಿದ್ದರಿಂದ ಅವನಿಗೆ ಕಡಿಮೆ ವಯಸ್ಸಾಗಿದ್ದರೂ 1.41/5 ಕೋರ್ಸಿಗೆ ಸೀಟು ಲಭಿಸಿತು. ಜೊತೆಗೆ ಅವನಿಗೆ ಮೆರಿಟ್‌ ಸಹ ಇತ್ತು", "ಈಚೆಗೆ, ನನ್ನ ಮಗ ನಾಗರಾಜನಿಗೆ ವೈದ್ಯಕೀಯ ವದ್ಯಾಭ್ಯಾಸಕ್ಕಿಂತಲೂ, ಇಂಜನಿಯರಿಂಗ್‌ ವಿದ್ಯಾಭ್ಯಾಸದಲ್ಲಿ ಹೆಚ್ಚು ಆಸಕ್ತಿ ಮತ್ತು ಉತ್ಸಾಹವಿತ್ತೆಂದೂ, ಸದರಿ ವೃತ್ತಿಯ ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ನನ್ನ ತಂದೆ ಅವಕಾಶ ಮಾಡಿ ಕೊಡಲಿಲ್ಲವೆಂದೂ ಹೇಳುತ್ತಿದ್ದನು. ಇದು ವಾಸ್ತವವೇ ಆದರೂ, ನನ್ನ ವೈದ್ಯಕೀಯ ವೃತ್ತಿಯ ಕಾನೂನಿನಂತೆ ಮುಂದುವರೆಸುವ ಅನುಕೂಲಕ್ಕಾಗಿ ಮತ್ತು ಮುಂದೆ ಇತರೆ ಮಕ್ಕಳ ವಿದ್ಯಾಭ್ಯಾಸದ ಏರ್ಪಾಡಿಗಾಗಿ ಇವನನ್ನು ಈ ವೃತ್ತಿಯ ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಕಳುಹಿಸಲಾಯಿತು. ಹೀಗೆ ನನ್ನನ್ನು ಆಕ್ಷೇಪ ಮಾಡುವ ನಾಗರಾಜ ತನ್ನ ಮಗನಾದ ಗರುಡಧ್ವಜನು 5510 ಯಲ್ಲಿ ಮೊದಲ ದರ್ಜೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾಗಿದ್ದಾಗ್ಯೂ, 7೮೮ ಮತ್ತು ಇಂಜನಿಯರಿಂಗೆ ವಿದ್ಯಾ ವ್ಯಾಸಂಗಕ್ಕೆ ಕಳುಹಿಸಲಿಲ್ಲ ಎಂಬುದನ್ನು ಅವನು ಯೋಚಿಸಬೇಕಾಗಿದೆ.", "ಮುಂದೆ, ನಾಗರಾಜನನ್ನು 1.%1/5 ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿಸಿ ನನ್ನ ಷಡ್ದಕ ಕೃಷ್ಣ ಅಯ್ಕ್ಯಂಗಾರ್‌ರವರ ಮನೆಯಲ್ಲಿ ಮೈಸೂರಿನಲ್ಲಿ ಬಿಟ್ಟಿದ್ದಾಯಿತು. ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನನ್ನ ತಂದೆ. ಮತ್ತು ಅಕ್ಕನವರ ಜೊತೆಯಲ್ಲಿದ್ದ ನನ್ನ ಹಿರಿಯ ಮಗ ನಾಗರಾಜ 551.0 ವ್ಯಾಸಂಗದ ನಂತರ ಮುಂದಿನ ವ್ಯಾಸಂಗಕ್ಕೆಂದು ಮೈಸೂರಿಗೆ ಹೋದ ನಂತರ, ಅವರೊಂದಿಗಿರಲು ನನ್ನ ಮಗ ಚಿ. ಸುಪರ್ಣನನ್ನು ನೊಣವಿನಕೆರೆಗೆ ಕರೆದುಕೊಂಡು ಬಂದು ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನವರ ಜೊತೆಯಲ್ಲಿ ವಾಸಿಸಲು ವರ್ತಾಡು ಮಾಡಿದೆನು. ಈವರೆಗೆ ಸುಪರ್ಣನು ಮೈಸೂರಿನಲ್ಲಿ ಹೈಸ್ಕೂಲ್‌ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದನು- ಬನಮಯ್ಯ ಹೈಸ್ಕೂಲಿನಲ್ಲಿ."], ["ಜಿ. ಸುಪರ್ಣ ನೊಣವಿನಕೆರೆ ಹೈಸ್ಕೂಲಿನಲ್ಲಿ 3ನೇ ವರ್ಷದ 8510 ತರಗತಿಯಲ್ಲಿ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿ 55/0 ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾದನು.", "ತುಂಕೂರಿನ ಕುಟುಂಬ ಆರಂಭ", "ನನ್ನ ತಂದೆಗೆ ಈ ವೇಳೆಗೆ 95 ವರ್ಷ ವಯಸ್ಸಾಗಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬ್ರಾಂಚ್‌ ಪೋಸ್ಟ್‌ ಮಾಸ್ಟರ್‌ ಆಗಿದ್ದರು. ಇಷ್ಟು ಇಳೀ ವಯಸ್ಸಿನಲ್ಲೂ ಅವರು ಜವಾಬ್ದಾರಿ ಸರ್ಕಾರಿ ಕೆಲಸವನ್ನು ನಿರ್ವಹಿಸುತ್ತಿರುವುದು ಸಾಧುವಲ್ಲವೆಂದು ಅರಿತು ಮತ್ತು ಈವರೆಗೆ ಅವರ ಜೊತೆಗಿದ್ದ ನಾಗರಾಜ ಮತ್ತು ಸುಪರ್ಣ ಮುಂದಿನ ವ್ಯಾಸಂಗಕ್ಕೆ ಬೇರೆ ಕಡೆಗೆ ಹೋದಾಗ್ಗೆ ಹೆಚ್ಚು ವಯಸ್ಸಾಗಿರುವ ನನ್ನ ತಂದೆಯನ್ನು ಏಕಾಂಗಿಯಾಗಿ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ಬಿಡುವುದು ಸೂಕ್ತ ಅಲ್ಲವೆಂದು ಯೋಚಿಸಿ ಬೇರೆ ಕಡೆ ವಾಸಿಸಲು ಅನುಕೂಲ ಕಲ್ಪಿಸಬೇಕಾಯಿತು.", "ನನ್ನ ಜೊತೆ ವಾಸಿಸಲು ಹುಳಿಯಾರಿಗೆ ಅವರನ್ನು ಕರೆದುಕೊಂಡು ಬರೋಣವೆಂದರೆ, ಹುಳಿಯಾರಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದ ಮನೆ ಚಿಕ್ಕದಾಗಿ 7 ಮಕ್ಕಳಿದ್ದು, ಗಲಾಟೆಯಿಂದಲೂ, ಹುಳಿಯಾರಿನಲ್ಲಿ ನಮ್ಮ ಸ್ವಜಾತಿ ಜನಗಳು ಇಲ್ಲದ್ದರಿಂದ ಅವರಿಗೆ ಬೇಜಾರಿಗೆ ಕಾರಣವಾಗಬಹುದೆಂದೂ, 580 ವ್ಯಾಸಂಗದ ನಂತರ ಹುಳಿಯಾರಿನಲ್ಲಿ ಮುಂದಿನ ವ್ಯಾಸಂಗಕ್ಕೆ ನನ್ನ ಮಕ್ಕಳಿಗೆ ಅವಕಾಶವಿಲ್ಲದ್ದರಿಂದಲೂ, ಮಕ್ಕಳ ಮುಂದಿನ ವ್ಯಾಸಂಗಕ್ಕೆ ಅನುಕೂಲಕ್ಕೂ ಮತ್ತು ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಶಾಂತಿ ಜೀವನಕ್ಕೆ ಅನುಕೂಲವಾಗಲೆಂದೂ ಯೋಚಿಸಿ, ಈ ವೇಳೆಗೆ ತುಂಕೂರಿನಲ್ಲಿ ನಾನು ಮನೆ ಕೊಂಡಿದ್ದರಿಂದ ಅವರುಗಳನ್ನು ತುಂಕೂರಿನಲ್ಲಿ ನನ್ನ ಮಕ್ಕಳ ಜೊತೆಯಲ್ಲಿ ವಾಸಿಸಲು ಅನುಕೂಲ ಮಾಡಿ (ಬಾಡಿಗೆ ಮನೆ ಮಾಡಿ), ಈವರೆಗೆ ಅವರು ಇದ್ದ ನೊಣವಿನಕೆರೆ ಸಂಸಾರನ್ನು ತುಂಕೂರಿಗೆ ಬದಲಾಯಿಸಿದ್ದಾಯಿತು. ಈಗಿನಿಂದ ನನಗೆ ಎರಡು ಕಡೆ ಸಂಸಾರ ನಿರ್ವಹಣೆಯ ಜವಾಬ್ದಾರಿ ಪ್ರಾರಂಭವಾಯಿತು.", "ನನ್ನ ತಂದೆಗೆ 25/- ರೂ. ಪೆನ್‌ಷನ್‌ ಬರುತ್ತಿತ್ತು. 2ನೇ ಮಗ ಚಿ. ಸುಪರ್ಣನನ್ನು ತುಂಕೂರು ಕಾಲೇಜಿನಲ್ಲಿ 750 ಗೆ ಸೇರಿಸಿ ನನ್ನ ತಂದೆಯ ಜೊತೆಯಲ್ಲಿ ಇರಲು ಏರ್ಪಾಡು ಮಾಡಿದೆನು. ಮಕ್ಕಳು ಹೆಚ್ಚಿನ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರುವುದೂ, ಹೆಣ್ಣು ಮಕ್ಕಳು ವಿವಾಹ ವಯಸ್ಸಿಗೆ ಸಮೀಪಿಸುತ್ತಿದ್ದದ್ಬೂ, ನನ್ನ ವರಮಾನದಲ್ಲಿ ಎರಡು ಕಡೆ ಸಂಂಸಾರನವನ್ನು ನಿರ್ವಹಿಸಬೇಕಾಗಿ ಬಂದಿದ್ದೂ. ಈ ಕಾಲದಲ್ಲಿ ನನ್ನ ಆರ್ಥಿಕ ಸ್ಥಿತಿಗೆ ಸ್ವಲ್ಪ ತೊಂದರೆಯೂ ಆಗಿ ನನ್ನ ಸ್ಥಿತಿ ಕಷ್ಟದಾಯಕವೇ ಆಯಿತು. ಇವರುಗಳ ಜೊತೆ"], ["ಮೂರನೆಯ ಮಗ ಚಿ. ಜೈರಾಂನನ್ನು ತುಂಕೂರಿಗೆ ಕಳಿಸಿ, ಸಿದ್ಧಗಂಗಾ ಹೈಸ್ಕೂಲಿಗೆ ಸೇರಿಸಿದೆನು. ಹುಳಿಯಾರಿಂದ ಪ್ರತಿದಿನ ಬಸ್ಸಿನಲ್ಲಿ ರೇಷನ್‌ ವಗೈರೆ ತುಂಕೂರಿಗೆ ಕಳುಹಿಸಿಕೊಡುತ್ತಿದ್ದೆ- ಖಾಸಗಿ ಬಸ್ಸು ಡ್ರೈವರುಗಳು ಮತ್ತು ಪರಿಚಯಸ್ಥರ ಮೂಲಕ.", "ಈ ವೇಳೆಗೆ ಮೈಸೂರಿನಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದ ಹಿರಿಯ ಮಗ ನಾಗರಾಜನಿಗೆ ಅವರ ಚಿಕ್ಕಮ್ಮ ಮನೆಯಲ್ಲಿ ಅವನನ್ನು ಇಟ್ಟುಕೊಳ್ಳಲು ಸಾಧ್ಯವಿಲ್ಲವೆಂದು ತಿಳಿಸಿದರು. ಆಗ ಜೆ. ನಾಗರಾಜ ವೈದ್ಯಕೀಯ ಕಾಲೇಜಿನಲ್ಲಿ ಕಡೆ ವರ್ಷ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದನು. ಹಿಂದೆ ಸುತ್ತೂರಿನಲ್ಲಿ ನಾನು ಸರ್ಕಾರಿ ಕೆಲಸದಲ್ಲಿದ್ದಾಗ್ಗೆ ಸುತ್ತೂರು ಮಠದ ಶಿವರಾತ್ರಿ ಸ್ವಾಮಿಗಳು ಚೆನ್ನಾಗಿ ಪರಿಚಯಸ್ಮರಾಗಿದ್ದ ಪ್ರಯುಕ್ತ. ಅವರು ಮೈಸೂರಿನ ಅವರ ಹಾಸ್ಟೆಲಿನಲ್ಲಿ ನಾಗರಾಜನು ಇರಲು ಅವಕಾಶ ಮಾಡಿಕೊಟ್ಟರು. ನಂತರ ಆರು ತಿಂಗಳು ಮಡಿಕೇರಿಯಲ್ಲಿ ಅವನು ೮1೧10೫ ೧7೯೩ಂ೮ಂ೫ ಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಸರ್ಕಾರಿ ಹಾಸ್ಟೆಲ್‌ ಸೇರಿದ್ದಾಯಿತು. ಇದರಿಂದಾಗಿ, ಒಬ್ಬನೇ ದುಡಿಮೆಗಾರನಿದ್ದ ನನಗೆ ಆರ್ಥಿಕವಾಗಿ ಹೆಚ್ಚು ಕಷ್ಟವೇ ಆದರೂ ದೈವ ಸಹಾಯದಿಂದ ಪಾರಾದೆನು.", "ನಾಗರಾಜನು ವೈದ್ಯಕೀಯ ವ್ಯಾಸಂಗ ಪೂರ್ಣಗೊಳಿಸಿ, ಅವನು ಉತ್ತಮ ಶ್ರೇಣಿಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾಗಿ ಮುಂದಿನ ೮1/೧1೦೫ 71೫71೧1೧೯ಗೆ ಹಾಗೂ 11005೮ 5ರ ೦೧ಂ ತುಂಕೂರು ಜನರಲ್‌ ಆಸ್ಪತ್ರೆಗೆ ಒಂದು ವರ್ಷ ಸೇರಿ ನನ್ನ ತಂದೆಯ ಮತ್ತು ಅಕ್ಕನವರ ಜೊತೆ ಇರಲು ತುಂಕೂರಿಗೆ ಬಂದನು. ಮಾಹೆಯಾನ ಅವನಿಗೆ ಬರುತ್ತಿದ್ದ 100/- ರೂಗಳ 800076. ನಿಂದಾಗಿ ತುಂಕೂರು ಸಂಸಾರಕ್ಕೆ ಸ್ವಲ್ಪ ಸಹಾಯ ಆಯಿತು.", "ಈ ವೇಳೆ ನನ್ನ ಹಿರಿಯ ಮಗಳು ಸೌ. ವಿನತಾ ಗರ್ಭಿಣಿಯಾಗಿ ತುಂಕೂರು ಜನರಲ್‌ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ಮೊದಲನೇ ಗಂಡು ಮಗು ಚಿ. ಶಿಂಗಣ್ಣನ ಜನನವಾಯಿತು. ಆಗ ನನ್ನ ಹಿರಿಯ ಮಗ ಡಾ. ನಾಗರಾಜ್‌ ತುಂಕೂರು ಜನರಲ್‌ ಆಸ್ಪತ್ರೆಯಲ್ಲಿ 1108೮ 501668 ಆಗಿದ್ದ. 15 ದಿನಗಳ ನಂತರ ಹುಳಿಯಾರಿನಲ್ಲಿ ನನ್ನ ಕಿರಿಯ ಮಗಳು ಸೌ. ಶೈಲಜ ಜನನವಾದಳು. ಹುಳಿಯಾರಿನಲ್ಲಿ ಒಬ್ಬ ಬಾಣಂತಿ, ತುಂಕೂರಿನಲ್ಲಿ ಒಬ್ಬ ಬಾಣಂತಿ; ಹುಳಿಯಾರಿನಲ್ಲಿ ನನ್ನ ಹೆಂಡತಿಯ ತಾಯಿ, ತುಂಕೂರಿನಲ್ಲಿ ನನ್ನ ಅಕ್ಕ ಬಾಣಂತನಗಳನ್ನು ಮಾಡಿದರು."], ["ನನ್ನ 2ನೇ ಮಗ ಸುಪರ್ಣ ನೊಣವಿನಕೆರೆಯಲ್ಲಿ ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಜೊತೆಯಲ್ಲಿದ್ದು, ಅಲ್ಲಿ 550 ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾದನು. 55೦ಯಲ್ಲಿ ಸಾಕಷ್ಟು ಅಂಕಗಳು ಬರದಿದ್ದರಿಂದ, ಅವನನ್ನು ಯಾವುದೇ ತಾಂತ್ರಿಕ ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಸೇರಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ೧೮ಂ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿಸಿ, ಆಗಲೇ ತುಂಕೂರಿನಲ್ಲಿ ನೆಲೆಸಿದ್ದ ನನ್ನ ತಂದೆಯ ಜೊತೆಯಲ್ಲಿದ್ದು ಕಾಲೇಜು ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದನು. ಫೈನಲ್‌ ೫.50ವರೆಗೆ ತುಂಕೂರಿನಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡಿ, ಫೈನಲ್‌ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಅನುತ್ತೀರ್ಣನಾದ. ಇದಕ್ಕೆ ಕೆಲವು ಕಾರಣಗಳೂ ಇವೆ. 7175 ಔ.50 ತರಗತಿವರೆಗೆ ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಮನೆಯಲ್ಲಿದ್ದ ಅವನು, ಡಿಗ್ರಿ ಕಡೆಯ ವರ್ಷ, ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನವರಿಗೆ ಕೆಲವು ರೀತಿ ಅಸಹಕಾರ ಉಂಟಾಗಿ, ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನಿಗೆ ಅವರ ಇಳಿವಯಸ್ಸಿನಲ್ಲಿ ಬೇಜಾರು ಮಾಡಿ ತೊಂದರೆ ಉಂಟು ಮಾಡಿದನು. ಈ ಇವನ ತೊಂದರೆಯಿಂದ ಬೇಜಾರಾಗಿದ್ದ ನನ್ನ ತಂದೆಗೆ ಈ ತೊಂದರೆಯನ್ನು ಪರಿಹರಿಸಲು, ತುಂಕೂರಿನಲ್ಲಿ ಇವನಿಗೆ ಬೇರೆ ಕೊಠಡಿ ವರ್ಮಾಡು ಮಾಡಿ ಪ್ರತಿದಿನವೂ ಇವನಿಗೆ ಹುಳಿಯಾಗಿನಿಂದ 52 ಮೈಲಿ ಫಾಸಲೆ ಇಂದ ಬಸ್ತಲ್ಲಿ ಊಟ, ತಿಂಡಿಗಳನ್ನು ಕಳುಹಿಸಿಕೊಡಲಾಗುತ್ತಿತ್ತು. ಇದರಿಂದಾಗಿ ಇವನ ಡಿಗ್ರಿಯಲ್ಲಿ ಕಡೆಯ ವರ್ಷ ವ್ಯಾಸಂಗಕ್ಕೆ ತೊಂದರೆಯಾಗಿ ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆ ಹೊಂದಲಿಲ್ಲ.", "ಇದಕ್ಕೆ ಕಾರಣ, ಇವನ ಅಜ್ಜಿ ಕಡಬದಿಂದ ಆಗಾಗ್ಗೆ ತುಂಕೂರಿಗೆ ಬರುತ್ತಿದ್ದು, ಇವನು ನನ್ನ ತಂದೆ ಮತ್ತು ಅಕ್ಕನ ಮೇಲೆ ಹೇಳುತ್ತಿದ್ದ ದೂರುಗಳಿಗೆ ಸರಿಯಾಗಿ ಬುದ್ಧಿವಾದ ಹೇಳದೆ. ಅವನನ್ನು ಉತ್ತೇಜಿಸಿದ್ದೇ ಕಾರಣವಾಯಿತು. ಈ ಮಕ್ಕಳನ್ನು ತಲೆಗೆ ಹಚ್ಚಿಕೊಳ್ಳದೆ, ಸಕಾಲದಲ್ಲಿ ಸರಿಯಾದ ಬುದ್ಧಿ ಹೇಳುತ್ತಿದ್ದರೆ, ಅವನ ವ್ಯಾಸಂಗ ಚೆನ್ನಾಗೇ ನಡೆಯುತ್ತಿತ್ತು", "ಇದೇ ರೀತಿ ನನ್ನ 3ನೇ ಮತ್ತು 4ನೇ ಮಕ್ಕಳಾದ ಚಿ. ಜೈರಾಂ ಮತ್ತು ಶ್ರೀಧರನಿಗೂ ಉಂಟಾಗಿ, ಅವರುಗಳ ಮುಂದಿನ ವಿದ್ಯಾ ವ್ಯಾಸಂಗಕ್ಕೂ ತೊಂದರೆಯಾಯಿತು. ಚಿ. ಸುಪರ್ಣ, ೫.50, ಕಡೇ ವರ್ಷದ ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆಯಾಗದೆ ಹುಳಿಯಾರಿಗೆ ಬಂದು ನಮ್ಮೊಡನೆ ವಾಸವಾಗಿದ್ದನು.", "ವಿನತಾ ಕುಟುಂಬದ ವಿರಸ", "ಈ ಮಧ್ಯೆ ನನ್ನ ಹಿರಿಯ ಮಗಳು ಸೌ. ವಿನತಾಗೆ 2ನೇ ಹೆರಿಗೆ ಹುಳಿಯಾರಿನಲ್ಲಾಯಿತು. ಈ ಮಧ್ಯೆ ಹಾಸನದಲ್ಲಿದ್ದ ನನ್ನ ಮಗಳಿಗೆ (ವಿನತಾಗೆ) ಅವರ ಮನೆಯಲ್ಲಿ ನಾನಾ ರೀತಿಯ ಕಿರುಕುಳದಿಂದ ಅವಳ ಮನಸ್ಸು ಸಮಾಧಾನ ಸ್ಥಿತಿಯಲ್ಲಿರದಿದ್ದರಿಂದ ಅಲ್ಲಿ ವಾಸಿಸಲು ಕಷ್ಟವಾಯಿತು. ಇವಳ ಮದುವೆ"], ["ಆಗಲಾಗಾಯಿತು, ಇವಳ ಅತ್ತೆ ಮನೆಯಲ್ಲಿ ಮೈದುನ ನಾದಿನಿಯರ ಅಸಹಾಕಾರ ಇತ್ತು. ಆಗ್ಲೆ ಆ ಮನೆಯಲ್ಲಿ ಮದುವೆ ಆಗದಿದ್ದ ಒಬ್ಬ ನಾದಿನಿ, ಶಾಂತ ಮತ್ತು ಇನ್ನೂ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದ 3 ಜನ ಮೈದುಂದಿರು ಮತ್ತು ಅತ್ತೆ ಇದ್ದರು. ಪ್ರಾರಂಭದಿಂದಲೂ ಇವರುಗಳು ಅವಳಿಗೆ ಸಹಕಾರ ಕೊಡುತ್ತಿರಲೇ ಇಲ್ಲ. ಆಗಾಗ್ಗೆ ಇವಳ ಯಜಮಾನರು ಇವಳ ಮೇಲೆ ದೂರು ಪತ್ರ ಬರೆದು ಅವಳಿಗೆ ಬುದ್ಧಿ ಹೇಳಲು ನನ್ನನ್ನು ಹಾಸನಕ್ಕೆ ಬರಲು ಕಾಗದ ಬರೆಯುತ್ತಿದ್ದರು. ಇದರಂತೆ ನಾನು ಹಾಸನಕ್ಕೆ ಹೋದರೆ, ಪತ್ನಿ ಮತ್ತು ಪತಿ ಚೆನ್ನಾಗಿಯೇ ಇರುತ್ತಿದ್ದರು. ದೂರಿನ ಕಾಗದ ಬರೆಯುತ್ತಿದ್ದ ಅವರು ನಾನು ಹಾಸನಕ್ಕೆ ಹೋದಾಗ ಮೊಖ್ತ ಯಾವುದೇ ರೀತಿಯ ದೂರುಗಳನ್ನು ಹೇಳದೆ ಸುಮ್ಮನಾಗಿರುತ್ತಿದ್ದರು.", "ನಾನು ಇವರುಗಳ ಮೌನವನ್ನು ನೋಡಿ ಊರಿಗೆ ವಾಪಸ್ಸು ಬರುತ್ತಿದ್ದೆ. ಹೀಗಿರುವಾಗ್ಗೆ ನನ್ನ ಮಗಳು ಸೌ. ವಿನತಾ, 3ನೇ ಗರ್ಭಿಣಿ, ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಎರಡು ಮಕ್ಕಳೊಡನೆ ಹುಳಿಯಾರಿಗೆ ಹೊರಟು ಬಂದಳು. ಈ ರೀತಿಯ ಇವಳ ಆಗಮನಕ್ಕೆ ನನಗೆ ಮತ್ತು ನನ್ನ ಮನೆಯಲ್ಲಿ ಎಲ್ಲರಿಗೂ ಆಶ್ಚರ್ಯವೂ, ದುಃಖವೂ ಆಯಿತು. ಇವಳ ಬಂದ ಮಾರನೇ ದಿನ ಗೋಕುಲಾಷ್ಟಮಿ ಹಬ್ಬಕ್ಕೆ ನನ್ನ ಅತ್ತೆ ಮತ್ತು ಹೆಂಡತಿ ಮಕ್ಕಳು ಸಂಭ್ರಮದಿಂದ ತಿಂಡಿಗಳನ್ನು ಮಾಡುತ್ತಿದ್ದರು. ಎಲ್ಲರಿಗೂ ಒಂದು ರೀತಿಯ ದುಃಖವೇ ಪ್ರಾಪ್ತವಾಯಿತು. ಬಂದುದಕ್ಕೆ ಕಾರಣ ಕೇಳಿದಾಗ, ನಿಮ್ಮ ಊರಿಗೆ ಹೋಗು ಎಂದು ಹೇಳಿದರು. ಬೇಜಾರಿನಿಂದ ಬಂದು ಬಿಟ್ಟೆ ಎಂದು ಹೇಳಿದಳು. ಹಬ್ಬದ ಉತ್ಸಾಹದಲ್ಲಿದ್ದ ಎಲ್ಲರಿಗೂ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ತುಂಬಾ ಬೇಜಾರಾಯಿತು. ಈಗಲೇ ಹಾಸನಕ್ಕೆ ಹೊರಟರೆ ಸಿಟ್ಟು ಜಾಸ್ತಿಯಾಗಬಹುದೆಂದು, ಸ್ವಲ್ಪ ನಿಧಾನಿಸಿ ಹೋದಲ್ಲಿ ಅವರುಗಳಿಗೆ ಸಿಟ್ಟು ಇಳಿಯಬಹುದೆಂದು ಯೋಚಿಸಿ, ಮಾರನೇ ದಿನವೇ ವಿಚಾರ ಸಂಗ್ರಹಿಸಲು ನಾನೊಬ್ಬನೇ ಹಾಸನಕ್ಕೆ ಪ್ರಯಾಣ ಮಾಡಿ ಅಳಿಯಂದಿರ ಬಳಿ ವಿಷಯ ಪ್ರಸ್ತಾಪ ಮಾಡಿದೆನು. ಅಳಿಯಂದಿರು ನನ್ನ ಮಗಳ ಮೇಲೆ ದೂರುಗಳನ್ನು ಹೇಳಿದರು. ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ಅವಳು ಸ್ವಲ್ಪ ತಪ್ಪು ಮಾಡಿದರೂ, ದಯವಿಟ್ಟು ಕ್ಟಮಿಸಿ ಬಿಡಿ ಎಂದು ಕ್ಷಮಾಪಣೆ ಕೇಳಿಕೊಂಡರೂ ಅವರು ಕ್ಷಮಿಸಲಿಲ್ಲ. ನಾಳೆ ಅವಳನ್ನು ಹಾಸನಕ್ಕೆ ಕರೆದುಕೊಂಡು ಬರುತ್ತೇನೆ ಎಂದು ಹೇಳಿದಾಗ, ಅವಳನ್ನು ಹಾಸನಕ್ಕೆ ಕರೆದುಕೊಂಡು ಬರುವುದು ಬೇಡ, ಒಂದು ವೇಳೆ ಕರೆದುಕೊಂಡು ಬಂದಲ್ಲಿ ಮನೆ ಒಳಗೆ ಸೇರಿಸುವುದಿಲ್ಲ. ಬೀದಿಯಲ್ಲಿರಬೇಕಾಗುತ್ತೆ ಎಂದರು. ಒಂದು ವೇಳೆ ಇದನ್ನು ಮೀರಿ ನಾನು ಅವಳನ್ನು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಕರೆದುಕೊಂಡು ಹೋಗಿ ಬಿಟ್ಟಲ್ಲಿ, ಅವಳು ಬೇಜಾರಿನಿಂದ ಆತ್ಮಹತ್ಯೆ ಮಾಡಿಕೊಳ್ಳುವ ಸಂದರ್ಭ ಬಂದರೂ ಬರಬಹುದೆಂದು ಯೋಚಿಸಿ, ಅವಳನ್ನು ಹಾಸನಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ ಬಿಡುವ ಆಲೋಚನೆಯನ್ನು ಬಿಟ್ಟದ್ದಾಯಿತು."], ["ಹೀಗಿರುವಾಗ ಒಂದು ವಾರದ ನಂತರ, ಅವಳ ಮೈದುನ ಕೇಶವ ಪ್ರಸಾದ್‌ ಹುಳಿಯಾರಿಗೆ ಬಂದು ಆಟವಾಡುತ್ತಿದ್ದ ಅವಳ ಹಿರಿಯ ಮಗ ಚಿ. ಶಿಂಗಣ್ವ, ಅಳುತ್ತಿದ್ದ, ಸುಮಾರು 3 ವರ್ಷದ ಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು ಹಾಸನಕ್ಕೆ ಪ್ರಯಾಣ ಮಾಡಿದನು. ಆ ಕಾಲದಲ್ಲಿ ನಾನು ವೃತ್ತಿಯ ಮೇಲೆ ಬೇರೆ ಗ್ರಾಮಕ್ಕೆ ಹೋಗಿದ್ದೆ. ಬಂದಾಗ ಮನೆಯಲ್ಲಿ ಎಲ್ಲರೂ ದುಃಖಭರಿತವಾಗಿ ಅಳುತ್ತಿದ್ದರು. ವಿಷಯ ನನಗೆ ತಿಳಿಸಿದರು. ಅವನ ಚಿಕ್ಕಪ್ಪನೇ ಬಂದು ಅವನ ತಂದೆ ಮತ್ತು ಅಜ್ಜಿ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಹೋಗಿರುವಾಗ ನೀವುಗಳು ಅಷ್ಟು ದುಃಖಪಡುವ ಕಾರಣವಿಲ್ಲವೆಂಂದು ಮನೆಯವರಿಗೆ ಸಮಾಧಾನ ಪಡಿಸಿದೆನು. ನನಗೂ ಮನಸ್ಸಿನಲ್ಲಿ ವಿಪರೀತ ದುಃಖವಿದ್ದಾಗ್ಕೂ, ಮನೆಯ ಜನಗಳಿಗೆ ಸಮಾಧಾನಪಡಿಸಿ ನನ್ನ ದುಃಖವನ್ನು ಒಳಗೇ ಇಟ್ಟುಕೊಂಡೆನು.", "ಇದರಿಂದಾಗಿ, ಅವಳ ಸಂಸಾರದ ಭಾರವೂ ನನಗೆ ಲಭಿಸಿತು. ಎರಡು ಕಡೆ ಸಂಸಾರ ನಿರ್ವಹಣೆ, ಮಕ್ಕಳು ಬೆಳೆದಿದ್ದು, ಅವರ ವಿದ್ಯಾ ವ್ಯಾಸಂಗ, ಹೆಣ್ಣು ಮಕ್ಕಳ ವಯಸ್ಸಿನಿಂದಾಗಿ, ಅವರ ವಿವಾಹದ ಏರ್ಪಾಡು ಎಲ್ಲಾ ನನ್ನ ತಲೆಗೆ ಅಂಟಿ ಈ ಕಾಲದಲ್ಲಿ ನನ್ನ ಜೀವನಕ್ಕೆ ಸ್ವಲ್ಪ ಆರ್ಥಿಕ ಸಂಕಷ್ಟವೂ ಆಯಿತು.", "ಹೊರಗಡೆ ಇವರ ಮಗಳನ್ನು ಗಂಡ ತೊರೆದಿರುತ್ತಾರೆಂಬ ಪ್ರಚಾರಕ್ಕೆ ಕಾರಣವಾಯಿತು. ಇದರಿಂದ ಮನೆಯಲ್ಲಿ ಎಲ್ಲರಿಗೂ ಬೇಜಾರು. ದುಃಖವೇ ಪ್ರಾಪ್ತವಾಗಿ ಸಂಸಾರದಲ್ಲಿ ನಿರುತ್ಸಾಹವೇ ಆಯಿತು. ಆ ಕಾರಣದಿಂದ ನನ್ನ ಮಗಳು ಸೌ. ವಿನತಾ ನಿರಾಶಳಾಗಿ, ಬೇರೆಯವರ ಮನೆಗೆ ಅರಿಶಿನ ಕುಂಕುಮಕ್ಕೂ, ಯಾವ ಸಮಾರಂಭಗಳಿಗೂ ಹೋಗುವುದನ್ನೇ ತ್ಯಜಿಸಿಬಿಟ್ಟಳು. ಇವಳ ವಿವಾಹಕ್ಕೆ ಮುಂಚೆ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಸುಖವಾಗಿ, ಹೆಚ್ಚು ಕಾರ್ಯಕಲಾಪಗಳಿಲ್ಲದೆ ಬೆಳೆದಿದ್ದ ಇವಳು ಹಾಸನದಲ್ಲಿ 7-8 ಜನಗಳ ಸಂಸಾರ ನಿರ್ವಹಣೆ ಮತ್ತು ಅವರುಗಳ ಉದಾಸೀನ ಅಸಹಾಕಾರವೇ ಇದಕ್ಕೆ ಕಾರಣವಿರಬೇಕೆಂದು ಕಾಣಿಸಿತು. ಹಾಸನದವರಿಗೆ ನಮ್ಮ ಹೊಸ ಸಂಬಂಧ ಮತ್ತು ನಮ್ಮ ಸಂಸಾರದವರ ಪರಿಚಯ ಅಷ್ಟಾಗಿ ಇಲ್ಲದಿದ್ದದ್ಬೂ ಒಂದು ಕಾರಣ. ಹೀಗಿರುವಲ್ಲಿ ನನ್ನ ಮಗಳ ಮತ್ತು ಅವಳ ಮೈನರ್‌ ಮಕ್ಕಳ ಮುಂದಿನ ಜೀವನೋಪಾಯಕ್ಕೆ ಕೋರ್ಟ್‌ ಮೂಲಕ ವ್ಯವಹರಿಸಿ ಪರಿಹಾರ ಮಾಡಿಕೊಳ್ಳಲು ನನ್ನ ಮನೆಯಲ್ಲಿ ಮತ್ತು ನನ್ನ ಆಪ್ತರಲ್ಲಿ ನನಗೆ ಒತ್ತಾಯವೇ ಆಯಿತು."], ["ಆ ರೀತಿ ವ್ಯವಹರಿಸಿದರೆ, ಅವಳ ಮುಂದಿನ ಸಂಸಾರದ ಭವಿಷ್ಯವೇ ಹಾಳಾಗಬಹುದೆಂದು, ಮುಂದೆ ಅವಳಿಗೊಂದು ದಿನ ಒಳ್ಳೆಯ ಕಾಲ ಬಂದು ಅವಳ ಸಂಸಾರ ಉತ್ತಮವಾಗಬಹುದೆಂಬ ನಂಬೆಕೆ ಇಂದಲೂ, ಆತುರವಾಗಿ ದುಡುಕುವ ಸಂದರ್ಭ ಉಚಿತವಲ್ಲವೆಂಂದು ಯೋಚಿಸಿ ಕೋರ್ಟ್‌ ವ್ಯವಹಾರಕ್ಕೆ ಅವಕಾಶ ಕೊಡಲಿಲ್ಲ. ಮುಂದೆ ಈ ಸಂಸಾರ ಉತ್ತಮವಾಗಿ, ನನ್ನ ನಿರೀಕ್ಷಣೆಗೆ ಮೀರಿ ಸುಖವಾಗಿರುವ ಅನುಭವವಾಯಿತು. ನಾನು ಈ ವಿಚಾರದಲ್ಲಿ ದುಡುಕಿ ಕೋರ್ಟ್‌ ವ್ಯವಹಾರ ಮಾಡಿದ್ದರೆ, ಅವಳ ಸಂಸಾರ ಸರಿಯಾಗುತ್ತಿರಲಿಲ್ಲ. ಹಾಸನದ ಈ ಸಂಬಂಂಧೀಕರು ಒಳ್ಳಯ ಜನ. ಬುದ್ಧಿವಂತರು. ನನ್ನ ಮಗಳ, ನಮ್ಮ ಮತ್ತು ಹಾಸನದ ಸಂಬಂಧೀಕರ ದುರಾದೃಷ್ಟವೋ ಈ ರೀತಿಯ ಘಟನೆಗೆ ಕಾರಣವಾಯಿತು.", "ತಾಳಿದವನು ಬಾಳಿಯಾನು ಎಂಬ ಆರ್ಯೋಕ್ತಿಯಂತೆ, ನನ್ನ ತಾಳ್ಮೆ ಅವಳ ಸಂಸಾರಕ್ಕೆ ಭವಿಷ್ಯ ಉತ್ತಮವಾಯಿತು. ಮುಂದೆ 12 ವರ್ಷಗಳ ಈ ಸಂಸಾರ ಒಡೆದು, ನಂತರ ಒಂದಾಗಿ, ಈಗ ಎಲ್ಲರಿಗಿಂತ ಉತ್ತಮವಾಗಿ ನಡೆಯಲು ಕಾರಣವಾಯಿತು. ಈ ರೀತಿ ಆದದ್ದಕ್ಕೆ ನಮ್ಮ ಸಂಸಾರವೇ ಅಲ್ಲದೆ. ಹಾಸನದ ಸಂಸಾರದವರೂ ಪಶ್ಚಾತ್ತಾಪ ಪಡುತ್ತಿದ್ದಾರೆ. ಈ ಸಂದರ್ಭದಲ್ಲಿ ನನ್ನ ಮಗಳು ವಿನತಾ, ಬೇಜಾರಿನಿಂದ ಕೆಲವು ವೇಳೆ ಆತ್ಮಹತ್ಯೆಗೂ ಪ್ರಯತ್ನಿಸಿದ್ದುಂಟು. 12 ವರ್ಷಗಳ ಪರ್ಯಂತ ನಿಷ್ಠೆಯಿಂದ ಇದ್ದು ನಂತರ ಸಂಸಾರ ಒಂದಾಗಿ ಎಲ್ಲರಿಗಿಂತ ಸುಖವಾಗಿ ಬಾಳುತ್ತಾ - ಒಬ್ಬ ಮಗನಿಗೆ ಹಾಗೂ ಮತ್ತೊಬ್ಬ ಮಗಳಿಗೆ ವಿವಾಹವಾಗಿ ಎರಡು. ಮೊಮ್ಮಕ್ಕಳನ್ನು ಹೊಂದಿರುತ್ತಾರೆ. ದೇವರ ದಯೆಯಿಂದ, ಹಿರಿಯರ ಆಶೀರ್ವಾದದಿಂದ, ಅವರ ನಿಷ್ಠೆಯಿಂದ. ಅವಳ ತಂದೆ ತಾಯಿಗಳಾದ ನಮ್ಮ ಸತ್ಯದಿಂದ, ತಾಳ್ಮೆಯಿಂದ ಅವಳು ಸಂಸಾರ ಸೇರಿ, ಸುಖವಾಗಿ ಬಾಳುವಂತಾಯಿತೆಂಬುದು ನನ್ನ ಅಭಿಪ್ರಾಯ.", "ನಾಗರಾಜ ಮೆಡಿಕಲ್‌ ಆಫೀಸರ್‌ ಆದದ್ದು", "ಚೆ. ನಾಗರಾಜ ತುಂಕೂರಿನಲ್ಲಿ 110058೮ 5780೧ಂ7 ಮುಗಿಸಿ, ಹುಳಿಯಾರಿಗೆ ಬಂದು ನನ್ನ ಜೊತೆಯಲ್ಲಿ ಪ್ರಾಕ್ಟೀಸ್‌ ಮಾಡಲಾರಂಭಿಸಿದನು. ಇದರಿಂದ ನನಗೆ ವೃತ್ತಿಯಲ್ಲಿ ಸ್ವಲ್ಪ ವಿಶ್ರಾಂತಿಗೆ ಅವಕಾಶವಾಯಿತು. ನನ್ನ ಮಗ ನಾಗರಾಜನ ಸಹಕಾರ ಸಾಕಷ್ಟು ಲಭಿಸಿದ್ದರೆ ಹುಳಿಯಾರಿನಲ್ಲಿ ಒಂದು ನರ್ಸಿಂಗ್‌ ಹೋಂ, ತಕ್ಕ ಸಿಬ್ಬಂದಿಯೊಡನೆ ಸ್ಥಾಪಿಸಬೇಕೆಂಬ ಅಭಿಪ್ರಾಯ ಇತ್ತು. ಇದಕ್ಕಾಗಿ ಕೆಲವು ಸಲಕರಣೆಗಳನ್ನು ಹೊಂದಿಸಿಕೊಂಡಿದ್ದೆ. ಇವನ ಸಹಕಾರ ದೊರೆಯದಿದ್ದ ಕಾರಣ, ಯೋಚನೆ ಕೈಬಿಟ್ಟಿದ್ದಾಯಿತು. ಜೆ. ನಾಗರಾಜ ತುಂಕೂರು ಬಿಟ್ಟು ಹುಳಿಯಾರಿಗೆ ಬಂದ ನಂತರ, ನನ್ನ ತಂದೆ ಮತ್ತು"], ["ಅಕ್ಕನ ಜೊತೆಯಲ್ಲಿರಲು ಚಿ. ಸುಪರ್ಣ ಮತ್ತು ಚಿ. ಜೈರಾಂನನ್ನೂ ತುಂಕೂರಿನಲ್ಲಿ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿಸಿದೆನು.", "ನನಗೆ ಶರೀರದಲ್ಲಿ ಒಂದು ರೀತಿಯ ಅಲರ್ಜಿ ತೊಂದರೆ ಇಂದ 106876॥॥ ಗೆ ತುಂಕೂರಿಗೆ ಬಂದು ಇದ್ದೆನು. ಒಂದು ದಿನ ನನ್ನ ತಂದೆಗೆ ಅಸ್ಪಸ್ಥೆಯಾಗಿ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿಸಿ, ಹುಳಿಯಾರಿಗೆ ತಿಳಿಸಿದ ನಂತರ ನನ್ನ ಮಗ ನಾಗರಾಜ ತುಂಕೂರಿಗೆ ಬಂದನು. ನಮ್ಮ ಅತ್ತೆಯೂ ಕಡಬದಿಂದ ತುಂಕೂರಿಗೆ ಬಂದರು. ನನ್ನ ತಂದೆ, 97ನೇ ವರ್ಷದಲ್ಲಿ, ನಾವುಗಳು ಜೊತೆಯಲ್ಲಿರುವಾಗ 9-6-1964 ವೈಶಾಖ ಶುದ್ಧ ಅಷ್ಟಮಿಯಂದು ತುಂಕೂರು ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ದೇವರ ಪಾದವನ್ನು ಸೇರಿದರು.", "ಎರಡು ದಿನಗಳ ಕರ್ಮವನ್ನು ತುಂಕೂರಿನಲ್ಲಿ ಮುಗಿಸಿ ಮುಂದಿನ ಕರ್ಮಕ್ಕೆ ಮೈಸೂರಿಗೆ ಪ್ರಯಾಣ ಮಾಡಿ ಅಲ್ಲಿ ಕರ್ಮಗಳನ್ನು ಪೂರೈಸಿದ್ಧಾಯಿತು. ನನ್ನ ಷಡ್ದಕ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಅವರ ತಾತ ಗುಂಡ್ಲು ಪಂಡಿತರ ಮನೆಯಲ್ಲಿ ವಾಸವಾಗಿದ್ದರು. ಗುಂಡ್ಲು ಪಂಡಿತರ ಮೊಮ್ಮಗ ಡಾ. ರಾಜನ್‌ರವರ ಭಾವ ತಿರುಮಲಾಚಾರ್‌ ಸಹಕಾರದಿಂದ ಹತ್ತು ದಿನಗಳ ಕರ್ಮವನ್ನು ಮೈಸೂರು ಮಧುವನದಲ್ಲಿ ಪೂರೈಸಿದೆವು.", "ನಾಗರಾಜು ಹುಳಿಯಾರಿಗೆ ಬಂದು ನನ್ನ ಕ್ಲಿನಿಕ್‌ ನೋಡಿಕೊಳ್ಳೂತ್ತಿದ್ದ ಕಾರಣ, ನಾನು 10 ದಿನಗಳ ದಕ್ಷಿಣ ಭಾರತ ಪ್ರವಾಸಕ್ಕೆ ಹೋಗಿಬರಲು ಅವಕಾಶವಾಯಿತು. ನನ್ನ ತಂದೆಯವರ ಮರಣಾನಂತರ ತುಂಕೂರಿನಲ್ಲಿದ್ದ ಸಂಸಾರವನ್ನು ಹುಳಿಯಾರಿಗೆ ಸ್ಥಳಾಂತರಿಸಲಾಯಿತು. ನನ್ನ ಜೊತೆಯಲ್ಲಿ ಕ್ಲಿನಿಕ್‌ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದ ನಾಗರಾಜ, ವೃತ್ತಿಯಲ್ಲಿ ಅಶ್ರದ್ಧೆ, ಉದಾಸೀನ, ನಿರುತ್ಸಾಹದಿಂದ ನನ್ನಲ್ಲಿಗೆ ಬರುತ್ತಿದ್ದ ರೋಗಿಗಳಿಗೆ ಬೇಜಾರಾಗಿ ನನ್ನ ಕ್ಲಿನಿಕ್‌ ಕೆಲಸ ಕುಂಠಿತವಾಗಿ ಆದಾಯವೂ ಕಮ್ಮಿಯಾಯಿತು. ಹುಳಿಯಾರು ಹಳ್ಳಿ ಎಂದೂ, ಇಲ್ಲಿರಲು ನನಗೆ ಇಷ್ಟಿವಿಲ್ಲವೆಂದೂ, ಪಟ್ಟಣ ಪ್ರದೇಶಕ್ಕೆ ಹೋಗಿ ವೃತ್ತಿ ಆರಂಭಿಸಬೇಕೆಂದೂ, ಚಿ. ನಾಗರಾಜ ತನ್ನ ತಾಯಿಯ ಬಳಿ ಹೇಳಿ ವೃತ್ತಿಯಲ್ಲಿ ಉದಾಸೀನ ಮಾಡಲು ಪ್ರಾರಂಭಿಸಿದನು. ಇದನ್ನು ಗಮನಿಸಿ ನನ್ನ ನರ್ಸಿಂಗ್‌ ಹೋಂ ಯೋಜನೆಯನ್ನು ಕ್ಸ ಬಿಟ್ಟು ಇವನ ಅಭಿವೃದ್ಧಿಗೆ ಕಾರಣವಾಗಬೇಕೆಂಂಬ ಉದ್ದೇಶದಿಂದ, ಅವನ ಇಚ್ಛೆಯಂತೆ ಪಟ್ಟಣ ಪ್ರದೇಶವಾದ ತಿಪ್ಪೂರಿನಲ್ಲಿ, ಜನಭರಿತವಾದ ಪ್ರದೇಶದಲ್ಲಿ ಒಂದು ಬಾಡಿಗೆ ಕಟ್ಟಡವನ್ನು ಪಡೆದು ಕ್ಲಿನಿಕ್‌ (1964) ಮತ್ತು ಕೆ.ಆರ್‌. ಎಕ್ಸ್‌ಟೆನ್‌ಷನ್‌ನಲ್ಲಿ ವಾಸಕ್ಕೆಂದು ಒಂದು ಬಾಡಿಗೆ ಮನೆ ಪಡೆದು ಸಂಸಾರ"], ["ಹೂಡಲಾಯಿತು. ಮತ್ತೆ ನನಗೆ ಎರಡು ಕಡೆ ಸಂಸಾರ ನಿರ್ವಹಣೆ ಪ್ರಾರಂಭವಾಯಿತು. ಹುಳಿಯಾರಿನಿಂದ ಪ್ರತಿದಿನ ಬಸ್ಸಿನಲ್ಲಿ ರೇಷನ್‌, ಸೌದೆ ಸಹ ಸರಬರಾಜು ಮಾಡುತ್ತಾ, ನನ್ನ ತಂದೆ ತುಂಕೂರಿನಲ್ಲಿ ಮರಣವಾದ ನಂತರ ಚಿ. ಜೈರಾಮನನ್ನು 5.8.1.0. ಕಡೇ ವರ್ಷದ ವ್ಯಾಸಂಗಕ್ಕಾಗಿ ಕಡಬದಲ್ಲಿ ನನ್ನ ಅತ್ತೆಯವರ ಬಳಿ ಬಿಟ್ಟೆನು. * ನನ್ನ ಅತ್ತೆ ಒಬ್ಬರೇ ಮನೆಯಲ್ಲಿರಾಗುವುದಿಲ್ಲವೆಂದೂ, ಜೊತೆಯಲ್ಲಿರಲು ಈ ಮೊದಲೇ ಚಿ. ಶ್ರೀಧರನನ್ನು ಕಡಬದಲ್ಲಿಟ್ಟುಕೊಂಡಿದ್ದರು. ನಾನಾಗಿಯೇ ಮಕ್ಕಳನ್ನು ಇನ್ನೊಬ್ಬರ ವಶವಾಗಿಸಲು ಕಳುಹಿಸುತ್ತಿರಲಿಲ್ಲ. ಅವರುಗಳೇ ಬಂದು ಜೊತೆಯಲ್ಲಿರಲು ಅವರ ತಾಯಿಗೆ ಹೇಳಿ ಮಕ್ಕಳನ್ನು ಕರೆದುಕೊಂಡು ಹೋಗುತ್ತಿದ್ದರು. ಮಕ್ಕಳು ಅಲ್ಲಿರುವಾಗ್ಗೆ, ನಾನು ಹಣದ ರೂಪ, ಬೇರೆ ಬೇರೆ ರೂಪಗಳಲ್ಲಿ ಅವರಿಗೆ ಸಹಾಯ ಮಾಡುತ್ತಿದ್ದೆ. ಇಷ್ಟಾದರೂ, ಕಡೆಗೆ ನಾನು ಮಕ್ಕಳನ್ನು ಸಾಕಿದೆ ಎಂದು ಮಾತನಾಡುತ್ತಿದ್ದರು.", "ಯಾರಿಗೂ ಹೇಳದೆ ಮನೆ ಬಿಟ್ಟು ಹೋದನು. ಸುಮಾರು ಆರೇಳು ತಿಂಗಳ ನಂತರ ವಾಪಸ್ಸು ಬಂದನು. ಹೀಗಾಗಿ ಒಂದು ವರ್ಷದ ಅವನ ಶಿಕ್ಷಣ ಹಾಳಾಯಿತು. ಮುಂದೆ ಅವನನ್ನು ಕಡಬದಲ್ಲಿ, 1963ರಲ್ಲಿ, ಪುನಃ 551.0ಗೆ ಸೇರಿಸಲಾಯಿತು. ಇದರಿಂದಾಗಿ ಜಯರಾಮ ಮತ್ತು ಶ್ರೀಧರ 1964ರಲ್ಲಿ ಒಟ್ಟಿಗೆ ಪರೀಕ್ಷೆ ಬರೆದರು.", "ಕಡಬದಲ್ಲಿ ಚಿ. ಜೈರಾಮ ಮತ್ತು ಶ್ರೀಧರ 561.0 ಪರೀಕ್ಷೆಯಲ್ಲಿ 1 ಭಾಗದಲ್ಲಿ 1% ಆದರು. (ಇದು... 1964ರಲ್ಲಿ... ಆಗ ಇಬ್ಬರನ್ನೂ ಹುಳಿಯಾರಿಗೆ : ಕರೆದುಕೊಂಡು ಬಂದದ್ದರಿಂದ 5001617608/77 ಪರೀಕ್ಷೆಯಲ್ಲಿ ಇಬ್ಬರೂ ತೇರ್ಗಡೆಯಾದರು. ಚಿ. ನಾಗರಾಜ, ಇವರಿಬ್ಬರಿಗೂ ಗಣಿತ ಮತ್ತು ವಿಜ್ಞಾನದ ಪಾಠ ಮಾಡಿದನು. ಅವರ ತೇರ್ಗಡೆಗೆ ಇವನ ಪಾಠವೇ ಕಾರಣ.", "ತಿಪ್ಪೂರಿನಲ್ಲಿ ಸಂಸಾರ ಪ್ರಾರಂಭಿಸಿ, ನನ್ನ ಅತ್ತೆ, ಚಿ. ನಾಗರಾಜ, ನನ್ನ ಅಕ್ಕ, ಚಿ. ಶ್ರೀಧರ, ಚಿ. ಜೈರಾಮ, ವಿನತಾ, ಅವಳ ಮಕ್ಕಳುಗಳನ್ನು ತಿಪಟೂರು ಸಂಸಾರದಲ್ಲಿಡಲಾಯಿತು. ಕೆಲವು ದಿನ ನನ್ನ ಮಗಳು ದೇವಕಿ ಸಹ ತಿಪ್ಪೂರಿನಲ್ಲಿದ್ದು ಹೈಸ್ಕೂಲ್‌ ಮೊದಲ ವರ್ಷ ಅಳ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡಿದಳು. ಜಿ. ಶ್ರೀಧರನಿಗೆ ೧೮೮ 011686ಗೆ ಸೇರಿಸಿದೆನು. ಶ್ರೀಧರನಿಗೆ ತಿಪ್ಪೂರಿನಲ್ಲಿ ಪುನಃ ತನ್ನ ಅಜ್ಜಿ ಸಹವಾಸ ಸಿಕ್ಕಿ 711೮ ವ್ಯಾಸಂಗವನ್ನು ಪೂರ್ಣಗೊಳಿಸಲಿಲ್ಲ.", "ತಿಪ್ಪೂರಿನಲ್ಲಿ ಚಿ. ನಾಗರಾಜ ತನ್ನ ವೃತ್ತಿಯನ್ನು ಅಭಿವೃದ್ಧಿ ಪಡಿಸಿಕೊಳ್ಳಲಿಲ್ಲ. ಚಿ. ಜೈರಾಮು ಮತ್ತು ಜಿ. ಶ್ರೀಧರ, ಬೆಳಗ್ಗೆ ಕ್ಲಿನಿಕ್‌ ಬಾಗಿಲು ತೆಗೆದು ಶುಚಿ ಮಾಡಿ ಕಾದು ಕುಳಿತಿದ್ದರೆ, ನಾಗರಾಜ ಉದಾಸೀನದಿಂದಲೇ ಇದ್ದು ವೃತ್ತಿ ಕುಂಠಿತವಾಯಿತು. ಅವನ ಅದೃಷ್ಟವೋ ಎಂಬಂಂತೆ ಆಗ ರಾಜ್ಯದಲ್ಲಿ"], ["ವೈದ್ಯರುಗಳ ಸಂಖ್ಯೆ ಕಮ್ಮಿಯಾಗಿ ಗ್ರಾಮಾಂತರ ಆಸ್ಪತ್ರೆಗಳಲ್ಲಿ ವೈದ್ಯರುಗಳೇ ಇಲ್ಲದಿರುವ ಕಾಲವಾಗಿತ್ತು. ಆಗ ವೈದ್ಯಕೀಯ ಇಲಾಖೆಯ ಆಡಳಿತ ನಿರ್ವಹಿಸುತ್ತಿದ್ದ, ಡಾಕ್ಟರ್‌ ನಾಗಪ್ಪ ಆಳ್ವರವರು ವೈದ್ಯರ ಕೊರತೆಯನ್ನು ನೀಗಲು ಮಿಶ್ರ ಪದ್ಧತಿ 1.805 ಮತ್ತು ೮೮1 ವೈದ್ಯರುಗಳನ್ನು ವೈದ್ಯಕೀಯ ಇಲಾಖೆಗೆ ನೇಮಿಸಿ ವೈದ್ಯರುಗಳ ಅಭಾವ ಕಮ್ಮಿ ಮಾಡುವ ಯೋಜನೆಯನ್ನು ಆರಂಭಿಸಿದರು. ಇದಕ್ಕೆ 111೮ ಯ ಪ್ರತಿಭಟನೆಯಿದ್ದರೂ, ಅದನ್ನು ಗಮನಿಸದೆ ಡಾ. ಆಳ್ವ ಈ ಯೋಜನೆಯನ್ನು ಆರಂಭಿಸಿದರು. ಇದನ್ನು ಮಿಶ್ರರ ಮೂಲಕ ಅರಿತ ನನ್ನ ಮಗ ನಾಗರಾಜ, ನನಗೆ ವಿಷಯ ತಿಳಿಯಪಡಿಸದೆ ಬೆಂಗಳೂರಿಗೆ 1೧೬೮೧ಗಗೆ ಹೋಗಿ ತಕ್ಷಣ ವೈದ್ಯಕೀಯ ಇಲಾಖೆಯಲ್ಲಿ ೩8೭ 566೧ ಆಗಿ ನೇಮಕಗೊಂಡು, ಹುಳಿಯಾರಿನ ಸಮೀಪದ ಗ್ರಾಮದ ಆಸ್ಪತ್ರೆಗೆ ನೇಮಕವಾಗಿ ಆರ್ಡರ್‌ ತೆಗೆದುಕೊಂಡು ಬಂದನು. ಇಲ್ಲಿಗೆ ಅವನ ಖಾಸಗಿ ವೈದ್ಯಕೀಯ ವೃತ್ತಿ ಕೊನೆಗೊಂಡು, ಸರ್ಕಾರಿ ವೈದ್ಯನಾಗಿ ಬಿಟ್ಟನು.", "ಜೆ. ನಾಗರಾಜ ಖಾಸಗಿ ವೈದ್ಯಕೀಯದಲ್ಲಿ ಮುಂದುವರೆಯುತ್ತಿರಲಿಲ್ಲ. ಅವನ ಅದೃಷ್ಟವೇ ಎಂಬಂತೆ ಸರ್ಕಾರಿ ಹುದ್ದೆ ಸಿಕ್ಕಿ ಅನುಕೂಲವೇ ಆಯಿತು. ಅವನ ಭವಿಷ್ಯಕ್ಕೆ ಮತ್ತು ಜೀವನೋಪಾಯಕ್ಕೆ ಖಾಸಗಿ ವೈದ್ಯ ವೃತ್ತಿಗೆ ಅವನು ತಕ್ಕವನಾಗಿರಲಿಲ್ಲ. ಅದರಲ್ಲಿ ಅವನು ಜಯಶಾಲಿಯಾಗುತ್ತಿರಲಿಲ್ಲ. ಅವನು ಹುಳಿಯಾರು ಹತ್ತಿರ ಗ್ರಾಮದ (ಹೊಯಿಸಿಲಕಟ್ಟೆ) ಆಸ್ಪತ್ರೆಗೆ ನೇಮಕವಾಗಿ ಬಂದುದು ನನ್ನ ಸಂಸಾರ ನಿರ್ವಹಣೆಗೆ ಅವನಿಂದ ಪ್ರಯೋಜನವಾಯಿತು. ಪ್ರತಿದಿನವೂ ಹುಳಿಯಾರಿನಿಂಂದಲೇ ಅವನು ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ ಬರುತ್ತಿದ್ದ- ಬಸ್ಸಿನಲ್ಲಿ.", "ಬೆಂಗಳೂರು ನೆಲೆ ಆರಂಭ", "ಈ ಮಧ್ಯೆ ನಿರುದ್ಯೋಗಿಯಾಗಿ ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದ ಜಿ. ಸುಪರ್ಣನಿಗೆ ಬೆಂಗಳೂರು 1771 7೩ಂ೬ಂ೧7 ಯಲ್ಲಿ ಕೆಲಸಕ್ಕೆ ಆರ್ಡರ್‌ ಬಂದು ಅವನು ಬೆಂಗಳೂರಿಗೆ ಪ್ರಯಾಣ ಮಾಡಿದನು. ಕೆಲವು ತಿಂಗಳುಗಳ ನಂತರ ೫೫/5 (7೦8) ಇಲಾಖೆಯಲ್ಲಿ ಅವನಿಗೆ ಕೆಲಸ ಸಿಕ್ಕಿತು. ಆಗಿನ ಕಾಲದಲ್ಲಿ 19010177 77011015 ಗೆ ಪೆನ್‌ಷೆನ್‌ ಸೌಲಭ್ಯ ಇರಲಿಲ್ಲವಾಗಿ, 76೧51೦೫ ಸೌಕರ್ಯವುಳ್ಳ ೫1/5 ಕೆಲಸಕ್ಕೆ ಹೋಗಲು ಹೇಳಿದ ಪ್ರಯುಕ್ತ 11 ೫೩ಂ೬ಂ೧7ಗೆ ರಾಜಿನಾಮೆ ಕೊಟ್ಟನು. ಈಗಿನ 88೦೬ಂ೧7 ಸೌಲಭ್ಯವನ್ನು ವೀಕ್ಷಿಸಿದರೆ 1೦೭ಂ೧7 ಕೆಲಸದಲ್ಲಿಯೇ ಮುಂದುವರೆದಿದ್ದರೆ ಅನುಕೂಲವಾಗಿರುತ್ತೆಂಬ ಕಾರಣವಿದೆ."], ["ಪ್ರಾರಂಭದಲ್ಲಿ ಅವನು (ಸುಪರ್ಣ) ನೆಹರು ನಗರದಲ್ಲಿ ಒಂದು ಬಾಡಿಗೆ ಕೊಠಡಿಯಲ್ಲಿದ್ದ. ಈಗ ಜೆ. ರಮೇಶ ಹುಳಿಯಾರಿನಲ್ಲಿ 558/0 ತೇರ್ಗಡೆಯಾದನು (1966). 5610 ಪರೀಕ್ಷೆಯಲ್ಲಿ ಸಾಕಷ್ಟು ಅಂಕಗಳನ್ನು ಪಡೆಯಲಿಲ್ಲ. ಆದ್ದರಿಂದ ಅವನನ್ನು ತಾಂತ್ರಿಕ ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಪ್ರವಶ ಪಡೆಯಲು ಅವಕಾಶವಾಗಲಿಲ್ಲ. ಬೆಂಗಳೂರಿನಲ್ಲಿ ಚಿ. ಸುಪರ್ಣನೊಂದಿಗೆ ಇದ್ದು, ರೇಣುಕಾಚಾರ್ಯ ಕಾಲೇಜಿನಲ್ಲಿ 710 ಗೆ ಸೇರಿ, ಇಬ್ಬರೂ ಅಡಿಗೆ ಮಾಡಿಕೊಂಡಿದ್ದರು.", "ಇಲ್ಲಿಗೆ ತಿಪ್ಪೂರಿನಲ್ಲಿದ್ದ ಸಂಸಾರವನ್ನು ಹುಳಿಯಾರಿಗೆ ಸ್ಥಳಾಂತರಿಸಿದ್ದಾಯಿತು. ತಿಪ್ಪೂರಿನಲ್ಲಿ ನನ್ನ ಅಕ್ಕ, ನಾಗರಾಜ, ಜೈರಾಮ, ಶ್ರೀಧರ, ದೇವಕಿ ಮತ್ತು ಅಮ್ಮಣ್ಣಿ ಮಕ್ಕಳು ಇದ್ದರು. ವಿನತಾ ತಿಪ್ಪೂರಿಗೆ ವಾಸಕ್ಕೆ ಬಂದ ನಂತರ ಅವಳ ಯಜಮಾನರು ಆಗಾಗ್ಗೆ ಹಾಸನದಿಂದ ತಿಪ್ಪೂರಿಗೆ ಬಂದು ಹೋಗುತ್ತಿದ್ದರು. ವಿನತಾ ಮತ್ತು ಮಕ್ಕಳನ್ನು ಹಾಸನಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋಗುವ ಸಮಾಚಾರ ಪ್ರಸ್ತಾಪಿಸುತ್ತಿರಲಿಲ್ಲ. ಹಾಸನದ ಅವರ ಮನೆ ಪರಿಸ್ಥಿತಿ ಅನುಕೂಲವಾಗಿರಲಿಲ್ಲವೆಂದು ಕಾಣತ್ತೆ.", "ಈ ವೇಳೆಗೆ ಸೌ. ಚೇಚಮನಿಗೆ, ಹೈಸ್ಕೂಲು ವ್ಯಾಸಂಗ ಪೂರೈಸಿ, ವಿವಾಹಕ್ಕೆ ತಕ್ಕ ವಯಸ್ಸಾಗಿತ್ತು. ನಮ್ಮ ಸ್ವಜನರ ಸಂಪರ್ಕವೇ ಇಲ್ಲದ ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದರೆ, ಅವಳಿಗೆ ವರ ಹುಡುಕಿ ವಿವಾಹಕ್ಕೆ ಸಾಧ್ಯವಿಲ್ಲದಿದ್ದುದು ಪ್ರತ್ಯಕ್ಷವಾಯಿತು.", "ಈ ಮಧ್ಯೆ ನನ್ನ ಅತ್ತೆಯವರು ಮೈಸೂರು ತನ್ನ 2ನೇ ಮಗಳ ಮನೆಯಲ್ಲಿ ದೈವಾಧೀನರಾದರು (1966). ಮಲಮಗ ಊರಲ್ಲಿದ್ದರೂ, ಅವನು ಕರ್ಮಾಧಿಗಳನ್ನು ಮಾಡಲು ಸಿದ್ಧನಿರಲಿಲ್ಲ. ಅವರಿಗೆ ದೌಹಿತ್ತ ನನ್ನ ಮಗ ನಾಗರಾಜನ ಹೆಸರಿನಲ್ಲಿ ಕರ್ಮಾದಿಗಳನ್ನು ಷಡ್ದಕ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌ ಮೈಸೂರಿನಲ್ಲಿ ಮಾಡಿದರು. ನನ್ನ ಅತ್ತೆಯವರಲ್ಲಿದ್ದ 2 ಚಿನ್ನದ ಬಳೆಗಳಲ್ಲಿ, ಒಂದು ನನ್ನ ಪತ್ನಿ, ಅವರ ಹಿರಿಯ ಮಗಳು ಅಲಮೆಲ ಮತ್ತು ಕಿರಿಯ ಮಗಳು ಪದ್ಮಮ್ಮ ಇನ್ನೊಂದು ಬಳೆ ಇಟ್ಟುಕೊಂಡರು. ನನ್ನ ಅತ್ತೆ ನನ್ನ ಸಲಹೆಗಳನ್ನು ಕೇಳಿದ್ದರೆ ಕಡಬದ ಅವರ ಆಸ್ತಿ ಮತ್ತು ಮನೆ ಪದಾರ್ಥಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳಬಹುದಿತ್ತು. ಆ ಮನೆಯಲ್ಲಿ ಎಲ್ಲಾ ಪದಾರ್ಥಗಲೂ ಇದ್ದವು. ಕಡಬದ ಮನೆಯೂ ಬೇರೆಯರಿಗೆ ಸೇರಿತು. (ಕಡಬದ ಮನೆಯನ್ನು ಚಿತ್ತಿ ಅಜ್ಜಿ, 1964ರಲ್ಲಿ 4000/- ರೂಗೆ ಮಾರಿದ್ದರು)."], ["ನನ್ನ ಸಲಹೆಯ ಮೇರೆಗೆ, ಚಿ. ಸುಪರ್ಣ, ಶೇಷಾದ್ರಿಮರಂ, ಬೆಂಗಳೂರು ಆಂಜನೇಯ ದೇವಸ್ಥಾನ 1ನೇ ಬೀದಿಯಲ್ಲಿ ಬಾಡಿಗೆ ಮನೆ ಮಾಡಿದನು. ನಮ್ಮ ಸಂಸಾರ ಬೆಂಗಳೂರಿಗೆ ಬಂದು ನೆಲೆಸಲು ಸುಪರ್ಣನ ಸಹಕಾರವೇ ಕಾರಣವಾಯಿತು. ಇದಕ್ಕೆ ಮೊದಲು ನಾವುಗಳು ಬೆಂಗಳೂರಿಗೆ ಬಂದು ನೆಲೆಸುವುದನ್ನು ಕನಸಿನಲ್ಲಿಯೂ ಕಂಡಿರಲಿಲ್ಲ. ಮೊದಲೇ ಈ ಯೋಜನೆ ಇದ್ದಿದ್ದರೆ ತುಂಕೂರಿನಲ್ಲಿ ಕೊಂಡಿದ್ದ ಮನೆಯ ಬದಲು ಬೆಂಗಳೂರಿನಲ್ಲಿಯೇ ಕೊಳ್ಳಬಹುದಿತ್ತು. ಆಗ ಬಹಲ ಕಮ್ಮಿ ಬೆಲೆಗೆ ನಿವೇಶನ, ಮನೆ ಸಿಗುತ್ತಿತ್ತು ಸುಪರ್ಣನಿಗೆ ಬೆಂಗಳೂರಲ್ಲಿ ಕೆಲಸ ಸಿಕ್ಕಿ ಅವನು ಬೆಂಗಳೂರು ವಾಸಕ್ಕೆ ಬಂದಿದ್ದೇ ನಮ್ಮ ಸಂಸಾರ ಬೆಂಗಳೂರಿಗೆ ಬಂದು ನೆಲೆಸುವುದಕ್ಕೆ ನಾಂದಿಯಾಯಿತು. ಪ್ರಾರಂಭದಲ್ಲಿ ತಿಂಗಳಿಗೆ 50/-ರೂ. ಬಾಡಿಗೆ ಮನೆಯಲ್ಲಿದ್ದು, ನಂತರ ಆಂಜನೇಯ ದೇವಸ್ಥಾನದ 2ನೇ ಬೀದಿಯಲ್ಲಿ ತಿಂಗಳಿಗೆ 75/- ರೂ. ಬಾಡಿಗೆ ಮನೆಗೆ ಬಂದು, ನಂತರ ಅದೇ ಮನೆಯ ಮುಂಭಾಗಕ್ಕೆ ಬಂದು, ತಿಂಗಳಿಗೆ 100/- ರೂ ಬಾಡಿಗೆ ಕೊಟ್ಟು 12 ವರ್ಷ ಆ ಮನೆಯಲ್ಲಿದ್ದೆವು. ಆ ಮನೆ ನಮಗೆ ಎಲ್ಲಾ ರೀತಿಯಲ್ಲೂ ಒಳ್ಳೆ ಅದೃಷ್ಟವಾಗಿದ್ದು, ಅಲ್ಲಿ ನಮ್ಮ ಸಂಸಾರಕ್ಕೆ ಉತ್ತಮವಾಗಿ ಒಳ್ಳೆಯದೇ ಆಯಿತು.", "ಪ್ರಾರಂಭದಲ್ಲಿ ನನ್ನ ಹೆಂಡತಿ, ಶೈಲಾ ಬೆಂಗಳೂರಿಗೆ ವಾಸಕ್ಕೆ ಬಂದರು. ಸುಪರ್ಣ ಮತ್ತು ರಮೇಶ ಇದ್ದರು. ಇವರ ಸಂಸಾರ ನಿರ್ವಹಣೆಗೆ ಸುಪರ್ಣನ ಸಂಬಳ ಜೊತೆಗೆ, ನಾನು ಆರ್ಥಿಕ ಮತ್ತು ಪದಾರ್ಥಗಳ ಸಹಾಯ ಮಾಡುತ್ತಾ ತಿಂಗಳೊಂದಕ್ಕೆ ಹುಳಿಯಾರಿನಿಂದ ನಾನು ಬಂದು ಹೋಗುತ್ತಿದ್ದೆ. ತಿಪ್ಪೂರು ಸಂಸಾರ ಬಿಟ್ಟು ಉಳಿದವರೆಲ್ಲರೂ ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದೆವು. ಈ ಕಾಲದಲ್ಲಿ ನನ್ನ ಸಂಸಾರ ನಿರ್ವಹಣೆಗೆ ಚಿ. ಸುಪರ್ಣ ಮತ್ತು ಚಿ. ನಾಗರಾಜನ ಸಂಬಳದ ಸಹಾಯ ಮತ್ತು ಅವರ ಸಹಕಾರ ನನಗೆ ಹೆಚ್ಚು ಉಪಯುಕ್ತವಾಯಿತು.", "ಮುಂದೆ ನಾಗರಾಜನಿಗೆ ಹುಳಿಯಾರು ಹತ್ತಿರದ ಸ್ಥಳದಿಂದ ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆ ಹರಿದ್ರಾವತಿ ಎಂಬ ಗ್ರಾಮಕ್ಕೆ ವರ್ಗವಾಗಿ ಅವನು ಅಲ್ಲಿಗೆ ಪ್ರಯಾಣ ಮಾಡಿದನು. ಕೆಲವು ತಿಂಗಳುಗಳ ನಂತರ ನಾಗರಾಜನಿಗೆ ಬೆಂಗಳೂರು ಹತ್ತಿರದ ಗೊಟ್ಟಿಗೆರೆಗೆ (ಬನ್ನೇರುಘಟ್ಟ ರಸ್ತೆಯಲ್ಲಿರುವ) ವರ್ಗವಾಗಿ ಬೆಂಗಳೂರಿನಲ್ಲಿಯೇ ವಾಸಿಸುತ್ತಾ ಇದ್ದನು. ಈಗ ಬೆಂಗಳೂರಿನ ಸಂಸಾರಕ್ಕೆ ಸುಪರ್ಣನ ಮತ್ತು ನಾಗರಾಜನ ಸಹಕಾರ ಮತ್ತು ನೆರವು ಸಿಕ್ಕಿ ನನಗೆ ಅನುಕೂಲವಾಯಿತು. ಇದರಿಂದಾಗಿ ಬೆಂಗಳೂರಿಗೆ ವಿನತಾ, ಅವಳ ಮಕ್ಕಳು ಮತ್ತು ನನ್ನ ಮಗಳು ನಳಿನಿಯನ್ನು ಕಳಿಸಿಕೊಟ್ಟು, ನನ್ನ ಅಕ್ಕ, ಜೇಚಮ್ಮ ಮತ್ತು ದೇವಕಿ ಮಾತ್ರ ಹುಳಿಯಾರಿನಲ್ಲಿ ಉಳಿದುಕೊಂಡೆವು."], ["ಚೇಚಮ್ಮನಿಗೆ ವಿವಾಹಕ್ಕೆ ಉದ್ದೇಶಿಸಿ ಅವಳನ್ನೂ ಬೆಂಗಳೂರಿಗೆ ಕಳಿಸಿಕೊಟ್ಟೆನು. ಮುಂದೆ ದೇವಕಿಗೆ ಹುಳಿಯಾರಿನಲ್ಲಿ 5510 ಪಾಸಾಗಿ ಮುಂದಿನ ವ್ಯಾಸಂಗಕ್ಕೆ ಬೆಂಗಳೂರಿಗೆ ಕಳುಹಿಸಿದ್ದಾಯಿತು. ನನ್ನ ಅಕ್ಕ ಸಹ ಬೆಂಗಳೂರಿಗೆ ಬಂದರು. ಇದರಿಂದ ನನ್ನ ಒಬ್ಬನ ಹೊರತು ನನ್ನ ಸಂಸಾರದ ಎಲ್ಲರೂ ಬೆಂಗಳೂರಿಗೆ ಬಂಂದದ್ದಾಯಿತು. ಈ ಮಧ್ಯೆ ಜೈರಾಂಗೆ ಕೆಜಿಎಫ್‌ 71/1೧1೧ 70107160010 ನಲ್ಲಿ ಡಿಪ್ಲೋಮ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೀಟು ಸಿಕ್ಕಿ (1964) ವ್ಯಾಸಂಗಕ್ಕೆ ಕೆಜಿಎಫ್‌ಗೆ ಕಳುಹಿಸಿಕೊಟ್ಟೆನು. ಅಲ್ಲಿ ಅವನು ಸರಿಯಾಗಿ ವ್ಯಾಸಂಗ ಮುಂದುವರೆಸದೆ ದೇಶಾಂತರ ಹೊರಟುಬಿಟ್ಟನು (1964ರ ಕೊನೆಯಲ್ಲಿ). ಈ ದೇಶಾಂತರದಿಂದ ಅವನ ವ್ಯಾಸಂಗಕ್ಕೆ ಕುಂಠಿತವಾದರೂ, ದೇಶಾಂತರದಲ್ಲಿ ಉತ್ತರ ಭಾರತದ ಪರಚಯವಾಗಿ, ಕಷ್ಟ ಸುಖಗಳ ಅರಿವಿಗೆ ಚೆನ್ನಾಗಿ ತಿಳಿದು ಪ್ರಯೋಜನವೇ ಆಯಿತು. ನಂತರ ಸಕಾಲಕ್ಕೆ ಅವನು ಬೆಂಗಳೂರಿಗೆ ಬಂದು (1967 ಮಾರ್ಚ್‌-ಏಪ್ರಿಲ್‌) ಪ್ರಾರಂಭದಲ್ಲಿ ಖೋಡೆ ಸಂಸ್ಥೆಯಲ್ಲಿ ಸಣ್ಣ ಕೆಲಸಕ್ಕೆ ಸೇರಿ, ಅತ್ಯಲ್ಪ ಸಂಬಳ ಪಡೆಯುತ್ತಿದ್ದನು. ನಂತರ ಬೆಂಗಳೂರಿನ ವಿದ್ಯುಚ್ಛಕ್ತಿ ಇಲಾಖೆಯಲ್ಲಿ ಬೆಂಗಳೂರಿನಲ್ಲಿಯೇ ಕೆಲಸ ಸಿಕ್ಕಿ ಕಷ್ಟಗಳನ್ನು ಅನುಭವಿಸುತ್ತಿದ್ದ ಅವನಿಗೆ ಭವಿಷ್ಯದಲ್ಲಿ ಒಳ್ಳೆಯದೇ ಆಯಿತು.", "ನನ್ನ ಮಗ ಶ್ರೀಧರನಿಗೆ ಬೆಂಗಳೂರಿನ ೫೮೫೫ ನಲ್ಲಿ 171 ಕೋರ್ಸಿಗೆ ಸೇರಿಸಿದ್ದು (1967) ಅಲ್ಲಿ ಸರಿಯಾದ ಸ್ನೇಹಿತರು ಸಿಕ್ಕದೆ, ಸದ್ರಿ ಕೋರ್ಸನ್ನು ಬಿಟ್ಟು ಹೊರಟು ಹೋದ (1968). ಇವನು ಸಕಾಲಕ್ಕೆ ಹಿಂತಿರುಗಿದ್ದರೆ, ಇವನಿಗೂ ಅನುಕೂಲವೇ ಆಗುತ್ತಿತ್ತು. ಹಿಂತಿರುಗಲಿಲ್ಲ. (ಇವನು ಹಿಂತಿರುಗಿದ್ದು 1973ರಲ್ಲಿ).", "ಚೇಚಮ್ಮ (ಸರಳ) ಮದುವೆ", "ನನ್ನ ಹೆಂಡತಿ, ಚೇಚಮನಿಗೆ ವರಾನ್ವೇಷಣೆಗೆ ತುಂಬಾ ಕಷ್ಟಪಟ್ಟಳು. ಆಗ ನಮಗೆ ಬೆಂಗಳೂರು ಇನ್ನೂ ಹೊಸದು. ಆಗ್ಲೆ ಬೆಂಗಳೂರಿನಲ್ಲಿ ಆಗ ರಮೇಶ ರೇಣುಕಾಚಾರ್ಯ ಕಾಲೇಜಿನಲ್ಲಿ, ದೇವಕಿ ಮಹಾರಾಣಿ ಕಾಲೇಜಿನಲ್ಲಿ ಡಿಗ್ರಿ ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡುತ್ತಿದ್ದರು. ನಳಿನಿ ಮತ್ತು ಶೈಲಾ ಶೇಷಾದ್ರಿಪುರಂ ಹೈಸ್ಕೂಲಿನಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದರು. ಈ ಮಧ್ಯೆ ನಾಗರಾಜನ ವಿವಾಹಕ್ಕೆ ಅನೇಕ ಕಡೆಗಳಿಂದ ಉತ್ತಮ ಬಾಂಧವ್ಯದಿಂದ ಹೆಣ್ಣು ಮಕ್ಕಳು ಬಂದಿದ್ದರು. ಮನೆಯಲ್ಲಿ ಜೇಚಮ್ಮ ವಿವಾಹಕ್ಕಿರುವಾಗ, ಅವಳ ವಿವಾಹದ ನಂತರ ಅವನ ವಿವಾಹಕ್ಕೆ ಏರ್ಪಾಡು ಮಾಡುತ್ತೇನೆಂದು ಹೇಳಿ ಕಳಿಹಿಸುತ್ತಿದ್ದೆ."], ["ನನ್ನ ಅಳಿಯಂದಿರು ಶ್ರೀ ರಂಗಧಾಮ, ಅವರ ಆಪ್ತ ಸ್ನೇಹಿತ ಶ್ರೀ ಕೇಶವಮೂರ್ತಿಯವರು ಆಗ ಶೇಷಾದ್ರಿಪುರದಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದರು. ಅವರ ತಾಯಿ, ಅಲಮೇಲಳಿಗೆ ಚೆನ್ನಾಗಿ ಪರಿಚಯವಿತ್ತು ಈ ಕಾರಣದಿಂದಾಗಿ ಶ್ರೀ ರಂಗಧಾಮ ವಿವಾಹಕ್ಕೆ ಇರುವ ವರ ಎಂದು ತಿಳಿದು, ಅವರು ವಾಸವಾಗಿದದ್ದ ಬಳೇಪೇಟೆಯಲ್ಲಿದ್ದ ಶ್ರೀ ಬಾಬಣ್ಣನವರ ಮನೆಗೆ ಹೋಗಿ ಚೇಚಮ್ಮನ ವಿವಾಹದ ಏರ್ಪಾಡುನ್ನು ಅಲಮೇಲ ಮಾಡಿದ್ದಳು. ಶ್ರೀ ಬಾಬಣ್ಣನವರೂ ಹಾಸನದ ಕಡೆಯವರೇ ಆಗಿದ್ದು, ನನ್ನ ಹಿರಿಯ ಹಾಸನದ ಅಳಿಯಂದಿರು ಅವರಿಗೆ ಪರಿಚಯ ಚೆನ್ನಾಗಿತ್ತು. ಹಿರಿಯ ಮಗಳನ್ನು ಪತಿ ಬಿಟ್ಟು ಬಿಟ್ಟರುತ್ತಾರೆಂಬ ಸಂಶಯ ಅವರಿಗೆ ಬಂದಿತ್ತು.", "ಆ ವೇಳೆಗೆ ನನ್ನ ಹಿರಿಯ ಮಗಳು ವಿನತಾ ಮತ್ತು ಮಕ್ಕಳು ಬೆಂಗಳೂರಿನಲ್ಲಿ ನನ್ನ ಮನೆಯಲ್ಲಿ ವಾಸವಾಗಿದ್ದರು. ಹಾಸನದಿಂದ ಆಗಾಗ್ಗೆ ನನ್ನ ಅಳಿಯಂದಿರು ಬೆಂಗಳೂರು ಮನೆಗೆ ಬರುತ್ತಿದ್ದರು. * ಈ ರೀತಿಯ ಸಂಶಯ ಮತ್ತು ಅಪಪ್ರಚಾರಕ್ಕೆ ಅವಕಾಶವಿಲ್ಲವೆಂದು ಶ್ರೀ ಬಾಬಣ್ಣ ಮತ್ತು ಶ್ರೀ ರಂಗಧಾಮ", "1968ರ ಸುಮಾರಿಗೆ ಅಮ್ಮಣ್ಣಿ, ರಾಂಜೀ ಮತ್ತು ಜಯತ್ರೀ ಕರೆದುಕೊಂಡು ಹುಳಿಯಾರಿನಿಂದ ಬೆಂಗಳೂರಿನ ಮನೆಗೆ ಬಂದಳು. ರಾಂಜೀ. ಶೇಷಾದ್ರಿಪುರದ ಕಾನ್ದೆಂಟಿನಲ್ಲಿ ನರ್ಸರಿಗೆ ಮತ್ತು ಜಯಶ್ರೀ ಪೈಪ್‌ಲೈನ್‌ನಲ್ಲಿದ್ದ ಅಂಬುಜಮ್ಮನವರ ಸ್ಕೂಲಿಗೆ ಸೇರಿಕೊಂಡರು. ಮುಂದೆ, ಮನೆ ಚಿಕ್ಕದ್ದಾದ್ದರಿಂದ ರಾಜು ಅತ್ತಂಬಿ, ಅಮ್ಮಣ್ಣಿ ಮತ್ತು ಮಕ್ಕಳನ್ನು ಮೈಸೂರಿಗೆ ಸ್ಥಳಾಂತರಿಸಿದ್ದರು. ಅಮ್ಮಣ್ಣಿ ಪದ್ದಕ್ಕ ಮನೆಯ ಪಕ್ಕದ ಮನೆಯಲ್ಲಿ ಬೇರೆಯಾಗೇ ಇದ್ದಳು. ಬಹುಶಃ 1973-74ರಲ್ಲಿ ಅವಳ ಕುಟುಂಬ ಹಾಸನದಲ್ಲಿ ನೆಲೆಸಿತು.", "ಅವರಿಗೆ ಹೇಳಿದ ಮೇಲೆ, ಹಾಸನದಲ್ಲಿ ನನ್ನ ಹಿರಿಯ ಅಳಿಯಂದಿರನ್ನೇ ಅವರು ಮೊಖ್ತಾ ನೋಡಿ ಅವರಿಂದ ಯಾವ ಆಪಾದನೆಗಳೂ, ನಮ್ಮ ಮತ್ತು ನನ್ನ ಮಗಳ ಮೇಲೆ (ಇಲ್ಲವೆಂದು) ತಿಳಿದ ನಂತರದ, ಚೇಚಮ್ಮನನ್ನು ವಿವಾಹವಾಗಲು ಸಮ್ಮತಿ ಸೂಚಿಸಿದರು.", "ನನ್ನ ಹಿರಿಯ ಮಗಳು ನಮ್ಮ ಮನೆಯಲ್ಲಿದ್ದ ಕಾರಣ, ಚೇಚಮ್ಮನಿಗೆ ವರ ಹುಡುಕಲು, ನನ್ನ ಹೆಂಡತಿಗೆ ತುಂಬಾ ಶ್ರಮವೇ ಆಯಿತು. ಎಲ್ಲಾ ಚೆನ್ನಾಗಿ ಪರಿಶೀಲಿಸಿ ಯಾವುದೇ ರೀತಿಯ ವಾಸ್ತವ ಆಪಾದನೆಗಳಿಲಿಲ್ಲವೆಂದು ತಿಳಿದ ಮೇಲೆ ಶ್ರೀ ಬಾಬಣ್ಣನವರು ಮತ್ತು ಶ್ರೀ ರಂಗಧಾಮ ಈ ವಿವಾಹಕ್ಕೆ ತಮ್ಮ ಸಮ್ಮತಿ ಸೂಚಿಸಿದರು.", "ಶ್ರೀ ರಂಗಧಾಮರವರ ಒಬ್ಬರೇ ಆದ ಸಹೋದರಿ ಸಿಕಂದರಾಬಾದಿನಲ್ಲಿರುವುದರಿಂದ, ಅಲ್ಲಿಗೆ ಸೌ. ಜೇಚಮ್ಮನನ್ನು ಕರೆದುಕೊಂಡು ಹೋಗಿ ತೋರಿಸಿ ಅವರ ಒಪ್ಪಿಗೆ ಪಡೆಯಲು ಹೇಳಿದ್ದರಿಂದ,"], ["ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದ ನನಗೆ ತಿಳಿಯಪಡಿಸದೆ, ಆಲಮೇಲ, ಚೇಚಮ್ಮ ನಾಗರಾಜ ಮತ್ತೊಬ್ಬರೊಡನೆ ಸಿಕಂದರಾಬಾದಿಗೆ ಹೋಗಿ ಅವರ ಒಪ್ಪಿಗೆ ಪಡೆದ ನಂತರ ಅಲ್ಲಿಯೇ ೮6೧೩860700! ಪೂರೈಸಿ ಒಪ್ಪಿಗೆಯಾಗಿ ನನಗೆ ತಿಳಿಯಪಡಿಸಿದ ನಂತರ ವಿವಾಹದ ಮುಂದಿನ ಏರ್ಪಾಡಿಗೆ ನನಗೆ ತಿಳಿಸಿದರು. ಈ ವಿವಾಹಕ್ಕಾಗಿ ಕಡಬದಲ್ಲಿದ್ದ ನನ್ನ ಅಕ್ಕನ ಬಾಬ್ತು ಗದ್ದೆಯನ್ನು ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟು ಏರ್ದಾಡು ಮಾಡಿದೆನು. ಎವಾಹಕ್ಕಾಗಿ ಬ್ಯಾಂಕಿನಲ್ಲಿ ಹಣ ಇಡುವ ಬದಲು ಆಸ್ತಿ ರೂಪದಲ್ಲಿ ಹಣ ಇಡಲಾಗಿತ್ತು.", "ಶೀ ರಂಗಧಾಮ ಬೇಲೂರು ಸ್ಥಳವಂದಿಗರಾಗಿ ಕೌಶಿಕ ಗೋತ್ರದ ವಡಗಲೆ ಸಂಪ್ರದಾಯದ ಶ್ರೀ ಮೆಳಗೋಡು ರಂಗಸ್ವಾಮಿ ಅಯ್ಕಂಗಾರ್‌ರವರ ಏಕ ಮಾತ್ರ ಪುತ್ರ. ಇವರ ತಂದೆ ತಾಯಿಗಳಿಬ್ಬರೂ ಮೊದಲೇ ಮೃತರಾಗಿದ್ದು. ಒಬ್ಬ ಸಹೋದರಿ ಸಿಕಂದರಾಬಾದಿನಲ್ಲಿದ್ದರು. ದೂರದ ಸಂಬಂಧೀಕರಾದ ಹಾಸನದ ಲಾಯರ್‌ ಅಳಸಿಂಗಾಚಾರ್‌ ಅವರ ಮನೆಯಲ್ಲಿದ್ದು ವ್ಯಾಸಂಗ ಮಾಡಿ, ಎಲೆಕ್ಟಿಕಲ್‌ ಡಿಪ್ಲೊಮೊ ಪಡೆದು, ಬೆಂಗಳೂರು 11/7 7೦೭ಂ೧' ಯಲ್ಲಿ *8೮ಏ೮೧15೮೯ ಆಗಿದ್ದು, ಈಗಳೂ ಅದೇ ಫ್ಯಾಕ್ಟಿಯಲ್ಲಿ ಅದೇ ಹುದ್ದೆಯಲ್ಲಿದ್ದಾರೆ. ದೂರದ ಸಂಬಂಧಿ ಬೆಂಗಳೂರು ಬಳೇಪೇಟೆಯಲ್ಲಿ ಶ್ರೀ ಬಾಬಣ್ಣನವರ ಮನೆಯಲ್ಲಿ ವಾಸವಾಗಿದ್ದರು. ಬೆಂಗಳೂರು ಶೇಷಾದ್ರಿಪುರದ ಮುಖ್ಯರಸ್ತೆಯಲ್ಲಿರುವ ತಿಮ್ಮಯ್ಯ ಚನ್ನಮ್ಮ ಕಲ್ಯಾಣ ಮಂಟಪದಲ್ಲಿ, ಸಾಧಾರಣ ನಾಮ ಸಂವತ್ಸರದ, ವೈಶಾಖ ಶುದ್ಧ ಏಕಾದಶಿ ಭಾನುವಾರ, 17.51970ರಂದು ವಿವಾಹ ಮಾಡಿಕೊಟ್ಟೆನು. ಇವರ ಎಲ್ಲಾ ಬಂಧು ಬಳಗದವರು ಹಾಸನದವರೇ ಆಗಿದ್ದು, ನನ್ನ ಹಿರಿಯ ಅಳಿಯಂದಿರ ಪರಿಚಯದವರೇ ಆಗಿದ್ದರು. ಆಗ್ಲೆ ನನ್ನ ಹಿರಿಯ ಮಗಳು ನನ್ನ ಮನೆಯಲ್ಲಿಯೇ ಇದ್ದಳು.", "ಈ ವಿವಾಹಕ್ಕೆ ಹಿರಿಯ ಅಳಿಯಂದಿರು ಬರುತ್ತಾರೋ ಇಲ್ಲವೋ ಎಂಬ ಕುತೂಹಲದಿಂದ ಅವರುಗಳೆಲ್ಲರೂ ಕಾತುರರಾಗೇ ಇದ್ದರು. ವಿವಾಹದ ಹಿಂದಿನ ದಿನ ಯಾವುದೋ ಕಾಯನರ್ನನಿಮಿತ್ತವಾಗಿ ನನ್ನ ಹಿರಿಯ ಅಳಿಯಂದಿರು ಹಾಸನದಿಂದ ಬೆಂಗಳೂರಿಗೆ ಬರಲಾಗಲಿಲ್ಲ. ವಿವಾಹದ ದಿನ ಬೆಳಗ್ಗೆ ಮುಹೂರ್ತದ ವೇಳೆಗೆ ನನ್ನ ಹಿರಿಯ ಅಳಿಯಂದಿರು ಬೆಂಗಳೂರಿಗೆ ಬಂದರು. ಈವರೆಗೆ ಅವರ ಆಗಮನ ನಿರೀಕ್ಷಿಸುತ್ತಿದ್ದ ಶ್ರೀ ರಂಗಧಾಮ ಅವರ ಬಂಧುಗಳಿಗೆ ಅತ್ಯಾಶ್ಚರ್ಯವಾಗಿ ಈವರೆಗೆ ನನ್ನ ಮಗಳ ಮೇಲೆ ಇದ್ದ ಸುಳ್ಳು ಆಪಾದನೆಗಳೆಲ್ಲಾ ಹೋಗಿ ಈ ಅಪಪ್ರಚಾರ ಆಗದಿರುವವರು ಹಜ್ಬಿಸಿರುವ ವದಂತಿ ಎಂದು ಎಲ್ಲರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಎಲ್ಲಾ ಆಪಾದನೆಗಳೂ ಬುಡವಿಲ್ಲದ್ದೆಂದು ತಿಳಿದು ನಮಗೂ ಸಂತೋಷವೇ ಆಯಿತು."], ["ಶ್ರೀ ರಂಗಧಾಮರವರು ತಮ್ಮ ಮದುವೆಯ ನಂತರ, ನಮ್ಮ ವಾಸದ ಮನೆಗೆ ಹತ್ತಿರವಾಗಿ ಕುಮಾರಾಪಾರ್ಕ್‌ನಲ್ಲಿ ಚಿಕ್ಕ ಮನೆಯೊಂದನ್ನು ಬಾಡಿಗೆಗೆ ಪಡೆದು ಸಂಸಾರ ಪ್ರಾರಂಭಿಸಿದರು. ಆಗ್ಲೆ ಸಂಸಾರಕ್ಕೆ ಬೇಕಾದ ಪಾತ್ರೆ ವಗೈರೆ ಸಾಮಾನುಗಳನ್ನು ಕೊಡಲಾಯಿತು. ಇವರಿಗೆ ಪಿತ್ರಾರ್ಜಿತವಾಗಿ ಬೇಲೂರಿನಲ್ಲಿ ಒಂದು ಮನೆ ಮಾತ್ರ ಇತ್ತು. ಬೆಂಗಳೂರು ೫68! ೦8 ೮೧ಂ14 8೫0೩6 ನಲ್ಲಿ ಒಂದು ಸೈಟ್‌ ಸಹ ಇವರು ಕೊಂಡಿದ್ದರು. ಇವರಿಗೆ ಇಬ್ಬರು ಪುತ್ರಿಯರಾಗಿದ್ದು, ಬೆಂಗಳೂರು ಮರಿಯಪ್ಪನ ಪಾಳ್ಯದಲ್ಲಿ ಎರಡು ಅಂತಶಸ್ತಿನ ಮನೆ ಕಟ್ಟಿ ಬೇಕಾದ ಎಲ್ಲಾ ಸೌಲಭ್ಯಗಳನ್ನು ಪಡೆದಿದ್ದಾರೆ.", "ನನ್ನ ಮಗಳು ಜೇಚಮ್ಮ ವಿವಾಹದ ನಂತರ, ಆಕೆಯ ಬುದ್ಧಿವಂತಿಕೆಯಿಂದ ಮನೆ ವಗೈರೆ ಎಲ್ಲಾ ಸೌಕರ್ಯಗಳನ್ನು ಹೊಂದಿಸಿ ಸುಖವಾಗಿಯೇ ಬಾಳಿವೆ ನಡೆಸುತ್ತಿದ್ದಾರೆ.", "(2ನೇ ಪುಸ್ತಕದಲ್ಲಿ ಮುಂದುವರೆದಿದೆ)", "ನನ್ನ ಎರಡನೇ ಮಗಳು ಸೌ. ಚೇಚಮ್ಮ (ಸರಳ) ಇವಳ ವಿವಾಹದ ನಂತರದ ವಿಷಯಗಳು ಈ ಹಿಂದಿನ ಪುಸ್ತಕದಿಂದ ಮುಂದುವರೆಯಲಟಲ್ಲಟ್ಟಿದೆ.", "ಭಾಗ: 2", "ನಾಗರಾಜನ ಮದುವೆ", "ನನ್ನ 2ನೇ ಮಗಳ ವಿವಾಹದ ನಂತರ, ಮೊದಲನೆ ಮಗ ಚಿ. ನಾಗರಾಜನ ವಿವಾಹಕ್ಕೆ ಪ್ರಯತ್ನಿಸಲಾಯಿತು. ಚಿ. ನಾಗರಾಜ ವಿವಾಹದ ವಯಸ್ಕನಾಗಿ, ಸರ್ಕಾರದಲ್ಲಿ ವೈದ್ಯಕೀಯ ಇಲಾಖೆಯಲ್ಲಿ ನೇಮಕಗೊಂಡು ಸ್ವಸಂಪಾದನೆಯುಳ್ಳವನಾಗಿದ್ದು, ಅವನಿಗೆ ಆದಷ್ಟು ಶೀಘ್ರ ವಿವಾಹ ಮಾಡಬೇಕೆಂಬ ಉದ್ದಿಶ್ಶವಿತ್ತು 2ನೇ ಮಗಳ ವಿವಾಹಕ್ಕಾಗಿ ಕಾಯುತ್ತಿದ್ದುದು, ಅವಳ ವಿವಾಹವೂ ನಡೆದಿತ್ತು. ಈ ವೇಳೆಗೆ ಇವನ ವಿವಾಹಕ್ಕೆ ಅನೇಕ ಕಡೆಗಳಿಂದ ಕನ್ಯಾಗಳು ಬಂದಿತ್ತು ಶ್ರೀ ಬಾಬಣ್ಣನವರ ಸಹೋದರಿ ರುಕ್ಕಮ್ಮ ಅವರ ಪತಿ ಸುದರ್ಶನ ನಮ್ಮಲ್ಲಿಗೆ ಬಂದು, ತಮ್ಮ ಏಕಮಾತ್ರ ಪುತ್ರಿ ಸೌ. ಹೇಮಅತಾಳನ್ನು ಚಿ. ನಾಗರಾಜನಿಗೆ ಕೊಟ್ಟು ವಿವಾಹ ಮಾಡಲು ಪ್ರಸ್ತಾಪಿಸಿದರು. ನನ್ನ 2ನೇ ಮಗಳು ಜೇಚಮ್ಮನಿಗೆ ಅನೇಕ ಕಡೆ ವರಾನ್ವೇಷಣೆಗಾಗಿ ಹೋಗಿ ಕಡೆಗೆ ಅವಳ ವಿವಾಹಕ್ಕೆ ತಮ್ಮ ಆಶ್ರಮದಲ್ಲಿದ್ದ ಶ್ರೀ ರಂಗಧಾಮರವರನ್ನು ಪರಿಚಯಿಸಿ ಸಹಾಯ ಮಾಡಿದ್ದ ಶ್ರೀ ಬಾಬಣ್ಣನವರೂ ಬಂದು ಪಸ್ತಾಪ ಮಾಡಿದರು. ನಮಗೆ ಒಂದು"], ["ರೀತಿಯಲ್ಲಿ ಉಪಕಾರ ಮಾಡಿದವರನ್ನು ಮರೆಯದೆ ಪ್ರತ್ಯುಪಕಾರ ಮಾಡುವುದು ಮುನುಷ್ಯತ್ವ ಎಂದು ಅರಿತು ಮತ್ತು ಇವರ ಬಂಧುಗಳಾದ ಶ್ರೀ ಸುದರ್ಶನ ಉತ್ತಮ ವಂಶೀಕರೆಂದು ನಂಬಿ ಈ ವಿವಾಹಕ್ಕೆ ಒಪ್ಪಿಗೆ ಕೊಟ್ಟದ್ಧಾಯಿತು.", "ಈ ಮೊದಲೇ ಚೇಚಮ್ಮನ ವಿವಾಹದಲ್ಲಿ ಈ ಹೆಣ್ಣನ್ನು ನೋಡಿ ಲಕ್ಷಣವಾಗಿದೆ. ಎಂದು ನಮ್ಮವರೆಲ್ಲಾ ಹೇಳಿದ್ದರು. ನಾವು ಬೆಂಗಳೂರಿಗೆ ವಾಸಕ್ಕೆ ಬಂದು ಕೆಲವೇ ತಿಂಗಳುಗಳಾಗಿದ್ದವು. ಬಾಬಣ್ಣನ ಸಂಸಾರದವರು ಉತ್ತಮರೆಂದು ನಂಬಿ ಹೆಚ್ಚು ಪರಿಶೀಲನೆಗೆ ಪ್ರಯತ್ನಿಸಲಿಲ್ಲ. ನಾವು ಹೆಚ್ಚು ಪರಿಶೀಲಿಸಿದ್ದರೂ, ನಮಗೆ ಗೊತ್ತಾಗುವ ಸಂದರ್ಭಗಳಿದ್ದಿಲ್ಲ. ತಾಯಿ ತಂದೆ ಮತ್ತು ಬಂಧುಗಳ ಸಲಹೆಯ ಮೇರೆಗೆ ಚಿ. ನಾಗರಾಜನೂ ತನ್ನ ಒಪ್ಪಿಗೆಯನ್ನು ಈ ವಿವಾಹಕ್ಕೆ ಕೊಟ್ಟನು. ಇದರಂತೆ ವಿವಾಹಕ್ಕೆ ಒಪ್ಪಿ ನಾವುಗಳು ಹೇಳಿದ್ದಕ್ಕೆಲ್ಲಾ ಸಮ್ಮತಿಸಿದರು ಶ್ರೀ ಸುದರ್ಶನರವರು.", "ತಾ. 16.5.1971 ಶ್ರೀ ವಿರೋಧದ್ವತ್‌ ನಾಮ ಸಂವತ್ಸರದ ವೈಶಾಖ ಬಹುಳ ಷಷ್ಟಿ ಭಾನುವಾರ ಬೆಂಗಳೂರು ಮಲ್ಲೇಶ್ವರದ ಉಭಯ ವೇದಾಂತ ಸಭಾ ಕಲ್ಯಾಣ ಮಂಟಪದಲ್ಲಿ ಚಿ. ನಾಗರಾಜನಿಗೆ ಸುದರ್ಶನರವರ ಪುತ್ರಿ ಸೌ. ಹೇಮಲತಾ ಕೊಟ್ಟು ವಿವಾಹ ನಡೆಯಿತು. ವಿವಾಹ ಪೂರೈಸಿದ ದಿನವೇ ಇವರು ಎಂಥಾ ದುರ್ಜನರು, ಮೋಸಗಾರರು ಎಂಬುದು ನಿದರ್ಶನವಾಯಿತು. ವಿವಾಹದ ನಂತರ ವಿವಾಹಕ್ಕೆಂದು ಬಂದಿದ್ದ ಬಂಧುಗಳನ್ನು, ವಿವಾಹದ ನೂತನ ದಂಪತಿಗಳನ್ನು ಬೀಳ್ಕೊಡುವುದು ಸಂಪ್ರದಾಯ. ಆದರೆ ಇಲ್ಲಿ ನಡೆದಿದ್ದೇನು? ವಿವಾಹ ಪೂರೈಸಿದ ಕೂಡಲೇ, ಅವರ ಹೆಂಡತಿ ರುಕ್ಕಮ್ಮನವರಾಗಲಿ, ಅವರ ಮಕ್ಕಳಾಗಲಿ, ಈ ವಿವಾಹಕ್ಕೆ ಒತ್ತಾಯಿಸಿದ ಶ್ರೀ ಬಾಬಣ್ಣನವರಾಗಲಿ, ಮದುವೆ ಛತ್ರದಲ್ಲಿ ಹಾಜರಿರದೆ. ತಲೆ ತಪ್ಪಿಸಿಕೊಂಡರು. ಛತ್ರದವರು ಬಂದು ನಮ್ಮನ್ನು ಎಬ್ಬಿಸಿ, ತಮ್ಮ ಪದಾರ್ಥಗಳನ್ನು ತೆಗೆದುಕೊಂಡು ಹೋಗಿ, (ಎಂದು) ನಮ್ಮಗಳನ್ನು ಛತ್ರದಿಂದ ಹೊರಗಟ್ಟಲು ಪ್ರಾರಂಭಿಸಿದರು. ಈ ರೀತಿಯ ನಡವಳಿಕೆಗೆ ನಾನು ತಬ್ಬಿಬ್ಬಾಗಿ, ಹುಳಿಯಾರಿನಿಂದ ಈ ವಿವಾಹಕ್ಕೆ ಬಂದಿದ್ದ ನನ್ನ ಮಿತ್ರ ಕೆಂಕೆರೆ ಚನ್ನಪ್ಪನವರ ಕಾರಿನಲ್ಲಿ ಮದುವೆ ಗಂಡು ಮತ್ತು ಹೆಣ್ಣನ್ನು ಕಳುಹಿಸಿ ಉಳಿದವರೆಲ್ಲಾ ಆಟೋ ಮತ್ತು ನಡಿಗೆಯಿಂದ ನಮ್ಮ ಮನೆ ಸೇರಿಕೊಂಡೆವು. ಮದುವೆ ಪೂರೈಸಿದ ಕೂಡಲೇ ಈ ದುರ್ಜನ ವರ್ತನೆಯಿಂದ ಇವರುಗಳು ಎಂಥಾ ದ್ರೋಹಿಗಳು ಎಂಬುದು ಅರ್ಥವಾಯಿತು."], ["ಇದರ ಜೊತೆಗೆ ಇನ್ನೊಂದು ದುರ್ಫಟನೆ ಎಂದರೆ ತಮ್ಮ ಮಗಳಿಗೆ ಮುಂಚೆಯೇ ಇದ್ದ ರೋಗವನ್ನು ಮುಚ್ಚಿ ಹಾಕಿ ನಂಬಿದ್ದ ನಮಗೆ ವಿಶ್ವಾಸದ್ರೋಹ, ನಂಬಿಕೆ ದ್ರೋಹ, ಆತ್ಮ ದ್ರೋಹ ಎಸಗಿ ಮೋಸಮಾಡಿದರು. ನನ್ನ ಮಗಳ ಮದುವೆಗೆ ಸಹಾಯ ಮಾಡಿದ್ದ ಶ್ರೀ ಬಾಬಣ್ಣನವರ ಉಪಕಾರಕ್ಕೆ ಪ್ರತ್ಯುಪಕಾರ ಮಾಡಿದ್ದಕ್ಕೆ ನಮಗೆ ಸಂದ ಫಲ ಇದು. ಇವರುಗಳು ಈ ರೀತಿಯ ದ್ರೋಹಿಗಳು ಎಂದು ನಾನು ಕನಸಿನಲ್ಲಿಯೂ ಭಾವಿಸಿರಲಿಲ್ಲ. ಹುಡುಗಿಗೆ ಕಾಯಿಲೆ ಇದ್ದಿರಬಹುದು. ಇದಕ್ಕೆ ತಕ್ಕ ವಿದ್ಯಾಭ್ಯಾಸಗಳೂ ಇಲ್ಲ. ಮನೆ ಕೆಲಸಗಳನ್ನೂ ಸಹ ಕಲಿಸಿರಲಿಲ್ಲ. ನಡವಳಿಕೆ ಸಹ ತರಬೇತಿ ಇಲ್ಲ. ಕರಕುಶಲ ವಿಚಾರಗಳೇ ಗೊತ್ತಿಲ್ಲ. ಆದಿ ಇಂದಲೂ ಬೆಂಗಳೂರಿನಲ್ಲಿದ್ದ ಇವರಿಗೆ ತನ್ನ ಮಗಳ ಖಾಯಿಲೆಗೆ ಸೂಕ್ತ ಚಿಕಿತ್ಸೆ ಸಹ ಕೊಟ್ಟಿಲ್ಲ. ವಿದ್ಯಾಭ್ಯಾಸವಂತೂ ಪ್ರೈಮರಿ ಸ್ಕೂಲೇ ಮುಗಿದಿಲ್ಲ. ನಡವಳಿಕೆಯ ವಿಚಾರವೇ ಗೊತ್ತಿಲ್ಲ. ಈ ವಿಚಾರಗಳು ತಮಗೆ ಗೊತ್ತೇ ಇಲ್ಲ ಎಂದು ಈ ವಿವಾಹಕ್ಕೆ ಸಲಹೆ ಕೊಟ್ಟ ಅವರ ಬಂಧು ಶ್ರೀ ಬಾಬಣ್ಣ ಹೇಳುತ್ತಿರುವುದು ತೀರಾ ಅಸಂಭವ. ಈ ವಿಷಯ, ಶ್ರೀ ರಂಗಧಾಮರವರಾದರೂ ನಮಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಬಹುದಾಗಿತ್ತು ಅವರೂ ವಿಷಯ ಗೊತ್ತೇ ಇಲ್ಲ ಎಂದು ಹೇಳುತ್ತಿರುವುದು ಎಷ್ಟು ವಾಸ್ಕವವೋ ಗೊತ್ತಿಲ್ಲ. ಮುಂದೆ ಈ ವಿಚಾರ ತಿಳಿದರೆ ನಮ್ಮ ಯೋಗ್ಯತೆ, ಘನತೆ ಏನು ಎಂಬ ಸಂಕೋಚವೂ ಅವರಿಗಿಲ್ಲವಾಯಿತು. ನಾವುಗಳಾದರೂ ಬಂಧುಗಳಿಗೆ ದ್ರೋಹ ಬಗೆಯುವುದಕ್ಕೆ ನಮ್ಮ ಸ್ಥಾನ, ಘನತೆಗೆ ಕುಂದು ಎಂದು ತಿಳಿಯುತ್ತೇವೆ. ಈ ಜನಗಳ ಸ್ವಭಾವ, ಘನತೆ, ಗೌರವ ಎಷ್ಟೆಮಬುದನ್ನು ಇದರಲ್ಲಿಯೇ ಅರ್ಥ ಮಾಡಿಕೊಳ್ಳಬಹುದು. ನನ್ನ ಮಗನಿಗೆ ಭವಿಷ್ಯವನ್ನೇ ಹಾಳು ಮಾಡಿ, ಅವನ ಸಂಸಾರನವನ್ನು, ಅವನ ಭವಿಷ್ಯವನ್ನು ಹಾಳು ಮಾಡಿದರು. ಎಲ್ಲರೂ ಮದುವೆ ಮಾಡಿ ಒಂದು ಸಂಸಾರವನ್ನು ಉದ್ಧಾರ ಮಾಡಿದರೆ, ಈ ಜನಗಳು ಒಂದು ಸಂಸಾರದ ಭವಿಷ್ಯವನ್ನೇ ಹಾಳು ಮಾಡಿದರು. ಇದಕ್ಕೆ ತಕ್ಕ ಫಲ ದೇವರೇ ಅವರಿಗೆ ಕೊಡಬೇಕಾಗಿದೆ. ಇದರಿಂದಾಗಿ ಮುಂದೆ ನನ್ನ ಇತರೆ ಗಂಡು ಮಕ್ಕಳ ವಿವಾಹದ ಪ್ರಯತ್ನಕ್ಕೆ ನಿರಾಶೆಯಾಯಿತು.", "ಈ ವಿವಾಹದ ನಂತರ 2 ದಿವಸಕ್ಕೇ ಇವರ ಮೋಸ, ದ್ರೋಹ ತಿಳಿದು ಬಂತು. ವಿವಾಹದ ನಂತರದ ಆನಂದ, ಉತ್ಸಾಹಗಳಿಂದ ಇರಬೇಕಿದ್ದ ನನ್ನ ಮನೆ ಸ್ಮಶಾನ ಸದೃಶದಂತೆ ಶೋಕತಪ್ಪರಾಗಿ ಕೊರಗುತ್ತಿರಲು ಕಾರಣವಾಯಿತು. ನಂಬಿದಕ್ಕೆ ದ್ರೋಹದಿಂದ, ಇವರುಗಳು ಎಂಥಾ ಡಕಾಯಿತರು, ದ್ರೋಹಿಗಳು, ಮೋಸಗಾರರು ಎಂಬುದು ಪ್ರಶ್ಯಕ್ಷವೇ ಆಯಿತು."], ["ಹೀಗಾಗಿದ್ದಕ್ಕೆ ನನ್ನ ಮಗ ನಾಗರಾಜ ಮತ್ತು ಇತರ ನನ್ನ ಮಕ್ಕಳಿಂದ ನನ್ನ ಕರ್ತವ್ಯಲೋಪವೆಂಬ ಆಕ್ಷೇಪಣೆಯನ್ನು ಕೇಳಿದ್ದಾಯಿತು. ಈ ವಿವಾಹದ ನಂತರ ಅವನ ಉತ್ಸಾಹವೇ ಕುಂದಿ, ಭವಿಷ್ಯವೇ ನಿರಾಶೆ ಮತ್ತು ಕೊರಗಲು ಕಾರಣವಾಯಿತು. ಈ ವಿವಾಹವನ್ನು ಎಚ್ಛೇಧಿಸಲು ಕೆಲವು ಆಪ್ತರು ಸಲಹೆ ಮಾಡಿದಾಗ, ತಂದೆ ತಾಯಿ, ಬಂಧುಗಳು ಮಾಡಿದ ದ್ರೋಹಕ್ಕೆ ಹುಡುಗಿಯ ಭವಿಷ್ಯ, ಜೀವಮಾನವನ್ನೂ ಹಾಳು ಮಾಡಬಾರದೆಂದು, ಅವರ ಸಲಹೆಗಳನ್ನು ತಿರಸ್ಕರಿಸಿದನು. ಹುಡುಗಿಯೇನೋ ಬಹಳ ಒಳ್ಳೆಯವಳು. ಅವಳಿಗೆ ಬಾಲ್ಯದಲ್ಲಿ ತಕ್ಕ ವಿದ್ಯಾಭ್ಯಾಸ, ನಡವಳಿಕೆ ಕಲಿಸದೆ, ಬೇರೆಯವರಿಗೆ ಮೋಸ ಮಾಡಲು ಹವಣಿಸುತ್ತಿದ್ದಿರ ಬಹುದೆಂದು ಕಾಣತ್ತೆ", "ಈ ವಿವಾಹವಾದ ಕೆಲವೇ ತಿಂಗಳಲ್ಲಿ ನಾಗರಾಜನಿಗೆ, ಬೆಂಗಳೂರು ಸಮೀಪದಿಂದ (ಕೋಲಾರ ಜಿಲ್ಲೆಯ) ಶಿಡ್ಲಘಟ್ಟಕ್ಕೆ ವರ್ಗವಾಯಿತು. ಈ ಹುಡುಗಿ ಇನ್ನೂ ಕೆಲವು ಕಾಲ ಬೆಂಗಳೂರು ನಮ್ಮ ಮನೆಯಲ್ಲಿರಲು ಅವಕಾಶ ಸಿಕ್ಕಿದ್ದ ಪಕ್ಷದಲ್ಲಿ ನನ್ನ ಹೆಂಡತಿಯ ಶಿಕ್ಷಣ ದೊರೆತಿದ್ದರೆ ಸಾಕಷ್ಟು ಬುದ್ಧಿವಂತೆಯಾಗಲು ಅವಕಾಶವಿತ್ತು. ಬೇರೆ ಊರಿಗೆ ವರ್ಗವಾಗಿ ಹೊರಟು ಹೋಗಿದ್ದರಿಂದ ಅವಕಾಶ ತಪ್ಪಿತು. ನಾಗರಾಜ ವೈದ್ಯಕೀಯ ವೃತ್ತಿಯಲ್ಲಿದ್ದುದ್ದರಿಂದ. ಧೈರ್ಯಗುಂದದೆ. ರೋಗಕ್ಕೆ ತಕ್ಕ ಚಿಕಿತ್ಸೆ ನಡೆಸಿ ಸಂಸಾರನ್ನು ಮುಂದುವರೆಸಿಕೊಂಡು ಹೋಗುತ್ತಿದ್ದಾನೆ.", "ಶಿಡ್ಲಘಟ್ಟದಿಂಂದ, ಕೆಲವೇ ತಿಂಗಳಿಗೆ ನಾನಿದ್ದ ಹುಳಿಯಾರಿಗೆ 4 ಮೈಲು ಫಾಸಲೆಯಲ್ಲಿರುವ ಕಂದಿಕೆರೆಗೆ ನನ್ನ ರಾಜಕೀಯ ಪ್ರಭಾವದಿಂದ ವರ್ಗಮಾಡಿಸಲಾಯಿತು. ಕಂದಿಕೆರೆಯಲ್ಲಿ ನನ್ನ ತಂದೆ ಹೆಡ್ಡ ಮಾಸ್ಟರ್‌ ಆಗಿದ್ದು, ನಾನು ಆಗ ಅಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದ ಊರು. ಅಲ್ಲಿದ್ದ ನನ್ನ ಸಹಪಾಠಿಗಳು, ನನ್ನ ಮಗ ಮತ್ತು ತಮ್ಮ ಉಪಾಧ್ಯಾಯರ ಮೊಮ್ಮಗ ತಮ್ಮ ಊರಿಗೆ ಡಾಕ್ಟರ್‌ ಆಗಿ ಬಂದದ್ದಕ್ಕೆ ತುಂಬಾ ಸಂತೋಷನವನ್ನೆ ಪಟ್ಟರು. ಕಂದಿಕೆರೆಯಲ್ಲಿ ಇವರ ಜೊತೆಗೆ ವಾಸಿಸಲು ನನ್ನ ಅಕ್ಕನವರನ್ನು ಕಳುಹಿಸಿದ್ದೆ. ನಾನು ಹುಳಿಯಾರಿನಿಂದ ಆಗಾಗ್ಗೆ ಕಂದಿಕೆರೆಗೆ ಹೋಗಿ ಬರುತ್ತಿದ್ದೆ. ಆದರೆ, ನಾನು ನಿರೀಕ್ಷಿಸಿದ ಹಾಗೆ ಅವನು ಒಳ್ಳೆ ಹೆಸರು ಗಳಿಸಲಿಲ್ಲ. ಕಂದಿಕೆರೆಯಿಂದ ಚನ್ನಪಟ್ಟಣ ತಾಲ್ಲೂಕು ಕಣ್ವ ಎಂಬ ಕುಗ್ರಾಮಕ್ಕೆ ವರ್ಗ ಮಾಡಿಸಿಕೊಂಡು ಕಂದಿಕೆರೆಯನ್ನು ಬಿಟ್ಟನು.", "ಸುಪರ್ಣನ ಮದುವೆ"], ["ನನ್ನ 2ನೇ ಮಗ ಚಿ. ಸುಪರ್ಣನಿಗೆ ವಿವಾಹದ ವಯಸ್ಸಾಗಿ, ಅನೇಕ ಹೆಣ್ಣುಗಳ ಮಾತಾ ಪಿತ್ಯಗಳು ಬಂದಿದ್ದರು. ಮೊದಲನೇ ಮಗನ ವಿವಾಹದ ವಿಚಾರದಲ್ಲಿ ಮೋಸ ಹೋಗಿದ್ದ ನಮಗೆ ಇವನ ವಿವಾಹಕ್ಕೆ ಧೈರ್ಯವೇ ಇಲ್ಲದಂತಾಗಿತ್ತು. ಮಕ್ಕಳಿಗೂ ವಿವಾಹದ ಜವಾಬ್ದಾರಿಯನ್ನು ನಮಗೆ ವಹಿಸಲು ಅಳುಕು ಉಂಟಾಗಿತ್ತು. ಬಂದ ಹೆಣ್ಣು ಮಕ್ಕಳನ್ನು ಇವನು ಒಪ್ಪುತ್ತಿರಲಿಲ್ಲ. ಕಡೆಗೆ ಇವನೇ ತನ್ನ ಜವಾಬ್ದಾರಿಯಿಂದ ನಂಜನಗೂಡಿನ ಹೆಣ್ಣನ್ನು ವಿವಾಹವಾಗಲು ನಿಶ್ವ್ಚಯಿಸಿಕೊಂಡು ನಮ್ಮ ಒಪ್ಪಿಗೆ ಪಡೆಯಲು ಅವರ ತಂದೆಯನ್ನು ನಮ್ಮಲ್ಲಿಗೆ ಕಳುಹಿಸಿಕೊಟ್ಟನು. ಅವನೇ ಒಪ್ಪಿರುವಾಗ ವಿವಾಹಕ್ಕೆ ಯಾವುದೇ ಅಭ್ಯಂತರ ಇಲ್ಲವೆಂದು ನಮ್ಮ ಸಮ್ಮತಿಯನ್ನು ಕೊಟ್ಟೆವು. ಎವಾಹಕ್ಕಾಗಿ ಖರ್ಚು ಮಾಡಲಿರುವ 10,000/- ರೂಗಳನ್ನು ತಾನು ತೆಗೆದುಕೊಂಡು, ಸುಲಭ ರೀತಿಯಲ್ಲಿ, ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವಿವಾಹ ನಡೆಸುವಂತೆ. ಮಾತನಾಡಿಕೊಂಡನು. ವಿವಾಹವಾಗಿರುವ ನನ್ನ 2 ಹೆಣ್ಣು ಮಕ್ಕಳಿಗೆ ವಿವಾಹದ ಉಡುಗೊರೆ ಕೊಟ್ಟೇ ತೀರಬೇಕೆಂಬ ನಮ್ಮ ಸಲಹೆಗೆ ಹೆಣ್ಣಿನ ತಂದೆ ಸಮ್ಮತಿಸಿದರು. ಈ ವಿಚಾರದಲ್ಲಿ ಸುಪರ್ಣ ನಮ್ಮಲ್ಲಿ ಯಾವ ವಿಚಾರಕ್ಕೂ ಪಸ್ತಾಪಿಸಿರಲಿಲ್ಲವಾಗಿ, ನಾವುಗಳು ವಿವಾಹದ ಬಗ್ಗೆ ಯಾವ ಜವಾಬ್ದಾರಿಯನ್ನೂ ತೆಗೆದುಕೊಳ್ಳಲಿಲ್ಲ. ವಿವಾಹಕ್ಕೆ ನಾವು ಲಗ್ನಪತ್ರಿಕೆಯನ್ನೂ ಅಚ್ಚು ಮಾಡಿಸಲಿಲ್ಲ. ಯಾರನ್ನೂ ವಿವಾಹಕ್ಕೆ ಆಹ್ವಾನಿಸಲಿಲ್ಲ. ಕಾರಣ ಎಂದರೆ, ನಮ್ಮ ಆಹ್ವಾನಿತರಿಗೆ ವಿವಾಹ ಸಂದರ್ಭದಲ್ಲಿ ತಕ್ಕ ಗೌರವ ಲಭಿಸುವುದೋ ಇಲ್ಲವೋ ಎಂಬ ಅನುಮಾನದಿಂದ. ಸುಪರ್ಣ ತನ್ನ ಹೆಸರಿನಲ್ಲಿಯೇ ಲಗ್ನ ಪತ್ರಿಕೆಯನ್ನು ಅಚ್ಚು ಹಾಕಿಸಿ, ತಾನೇ ಹೆಣ್ಣು ಮಕ್ಕಳು ಅಳಿಯಂದಿರನ್ನು ಆಹ್ವಾನಿಸಿದನು.", "ಬೆಂಗಳೂರಿನಿಂದ ನಂಜನಗೂಡಿಗೆ ಹೋಗಲು ಸುಪರ್ಣನೇ ಬಸ್‌ ಛಾರ್ಜು ಕೊಟ್ಟು ಕರೆದುಕೊಂಡು ಹೋದನು. ಸೌಗಳಾದ ದೇವಕಿ, ನಳಿನಿ, ಶೈಲಾ, ಚೆ. ಜೈರಾಂ, ರಮೇಶ, ಶ್ರೀಧರ, ನನ್ನ ಅಕ್ಕ ಈ ಮದುವೆಗೆ ಬಂದಿರಲಿಲ್ಲ. ನಾನು, ಅಲಮೇಲ, ವಿನತಾ, ಅವಳ ಯಜಮಾನರು, ಚೇಚಮೃ ಅವಳ ಯಜಮಾನರು, ನನ್ನ ಷಡ್ಡಕ ಕೃಷ್ಣ ಅಯ್ಯಂಗಾರ್‌, ಪದ್ದಮ್ಮ- ಇಷ್ಟು ಮಂದಿ ಮಾತ್ರ ವಿವಾಹಕ್ಕೆ ನಂಜನಗೂಡಿಗೆ ಹೋಗಿದ್ದೆವು. ಸಂಕ್ಷಿಪ್ತವಾಗಿ ವಿವಾಹವನ್ನು ನಡೆಸಲು ಅವರಿಗೆ ಹೇಳಿದ್ದ ಕಾರಣ, ಇಷ್ಟು ಜನಕ್ಕಾದರೂ ಅವರು ಸಿದ್ಧತೆ ಮಾಡಿಕೊಂಡಿರಲಿಲ್ಲ. ನಾವು ಅಲ್ಲಿಗೆ ತಲುಪಿದ ತರುವಾಯ ಅವರು ಸಿದ್ಧತೆ ಮಾಡಿದರು.", "ಈ ಮದುವೆಗೆ ನಮ್ಮನ್ನು ಚಿ. ಸುಪರ್ಣ ಯಾವ ಸಲಹೆಗಳನ್ನು ಪಡೆಯದಿದ್ದುದರಿಂದ ನಾವುಗಳು ತಟಸ್ಥರಾಗಿಬಿಟ್ಟೆವು ಮದುವೆಗೆ ಬೇಕಾದ ಸೀರೆ, ಮಾಂಗಲ್ಯ ಸಹ ಚಿ. ಸುಪರ್ಣನೇ ಮಾಡಿಸಿಕೊಂಡನು."], ["ಮದುವೆ ಹಿಂದಿನ ರಾತ್ರಿ ನಂಜನಗೂಡಿಗೆ ಹೋಗಿ ಧಾರೆ ಆದ ಸಾಯಂಕಾಲಕ್ಕೆ ಮದುವೆಗೆ ಹೋಗಿದ್ದ ನಾವುಗಳು ಮೈಸೂರಿಗೆ ಬಂದು ಬಿಟ್ಟೆವು. 10000. ರೂಗಳಿಗೆ ಇವನನ್ನು ಹೆಣ್ಣಿನವರು ಕೊಂಡುಕೊಂಡಿರುವ ಮನೋಭಾವ ವ್ಯಕ್ತವಾಯಿತು.", "ಮದುವೆ ಆದ ಮೇಲೆ ಕೆಲವು ತಿಂಗಳುಗಳು ಗಂಡ ಹೆಂಡತಿ ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಒಟ್ಟಿಗೆ ವಾಸವಾಗಿದ್ದರು. ಆಗ ನಾನೊಬ್ಬನೇ ಹುಳಿಯಾರಿನಲ್ಲಿ ವಾಸ ಮಾಡುತ್ತಿದ್ದೆ. ನಾವುಗಳು ವಾಸಕ್ಕೆ ಬೇರೆ ಮನೆ ಮಾಡಿರುವುದಾಗಿಯೂ, ಬೇರೆ ಮನೆಗೆ ವಾಸಕ್ಕೆ ಹೋಗುವುದಾಗಿಯೂ ಚಿ. ಸುಪರ್ಣ ನನಗೆ ಹುಳಿಯಾರಿಗೆ ಪತ್ರ ಬರೆದನು. ಒಂದೇ ಮನೆಯಲ್ಲಿ ಬಹಳ ಜನಗಳು ವಾಸ ಮಾಡುತ್ತಿದ್ದು, ನೂತನ ದಂಪತಿಗಳ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕೆ ಧಕ್ಕೆ ಇರುವುದು ವಾಸ್ತವ ಎಂಬ ವಿಚಾರ ನನಗೆ ತಿಳಿದು, ಮನಸ್ತಾಪ ಮಾಡಿಕೊಳ್ಳದೆ, ವಿಶ್ವಾಸದಿಂದ ಬೇರೆ ಮನೆಗೆ ಹೋಗುವಂತೆ ಪತ್ರ ಬರೆದೆನು. ಅದರಂತೆ (ಮೊದಲು ಶೇಷಾದ್ರಿಪುರದಲ್ಲಿ, ನಂತರದಲ್ಲಿ ಶ್ರೀರಾಮಪುರದಲ್ಲಿ ಬೇರೆ ಮನೆ ಮಾಡಿ ವಾಸಕ್ಕೆ ಹೋದರು. ಆಗಿನಿಂದಲೂ (ಅವರು) ಪ್ರತ್ಯೇಕವಾಗಿಯೇ ವಾಸ ಮಾಡುತ್ತಿದ್ದಾರೆ. ಯಾರ ಬೆಂಬಲ ಮತ್ತು ಸಹಾಯದಿಂದ ನನ್ನ ಸಂಸಾರ ಬೆಂಗಳೂರಿಗೆ ಬರಲು ಕಾರಣವಾಯತೋ, ಅಂಥಾ ಸುಪರ್ಣ ಈಗ ಬೇರೆ ವಾಸಕ್ಕೆ ಹೋದ. ಇದು ನನಗೆ ಒಂದು ರೀತಿಯಲ್ಲಿ ಸಮಾಧಾನವೇ ಆಯಿತು.", "ನಂಜನಗೂಡಿನಲ್ಲಿ ವಾಸವಾಗಿರುವ ತೊಂಡವಾಡಿ ಶ್ರೀ ನರಸಿಂಹ ಅಯ್ಯಂಗಾರ್‌ರವರ ಮಗಳು ಸೌ. ಪ್ರಭಾ ನನ್ನ ಸೊಸೆ ಮತ್ತು ಸುಪರ್ಣನ ಹೆಂಡತಿ. ಗಂಡಿಗೆ ಮತ್ತು ಹೆಣ್ಣಿಗೆ ನಮ್ಮ ಪದ್ಧತಿಯಂತೆ ಕೊಡಬೇಕಾದ ಎಲ್ಲಾ ಪದಾರ್ಥಗಳನ್ನು ಕೊಟ್ಟು ಶಾಸ್ತ್ರೋಕ್ತವಾಗಿ ವಿವಾಹವನ್ನು ಮಾಡಿಕೊಟ್ಟರು. ಶ್ರೀ ನರಸಿಂಹ ಅಯ್ಯಂಗಾರ್‌ ಈಗ ದಿವಂಗತರಾಗಿದ್ದಾರೆ. ನಮ್ಮ ಸ್ವಜನ ಮತ್ತು ಒಳ್ಳೆ ಸಂಪ್ರದಾಯಸ್ಥರು. ಮತ್ತು ಯೋಗ್ಯರು. ಜೆ. ಸುಪರ್ಣ ತನ್ನ ವಿವಾಹಕ್ಕೆ ತಾನೇ ಎಲ್ಲಾ ಏರ್ಪಾಡುಗಳನ್ನು ಮಾಡಿಕೊಂಡಿದ್ದು, ನಾಗರಾಜನ ಮದುವೆಯಲ್ಲಾದ ಆಘಾತಕ್ಕೆ ಅವಕಾಶವಾಗದೆ, ನಮ್ಮಗಳಿಗೆ ನೆಮ್ಮದಿಯೇ ಆಯಿತು.", "ದೇವಕಿ ಮದುವೆ", "ಈ ವೇಳೆಗೆ ನನ್ನ 3ನೇ ಮಗಳು ದೇವಕಿ, ಔಡ ತೇರ್ಗಡೆಯಾಗಿ 7080 2೦0೩೯೧೮೧, ಟೆಲಿಫೋನ್‌ ಎಕ್ಸ್‌ಚೇಂಜ್‌ನಲ್ಲಿ '761೮01307೮ ೦೮೯೩೬ಂ೯ ಕೆಲಸ ಸಿಕ್ಕಿದ್ದು, ನಮ್ಮ ಸ್ವಜನ, ನಮಗೆ ಗುರುತುಳ್ಳ ವರನೊಬ್ಬನನ್ನು ಗೊತ್ತು ಮಾಡಿದ್ದೆವು. ಆಗ ನನ್ನ ಸಂಸಾರ ಎಲ್ಲಾ ಬೆಂಗಳೂರಲ್ಲಿದ್ದು"], ["ನಾನೊಬ್ಬ ಮಾತ್ರ ಹುಳಿಯಾರಿನಲ್ಲಿದ್ದು ಸಂಸಾರಕ್ಕೆ ಆರ್ಥಿಕ ಮತ್ತು ಧನರೂಪದಲ್ಬಲಿ ಸಹಾಯ ಮಾಡುತ್ತಿದ್ದೆ. ಸೌ ದೇವಕಿ ಹುಳಿಯಾರಿನಲ್ಲಿ 55ಓ೮ ಪಾಸಾದ ನಂತರ ಕಾಲೇಜು ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕೆ ಬೆಂಗಳೂರಿಗೆ ಬಂದಳು. ಎಲ್ಲಾ ತರಗತಿಗಳಲ್ಲಿ ಪ್ರಥಮ ಬಾರಿಗೆ ತೇರ್ಗಡೆಯಾದಳು.", "ಇಷ್ಟರಲ್ಲಿ ಮತ್ತೊಂದು ಆಘಾತ ಮತ್ತು ಮನೆಯಲ್ಲಿ ಎಲ್ಲರಿಗೆ ಕೊರತೆಯಾಗಲು ಕಾರಣವಾಯಿತು. ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ಬಹಳ ಸೌಜನ್ಯ ಮತ್ತು ಗಾಂಭೀರ್ಯದಿಂದ ಇದ್ದು. ಪ್ರತಿ ಮಾಹೆಯೂ ತನ್ನ ಖರ್ಚಿಗೆ ಮಾತ್ರ ಮೊಬಲಗು ಇಟ್ಟುಕೊಂಡು, ತನ್ನ ತಾಯಿಗೆ (ಉಳಿದ) ತನಗೆ ಬರುವ ಸಂಬಳವನ್ನು ಕೊಡುತ್ತಿದ್ದಳು. ನಾವುಗಳು ಅವಳಿಗೆ ಗೊತ್ತು ಮಾಡಿದ್ದ ವರನನ್ನು ಮದುವೆ ಆಗುವುದಿಲ್ಲ ಎಂದೂ, ಈ ಮೊದಲೇ ನಾನು ಪ್ರೀತಿಸಿದ್ದ ಗಂಡೊಂಂದನ್ನು ವಿವಾಹ ಮಾಡಿಕೊಳ್ಳುತ್ತೇನೆಂದೂ ಎಷ್ಟೋ ವಿಧವಾಗಿ ನಾನೂ, ನನ್ನ ಮನೆಯವರು ಬುದ್ಧಿವಾದ ಹೇಳಿದರೂ ಕೇಳಲಿಲ್ಲ. ಅವಳು ಪ್ರೀತಿಸಿ ಮದುವೆಯಾದ ವರ ನಮ್ಮ ಸ್ವಜನನಲ್ಲ. ಮಾಧ್ವ ಬ್ರಾಹ್ಮಣರು. ಇವಳ ಇಲಾಖೆಯಲ್ಲೇ ಕೆಲಸದಲ್ಲಿರುವವನು. ಚಿಕ್ಕ ವಯಸ್ಸು. ತಕ್ಕ ರೂಪು. ವಿದ್ಯಾವಂತ. ಈತ ಅವರ ತಂದೆ ತಾಯಿಗೆ ಏಕಮಾತ್ರ ಪುತ್ರ. ತಂದೆ ತಾಯಿ ಸತ್‌ ಸಂಪ್ರದಾಯಸ್ಥರು. ನಿಷ್ಠರು. ಇವರ ತಂದೆ ತಾಯಿಗಳಿಗೂ ಈ ವಿವಾಹ ಇಷ್ಟವಿರಲಿಲ್ಲ. ಕಾರಣ, ಉಭಯ ಸಂಸಾರಗಳೂ ಇವರು ಸ್ವಜನ ಅಲ್ಲ ಎಂದು. ಇಬ್ಬರೂ ಈ ವಿವಾಹಕ್ಕೆ ಹಠ ಹಿಡಿದ ಕಾರಣ, ಇವರ ಮಿತ್ರರ ಸಲಹೆ ಮೇರೆಗೆ ೫೮1507೦6 1/0871186೮ ಮಾಡಿಕೊಂಡರು. ಉಭಯ ಸಂಸಾರಗಳೂ ಈ ವಿವಾಹಕ್ಕೆ ಬರಲಿಲ್ಲ. ನನ್ನ ಹಿತೋಸಕ್ತಿಯನ್ನು ತಿರಸ್ಕರಿಸಿದ್ದರಿಂದ ಅವಳನ್ನು ನಮ್ಮ ಮನೆಯಿಂದ ಹೊರಗಟ್ಟಲಾಯಿತು. ಮಾಡಿಸಿದ್ದ ಒಡವೆ ಮತ್ತು ಮಾಂಗಲ್ಯ ಬಟ್ಟೆ ಕೊಟ್ಟದ್ದಾಯಿತು. ನಂತರ ಇಬ್ಬರೂ ಸೇರಿ ತಮ್ಮ ಮಿತ್ರರುಗಳಿಗೆ ಒಂದು ಔತಣ ಕೂಟವನ್ನು ಏರ್ಪಡಿಸಿದ್ದರು. ಇದಕ್ಕೆ ನನ್ನ ಚಿಗಳು ಹೋಗಿ ಬಂದರು. ಈಗ ಇವರುಗಳು ಬೇರೆ ಮನೆ ಮಾಡಿಕೊಂಡು ಸುಖ, ಶಾಂತಿ, ನೆಮ್ಮದಿಗಳಿಂದ ಜೀವನ ನಡೆಸುತ್ತಿದ್ದಾರೆ. ನಮ್ಮ ಸ್ವಂತ ಜನ ಅಲ್ಲ ಎಂಬುದೊಂದೇ ಕೊರಗು. ಇವಳ ಪತಿಯೂ ತುಂಬಾ ಯೋಗ್ಯರು. ಈಗ ಇವರಿಗೆ 2 ಗಂಡುಮಕ್ಕಳು ಇದ್ದಾರೆ. ಈಚೆಗೆ ಮನೆಯಲ್ಲಿದ್ದ ಬೆಳ್ಳಿ ಪಾತ್ರೆಗಳನ್ನು (ಅವಳಿಗೆ) ಕೊಟ್ಟದ್ದಾಯಿತು. ಈ ಮದುವೆ ಆದ ನಂತರ ಈ ಹುಡುಗಿಗೆ ನಮ್ಮ ಸಂಪ್ರದಾಯಗಳೇ ಮರೆತು ಹೋಗಿದೆ. ಆಗಿನ ಕಾಲದಲ್ಲಿ ಬೇರೆ ಸಂಪ್ರದಾಯದ ವಿವಾಹ ಬಹಳ ಅಪರೂಪವಾಗಿತ್ತು ಈಗ ಸಾಮಾನ್ಯವಾಗಿದೆ.", "ನಳಿನಿ ಮದುವೆ"], ["ಈ ವಿವಾಹದ ಪರಿಣಾಮದಿಂದ ನನ್ನ ನಾಲ್ಕನೆಯ ಮಗಳು ಸೌ. ನಳಿನಿ ವಿವಾಹಕ್ಕೆ ಸ್ವಲ್ಪ ತೊಂದರೆಯೂ ಆಯಿತು. ಒಟ್ಟಿನಲ್ಲಿ ಸತ್ಯಂಪ್ರದಾಯದ ಉತ್ತಮವಾದ ವರ ಎಂಬುದೊಂದು ಸಮಾಧಾನ. ನಮ್ಮ ಸ್ವಜನದ ವರನನ್ನು ವಿವಾಹಕ್ಕೆ ಗೊತ್ತು ಮಾಡಿದ್ದರೂ ತಿರಸ್ಕರಿಸಿ, (ದೇವಕಿ) ತಂದೆ ತಾಯಿ ಇಲ್ಲದ ಅನಾಥೆಯಂತೆ ವಿವಾಹ ಮಾಡಿಕೊಂಡಳೆಂಬ ಕೊರಗು, ನನ್ನ ಸಂಸಾರಕ್ಕೆ, ನನಗೂ ಈಗಲೂ ಇದೆ. ಒಟ್ಟಿನಲ್ಲಿ ಈಗ ಅವಳ ಸಂಸಾರ ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತಾ. ಯೋಗ್ಯ ರೀತಿಯಲ್ಲಿ ಸಂಸಾರ ಸಾಗುತ್ತಿರುವುದು ಒಂದು ಸಂತೋಷ.", "ಸೌ. ದೇವಕಿಯ ಪತಿ ಶ್ರೀ ವಿಜಯಸಿಂಂಹ ಮಾಧ್ವ ವೈಷ್ಣವರು, ಇವಳು ನಮ್ಮ ಸ್ವಜನದಲ್ಲಿ ಎವಾಹವಾಗದಿದ್ದದ್ದು ನಮ್ಮ ವಂಶಸ್ಥರಿಗೆ ಸಮಾಧಾನವಿಲ್ಲ. ಕೆಲವು ದಿನಗಳ ನಂತರ, ಇವರುಗಳು ನಮ್ಮ ಸಂಸಾರದ ಜನಗಳೊಂದಿಗೆ ಸಹಕರಿಸುತ್ತಿದ್ದಾರೆ. ಇದು ಅವರ ಸ್ವಯಂಕೃತ ಅಪರಾಧವೇ ಹೊರತು, ಉಭಯ ಕಡೆ ತಂದೆ ತಾಯಿಗಳ ತಪ್ಪು ಸ್ವಲ್ಪವೂ ಇಲ್ಲ.", "ಹೊತ್ತು ಹೆತ್ತು. ಸಾಕಿ, ಎದೆ ಕಲಿಸಿ, ಎಲ್ಲಾ ಹೆಣ್ಣು ಮಕ್ಕಳಂತೆ ಇವಳನ್ನು ಧಾರೆ ಎರೆದು ಕೊಡಲು ಅವಕಾಶವಾಗಲಿಲ್ಲ ಎಂಬುದೇ ನಮ್ಮ ಕೊರಗು. ಅನಂತರ ಸೌ. ಅಲಮೇಲ ಉತ್ತರ ಭಾರತದ ಪ್ರವಾಸಕ್ಕೆ ಹೋಗಿ ಬಂದಳು. ನನಗೆ ಮೊದಲೇ ೫:18/66 70608886 ಇದ್ದು ಗೊತ್ತಾಗಿತ್ತು ಉದಾಸೀನದಿಂದ ತಪ್ಪೇ ಆಯಿತು. ಬೇಲೂರಿಗೆ ದೇವರ ಸೇವೆಗೆ ಹೋದಾಗ್ಗೆ ಅಲ್ಲಿ ಮೂತ್ರ ಕಟ್ಟಿತು. ಅಲ್ಲಿಂದ ಹಾಸನಕ್ಕೆ ಬಂದು ಜಿಲ್ಲಾ ಆಸ್ಪತ್ರೆಗೆ ದಾಖಲಾಗಿ ಒಂದು ಮೈನರ್‌ ಆಪರೇಷನ್‌ ಮತ್ತು ಒಂದು ಮೇಜರ್‌ ಆಪರೇಷನ್‌ ಮಾಡಿಸಿಕೊಂಡು ಅಲ್ಲೇ ಒಂದು ತಿಂಗಳು ಇದ್ದು ಬೆಂಗಳೂರಿಗೆ ಬಂದ ನಂತರ ಪುನಃ ಬಲಗಾಲು ನೋವಾಗಿ ಸ್ವಾಧೀನ ತಪ್ಪಿ ಮಲ್ಲೇಶ್ವರಂ ಆಸ್ಪತ್ರೆಗೆ ದಾಖಲಾಗಿ, ಪುನಃ (ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಗೆ ದಾಖಲಾಗಿ ಅಲ್ಲಿ) ಡಾ. ಬಿ.ಟಿ. ಸಂಪತ್‌ಕುಮಾರ್‌ರವರಿಂದ ಆಪರೇಶನ್‌ ಆಗಿ ಮೂರು ತಿಂಗಳೂ ಬೆಂಗಳೂರಿನಲ್ಲಿದ್ದೆನು. ಈ 3 ಆಪರೇಷನ್‌ಗಳಿಂದ ನನ್ನ ದೇಹ ಸ್ಥಿತಿ ಕುಂದಿ ನಿಶ್ಯಕ್ತಿಯಾಗಲು ಕಾರಣವಾಯಿತು. ಪುನಃ ಹುಳಿಯಾರಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಒಬ್ಬನೇ ಇದ್ದೆನು.", "ಈ ವೇಳೆಗೆ ಸೌ. ನಳಿನಿಗೆ ಬಿ.ಎಸ್‌ಸ್ಟಿ ವಿದ್ಯಾಭ್ಯಾಸ ಪೂರ್ತಿಯಾಗಿ ಪದವಿ ಪಡೆದಳು. ಜೊತೆಗೆ ಟೈಪ್‌ರೈಟಿಂಗ್‌ ಸಹ ಕಲಿತಳು. ಇವಳಿಗೆ ವಿವಾಹಕ್ಕೆ ವಯಸ್ಸಾಗಿ ಇವಳ ತಾಯಿ ವರಾನ್ವೇಷಣೆಗೆ ಬಹಳ ಕಷ್ಟಪಟ್ಟಳು. ಇವಳ ಅಕ್ಕ ದೇವಕಿಗೆ ಆಗಿದ್ದ ಅನುಭವದಿಂದ ನಮಗೆ ಕಾತುರವಾಗಿ, ಬಹಳಷ್ಟು ಬೇಗನೆ"], ["ಇವಳಿಗೆ ವಿವಾಹ ಮಾಡಬೇಕೆಂದು ನಿಶ್ಚಯವಾಗಿತ್ತು. ದೇವಕಿ ವರ್ತನೆಯಿಂದ ಇವಳ ಜೀವಮಾನಕ್ಕೆ ಸ್ವಲ್ಪ ಧಕ್ಕೆಯೇ ಆಯಿತು. ಯಾವ ವರನ ಮನೆಗೆ ಹೋದರೂ, ದೇವಕಿಯ ವಿಚಾರ ಕೇಳುತ್ತಿದ್ದರು. ಆಗಿನ ಕಾಲದಲ್ಲಿ, ಆ ಸಂದರ್ಭ ಅಪರೂಪವಾಗಿತ್ತು ಈಗ ಆ ರೀತಿಯ ಸಂದರ್ಭಗಳು ಮಾಮೂಲಾಗಿದೆ. ಕಡೆಗೆ ವರ ನಿಶ್ಚಯವಾಗಿ, 16.5.1979 ವಿರೋಧಿಕೃತ ವೈಶಾಖ ಬಹುಳ ಷಷ್ಠಿ ಭಾನುವಾರ ಪ್ಯಾಲೆಸ್‌ ಗುಟ್ಟಹಳ್ಳಿ ಆಂಜನೇಯಸ್ವಾಮಿ ಛತ್ರದಲ್ಲಿ ಚಿ. ಪ್ರಸನ್ನಕುಮಾರ್‌ ೫.50, ಅವರೊಡನೆ ಶಕ್ಕ ವಿಜೃಂಭಣೆಯಿಂದ ವಿವಾಹ ನಡೆಯಿತು.", "ಶ್ರೀ ಪ್ರಸನ್ನಕುಮಾರ್‌ ಬಹಳ ಯೋಗ್ಯ ವ್ಯಕ್ತಿ ಇವರ ತಂದೆ. ತಾಯಿಗಳೂ ಉತ್ತಮರು, ಯೋಗ್ಯರು, ಸತ್‌ಸಂಪ್ರದಾಯದವರು. ಇವರ ಮಾತಾ ಶಿತೃಗಳಿಗೆ (ಪ್ರಸನ್ನಕುಮಾರ್‌) 2ನೇ ಪುತ್ರರು. ದೇವಕಿಯ ಸಂದರ್ಭದ ಆತಂಕ ಇಲ್ಲದಿದ್ದಲ್ಲಿ, ಇನ್ನೂ ನಿಧಾನಿಸಬಹುದಾಗಿತ್ತು ಇವಳ ವಿವಾಹಕ್ಕೆ ಆರ್ಥಿಕವಾಗಿ ಇವಳಿಗೆ ಸ್ವಲ್ಪ ತೊಂದರೆಯೇ ಆಯಿತು.", "ಶೈಲಾ ಮದುವೆ", "ಮುಂದೆ ಶೈಲಾ .ಗಿ. ಪದವೀಧರಳಾಗಿ, ಟೈಪಿಂಗ್‌ ಕಲಿತಿದ್ದಳು. ಇವಳಿಗೆ ವರ ಗೊತ್ತಾಗಿದ್ದು ಸ್ವಲ್ಪ ವಿಶೇಷವೇ ಆಯಿತು. ಸೌ, ಶೈಲಾ ಕಡೆಯ ವರ್ಷದ ವ್ಯಾಸಂಗ ಪೂರೈಸಿ, ಪರೀಕ್ಷೆಯ ಫಲಿತಾಂಶ ಇನ್ನೂ ಪ್ರಕಟವಾಗಿರಲಿಲ್ಲ. ತಾಯಿ, ಮಗಳು ಯಾವುದೋ ವಿವಾಹಕ್ಕೆ ಹೋಗಿದ್ದಾಗ್ಗೆ, ವರನ ಅಕ್ಕ ಶ್ರೀಮತಿ ವಿಮಲಾರವರು, ಇವಳಿಗೆ ವಿವಾಹ ಮಾಡುವುದಿದ್ದಲ್ಲಿ, ನನ್ನ ಸಹೋದರ ಒಬ್ಬ ರಾಜಾಸ್ಥಾನದ ಕೋಟಾದಲ್ಲಿರುತ್ತಾನೆ. ಈಗ ಬೆಂಗಳೂರಿಗೆ ಬಂದಿದ್ದಾನೆ. ಇಷ್ಟವಾದ್ದಲ್ಲಿ ಹುಡುಗಿಯನ್ನು ಕರೆದುಕೊಂಡು ಬಂದು ತೋರಿಸಿ ಎಂದು ಹೇಳಿದರು. ಸೌ. ನಳಿನಿಗೆ ಅನೇಕ ಕಡೆ ತಿರುಗಿ, ನಿರಾಶೆಯ ಅನುಭವವಾಗಿದ್ದು, ಇವಳಿಗೆ ಇಷ್ಟು ಬೇಗ ವರ ಎಲ್ಲಿ ಸಿಗುತ್ತೆ ಎನ್ನುತ್ತಾ ಸೌ. ಶೈಲಾಳನ್ನು ಕರೆದುಕೊಂಡು ಹೋದಳು, ಇವಳ ತಾಯಿ. 3 ದಿನಗಳ ನಂತರ, ಸೌ. ಶೈಲಾಳನ್ನು ಒಪ್ಪಿ ವಿವಾಹವಾಗುವುದಾಗಿ ವರನ ಅಕ್ಕ ಬಂದು ಹೇಳಿದರು. ನಮಗೆ ಈ ವಿಚಾರ ತಿಳಿದು ಆಶ್ಚರ್ಯ, ಸಂತೋಷ ಮತ್ತು ಯೋಚನೆಯೂ ಆಯಿತು. ಯೋಚನೆಗೆ ಕಾರಣ, ಇವಳ ಪದವಿ ಪರೀಕ್ಷೆ ಬಂದಿಲ್ಲದಿರುವುದೂ ಮತ್ತು ವಿವಾಹಕ್ಕೆ ಯಾವ ಸಿದ್ಧತೆಯನ್ನೂ ಮಾಡಿಕೊಳ್ಳದಿರುವುದು. ಇವಳಿಗೆ ಇನ್ನೂ ಈಗಿನ ಕಾಲದಂತೆ ವಿವಾಹಕ್ಕೆ ವಯಸ್ಸಾಗಿರಲಿಲ್ಲ. ಈ ಕಾರಣದಿಂದ ಇನ್ನೂ 3 ತಿಂಗಳು ಕಾಲಾವಕಾಶ ಕೇಳಿದ್ದಕ್ಕೆ ವರನ ತಂದೆ, ತಾಯಿ"], ["ಒಪ್ಪಿಗೆ ಕೊಟ್ಟರು. ಈ ವಿವಾಹಕ್ಕೆ ತುಂಕೂರಿನಲ್ಲಿದಿದ ನನ್ನ ಬಾಬ್ತು ಮನೆಯನ್ನು ಮಾರಲು ನಿಶ್ಚಯಿಸಿ, ಸರಿಯಾದ ಖರೀದಿದಾರರು ಬರದೆ ತೊಂದರೆಯಾಯಿತು.", "ಇವಳ ಅದೃಷ್ಟವೋ ಎಂಬಂತೆ ಕಡೆಗೊಬ್ಬ ಖರೀದಿದಾರರು 90 ಸಾವಿರಕ್ಕೆ ಮನೆಕೊಳ್ಳಲು ಬಂದರು. ಮನೆಯನ್ನು ಕ್ರಯಕ್ಕೆ ಕೊಟ್ಟು ವಿವಾಹ ಏರ್ಪಾಡಿನಲ್ಲಿದ್ದಾಗ,. ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕ ಇದ್ದಕ್ಕಿದ್ದಂತೆಯೇ ಗಣಪತಿ ಹಬ್ಬದ ಮಾರನೇ ದಿನದ ಬೆಳಗ್ಗೆ ಎಲ್ಲರೂ ಮನೆಯಲ್ಲಿರುವಾಗ್ಗೆ ಮೃತಪಟ್ಟಳು. ಮದುವೆಗೆ ತಂದಿದ ಬಟ್ಟೆ, ಸಾಮಾನುಗಳನ್ನೆಲ್ಲಾ ನೋಡಿ, ಹಿಂದಿನ ದಿನದ ಗೌರಿ ಗಣೇಶ ಹಬ್ಬ ನೋಡಿದಳು. ಶೈಲಾ ವಿವಾಹಕ್ಕೆ ಎಲ್ಲಾ ಏರ್ಪಾಡುಗಳೂ ಆಗುತ್ತಿದ್ದು, ಲಗ್ನಪತ್ರಿಕೆ ಕಾರ್ಯ ಮಾತ್ರ ಆಗಿರಲಿಲ್ಲ. 2 ದಿನಗಳ ಕರ್ಮ ಬೆಂಗಳೂರಲ್ಲಿ ಮುಗಿಸಿ, ಮುಂದಿನ ಕರ್ಮಕ್ಕೆ ನಾನು, ಚಿ. ನಾಗರಾಜ ಮತ್ತು ಗಯಾಕ್ಕೆ ಹೋಗಿ ಮುಗಿಸಿಕೊಂಡು ಬಂದೆವು. ನಾನೇ ಕರ್ತೃ. ಮುಂದೆ ಲಗ್ನ ಪತ್ರಿಕೆ ಕಾರ್ಯ ಮುಗಿಸಿ. 26.11.1982, ದುಂಧುಭಿನಾಮ ಸಂವತ್ಸರದ ಕಾರ್ತಿಕ ಶುದ್ಧ ದಶಮಿ, ಶುಕ್ರವಾರ, ಮಲ್ಲೇಶ್ವರಂನಲ್ಲಿರುವ ಶ್ರೀರಾಮ ಕಲ್ಯಾಣ ಮಂಟಪದಲ್ಲಿ ಅತ್ಯಂತ ವಿಜೃಂಭಣೆಯಾಗಿ, ಜಿ. ಜೈರಾಂನ ಮುಂದಾಳತ್ವದಲ್ಲಿ ಸಂಭ್ರಮವಾಗಿ ನೆರವೇರಿತು.", "ಈ ವರನ ಅಜ್ಜಿ ಕಡಬದ ಅಣ್ಣಾದೊರೈ ಸಹೋದರಿ, ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರಿಗೆ ಸೋದರ ಮಾವನ ಮಗಳು. ಈ ವಿವಾಹ ಗೊತ್ತಾದಾಗ ನಾವುಗಳು ವಿವಾಹಕ್ಕೆ ಸಿದ್ಧರಾಗಿಲ್ಲದಿದ್ದುದ್ದರಿಂದ, ಈ ವಿವಾಹ ನಡೆಸಲು ಅಸಮರ್ಥರಾಗಿ. ರಾಜಾಸ್ಥಾನ ದೂರ ಎಂದು ಎಷ್ಟು ಹೇಳಿದರೂ, ಸೌ.ಶೈಲ ಈ ವಿವಾಹಕ್ಕೆ ಸಿದ್ಧಳಾಗಿದ್ದಳು. ಅವಳ ಅದೃಷ್ಟವೋ ಎಂಬಂತೆ ಹೆಚ್ಚು ಕಷ್ಟ ಪಡದೆ ವರ ಸಿಕ್ಕಿ ನಮಗೆ ವಿವಾಹಕ್ಕೆ ಅನೀರೀಕ್ಷಿತವಾಗಿ ಸಹಾಯವಾಗಿ ವಿವಾಹವೂ ವಿಜೃಂಭಣೆಯಿಂದ ನಡೆಯಿತು.", "ವರ ಶ್ರೀಧರ್‌ರವರ ತಂದೆ ಶ್ರೀ ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಅವರ ಪೂರ್ವಸ್ಮಳ ಹಾಲ್ತೊರೆ. ಅವರ ತಾಯಿ ಕಡಬದ ದೀಕ್ಷಿತ ಅಣ್ಣಾದೊರೈ ಯವರ ಸಹೋದರಿ. ನನ್ನ ಅತ್ತೆ ರಂಗಮ್ಮನವರಿಗೆ ಸೋದರ ಮಾವನ ಮಗಳು. ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ತಂದೆ, ರೈಲ್ವೆ ಇಲಾಖೆಯಲ್ಲಿ ರಾಜಾಸ್ಥಾನದ ಕೋಟಾದಲ್ಲಿ ಕೆಲಸಕ್ಕಿದ್ದರು. ಮಗ ರಂಗಸ್ವಾಮಿ ಅಯ್ಯಂಗಾರ್‌ ಚಿಕ್ಕ ವಯಸ್ಸಿನ ಕಡಬದಲ್ಲಿದ್ದು ಕರ್ನಾಟಕದಲ್ಲಿ ವಿದ್ಯಾಭ್ಯಾಸ ಮುಗಿಸಿ ರಾಜಾಸ್ಥಾನದ ಕೋಟಾದಲ್ಲಿ ಕೆಲಸಕ್ಕಿದ್ದರು. ಇವರ ಧರ್ಮಪತ್ನಿ ಸೌ. ಪದ್ಮಮ್ಮನವರು ನುಗ್ಗೇಹಳ್ಳಿಯ ಶ್ರೀ ರಾಜ ಅಯ್ಯಂಗಾರ್‌ ಮಗಳು. ಎರಡು ಕಡೆಯೂ ನಮಗೆ"], ["ತಿಳಿದವರು. ಇವರ ಎಲ್ಲಾ ಮಕ್ಕಳೂ ರಾಜಾಸ್ಥಾನದಲ್ಲಿಯೇ ವಿದ್ಯಾ ವ್ಯಾಸಂಗ ಮಾಡಿ, (ನಂತರ) ಬೆಂಗಳೂರಿಗೆ ಬಂದು ನೆಲೆಸಿದರು. ಇವರಿಗೆ 3 ಹೆಣ್ಣು ಮಕ್ಕಳು. 2 ಜನ ಗಂಡು ಮಕ್ಕಳು.", "ಇವರ ಹೆಣ್ಣು ಮಕ್ಕಳೆಲ್ಲಾ ಕರ್ನಾಟಕದಲ್ಲಿ ವಿವಾಹವಾಗಿ ಕರ್ನಾಟಕದಲ್ಲೇ ನೆಲೆಸಿದ್ದಾರೆ. ಹಿರಿಯ ಮಗ ಶ್ರೀನಾಥ ಬೆಂಗಳೂರಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದು ಬೆಂಗಳೂರು ನಾಗರಬಾವಿಯಲ್ಲಿ ಸ್ವಂತ ಮನೆ ಕಟ್ಟಿಸಿದ್ದಾರೆ. ಇವರ ಕಿರಿಯ ಪುತ್ರ ಚಿ. ಶ್ರೀಧರ್‌ ಅವರೂ ಸಹ ರಾಜಾಸ್ಥಾನದಲ್ಲಿಯೇ ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿ, ಕೋಟಾದಲ್ಲಿ, 88/೩ 1/611767/1810೧ ೫೩ಂ೭ಂ೧7 ಯಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದಾರೆ. ಕೋಟಾದಲ್ಲಿ ಸ್ವಂತ ಮನೆ ಸಹ ಹೊಂದಿದ್ದಾರೆ. ಈ ಸಂಸಾರದ ಶ್ರೀಧರ್‌ ಮಾತ್ರ ರಾಜಾಸ್ಥಾನದಲ್ಲಿ ಉಳಿದು, ಮಿಕ್ಕವರೆಲ್ಲಾ ಕರ್ನಾಟಕದಲ್ಲಿದ್ದಾರೆ. ರಾಜಾಸ್ಥಾನದಲ್ಲೇ ಹುಟ್ಟಿ, ಬೆಳೆದು, ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿದ ಇವರಿಗೆ ಆ ಪ್ರಾಂತ್ಯ ಚೆನ್ನಾಗಿ ಒಗ್ಗಿ ಹೋಗಿದೆ. ನನ್ನ ಮಗಳು ಸೌ. ಶೈಲಾ ಅಲ್ಲಿಗೆ ಹೋದ ನಂತರ ಹಿಂದಿ ಭಾಷೆಯನ್ನು ಚೆನ್ನಾಗಿ ಕಲಿತುಕೊಂಡು ಆ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಹೊಂದಿಕೊಂಡಿದ್ದಾಳೆ. ಚಿಕ್ಕ ವಯಸ್ಸಾಗಿದ್ದರೂ ಒಳ್ಳೆ ಜಾಣೆ, ಧೈರ್ಯಸ್ಥೆ. ಇಷ್ಟಕ್ಕೆಲ್ಲಾ ಅವಳ ತಾಯಿಯ ಶಿಕ್ಷಣವೇ ಕಾರಣ. ಸೌ. ಶೈಲಾ ನನ್ನ ಕಿರಿಯ ಪುತ್ರಿ. ಕಿರಿಯಳಾದ ಇವಳ ಮೇಲೆ, ನನ್ನ ಮನೆಯ ಎಲ್ಲಾ ಮಕ್ಕಳಿಗೆ ಅಪಾರ ಪ್ರೇಮ.", "ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲೇ ಲಗ್ನವಾಗಿ ದೂರ ಪ್ರದೇಶದ ರಾಜಾಸ್ಥಾನಕ್ಕೆ ಹೋಗಿ, ಅಲ್ಲಿನ ವಾತಾವರಣಕ್ಕೆ ಹೊಂದಿಕೊಂಡು ರೀತಿಯಾಗಿ ಧೈರ್ಯವಾಗಿದ್ದುಕೊಂಡು ಸಂಸಾರನ್ನು ಸುಲಭವಾಗಿ ನಡೆಸುತ್ತಿದ್ದಾಳೆ. ಇವಳ ಪತಿ ಶ್ರೀಧರ್‌ ಬಹಳ ಒಳ್ಳೆಯ ಸಭ್ಯ ವ್ಯಕ್ತಿ ಇದರಿಂದಾಗಿ ನನಗೆ ಸಂತೋಷವೇ ಆಗಿದೆ. ಇವಳ ತಾಯಿ ಮತ್ತು ನಾನು, ನನ್ನ ಮಕ್ಕಳೂ ರಾಜಾಸ್ಥಾನದ ಕೋಟಕ್ಕೆ ಹೋಗಿ ಅಳ್ಲಿ ಕೆಲವು ದಿನಗಳಿದ್ದು ಬಂದಿದ್ದೇವೆ. ಎಲ್ಲಿಗೆ ಬೇಕಾದರೂ ಹೋಗಿ ಧೈರ್ಯದಿಂದ ವರ್ತಿಸುವ ಸ್ವಭಾವ ಇವಳದ್ದು.", "ರಮೇಶನ ಮದುವೆ", "ಇನ್ನು ನನ್ನ ಕಡೇ ಮಗ ರಮೇಶ (ಮೋಹನರಾಂ) ಬಿ.ಎಸ್ಸಿಯಲ್ಲಿ ಪದವಿ ಪಡೆದ ನಂತರ ಬೆಂಗಳೂರು ಔ೫88೫1/1, ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ನೌಕರಿ ಸಿಕ್ಕಿತು. ಫ್ಯಾಕ್ಟರಿ ಕೆಲಸ ಮಾಡಿಕೊಂಡು ತನ್ನ ಖರ್ಚಿನಿಂದಲೇ ಮುಂದಿನ ವಿದ್ಯಾವ್ಯಾಸಂಗಕ್ಕೆ ಆರಂಭಿಸಿದನು. ಇವನು ಹುಳಿಯಾರು ಹೈಸ್ಕೂಲಿನಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದ ಕಾಲದಲ್ಲಿ ಅದೇ ಹೈಸ್ಕೂಲಿನಲ್ಲಿ ಸಹೋಪಾಧ್ಯಾಯ ಶ್ರೀ ಸತ್ಯನಾರಾಯಣ ರಾವ್‌ ಎಂಬುವರು 2೩೫೩೩ಂ ೫6008008 ನಲ್ಲಿ ತರಬೇತಿ ಹೊಂದಿ ಆ ಶಾಲೆಯಲ್ಲಿ ಆಗಾಗ್ಗೆ ನಾಟಕ"], ["ಮಾಡಿಸುತ್ತಿದ್ದರು, ವಿದ್ಯಾರ್ಥಿಗಳಿಂದ. ಇದಕ್ಕೆ ನನ್ನ ಜೆ. ರಮೇಶ ನಾಟಕದಲ್ಲಿ ಪಾತ್ರವಹಿಸುತ್ತಿದ್ದನು. ಇದರಿಂದಾಗಿ ನಾಟಕ ವಿದ್ಯಾ ವ್ಯಾಸಂಗದಲ್ಲಿ ಅಭಿರುಚಿಯಾಗಿತ್ತು ಬೆಂಗಳೂರು ಸೆಂಟ್ರಲ್‌ ಕಾಲೇಜಿನಲ್ಲಿ ನಾಟಕದ ಪದವಿ ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿ 3 ವರ್ಷಗಳ ವ್ಯಾಸಂಗದಲ್ಲಿ ಬಿ.ಎ. ಪದವಿ ಪಡೆದನು. ಈ ವ್ಯಾಸಂಗದ ಕಾಲದಲ್ಲಿ ಇವನಿಗೆ ಒಳ್ಳೊಳ್ಳೆ ಪ್ರಭಾವಶಾಲಿಗಳು ಮತ್ತು ವಿದ್ವಾಂಸರ ಸಹವಾಸ ಲಭಿಸಿದ್ದು ಇವನ ಭವಿಷ್ಯಕ್ಕೆ ಒಳ್ಳೆಯ ಕಾರಣವೇ ಆಯಿತು. ಇವನಿಗೆ ನಾಟಕದ ಪದವಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿದ್ದ ಕಾಲದಲ್ಲಿ ಮನೆಯಲ್ಲಿ ಎಲ್ಲರೂ ಇವನನ್ನು ಪರಿಹಾಸ್ಯ ಮಾಡುತ್ತಿದ್ದರು, ನಾನೂ ಸೇರಿ. ಇದಾವುದನ್ನೂ ಲೆಕ್ಕಿಸದೆ ತನ್ನ ವ್ಯಾಸಂಗವನ್ನು ಮುಂದುವರೆಸುತ್ತಿದ್ದು, ಈ ನಾಟಕದ ಪದವಿ ನಂತರ ಪತ್ರಿಕೋದ್ಯಮದ 1... 112 ೦೬೧೩1617 ವ್ಯಾಸಂಗಕ್ಕೆ ಸೇರಿ ಅದರಲ್ಲಿಯೂ ಪದವಿ ಪಡೆದು, ನಂತರ ಪತ್ರಿಕೋದ್ಯಮ ಸ್ನಾತಕೋತ್ತರದ 1/4. 1೧ 0ಿಂ170700108/01 ಸೇರಿ ಅದರಲ್ಲಿ ಪ್ರಥಮ ದರ್ಜೆಯಲ್ಲಿ ತೇರ್ಗಡೆ ಹೊಂದಿದನು. ಇದರಿಂದಾಗಿ. ಇವನ ವಿದ್ಯಾರ್ಹತೆ. ಔ.580., ಔ.ಓ..  (ಬ:ಜಖ, ಔ.ಿ. (೮ಂ107070/13108/101)), 1... (ಲಿಂ1೫1173೬7108000), ಪದವೀಧರ. ನಂತರ ಫ್ಯಾಕ್ಟರಿ ಕೆಲಸದ ಜೊತೆಗೆ \"ಕನ್ನಡ ಪ್ರಭ' ಪತ್ರಿಕೆಯಲ್ಲಿ ದಿವಂಗತ ಖಾದ್ರಿ ಶಾಮಣ್ಣನವರ ನೇತೃತ್ವದಲ್ಲಿ ತರಬೇತಿ ಸಹ ಪಡೆದನು. ಈ ವ್ಯಾಸಂಗದ ಅವಧಿಯಲ್ಲಿ ನಾಟಕ ಪರಿಣಿತ ಶ್ರೀ ಬಿ.ವಿ. ಕಾರಂತರು, ಗಿರೀಶ್‌ ಕಾರ್ನಾಡ, ಪತ್ರಿಕೋದ್ಯಮದ ಶ್ರೀ ಲಂಕೇಶರವರಲ್ಲದೆ, ಅನೇಕ ವಿದ್ವಾಂಸರ ಸಹವಾಸ ಮತ್ತು ಪರಿಚಯ ಆಯಿತು. ಆಗಾಗ್ಗೆ ಬೆಂಗಳೂರು ಕಲಾಕ್ಷೇತ್ರದಲ್ಲಿ ಇವನ ನಿರ್ದೇಶನದಲ್ಲಿ ಅನೇಕ ನಾಟಕಗಳೂ ಅಭಿನಯಿಸಲ್ಪಟ್ಟತು. ಇದಕ್ಕಾಗಿ ಇವನಿಗೆ ಕೆಲವು ಬಹುಮಾನಗಳೂ ಲಭ್ಯವಾಗಿತ್ತು. ಜೊತೆಗೆ ಇವನು ಕಮ್ಯುನಿಸ್ಟ್‌ ಪಕ್ಷದಲ್ಲಿ ಸೇರಿ, ರಾಜಕೀಯವನ್ನೂ ಮಾಡುತ್ತಿದ್ದನು. ಈಗಲೂ ಈ ಕಮ್ಯುನಿಸಂ ಛಾಯೆ ಇವನಲ್ಲಿ ಉಳಿದಿದೆ. ಇವನ ಸಹವಾಸಿಗಳೂ ಸಹ ಕಮ್ಯುನಿಸಂರವರೇ ಆಗಿದ್ದಾರೆ. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ನಡೆಯುತ್ತಿದ್ದ ಧಾರ್ಮಿಕ ಕೆಲಸಗಳು ಇವನಿಗೆ ಹಿಡಿಸುತ್ತಿರಲಿಲ್ಲ. ಆ ಕಾರ್ಯದ ವೇಳೆ ಉದ್ದೇಶವಾಗಿ ಮನೆ ಹೊರಗೆ ಉಳಿಯುತ್ತಿದ್ದ. ಇವನಿಗೆ ಉಪನಯನ ಮಾಡಬೇಕೆಂದು ಸಂಕಲ್ಪ ಪಟ್ಟಾಗ ಇವನು ಒಪ್ಪಲಿಲ್ಲ. ನಾನೂ ಇವನ ವರ್ತನೆಯನ್ನು ಗಮನಿಸಿ ತಟಸ್ಕ್ಯನಾಗಬೇಕಾಯಿತು.", "ಹೀಗಿರುವಾಗ ಇವನಿಗೆ ಆಲ್‌ ಇಂಡಿಯಾ ರೇಡಿಯೋದಲ್ಲಿ ಪ್ರೋಗ್ರಾಂ ಎಕ್ಸಿಕ್ಯೂಟಿವ್‌ ಸಿಕ್ಕಿ ಗುಲ್ಬರ್ಗ ಆಲ್‌ ಇಂಡಿಯಾ ರೇಡಿಯೋ ಸ್ಟೇಷನ್‌ಗೆ ನೇಮಕವಾಯಿತು. ಬೆಂಗಳೂರು ಬಿಇಎಂಎಲ್‌ ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿದ್ದ ತನ್ನ ಕೆಲಸಕ್ಕೆ ರಾಜೀನಾಮೆ ಸಲ್ಲಿಸಿ ಗುಲ್ಬರ್ಗಕ್ಕೆ ರೇಡಿಯೋ ಸ್ಟೇಷನ್‌ಗೆ ಕೆಲಸಕ್ಕೆ ಸೇರಿಕೊಂಡನು. ಬಿಇಎಂಎಲ್‌ ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ಸುಮಾರು 8 ವರ್ಷ ಸರ್ವಿಸಾಗಿತ್ತು. ಈಗ ಇದುವರೆಗೆ"], ["ಬೆಂಗಳೂರಲ್ಲಿ ನಮ್ಮ ಸಂಸಾರದಲ್ಲಿದ್ದ ಇವನು ಗುಲ್ಬರ್ಗಕ್ಕೆ ಹೋಗಿ ಸಂಸಾರದಿಂದ ಬೇರೆಯಾದನು. ಆದರೂ ಬೆಂಗಳೂರಿನ ಸಂಸಾರಕ್ಕೆ ಆರ್ಥಿಕ ರೂಪವಾಗಿ ಸಹಾಯ ಮಾಡುತ್ತಿದ್ದನು. ಈ ಕಾಲದಲ್ಲಿಯೇ ಇವನಿಗೆ ಬೆಂಗಳೂರು ಬನಶಂಕರಿ, 3ನೇ ಸ್ಟೇಜಿನಲ್ಲಿ ಬಿಡಿಎ ಯಿಂದ 30740 ಅಡಿಗಳ ನಿವೇಶನ ಸುಮಾರು 8,000/- ರೂಗಳಿಗೆ ಮಂಜೂರಾಯಿತು. ಈಗ ಈ ನಿವೇಶನದಲ್ಲಿ ಮನೆ ಕಟ್ಟಿ ಬಾಡಿಗೆಗೆ ಕೊಟ್ಟಿದ್ದಾನೆ. ಈ ಕಾಲದಲ್ಲಿ “ಜಾವಾ' ಮೋಟಾರ್‌ ಸೈಕಲ್‌ ಸಹ ಕೊಂಡುಕೊಂಡಿದ್ದನು. ಈಗ ಅದು ಕಳುವಾಗಿ ಹೋಗಿದೆ.", "ಈ ಮಧ್ಯೆ ಇವನಿಗೆ ವಿವಾಹಕ್ಕೆ ನಮ್ಮ ಸ್ವಜಾತಿ ಹೆಣ್ಣುಗಳು ಅನೇಕ ಬಂದು ನಮ್ಮನ್ನು ಬಲವಂತದಿಂದ ಪ್ರಾರ್ಥಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು. ಇವನ ಅಣ್ಣ ಜೈರಾಂ ತಾನು ಮದುವೆಯಾದರೆ ಬಂದ ಹೆಣ್ಣು ಮಗಳು, ತಂದೆ ತಾಯಿಗಳಿಂದ ತನ್ನನ್ನು ಬೇರ್ಪಡಿಸುತ್ತಾರೆಂಬ ಸಂಶಯದಿಂದ, ತಾನು ವಿವಾಹವೇ ಆಗುವುದಿಲ್ಲವೆಂದು ಖಚಿತವಾಗಿದ್ದನು. ತನ್ನ ಇಬ್ಬರು. ಅಣ್ಣಂದಿರು ವಿವಾಹವಾಗಿ ಬೇರೆ. ವಾಸ ಮಾಡುತ್ತಿದ್ದದ್ದು ಇವನಿಗೆ ಈ ರೀತಿ ಪ್ರಭಾವಕ್ಕೆ ಕಾರಣವಾಯಿತು. ಚಿ. ರಮೇಶ ಪರಸ್ಕಳದಲ್ಲಿ ಏಕಾಂಗಿಯಾಗಿದ್ದುಕೊಂಡು ಊಟ ಉಪಚಾರಗಳಿಗೆ ಅನುಕೂಲವಾಗಲೆಂದೂ, ಇವನ ಅಣ್ಣ ಜೈರಾಮ ವಿವಾಹವಾಗುವುದೇ ಇಲ್ಲವೆಂದು ಖಚಿತವಾಗಿದ್ದುದ್ದರಿಂದಲೂ, ಮನೆಯಲ್ಲಿನ ಎಲ್ಲಾ ಹೆಣ್ಣು ಮಕ್ಕಳು ವಿವಾಹವಾಗಿರುವುದರಿಂದ, ಇವನಿಗೆ ವಿವಾಹ ಮಾಡಬೇಕೆಂಬುದು ನಮ್ಮ ಸಂಕಲ್ಪ ಇತ್ತು ಇವನಿಗೆ ಹೆಣ್ಣು ಕೊಡಲು ಬಂದಿದ್ದವರಲ್ಲಿ, ನಮ್ಮ ಹೆಬ್ಬಾರ್‌ ಶ್ರೀವೈಷ್ಣವರಲ್ಲಿ ಅತಿ ಐಶ್ವರ್ಯವಂತರಾಗಿರುವ ಶ್ರೀ ಕೆ.ವಿ. ನಾರಾಯಣ್‌ ಸಹ ಒಬ್ಬರು. ತಕ್ಕಷ್ಟು ಆರ್ಥಿಕ ಸಹಾಯ ಮಾಡಿ ವಿಜೃಂಭಣೆಯಿಂದ ವಿವಾಹ ಮಾಡಲು ಸಿದ್ಧರಿದ್ದರು. ಇವನು ಆಗ್ಲೆ ಗುಲ್ಬರ್ಗದಲ್ಲಿ ಡ್ಯೂಟಿ ಮೇಲಿದ್ದು. ಇವನು ಬೆಂಗಳೂರಿಗೆ ಬಂದಾಗ್ಗೆ ತಿಳಿಸಿದ ನಂತರ ಒಪ್ಪಿಗೆಗಾಗಿ ಹೆಣ್ಣನ್ನು ಕರೆತರಲು ಹೇಳಿ ಇವನ ಬೆಂಗಳೂರಿನ ಆಗಮನಕ್ಕೆ ನಿರೀಕ್ಷಿಸುತ್ತಿದ್ದೆವು.", "ಸೌ. ಶೈಲಾ ಮದುವೆಗೆ ಇವನು ಬಂದಿರುತ್ತಾನೆಂದು ತಿಳಿದು ಇಬ್ಬರು ಕನ್ಯಾಪಿತ್ಯಗಳು ಆದಿನ ಕಲ್ಯಾಣ ಮಂಟಪಕ್ಕೆ ಕನ್ಯಾ ಸಮೇತ ಬಂದಿದ್ದರು. ಉದ್ದೇಶ ಪೂರ್ವಕವಾಗಿಯೇ ಆ ಕಾಲದಲ್ಲಿ ಸ್ಥಳದಿಂದ ಗೈರು ಹಾಜರಾದನು. ಇದಕ್ಕೆ ಕಾರಣ ಮುಂದೆ ತಿಳಿಯಿತು.", "ಸೌ. ಶೈಲಾ ವಿವಾಹದ ನಂತರ, ಗುಲ್ಬರ್ಗಕ್ಕೆ ಡ್ಯೂಟಿಗೆ ಹೋಗಿ, ಅಲ್ಲಿ ತಾನು ಒಂದು ಹೆಣ್ಣನ್ನು ನೋಡಿ ಮದುವೆಯಾಗಲು ಒಪ್ಪಿರುವುದಾಗಿಯೂ, ಹುಡುಗಿಯು ಗ್ರಾಜುಯೇಟ್‌ ಆಗಿ ಒಳ್ಳೇ"], ["ಸಂಪ್ರದಾಯದ ಸಂಸಾರಕ್ಕೆ ಸೇರಿದವಳೆಂದೂ, ಬ್ರಾಹ್ಮಣ ಜಾತಿಯಾದರೂ, ನಮ್ಮ ಸ್ವಜನ ಶ್ರೀ ವೈಷ್ಣವರಲ್ಲವೆಂದೂ, ಇದಕ್ಕೆ ಒಪ್ಪಿಗೆ ಕೊಡಬೇಕೆಂದೂ ನನಗೆ ಪತ್ರ ಬರೆದಿದ್ದನು. ಈ ವೇಳೆಗೆ ನಾನು ಹುಳಿಯಾರು ವಾಸವನ್ನು ಬಿಟ್ಟು ಬೆಂಗಳೂರಿಗೆ ಬಂದು ಎಲ್ಲರೊಡನೆ ವಾಸಿಸುತ್ತಿದ್ದೆ. ನೀನು ಬರೆದಿರುವ ಎಲ್ಲಾ ವಿಚಾರಗಳೂ ಸರಿ, ಆದರೆ ನಮ್ಮ ಸ್ವಜನ ಅಲ್ಲದ್ದರಿಂದ ಮುಂದೆ ಸಂಸಾರದಲ್ಲಿ ನಮ್ಮ ಆಚಾರ, ವಿಚಾರ, ಸಂಪ್ರದಾಯಗಳಿಗೆ ಸರಿ ಹೊಂದುವುದು ಕಷ್ಟ ಇಲ್ಲೇ ಬೇಕಾದಷ್ಟು ಮಂದಿ ಹೆಣ್ಣು ಕೊಡಲು ಸಿದ್ಧರಿರುವಾಗ ನೀನು ಆತುರಪಡುವುದು ಸೂಕ್ತವಲ್ಲ ಎಂದು ಉತ್ತರಿಸಿ, ಪುನರಾಲೋಚಿಸಲು ಉತ್ತರ ಬರೆದೆನು.", "ಒಂದು ದಿನ ಕನ್ಯಾ ಜೊತೆಯಲ್ಲಿ ತಂದೆ, ತಾಯಿ, ಬೆಂಗಳೂರಿಗೆ ನಮ್ಮ ಮನೆಗೆ ಬಂದು ಕನ್ಯಾ ತೋರಿಸಿ ಒಪ್ಪಿಗೆಗೆ ಬಂದಿದ್ದರು. ಈ ಸಂಬಂಧ ನನಗೆ ಒಪ್ಪಿಗೆ ಇರಲಿಲ್ಲವಾಗಿ, ಉದ್ದಿಶ್ಯಯವಾಗಿ ಆ ದಿನ ಮನೆಯಲ್ಲಿರದೆ ತಪ್ಪಿಸಿಕೊಂಡೆನು. ನನ್ನ ಪತ್ನಿ ಸೌ. ಅಲಮೇಲಳಿಗೆ ಹುಡುಗಿ ಒಪ್ಪಿಗೆಯಾಗಿ, ನನ್ನ ಒಪ್ಪಿಗೆಗೆ ನಿರೀಕ್ಷಿಸುತ್ತಿದ್ದರು. ಇಲ್ಲಿ, ನಮ್ಮ ಮನೆಯವರೆಲ್ಲಾ, ಅವನು ಒಪ್ಪಿರುವುದು ಬ್ರಾಹ್ಮಣರ ಹುಡುಗಿ, ನೋಡಿದ್ದಲ್ಲಿ ಸಂಪ್ರದಾಯಸ್ಥರಾಗಿ ಕಾಣುತ್ತಾರೆ. ಅವನು ಬ್ರಾಹ್ಮಣೇತರ ಜಾತಿಯ ಹೆಣ್ಣನ್ನು ರಿಜಿಸ್ಟರ್ಡ್‌ ವಿವಾಹದ ಮೂಲಕ ಮದುವೆಯಾದರೆ ನೀವೇನು ಮಾಡುತ್ತೀರಿ. ನಡವಳಿಕೆಯಿಂದಾಗಿ ದೊಡ್ಡವರಾದ ನಮಗೆ ಮರ್ಯಾದೆ ಕೊಟ್ಟು, ನಮ್ಮ ಒಪ್ಪಿಗೆ ಕೇಳುತ್ತಿರುತ್ತಾನೆ. ಮುಂದೆ ಆ ಹುಡುಗಿಯ ಬಳಿ ಸಂಸಾರ ಮಾಡತಕ್ಕವನು ಅವನು. ಆದ್ದರಿಂದ ನನ್ನ ಒಪ್ಪಿಗೆ ಕೊಡುವುದು ಸೂಕ್ತ ಎಂದು ಮನೆಯಲ್ಲಿ ಎಲ್ಲರೂ ಹೇಳಿದರು. ನಮ್ಮ ಒಪ್ಪಿಗೆ ದೊರೆಯದಿದ್ದರೆ, ಅವನು ರಿಜಿಸ್ಟರ್ಡ್‌ ಮೂಲಕ ಮದುವೆಯಾಗುವುದು ಖಂಡಿತ. ಆದ್ದರಿಂದ ನನ್ನ ಒಪ್ಪಿಗೆಯನ್ನು ಕೊಟ್ಟು, ಅವನು ಹಿರಿಯರಿಗೆ ತೋರಿಸಿದ ಗೌರವವನ್ನು ಉಳಿಸಿಕೊಳ್ಳುವುದು ಉತ್ತಮ ಎಂದು ನನಗೂ ಭಾಸವಾಯಿತು. ನನ್ನ ಹಿರಿಯ ಮಗ ನಾಗರಾಜನ ವಿವಾಹ ವಿಚಾರದಲ್ಲಿ ನಾನು ಆಗಲೇ ಮೋಸಕ್ಕೆ ಒಳಪಟ್ಟು ಅವನ ಭಾವೀ ಸಂಸಾರವನ್ನು ಹಾಳು ಮಾಡಿದ ದೃಷ್ಟಾಂತರದಿಂದ.. ಮುಂದೆ. ಯಾವ ಗಂಡು ಮಕ್ಕಳ ವಿವಾಹಕ್ಕೂ ಹೆಚ್ಚು ಜವಾಬ್ದಾರಿವಹಿಸುವುದು ಸೂಕ್ತವಲ್ಲ ಎಂಬ ಅರಿವು ಉಂಟಾಗಿತ್ತು. ಈ ರೀತಿಯ ಅನುಭವದಿಂದಲೇ ಚಿ. ಸುಪರ್ಣನ ವಿವಾಹದ ವಿಚಾರದಲ್ಲಿ ಹೆಚ್ಚು ಜವಾಬ್ದಾರಿವಹಿಸದೆ ವಿವಾಹವಾಗಲಿರುವ ಅವರುಗಳ ಜವಾಬ್ದಾರಿಗೆ ಬಿಡುವುದು ಸೂಕ್ತವೆಂಬ ಅಭಿಪ್ರಾಯಕ್ಕೆ ಬಂದಿದ್ದೆ. ಹಿರಿಯ ಮಗ ನಾಗರಾಜನ ವಿವಾಹದ ಸಂದರ್ಭದಲ್ಲಿ ನನ್ನ ಭಾಗದಲ್ಲಿ ಯಾವುದೇ ರೀತಿಯ ಕರ್ತವ್ಯಲೋಪವಿಲ್ಲದಿದ್ದರೂ, ಬೇರೆಯವರಿಂದ ಆದ ಮೋಸಕ್ಕೆ ನನ್ನ ತಂದೆ ತಾಯಿಗಳು ಸರಿಯಾಗಿ ಪರಿಶೀಲಿಸದೆ ಹೀಗಾಯಿತೆಂದು ಒಂದು ಬಾರಿ ನನ್ನ"], ["ಮಗ ಚಿ. ನಾಗರಾಜ ಹೇಳಿದ್ದು ಜ್ಞಾಪಕಕ್ಕೆ ಬಂದಿತು. ಆದ್ದರಿಂದ ಇವುಗಳನ್ನೆಲ್ಲಾ ಯೋಜಿಸಿ, ನಿನ್ನ ಇಷ್ಟದಂತೆ ಮಾಡಿಕೊಳ್ಳಬಹುದೆಂದು ನನ್ನ ಅಭಿಪ್ರಾಯ ಎಂದು ಹೇಳಿ ಒಪ್ಪಿಗೆ ಕೊಟ್ಟಿನು.", "ಬೇರೆ ಊರುಗಳಲ್ಲಿ ಮದುವೆ ಜರುಗಿದರೆ, ನಾವುಗಳು ಯಾರೂ ಮದುವೆಗೆ ಬರುವುದಿಲ್ಲ ಎಂದು ತಿಳಿದು, ಬೆಂಗಳೂರಿನಲ್ಲಿಯೇ ಒಂದು ಮದುವೆ ಏರ್ಪಾಡು ಮಾಡಲು ಹೆಣ್ಣಿನವರಿಗೆ ಹೇಳಿ, ನಮ್ಮ ವಾದ್ಕಾರು, ನಮ್ಮ ಸಂಪ್ರದಾಯದಂತೆ 8.4.1983ರಂದು ಬೆಂಗಳೂರು ದೇವಯ್ಯ ಪಾರ್ಕ್‌ ಬಳಿ ಇರುವ ಛತ್ರದಲ್ಲಿ ಒಂದು ದಿನದ ಮಟ್ಟಿಗೆ ಸಂಕ್ಷೆಪವಾಗಿ ವಿವಾಹ ನೆರವೇರಿತು. ಮದುವೆ ಸಂದರ್ಭದಲ್ಲಿ ಬೇಕಾದಷ್ಟು ಉಡುಗೊರೆಗಳನ್ನು ಕೊಡಲು ಒಪ್ಪಿದವರನ್ನು ಬಿಟ್ಟ ನತದೃಷ್ಟ ಈ ಮದುವೆಗೆ ಆಹ್ವಾನ ಪತ್ರಿಕೆ ಅಚ್ಚು ಹಾಕಿಸಿರಲಿಲ್ಲ. ನಮ್ಮ ಮನೆಯ ಜನಗಳು ಮಾತ್ರ ಮದುವೆಯಲ್ಲಿ ಭಾಗವಹಿಸಿದ್ದೆವು.", "ಸೌ. ದೇವಕಿಯ ವಿವಾಹವಾದ ಕಾಲದ ಪರಿಸ್ಥಿತಿ, ಈ ಕಾಲಕ್ಕೆ ಸ್ವಲ್ಪ ಬದಲಾಗಿತ್ತು. ಸೌ. ದೇವಕಿ ಸಂಬಂಧ ದ್ವೈತ. ಜಿ. ರಮೇಶನ ಸಂಬಂಧ ಅದ್ವೈತ. ನಮ್ಮದು ವಿಶಿಷ್ಟಾದ್ವೈತ. ಹೀಗಾಗಿ ನಮ್ಮ ಮನೆಯಲ್ಲಿ, ಆದಿ ಶಂಕರರ ಅದ್ವೈತ, ಶ್ರೀ ರಾಮಾನುಜರ ವಿಶಿಷ್ಟಾದ್ವೈತ, ಮಧ್ವಾಚಾರ್ಯರ ದ್ವ್ಯೈತಗಳ ಸಂಬಂಧವೂ ಸೇರಿತು. ನನ್ನ ಪಿತ್ಕ್ಯ ಸಂಪ್ರದಾಯಸ್ಮರಾದ ದಿವಂಗತ ನಾರಾಯಣ ಅಯ್ಯಂಗಾರ್‌ ವಂಶಕ್ಕೆ 3 ದ್ವೈತಗಳೂ ಸೇರಿದ್ದಾಯಿತು.", "ಈ ಮೂರು ದ್ವೈತಗಳ ಆದಿ ಒಂದೇ ಆಗಿದ್ದು, ತ್ರಿಮತಸ್ಥ ಬ್ರಾಹ್ಮಣರಲ್ಲಿ ವಿವಾಹವಾಗುವುದು ಸೂಕ್ತವೆಂಬ ಆಚರಣೆ ಈಗೀಗ ತ್ರಿಮತಸ್ಥರಲ್ಲಿಯೂ ಆಚರಣೆಗೆ ಬಂದಿದೆ. ಆದರೆ ಎಲ್ಲಾ 3 ದ್ವೈತಗಳ ಆಚರಣೆ ಭಿನ್ನ ರೀತಿಯಾಗಿರುವುದರಿಂದ ಮುಂದಿನ ಜೀವನದಲ್ಲಿ ಭಿನ್ನವಾದ ಆಚರಣೆಗೆ ಅವಕಾಶವಾಗಬಹುದೆಂಬುದೇ ನನ್ನ ಯೋಜನೆಯಾಗಿದೆ. ಆದರೆ ಬುಣಾನುಬಂಧಕ್ಕೆ ಯಾರೂ ಏನೂ ಮಾಡುವಂತಿಲ್ಲ ಎಂಬುದು ನನ್ನ ಅನುಭವಕ್ಕೆ ಪ್ರತ್ಯಕ್ಷವಾಯಿತು. ಈ ವಿವಾಹದ ನಂತರ ರಮೇಶನಿಗೆ ದೆಹಲಿ ದೂರದರ್ಶನ ಕಚೇರಿಗೆ ವರ್ಗವಾಗಿ, ನಂತರ ಬೆಂಗಳೂರು ದೂರದರ್ಶನದ ಕಚೇರಿಗೆ ವರ್ಗವಾಗಿ ಬಂದಿದ್ದಾನೆ. ಬೆಂಗಳೂರಲ್ಲಿ ಬೇರೆ ಮನೆ ಮಾಡಿಕೊಂಡು ವಾಸಿಸುತ್ತಿದ್ದಾನೆ.", "ಇವನ ಹೆಂಡತಿ ಸೌ. ರತ್ನ- ತಂದೆ ದಿವಂಗತ ನಾರಾಯಣರಾವ್‌ ಸಂಪ್ರದಾಯಸ್ಥ ದಕ್ಷಿಣ ಕನ್ನಡ ಬ್ರಾಹ್ಮಣರು. ಉತ್ತಮ ವಂಶೀಯರು, ಸಂಪ್ರದಾಯಸ್ಥರು. ಸೌ. ರತ್ನ ಬಿ.ಎ. ಪದವೀಧರೆ. ಒಳ್ಳೆಯ"], ["ನಡವಳಿಕೆ, ಬೆಂಗಳೂರಿಗೆ ಬಂದನಂತರ, ನಮ್ಮ ಮನೆಯ ಸಂಪ್ರದಾಯಗಳನ್ನೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ಅರಿತು ಆಚರಿಸುತ್ತಿರುವುದು ನನಗೆ ಬಹಳ ಸಂತೋಷವೇ ಆಗಿದೆ. ನಮ್ಮ ಸಂಸಾರದ ಕಷ್ಟ, ಸುಖಗಳಲ್ಲಿ ಭಾಗವಹಿಸುತ್ತಿದ್ದಾಳೆ. ನಮ್ಮ ಸ್ವಜನವೇ ಆದ 2ನೇ ಸೊಸೆ, ಚಿ. ಸುಪರ್ಣನ ಹೆಂಡತಿ, ನಮ್ಮ ಸಂಸಾರ ಮತ್ತು ಕಷ್ಟ ಸುಖಗಳಲ್ಲಿ ಇನ್ನೂ ಭಾಗಿಯಾಗಿಲ್ಲ. 2ನೇ ಸೊಸೆ. ಸ್ವಜನ ಎಂದು ಮಾತ್ರ ಹೇಳಿಕೊಳ್ಳಬಹುದು.", "ಶ್ರೀ ರಾಮಾನುಜರ ಸಂಪ್ರದಾಯದಂತೆ, ಸೌ, ರತ್ನಳಿಗೆ \"ಸಮಾಶ್ರಮಣ', “ಚಂಕ್ರಾಕಿತ' ಮಾಡಿಸಿದರೆ, ನಮ್ಮ ಆಚಾರ್ಯರಿಂದ ಅವಳೂ ಶ್ರೀ ವೈಷ್ಣವಳೇ ಆಗುತ್ತಾಳೆ. ನಮ್ಮ ಸಂಪ್ರದಾಯದಲ್ಲಿ ಶ್ರೀವೈಷ್ಣವರ ಹೊಟ್ಟೆಯಲ್ಲಿ... ಜನಿಸಿದರೂ, \"ಸಮಾಶ್ರವಣ' . “ಚಕ್ರಾಂಕಿತ'ವಾಗುವವರೆಗೆ ಶ್ರೀವೈಷ್ಣವರಾಗುವುದಿಲ್ಲ ಯಾವ ಜಾತಿಯಲ್ಲಿಯೇ ಜನ್ಮತಾಳಿದ್ದರೂ, ಆಚಾರ್ಯರ “ಸಮಾಶ್ರವಣ', ಅಥವಾ “ಚಕ್ರಾಂಕಿತ' ಆದರೆ ಅವನು ವೈಷ್ಟವನಾಗುತ್ತಾನೆ. ಇದು ಶ್ರೀ ರಾಮಾನುಜಾಚಾರ್ಯರ ಆದೇಶ. ಆದ್ದರಿಂದ ಸೌ. ರತ್ನಳಿಗೆ ಆಚಾರ್ಯರಿಂದ \"ಸಮಾಶ್ರವಣ' ಅಥವಾ “ಚಕ್ರಾಂಕಿತ' ಮಾಡಿಸಿ ಶ್ರೀವೈಷ್ಟವತ್ವಕ್ಕೆ ಪರಿವರ್ತಿಸುವುದು ಸೂಕ್ತವೆಂಬ ನನ್ನ ಅಭಿಪ್ರಾಯವನ್ನು ಇಲ್ಲಿ ಸೂಚಿಸಲು ಇಷ್ಟಪಡುತ್ತೇನೆ.", "ಸೌ. ಶೈಲಾ ವಿವಾಹವಾಗಿ ತನ್ನ ಮನೆಗೆ ಪ್ರಯಾಣ ಮಾಡಿದ ನಂತರ ಮನೆಯಲ್ಲಿದ್ದವರು ನಾನು, ಅಲಮೇಲ, ಜೈರಾಂ ಮತ್ತು ನಾಗರಾಜನ ಮಗ \"ಗರುಡ' (ದೀಪು). ಒಟ್ಟು 4 ಜನ ಮಾತ್ರ. ನಮ್ಮ ಮನೆಯಲ್ಲಿ ಆದಿಯಿಂದ ಯಾವಾಗಲೂ 10 ಜನಕ್ಕೆ ಕಮ್ಮಿ ಇರುತ್ತಿರಲಿಲ್ಲ.", "ಅಲಮೇಲಳ ನಿಧನ", "ಇದೇ ವೇಳೆಯಲ್ಲಿ 14 ವರ್ಷಗಳಿಂದ ವಾಸವಾಗಿದ್ದ ಶೇಷಾದ್ರಿಪರದ ಆಂಜನೇಯ ಬ್ರಾಕ್‌ನಲ್ಲಿದ್ದ ನಮ್ಮ ವಾಸವನ್ನು ಮಲ್ಲೇಶ್ವರಂ 7ನೇ ಕ್ರಾಸ್‌ ಮನಗೆ ಬದಲಾಯಿಸಿದೆವು. ಶೇಷಾದ್ರಿಪರದ ಮನೆಯು ವಿಶಾಲವಾಗಿದ್ದು, ಆ ಬೀದಿಯು ಅಲಮೇಲಳಿಗೆ ಹೆಚ್ಚು ಆಪ್ತ ಸಹಪಾಠಿಗಳಿದ್ದರು. ಮಲ್ಲೇಶ್ವರದ ಮನೆ ಕಿರಿದಾಗಿದ್ದು. ಸ್ವಲ್ಪ ಕತ್ತಲೆಯಾಗಿ, ಹಗಲು ಹೊತ್ತೂ ಎಲೆಕ್ಟಿಕ್‌ ದೀಪದಲ್ಲಿರಬೇಕಾಗಿತ್ತು ಮನೆಯಲ್ಲಿ ಕೇವಲ 4 ಜನಗಳಿದ್ದು, ಹಗಲು ವೇಳೆ ನಾನು, ಜೈರಾಂ ಮತ್ತು ಗರುಡ ಹೊರಗಡೆಗೆ ಹೋಗಿದ್ದು, ಮನೆಯಲ್ಲಿ ಅಲಮೇಲ ಒಬ್ಬಳೇ ಉಳಿಯುತ್ತಿದ್ದುದು ಮತ್ತು ಆ ಬೀದಿಯಲ್ಲಿ ಸಹಪಾಠಿಗಳಿಲ್ಲದಿದ್ದದೂ, ಶೈಲಾ ವಿವಾಹವಾಗಿ ಗಂಡನ ಮನೆಗೆ ಪ್ರಯಾಣ ಮಾಡಿದ್ದೂ ಆಗಿ ಸೌ. ಅಲಮೇಲಳಿಗೆ ಹೆಚ್ಚು ಬೇಜಾರಿಗೆ"], ["ಕಾರಣವಾಯಿತು. ಸೌ. ಅಲಮೇಲಳಿಗೆ ಮೊದಲೇ ೫71100 ಇತ್ತು ಜೊತೆಗೆ 116೧ ೫8 ಪ್ರಾರಂಭವಾಗಿ 116೫ 7೮೫ ಆಯಿತು. ಕಾರಣ ಅವಳಿಗೆ, ಮನೋಭ್ರಾಂತಿಯಾಯಿತು. ಅವಳನ್ನು (6% ಮಾಡುತ್ತಿದ್ದ ಡಾಕ್ಟರು ಹೆಚ್ಚು ವಿಶ್ರಾಂತಿಗೆ ಸಲಹೆ ಮಾಡುತ್ತಿದ್ದರು. ಆದರೂ ವಿಧಿಯಿಲ್ಲದೆ ಅಡುಗೆ ಮಾಡುತ್ತಿದ್ದಳು. ಡಾಕ್ಟರು ಅಡಿಗೆ ಸಹ ಮಾಡಕೂಡದೆಂದು ಹೇಳುತ್ತಿದ್ದರೂ ಈ ವೇಳೆಯಲ್ಲಿ ಜೈರಾಮನಿಗೆ ಮದುವೆ ಮಾಡಿಕೊಳ್ಳಲು ಹೇಳುತ್ತಿದ್ದರೆ, ಅವನು ವಿವಾಹಕ್ಕೆ ಒಪ್ಪುತ್ತಿರಲಿಲ್ಲ. ಕಾರಣ ಮನೆಗೆ ಬಂದ ಸೊಸೆ ತಂದೆ ತಾಯಿಗಳನ್ನು ಸರಿಯಾಗಿ ಉಪಚರಿಸದೆ, ತಾನೂ ಬೇರೆ ಸಂಸಾರ ಹೂಡುವ ಸಂದರ್ಭ ಬಂದಲ್ಲಿ ತಂದೆತಾಯಿಗಳ ಪಾಡು ಏನು ಎಂಬುದಾಗಿ ಯೋಚಿಸುತ್ತಾ ವಿವಾಹಕ್ಕೆ ಒಪ್ಪುತ್ತಿರಲಿಲ್ಲ. ಎಷ್ಟೋ ಹೆಣ್ಣುಗಳು ವಿವಾಹಕ್ಕೆ ಬಂದಿದ್ದರೂ, ಕೇಳಿದರೆ ಈಗಾಗಲೇ ಮನೆಗೆ 3 ಜನ ಸೊಸೆಗಳು ಬಂದಿದ್ದಾರೆ, ನಮಗೆ ಆಗುತ್ತಿರುವ ಪ್ರಯೋಜನವಾದರೂ ಏನು? ನಾನೂ ಎಲ್ಲರಂತೆ ವಿವಾಹವಾಗಿ ಬೇರೆ ವಾಸಕ್ಕೆ ಹೋಗಿಬಿಟ್ಟರೆ ನಿಮ್ಮಗಳ ಪಾಡೇನು? ಎಂದು ಹೇಳುತ್ತಿದ್ದ. ಚಿ. ಜೈರಾಂ ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲೇ ಪರಸ್ಕಳಗಳಲ್ಲಿ ಬಹಳ ಕಷ್ಟಗಳನ್ನು ಅನುಭವಿಸಿ, ತಂದೆತಾಯಿಗಳ ಮೇಲೆ ಹೆಚ್ಚಿನ ಅಭಿಮಾನವನ್ನು ಹೊಂದಿದ. ಈಗಲೂ ತಂದೆ ತಾಯಿ, ಅಣ್ಣ ತಮ್ಮಂದಿರು, ಅಕ್ಕ ತಂಗಿಯರ ಮೇಲೆ ಎಲ್ಲರಿಗಿಂತ ಹೆಚ್ಚಿನ ಅಭಿಮಾನವನ್ನು ಇಟ್ಟುಕೊಂಡಿದ್ದಾನೆ.", "ಜೆ. ಗರುಡನಿಗೆ, ಮಲ್ಲೇಶ್ವರಂ ಮನೆ ೫1೦೯೫7 ಆದ ಕಾರಣದಿಂದ ಅವನನ್ನು ಅವನ ತಾಯಿಯ ತಾಯಿ (ಅಜ್ಜಿ) ಮನೆಗೆ ಕಳುಹಿಸಿದ್ದಾಯಿತು. ಉಳಿದವರು ನಾವು 3 ಮಂದಿ ಮಾತ್ರ ಇದರಿಂದಾಗಿ ಅವಳ ದೇಹಸ್ಥಿತಿ ವಿಷಮಿಸಿ, ಅವಳನ್ನು ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಯ ೮೫:6101007 26087760 ಗೆ ಸೇರಿಸಿದ್ದಾಯಿತು. 2150110 ಮೊದಲೇ ಇದ್ದ ಅವಳಿಗೆ ೫8 ಹೆಚ್ಚಾಗಿ 116೫ 168% ಆಗಿದ್ದಕ್ಕೆ ಇನ್ನೂ ಒಂದು ಮುಖ್ಯ ಕಾರಣವಿದೆ.", "ಈ ಕಾಲದಲ್ಲಿ ನನ್ನ 4ನೇ ಮಗಳು ಸೌ. ನಳಿನಿ ಮತ್ತು 5ನೇ ಮಗಳು ಸೌ. ಶೈಲ- ಇಬ್ಬರಿಗೂ ಗಂಡು ಮಕ್ಕಳು ಪ್ರಸವ ಆಗಿ ಇಬ್ಬರ ಬಾಣಂತನ ಮಾಡಿದ್ದೂ ಒಂದು ಮುಖ್ಯ ಕಾರಣವಾಯಿತು. ಈ ಇಬ್ಬರು ಹೆಣ್ಣು ಮಕ್ಕಳು ಬಾಣಂತನ ಪೂರೈಸಿಕೊಂಡು ಅವರುಗಳ ಮನೆಗೆ ಹಿಂತಿರುಗಿದ ತರುವಾಯ ಸೌ. ಅಲಮೇಲಳ ದೇಹಸ್ಥಿತಿ ಉಲ್ಬಣವಾಯಿತು. ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆ ಮತ್ತು ಬೌರಿಂಗ್‌ ಆಸ್ಪತ್ರೆ ಎರಡೂ ಕಡೆ ಚಿಕಿತ್ಸೆ ಮಾಡಲಾಯಿತು."], ["ಈ ವೇಳೆಯಲ್ಲಿ ಚಿ. ರಮೇಶನ ಹೆಂಡತಿ ಸೌ. ರತ್ನ ಹೆರಿಗೆಗಾಗಿ ತನ್ನ ತಾಯಿ ಮನೆಗೆ ಹೋಗಿದ್ದು ಅವಳಿಗೆ ಹೆಣ್ಣು ಮಗು ಜನನವಾಯಿತು (6.7.1985. ಈ ಕಾಲದಲ್ಲಿ ರತ್ನ ಅಲಮೇಲಳ ಸಹಾಯಕ್ಕಿರಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ರತ್ನ ಇಲ್ಲಿದ್ದರೆ ಸ್‌. ಅಲಮೇಲಳ ಸಹಾಯಕ್ಕೆ ಉತ್ತಮವಾಗಿರುತ್ತಿತ್ತು.", "ಗುಲ್ಬರ್ಗಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋಗಿದ್ದೆವು. ಅಲ್ಲಿಂದ ಹಿಂತಿರುಗಿದ ತಕ್ಷಣ ಅವಳ ಆರೋಗ್ಯ ಕ್ಷೀಣಿಸಿತು.", "ಅವಕಾಶ ಇಲ್ಲವಾಯಿತು. ಸೌ. ಅಲಮೇಲಳ ದೇಹಸ್ಥಿತಿ ಉಲ್ಬಣವಾಗುತ್ತಿದ್ದಂತೆಯೇ ಬೇರೆ ಊರುಗಳಲ್ಲಿದ್ದ ನಮ್ಮ ಹೆಣ್ಣು ಮಕ್ಕಳನ್ನು ಕರೆಸಿಕೊಂಡಿದ್ದಾಯಿತು. ದೂರ ರಾಜಾಸ್ಥಾನದಲ್ಲಿದ್ದ ಸೌ. ಶೈಲಾ ಬೆಂಗಳೂರಿಗೆ ಬಂದಳು. ವಿಕ್ಟೋರಿಯಾ ಆಸ್ಪತ್ರೆಯ ಸ್ಪೆಷಲ್‌ ವಾರ್ಡ್‌ನಲ್ಲಿ ದಿನವೂ ರಾತ್ರಿ ವೇಳೆ ಅವಳ ಜೊತೆಗೆ ಬೇರೆಯವರು ಮಲಗುತ್ತಿದ್ದರು. ಸೌ. ಅಲಮೇಲ ಮೃತಪಟ್ಟ ದಿವಸ ಅವಳ ಹಿರಿಯ ಮಗಳು ಸೌ. ವಿನತ ಮತ್ತು ಹಿರಿಯ ಮಗ ಜಿ. ನಾಗರಾಜ ಅವರ ಜೊತೆಯಲ್ಲಿ ಮಲಗಿದ್ದರು. ತಾ. 23.9.1985 ಭಾದ್ರಪದ ಶುಕ್ಲ ದಶಮಿ ಬೆಳಗಿನ ಜಾವ ಸೌ. ಅಲಮೇಲಳ ಪ್ರಾಣಪಕ್ಷಿ ಹಾರಿ ಹೋಗಿ ಶ್ರೀ ವೈನತೇಯನ ಪಾದಾರಾವಿಂದವನ್ನು ಸೇರಿದಳು.", "ನಂತರ ಮಲ್ಲೇಶ್ವರದ ಮನೆಗೆ ಕರೆತಂದು ಎಲ್ಲಾ ಕರ್ಮಗಳನ್ನು ಪೂರೈಸಿದ್ದಾಯಿತು. ಅಗ್ನಿಸ್ಪರ್ಷವಾಗಿ ಕೆಲವೇ ಕ್ಷಣಕ್ಕೆ ನನ್ನ 4ನೇ ಮಗ ಚಿ. ಶ್ರೀಧರ ಬಂದನು. ಅವನಿಗೆ ತಾಯಿಯ ಮುಖ ಸಹ ಸಿಕ್ಕಲಿಲ್ಲ. ನಿಧನದ ಸುದ್ದಿ ತಿಳಿದ ನನ್ನ 5ನೇ ಸೊಸೆ ತನ್ನ ಎಳೆಯ ಮಗುವಿನೊಮದಿಗೆ ಗುಲ್ಬರ್ಗದಿಂದ ಎರಡು ದಿನಗಳ ನಂತರ ಬೆಂಗಳೂರಿಗೆ ಬಂದಳು. ಸೌ. ಅಲಮೇಲಳ ನೆನಪಿಗಾಗಿ, ಆಗಲೇ ಜನನವಾಗಿದ್ದ ತನ್ನ ಮಗಳಿಗೆ, ಚಿ. ರಮೇಶ ತನ್ನ ತಾಯಿಯ ಹೆಸರು ಅಲಮೇಲ ಎಂದು ನಾಮಕರಣ ಮಾಡಿದ.", "ಇವಳ ಕರ್ಮಾದಿಗಳ ಕೆಲಸ ಕಾರ್ಯಗಳಲ್ಲಿ ಚಿ. ಜೈರಾಂ ಮುಂದಾಳತ್ವ ವಹಿಸಿ, ಸಾಂಗವಾಗಿ ಯಾವುದೇ ಲೋಪ ದೋಷಗಳಿಲ್ಲದಂತೆ ಶಾಸ್ತೋಕ್ತವಾಗಿ ಸುಮಾರು 20,000/- ರೂ ಖರ್ಚಿನಿಂದ ಎಲ್ಲವನ್ನೂ ನನ್ನ ಮಕ್ಕಳು ಶ್ರದ್ಧೆಯಿಂದ ನೆರವೇರಿಸಿದರು.", "ಸೌ. ಅಲಮೇಲಳ ದೇಹ ಸ್ಥಿತಿ ಉಲ್ಬಣವಾಗುವ ಮೊದಲು, ಅವಳ ಜೀವಂತ ಕಾಲದಲ್ಲಿ ಚಿ. ರಮೇಶ ತೆಗೆಸಿರುವ ಒಂದು ವಿಡಿಯೊ ಚಿತ್ರವು ಮನೆಯಲ್ಲಿದೆ."], ["ಸೌ... ಅಲಮೇಲ ಜೀವಾವಧಿಯನ್ನು ಅವಲೋಕಿಸಿದಾಗ ಕಾಣುವುದು ಏನೆಂದರೆ, ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ವಿವಾಹವಾಗಿ ನಮ್ಮ ಮನೆಗೆ ಬಂದು ಗಂಡ, ಮಾವ ಮತ್ತು ಅತಿಗೆಗೆ ಮೆಚ್ಚುಗೆಯಾಗಿ ಸದ್ಗಹಿಣೆಯಾಗಿದ್ದು ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ಪತಿ ಮತ್ತು ಮಕ್ಕಳೊಡನೆ ಪರಸ್ಥಳ ತಿರುಗಿ ಎಲ್ಲರೊಡನೆ ಆತ್ಮೀಯತೆ, ಮಾರ್ಗದರ್ಶಿಯಾಗಿದ್ದಳು. ಪತಿ, ಮಕ್ಕಳಿಗೆ ಯಾವುದೇ ರೀತಿಯಲ್ಲಿ ಕಷ್ಟ ತೊಂದರೆ ಕೊಡದೆ, ಹತ್ತು ಮಕ್ಕಳನ್ನು ಹೊತ್ತು ಹೆತ್ತು. ಸಾಕಿ ವಿದ್ಯಾವಂತರನ್ನಾಗಿ ಮಾಡಿ, ಎಲ್ಲರಿಗೂ ವಿವಾಹ ಮಾಡಿದಳು. ಗಂಡು ಮಕ್ಕಳೆಲ್ಲಾ ಸಂಪಾದನೆ ಮಾಡುತ್ತಾ ಸ್ವಪ್ರೀತಿಯಿಂದ ಇರುವಾಗ, ಹೆಣ್ಣು ಮಕ್ಕಳು ಅವರವರ ಮನೆಯಲ್ಲಿ ಸುಖವಾಗಿ ಬಾಳುತ್ತಿರುವಾಗ, ಮೊಮ್ಮಕ್ಕಳು, ಮರಿಮಕ್ಕಳು ಇರುವಾಗ ಸಾವನ್ನು ಅಪ್ಪಿದಳು. ಇವುಗಳನ್ನು ವೀಕ್ಷಿಸಲು ಹೆಚ್ಚು ಅವಕಾಶ ಸಿಗಲಿಲ್ಲ. ಅವಳಿಗೆ, ನಮ್ಮ ಮನೆಗೆ ವಿವಾಹವಾಗಿ ಬಂದು, ನಮ್ಮ ವಂಶವನ್ನು ಉದ್ಧಾರ ಮಾಡಿ, ಎಲ್ಲಾ ಹೆಣ್ಣು ಮಕ್ಕಳಿಗೆ ವಿವಾಹ ಇತ್ಯಾದಿ ಮಾಡಿ, ತನ್ನ ಈ ಜನ್ಮದ ಕಾರ್ಯ ಪೂರೈಸಿಕೊಂಡು ಕೊನೆ ಉಸಿರೆಳೆದಳು. ಪತಿಯಾದ ನನಗ ಯಾವ ಕಷ್ಟವನ್ನೂ ಕೊಡಬಾರದೆಂದು, ಎಲ್ಲಾ ಕರ್ತವ್ಯಗಳನ್ನೂ ಮುಗಿಸಿ ದೇವರಪಾದ ಸೇರಿದಳು. ಸಂಸಾರದಲ್ಲಿ ಎಷ್ಟೇ ಕಷ್ಟಗಳು ಬಂದರೂ ಸಹಿಸಿಕೊಂಡು ನನಗೆ ಯಾವುದೇ ರೀತಿಯ ತೊಂದರೆಗಳನ್ನು ಕೊಡದೆ ಸಂಸಾರ ಸಾಗಿಸುತ್ತಿದ್ದಳು. ಮಕ್ಕಳೆಲ್ಲಾ ದೊಡ್ಡವರಾಗಿ ಸುಖ ಸಂಸಾರ ಸಾಗಿಸುತ್ತಿರುವುದನ್ನು ನೋಡಲು ಮತ್ತು ಅನುಭವಿಸಲು ಅವಳು ಜೀವಿಸಲಿಲ್ಲ. ಮಕ್ಕಳು, ಮೊಮ್ಮಕ್ಕಳೊಡನೆ ಇದ್ದು ಸುಖಪಡುವ ಯೋಗ ಅವಳಿಗೆ ಇರಲಿಲ್ಲ. ಎಲ್ಲಾ ಕರ್ತವ್ಯಗಳನ್ನೂ ಪೂರ್ತಿಮಾಡಿ ದೈವಾಧೀನವಾದಳು. ಈಗ ಜೀವಿಸಿದ್ದು, ಮಕ್ಕಳ ಅಭಿವೃದ್ಧಿಯ ರೀತಿಯ ಅವಕಾಶಗಳ (ನೋಡುವ) ಅವಳಿಗೆ ಲಭ್ಯವಿರಲಿಲ್ಲ. ನಮ್ಮ ವಂಶ ಉದ್ಧಾರ ಮಾಡಿ, ತನ್ನ ಕರ್ತವ್ಯಗಳನ್ನೆಲ್ಲಾ ಪೂರೈಸಿ, ಇನ್ನು ಯಾವ ಕರ್ತವ್ಯಗಳೂ ಬಾಕಿ ಇಲ್ಲವೆಂಬಂತೆ, ತನ್ನ ಜನ್ಮ ಇದಕ್ಕಾಗಿಯೇ ಹುಟ್ಟತ್ತು ಎಂಬುದನ್ನು ತೋರಿಸಿ ದೇವರ ಪಾದಾರವಿಂದವನ್ನು ಸೇರಿದಳು. ಸಂಸಾರದಲ್ಲಿ ಎಲ್ಲರೂ ಚೆನ್ನಾಗಿರುವಾಗ, ಯಾವುದೇ ರೀತಿಯ ದುಃಖವನ್ನು ಕಾಣದೆ, ತನ್ನ ಕರ್ತವ್ಯಗಳನ್ನು ಪೂರೈಸಿ, ಪತಿ ಮತ್ತು ಬಂಧುಗಳಿಗೆ ಯಾವುದೇ ರೀತಿಯ ಹೊಣೆಯನ್ನು ಹೊರಿಸದೆ. ತನ್ನ ಜನ್ಮದ ಕರ್ತವ್ಯ ಪೂರೈಸಿತಂದು ಕಣ್ಮರೆಯಾದಳು. ಇಷ್ಟು ವಿವೇಕಕೆಲ್ಲಾ ಅವಳ ಸೋದರತ್ತೆ ಪುಟ್ಟತಾಯಮ್ಮ ಮತ್ತು ನನ್ನ ಅಕ್ಕ ಅಮ್ಮಾಳಕ್ಕನ ಶಿಕ್ಷಣ ದಾರಿದೀಪವಾಯಿತು. ಮಕ್ಕಳು, ಮೊಮ್ಮಕ್ಕಳು, ಅಳಿಯಂದಿರು, ಸೊಸೆಗಳಿಂದ ತಕ್ಕ ಉಪಚಾರ ಪಡೆದು ಬದುಕಲು ಅವಳಿಗೆ ಅವಕಾಶ ಸಿಕ್ಕಲಿಲ್ಲ. ಈ ಎಲ್ಲರ ಈಗಿನ ಅಭಿವೃದ್ಧಿಯನ್ನು ವೀಕ್ಷಿಸಿದ್ದರೆ ಎಷ್ಟು ಸಂತೋಷ ಪಡುತ್ತಿದ್ದಳೋ, ಇದುವರೆಗೆ ಕಷ್ಟಪಟ್ಟು, ಸಂತೋಷಪಡುವ ಕಾಲಕ್ಕೆ ಕಣ್ಮರೆಯಾದಳು."], ["ಇನ್ನೊಂದು ವೈಶಿಷ್ಟ್ಯವೆಂದರೆ ನಮ್ಮ ತಂದೆ ತಾಯಿಗಳ ಕಡೆ ಮತ್ತು ಸೌ. ಅಲಮೇಲಳ ತಂದೆ ತಾಯಿಗಳ ಕಡೆ, ಅವಲೋಕಿಸಿದರೆ, ಎಲ್ಲಾ ಹೆಂಗಸರೂ ವಿಧವೆಯಾಗಿ ಮೃತಪಟ್ಟಿರುವಾಗ - ನನ್ನ ತಾಯಿ, ನನ್ನ ಎರಡನೇ ಅಕ್ಕ ಭಾಗೀರಥಿ, ಸೌ... ಅಲಮೇಲ ಮಾತ್ರ ಸುಮಂಗಲಿಯಾಗಿ ಮೃತಪಟ್ಟರುವುದು.", "ಜೈರಾಮನ ಮದುವೆ", "ಸೌ. ಅಲಮೇಲ ತೀರಿದ ನಂತರ ಮನೆಯಲ್ಲಿ ನಾನು ಮತ್ತು ಚಿ. ಜೈರಾಂ ಇಬ್ಬರು ಮಾತ್ರ ವಾಸವಾಗಿದ್ದೆವು. ನಾನು ಮಾತ್ರ ನನ್ನ ಕಿರಿಯ ಮಗ ಜಿ. ರಮೇಶ ಮತ್ತು 2ನೇ ಮಗಳು ಸೌ. ಚೇಚಮ್ಮನ ಮನೆಗೆ ಹೋಗಿ ಊಟ ಮಾಡಿಕೊಂದು ರಾತ್ರಿ ಊಟಕ್ಕೆ ಮನೆಗೆ ತಂದುಕೊಂಡು ಊಟ ಮಾಡಿ ಮಲಗುತ್ತಿದ್ದೆ. ಬೆಳಗ್ಗೆ ಎದ್ದು ಸ್ನಾನ ಮಾಡಿ ಚಿ. ಜೈರಾಂ. ಮಾಡುತ್ತಿದ್ದ ಕಾಫಿ ಕುಡಿಯುತ್ತಿದ್ದೆ. ಚಿ. ಜೈರಾಂ, ಬೆಳಗ್ಗೆ ಎದ್ದು ಕಾಫಿ ಮಾಡಿ, ಸ್ನಾನ ಮಾಡಿ, ಹೋಟೆಲಿನಲ್ಲಿ ಊಟ ಮಾಡಿ, ಮನೆಯಲ್ಲಿ ಬಂದು ಮಲಗುತ್ತಿದ್ದ. ನನ್ನ ಮಗಳು ಸೌ. ಜೇಚಮ್ಮ ಮತ್ತು ಮಗ ಚಿ. ರಮೇಶ, ಜಿ. ಜೈರಾಂನನ್ನು ಊಟಕ್ಕೆ ಕರೆದರೂ, ಯಾರ ಮನೆಗೆ ಕರೆದರೂ ಹೋಗುತ್ತಿರಲಿಲ್ಲ. ಕ್ಯಾರಿಯರ್‌ನಲ್ಲಿ ಆಫೀಸಿಗೆ ಊಟ ಕಳುಹಿಸಲೂ ಒಪ್ಪಲಿಲ್ಲ. ನಮ್ಮ ಮಕ್ಕಳ ಪೈಕಿ ಎಲ್ಲರಿಗಿಂತ ಆರೋಗ್ಯ ಮತ್ತು ಶಕ್ತಿ ಇದ್ದ ಚಿ. ಜೈರಾಂ ಊಟ ಸರಿಯಿಲ್ಲದೆ ಈಗಿನಿಂದ ದೇಹಾರೋಗ್ಯವನ್ನು ಕಳೆದುಕೊಂಡನು. ತಾನು ವಿವಾಹವಾದರೆ ಬಂದ ಸೊಸೆ ತಂದೆ, ತಾಯಿ, ಅಕ್ಕ, ತಂಗಿಯರನ್ನು ಸರಿಯಾಗಿ ನೋಡಿಕೊಳ್ಳುತ್ತಾಳೋ ಇಲ್ಲವೋ ಎಂಬ ಸಂಶಯದಿಂದ ವಿವಾಹ ಮಾಡಿಕೊಳ್ಳುವುದೇ ಇಲ್ಲವೆಂದು ನಿರ್ಧರಿಸಿದ್ದ ಈ ವೇಳೆಗೆ ವಿವಾಹಕ್ಕಾಗಿ ಅನೇಕ ಹೆಣ್ಣು ಮಕ್ಕಳು ಮನೆಗೆ ಬಂದಿದ್ದರು. ಕಡೆಗೆ ತನ್ನ ತಾಯಿ ಅಸ್ವಸ್ಥತೆ ಇಂದ ಇದ್ದಾಗ, ವಿವಾಹವಾಗಲು ಒಪ್ಪಿ, ಗ್ರಾಜುಯೇಟ್‌ ಅಥವಾ ಕೆಲಸದಲ್ಲದಿರುವ ಅಥವಾ ಬೆಂಗಳೂರಿನಲ್ಲಿರುವ ಯಾವುದೇ ಹೆಣ್ಣು ಬೇಡ ಎಂದು ಹೇಳುತ್ತಿದ್ದ. ಈ ಮೂರೂ ವಿಧದ ಹೆಣ್ಣು ಮಕ್ಕಳನ್ನು ಹೊರತುಪಡಿಸಿದ ಹೆಣ್ಣನ್ನು ನೋಡಿ, ನಿನಗೆ ಒಪ್ಪಿಗೆಯಾದ ನಂತರ ನಾನು ನೋಡುತ್ತೇನೆಂದು ತನ್ನ ತಾಯಿಗೆ ಹೇಳುತ್ತಿದ್ದವು. ಅವನ ತಾಯಿಯೇ ಹೆಣ್ಣನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಿರಲಿಲ್ಲ. ಅವನಿಗೆ ತೋರಿಸಿ ಒಪ್ಪಿಗೆ ಪಡೆಯಲು ನಾನು ಸೌ. ಅಲಮೇಲಳಿಗೆ ಹೇಳಿದರೆ, ನಾನು ಒಪ್ಪಿಗೆಯಾದಾಗ ಚಿ. ಜೈರಾಂನಿಗೆ ತೋರಿಸುತ್ತೇನೆ ಎಂದು ಹೇಳುತ್ತಿದ್ದಳು. ಈ ಕಾರಣದಿಂದ ಅವಳು ಜೀವಂಂತವಿರುವವರೆಗೆ ಅವನಿಗೆ ವಿವಾಹವಾಗಲಿಲ್ಲ."], ["ತಾಯಿ ಮರಣದ ನಂತರ, ಮನೆಯಲ್ಲಿ ಯಾರೂ ಕೇಳುವವರು ಇಲ್ಲದಾಗ ಮತ್ತು ಊಟ ಉಪಚಾರಗಳಿಗೆ ತೊಂದರೆಯಾದ ನಂತರ ವಿವಾಹವಾಗಲು ನಿಶ್ಚಯಿಸಿದನು. ಸೌ. ವಿನತ ಹಾಸನದಲ್ಲಿ ಒಂದು ಹೆಣ್ಣನ್ನು ನೋಡಿ ಇವನಿಗೆ ವಿಚಾರ ತಿಳಿಸಿದಳು. ಮೊದಲು ನಾನು ಈ ಹೆಣ್ಣನ್ನು ನೋಡಿ ಜೈರಾಂ ಒಪ್ಪಿದರೆ ಆಗಬಹುದೆಂದು ಹೇಳಿಗೆ. ಮೊದಲು ನಾನು ಈ ಹೆಣ್ಣನ್ನು ಮದುವೆಯಾಗಲು ಜಿ. ಜೈರಾಂ ಒಪ್ಪಿಗೆ ಕೊಟ್ಟನು. ಇದೇ ಹೆಣ್ಣನ್ನು ಇವನ ತಾಯಿ ಹಾಸನದಲ್ಲಿ ಈ ಮುಂಚೆ ನೋಡಿ ತನ್ನ ಒಪ್ಪಿಗೆ. ಕೊಟ್ಟಿರಲಿಲ್ಲವೆಂಂದು. ನಂತರ ತಿಳಿಯಿತು. ಆಗ್ಲೆ ಇಬ್ಬರಿಗೂ ಕಂಕಣ ಬಲ ಕೂಡಿ ಬಂದಿರಲಿಲ್ಲವೆಂದು ಊಹಿಸಬಹುದು. ಅಥವಾ ತನ್ನ ತಾಯಿಗೆ ಇವನ ವಿವಾಹ ವೀಕ್ಷಿಸಲು ಮತ್ತು ಸೊಸೆಯಿಂದ ಆದರಿಸಿಕೊಳ್ಳಲು ಅದೃಷ್ಟ ಇರಲಿಲ್ಲ ಎಂದು ಕಾಣುತ್ತೆ ಸೌ. ಅಲಮೇಲಳ ನಿಧನಾನಂತರ, ದಿನಾಂಕ 11.05.1986, ಅಕ್ಷಯ ನಾಮ ಸಂವತ್ಸರ ವೈಶಾಖ ಶುದ್ಧ ತದಿಗೆ, ಭಾನುವಾರ, ಹಾಸನದಲ್ಲಿ ವಿವಾಹ ನಡೆಯಿತು. ಇವನ ವಿವಾಹಕ್ಕೆ ಪ್ರಯತ್ನಪಟ್ಟು ಯಶಸ್ವಿಯಾದವಳು, ಇವನ ಅಕ್ಕ-ನನ್ನ ಹಿರಿಯ ಮಗಳು ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿ", "ಬೇಲೂರು ಸ್ಥಳದ ಶ್ರೀ ಕೇಶವ ಅಯ್ಯಂಗಾರ್‌, ಇವರ ಪತ್ನಿ ಶ್ರೀಮತಿ ಸೀತಾಲಕ್ಷಿ. ತಂದೆ ಪೊಲೀಸ್‌ ಇಲಾಖೆಯಲ್ಲಿ, ತಾಯಿ ವಿದ್ಯಾ ಇಲಾಖೆಯಲ್ಲಿ ಸೇವೆಯಲ್ಲಿದ್ದು ನಿವೃತ್ತರಾಗಿರುತ್ತಾರೆ. ತಂದೆ ತಾಯಿಗಳಿಗೆ 3ನೇ ಮಗಳು ಸೌ. ಜಯಲಕ್ಷ್ಮಿ ಸೌ. ಜಯಲಕ್ಷ್ಮಿ 58/10 ಪಾಸಾಗಿ, ೦೫ ಪಾಸಾಗಿ ವಿದ್ಯಾ ಇಲಾಖೆಯಲ್ಲಿ ಕೆಲಸದಲ್ಲಿದ್ದಳು. ಚಿ. ಜೈರಾಂ ಇಷ್ಟದಂತೆ ವಿವಾಹದ ನಂತರ ಉಪಾಧ್ಯಾಯ ವೃತ್ತಿಗೆ ರಾಜಿನಾಮೆ ಸಲ್ಲಿಸಿದಳು. ಚಿ. ಜೈರಾಂಗೆ ವಯಸ್ಸಾದಂತೆ, ಸೌ. ಜಯಲಕ್ಷ್ಮಿಗೂ ವಿವಾಹದ ವಯಸ್ಸು ಮೀರಿತ್ತು. ತಂದೆ ತಾಯಂದಿರು ಒಳ್ಳೆ ವಂಶಸ್ಥರು, ಸದ್ಗಹಸ್ತರು. ಜಿ. ಜೈರಾಂಗೆ ಕೊಡಬೇಕಾದ ಎಲ್ಲಾ ಪದಾರ್ಥಗಳನ್ನು ಕೊಟ್ಟು ವಿವಾಹ ಮಾಡಿಕೊಟ್ಟರು. ಜಿ. ಜೈರಂ, ಹೆಣ್ಣಿಗೆ ಕೊಡಬೇಕಾದ ಎಲ್ಲಾ ಪದಾರ್ಥಗಳನ್ನು ಕೊಟ್ಟು ವಿವಾಹವಾದನು. ಒಂದು ವೈಶಿಷ್ಟ್ಯವೆಂದರೆ, ತನ್ನ ಅತ್ತೆ ಧರಿಸುತ್ತಿದ್ದ ಮಾಂಗಲ್ಯ ಇವಳಿಗೆ ಲಭ್ಯವಾಯಿತು. ಈ ಕಾರಣದಿಂದಲೇ ಇವಳ ವಿವಾಹ ಮಂದೂಡಿರಬಹುದೆಂದು ಊಹಿಸಲು ಅವಕಾಶವಾಗಿದೆ. ಇವರ ವಿವಾಹಕ್ಕೆ ನನ್ನ ಮಗಳು ಸೌ. ವಿನತಾ ಹೇಳಿದ್ದ ಒಂದು ಷರತ್ತು. ನನ್ನನ್ನು ಮತ್ತು ನನ್ನ ಹೆಣ್ಣು ಮಕ್ಕಳನ್ನು ಚೆನ್ನಾಗಿ ನೋಡಿಕೊಳ್ಳಬೇಕೆಂಬುದೇ ಆಗಿತ್ತು. ಈಗಲೂ ನನ್ನ ಹೆಣ್ಣು ಮಕ್ಕಳು ನಾನಿರುವ ಚಿ. ಜೈರಾಂ ಮನೆಗೇ ಬರುತ್ತಿರುವುದು. ಈಗಲೂ ಈ ಹೆಣ್ಣು ಮಕ್ಕಳೆಲ್ಲರೂ, ಈ ಮನೆಯನ್ನು “ಅಮ್ಮಾ” ಮನೆ ಎಂದೇ ಕರೆಯುತ್ತಿದ್ದಾರೆ. ನನ್ನ ಎಲ್ಲಾ ಮಕ್ಕಳಿಗಿಂತ ಅಕ್ಕ ತಂಗಿಯರನ್ನು ಆದರಿಸುತ್ತಿರುವುದು ಜಿ. ಜೈರಂನೇ ಪ್ರಧಾನ."], ["ದುರದೃಷ್ಟವಂತ ಚಿ. ಶ್ರೀಧರ", "ನನ್ನ 4ನೇ ಮಗ ಶ್ರೀಧರ ೫ಂ೫೫ ನಲ್ಲಿ ತರಬೇತಿ ಪಡೆಯಲು ಸೇರಿದ್ದು, ಕೆಲವು ತಿಂಗಳು ಮಾತ್ರ ತರಬೇತಿ ಪಡೆದು, ತರಬೇತಿಯನ್ನು ಪೂರ್ತಿ ಮಾಡದೆ ಬಿಟ್ಟು ಹೊರಟು ಹೋದನು. ಅಲ್ಲಿ ಒಳ್ಳೆ ಸಹವಾಸ ಸಿಕ್ಕಲಿಲ್ಲ. ತರಬೇತಿಯ ಕಾಲದಲ್ಲಿ ಫ್ಯಾಕ್ಟರಿಯವರು ಕೊಡುತ್ತಿದ್ದ 810೦೧6 ಮೊಬಲಗನ್ನು ಕಾನೂನಿನ ಪ್ರಕಾರ ಚಿ. ಸುಪರ್ಣ ಮರು ಪಾವತಿ ಮಾಡಿದನು.", "ಇವನ್ನು ಬಹಳ ದುರದೃಷ್ಟದ ಹುಡುಗ. ಇವನಿಗೆ 2ನೇ ವರ್ಷದಲ್ಲಿ ೮1:೧ಂ515 ೦8 1.೪೮೯ ಮತ್ತು ೫1೦ಂ77 ಆಗಿ 4ನೇ ವರ್ಷಕ್ಕೆ ಆರೋಗ್ಯವನ್ನು ಪಡೆದನು. ಇವನ ತಾಯಿಯ ಶುಶ್ರೂಷೆಯೇ ಇವನು. ಆರೋಗ್ಯಕ್ಕೆ ಹಿಂತಿರುಗುವುದಕ್ಕೆ ಮುಖ್ಯ ಕಾರಣ. ಇವನು ಹೈಸ್ಕೂಲ್‌ ವ್ಯಾಸಂಗಕ್ಕೆ ಪ್ರಾರಂಭಿಸಿದಾಗ ಇವನ ಅಜ್ಜಿ ಕಡಬದಲ್ಲಿ ನಾನೊಬ್ಬಳೇ ಇದ್ದು ಬೇಜಾರಾಗುವುದೆಂದು ಇವನನ್ನು ತನ್ನ ಜೊತೆ ಇರಲು ಕಡಬಕ್ಕೆ ಕರೆದುಕೊಂಡು ಹೋದರು. ಅಲ್ಲಿಗೆ ಕಳುಹಿಸಿದ್ದೇ ತಪ್ಪಾಯಿತು. ಕಾರಣ, ಅವರು ಮಕ್ಕಳನ್ನು ಅತಿ ಮುದ್ದು ಮಾಡುತ್ತಿದ್ದರು. ಮಕ್ಕಳು ತಪ್ಪು ಮಾಡಿದಾಗ, ಅವರನ್ನು ತಿದ್ದದೆ ಸಂತೋಷಪಡುವುದು ಅವರ ಸ್ವಭಾವ. ಇದೇ ರೀತಿ ಅವನು ತಿಪ್ಪೂರು ಕಾಲೇಜಿನಲ್ಲಿ ಪಿಯುಸಿ ವ್ಯಾಸಂಗ ಇವರೇ ಅವನ ಜೊತೆಯಲ್ಲಿದ್ದು ವ್ಯಾಸಂಗ ಕುಂಠಿತವಾಗಲು ಕಾರಣ. ಇಷ್ಟೆಲ್ಲ ಆಗಿ ಕೆಲವು ವರ್ಷಗಳು ಅವನ ಇರುವಿಕೆಯೇ ಗೊತ್ತಾಗಲಿಲ್ಲ. ಇದು ಇವನ ತಾಯಿಯ ಕೊರಗಿಗೆ ಕಾರಣವಾಯಿತು. ಇವನು ಸಕಾಲಕ್ಕೆ ಬೆಂಗಳೂರಿಗೆ ಹಿಂತಿರುಗಿದ್ದಿದ್ದರೆ ಯಾವುದೋ ನೌಕರಿ ಸಿಗಬಹುದಾಗಿತ್ತು. ಕೆಲವು ವರ್ಷಗಳ ನಂತರ ಬೆಂಗಳೂರಿಗೆ ಹಿಂತಿರುಗಿದನು. ಆ ಕಾಲಕ್ಕೆ ಇವನ ನೌಕರಿ ವಯಸ್ಸು ಮೀರಿತ್ತು. ನಂತರ ರಾಜಕೀಯಕ್ಕೆ ಪ್ರವೇಶಿಸಿ ಚುನಾವಣೆ ಕಾಲದಲ್ಲಿ ಶ್ರೀ ಜೆ. ಲಿಂಗಯ್ಯನವರಿಗೆ ಪರಿಚಿತನಾಗಿ, ತನ್ಮೂಲಕ ಆಗ ಮಾಜಿ ಮುಖ್ಯಮಂತ್ರಿ ಶ್ರೀ ಕೆಂಗಲ್‌ ಹನುಮಂತಯ್ಯನವರಿಗೆ ಪರಿಚಯವಾಗಿ, ಇವನ ಬುದ್ಧಿ, ಜಾಣ್ಮೆ ಪ್ರಾಮಾಣಿಕತೆ ಗ್ರಹಿಸಿ, ಇವನನ್ನು ತಮ್ಮ ಆಪ್ತ ಕಾರ್ಯದರ್ಶಿಯಾಗಿ ನೇಮಿಸಿಕೊಂಡರು. ಆ ಕಾಲದಲ್ಲಿ, “ಸಚಿವ' ಎಂಬ ವಾರಪತ್ರಿಕೆಯನ್ನು ಹನುಮಂತಯ್ಯನವರ ಸಲಹೆಯಂತೆ ಪ್ರಾರಂಭಿಸಿ, ಅದೇ ಕಾಲದಲ್ಲಿ 'ಸ್ಪರಾಜ್ಯ' ಪಕ್ಷ ರಾಜಕೀಯವಾಗಿ, ಶ್ರೀ ಹನುಮಂತಯ್ಯನವರ ಅಧ್ಯಕ್ಷತೆಯಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಗಿ, ಆ ಪತ್ರಿಕೆಯ ಸಂಪಾದಕ ಸಹ ಆದನು. ಇದರಿಂದ ಅವನಿಗೆ ಪತ್ರಿಕೋದ್ಯಮದಲ್ಲಿ ಹೆಚ್ಚು ಅನುಭವವಾಯಿತು. ಇಷ್ಟರಲ್ಲಿ ಹನುಮಂತಯ್ಯನವರು ನಿಧನರಾದರು. \"ಸಚಿವ' ಪತ್ರಿಕೆ, \"ಸ್ವರಾಜ್ಯ' ಪಕ್ಷ ಅಲ್ಲಿಗೇ ನಿಂತಿತು. ಶ್ರೀ ಹನುಮಂತಯ್ಯನವರು ಇನ್ನೂ ಸ್ವಲ್ಪಕಾಲ ಬದುಕಿದ್ದರೆ ಇವನ ಅಭಿವೃದ್ಧಿಯಾಗಲು ಸಂದೇಹವೇ"], ["ಇರಲಿಲ್ಲ... ಇಲ್ಲಿಯೂ ಇವನು ದುರದೃಷ್ಟನೇ ಆದನು. ನಂತರ `*ರೈತಬಂಧು' ಪತ್ರಿಕೆಯಲ್ಲಿ ಸಹಸಂಪಾದಕನಾಗಿ, ಶ್ರೀ ನಾರಾಯಣ ಗೌಡರ ಬಳಿಯಿದ್ದು, ಶ್ರೀ ನಾರಾಯಣ ಗೌಡರು ನಿಧನರಾಗಿ. ಅಲ್ಲಿಯೂ ಇವನು ದುರದೃಷ್ಟನಾದನು. ನಂತರ “ಗರೀಬಿ ಹಠಾವೋ' ಪತ್ರಿಕೆಯ ಸಂಪಾದಕನಾಗಿ, ಅದರ ಪೋಷಕ ಶ್ರೀ ಜೈರಾಜ್‌ ಸಹ ನಿಧನರಾಗಿ ಪತ್ರಿಕೆ ನಿಂತು, ಪುನಃ ದುರದೃಷ್ಟವೇ ಆದನು. ಬೆಂಗಳೂರಲ್ಲಿ ಮೊಟ್ಟಮೊದಲು “ರಾಜ್‌ಕುಮಾರ್‌ ಅಭಿಮಾನಿಗಳ ಸಂಘ' ಇವನಿಂದಲೇ ಸಂಸ್ಥಾಪಿಸಲ್ಪಟ್ಟು ನಂತರ ಬೇರೆಯವರ ಪಾಲಾಯಿತು ಎಲ್ಲಿ ಹೋದರೂ ಇವನು ದುರದೃಷ್ಟನಾಗಿಯೇ ಉಳಿದುಕೊಂಡ.", "ಆಗ ಇವನು ಮನೆಯಲ್ಲಿರದೆ ಬೇರೆಯಾಗಿಯೇ ವಾಸಿಸುತ್ತಿದ್ದ. ಆಗಾಗ್ಗೆ ಮನೆಗೆ ಬಂದು ತನ್ನ ತಾಯಿ, ಸಹೋದರಿಯರ ಆರೋಗ್ಯ ವಿಚಾರಿಸಿಕೊಂಡು ಹೋಗುತ್ತಿದ್ದನು. ಇವನಿಗೆ ಸರಿಯಾದ ನೆಲೆ ಇಲ್ಲವಾಗಿದ್ದು. ಇವನಿಗೆ ಉಪನಯನ ಮತ್ತು ವಿವಾಹಕ್ಕೆ ಪ್ರಯತ್ನ ಪಡಲಿಲ್ಲ. ಎಲ್ಲರಿಗಿಂತ ಹೆಚ್ಚಾಗಿ, ಇವರ ತಾಯಿಗೆ ಇವನ ಬಗ್ಗೆ ಕೊರಗೇ ಇದ್ದಿತು. ಇವನು ವಿದ್ಯೆಯಲ್ಲಿ ಕಮ್ಮಿಯಾದರೂ, ಪ್ರತಿಭೆ, ವಾಗ್‌ರುರಿಯಲ್ಲಿ ಎಲ್ಲಾ ಮಕ್ಕಳಿಗಿಂತ ಉತ್ತಮ. ಇಷ್ಟಾದರೂ, ಇವನು ನನ್ನ ಮನೆಗಾಗಲೀ, ಇವನ ಅಣ್ಣ ತಮ್ಮಂದಿರ ಮತ್ತು ಅಕ್ಕ ತಂಗಿಯರ ಮನೆಗಾಗಲಿ ಊಟ ವಗೈರೆಗಳಿಗೆ ಬರುವ ಅಭ್ಯಾಸವೇ ಇಲ್ಲ. ತನ್ನ ತಾಪತ್ರಯಗಳನ್ನು ಹೇಳಿಕೊಳ್ಳುವ ಅಭ್ಯಾಸವಿಲ್ಲ. ತಾನು ಈ ಸಂಸಾರದಲ್ಲಿ ಈ ರೀತಿ ಕೀಳಾಗಿರುವ ಕೊರತೆ ಈಗ ಅವನಲ್ಲಿದೆ. ಇವನಿಗೆ ಸ್ವಾಭಿಮಾನ ಮತ್ತು ಆತ್ಮಗೌರವ ತುಂಬಾ ಇದೆ. ಒಂದು ಕಾಲದಲ್ಲಿ ಪತ್ರಿಕಾ ಪ್ರಪಂಚದಲ್ಲಿ, ಇವನ ಪ್ರಭಾವ ದೆಹಲಿಯವರೆಗೂ ನಡೆಯುತ್ತಿತ್ತು. ಬುದ್ಧಿವಂತ, ಜಾಣ. ಆದರೆ ಅದೃಷ್ಟ ಉತ್ತಮ ಅನುಕೂಲ ಇಲ್ಲ. ಈಚೆಗೆ, ನಮ್ಮ ಶ್ರೀವೈಷ್ಣವ ಹುಡುಗಿಯನ್ನು ಪ್ರೀತಿಸಿ ಮದುವೆಯಾಗಿದ್ದಾನೆ. ವಿವಾಹಕ್ಕೆ ಚಿ. ಜೈರಾಂ. ಸೌ. ಚೇಚಮ್ಮ ಹೋಗಿದ್ದರು. ಇವನು ಈ ರೀತಿ ಆದ ಬಗ್ಗೆ ಎಲ್ಲರಿಗಿಂತ ಹೆಚ್ಚಾಗಿ ಜಿ. ಜೈರಾಂನಿಗೆ ಇವನ ಮೇಲೆ ಅನುಕಂಪ ಇದೆ. ಒಟ್ಟಿನಲ್ಲಿ ಈ ದುರಾದೃಷ್ಟ ಹುಡುಗನಿಗೆ ದೇವರೇ ಕಾಪಾಡಬೇಕು. ಯಾರ ಬಳಿಯೂ ತನ್ನ ಕಷ್ಟ ಅಳಿಲನ್ನು ಹೇಳಿಕೊಳ್ಳುವುದಿಲ್ಲ. ತನ್ನ ದುರದೃಷ್ಟಕ್ಕೆ ತಾನೇ ಕೊರಗುತ್ತಿದ್ದಾನೆ. ಒಬ್ಬರ ಎದುರಿಗೆ ಪ್ರಕಾಶ ಪಡಿಸುವುದಿಲ್ಲ. ತನ್ನ ತಪ್ಪಿನಿಂದಲೇ ಈ ರೀತಿಯಾಯಿತೆಂಬ ವಿಚಾರ ಅವನಿಗೆ ಅರಿವಾಗಿದೆ. ದೇವರೇ ಇವನನ್ನು ಕಾಪಾಡಬೇಕೆಂದು ಪ್ರಾರ್ಥಿಸುತ್ತೇನೆ.", "ಎಷ್ಟೇ ತೊಂದರೆಯಾದರೂ, ಮನೆಯಲ್ಲಿ ಸಹೋದರ, ಸಹೋದರಿಯರಿಗೆ ಹೇಳಿಕೊಳ್ಳುವುದಿಲ್ಲ. ಬುದ್ಧಿ ಮತ್ತು ಅನುಭವ ಎಲ್ಲರಿಗಿಂತ ಚೆನ್ನಾಗಿದೆ. ಆದರೆ ಅದೃಷ್ಟ ಖೋತಾ. ಏನೂ ಮಾಡುವಂತಿಲ್ಲ. ಚಿಕ್ಕ"], ["ವಯಸ್ಸಿನಲ್ಲಿ ರೋಗದಿಂದ ನರಳಿ, ವಿದ್ಯಾವ್ಯಾಸಂಗವನ್ನು ತೊರೆದು... ಸಂಸಾರದ ಸಹೋದರ. ಸಹೋದರಿಯರನ್ನು ಮನೆಯನ್ನು ತ್ಯಜಿಸಿ ಕಷ್ಟ ಪಡುವುದೇ ಇವನ ಹಣೆ ಬರಹ.", "ನನ್ನ ಕುಟುಂಬದ ವಿವಿರ", "ಶ್ರೀ ವೆಂಕಟರಂಗಾಚಾರ್‌ (ರಾಜು): ಇವರು ನನ್ನ ಹಿರಿಯ ಅಳಿಯಂದಿರು. ಹಾಸನ ಸ್ಥಳ. ಪದವೀಧರರು, ನ್ಯಾಯವಾದಿಗಳು. ಸುಸಂಸ್ಕೃತರು. ಅನುಭವಿಗಳು ಇವರೇ. ಇವರ ಮನೆಯಲ್ಲಿ ಹಿರಿಯ ಪುತ್ರರು. ಇವರ ವಿವಾಹ ತುಂಕೂರಿನಲ್ಲಿ ನನ್ನ ಹಿರಿಯ ಮಗಳು ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿಯೊಡನೆ ನಡೆಯಿತು. ತಕ್ಕಮಟ್ಟಿಗೆ ಆಸ್ತಿ ಹೊಂದಿ ಅನುಕೂಲಸ್ಥರಾಗಿಯೂ ಇದ್ದಾರೆ. ವಿವೇಕಿಗಳೂ ಹೌದು. ಇವರ ಸಂಸಾರದಲ್ಲಿ ಹಿಂದೆ ಜರುಗಿದ ಘಟನೆಗೆ ಈಗಲೂ ಪಶ್ಚಾತ್ತಾಪ ಪಡುತ್ತಿದ್ದಾರೆ. ನಮ್ಮ ಸಂಸಾರದ ಬಗ್ಗೆ ಹೆಚ್ಚು ಅನುತಾಪವಿದೆ.", "ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿ : ನನ್ನ ಹಿರಿಯ ಪುತ್ರಿ. ತಾಳೆ ನಿಷ್ಠೆ, ಸಂಸಾರದಲ್ಲಿ ಹೆಚ್ಚು ಅನುಭವ ಇದೆ. ಈ ಹಿಂದೆ ಸಂಸಾರದಲ್ಲಿ ಜರುಗಿದ ಘಟನೆ ಕಾಲದಲ್ಲಿ ಹೆಚ್ಚು ಶಿಸ್ತು, ತಾಳ್ವೆ ನಿಷ್ಠೆಯಿಂದ ಸೀತಾಮಾತೆಯ ರೀತಿಯಲ್ಲಿ 12 ವರ್ಷಗಳು ಪ್ರಾಮಾಣಿಕತೆಯಿಂದ ಇದ್ದದ್ದಕ್ಕೆ ಈಗ ಪತಿ, ಮಕ್ಕಳು, ಮೊಮ್ಮಕ್ಕಳೊಡನೆ ಎಲ್ಲರಿಗಿಂತ ಸಂಸಾರದಲ್ಲಿ ಸುಖವಾಗಿ ಬಾಳುತ್ತಿದ್ದಾಳೆ. ಪ್ರಾಮಾಣಿಕತೆ ಮತ್ತು ನಿಷ್ಠೆಗೆ ಜಯ ಲಭಿಸುವುದು ಖಂಡಿತ ಎಂಬುದಕ್ಕೆ ಇವಳದೇ ದೃಷ್ಟಾಂತರ.", "ಇವಳಿಗೂ ನಮ್ಮ ಸಂಸಾರದ ಬಗ್ಗೆ ಹೆಚ್ಚು ಅನುಕಂಪ ಉಂಟು. ಇವಳ ಪ್ರಯತ್ನದಿಂದ ಚಿ. ಜೈರಾಂನಿಗೆ ವಿವಾಹವಾಗಿ ಸಂಸಾರದಲ್ಲಿ ಬಾಳುತ್ತಿದ್ದಾನೆ.", "ಚಿ. ಶಿಂಗ ಅಯ್ಯಂಗಾರ್‌: ಶ್ರೀ ವೆಂಕಟರಂಗಾಚಾರ್‌ ಮತ್ತು ಸೌ. ವಿನತಾಲಕ್ಷ್ಮಿಯವರ ಹಿರಿಯ ಪುತ್ರ. ನನ್ನ ಮೊಮ್ಮಗ. ಚಿಕ್ಕ ವಯಸ್ಸಿನಲ್ಲಿ ತಂದೆಯೊಡನೆ ಹಾಸನದಲ್ಲಿ ಬೆಳೆದನು. ಬಿ.ಕಾಂ. ಪದವೀಧರ. ಕರ್ನಾಟಕ ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಉದ್ಯೋಗಿಯಾಗಿದ್ದಾನೆ. ಸಭ್ಯ ವ್ಯಕ್ತಿ ಸ್ವಲ್ಪ ಧೈರ್ಯ ಕಮ್ಮಿ ಇವನಿಗೆ ದಿನಾಂಕ 28.04.1989ರಂದು ಸೌ. ಲಕ್ಷ್ಮಿಯೊಡನೆ ಬೆಂಗಳೂರಲ್ಲಿ
