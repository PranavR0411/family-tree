rience itself, in the matter of Chi. Suparna's wedding too I had come to the opinion that it was proper not to take much responsibility but to leave it to the responsibility of those who were to be married. Although there had been no failure of duty on my part at the time of my eldest son Nagaraja's wedding, I remembered that once my"]}, {"n": 79, "b": ["son Chi. Nagaraja had said that the deception by others had occurred because my parents did not investigate properly. Therefore, considering all these, I said that in my opinion he could do as he wished, and gave my consent.", "Knowing that if the wedding took place in other towns none of us would come to the wedding, I told the girl's people to arrange a wedding in Bangalore itself, and according to our priests and our tradition, on 8.4.1983 the wedding was performed briefly, for one day only, at a choultry near Devaiah Park, Bangalore. Excepting those who had agreed to give plentiful gifts at the time of the wedding, the unfortunate one had not had invitation cards printed for this wedding. Only the people of our house took part in the wedding.", "The circumstances at the time of Sau. Devaki's wedding had changed somewhat by this time. Sau. Devaki's alliance is Dvaita. J. Ramesha's alliance is Advaita. Ours is Vishishtadvaita. Thus in our house the connection of Adi Shankara's Advaita, Sri Ramanuja's Vishishtadvaita and Madhvacharya's Dvaita came together. All 3 schools came to join the lineage of my father's tradition, the late Narayana Iyengar.", "The origin of these three schools is one, and the practice that marriage among Trimatastha Brahmins is proper has now come into practice even among the Trimatasthas. But since the observances of all 3 schools are different, my concern is that in later life there may be room for differing observances. But I have seen directly that no one can do anything about runanubandha (the karmic bond). After this wedding Ramesha was transferred to the Delhi Doordarshan office, and then transferred back to the Bangalore Doordarshan office. He has made a separate house in Bangalore and is living there.", "His wife Sau. Ratna — her father, the late Narayana Rao, was a traditional Dakshina Kannada Brahmin, of good lineage and traditional. Sau. Ratna is a B.A. graduate. Good"]}, {"n": 80, "b": ["conduct; after coming to Bangalore, she has learned well all the traditions of our house and observes them, which makes me very happy. She takes part in the joys and sorrows of our household. The 2nd daughter-in-law, who is of our own community, the wife of Chi. Suparna, has not yet taken part in our household and its joys and sorrows. One can only say that the 2nd daughter-in-law is of our own people.", "According to the tradition of Sri Ramanuja, if Sau. Ratna is made to undergo \"Samashrayana\" and \"Chakrankita\", she too becomes a Sri Vaishnava through our Acharya. In our tradition, even if one is born of a Sri Vaishnava mother, one does not become a Sri Vaishnava until \"Samashrayana\" and \"Chakrankita\" take place; in whatever caste one may have been born, if one has the Acharya's \"Samashrayana\" or \"Chakrankita\", one becomes a Vaishnava. This is the command of Sri Ramanujacharya. Therefore I would like to suggest here my opinion that it is proper to have Sau. Ratna undergo \"Samashrayana\" or \"Chakrankita\" by an Acharya and convert her to Sri Vaishnavahood.", "After Sau. Shaila was married and travelled to her home, those remaining in the house were myself, Alamela, Jairam and Nagaraja's son \"Garuda\" (Deepu). In all only 4 people. In our house from the beginning there had never been fewer than 10 people.", "Alamela's Passing", "At this same time we changed our residence from the Anjaneya Block in Seshadripuram, where we had lived for 14 years, to a house at 7th Cross, Malleshwaram. The Seshadripuram house was spacious, and in that street Alamela had many close companions. The Malleshwaram house was small and somewhat dark, and one had to remain under electric light even in the daytime. There were only 4 people in the house; during the day I, Jairam and Garuda would be out, and Alamela alone would remain at home; and there were no companions in that street, and Shaila had been married and gone to her husband's house; all this caused Sau. Alamela much"]}, {"n": 81, "b": ["unhappiness. Sau. Alamela already had Diabetic, and along with it High BP began and the Heart became Weak. Because of this she suffered mental disturbance. The doctor who was treating her advised more rest. Even so, having no alternative, she went on cooking. Though the doctor said she must not even cook, at that time when Jairama was told to get married, he would not agree to marriage. The reason: thinking what would be the plight of his parents if the daughter-in-law who came did not look after the parents properly and an occasion arose when she too set up a separate household, he would not agree to marriage. Though many girls had come for marriage, when asked he used to say: \"Three daughters-in-law have already come to the house; what benefit are we getting? If I too marry like everyone and go to live separately, what will be your plight?\" Chi. Jairam, having suffered many hardships in foreign places at a young age, came to have great regard for his parents. Even now he holds more regard than anyone for his father and mother, brothers and sisters.", "Because the Malleshwaram house caused an allergy for J. Garuda, he was sent to his mother's mother's (grandmother's) house. Only we 3 remained. Because of this her bodily condition worsened, and she was admitted to the Cardiology Department of Victoria Hospital. There is one more important reason why Diabetic, which she already had, rose with BP and the Heart became Weak.", "In this period, my 4th daughter Sau. Nalini and 5th daughter Sau. Shaila each gave birth to sons, and my having performed the postnatal care of both became one important reason. After these two daughters completed the postnatal care and returned to their homes, Sau. Alamela's bodily condition became aggravated. Treatment was given at both Victoria Hospital and Bowring Hospital."]}, {"n": 82, "b": ["At this time Chi. Ramesha's wife Sau. Ratna had gone to her mother's house for delivery, and a girl child was born to her (6.7.1985). During this period Ratna could not be present to help Alamela. Had Ratna been here, it would have been good for Sau. Alamela's help.", "We had taken her to Gulbarga. Immediately upon returning from there, her health declined.", "there was no opportunity. As Sau. Alamela's bodily condition became aggravated, our daughters who were in other towns were summoned. Sau. Shaila, who was far away in Rajasthan, came to Bangalore. In the Special Ward of Victoria Hospital, others slept with her every night. On the day Sau. Alamela died, her eldest daughter Sau. Vinata and eldest son G. Nagaraja were sleeping with her. On 23.9.1985, Bhadrapada Shukla Dashami, in the early morning hours, Sau. Alamela's bird of life flew away and she reached the lotus feet of Sri Vainateya.", "Afterwards she was brought to the Malleshwaram house and all the rites were completed. A few moments after the touching of the fire, my 4th son Chi. Sridhara arrived. He did not even get to see his mother's face. On learning the news of the passing, my 5th daughter-in-law came from Gulbarga to Bangalore two days later with her young child. In memory of Sau. Alamela, Chi. Ramesha named his daughter, who had already been born, with his mother's name, Alamela.", "In the work of her rites and so on, Chi. Jairam took the lead, and my children performed everything with devotion, completely, without any flaw or fault, as prescribed by the scriptures, at an expense of about Rs. 20,000/-.", "A video recording that Chi. Ramesha had made of her during her lifetime, before Sau. Alamela's bodily condition became aggravated, is at home."]}, {"n": 83, "b": ["Looking at the span of Sau. Alamela's life, what is seen is this: married at a young age and coming to our house, she became a good housewife, pleasing to her husband, father-in-law and sister-in-law; in her youth, travelling to other places with her husband and children, she was close to all and a guide. Without giving her husband or children any hardship or trouble in any way, she bore and gave birth to ten children, raised them, educated them and got all of them married. While the sons were all earning and living in mutual affection, while the daughters were living happily in their own homes, while there were grandchildren and great-grandchildren, she embraced death. She did not get much opportunity to see all this. She came into our house in marriage, uplifted our lineage, got all the daughters married and so on, completed the work of this life of hers, and drew her last breath. Resolving that she should not give me, her husband, any hardship, she completed all her duties and reached the feet of God. However many hardships came in the household, she bore them and ran the household without giving me any kind of trouble. She did not live to see and enjoy the children all grown up and running happy households. She was not destined to enjoy being with children and grandchildren. Having completed all her duties she became one with God. Had she lived now, the opportunities of seeing the children's progress were not available to her. Having uplifted our lineage and fulfilled all her duties, as though no duty remained, showing that her birth was for this very purpose, she reached the lotus feet of God. While everyone in the household was well, without seeing any kind of sorrow, having fulfilled her duties and without placing any kind of burden on her husband and kin, she disappeared, having completed the duty of her birth. For all this wisdom, the training of her paternal aunt Puttatayamma and my elder sister Ammalakka became the guiding lamp. She did not get the opportunity to live receiving due care from children, grandchildren, sons-in-law and daughters-in-law. How happy she would have been had she seen the present progress of all these; having struggled until now, she disappeared at the time when she would have rejoiced."]}, {"n": 84, "b": ["Another special feature: looking at my parents' side and at the side of Sau. Alamela's parents, while all the women had died as widows — my mother, my second elder sister Bhagirathi — only Sau. Alamela died as a sumangali (with her husband alive).", "Jairama's Wedding", "After Sau. Alamela passed away, only I and Chi. Jairam lived in the house. I used to go to the house of my youngest son G. Ramesha and my 2nd daughter Sau. Chechamma and eat there, and bring food home for dinner, eat and sleep. In the morning I would get up, bathe and drink the coffee that Chi. Jairam made. Chi. Jairam would get up in the morning, make coffee, bathe, eat at a hotel, and come home and sleep. Even though my daughter Sau. Chechamma and son Chi. Ramesha invited G. Jairam for meals, he would not go to anyone's house, whoever invited him. He did not agree even to having food sent to the office in a carrier. Chi. Jairam, who had the most health and strength among our children, from then on lost his bodily health due to improper food. Because of the doubt whether a daughter-in-law who came after he married would look after his father, mother, elder and younger sisters properly, he had decided never to marry. By this time many girls had come to the house for marriage. Finally, when his mother was unwell, he agreed to marry, saying that he did not want a girl who was a graduate, or who had a job, or who was in Bangalore. He used to tell his mother to look at a girl who was outside these three types, and that after she approved I would see her. His mother herself would not accept the girls. When I told Sau. Alamela to show a girl to him and get his approval, she would say, \"When I approve, I will show her to Chi. Jairam.\" For this reason he did not get married as long as she was alive."]}, {"n": 85, "b": ["After his mother's death, when there was no one to look after him at home and after trouble with food and care, he decided to marry. Sau. Vinata saw a girl in Hassan and informed him. At first I said that I would see this girl, and that it could go ahead if Jairam agreed. G. Jairam first gave his consent to marry this girl. It was learned later that his mother had earlier seen this same girl in Hassan and had not given her consent. It can be guessed that for both of them the auspicious time (kankana bala) had not then come together. Or it seems that his mother was not fortunate enough to see his wedding and be cared for by a daughter-in-law. After Sau. Alamela's passing, on 11.05.1986, Akshaya year, Vaishakha Shuddha Tadige, Sunday, the wedding took place at Hassan. The one who tried for his wedding and succeeded was his sister — my eldest daughter Sau. Vinatalakshmi.", "Sri Keshava Iyengar of Belur and his wife Srimati Sitalakshmi: the father had served in the Police Department and the mother in the Education Department, and both are retired. Their 3rd daughter Sau. Jayalakshmi passed S.S.L.C., passed T.C.H. and was working in the Education Department. As Chi. Jairam wished, she resigned from the teaching profession after the wedding. As Chi. Jairam had grown older, Sau. Jayalakshmi too had passed the marriageable age. Her father and mother are of good lineage and good householders. They gave all the articles to be given to G. Jairam and performed the wedding. G. Jairam gave all the articles to be given to the girl and married. One special point: the mangalya that his mother used to wear became available to her. By this it is possible to guess that this is why her wedding may have been postponed. One condition my daughter Sau. Vinata had set for their wedding was that she should look after me and my daughters well. Even now my daughters come to the house of Chi. Jairam, where I live. Even now all these daughters call this house \"Amma's\" house. Among all my children, it is G. Jairam above all who is foremost in cherishing his sisters."]}, {"n": 86, "b": ["The Unfortunate Chi. Sridhara", "My 4th son Sridhara joined NGEF for training, received training for only a few months, and left without completing the training. He did not get good company there. The stipend that the factory used to give during the training was repaid, as per the law, by Chi. Suparna.", "He is a very unfortunate boy. In his 2nd year he developed Cirrhosis of Liver and Rickets, and regained health by the 4th year. His mother's nursing was the main reason for his return to health. When he started high school studies, his grandmother, saying she would be bored alone in Kadaba, took him to Kadaba to stay with her. Sending him there itself was the mistake. The reason: she used to pamper children excessively. When children made mistakes, it was her nature to be pleased rather than correct them. In the same way, while he studied P.U.C. at Tiptur College, she stayed with him, and this was the reason his studies suffered. After all this, for some years his whereabouts were not known. This became the cause of his mother's grief. Had he returned to Bangalore in time, some job might have been obtained. After some years he returned to Bangalore. By then he was over age for employment. Afterwards he entered politics, became acquainted with Sri J. Lingaiah at election time, and through him became known to Sri Kengal Hanumanthaiah, then a former Chief Minister, who, perceiving his intelligence, cleverness and honesty, appointed him as his personal secretary. At that time, on Hanumanthaiah's advice, he started a weekly newspaper called \"Sachiva\", and at the same time the \"Swarajya\" party was established politically under the presidency of Sri Hanumanthaiah, and he also became the editor of that paper. Through this he gained much experience in journalism. In the meantime Hanumanthaiah passed away. The \"Sachiva\" paper and the \"Swarajya\" party stopped there. Had Sri Hanumanthaiah lived some time longer, there would have been no doubt about his progress"]}, {"n": 87, "b": ["of it. Here too he turned out unfortunate. Afterwards, as co-editor in the paper \"Raitabandhu\", he was with Sri Narayana Gowda, and Sri Narayana Gowda passed away. There too he became unfortunate. Afterwards, as editor of the paper \"Garibi Hatao\", its patron Sri Jairaj also passed away and the paper stopped, and again he met misfortune. In Bangalore, the first \"Rajkumar Fans' Association\" was founded by him himself and later went to others' hands. Wherever he went, he remained unfortunate.", "At that time he did not stay at home but lived separately. He would come home now and then, enquire after the health of his mother and sisters, and go. As he had no proper footing, no effort was made for his Upanayana and wedding. More than anyone else, his mother had worry about him. Though he is less in education, in talent and eloquence he is better than all the children. Even so, he has no habit of coming to my house or to the houses of his brothers and sisters for meals and so on. He has no habit of telling of his troubles. The sense of inferiority in this household, of being so lowly, is now in him. He has great self-respect and dignity. At one time, in the world of journalism, his influence extended as far as Delhi. Intelligent, clever. But fortune has no good favour for him. Recently he has married a Sri Vaishnava girl of ours, out of love. Chi. Jairam and Sau. Chechamma went to the wedding. Because he has become thus, G. Jairam has more sympathy for him than anyone. All in all, God alone must protect this unfortunate boy. He does not tell his troubles and sorrows to anyone. He broods over his own misfortune. He does not reveal it before anyone. He has realised that it happened because of his own mistake. I pray that God Himself protect him.", "However much difficulty comes, he does not tell his brothers and sisters at home. His intelligence and experience are better than everyone's. But fortune is lost. Nothing can be done. In childhood"]}, {"n": 88, "b": ["he suffered from illness, left his studies, and abandoned his brothers and sisters and the household; to suffer hardship is his fate.", "Details of My Family", "Sri Venkatarangachar (Raju): He is my eldest son-in-law. Native of Hassan. A graduate, a lawyer. Cultured. Experienced. He is the eldest son in his house. His wedding took place in Tumkur with my eldest daughter Sau. Vinatalakshmi. He has a fair amount of property and is well-off. He is also wise. He still repents the incident that occurred in his household earlier. He has great sympathy for our household.", "Sau. Vinatalakshmi: My eldest daughter. Patience, devotion; she has great experience in the household. At the time of the incident that occurred earlier in the household, with great discipline, patience and devotion, like Mother Sita, she remained honest for 12 years, and therefore now lives more happily than everyone in her household with her husband, children and grandchildren. Her own example proves that honesty and devotion are certain to be rewarded.", "She too has great sympathy for our household. Through her efforts Chi. Jairam was married and is living in a household.", "Chi. Shinga Iyengar: The eldest son of Sri Venkatarangachar and Sau. Vinatalakshmi. My grandson. In childhood he grew up with his father in Hassan. A B.Com. graduate. He is employed at Karnataka Bank. A decent person, a little lacking in courage. His wedding took place in Bangalore on 28.04.1989 with Sau. Lakshmi. He is soon to become a father. He did not know the true facts of the mishap that occurred earlier in his father's household. One day when an opportunity arose I myself explained, after which all the facts"]}, {"n": 89, "b": ["became known to him. A decent person, with great devotion to father, mother, elders and God. He has great regard for me and my wife (as grandfather and grandmother).", "Chi. Ramapriya (Ranji): He is the 2nd son of my eldest daughter Sau. Vinatalakshmi. Having grown up in our household in childhood, he has great regard for everyone in my household. He is a B.E. graduate. He is a Lecturer at Malnad Engineering College, Hassan. He has great responsibility in the household. Thrifty. When he sees me he plays like a small child. Such is his affection.", "Sau. Jayashri: The only daughter of my eldest daughter Sau. Vinatalakshmi. At a very young age she was married to our distant relative Sri Satyaprakash, and now lives with her family with 2 children in an Arab country. Her husband is employed in an Arab country. Though young, she is very responsible. Very courageous. She had grown up in our household in childhood. Chi. Sandeepa is the eldest son of Sau. Jayashri and Chi. Satyaprakash. My great-grandson. He too is doing his primary education in an Arab country with his parents. Sau. Durga is the daughter of Sau. Jayashri and Sri Satyaprakash. She is doing her primary education in an Arab country with her father and mother. One month in the year they come to India and stay with everyone.", "Sri Rangadhama: He is my 2nd son-in-law. He was given my 2nd daughter Sau. Sarala (Chechamma) in marriage. They have two daughters. Sri Rangadhama is a native of Belur. He obtained an Electrical Diploma and is employed at the HMT Factory in Bangalore. His only sister lives in Hyderabad. Sri Rangadhama is a very simple person."]}, {"n": 90, "b": ["He is also intelligent. Has great sympathy for everyone. Experienced. Trustworthy, devoted. A believer in God. Has great respect for elders. Having lost his father and mother at a young age, grown up under the shelter of others and studied, he knows what hardship is. Patient. A person without ostentation. In Belur there was only one inherited house. From it some money came. Out of his salary he maintained the household in Bangalore, obtained a site, built a 2-storeyed house and lives there; after the wedding all facilities have come to him; one can say his wife, my 2nd daughter Sau. Sarala, is his good fortune. If he had known about my eldest daughter-in-law Sau. Hema's matter, he could have told us.", "Sau. Sarala (Chechamma): She is my 2nd daughter. Wife of Sri Rangadhama. After their wedding she made a small rented house in Kumara Park (layout), Bangalore, and set up a household. At the very beginning she had received 4 vessels from her mother for the household. Her husband's share was only a trunk. By her good fortune and intelligence she maintained the household and has now built a 2-storeyed house in Rajajinagar 2nd Stage and provided all the modern equipment necessary for the house — telephone, fridge, grinder, cot, everything. She has great interest in the household. Somehow, managing the household on the money her husband gives, she has accomplished all this. It is the custom for many guests to come to her house. It is their nature to host well all who come. For all this, the training of her mother-in-law (my elder sister) and of her mother is the reason.", "But she is of a temperament to get agitated and angry quickly over a trifling matter. Very intelligent. However much, she does not fail; she is clever in kitchen work and also has great experience in outside affairs. The conduct of her household brings me great joy. Her mother, not being fortunate enough to see all this, disappeared. All of it is the blessing of her mother."]}, {"n": 91, "b": ["Sau. Nandini: First daughter of Sri Rangadhama and Sau. Sarala. Passed S.S.L.C. in first class and is studying in the final-year class of the Secretarial Practice Diploma. She has also received dance training. Intelligent like her father and mother.", "Sau. Saumini (Babbi): Second daughter of Sri Rangadhama and Sarala. Intelligent, very clever. Of few words. She passed S.S.L.C. with the 18th rank in Karnataka State. She is studying in the 1st P.U.C. at M.E.S. College. Sharp-minded. From the beginning, getting the 1st or 2nd rank in all classes and winning the appreciation of teachers is the manner of her studies. Having obtained the S.S.L.C. rank, she has won many awards and prizes. Her memory is good. She grasps what she reads well. Not only in studies but also in handicrafts and drawing work she is accomplished. In childhood she had the practice of learning this craft and drawing from her grandmother Sau. Alamela. In housework too these two children are clever. Both are of very shy disposition. Even with mother and father they would not go to other people's houses. They come only to my house. How much her grandmother Sau. Alamela would have rejoiced seeing her studies, handicrafts and drawing, had she been alive — that good fortune she did not have. Her birth was at the K.C. General Hospital, Malleshwaram.", "Sau. Devaki: My 3rd daughter. A B.A. graduate. Very courageous. Of few words. Has a job in the Telephone Department. Sri Vijayasimha is a B.Sc. (Diploma) graduate. The only son of his parents. He is an employee in the Telephone Department. They are of the Madhva Vaishnava tradition. The two married by love in a registered marriage. Of good lineage. Observant of custom and intelligent. For this wedding of a different tradition, with consent on neither side, neither we, the parents of Sau. Devaki, nor the parents of Sri Vijayasimha, had given approval, and it took place in this way. Because of this wedding of Sau. Devaki, from tradition"]}, {"n": 92, "b": ["that had come down, our lineage suffered a slight lack. That we did not get the opportunity to carry her in the womb, bear and raise her, have her educated, and give her away in marriage with dhare according to the scriptures — this is the sorrow of the elders on both sides. This kind of wedding of Sau. Devaki was somewhat rare, and the first change of tradition on both sides. They are Vaishnavas. We are Sri Vaishnavas. No one can avoid the bond of past debts. The sum that would have had to be spent on her wedding may have been saved. Alarmed by this kind of wedding of hers, we hastily performed the wedding of her younger sister Sau. Nalini. When Sau. Devaki was in our house, she knew no kitchen work at all. Now, having set up a separate house, learned all the household work, bought the articles needed for the house, and managing the household along with her government job, she lives happily with her children and husband on sufficient earnings. Without taking anyone's help, she even managed the deliveries of her children herself. That we could do nothing for her in the way we did for all our children is our sorrow.", "Chi. Akshobhya: First son of Sau. Devaki and Vijayasimha. Studying in primary school. Intelligent, extremely mischievous.", "Chi. Ananda: Second son of Sau. Devaki and Sri Vijayasimha. Studying in nursery L.K.G. Few words, much mischief. Intelligent.", "Sau. Nalini and Sri Prasannakumar: Their wedding took place on 29.11.1979, Siddharthi year, Margashira Shukla Dashami, Thursday, with great splendour at the endowment choultry of the Anjaneya temple at Palace Guttahalli, Bangalore. Sri Prasannakumar is a B.Sc. graduate. Of good lineage. Of few words. Calm. Employed at the Bangalore Silk Merchants Society. Had he made an effort in those days, he could have gone to an even better job. His father and mother too"]}, {"n": 93, "b": ["are good people. His father retired as Deputy Director in the Sericulture Department. Magadi is the native place.", "Of good lineage.", "Sau. Nalini is a B.Sc. graduate. She has passed Senior Typewriting. She used to be rather quick-tempered; it has now lessened. Efficient like a mould. From the example of the incident of Sau. Devaki, though she was not of suitable age, the wedding was hurried. An effort could have been made to find her some job; since Sau. Devaki was employed and that incident had happened, no effort was made to get her a job. As my sons were at that time engrossed in their studies, they made no effort for her job. I too, being at Huliyar, had no opportunity. Since her education was complete and she had reached a suitable age for marriage, it was not proper to keep grown daughters at home unmarried, so her wedding was performed somewhat hastily. For her wedding, the land at Kadaba that was my share was sold. Sau. Nalini, by her efficiency, without seeking others' help, obtained her own job, took a separate house on rent, got all the modern equipment needed for the house, and manages the household with intelligence. In courage, efficiency and performance of duty she is intelligent. A bit too hasty. For all this, the training given by her mother is the reason.", "Sau. Shruti: Elder daughter. Of few words like her father. Intelligent. Studying in primary school.", "Shrivatsa: Second son. Intelligent. Studying in primary school.", "Sau. Shaila and Chi. Shridhar: A B.Sc. graduate. Employed in a factory at Kota, Rajasthan. Of good lineage. Very patient, calm. Has great regard for people. His father is H.R. Iyengar, whose native place was Halturu in Hassan district. His mother is the elder sister of the late Annadorai of the Dikshita lineage of Kadaba,"]}, {"n": 94, "b": ["and a first cousin (maternal uncle's daughter) of Rangamma, mother of Sau. Alamela. The mother of Rangamma, my mother-in-law, was also a daughter of the Dikshita house of Kadaba.", "Chi. Shridhar's grandfather was employed in the Railway Department at Kota, Rajasthan. Chi. Shridhar's father, H.R. Iyengar, was also employed at Kota itself. Chi. Shridhar's education too took place at Kota, so he knows Rajasthan well. Shridhar's mother is the daughter of the late Raja Iyengar of Nuggehalli. Raja Iyengar was well known to me. Sri H.R. Iyengar has 2 sons and 3 daughters. Except Chi. Shridhar, all the others are in Karnataka itself. Sau. Shaila is a B.A. graduate. Very talkative. Courageous. Efficient, very talkative. Very clever in running a household.", "We were not ready for her wedding. Her B.A. examination results had not come. We were not financially ready for her wedding, so we asked for three months' time to prepare. In the meantime my elder sister passed away. At last, as if it were Shaila's good fortune, a person came forward ready to buy my house in Tumkur. Having sold that house, the wedding of Sau. Shaila and Sri Shridhar took place on 26.11.1982, Dundubhi year, Karthika Shukla Dashami, Friday, at the Sri Rama Kalyana Mantapa, Malleshwaram, with great splendour. The arrangements for this wedding were successfully completed with everyone's consent under the leadership of Chi. Jairam. Thus the weddings of my 5 daughters were completed and my responsibility ended. After Sau. Shaila travelled to Rajasthan, our residence in Seshadripuram was changed to the Malleshwaram house.", "Chi. Abhijit alias Ranganath: First son of Sau. Shaila and Chi. Shridhar. Studying in primary school. Rank in all classes. Intelligent, clever; only courage is less. Speaks Hindi well, but does not know Kannada."]}, {"n": 95, "b": ["Chi. Sannu: 2nd son. Now only one and a half years old. With this, the account of my daughters is complete.", "Details of the Sons", "Chi. Dr. Nagaraj and Sau. Hema: In childhood he grew up at Nonavinakere under the shelter of my father and elder sister, and passed S.S.L.C. in first class. Intelligent, clever. Under the command of my father and elder sister, he grew up with great fear and loyalty. Devotion and faith in God and in elders. Because of this, he has a little less of the courage my other sons have.", "He had greater interest in Electrical Engineering. Because there was uncertainty about the government order to be issued regarding my medical practice, he had to be admitted to L.M.P. for my medical assistance. Later the government order was also published favourably for my profession. Had he, as I expected, relied on private medical practice, he would not have prospered in it. As his fortune was good, getting a job in the government medical department turned out well. Now he holds a gazetted post in the government and draws a higher salary. He does not show much interest in the profession. As a doctor he did not become very popular with the people. The deception that occurred in his marriage caused his mind to be somewhat dulled. Even so, regarding the girl who fell to his lot as good, he is living a married life along with suitable treatment. Had his wife been more wise, his life would have been even better; no one can transgress the bond of past debts. He is very thrifty. Recently he has had a house built in Kamalanagar, Bangalore. Very loyal to law. It is his nature to fear debt. Great love among relatives too. My father and elder sister had more affection for him than for anyone."]}, {"n": 96, "b": ["J. Nagaraj's wife and my eldest daughter-in-law, Sau. Hema, is of a very good nature. Her parents, though living in Bangalore itself, neither gave her suitable treatment in childhood nor taught her sufficient education or household work, and ruined her life. Had she been given suitable education in childhood she would have become intelligent. Their aim was, having borne her, to tie her to others by deceit and lies and wash their hands of her. They did just so. She has great love for the people of our household. The deceit practised by her parents is now realised. Owing to lack of proper education in childhood, she has some stubbornness and an obstinate mind; little discretion. Had she been a little intelligent, her household would have been ideal. Now she has learned household work. Little discretion. Had she had the opportunity to stay a while with my wife, she could have learned everything. But as she lived in another town, that was not possible. They have one son and one daughter.", "Chi. Garudadhwaja alias Deepu: He is the first son of Chi. Nagaraj and Sau. Hema, and my grandson. In his tender age he lived with his mother's parents and was very naughty. Realising that if he stayed with them he would turn out like his mother, my wife, his grandmother Sau. Alamela, brought him to our house, kept him in our house from nursery itself, and began his education. Through the atmosphere of our house he made great progress and became intelligent. While he was studying in the 7th class, my wife Sau. Alamela passed away. Therefore he was admitted to the 8th class in another town. He passed S.S.L.C. in first class. Afterwards, when he joined P.U.C. and was proceeding to college studies, he was selected for training at the Mico Factory, left his college studies, joined the Mico Factory and is continuing his training. My wish was to make him an engineer. His father's opinion is that in this young age it is difficult for those who study much to get a government job. Everyone"]}, {"n": 97, "b": ["says he will get a job and so does not study — for the sake of qualification. As an example, his father's own studies are the proof. My personal opinion is that if one has more education, one will somehow come up. I did not voice opposition to the opinion of his father, who bears the responsibility. While he was in the womb, due to his mother's carelessness, his eye suffered some danger. My elder sister had immense love for this boy. Even now this boy has great love for the people of our house. But I have one lack. That his father did not perform his Upanayana even though he is past the suitable age — had his grandmother been alive, she would not have left it unperformed until now. I am not able to take up that responsibility. Like his father, he too has great interest in Electrical; intelligent. He too has not been keen to continue college education. After his grandmother passed away, he had no opportunity to live with me.", "Sau. Jyothi: Daughter of Chi. Nagaraj and Sau. Hema. In childhood she was with her parents; as there was no opportunity for high school studies in the village, she stayed with her grandmother (mother's mother), passed S.S.L.C., and is now studying P.U.C. Had she been with her parents, there was a chance of her passing S.S.L.C. in a better class. Had my wife been alive, she would not have handed these children over to others' custody. Chi. Nagaraj, with a little effort, could have got himself transferred to a town with a high school. Even if one leaves children in others' houses and spends a good deal of money, others say, \"I raised them.\" This is my experience. However much money we spend, if children are in others' houses, there is no peace for them and no peace for us. If children are not with their parents in childhood, the parents have no sense of responsibility. Had Sau. Hema had a little discretion, there would have been no occasion for this. Sau. Jyothi is a very good girl. Intelligent. My worry is that she will not get proper training in her grandmother's house. Her mother is the example of this. I am not at ease with children being in one place and parents in another."]}, {"n": 98, "b": ["Chi. Suparna, Sau. Prabha: Chi. Suparna at first worked in the ITI Factory, then joined the Postal Department and was in Bangalore. It was because of his shelter that my family came to Bangalore. At first he was a great help to my family. Intelligent. It is not in his nature to tell his joys, sorrows and troubles to another, or to expect another's help. It is his nature to keep to himself. By his own strength and intelligence he passed the departmental examination and has now been promoted as an Officer. Perceiving the deception in the wedding of his elder brother Chi. Nagaraj, he took the responsibility for his own wedding himself. We too approved of this and left the decision about his wedding to him. With his own responsibility, at his own expense, and with our approval, he married. He does not even know many of our relatives. He has no familiarity with people — in the end, not even with elder sisters, younger sisters, elder brothers and younger brothers. This is a great sorrow to me. I have learned that he too has built a house in Bangalore and rented it out. He has not told me. I have not even seen the house. Once a week he comes to me, enquires after my health and goes. After the wedding he stayed in our house with his wife for some time. Afterwards, telling me and with my approval, he went to a separate house without any ill feeling.", "Sau. Prabha: Second daughter of the late T. Narasimha Iyengar of Nanjangud. A B.A. graduate. Knows tailoring well. I understand that this income gives some help to Chi. Suparna's household. Of good lineage. Sau. Prabha too, like Chi. Suparna, has little acquaintance with our relatives and no conduct in that regard. She does not consider that her duty is merely to come on the annual ceremony day of her mother-in-law (Sau. Alamela) and pray for peace of the soul. Though she was in town and healthy, she did not come. Pained by this, I did not raise the matter. This is certainly a lapse of duty on her part. As long as her mother-in-law Sau. Alamela was alive, she used to come to the house now and then. Even after my wife passed away, she did not come to enquire after my joys and troubles."]}, {"n": 99, "b": ["Perhaps for her wedding, her father had given Chi. Suparna 10,000/- rupees at Chi. Suparna's request. Because of this, I think she may have felt that he had been bought from my house. If there are any reasons, I being the elder alive in the family, they could have told me. No matter has been raised with me. I doubt whether I can call them my son and daughter-in-law. No quarrels have taken place over any matter. She has no contact even with my daughters. When my 4th daughter Sau. Nalini was married, she invited her and her husband to a feast at her house, and on the day they came, she was not at home but had locked up and gone away — this cannot be forgiven. Since I have no contact with this household, I will not speak more about this. In this, whether it is the fault of my son G. Suparna, or of my daughter-in-law Sau. Prabha, or of both, I cannot say. On the whole, I rejoice that this household is happy in its own way.", "Chi. Adarsh alias Madhusudana: Elder son of Chi. Suparna and Sau. Prabha. I understand he has passed S.S.L.C. and is studying P.U.C. It has been many years since I saw him. Even if he came before me, I would not recognise him. When my grandson passed S.S.L.C., he came and told me. I was glad.", "Chi. Abhishek: Second son of Chi. Suparna and Sau. Prabha. The 2nd son was born 12 years after the first child. He comes to the house now and then with his father and sees me before going. From what I have seen, he looks intelligent.", "The household of G. Suparna is known neither to me nor to my children. I bless them, praying that God give them good sense and health and protect them. My son and daughter-in-law had come to the wedding of Chi. Jairam. The photograph taken then is in the house. I look at it in the photograph now and then."]}, {"n": 100, "b": ["They did not mention me or invite me for the naming ceremony or the tonsure ceremony of the children. Even as a son, he could have noticed that his father and mother are alive.", "Chi. Jairam and Sau. Jayalakshmi: Chi. Jairam is my third son. Employed at the K.E.B., Bangalore. Very generous. Takes great interest in entertaining guests. Immense love for father and mother, elder and younger sisters, elder and younger brothers, and relatives. Liberal. It is his nature to spend beyond limit on festivals and holy days. Even now, after my wife passed away, elder and younger sisters, elder and younger brothers and relatives come to his house. His house is also called \"Amma's house.\" He himself took the lead and conducted the wedding of Sau. Shaila with great splendour. For the funeral rites and the days of ceremonies of his mother, he himself took the lead and did it at an expense of 20,000/- rupees. His other brothers too were sharers in this expense.", "Though he holds an ordinary-grade post at the K.E.B., he is efficient. Having won the friendship and affection of senior officers, he gives suitable help to many employees in the department. At a young age he went on a tour of India and knows all the places of India well. Since he suffered much hardship at a young age, he has great sympathy for everyone. It is his nature to give suitable help to anyone in difficulty or trouble. He knows the Hindi language well. In the time when his mother was alive, when he had reached a suitable age for marriage, though many girls came for the wedding, he did not agree to marry... the reason being that, doubting whether the girl he married would look after his father and mother properly, he kept saying he did not want marriage at all. He did not marry as long as his mother was alive. Had he been married while his mother was alive, with suitable help, perhaps his mother would have lived a little longer. Whenever marriage was mentioned, he would say to his mother, \"Two daughters-in-law have already come to you; what help are you getting from them? It would be the same even if I married.\" After his mother's"]}, {"n": 101, "b": ["death, though everyone invited him for meals and so on, he went nowhere and brought some ill health on his body. Though courageous in all other matters, he is very faint-hearted if I or others fall ill. After his mother's death, his eldest sister Sau. Vinatalakshmi of Hassan looked for a bride and helped with his wedding. On 11.5.1986, Akshaya year, Vaishakha Shuddha Padyami, Sunday, his wedding with Sau. Jayalakshmi took place at Hassan. For the wedding he did not take financial help from anyone. All the elder and younger brothers, elder and younger sisters, brothers-in-law, sisters-in-law and children had come to his wedding. This group photograph is in the house. At the time of his wedding he rejected my suitable advice. I am now living under his shelter. He has immense love for me. He gets a sufficient salary. Had he tried to pass the departmental examination, he could have risen to a better grade in the department. For some reason he did not try. Nor is there interest.", "Sau. Jayalakshmi: Passed S.S.L.C. Also passed T.C.H. Before the wedding she was a teacher. As directed by Chi. Jairam, she resigned from the teacher's job. A very good girl. Somewhat slow by nature. Her experience in outside affairs is a little less; she is gaining it now. Her father and mother are natives of Belur. The father was employed in the Police Department and the mother in the Education Department; both are retired. She has one elder sister and three brothers. All of them now live in Bangalore itself. She is now getting to know the customs of our house. Had she come as daughter-in-law while Sau. Alamela was alive, she would have gained a little more experience. It seems she had the merit of obtaining the mangalya of Sau. Alamela. Her father and mother performed her wedding well. Since there is another Jayalakshmi in the house opposite, we named her Lakshmi. In her slow nature and the taste of her cooking she resembles my elder sister Ammalakka, and her memory comes to me. Only me, so that no kind of lapse occurs,"]}, {"n": 102, "b": ["she looks after me. Looking after the house of birth and the house one has joined in the same manner is the proper path. They have the lack of not having obtained children. It is the effort of God.", "Chi. Shridhar and Sau. Sridevi: Chi. Shridhar is courageous. One who has experienced much hardship. Very efficient in dealings. Experienced. Great effort in journalism. Though less educated in our house, he is very intelligent. But fortune is lost. Lately he has realised his mistake and is repenting. However many hardships come, he does not tell his elder or younger brothers, nor his elder or younger sisters. As he had no proper footing, no arrangements were made for his wedding. He himself agreed and married. After the wedding, his sisters and I gave some financial help. It would be good if, on suitable occasions, help for his household were available from his brothers. However great the hardship, it is not in his nature to tell anyone or to beg. God must protect him. Chi. Jairam has the most sympathy for him.", "Sau. Sridevi: I am not much acquainted with her. When observed, she appears to be of good nature. Their wedding took place at the Sri Srinivasa temple, Rajajinagar, Bangalore. G. Jairam, Sau. Lakshmi and Sau. Chechamma went to the wedding. The ear-ornament (ole) that Sau. Alamela used to wear, which Sau. Vinatalakshmi had bought, she gave to her. Thus the ear-ornament worn by Sau. Alamelu came to her. God must help their household. His mother had great sorrow about him until the end.", "Chi. Mohanram (Ramesh) and Sau. Ratna: My 5th son, Chi. Ramesh, after the B.Sc.", "degree, while employed at the BEML Factory, continued his further studies, and after obtaining a Master's degree in journalism, was appointed as Programme Executive at the Gulbarga All India Radio station and resigned from his BEML job. Transferred from Gulbarga All India Radio to the Delhi TV centre,"]}, {"n": 103, "b": ["he then became responsible for the inauguration of the Bangalore TV centre. Afterwards he was transferred for some days to the Madras TV centre and is again employed at the Bangalore centre. He has been in the company of Communists and has little belief in God, custom and dharma. He keeps the company of well-educated people. He has no acquaintance with relatives at all. Somewhat outspoken. Because of this, some people are a little cold to him. Though his trust in his elder brothers and sisters is great, he does not show it outwardly.", "Many wealthy people had come forward for his wedding. Giving up everything and expecting nothing, he married the girl he liked. After waiting until the wedding of his sister Sau. Shaila, he asked us to give our permission for him to marry a girl from a good family-oriented house in Gulbarga. Obtaining our permission, and telling the bride's elders to perform the wedding for our sake in Bangalore in the Sri Vaishnava tradition, he had the Upanayana and wedding performed according to the scriptures on 8.4.1983. Because he was in the Communist Party, he had not agreed to the Upanayana earlier. He has no acquaintance with our kinsfolk and relatives. Great regard for friends. Great regard for father and mother.", "His wife is of the Advaita tradition. Sau. Devaki married in the Dvaita tradition. Thus in our house the Advaita, Vishishtadvaita and Dvaita traditions have come together. He is benevolent. It is not in his nature to seek anyone's help for himself. He has now built a house from his own earnings. He does not even wear good clothes. No pride of position. He has also kept a motor car for himself. He has two daughters.", "Sau. Ratna: A B.A. graduate; has also won a medal in sports. Immense devotion to God and elders. Great regard for relatives and friends; in running the household"]}, {"n": 104, "b": ["she is very clever. Besides household work, she has the strength to manage outside affairs as well. Thrifty in the household. It is her nature to receive guests well.", "Her father and mother are orthodox Advaita Brahmins belonging to South Kanara. She has 4 brothers, and an elder sister and brother-in-law. All of them are very gentle and saintly. Great love for our relatives. Though she came from another tradition, under the guidance of her mother-in-law Alamela, she has learned all our Vishishtadvaita traditions, taken them up and observes them. She has also learned our style of cooking. Though her husband Ramesh is bound to Communist principles, she has understood and observes all the observances of our family, the vratas and the duties to the gods. She helps her husband greatly in the household. Brahmins of any tradition, by Samashrayana according to the principle of Sri Ramanuja, that is, by receiving Chakrankita, can join the Sri Vaishnava tradition. Likewise, if she receives Chakrankita, she can join the Sri Vaishnava tradition. My wife Alamela greatly admired her qualities and nature. She has immense love for me too. On the whole, a girl of good nature.", "Sau. Alamelu (Chinnu): Elder daughter of Chi. Ramesh and Sau. Ratna. She is in primary education. When she was born, although Sau. Alamelu was ill, she went to Gulbarga, saw the child and returned, and used to praise her, captivated by her beauty. For this very reason, the name Ranganayaki that had been chosen for this child was dropped and the name was changed to Alamelu.", "Sau. Matangi (Kalu/Pankaja): 2nd daughter of Chi. Ramesh and Ratna. Not yet joined school. Beautiful like her sister. Very active. Courageous. She has been named Pankaja after my late elder sister."]}, {"n": 105, "b": ["My expectation is that if Sau. Alamela were alive, seeing the beauty of these two children, she would have raised them herself without leaving them.", "Loss of Property and Income", "It seems my grandfather (that is, my father's father) was not very well off. There was no inherited property and the like belonging to him. The one who managed all his household was Venkatachala Iyengar, husband of Nacharamma, the younger sister of my grandmother Chennamma. They had no children. Therefore they adopted Srinivasa Iyengar, my father's elder brother (Deshika's father), and managed our household. Though my younger grandmother Nacharamma gave my father a portion of her house at Nonavinakere, it was an old house, a cattle shed. My father lived in it only a few days, and lived in other houses for many years. When, after my wedding, I intended to demolish this inherited property and build anew, and after demolishing the house and completing the foundation and base work, an objection was raised in court by one of our own people who did not wish us well, and the work was stopped halfway. The bricks and timber materials kept ready for it went to others and were lost. It was in this period that I got a government job and left Nonavinakere, and out of weariness did not continue this work. My father sold this site to others. Now others have built a house there. (This house was on) the street behind the Bete Raya Swami temple at Nonavinakere.", "While my mother was alive, my father sold my mother's jewels and bought a garden at Nonavinakere. A dispute arose in court over a path (for passage) to it, and this garden was sold to the disputants themselves. Owing to a discrepancy in the writing and deception by friends he had trusted, the sale money was lost, and my father paid the disputants' court expenses."]}, {"n": 106, "b": ["At Kadaba, a paddy field of 2 acres in the Savemedu plain had come as maintenance for my elder sister Ammalakka. I sold it and, in my time, bought 4 acres of paddy field at Kadaba in a good location. Selling the 2 acres of paddy field belonging to my sister and adding the remaining amount, I bought a house at Someshwarapuram, Tumkur, for 7500/- rupees. Selling the remaining 2 acres of paddy field at Kadaba, my daughters' weddings were performed. Selling the Tumkur house for 90,000/- rupees, Shaila's wedding was performed.*", "* At the time of Nalini's wedding, Jairam had the Tumkur house put in his own name, showed it as a purchase, took a loan of Rs. 30,000/- from the office, and spent about 25,000/- on Nalini's wedding. Later, at the time of Shaila's wedding, he sold it for Rs. 90,000/-, spent about 30,000/- on Shaila's wedding, repaid the office loan of about 39,000/-, and gave no account to anyone for the remaining 30,000/-.", "I had made a site at Huliyar. Finding it of no use, I sold it for 2000/- rupees and spent it on the wedding of Chi. Nagaraj.", "Before I got a government job, I was running a shop at Nonavinakere. The business was going very well and had won a name in that region. In the middle, since I got a government job, I handed the shop over to my partner. He paid part of the money, did not pay the rest, and closed the shop. On the whole, I only suffered loss from properties and gained no profit. Though there was so much loss, that God kept me and my family going happily is my good fortune and the blessing of elders. I have not earned any kind of property for my children. This is a kind of sorrow to me. Raising the children, having them educated and performing their weddings was my duty. The children, each on their own, have built houses and so on. This is my consolation and my blessing. The grace of God.", "From the money that came from selling the gold bangles that belonged to my wife Sau. Alamela, I deposited 10,000/- rupees in the Unit Trust of India and nominated Chi. Nagaraj and Chi. Jairam. The interest on this, 1,200/- rupees per year,"]}, {"n": 107, "b": ["I receive. When I said I did not want to take the interest, I am taking it because the children insisted that I take it. Since I do not know what Sau. Alamela did with a pair of gold jhunki (earrings) that belonged to my granddaughter Sau. Jyothi, for that and as per my elder sister's wish, I gave Sau. Jyothi 5,000/- rupees and placed a cumulative deposit in U.T.I. in the name of Chi. Nagaraj. Three years have passed; after two more years, 10,000/- rupees will come to him, which will be of help for the wedding of Sau. Jyothi. Since a silver god's case belonging to J. Nagaraj was lost, I presented the large silver god's case that was in the house at the time of his housewarming and placed it in his house. Chi. Nagaraj, Chi. Suparna and Chi. Ramesh have built houses from their own earnings, in Kamalanagar, Mysore Road and Banashankari respectively. Though I could not create any property for the children, I am glad that they have built houses by their own efforts. I learned from others that Chi. Suparna has built a house on Mysore Road, Bangalore. Until now he has not told me that he has had a house built. He has not even invited me to see the house. He has not even held a housewarming ceremony. I do not understand why he has done so. Anyway, I pray that God do good to him and give him good sense. Chi. Jairam has not tried to build his own house. Had he set his mind to it, it could have been done. It seems he does not want it.", "In childhood I grew up happily under the shelter of my father and my elder sister Ammalakka (my mother passed away when I was 4 years old). In youth, as written earlier, I was in various occupations, and finally, practising my own medical profession at Huliyar, I raised 10 children, had them educated and married, and in old age I am living in Bangalore under the shelter of my 3rd son Jairam and 3rd daughter-in-law Sau. Lakshmi. Only in youth did I suffer some hardship. All my difficulties were resolved only through the shrewdness, efficiency, popularity and wisdom in running the household of my wife Sau. Alamela. In the household, through the intelligence and cooperation of my wife Sau. Alamela, I had no kind of trouble, pain,"]}, {"n": 108, "b": ["or hardship; she managed the household. The full credit and success for this is due to Sau. Alamela. Having raised all the children, had them educated, married off all the daughters, and, at the time when the sons were all earning and happy, having finished her duties of this world, causing me no trouble whatever, she closed her eyes feeling that her birth was fulfilled. The entire credit and success of my household is due to my wife Sau. Alamela. That I did not create any immovable property for my children is my sorrow. But my satisfaction is that I did not make my children debtors by taking any kind of loan. From the very beginning I have had a fear of debt. If a creditor comes to the door of the house, I get a kind of agitation. By the grace of God and the blessing of elders, I have the satisfaction of having managed this household as peacefully as possible. Though immovable properties were not made, that all the household articles were procured and given even to the daughters was the efficiency of my wife Sau. Alamela.", "In old age, as said earlier, I live happily under the shelter of my 3rd son Chi. Jairam and his wife Sau. Lakshmi, without any kind of harassment or lapse. Hearing the experiences of many of my friends in old age, I am living in peace without suffering any kind of pain. The other children too ask me to come and stay at their houses. Chi. Jairam has immense love for me. If I am not at home for a day, he has no peace at all. Besides, his own health is not good. I know that even if my company is absent for one day, it has some effect on his mind and he becomes unwell. Therefore I feel that being in his company is good for both. I also have faith that the other children too will give me shelter. On the whole, my consolation is to be free from trouble in any way in this old age. I pray to God to remain in the same way until the end and then to leave this world."]}, {"n": 109, "b": ["My and Sau. Alamela's Travels", "1. Sau. Alamela made a tour of North India for the very first time.", "2. On Chi. Jairam's L.T.C., I, Sau. Alamela, G. Jairam and a friend toured Delhi, Haridwar, Rishikesh, Lakshmanjhula, Mussoorie, Varanasi, Allahabad, Gaya, Agra and Mathura.", "3. With Chi. Nagaraj and G. Jairam, a trip to Gaya and Varanasi for the rites of my elder sister Ammalakka (1982).", "4. On Chi. Nagaraj's L.T.C., I, Sau. Alamela, Chi. Nagaraj, Sau. Hema, Chi. Garuda and Sau. Jyothi toured North India a second time on L.T.C. (1983).", "5. I, Chi. Jairam, Sau. Lakshmi, Sau. Chechamma and Sau. Nalini's children toured North India.", "6. My South India tour to Madras, Tanjore, Kanchi, Kalahasti, Srirangam, Chidambaram, Rameswaram, Dhanushkodi, Madurai and Palani. I did this earlier (1962). Only the Badri tour was not possible.", "Hospital Stay", "For several months (years), as Prostatitis, there was", "some difficulty in passing urine, as I knew. I neglected it, thinking I would go for the operation in summer.", "In winter I went to Belur, got drenched in the rain, and while staying there at night, urinary retention", "trouble occurred. In the morning, having the urine drained at the hospital there, I came by car to Hassan; as Sau.", "Vinata was there, I was admitted to the hospital and in the evening underwent a Minor Operation.", "Afterwards, it would have been good if I had come to Bangalore for the Major Operation to be done after 20 days.", "After 20 days I had the Major Operation done in Hassan itself and for 1"]}, {"n": 110, "b": ["month I was in the hospital at Hassan. Afterwards, when I came to Bangalore, I again had urinary trouble, and my right leg lost control. Though I stayed a month in the hospital at Malleshwaram, and the urinary trouble lessened, the right leg did not come under control. Then I was admitted to Victoria Hospital, and after the 3rd operation by Dr. B.T. Sampathkumar and a month there, the right leg came under control. After some months an Incisional Hernia developed and caused trouble. Again, though the children and daughters-in-law at home did not like it, I was admitted to K.C. General Hospital, Malleshwaram, where the 4th operation was done by Dr. Srinivas. This time, after the operation, I had no consciousness at all for 3-4 days. I learned later that everyone had decided that I would not live. I learned that during this time, on the doctors' advice, 3-4 bottles of blood were given to my body. The blood of who knows whom has entered my body. Had I been conscious, being ready to die, I would not have consented to this. I have indeed recovered by this. Only the doubt about this blood has not gone. As all my duties were over, and as Sau. Alamelu had passed away by that time, I was admitted to the hospital ready to die. Because my debt to this world was not yet over, I remained alive. In all, at this age I have survived 1 minor and 3 major operations.", "Sau. Alamela, having become diabetic, was admitted 3 times to K.C. General Hospital, Malleshwaram. Afterwards infection and allergy also occurred. After Sau. Shaila's wedding, when there were only 3 people in our house, which had always had no fewer than 10 people, and when we left the Seshadripuram house and came to live in the Malleshwaram house, she had High B.P., and heart trouble began. Before this, Sau. Nalini's 2nd delivery and Sau. Shaila's first delivery came at the same time, and since she took much physical strain, her condition worsened. Afterwards she was admitted to Jayadeva Heart Hospital and Bowring Hospital, and finally breathed her last at Jayadeva Heart Hospital. Having borne, raised, educated, married off,"]}, {"n": 111, "b": ["and seen through the childbirth care, having completed her worldly business, without being a burden to anyone,", "when everyone was happy, feeling that her duty was fulfilled, she reached the feet of Sri Vainateya (Garuda).", "My Politics", "1. President – All India Congress, Hobli Committee, Huliyar.", "2. President – Dakshina Bharata Hindi Prachar Sabha, Hobli Committee, Huliyar.", "3. President – Khadi Gramodyoga Mandal, Hobli Committee, Huliyar.", "4. President – Town Co-operative Society, Huliyar.", "5. President, Founder – House Building Co-operative Society, Huliyar.", "6. Founding Director – Taluk Multipurpose Co-operative Society, Chikkanayakanahalli.", "7. Founding Director – Multipurpose Co-operative Society, Huliyar.", "8. Member – All India Congress District Committee, Tumkur.", "9. Member – All India Congress Taluk Committee, Chikkanayakanahalli.", "10. Member – Taluk Development Board, Chikkanayakanahalli.", "11. Member – District Board High School Committee, Huliyar.", "12. President – All India Congress Seva Dal, Huliyar Hobli.", "13. Member – Peace Committee, Huliyar.", "14. Government Representative Member – Regulated Market, Tipturu."]}, {"n": 112, "b": ["Politics", "It is a fact that this entry into politics caused loss to my profession and personal income. But through entering politics, my name became known from the village to the Vidhana Soudha; among the people, officials, legislators and even up to ministers, I came to be famed for my efficiency in work, selflessness and affection for the people, though I had no financial means. Officials consulted me on many government problems for solutions. In this period I had the opportunity, had I desired, to gain as much selfish benefit as I wanted. Had I striven for selfish income, I would have had to lose the people's affection. Though my own people and relatives were not financially self-reliant, that I received so much respect, in a place that was not even my birthplace, from the people, officials and politicians, was chiefly because of my selflessness and the people's affection. In the end, neither for my children's college seats nor for their government jobs did I obtain the recommendation of any politician. If today my children have obtained higher education, earned good jobs and remain in positions of authority, it can be said to be their own talent and their fortune. I also declined the advice and invitations that came from politicians and officials for my wife to take an active part in politics. The reason: my wife, who had many children, had greater responsibility in running the household. Even so, the work my wife did indirectly in politics was praised by politicians and officials. Finally, as other women representatives were not available, my wife was made President of the Women's wing of the Hobli Congress Committee."]}, {"n": 113, "b": ["Though this entry into politics caused some trouble to financial help from my profession, in other ways it helped me greatly. When I left the government job, my father and relatives were anxious that I had lost the chance of receiving a pension after I grew old. After growing old, I too realised the occasions when I would have to ask someone else for financial help. But as per the government order, I receive the Freedom Fighters' pension, initially 100/- rupees per month and now 300/- rupees per month. The Chief Minister has said that it will soon be raised to 500/-. Besides this, income also comes from my profession (a medical shop had been given my medical shop licence). This has been a financial help to me in my old age. I also have the assurance that my children would help financially if I wished. My own income is sufficient for me. Of my classmates, fellow workers and political leaders, only 3-4 are alive and all the rest have passed away.", "Sweet Memories", "I remember well that my father, for 12 years in succession, went and returned on foot from Nonavinakere to Melukote for the Vairamudi service, by way of Bindiganavile. I too once went on foot with my friends from Nonavinakere to the Vairamudi at Melukote. At that time there was no bus facility. Setting out with friends from Nonavinakere at five in the morning, via Diduga village we reached Bindiganavile by that evening and stayed the night there; next morning we set out with the people there for Melukote, reached Melukote in the evening, performed the Vairamudi service there, stayed a day, and again by way of Bindiganavile to Nonavinakere"]}, {"n": 114, "b": ["we would return. Women also came on foot with us to Melukote. There was no fear of thieves and robbers. Because of that crowd, the fatigue of walking was not even felt.", "My father made 2 tours of North India by train, except for the Badri kshetra.", "Features of Those Times", "Peons: 6/- to 10/- rupees per month.", "Schoolmaster's starting salary per month: 8/- rupees, 12/- rupees, 15/- rupees.", "Middle School Headmaster: salary of 35/- rupees per month.", "Doctor: from 50/- rupees to 100/- rupees per month.", "Tahsildar: 100/-, 150/-, 200/- rupees per month.", "Deputy Commissioner (District Collector): 500/- rupees per month.", "Prices", "Gold, 1 sovereign (approx. 7.8 grams): 13/- rupees.", "Silver, 1 tola (approx. 11.66 grams): 6 annas (now 36 paise).", "Brass, 24 tolas (a seer): 8 annas (now 50 paise).", "Copper, 24 tolas (a seer): 12 annas (now 75 paise).", "Sanda Faverluba Watch (wrist watch): 18/- rupees.", "Japan Wall Block (clock): 12/- rupees.", "Phillips Cycle: 25/- rupees.", "BSA Cycle: 25/- rupees."]}, {"n": 115, "b": ["His Master Voice Grama Phone: 50/- rupees.", "Binny Cotton cloth, one yard:", "(Yard = 3 ft., 1 ft. = 12 inches, 1 inch = 25.4 cms)", "(1 Yard = 3 x 12 x 25.4 = 9.14 mtr.)", "Panche (good), 1 pair: 8 annas (now 50 paise).", "Haircut (including shaving): 2 annas (now 12 paise).", "Kerosene, one tin (including the tin): 2 rupees 8 annas (now 2.5 rupees).", "Butter, 26½ tolas: four and a half annas per seer (now 33 paise).", "Groundnut oil, 1 pavu (280 grams): four annas (now 25 paise).", "Rice (good), 12 seers (1 seer = 1.25 kg): 1 rupee.", "Ragi, 1 palla (105 kg): 5/- rupees.", "Toor dal (good), 4 seers: 1/- rupee.", "Tamarind, one mana (approx. 12.5 kg): 2/- rupees.", "Plain dosa, 3 kasu each (now 1½ paise); 12 annas for 1 rupee — 48 dosas.", "(12 kasu to an anna; 144 kasu to a rupee.)", "That is, 48 plain dosas for one rupee.", "Masala dosa, 6 kasu each (now 3 paise); 32 masala dosas for a rupee.", "Idli, 6 kasu each (now 3 paise); 32 idlis for one rupee.", "Coffee, 6 kasu per cup (now 3 paise).", "Hotel meal, 4 annas (25 paise); a full stomach of food, no measure", "(that is, full meals).", "Hotel meals twice a month: from 8/- to 12/-.", "Cinema (silent films then): from 3 annas (18 paise) up to 1 rupee.", "Milk, per seer (1.2 litres): 2 annas to 4 annas (12 paise to 25 paise).", "Curd, per seer: 1 anna to 2 annas (6 paise to 12 paise).", "Exercise book, ½ anna each (6 kasu – 3 paise).", "Black Bird Fountain Pen, 1 pen: 3 rupees."]}, {"n": 116, "b": ["Swan Fountain Pen, 1 pen: 4/- rupees.", "Railway fare from Tumkur to Bangalore: 9 annas (now 55 paise).", "Bus fare from Huliyar to Bangalore: 1½ rupees.", "From Huliyar to Tipturu: 8 annas (50 paise).", "From Huliyar to Chikkanayakanahalli: 6 annas (40 paise).", "Drama ticket: 4 annas to 1/- rupee.", "Large coconuts: 30 for 1 rupee.", "Copra, 1 mana (now 10 kg): 3 to 5 rupees.", "Jaggery, 1 mana (now 10 kg): 2/- rupees.", "Petromax lamp: 20/- to 30/- rupees.", "Torch (2-cell): 8/- rupees.", "Leather chappals, one pair: 2/- to 5/- rupees.", "501 bar soap (per bar): 1½ rupees.", "Sunlight Soap: 6 annas (now 30 paise).", "Mysore Sandal Soap, 1: 8 annas (now 50 paise)."]}, {"n": 117, "b": []}], "sums": {"p1-channakeshava-iyengar": "The earliest ancestor on the mother's and grandmother's side that the author knows. He was the father of Ramaswamy Iyengar (Ramaiyengar), with his wife Ramakkamma, and is named as the author's grandmother Chennamma's grandfather and the great-great-grandfather of the author's mother. Nothing else is known about him or the generations before. (pp. 4, 12)", "p2-ramakkamma": "Wife of Channakeshava Iyengar and the great-grandmother of Chennamma. The author records only her name; the generations before this couple are not known. (pp. 4, 12)", "p3-ramaswamy-iyengar-ramaiy": "Father of Chennamma (the author's paternal grandmother) and of Keshava Iyengar, so both of the author's parents descend from him. He belonged to the Nuggehalli family of Hassan district, of the Maudgalya gotra and Vadagalai tradition, and his wife was Lakshmamma. His own father was Channakeshava Iyengar. (pp. 4, 11–12)", "p4-lakshmamma": "Wife of Ramaswamy Iyengar and mother of Chennamma, Nacharamma and Keshava Iyengar, which makes her the great-grandmother of the author on both his father's and his mother's side. The book gives only her name. (pp. 4, 12)", "p5-keshava-iyengar": "The author's maternal grandfather, of Nuggehalli, Maudgalya gotra, Vadagalai tradition. He and his wife Ajamma had four children, the youngest being the author's mother Ramakkamma. He was the elder brother of Chennamma, so the author's father married his own maternal uncle's daughter. (pp. 11–12)", "p6-ajamma": "Wife of Keshava Iyengar and the author's maternal grandmother. She was born at Attavara, the village of the Shanubhoga (village accountant) family, which the author says were her siblings, and she lived there with her son Narayana Iyengar. The author was born in that family's courtyard house during her time. (pp. 11–13, 18)", "p7-eldest-daughter": "The eldest of the author's mother's two elder sisters. Her name is not known to the author. She was married to a family at Hiremagaluru and her grandchildren live in Bangalore. (p. 11)", "p8-narayana-iyengar": "The author's maternal uncle, the elder brother of his mother. Though from Nuggehalli, he lived at Attavara in Hassan taluk with his family and worked as a PWD contractor, and did railway contract work near Dudda station in the time of Diwan Visvesvaraya. He had no sons and three daughters. He came to the author's wedding at Kadaba. The author was born at Attavara while this uncle and the grandmother Ajamma lived there. (pp. 12, 18)", "p9-his-wife": "Wife of the maternal uncle Narayana Iyengar of Attavara and mother of his three daughters. The book does not name her. (p. 12)", "p10-andalamma": "Eldest of the three daughters of the author's maternal uncle Narayana Iyengar, so his first cousin. She lives in Shantigrama. (p. 12)", "p11-jokkamma": "Second daughter of the author's maternal uncle Narayana Iyengar. She married into the Dasa house of Belur. (p. 12)", "p12-shringaratte": "Youngest daughter of the author's maternal uncle. She lives in Hassan, in the house of Ramakrishna Iyengar, the elder brother of the author's son-in-law Raju; Ramakrishna's wife Mani is a relative on the author's mother's side. (p. 12)", "p13-yadugiriyamma": "The author's mother's second elder sister, his \"Doddamma\". She was married to Ranganna of Shankhagrama in Hassan taluk and had one son and three daughters. The son married and died young. The author's father's wedding took place in her house at Shankhagrama. (pp. 11–12)", "p14-ranganna": "Husband of Yadugiriyamma, of Shankhagrama in Hassan taluk. The author's father's wedding took place in their house, where, the book says, there was no ceremonial music because no players lived in the village. (pp. 11–12)", "p16-rukkamma": "Eldest daughter of Yadugiriyamma, so the author's cousin. She was married as the third wife of Kutta Shyama Iyengar of Nonavinakere and had no children. After her husband died she lived in the house of her younger sister Thirumalamma and died there. (p. 11)", "p17-kutta-shyama-iyengar": "The \"younger grandfather\" (chikka taata) of Narayana Iyengar of Nonavinakere. He took the author's cousin Rukkamma as his third wife; the marriage had no children. (p. 11)", "p18-thirumalamma": "Second daughter of Yadugiriyamma. She was married as the second wife of Deshikachar of Attavara, whom the author calls his step-maternal-uncle, a retired Sub-Registrar. Her elder sister Rukkamma lived in her house after being widowed. Her sons are Gopala and Narasimha of Malleswaram. (p. 11)", "p19-deshikachar-of-attavara": "A retired Sub-Registrar of Attavara whom the author calls his step-maternal-uncle. His second wife was Thirumalamma, daughter of Yadugiriyamma, and their sons Gopala and Narasimha live in Malleswaram, Bangalore. (p. 11)", "p20-gopala": "Son of Thirumalamma and Deshikachar of Attavara, living in Malleswaram, Bangalore. The author's cousin through his mother's side. (p. 11)", "p21-narasimha": "Son of Thirumalamma and Deshikachar of Attavara, living in Malleswaram, Bangalore, with his brother Gopala. (p. 11)", "p22-kamalamma": "Third daughter of Yadugiriyamma and the same age as the author. She married Dikshitar Ramanuja Iyengar of Shantigrama; after he died she lived with her children in Malleswaram, Bangalore. Her stepson is Vadhyar Srinivasa Deshikachar. (p. 12)", "p23-dikshitar-ramanuja-iyeng": "Of Shantigrama. He married the author's cousin Kamalamma, daughter of Yadugiriyamma. After his death she lived in Malleswaram, Bangalore. His son from another marriage is Vadhyar Srinivasa Deshikachar. (p. 12)", "p24-vadhyar-srinivasa-deshik": "Stepson of Kamalamma and son of Dikshitar Ramanuja Iyengar. He was in Bangalore at the time of writing. The book gives no more about him. (p. 12)", "p25-ramakkamma": "The author's mother, called Ramakka, youngest daughter of Keshava Iyengar and Ajamma of Nuggehalli. She married her daughter of Chennamma's elder brother Keshava, and so a cousin of her husband Narayana Iyengar Narayana Iyengar, who was her own cousin as the son of her aunt Chennamma. She was popular and clever, skilled at rangoli, bead and woolwork and embroidery, and good at the dice game pagade. When her young daughter was widowed she stopped wearing flowers and going to haldi-kumkum functions, out of understanding for the child. She died of a postnatal infection at the birth of her sixth child, when the author was four. Her children: a boy who died in infancy, Ammalakka, Bhagirathi, Pankaja, the author and Dore. The author remembers her as looking like his daughter Chechamma (Sarala). (pp. 11–14)", "p26-chennamma": "The author's paternal grandmother, a daughter of Ramaswamy Iyengar of Nuggehalli. She married Krishna Iyengar \"Bhalyada\" and had two sons and three daughters. She went blind from a cataract, and her husband is said to have carried her on his shoulders from Nuggehalli to Nonavinakere. After he died when her youngest was five, she and her five children grew up in Nonavinakere under the shelter of her younger sister Nacharamma. She gave her firstborn Srinivasa (Doddappa) to Nacharamma to raise, saying \"This is your child; raise him.\" She was still alive when the author was three. (pp. 4–5, 8–9, 11, 13, 18)", "p27-nacharamma": "Chennamma's younger sister and the author's \"Chikkajji\" (younger grandmother). She married Kobbari Venkatachala Iyengar of Kadaba, who traded in copra at Nonavinakere. They had no children, so Chennamma gave her firstborn Srinivasa (Doddappa) to them as their adopted son. After her husband died, her house at Nonavinakere sheltered Chennamma and her widowed children as a joint family. She gave the author's father a part of that house, an old cattle shed in which he lived only a few days. She also owned a garden and a canal-irrigated paddy field near Holenarasipura, which went to her adopted grandson Deshikachar. She died of cholera in the epidemic of about 1917–18, the first of four deaths in the house within a week. (pp. 4–5, 9, 11, 13, 16, 105)", "p28-kobbari-venkatachala-iye": "Husband of Nacharamma; he came from Kadaba and settled at Nonavinakere, of the Srivatsa gotra. He traded copra, walking behind a bullock carrying loads to Bellary and back, a trip that took fifteen days, which earned him the name \"Kobbari\" (coconut) and the standing of a sahukar, a merchant-moneylender. He managed the household of the author's grandfather, who had no inherited property. The couple were childless and adopted Srinivasa (Doddappa), the author's eldest paternal uncle, and they sheltered Chennamma's family after her husband's death. His younger brother was the Vadhyar Srinivasa Raghavachar of Kadaba. After he died, the author's aunt Garudamma took over the moneylending. (pp. 4–6, 8–9, 105)", "p29-srinivasa-iyengar-doddap": "The author's eldest paternal uncle (\"Doddappa\"), the first son of Krishna Iyengar and Chennamma. He was adopted by Nacharamma and Kobbari Venkatachala Iyengar, which moved him from the Kutsya gotra to the Srivatsa gotra, and he was then known as Kobbari Srinivasa Iyengar. He studied at Nonavinakere and Kadaba, with Vedic and astrology lessons from his brother-in-law Srinivasa Raghavachar, and worked as a schoolmaster and Branch Post Master at Nonavinakere. His first wife died, and his second wife bore a son, Deshikachar. Both he and his wife died before the author was old enough to know them. (pp. 4–5, 9–10, 13, 16, 105)", "p30-garudachar": "The author's paternal great-grandfather. The family believes the line came from Bindinganavile, where the family deity Sri Vainateya is enshrined. He and Lakshmamma had one son, Krishna Iyengar. Nothing is known of the generation before him. (p. 4)", "p31-lakshmamma": "Wife of Garudachar a
