llness, the stigma that had arisen — that this girl's coming to our house had not been auspicious — disappeared, and although I did not get a government job, I was prospering in business, and there was only happiness and joy in my household.", "For the capital of this business of mine, my father, and later Rangaswamy Iyengar who came as a partner, also contributed. Our firm earned a great name in the town and in the surrounding villages, and all goods — from a needle to a clock, gramophones, bicycles and stationery items — were available to the people at suitable prices.", "Two years after my wife Alamelu came to our house, probably in 1936, my first daughter Sau. Vinatalakshmi was born. At that time my paternal aunt Eggamma and Alamelu's grandmother Mahalakshmamma were alive. That I had been blessed with offspring was a matter of great joy not only for my father's household but for all our close ones."]}, {"n": 37, "b": ["I had marked the dates on which our children were born in the diaries of the respective years. My mother-in-law used to say that Ahobala Shastri of Kadaba, who lived opposite our house, had also marked the dates of my children's births. When changing houses and towns, all the old diaries were destroyed. With the belief, as my mother-in-law used to say, that Shastri had marked them in Kadaba, in the end the correct birth dates of my children could not be found even with him. Thus their dates of birth were not known.", "My eldest daughter, born rarely (after a long wait), was very beautiful and lively, and was petted by everyone. At her birth, the joy of my elder sister, my father and Alamelu's family knew no bounds.", "Two years after this, my second child, G. Nagaraja, was born. My first daughter Vinata was born after a somewhat longer interval following my wedding, and since there had been no small children in our house for many years, this child, who was dear to everyone, was called \"Ammanni\". The joy that she gave from her birth to my father, elder sister, my paternal aunt Eggamma, and Alamelu's mother and grandmother knew no bounds. She was born in Kadaba. After she was born, the marriage of Alamelu's younger sister Paddu with Krishna Iyengar, the daughter's son of Gundlapandita of Mysore, took place at the Sampige Srinivasa temple. Even then, their father did not come to the wedding. Alamelu's paternal uncle Sundararaja Iyengar and aunt Ranganayakamma poured the water of gift-giving (dhare).", "After that my mother-in-law Rangamma lived alone in the house at Kadaba. In the meantime, the business in the Stores that I had started in Nonavinakere was running very popularly and earning considerable profit. In Nonavinakere, bricks and timber materials were collected to demolish our old house and build a new one, the house was demolished, and the foundation was also laid."]}, {"n": 38, "b": ["Unable to bear my progressing in this way, those people of Nonavinakere whose girl I had refused to marry brought a stay order from the court against my building the house and obstructed the construction work. Because of this, the construction work was stopped. Later the bricks and timber materials that had been kept ready for building the house went to others. After this, because I went to a government job and because I took a house on rent in Tumkur, I did not build the house in Nonavinakere. We sold this house site to others.", "In the meantime, my name was on the waiting list for the post of Pharmacist at the Medical Head Office in Bangalore, and unexpectedly the order of my appointment to a Pharmacist job in the Medical Department, at the Suttur Hospital in Nanjangud taluk, arrived. I was to report for duty within one week. Our business store was popular with the people and earning considerable profit. This gave rise to the doubt whether to go for the government job or not. Getting a government job itself is good fortune. \"Go to the job, wait a few days, and then if you do not want the job you can resign. Do not give up the government job you have got for the time being; the partner will look after the Stores,\" said my family and close ones; so I decided to go for the government job and set out for Mysore.", "Suttur village was on the Nanjangud–T. Narasipur road, at a distance of 15 miles from Nanjangud and 8 miles from T. Narasipur. There was no bus to Suttur. One had to get down at a village called Kupparavalli and walk 2 miles or go by bullock cart.", "With a few belongings, I travelled by bus with Alamelu and her mother, got down at Kupparavalli village, left my mother-in-law and the belongings there, and I went to Suttur to fetch a cart. Our hospital was right at the front of Suttur village. There, after seeing the Doctor"]}, {"n": 39, "b": ["and informing him of the matter, I met the Swamiji of the Suttur Math, obtained a bullock cart, went to Kupparavalli, and brought my mother-in-law and the belongings to Suttur.", "Our hospital building was within Suttur village itself. It had been built as charity by the Swamiji. The building was large and spacious, like the Huliyur Middle School. Inside the compound of the building there were quarters for the Doctor, the Pharmacist and the Midwife. The Suttur Swamiji had great influence in the government, and because he had built and donated the hospital building, a hospital had been sanctioned for that town; we went as the first officers of the hospital. Although the town had a sizeable population, the number of patients coming to the hospital was 20 a day. We had no work at all. Suttur is a Veerashaiva Math famous in that region. At that time Sri Shivaratri Swamiji was the head of the seat. He was very close to me. Whatever help was needed, the Math would give.", "Right behind our hospital was the Kapila river. The man who ran the boat on the Kapila river was the peon of our hospital, Puttamadayya of the same town.", "After that, after a few days, I took Alamelu and the two children I then had, Vinata and Nagaraja, and went to Suttur. At that time there were no shops in Suttur. For household goods one had to go to Hosakote on the other bank of the Kapila river and return. Since the peon of our hospital himself ran the boat, every evening he went by boat to Hosakote on the other bank and brought the goods and gave them to us. The post came twice a week. The village postman used to come from Nanjangud. The Swamiji of the Math kept a car and went to Mysore and back every day. Whenever I needed, I went to Mysore and back by that car."]}, {"n": 40, "b": ["Vinata was then five years old; I admitted her to the single-teacher school there. Nagaraja was then three years old; in Nonavinakere, due to the plague illness, a lump had come up in his thigh and had burst. We dressed that thigh wound for about 3 months. Through this Alamelu also gained experience in applying dressings. I, Alamelu, Vinata and Nagaraja were living at Suttur. In the Suttur hospital there was a doctor named Subrahmanya Iyer. He lived in the hospital quarters. There was not enough work in the hospital. He was a man with renowned experience in astrology. At that time I did not know how to read the Panchanga. He taught me to read the Panchanga and also taught me to write horoscopes.", "After staying thus for some time at Suttur, I was transferred to Hosa Agrahara in K.R. Nagar taluk. It was a Malaria Health Centre. I was the only one in that hospital. Once a week a doctor would come from Hampapura. After staying a few days at Hosa Agrahara, since my father was aged and living in the town, I asked for a transfer to Tumkur district, and was transferred to Huliyar.", "In the meantime my son Nagaraja got the plague; the lump burst, and for 3 months we used to dress it twice every day. Alamelu used to do the dressing too. Every day, leaving the head aside, the Sponge bath for his body was also done by his mother herself. The Dressing gauze would go to a depth of 9\" (nine inches). Since there was a vow to have his first hair removed in the presence of my family deity Sri Vaivateyara of Bindiganavile, he had a full head of hair. Seeing the disorder and trouble of his hair at that time, I prayed to the deity and cut the hair myself at home. Later, after he completed 4 years, we went with everyone in the family to Bindiganavile and had the first hair removed in the presence of the deity as prescribed by the scriptures. At that time there was no bus facility to Bindiganavile. We went by bus to Nagamangala, and then went to Bindiganavile and returned by bullock cart."]}, {"n": 41, "b": ["After being transferred from Hosa Agrahara to Huliyar, since when I had been a teacher in Huliyar earlier many people there were close to me, I had great convenience there. When I went to Huliyar, a man named Anantarama Iyengar of Shankha village was the Doctor in the hospital. His wife Kamalamma was a daughter of Nonavinakere. This Doctor was not very proficient in his profession. Since the people of Huliyar were already known to me, the people there used to come to my house for treatment. At that time, when going on duty I used to wear a suit, tie and boots. Seeing my dress, people and even officers took me to be the doctor and congratulated me. The Doctor could not bear this and lodged a complaint against me with the superior officers. On this complaint I was transferred from Huliyar to the Bukkapatna hospital (15 miles away from there). To bid me farewell, the people of Huliyar held a grand felicitation gathering. A delegation also went to the superior officers requesting that this transfer of mine be cancelled. But it did not succeed. After going on duty at the Bukkapatna hospital, the same situation arose there too, and within a few months they transferred me to the Sira hospital.", "Resignation from Government Service: Beginning of Private Practice", "Until then I had studied privately for the Homeopathic Diploma, passed the said examination and also obtained the Diploma. With this Diploma I got the opportunity to do private practice. The Homeopathic system of medicine was then not recognized in the Mysore Government. Even so, one could put up the title Doctor and practice. By this time, the salary I was receiving was Rs. 35/- a month. I was fed up with this trouble of (transfers). I proposed to my father that I resign from the government job and do Private Practice at Huliyar. He did not agree to leaving a government job that had the facility of pension. I told him of my courage"]}, {"n": 42, "b": ["and he reluctantly agreed to my leaving the job. Probably in 1944 I resigned from my job and started a \"Clinic\" (Vinata Aushadhalaya) to do my Practice in Huliyar.", "This clinic gave me encouragement and courage. There was no worry or difficulty about having left the government job. At that time I did not know how to ride a bicycle. I bought a bicycle from my friend for Rs. 100/-, learned to ride a bicycle on it, and used that bicycle until the end. My medical practice in Huliyar went well. The doctors who came there became jealous. During this period their effort to cause me trouble in some form did not succeed because of my popularity with the people.", "My wife Alamelu and my three children were living in Huliyar. Alamelu was very popular and clever among the women of that town. At that time the Brahmin and Vysya women in Huliyar were not very civilized. The women there used to come to Alamelu for handicrafts and for refinement. Alamelu's popularity also helped my medical practice greatly.", "My Entry into Politics", "While things were thus, unexpectedly I came to enter politics. One day, Advocate Sri K. Rangayyangar, who was then the President of the Tumkur District Congress, came to my clinic. (He too was originally from Kadaba.) Since he had been well acquainted with me earlier, and since he was an elder Sri Vaishnava, I honoured him and the other Congressmen who had come with him.", "At first they did not tell me any details; they said that with the aim of establishing a Congress committee in this town they had called a public meeting, and invited me to the meeting. Without asking me anything beforehand, without informing me of the matter, at that"]}, {"n": 43, "b": ["meeting Sri K. Rangayyangar, the District President, announced in the public meeting that a branch of the Congress Party was being started in this town and that I had been appointed its President. He also announced that I could myself appoint the members of the executive board of the local branch of this committee. I had no choice but to accept this unexpected office.", "Since the beginning I had been working in the tradition of the country's freedom, so I had to accept this. This happened in 1945, before Independence. From here on, along with my medical practice, I entered politics. I incurred the anger of government officers who were opposed to the country's freedom and had to suffer some trouble. Even so, with effort I started the local Congress branch, formed the executive committee, worked actively and gained wide public support. Because of this my medical practice suffered somewhat. Later my political work succeeded, and my work succeeded up to the taluk, district and regional levels, and I earned the reputation of being a political notable.", "This political involvement caused great loss to my medical practice. My selfless service during this political period was appreciated, and after Independence my standing in the government rose, from the local government officer up to the taluk and district ministers. When local problems arose, the officers would examine them according to my advice. That I received such respect, though I had no kinsmen, no wealth or property, and was not even native to the town, was because of my selfless service to the people.", "Through my political influence there was the opportunity to acquire a great deal of property for myself. Had I descended into selfishness through this opportunity, I would have lost the people's affection. Afterwards it would not have been possible to live in that town. My selfless service itself was the cause of this influence."]}, {"n": 44, "b": ["I gained respect on a par with all the officers, the wealthy and the educated of that district.", "After Independence, the honourable ministers from Tumkur district itself — the late T. Subrahmanya, M.V. Ramarao, Chennigaramayya — and the legislators Mali Mariyappa, Hucchamaski Gowda and N. Basavayya all respected my word. The villagers in and around Huliyar came to me not only for medical treatment but also to settle matters of politics, brothers, fathers and sons, and husbands and wives.", "My wife Alamelu too was indirectly doing political and social work. Because of the troubles of the government, she could not get the opportunity to enter politics directly. During this period I kept my eldest daughter, Sau. Vinatalakshmi, in Mysore, to be in an urban environment and for education, and she stayed in Mysore itself in the house of my sister-in-law Paddu until she completed high school. My son G. Nagaraja was left in Nonavinakere, staying with my father and elder sister, for his studies. In the meantime a few more children were born to me. All the children were born in my mother-in-law's house in Kadaba. My mother-in-law also helped in raising my children.", "In the meantime I bought a house in Somesvarapuram, Tumkur, for Rs. 7500/-, with the help of my mother-in-law's word. It brought a house rent of Rs. 25/- a month, for my children's education and for me to live in during old age. That I would later come to live in Bangalore was not in my dreams. Had this thought occurred to me then, I could have bought in Bangalore instead of Tumkur; in those days houses in Bangalore were available for purchase easily."]}, {"n": 45, "b": ["I performed the Upanayana in Nonavinakere for both of them together — Nagaraja, who was with my father in Nonavinakere, and Narayana, the second son of my paternal uncle's son Deshikacharya. Now, since my daughter Vinatalakshmi had reached marriageable age, efforts for her marriage began. The very first, I went with Vinata to Tangli village in Kadur taluk, to the house of an Electrical Contractor, landlord and Electrical Diploma holder. When the groom consented to the girl, Vinata said she did not want Tangri village or their house. The groom's side had written three letters and pressed us. We informed them that the horoscopes did not match.", "Vinata (Ammanni)'s Wedding", "My mother-in-law went to Hassan in search of a groom, went to the house in which Vinata has now been wed, made the proposal and said to bring the girl to be seen. Accordingly we took Sau. Vinatalakshmi with six people (father, mother, Paddakka, uncle, Jitti and Ammanni) to Hassan, to the house of the late Lawyer Shingayyangar. The groom was Lawyer Venkataranga Iyengar (Raju), the eldest son of the late Lawyer Shingayyangar's second family, Srimati Jayamma. He is my eldest son-in-law.", "After saying that they would write a letter after seeing the girl and if she was approved, all of us set out for Huliyar. After a few days a letter arrived saying that the girl was approved and that mokhta I should come to Hassan for the further wedding arrangements. Accordingly I went to Hassan and, as they had asked, gave a bank D.D. of Rs. 1000/- for the groom's hospitality (varopachara) and returned.", "When it became known to all our kinsmen in Kadaba and Nonavinakere that this groom from Hassan had been settled upon for my daughter Sau. Vinata, they became envious, and with the intention of preventing this wedding, they heaped false slander on us and sent to Hassan, to the groom's"]}, {"n": 46, "b": ["house, an anonymous letter written from Kadaba. Who had written this letter I came to know later. This matter of the anonymous letter I learned only later, when I went to Hassan for the wedding arrangements. Having made the wedding arrangements, I bought a sari for my daughter's wedding, and I went to Hassan to show the groom's side the sari brought to match it, and to fix the definite date of the wedding. Since I had written beforehand that I would come to Hassan that day, the groom's household knew of my arrival, and the groom's two elder brothers had gathered there when I went to their house. Everyone's face was dull, and a feeling of discouragement was evident immediately when I went there.", "When I showed the sari I had brought for the wedding and asked about the wedding date, Sri Raju's elder brother Ramakrishna Iyengar told me that this wedding arrangement had been stopped for the present. They did not even look at the sari I had taken. I, who had gone to Hassan full of enthusiasm for the wedding, was stunned by his words and fell silent. They gave no reason at all for stopping the wedding arrangement. Because of the shock, I did not ask the reason. I immediately came out of their house. I did not ask for the Rs. 1000/- I had given by D.D. Sensing this unexpected grief of mine, Raju's brother-in-law, the late Kasturiranga Iyengar, took me to his house, and although he and his wife tried to console me, my sorrow was not assuaged.", "From Hassan I went straight to Nonavinakere, told my father and elder sister of the obstruction to this wedding, and went to Huliyar and told the matter at home; everyone experienced a kind of grief. Those who were not well-disposed toward us, learning that the groom settled for my daughter in Hassan had fallen through, were indirectly rejoicing in Kadaba and Nonavinakere."]}, {"n": 47, "b": ["Two days after this, when all the talks had been settled and at the time of the wedding arrangements the groom's side suddenly said without giving any reason that this arrangement was stopped, I wrote a letter of 4 pages to the address of all the groom's elder brothers and brothers-in-law. Guessing that some anonymous letter might have reached them to cause this, without telling me about that letter and without making an effort to learn the truth — that you, all being lawyers, acted thus without examining the matter and without giving any reasons — I wrote the letter citing this. I wrote that there was no worry about losing this groom; but when we go elsewhere for a groom, if people ask the reason why the Hassan groom fell through, you should have given a reason for what we ought to say.", "In the meantime, Sri Raju's elder brother Ramakrishna Iyengar had been married to a girl of Attavara, a relative on my mother's side. Since my mother had passed away at a young age, I did not know this relationship. Secondly, Sri Raju's elder brother-in-law Kasturiranga Iyengar was related to the Dikshitars of Shantigrama. The Dikshitars of Shantigrama and Dikshita Anna Durai of Kadaba were relatives. The mother of my mother-in-law Rangamma was from the Dikshitar family of Kadaba. None of these relationships was known to me earlier. The late Dikshita Anna Durai of Kadaba had written a letter introducing my family to Kasturiranga Iyengar, the brother-in-law of his childhood friend Raju. He had mentioned that Sri Kasturiranga Iyengar, Dikshita Anna Durai and my mother-in-law Rangamma used to play games together in childhood. The mother-in-law of Sri Raju's elder brother Sri Ramakrishna Iyengar, Alamelamma, was of Attavara, and through her close relationship with my mother, she had introduced them to my father's side.", "After this, the groom's side realised that the said anonymous letter had been written out of envy by those who were ill-disposed toward us, and after a few days, to continue the wedding arrangements, they invited me to"]}, {"n": 48, "b": ["Hassan. Now when I went to Hassan, they took me to the house of Sri Raju's elder brother, Sri Ramakrishna Iyengar. There his mother-in-law Alamelamma was present and enquired after the welfare of myself and my father and spoke with us. Alamelamma was known to me as a close relative of my mother. Because of this, they became convinced that the anonymous letter that had come to them had been written out of envy. In the meantime, Sri Raju's elder brother Sri Appu Srinivasa Raghavachar was the School Inspector at Gubbi. He had gone to Kadaba and collected all the facts. I had not known that he was at Gubbi. In short, it became evident from this episode that truth surely triumphs. After this, for the wedding invitation (lagna patrike) ceremony, arrangements were made at Nonavinakere, where my father was, and the auspicious invitation function was performed.", "I was living in Huliyar. My father, being aged, was in Nonavinakere. In Kadaba there were no facilities to help with the wedding. Because of this I arranged for Sau. Vinatalakshmi's wedding to be held in Tumkur, and decided to hold it at the choultry of Dharmaratnakara Rudrayya. On Vaishakha Shuddha Dashami of the Hevilamba year (24.5.1957), the wedding was celebrated in Tumkur in a grand manner befitting those times. To this wedding came Sri Raju's brothers, sister-in-law, Sri Raju's mother, sisters and brothers-in-law.", "From the beginning I realised that Sri Raju's mother had been somewhat indifferent in the matter; this itself laid the foundation for the mishap that occurred after the wedding. I will describe the mishaps later. On the day before this wedding, I performed the Upanayana of my 2nd son Chi. Suparna at Kadaba.", "Nagaraja's Medical Education"]}, {"n": 49, "b": ["I had left my eldest son G. Nagaraja at Nonavinakere to be with my father and elder sister. From primary school until the completion of S.S.L.C. he stayed there, dear to my father and elder sister, and studied well. My elder sister was fearful in all matters. Because of this she raised Nagaraja with great fear. Because of this my son Nagaraja does not have the courage that my other children have. He scored high marks in the S.S.L.C. examination and passed in the first class. In those days, passing S.S.L.C. in the first class in rural areas was rare. Because he passed S.S.L.C. in the first class, his grandfather held a grand feast in Nonavinakere for his teachers and well-wishers.", "In that period the Registration Act for doctors was not in force. The government was thinking of bringing in a Registration Act for doctors and making a law. If such a law came into effect, I would not be able to practise my medical profession. My medical certificate was of the Homeopathy system. At that time the Homeopathy system of medicine had not been recognised in the state. I had given up the government job I had. I had abandoned the business. On top of that there were many children; thinking \"What next?\", I became afraid about livelihood. There was no family planning arrangement then as there is now.", "Nagaraja had scored enough marks in S.S.L.C. to get a seat in an Engineering college. Many of my friends pressed me to put him in P.U.C. and Engineering studies. If he were put in P.U.C., two years later his younger brother would pass S.S.L.C. There was the planning of their education, the maintenance of my household and the future weddings of the growing daughters. Besides, I was living in Huliyar, a village without a high school. Because of this I decided to send him for medical studies. Thinking that through his medical studies, the doctors'"]}, {"n": 50, "b": ["registration facility that the government was going to bring would be obtained and I could continue my medical profession and maintain the household, I decided to send him for medical studies and had him apply for L.M.P. and L.A.M.S.", "That was the last year for the L.M.P. course. From the next year there was a government order to stop the L.M.P. course. When Chi. Nagaraja passed S.S.L.C., he had not completed 16 years. There was a government order that one must have completed 16 years for medical studies. Because of this he did not get called for the interview to join L.M.P. Since my co-brother-in-law Krishna Iyengar's grandfather Gundlupandita had been a donor for the building of the Mysore Ayurvedic College, he got a seat in the L.A.M.S. course although he was under age. Moreover, he also had merit.", "Recently my son Nagaraja has been saying that he had more interest and enthusiasm for engineering studies than for medical studies, and that my father did not give the opportunity for that profession. Though this is true, he was sent for studies in this profession for the convenience of continuing my medical profession according to the law and for arranging the education of the other children later. Nagaraja, who thus objects to me, needs to think about the fact that when his own son Garudadhvaja passed S.S.L.C. in the first class, he did not send him for P.U.C. and Engineering studies.", "Later, Nagaraja was admitted to the L.A.M.S. course and left in Mysore at the house of my co-brother-in-law Krishna Iyengar. After my elder son Nagaraja, who had been with my father and elder sister in Nonavinakere, went to Mysore for further studies after his S.S.L.C., to be with them I brought my son Chi. Suparna to Nonavinakere and made arrangements for him to live with my father and elder sister. Until then Suparna had been studying high school in Mysore, at Banamayya High School."]}, {"n": 51, "b": ["G. Suparna joined the 3rd-year S.S.L.C. class at Nonavinakere High School and passed the S.S.L.C. examination.", "Beginning of the Tumkur Household", "By this time my father was 95 years old and was the Branch Post Master at Nonavinakere. Realising that it was not proper for him to be carrying out a responsible government job at this advanced age, and thinking that when Nagaraja and Suparna, who had been with him until now, went elsewhere for further studies it would not be suitable to leave my very aged father alone in Nonavinakere, I had to arrange for him to live elsewhere.", "If I were to bring him to live with me at Huliyar, the house I lived in at Huliyar was small, with 7 children, and because of the noise, and because there were no people of our own community in Huliyar, it might cause him boredom; and since after S.S.L.C. there was no opportunity for my children for further studies in Huliyar, for the convenience of the children's further studies and for the peaceful life of my father and elder sister, thinking thus, and since by this time I had bought a house in Tumkur, I arranged for them to live in Tumkur with my children (by making a rented house), and shifted the household at Nonavinakere, where they had been until then, to Tumkur. From now on, the responsibility of maintaining households in two places began for me.", "My father was receiving a pension of Rs. 25/-. I admitted my 2nd son Chi. Suparna to B.Sc. at Tumkur College and arranged for him to stay with my father. The children were joining higher studies, the daughters were approaching marriageable age, and I had to maintain households in two places out of my income. During this period my financial condition also suffered somewhat and my situation became difficult. Along with them"]}, {"n": 52, "b": ["I sent my third son Chi. Jayaram to Tumkur and admitted him to Siddaganga High School. Every day from Huliyar I used to send rations and so on to Tumkur by bus, through private bus drivers and acquaintances.", "By this time, my elder son Nagaraja, who was studying in Mysore, was told by his aunt that they could not keep him in their house. At that time J. Nagaraja was studying in the final year of medical college. Because the Swamiji Shivaratri of the Suttur Math, whom I had known well when I was in government service at Suttur, arranged for Nagaraja to stay in his hostel in Mysore. Afterwards, for six months, he went to Madikeri for Clinical Practicals and joined a government hostel there. Because of this, for me, who was the only earning member, it became financially very difficult, but with God's help I survived.", "Nagaraja completed his medical studies, passed in a good grade, and for the next Clinical Training and House Surgency he joined Tumkur General Hospital for one year and came to Tumkur to stay with my father and elder sister. The Stipend of Rs. 100/- per month that he received helped the Tumkur household a little.", "At this time my eldest daughter Sau. Vinata became pregnant, and my first grandson Chi. Shinganna was born at Tumkur General Hospital. At that time my elder son Dr. Nagaraj was a House Surgeon at Tumkur General Hospital. After 15 days my younger daughter Sau. Shailaja was born in Huliyar. One woman in confinement in Huliyar, one in Tumkur; my wife's mother performed the postnatal care in Huliyar, and my elder sister in Tumkur."]}, {"n": 53, "b": ["My 2nd son Suparna stayed with my father and elder sister in Nonavinakere and passed the S.S.L.C. examination there. Since he did not get enough marks in S.S.L.C., it was not possible to put him in any technical education. I admitted him to P.U.C. and he did his college studies staying with my father, who had by then settled in Tumkur. He studied in Tumkur up to the final B.Sc. and failed in the final examination. There are some reasons for this. Until the P.U.C. B.Sc. classes he had been in the house of my father and elder sister; in the last year of the degree, some non-cooperation arose between him and my father and elder sister, and he caused annoyance and trouble to my father and elder sister in their old age. To resolve this trouble, my father, who was distressed by it, made arrangements for a separate room for him in Tumkur, and every day food and snacks were sent to him by bus from Huliyar, a distance of 52 miles. Because of this his studies in the last year of the degree suffered and he did not pass the examination.", "The reason for this was that his grandmother, who often came from Kadaba to Tumkur, did not give proper advice regarding the complaints he used to make against my father and elder sister, and instead encouraged him. Had she not taken these children to heart and given proper advice at the right time, his studies would have gone well.", "The same thing happened to my 3rd and 4th children, Chi. Jayaram and Sridhara, and their further studies also suffered. Chi. Suparna, not passing the final year B.Sc. examination, came to Huliyar and lived with us.", "Discord in Vinata's Family", "In the meantime my eldest daughter Sau. Vinata's 2nd delivery took place in Huliyar. In the meantime, my daughter (Vinata), who was in Hassan, found it difficult to live there, since her mind was not at peace because of various kinds of harassment in their house. Since her wedding"]}, {"n": 54, "b": ["there had been non-cooperation from her brothers-in-law and sisters-in-law in her husband's house. At that time in that house there were one unmarried sister-in-law, Shanta, and 3 brothers-in-law who were still studying, and the mother-in-law. From the beginning they had never given her cooperation. Her husband would often write complaint letters against her and write to me to come to Hassan to advise her. Accordingly, when I went to Hassan, the wife and husband would be quite well. The same people who wrote the complaint letters would, when I went to Hassan, keep quiet mokhta without making any kind of complaint.", "Seeing their silence, I used to return to my town. While it was thus, my daughter Sau. Vinata, pregnant for the 3rd time, suddenly set out for Huliyar with her two children. Her arrival in this way caused astonishment and grief to me and to everyone in my house. The day after she came, for the Gokulashtami festival, my mother-in-law and my wife and children were joyfully making snacks. A kind of grief came upon everyone. When I asked the reason for her coming, she said they had told her \"Go to your town\", and that she had come away out of unhappiness. Everyone in our house who had been in festival spirits became very distressed. Thinking that if I set out for Hassan right away their anger might increase, and that if I went after a little delay their anger might subside, the very next day I travelled alone to Hassan to gather information and raised the matter with the sons-in-law. The sons-in-law made complaints against my daughter. Although I asked for forgiveness, saying that even if she had made some small mistake at a young age, please forgive her, they did not forgive. When I said that I would bring her to Hassan tomorrow, they said that she should not be brought to Hassan, and that if she were brought, she would not be admitted into the house; she would have to be in the street. Thinking that if I defied this and took her and the children there, a situation might arise in which she would, out of unhappiness, take her own life, I gave up the idea of taking her to Hassan."]}, {"n": 55, "b": ["While it was thus, after a week, her brother-in-law Keshava Prasad came to Huliyar, picked up her elder son Chi. Shinganna, who was playing and crying, a child of about 3 years, and travelled to Hassan. At that time I had gone to another village on professional work. When I returned, everyone in the house was weeping in grief. They told me the matter. I consoled the household, saying that since his own paternal uncle had come and taken him to his father's and grandmother's house, there was no reason for them to grieve so much. Though I too had immense grief in my mind, I consoled the people of the house and kept my grief within.", "Because of this, the burden of her household also fell to me. Maintaining households in two places, the children having grown, their education, and the arrangements for the weddings of the daughters owing to their age — all this stuck on my head, and during this period my life also faced some financial hardship.", "Outside, it gave rise to the rumour that her husband had abandoned their daughter. Because of this, everyone in the house felt unhappy. Grief alone came upon us and there was discouragement in the household. For that reason my daughter Sau. Vinata, despondent, gave up going to other people's houses for arishina-kumkuma or to any ceremonies. Before her wedding she had grown up in our house happily, without many tasks; it seemed that managing a household of 7–8 people in Hassan and their indifference and non-cooperation must be the cause of this. Another reason was that the people of Hassan were not much acquainted with our new relationship and with the members of our household. While it was thus, there was pressure on me from my household and from my close ones to deal through the Court and obtain relief for the future livelihood of my daughter and her minor children."]}, {"n": 56, "b": ["Thinking that if I dealt in that way the future of her household might be ruined, and with the faith that one day good times would come for her and her household would become good, and thinking that it was not an occasion to act hastily, I did not allow court proceedings. Later this household became good, and I experienced that they were happy beyond my expectation. Had I acted hastily in this matter and gone to court, her household would not have been set right. These relatives in Hassan are good people, intelligent. Whether it was the misfortune of my daughter, of us, and of the Hassan relatives, it caused an incident of this kind.", "As the proverb says, \"taaLidavanu baaLiyaanu\" (he who endures will flourish), my patience made the future of her household good. Later, this household of 12 years broke, then became one again, and has now come to run better than everyone's. For this having happened, not only our family but also the family of Hassan feel repentant. At this time my daughter Vinata, out of unhappiness, even attempted at times to end her life. Having remained faithful for 12 years, and afterwards the household becoming one again and living more happily than everyone, they have had a son and another daughter married and have two grandchildren. By God's grace, the blessings of elders, their steadfastness, and the truthfulness and patience of us, her parents, it is my opinion that she rejoined her household and came to live happily.", "How Nagaraja Became a Medical Officer", "Che. Nagaraja completed House Surgency at Tumkur, came to Huliyar and began practising with me. Through this I got a little opportunity for rest in my profession. If I had received sufficient cooperation from my son Nagaraja, I had the idea of establishing a nursing home at Huliyar with suitable staff. For this I had gathered some equipment. As I did not get his cooperation, the idea was given up. After J. Nagaraja left Tumkur and came to Huliyar, my father and"]}, {"n": 57, "b": ["elder sister to stay with them, I admitted Chi. Suparna and Chi. Jayaram to studies in Tumkur.", "Because of a kind of allergy trouble in my body, I came to Tumkur for treatment and stayed. One day my father fell ill and was admitted to the hospital; after Huliyar was informed, my son Nagaraja came to Tumkur. My mother-in-law also came from Kadaba to Tumkur. My father, in his 97th year, while we were with him, on 9-6-1964, Vaishakha Shuddha Ashtami, reached the feet of God at Tumkur Hospital.", "After finishing two days of rites in Tumkur, we travelled to Mysore for the further rites and completed the rites there. My co-brother-in-law Krishna Iyengar was living in the house of his grandfather Gundlu Pandita. With the help of Thirumalachar, the brother-in-law of Gundlu Pandita's grandson Dr. Rajan, we completed the ten days' rites at Madhuvana in Mysore.", "Since Nagaraju came to Huliyar and looked after my clinic, I got the opportunity to go on a 10-day tour of South India and return. After my father's death, the household in Tumkur was shifted to Huliyar. Nagaraja, who was looking after the clinic with me, showed lack of interest, indifference and discouragement in the profession; the patients who came to me became displeased, my clinic work declined and the income also fell. Chi. Nagaraja told his mother that Huliyar was a village, that he did not like staying here, and that he should go to a town area and begin his practice, and he began to be indifferent in his profession. Noticing this, giving up my nursing home plan, with the intention of becoming the cause of his progress, as he wished I took a rented building in a crowded area of the town of Tiptur for a clinic (1964), and took a rented house for residence in K.R. Extension, and the household"]}, {"n": 58, "b": ["was set up. Again I began to maintain households in two places. From Huliyar I supplied rations and firewood by bus every day. After my father died in Tumkur, I left Chi. Jayaram with my mother-in-law at Kadaba for his last year of S.S.L.C. studies.* My mother-in-law said she could not stay alone in the house, and she had already kept Chi. Sridhara with her in Kadaba to be with her. I myself did not send the children to be placed in another's custody. They themselves would come, tell their mother to stay with them, and take the children away. While the children were there, I helped them with money and in various other forms. Even so, in the end they used to say that they had raised my children.", "* He left home without telling anyone. He returned after about six or seven months. Thus one year of his education was lost. Later, in 1963, he was again admitted to S.S.L.C. at Kadaba. Because of this Jayarama and Sridhara wrote the examination together in 1964.", "At Kadaba, Chi. Jayarama and Sridhara failed in 1 part of the SSLC examination. (This was in 1964.) Since I then brought both of them to Huliyar, both passed in the Supplementary examination. Chi. Nagaraja taught both of them mathematics and science. His teaching was the reason for their passing.", "Having started the household in Tiptur, my mother-in-law, Chi. Nagaraja, my elder sister, Chi. Sridhara, Chi. Jayaram, Vinata and her children were kept in the Tiptur household. For some days my daughter Devaki also stayed in Tiptur and studied the first year of high school there. I admitted G. Sridhara to P.U.C. College. In Tiptur, Sridhara again came under his grandmother's company and did not complete his P.U.C. studies.", "In Tiptur, Chi. Nagaraja did not develop his profession. When Chi. Jayaramu and G. Sridhara opened the clinic door in the morning, cleaned it and sat waiting, Nagaraja remained indifferent and the practice declined. As if it were his good fortune, at that time in the state"]}, {"n": 59, "b": ["the number of doctors had fallen, and it was a time when there were no doctors at all in rural hospitals. At that time Doctor Nagappa Alva, who was administering the Medical Department, to remove the shortage of doctors began a scheme to reduce the scarcity of doctors by appointing mixed-system LAMDS and GCIM doctors to the Medical Department. Although there was a protest from the IMC against this, Dr. Alva disregarded it and began this scheme. My son Nagaraja, learning of this through the Mishras (mixed-system practitioners), without informing me, went to Bangalore for the interview and was immediately appointed in the Medical Department as an Asst. Surgeon, and came back with the order of appointment to a hospital in a village near Huliyar. With this his private medical practice came to an end, and he became a government doctor.", "J. Nagaraja was not going to progress in private medical practice. As if by his good fortune he got a government post and it turned out to be convenient. He was not suited to private medical practice for his future and livelihood. He would not have succeeded in it. His being appointed to the hospital of a village near Huliyar (Hoysalakatte) was of use to me in maintaining my household. Every day he went to the hospital from Huliyar itself and returned — by bus.", "Beginning of Settling in Bangalore", "In the meantime, G. Suparna, who was unemployed in Huliyar, received a job order at the Bangalore ITI Factory and travelled to Bangalore. After a few months he got a job in the RMS (Postal) department. In those days factory workers had no Pension facility, so since he was told to go to the RMS job, which had a pension facility, he resigned from the ITI Factory. Looking at the present factory facilities, there is a reason why it would have been beneficial had he continued in the factory job."]}, {"n": 60, "b": ["In the beginning he (Suparna) lived in a rented room in Nehru Nagar. Now J. Ramesha passed S.S.L.C. in Huliyar (1966). He did not get enough marks in the S.S.L.C. examination. Therefore he could not get admission to technical education. Staying with Chi. Suparna in Bangalore, he joined P.U.C. at Renukacharya College, and the two of them cooked for themselves.", "At this point the household in Tiptur was shifted to Huliyar. In Tiptur there were my elder sister, Nagaraja, Jayaram, Sridhara, Devaki and Ammanni's children. After Vinata came to live in Tiptur, her husband often came and went from Hassan to Tiptur. He did not bring up the matter of taking Vinata and the children to Hassan. It seems the situation of their house in Hassan was not favourable.", "By this time Sau. Chechamma had completed high school studies and was of marriageable age. It became evident that if she stayed in Huliyar, which had no contact with our own people, it would not be possible to find her a groom and arrange a wedding.", "In the meantime my mother-in-law passed away (1966) at the house of her 2nd daughter in Mysore. Although her stepson was in the town, he was not ready to perform the funeral rites. In the name of her daughter's son, my son Nagaraja, the rites were performed by my co-brother-in-law Krishna Iyengar in Mysore. Of the 2 gold bangles my mother-in-law had, my wife — her elder daughter Alamela — and the younger daughter Padmamma each kept one bangle. Had my mother-in-law asked for my advice, she could have kept her property at Kadaba and the household articles. In that house all articles were there. The house at Kadaba also passed to others. (The Kadaba house had been sold by Chitti Ajji in 1964 for Rs. 4000/-.)"]}, {"n": 61, "b": ["On my advice, Chi. Suparna took a rented house in Seshadripuram, Bangalore, on 1st Street of Anjaneya Temple. Suparna's cooperation was the reason our household came and settled in Bangalore. Before this we had never dreamed of coming and settling in Bangalore. Had this plan existed earlier, we could have bought in Bangalore itself instead of the house bought in Tumkur. At that time sites and houses were available at very low prices. Suparna's getting a job in Bangalore and coming to live in Bangalore was itself the beginning of our household coming and settling in Bangalore. In the beginning we lived in a rented house at Rs. 50/- a month, then moved to a rented house on the 2nd Street of the Anjaneya Temple at Rs. 75/- a month, then came to the front portion of the same house, paying Rs. 100/- a month rent, and stayed in that house for 12 years. That house was good fortune for us in every way, and only good came to our household there.", "In the beginning my wife and Shaila came to live in Bangalore. Suparna and Ramesha were there. For the maintenance of their household, in addition to Suparna's salary, I helped with money and goods, coming from Huliyar once a month and going back. All of us except the Tiptur household were in Huliyar. In this period, for the maintenance of my household, the help of Chi. Suparna's and Chi. Nagaraja's salaries and their cooperation was very useful to me.", "Later, Nagaraja was transferred from a place near Huliyar to a village called Haridravati in Shivamogga district, and he travelled there. After a few months Nagaraja was transferred to Gottigere near Bangalore (on the Bannerghatta Road) and lived in Bangalore itself. Now the Bangalore household received the cooperation and assistance of Suparna and Nagaraja, which was convenient for me. Because of this, Vinata, her children and my daughter Nalini were sent to Bangalore, and only my elder sister, Chechamma and Devaki remained in Huliyar with me."]}, {"n": 62, "b": ["Intending Chechamma's wedding, I sent her too to Bangalore. Later Devaki passed S.S.L.C. in Huliyar and was sent to Bangalore for further studies. My elder sister also came to Bangalore. Thus everyone in my household except myself had come to Bangalore. In the meantime Jayaram got a seat for a Diploma course at KGF Mining Polytechnic (1964), and I sent him to KGF for studies. There he did not continue his studies properly and left to wander in foreign parts (at the end of 1964). Although this wandering hindered his studies, in the course of it he became acquainted with North India and came to know well the hardships and joys of life, which proved beneficial. Afterwards, in due time, he came to Bangalore (March–April 1967) and at first joined a small job at the Khode firm, earning a very meagre salary. Later he got a job in the Electricity Department in Bangalore itself, and though he was suffering hardships, it turned out well for his future.", "I admitted my son Sridhara to the ITI course at NGEF in Bangalore (1967); not finding proper friends there, he left the said course and went away (1968). Had he returned in due time, it would have been to his advantage as well. He did not return. (He returned in 1973).", "Chechamma (Sarala)'s Wedding", "My wife worked very hard in the search for a groom for Chechamma. At that time Bangalore was still new to us. At that time in Bangalore, Ramesha was studying at Renukacharya College and Devaki was doing her degree at Maharani College. Nalini and Shaila were studying at Seshadripuram High School. In the meantime, for Nagaraja's wedding, girls had come from many places with good family connections. While Chechamma was still to be married at home, I used to send word back that I would make arrangements for his wedding after her wedding."]}, {"n": 63, "b": ["My son-in-law Sri Rangadhama and his close friend Sri Keshavamurthy were then living in Seshadripuram. Their mother was well known to Alamelu. For this reason, knowing that Sri Rangadhama was a groom available for marriage, Alamela went to the house of Sri Babanna at Balepet, where he was staying, and made the arrangements for Chechamma's wedding. Sri Babanna was also from the Hassan side, and was well acquainted with my elder son-in-law of Hassan. The suspicion had come to him that the husband had abandoned my elder daughter.", "By that time my elder daughter Vinata and her children were living in my house in Bangalore. My son-in-law used to come often from Hassan to the Bangalore house. * Saying that there was no room for such suspicion and slander, Sri Babanna and Sri Rangadhama", "* Around 1968 Ammanni came from Huliyar to the Bangalore house, bringing Ranji and Jayashri. Ranji joined the nursery at the Seshadripuram convent and Jayashri joined Ambujamma's school in Pipeline. Later, since the house was small, Raju Attambi shifted Ammanni and the children to Mysore. Ammanni lived separately in the house next to Paddakka's house. Probably in 1973-74 her family settled in Hassan.", "After telling them, they met my elder son-in-law in Hassan mokhta, and after learning from him that there were no accusations against us or against my daughter, they indicated their consent to marry Chechamma.", "Since my elder daughter was in our house, it was a great effort for my wife to find a groom for Chechamma. After examining everything well and learning that there were no real accusations of any kind, Sri Babanna and Sri Rangadhama indicated their consent to this wedding.", "Since Sri Rangadhama's only sister was in Secunderabad, it was said that Sau. Chechamma should be taken there, shown, and their approval obtained; so,"]}, {"n": 64, "b": ["without informing me, who was in Huliyar, Alamela, Chechamma, Nagaraja and another person went to Secunderabad, and after obtaining their approval, completed the engagement there itself; after the approval was settled they informed me, and then told me for the further wedding arrangements. For this wedding I made the arrangements by selling my elder sister's share of paddy field in Kadaba. Instead of keeping money in a bank for the wedding, money had been kept in the form of property.", "Sri Rangadhama was a native of Belur, and the only son of Sri Melagodu Rangaswamy Iyengar of Kaushika gotra, Vadagalai tradition. Both his father and mother had died earlier. One sister lived in Secunderabad. He had studied staying at the house of a distant relative, Lawyer Alasingachar of Hassan, obtained an Electrical Diploma, was a Supervisor at the HMT Factory in Bangalore, and is still in the same post in the same factory. The distant relative lived in the house of Sri Babanna at Balepet, Bangalore. I gave her in marriage at the Thimmayya Channamma Kalyana Mantapa on the main road of Seshadripuram, Bangalore, on Vaishakha Shuddha Ekadashi, Sunday, 17.5.1970, of the Sadharana year. All his kinsfolk were from Hassan itself and were acquainted with my elder son-in-law. At that time my elder daughter was staying in my house itself.", "They were all eagerly curious whether the elder son-in-law would come to this wedding or not. On the day before the wedding, for some reason, my elder son-in-law could not come from Hassan to Bangalore. On the morning of the wedding day, by the muhurta time, my elder son-in-law came to Bangalore. Sri Rangadhama's relatives, who had been awaiting his arrival until then, were greatly astonished, and all the false accusations that had been against my daughter until then were gone; it became clear to everyone that this slander was a rumour spread by people who were ill-disposed, and that all the accusations were baseless, and we too were glad."]}, {"n": 65, "b": ["After his marriage, Sri Rangadhama took on rent a small house in Kumara Park near our residence and began his household. At that time utensils and other articles needed for the household were given. He had inherited only a house in Belur. He had also bought a site in Bangalore West of Chord Road. He has two daughters and has built a two-storeyed house in Mariyappana Palya, Bangalore, and has obtained all the necessary facilities.", "After the wedding my daughter Chechamma, through her intelligence, arranged the house and all other comforts and has been living happily.", "(Continued in the 2nd book)", "The matters following the wedding of my second daughter Sau. Chechamma (Sarala) are continued from the previous book.", "Part: 2", "Nagaraja's Wedding", "After my 2nd daughter's wedding, efforts were made for the wedding of my first son Chi. Nagaraja. Chi. Nagaraja, being of marriageable age, appointed in the government Medical Department and having his own income, there was the intention to get him married as soon as possible; I had been waiting for the 2nd daughter's wedding, and her wedding had also taken place. By this time brides had come for him from many places. Sri Babanna's sister Rukkamma's husband Sudarshana came to us and proposed to give his only daughter Sau. Hemalata in marriage to Chi. Nagaraja. Sri Babanna, who had gone to many places searching for a groom for my 2nd daughter Chechamma and finally helped her wedding by introducing Sri Rangadhama, who was staying in his ashram, also came and made the proposal. To us in one"]}, {"n": 66, "b": ["way he had done a favour; understanding that it is humanity not to forget those who have helped and to return the favour, and believing that Sri Sudarshana, their relative, was of a good family, we gave consent to this wedding.", "Earlier, at Chechamma's wedding, our people had all said on seeing this girl that she was of good features. We had come to live in Bangalore only a few months earlier. Believing that Babanna's family were good people, we did not try to investigate further. Even if we had investigated more, there were no occasions for us to find out. On the advice of mother, father and relatives, Chi. Nagaraja also gave his consent to this wedding. Accordingly, Sri Sudarshana agreed to the wedding and consented to everything we said.", "On 16.5.1971, Sri Virodhadvat year, Vaishakha Bahula Shashthi, Sunday, at the Ubhaya Vedanta Sabha Kalyana Mantapa in Malleshwaram, Bangalore, the wedding took place, with Sudarshana's daughter Sau. Hemalata given to Chi. Nagaraja. On the very day the wedding was completed, it was demonstrated what kind of wicked and deceitful people they were. After the wedding it is the tradition to bid farewell to the relatives who have come for the wedding and to the newly-wed couple. But what happened here? As soon as the wedding was over, neither his wife Rukkamma, nor their children, nor Sri Babanna, who had pressed for this wedding, were present at the wedding hall; they slipped away. The people of the hall came, woke us up, and began driving us out of the hall, saying \"take your things and go.\" Bewildered by this conduct, I sent the groom and the bride in the car of my friend Kenkere Channappa, who had come from Huliyar for this wedding, and the rest of us reached our house by auto and on foot. As soon as the wedding was over, from this wicked behaviour I understood what kind of betrayers they were."]}, {"n": 67, "b": ["Along with this, another mishap: they concealed a disease their daughter already had, and committed breach of trust, betrayal of faith and betrayal of conscience against us, who had trusted them, and deceived us. This is the reward we received for returning the favour of Sri Babanna, who had helped in my daughter's wedding. I had never imagined in my dreams that these people would be such betrayers. The girl may have had an illness. She had no education suited to it. She had not even been taught housework. No training in conduct either. She knew nothing of handicrafts. Though living in Bangalore from the beginning, they had not even given suitable treatment for their daughter's illness. As for education, she had not even finished primary school. She knew nothing of proper conduct. That their relative Sri Babanna, who advised this wedding, says he knew none of these matters is highly improbable. Sri Rangadhama too could at least have told us separately about this; how true it is that he too says he did not know the matter, I do not know. They did not even have the hesitation of what our worth and dignity would be if we learned of this later. We ourselves consider that betraying relatives would be a blemish on our position and dignity. The nature, dignity and honour of these people can be understood from this very thing. They ruined my son's future, ruined his household and his future. While everyone arranges a wedding and uplifts a household, these people ruined the future of a household. God himself must give them the fitting reward for this. Because of this, there was disappointment in the efforts for the weddings of my other sons later.", "Two days after this wedding, their deceit and betrayal became known. My house, which should have been full of joy and enthusiasm after the wedding, became like a cremation ground, grief-stricken and brooding. Through the betrayal of our trust, it became evident what kind of robbers, betrayers and cheats they were."]}, {"n": 68, "b": ["Because this happened, I had to hear from my son Nagaraja and my other children the objection that it was a failure of duty on my part. After this wedding his enthusiasm itself was dampened, and it became a cause for despair and brooding about his future. When some close ones advised annulling this wedding, he rejected their advice, saying that for the betrayal done by the parents and relatives the girl's future and life should not be ruined. The girl herself is very good. It seems that, without being taught suitable education and conduct in childhood, she may have been groomed to deceive others.", "Within a few months of this wedding, Nagaraja was transferred from near Bangalore to Sidlaghatta (in Kolar district). Had this girl been given the opportunity to stay a while longer in our house in Bangalore, and had she received my wife's training, there was an opportunity for her to become fairly intelligent. Since he was transferred to another town and left, the opportunity was missed. Because Nagaraja was in the medical profession, without losing courage, he gave treatment suited to the disease and is carrying on the household.", "From Sidlaghatta, within a few months, through my political influence, he was transferred to Kandikere, 4 miles from Huliyar where I was. Kandikere was the town where my father had been Head Master and where I had studied at that time. My classmates who were there were very happy that my son, the grandson of their teacher, had come to their town as a Doctor. I had sent my elder sister to live with him at Kandikere. I often went from Huliyar to Kandikere and returned. But he did not earn a good name as I had expected. From Kandikere he got himself transferred to a remote village called Kanva in Channapatna taluk and left Kandikere.", "Suparna's Wedding"]}, {"n": 69, "b": ["My 2nd son Chi. Suparna had reached marriageable age, and the parents of many girls had come. Having been cheated in the matter of the first son's wedding, we had lost courage for his wedding. The children too felt hesitation about entrusting us with the responsibility of their weddings. He did not accept the girls who came. Finally he himself, on his own responsibility, decided to marry a girl from Nanjangud and sent her father to us to obtain our consent. Since he himself had agreed, we gave our consent, saying there was no objection to the wedding. He settled that he himself would take the Rs. 10,000/- that was to be spent on the wedding, and that the wedding be held in an easy, brief manner. The girl's father agreed to our suggestion that wedding gifts must certainly be given, as to my 2 married daughters. In this matter, since Suparna had not mentioned anything to us, we did not take any responsibility for the wedding. We did not even have the wedding invitation printed. We invited no one to the wedding. The reason was the doubt whether our invitees would receive due respect at the wedding. Suparna had the wedding invitation printed in his own name and himself invited his sisters and brothers-in-law.", "Suparna himself paid the bus fare and took us from Bangalore to Nanjangud. The Sau. daughters Devaki, Nalini, Shaila, Chi. Jayaram, Ramesha, Sridhara and my elder sister did not come to this wedding. Only I, Alamela, Vinata, her husband, Chechamma, her husband, my co-brother-in-law Krishna Iyengar and Paddamma went to Nanjangud for the wedding. Since we had told them to hold the wedding in brief, they had not made preparations even for this many people. After we reached there, they made the preparations.", "Since Chi. Suparna had not taken any advice from us for this wedding, we remained neutral. The sari and the mangalya needed for the wedding were also got made by Chi. Suparna himself."]}, {"n": 70, "b": ["We who had gone for the wedding went to Nanjangud the night before the wedding and, by the evening of the dhare, came back to Mysore. It became evident that the girl's people had the attitude of having bought him for Rs. 10,000.", "After the wedding, for a few months husband and wife lived together in our house. At that time I alone was living in Huliyar. Chi. Suparna wrote a letter to me at Huliyar saying that they had arranged a separate house and would go to live in a separate house. Realising that with many people living in one house it was indeed true that the freedom of the newly-wed couple was hindered, I wrote a letter telling them to go to a separate house in good faith, without taking offence. Accordingly (first in Seshadripuram, and later in Srirampura) they made a separate house and went to live there. Since then they have been living separately. Suparna, by whose support and help my household had come to Bangalore, has now gone to live separately. In a way this was a consolation to me.", "Sau. Prabha, daughter of Sri Narasimha Iyengar of Tondavadi, who lives in Nanjangud, is my daughter-in-law and Suparna's wife. They gave all the articles to be given to the groom and bride according to our custom and performed the wedding as prescribed by the scriptures. Sri Narasimha Iyengar is now late. They are our own people and good traditionalists and worthy. J. Suparna had made all the arrangements for his own wedding himself, and without the shock that occurred in Nagaraja's wedding, it was a relief to us.", "Devaki's Wedding", "By this time my 3rd daughter Devaki, having passed B.A., got a job as Telephone Operator in the Telephone Exchange (Postal Department), and we had settled on a groom who was our own people, known to us. At that time my household was all in Bangalore and"]}, {"n": 71, "b": ["I alone was in Huliyar, helping the household financially and with money. Sau. Devaki, after passing S.S.L.C. in Huliyar, came to Bangalore for college education. She passed in the first attempt in all classes.", "By now another shock and a cause of shortfall for everyone in the house occurred. In her youth she was very gentle and dignified, and every month, keeping only the amount for her own expenses, she used to give the rest of her salary to her mother. She said she would not marry the groom whom we had settled for her, and that she would marry a man she had loved earlier; though I and my family advised her in many ways, she did not listen. The groom she loved and married is not our own people. They are Madhva Brahmins. He works in her own department. Young, of suitable looks, educated. He is the only son of his parents. His parents are of good tradition, devout. His parents too did not like this wedding. The reason was that both families said they were not their own people. Since both insisted on this wedding, on the advice of their friends they had a Registered Marriage. Neither family came to the wedding. Because she rejected my well-meaning advice, she was sent out of our house. The jewellery, the mangalya and clothes that had been made were given. Afterwards the two together arranged a feast for their friends. My children went to it and returned. Now they have made a separate house and are leading life with happiness, peace and contentment. The only worry is that they are not our own people. Her husband too is very worthy. They now have 2 sons. Recently the silver vessels in the house were given to her. After this marriage this girl has forgotten our traditions. In those days a marriage of another tradition was very rare; now it is common.", "Nalini's Wedding"]}, {"n": 72, "b": ["As a result of this wedding, there was also some difficulty for the wedding of my fourth daughter Sau. Nalini. All in all, it is a consolation that he is a good groom of good tradition. The worry that she rejected a groom of our own people who had been settled for her and married like an orphan with no father or mother (Devaki) still remains with my household and with me even now. All in all, it is a joy that her household is now running well and the household is proceeding in a worthy manner.", "The husband of Sau. Devaki, Sri Vijayasimha, is a Madhva Vaishnava; that she did not marry among our own people brings no satisfaction to our family line. After some days, they have been cooperating with the people of our household. This is their self-inflicted offence, and there is not the slightest fault of the parents on either side.", "Having carried her, borne her, raised her and taught her, that we could not give her away with the pouring of water (dhare) as with all daughters is our worry. After that, Sau. Alamela went on a tour of North India and returned. I already had Enlarged Prostate and knew about it; through negligence it became a mistake. When I went to Belur for service to the deity, urine retention occurred there. From there I came to Hassan, was admitted to the district hospital, had one minor operation and one major operation, stayed there for a month, and after coming to Bangalore my right leg again began to pain and lost control; I was admitted to Malleshwaram Hospital, and again (admitted to Victoria Hospital, where) I was operated on by Dr. B.T. Sampathkumar, and stayed in Bangalore for three months. These 3 operations weakened my bodily condition and caused debility. I went again to Huliyar and was alone there.", "By this time Sau. Nalini completed her B.Sc. studies and obtained the degree. She also learned typewriting. She had reached marriageable age and her mother worked very hard in the search for a groom. Because of the experience with her elder sister Devaki, we were anxious and had decided to get her married very soon"]}, {"n": 73, "b": ["as quickly as possible. Because of Devaki's conduct, her life was somewhat affected. At whichever groom's house we went, they would ask about Devaki. In those days such a situation was rare; now such situations have become common. Finally, a groom was settled, and on 16.5.1979, Virodhikrit, Vaishakha Bahula Shashthi, Sunday, at the Palace Guttahalli Anjaneyaswamy Choultry, the wedding with Chi. Prasannakumar B.Sc. was held in great splendour.", "Sri Prasannakumar is a very worthy person; his father and mother are also good, worthy, and of good tradition. He (Prasannakumar) is the 2nd son of his parents. Had it not been for the anxiety from Devaki's case, one could have delayed more. Financially there was some difficulty for me over her wedding.", "Shaila's Wedding", "Later Shaila became a B.A. graduate and had learned typing. The groom being settled for her turned out to be somewhat special. Sau. Shaila had completed her last year of study and the examination result had not yet been published. When mother and daughter had gone to some wedding, the groom's sister Srimati Vimala said, if you are going to marry her, my brother is in Kota, Rajasthan; he has now come to Bangalore; if you like, bring the girl and show her. Sau. Nalini had gone about in many places and experienced disappointment; saying \"Where will she get a groom so soon?\", her mother took Sau. Shaila along. After 3 days, the groom's sister came and said they had approved Sau. Shaila and would marry her. On learning of this we felt astonishment, joy and also worry. The reason for worry was that her degree examination result had not come and that no preparation at all had been made for the wedding. She had not yet reached marriageable age as in the present day. For this reason we asked for 3 more months' time, and the groom's father and mother"]}, {"n": 74, "b": ["gave their consent. For this wedding, I decided to sell my house in Tumkur, and trouble arose as proper buyers did not come.", "As if by her good fortune, at last a buyer came to buy the house for 90 thousand. After giving the house on sale, while we were in the wedding arrangements, my elder sister Ammalakka suddenly died on the morning of the day after the Ganapati festival, while everyone was at home. She had seen all the clothes and articles brought for the wedding, and had seen the previous day's Gowri-Ganesha festival. All arrangements for Shaila's wedding were in progress; only the invitation function had not been done. After finishing the 2 days' rites in Bangalore, I and Chi. Nagaraja went to Gaya for the further rites and completed them and returned. I myself was the performer (karta). Later, after the invitation function was done, on 26.11.1982, Dundubhi year, Karthika Shuddha Dashami, Friday, at the Sri Rama Kalyana Mantapa in Malleshwaram, it was celebrated in the greatest splendour and joyfully, under the leadership of G. Jairam.", "This groom's grandmother was the sister of Anna Durai of Kadaba, the daughter of the maternal uncle of my mother-in-law Rangamma. When this wedding was settled, since we were not ready for the wedding and unable to conduct it, however much we said Rajasthan is far, Sau. Shaila was ready for this wedding. As if by her good fortune, a groom was found without much trouble, help came to us unexpectedly for the wedding, and the wedding was also held in splendour.", "The groom Sridhar's father, Sri Rangaswamy Iyengar's ancestral place is Haltore. His mother was the sister of Dikshita Anna Durai of Kadaba, the daughter of the maternal uncle of my mother-in-law Rangamma. Rangaswamy Iyengar's father worked in the Railway Department at Kota in Rajasthan. The son Rangaswamy Iyengar, having lived in Kadaba in his youth and completed his education in Karnataka, worked at Kota in Rajasthan. His wife Sau. Padmamma is the daughter of Sri Raja Iyengar of Nuggehalli. Both sides were known to us."]}, {"n": 75, "b": ["All their children studied in Rajasthan itself and (later) came and settled in Bangalore. They have 3 daughters and 2 sons.", "All their daughters are married in Karnataka and settled in Karnataka itself. The elder son Srinatha works in Bangalore and has built his own house at Nagarabhavi, Bangalore. Their younger son Chi. Sridhar also studied in Rajasthan itself and works in Kota at the Bharat Instrumentation Factory. He also has his own house in Kota. Of this family only Sridhar remains in Rajasthan; all the others are in Karnataka. Having been born, raised and educated in Rajasthan itself, that region has suited him well. My daughter Sau. Shaila, after going there, learned the Hindi language well and has adapted to that region. Though young, she is clever and courageous. For all this the training given by her mother is the reason. Sau. Shaila is my younger daughter. All the children of my house have immense love for her, as she is the youngest.", "Married at a young age and gone to the faraway region of Rajasthan, she has adapted to the environment there and, remaining courageous, runs her household easily. Her husband Sridhar is a very good, decent person, so I am happy. Her mother, I and my children have gone to Kota in Rajasthan and stayed there a few days and returned. It is her nature to go anywhere and conduct herself courageously.", "Ramesha's Wedding", "Now my youngest son Ramesha (Mohanram), after obtaining his B.Sc. degree, got a job at the BEML Factory in Bangalore. While doing factory work he began his further studies at his own expense. When he was studying at Huliyar High School, a co-teacher in the same High School, Sri Satyanarayana Rao, who had been trained in Dramatic Education, used to often have plays"]}, {"n": 76, "b": ["performed by the students at that school. In this my J. Ramesha used to take roles in the plays. Because of this he had an interest in dramatic studies. He joined the drama degree course at Bangalore Central College and in 3 years of study obtained the B.A. degree. During this study he gained the company of good influential people and scholars, which was indeed good for his future. While he was studying for the drama degree, everyone at home used to ridicule him, myself included. Without minding any of this, he continued his studies, and after this drama degree he joined the B.A. in Journalism course and obtained a degree in that also, and then joined the M.A. in Communication (postgraduate in journalism) and passed in first class. Because of this his qualifications are B.Sc., B.A. (Drama), B.A. (Communication), M.A. (Communication), graduate. Afterwards, along with factory work, he also received training at the newspaper \"Kannada Prabha\" under the leadership of the late Khadri Shamanna. During this period of study he came to associate with and become acquainted with the drama expert Sri B.V. Karanth, Girish Karnad, and, in journalism, Sri Lankesh, besides many other scholars. Often, many plays were staged at Bangalore Kalakshetra under his direction. For this he also received some prizes. Along with this, he joined the Communist party and also did politics. Even now this shade of communism remains in him. His associates too are communists. The religious functions that were conducted in our house did not please him. During those functions he would deliberately stay outside the house. When we resolved to perform his Upanayana, he did not agree. Observing his behaviour, I too had to remain neutral.", "While it was so, he got a Programme Executive post in All India Radio and was appointed to the All India Radio Station at Gulbarga. He resigned from his job at the BEML Factory in Bangalore and joined the radio station at Gulbarga. He had about 8 years of service at the BEML Factory. Now until now"]}, {"n": 77, "b": ["he who had been with our household in Bangalore went to Gulbarga and became separated from the household. Even so, he went on helping the Bangalore household financially. In this period itself, a 30×40 feet site in Banashankari 3rd Stage, Bangalore, was allotted to him by the BDA for about Rs. 8,000/-. Now he has built a house on this site and let it on rent. In this period he also bought a \"Java\" motorcycle. Now it has been stolen.", "In the meantime, many girls of our own community came for his wedding and pressed us with insistence. His elder brother Jairam, suspecting that if he married, the girl who came would separate him from his parents, was firm that he would not marry at all. His two elder brothers having married and living separately was the cause of this influence on him. Since Chi. Ramesha, being alone in foreign places, needed convenience for food and care, since his elder brother Jairama was firm that he would never marry, and since all the daughters of the house were married, it was our resolve that he should be married. Among those who came to give a girl to him, one was Sri K.V. Narayan, the wealthiest among our Hebbar Sri Vaishnavas. He was ready to give due financial help and conduct the wedding in splendour. He was then on duty at Gulbarga; when he came to Bangalore, after telling him, we asked that the girl be brought for approval and were awaiting his arrival in Bangalore.", "Learning that he had come for Sau. Shaila's wedding, two fathers of girls came that day to the wedding hall with their girls. He deliberately kept away from the place at that time. The reason became known later.", "After Sau. Shaila's wedding, he went to Gulbarga on duty, and wrote to me that there he had seen a girl and agreed to marry her, that the girl was a graduate and belonged to a family of good"]}, {"n": 78, "b": ["tradition, that although she was a Brahmin, she was not of our own Sri Vaishnava community, and that I should give my consent to this. By this time I had left my residence at Huliyar, come to Bangalore and was living with everyone. I replied that everything he had written was right, but since she was not of our own people it would be difficult for her later in the household to fit with our conduct, thought and traditions; that when plenty of people right here were ready to give a girl, it was not proper for him to hurry; and I wrote asking him to reconsider.", "One day the girl, with her father and mother, came to our house in Bangalore to show the girl and obtain approval. Since I did not approve of this alliance, I deliberately kept away from home that day. My wife Sau. Alamelu liked the girl and was awaiting my consent. Here, everyone in our house said: the girl he has agreed on is a Brahmin girl, and seen thus they appear traditional. What will you do if he marries a girl of a non-Brahmin caste through a registered marriage? Out of good conduct he is giving respect to us elders and asking for our consent. Later he is the one who will have to live in the household with that girl. Therefore it is proper to give my consent. If our consent were not obtained, he would certainly marry through a registered marriage. Therefore it also occurred to me that it was best to give my consent and preserve the respect he has shown to the elders. From the example that I had already been deceived in the matter of my eldest son Nagaraja's wedding and that his future household had been ruined, I had come to realise that it was not proper to take much responsibility for the weddings of any of my sons. From this expe
