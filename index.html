gehalli, of the Maudgalya gotra, Vadagalai. Her father's sister Chennamma was Dr. Krishna Iyengar's grandmother, so she married her own cousin Narayana Iyengar, the son of her paternal aunt; the book also says she was the daughter of Chennamma's elder brother. She had two elder sisters, one of whom was Yadugiriyamma, and one elder brother, Narayana Iyengar of Attavara. The wedding took place at Shankhagrama in the house of her sister Yadugiriyamma, and the story is that no olaga (ceremonial music) was played because the village had no players. (pp. 11–12)\n\nShe was popular, clever and intelligent while she lived with her husband in other places where he taught. She was skilled in rangoli, pictures of the gods made of beads, woollen work and embroidery, and she and her husband played the dice game pagade; Dr. Krishna Iyengar saw her handiwork around the house after her death. Her first child, a boy, died in infancy, followed by Ammalakka, Bhagirathi and Pankaja (who died young), then Dr. Krishna Iyengar and Dore. When her little daughter Ammalakka was widowed she gave up wearing flowers and going to haldi-kumkum functions because the child insisted on doing the same. (pp. 14–17)\n\nShe died of a postnatal infection at Dore's birth, when Dr. Krishna Iyengar was three or four, in the days when there was no treatment for it. Her husband was 35–40 and refused to remarry. His memories of her are slight: that she looked like his daughter Chechamma (Sarala), and, as if in a dream, her death rites, including rice grains put into her mouth. Her later rites were performed by his father in his name until his Upanayana. (pp. 14, 20–21)", "p26-chennamma": "Dr. Krishna Iyengar's paternal grandmother, born in Nuggehalli in Hassan district into the Maudgalya gotra, Vadagalai; her father was Ramaswamy Iyengar, her grandfather Channakeshava Iyengar, and her brother Keshava Iyengar, whose youngest daughter became Dr. Krishna Iyengar's mother. She married Krishna Iyengar \"Bhalyada\" and they had two sons and three daughters: Srinivasa (Doddappa), Sriranagamma, Garudamma, Eggamma and Dr. Krishna Iyengar's father Narayana Iyengar. (pp. 4, 11)\n\nShe had a cataract and went blind, and her husband is said to have carried her seated on his shoulders from Nuggehalli to Nonavinakere, about a hundred miles on foot. When her husband died, her youngest child, Dr. Krishna Iyengar's father, was five, and she brought up the five children in Nonavinakere under the shelter of her younger sister Nacharamma and Nacharamma's husband Kobbari Venkatachala Iyengar, who arranged all their marriages. As soon as her first son was born she placed him on Nacharamma's lap and said, \"This is your child; raise him,\" because her sister was childless. (pp. 5, 8–9)\n\nWhen Dr. Krishna Iyengar was three she was still alive; she could not see, but seated him near her, felt out his form and fondled him. She called him \"Murthy\" because she hesitated to say her husband's name, Krishna. Dr. Krishna Iyengar remembers her as beautiful and fair, befitting her parents, and she died soon afterwards. (p. 18)", "p27-nacharamma": "Chennamma's younger sister and Dr. Krishna Iyengar's \"Chikkajji\" (younger grandmother). She married Kobbari Venkatachala Iyengar of Kadaba, who traded in copra at Nonavinakere. They had no children, so Chennamma gave her firstborn Srinivasa (Doddappa) to them as their adopted son. After her husband died, her house at Nonavinakere sheltered Chennamma and her widowed children as a joint family. She gave Dr. Krishna Iyengar's father a part of that house, an old cattle shed in which he lived only a few days. She also owned a garden and a canal-irrigated paddy field near Holenarasipura, which went to her adopted grandson Deshikachar. She died of cholera in the epidemic of about 1917–18, the first of four deaths in the house within a week. (pp. 4–5, 9, 11, 13, 16, 105)", "p28-kobbari-venkatachala-iye": "Husband of Nacharamma; he came from Kadaba and settled at Nonavinakere, of the Srivatsa gotra. He traded copra, walking behind a bullock carrying loads to Bellary and back, a trip that took fifteen days, which earned him the name \"Kobbari\" (coconut) and the standing of a sahukar, a merchant-moneylender. He managed the household of Dr. Krishna Iyengar's grandfather, who had no inherited property. The couple were childless and adopted Srinivasa (Doddappa), Dr. Krishna Iyengar's eldest paternal uncle, and they sheltered Chennamma's family after her husband's death. His younger brother was the Vadhyar Srinivasa Raghavachar of Kadaba. After he died, Dr. Krishna Iyengar's aunt Garudamma took over the moneylending. (pp. 4–6, 8–9, 105)", "p29-srinivasa-iyengar-doddap": "The author's eldest paternal uncle, \"Doddappa\", first son of Krishna Iyengar \"Bhalyada\" and Chennamma. As soon as he was born Chennamma placed him on the lap of her childless younger sister Nacharamma and said \"This is your child; raise him\"; he was adopted from the Kutsya gotra into the Srivatsa gotra and was called Kobbari Srinivasa Iyengar. He studied at Nonavinakere and Kadaba, with Vedic and astrology lessons from his brother-in-law Srinivasa Raghavachar. He too became a schoolmaster and Branch Post Master at Nonavinakere, respected as one of the few in the village who knew English and Vedic lessons. His first wife died, and his second wife bore Deshikachar. He and his wife died before the author knew them, and the author never saw them; before Nacharamma's death in the cholera epidemic they were already gone. His son Deshikachar later inherited Nacharamma's property. (pp. 4–5, 9–10, 13, 16–17, 20, 105)", "p30-garudachar": "Dr. Krishna Iyengar's paternal great-grandfather. The family believes the line came from Bindinganavile, where the family deity Sri Vainateya is enshrined. He and Lakshmamma had one son, Krishna Iyengar. Nothing is known of the generation before him. (p. 4)", "p31-lakshmamma": "Wife of Garudachar and Dr. Krishna Iyengar's paternal great-grandmother. Her only recorded child is Krishna Iyengar. The book gives only her name. (p. 4)", "p32-krishna-iyengar-bhalyada": "Dr. Krishna Iyengar's paternal grandfather, known as \"Bhalyada\" Krishna Iyengar because he is said to have held the \"bhalya\" (spear) in the Mysore palace as a body guard to the Maharaja. His father was Garudachar and his mother Lakshmamma, probably of Bindiganavile, and he was probably an only son. He married Chennamma of Nuggehalli and had two sons and three daughters. (pp. 4, 8)\n\nDr. Krishna Iyengar says it was a story in itself how he met officials: when officials moved from town to town he followed on foot, bathed at dawn, put on the namam and saluted them every day, until one asked why he came, and he asked for a job; the bodyguard post was then given. Dr. Krishna Iyengar doubts this, since a bodyguard would have needed to live in Mysore and know weapons, and thinks he may have been an attendant who ran behind an official. He is said to have carried his blind wife on his shoulders from Nuggehalli to Nonavinakere. He died when Dr. Krishna Iyengar's father was five. (p. 8)", "p33-first-wife": "First wife of Dr. Krishna Iyengar's eldest uncle Srinivasa (Doddappa). She died, after which he married again. (p. 5)", "p34-second-wife": "Second wife of Dr. Krishna Iyengar's eldest uncle Srinivasa (Doddappa) and the mother of Deshikachar. She and her husband both died while their son was very small. (pp. 5, 13, 16)", "p35-kobbari-deshikachar": "Dr. Krishna Iyengar's elder cousin, son of Doddappa (Kobbari Srinivasa Iyengar) and his second wife, called \"my elder brother\" and known as Kobbari Deshikachar at Nonavinakere. His parents died while he was small, before the cholera epidemic, and he grew up in his grandmother Nacharamma's house in the joint family. He inherited the Nonavinakere house, garden and canal-irrigated paddy field near Holenarasipura as her adopted grandson. (pp. 5, 13, 16)\n\nAfter the cholera deaths he lived for some days with his aunt Eggamma. There was an idea to marry him to Ambujamma, the eldest daughter of Kuttiyamma, but she married elsewhere, and he parted from Eggamma and stayed alone in Nonavinakere. While Dr. Krishna Iyengar's father was posted at Kandikere he married at Mayasandra on someone's advice, telling his uncle nothing; the invitation, written on a postcard in a stranger's name, reached Dr. Krishna Iyengar's father, who did not go. The families did not meet for many years until the father was posted back to Nonavinakere. His second son Narayana had his Upanayana together with Dr. Krishna Iyengar's son Nagaraja at Nonavinakere. (pp. 17, 45)\n\nHe married Thimmajamma, daughter of Garudachar of Bindiganavile and Yaggamma, and had three sons and five daughters; the youngest, Rukmini, died recently. His daughter Mahalakshmi married Annayya, the eldest son of Sundararaja Iyengar of Kadaba. He lives in Malleswaram and was 90 when Dr. Krishna Iyengar wrote, in good health with his family. (pp. 5, 28)", "p36-thimmajamma": "Wife of Kobbari Deshikachar, daughter of Garudachar of Bindinganavile and Yaggamma. They had three sons and five daughters; their youngest daughter, Rukmini, died recently. At the time of writing she and the family were in good health. (p. 5)", "p37-narayana": "Second son of Kobbari Deshikachar. He is named in the book among the cousins whose Upanayana was held along with Dr. Krishna Iyengar's son Nagaraja's. (pp. 5, 45)", "p38-mahalakshmi": "Daughter of Kobbari Deshikachar, Dr. Krishna Iyengar's cousin's daughter. She married Annayya, the eldest son of Sundararaja Iyengar, who was Alamelu's paternal uncle. (p. 28)", "p39-annayya": "Eldest son of Sundararaja Iyengar of Kadaba, Alamelu's cousin. He married Mahalakshmi, daughter of Deshikachar who was the son of Dr. Krishna Iyengar's paternal uncle. (p. 28)", "p40-rukmini": "The youngest daughter of Kobbari Deshikachar and Thimmajamma. She died shortly before Dr. Krishna Iyengar wrote this account. (p. 5)", "p42-sriranagamma": "Second child of Krishna Iyengar and Chennamma, Dr. Krishna Iyengar's paternal aunt. She was married to Srinivasa Iyengar, a high school teacher. Her son Ramaswamy Iyengar retired as an engineer and his children built a house near Bhashyam Park in Malleswaram. (pp. 4, 6)", "p43-srinivasa-iyengar": "A high school teacher who married Dr. Krishna Iyengar's paternal aunt Sriranagamma. Their son Ramaswamy Iyengar became an engineer. (p. 6)", "p44-ramaswamy-iyengar": "Son of Sriranagamma and the high school teacher Srinivasa Iyengar; he retired as an engineer. His children built a house near Bhashyam Park in Malleswaram, Bangalore, and are the children of the elder sister of Prabha's mother. His name is on the list of welcoming guests in Vinatalakshmi (Ammanni)'s wedding invitation. His son K. R. Anantharaman was Marketing Director of BEML. (p. 6)", "p45-his-wife": "Wife of Ramaswamy Iyengar. The book says her children are the children of the elder sister of the mother of Prabha, Dr. Krishna Iyengar's second daughter-in-law, which makes her Prabha's mother's elder sister and ties Prabha to Dr. Krishna Iyengar's paternal family. She is not named. (p. 6)", "p46-k-r-anantharaman": "Son of Ramaswamy Iyengar and a grandson of Dr. Krishna Iyengar's paternal aunt Sriranagamma. He was the Marketing Director of Bharat Earth Movers Limited (BEML). (p. 6)", "p48-garudamma-akkachi": "Dr. Krishna Iyengar's paternal aunt, third child of Krishna Iyengar and Chennamma, called \"Akkachi\". She was married into the Kashyapa gotra, had no children, and as a widow lived afterwards in Dr. Krishna Iyengar's family's house. She was very capable in business and courageous; her braid reached her knees, and other girls asked for Garudamma-style braids with a chowri added. After her aunt Nacharamma's husband Kobbari Venkatachala Iyengar died, she managed the whole household of that family with efficiency and ran the moneylending business he had carried on. She had gone on a tour of North India with Dr. Krishna Iyengar's father, her brother, before he made another. She died of cholera three days after Nacharamma's death, in the epidemic when four people in the house died within a week. (pp. 6, 13, 16, 32)", "p49-eggamma": "Dr. Krishna Iyengar's paternal aunt, fourth child of Krishna Iyengar \"Bhalyada\" and Chennamma. She married the Vadhyar Srinivasa Raghavachar of Kadaba, of the Srivatsa gotra, the younger brother of her aunt Nacharamma's husband, and had no sons, only three daughters: Rajamma, Seetha alias Vanajamma alias Kuttamma, and Jokkamma. As a widow she lived with her mother and sisters in the joint household at Nonavinakere, where all were widowed and managed capably, and owned a house and a paddy field in Kadaba, which went to her three daughters. She sheltered Deshikachar for a time after the epidemic, and later lived at Kadaba where Alamelu's family knew her; she was alive when Alamelu and the author married and when Vinata was born. Alamelu's family's acquaintance with her was a reason the girl's side accepted the author's proposal. (pp. 6–7, 13, 17, 26, 36–37)", "p50-srinivasa-raghavachar": "The famous Vadhyar (priest and scholar) of Kadaba, of the Srivatsa gotra, the younger brother of Kobbari Venkatachala Iyengar and Dr. Krishna Iyengar's paternal uncle by marriage to Eggamma. The book calls him a great scholar in astrology and the Vedas. Dr. Krishna Iyengar's father and the adopted elder brother Doddappa studied English at the mission school in Kadaba under his protection, and he taught them the Vedas and the Purva and Apara Prayoga ritual procedures at home. He also gave Doddappa lessons in astrology and the Vedas. (pp. 6, 9)", "p51-rajamma": "Eldest daughter of Eggamma, Dr. Krishna Iyengar's cousin. Her husband Krishna Iyengar was an officer in the Civil Munsif Court. They had three sons and two daughters; the sons have died and the daughters live in Bangalore, whom Dr. Krishna Iyengar has not met. (pp. 6–7)", "p52-krishna-iyengar": "Husband of Rajamma, an officer in the Civil Munsif Court. Their three sons died, and the two daughters are in Bangalore. (pp. 6–7)", "p55-seetha-alias-vanajamma-k": "Second daughter of Eggamma and Dr. Krishna Iyengar's cousin, known as Seetha, Vanajamma, Kuttamma and, after she went to Delhi with her husband, \"Delhi Kutti\". Her husband taught her English at home, and Dr. Krishna Iyengar heard her speak and give speeches fluently in English. She lived in Mysore and, after the cholera epidemic, took Dr. Krishna Iyengar and his family there. She had a son, Raja Iyengar, and three daughters (p. 7), and also lost a nine-year-old son, Seshadri, to cholera (p. 16). (pp. 7, 16–17)", "p56-daroga-of-nonavinakere": "Husband of Seetha (Kuttamma), from the Daroga family of Nonavinakere. He was a tahsildar at Anantapur and Gooty, taught his wife English at home, and was for some time an officer in the lower-level education department of the Mysore government. He played the violin and told the future by astrology, and the queen of the Mysore palace often invited him to hear his predictions. (p. 7)", "p57-raja-iyengar": "Son of Seetha (Kuttamma) and the tahsildar. He became a veterinary doctor in the Andhra government and died young. His wife and children live in Belur. (p. 7)", "p58-ambujamma": "Eldest daughter of Seetha (Kuttamma), living in Jayanagar, Bangalore. There had once been an intention to marry her to Deshikachar, but she was married elsewhere. Dr. Krishna Iyengar has not met her. (pp. 7, 17)", "p59-sarojamma": "Second daughter of Seetha (Kuttamma) and the tahsildar. Dr. Krishna Iyengar saw her as a child and says she and her sisters were living but he has not met them. (p. 7)", "p60-mahalakshmamma": "Youngest daughter of Seetha (Kuttamma). Dr. Krishna Iyengar saw her as a child and has not met her since. (p. 7)", "p61-seshadri": "A nine-year-old son of Seetha (Kuttamma), who died of cholera two days after Dr. Krishna Iyengar's aunt Garudamma and sister Bhagirathi died in the same epidemic at Nonavinakere. (p. 16)", "p62-jokkamma": "Third daughter of Eggamma. She married Srinivasa Iyengar of Mavanuru and has died, with one daughter and one son, Rangaraja. (p. 7)", "p63-srinivasa-iyengar": "Of Mavanuru in Holenarasipura taluk, husband of Eggamma's daughter Jokkamma. Both he and his wife have died; their son Rangaraja lives in Bangalore. (p. 7)", "p64-rangaraja": "Son of Jokkamma and Srinivasa Iyengar of Mavanuru, living in Bangalore. Dr. Krishna Iyengar says he has not met him. (p. 7)", "p66-narayana-iyengar": "Dr. Krishna Iyengar's father, fifth and youngest child of Krishna Iyengar \"Bhalyada\" and Chennamma, born around 1866; after their father died when he was five, the five children grew up at Nonavinakere under the shelter of his mother's sister Nacharamma and Kobbari Venkatachala Iyengar. He and his adopted elder brother Srinivasa (Doddappa) studied English at the mission school in Kadaba, and Vedas and astrology at home from their brother-in-law the Vadhyar Srinivasa Raghavachar. He then studied at the London Mission High School in Bangalore (now Central High School), passed the SSLC in the first class, a great achievement then, and became a signalman at Srirangapatna station. Selected for signalling training in Calcutta, he resigned when plague broke out there and his elders refused to let him go. He married Ramakkamma, his maternal uncle's daughter, at Shankhagrama. (pp. 8–12)\n\nHe joined the Education Department as a schoolmaster at Rs. 8 a month, starting at Karedakuppa in Kunigal taluk and serving at Eliyur, Huliyurdurga, Chandrashekharapura, Honnudike, Kanatur, Tandaga, Nonavinakere, Kandikere, Yalanadu and Nagavalli, finishing as a headmaster at Rs. 25. In many of these he also ran the village branch post office for Rs. 4 to 8 a month. At Kanatur, when his son was born, he was Head Master on Rs. 15 while assistant masters earned Rs. 12 and 10 and the peon Rs. 5, and was the biggest officer in the village; his Smarta neighbours and years in such villages gave his children a regard for Smartas. He was efficient and popular, and villagers sent him off in sorrow when he was transferred. He taught twenty years at Nonavinakere, where elders who had been his students called him \"Meshte\" until the end. (pp. 10, 18–20)\n\nWhen his wife Ramakkamma died he was 35–40 and refused to remarry despite pressure, raising the children with Ammalakka and the household of Nacharamma and his sisters. He carried the body of his son Dore, who died at eight of cirrhosis despite a medicine called Dongre's Balamrit ordered from Bombay. He was transferred to Kandikere for four years, where every student he entered for the L.S. examination passed because he taught them at night in his own house without fee, and he received a commendation. He later served at Nagavalli, where he again ran the post office. He refused his son's wish to study at Tumkur, though the son had to give up high school. After retiring in about 1924 on a pension of Rs. 15 a month (35 years in the Education Department, drawing it for 40 years), his friends urged him to settle in Bangalore but he chose Nonavinakere out of attachment, working as Branch Post Master and as a priest (a shraddha brought Re. 1, a wedding Rs. 15) and was content with whatever he was given. (pp. 20–25)\n\nHe went on a North India tour with his sister Garudamma first, and a second of about nine months with four other Nonavinakere people (Bombay, Ahmedabad, Delhi, Haridwar, Rishikesh, Lakshman Jhula, Varanasi, Prayag, Gaya, Calcutta, Ayodhya, Puri and Madras), and walked from Nonavinakere to Melukote for the Vairamudi service 12 years in succession. He did his own laundry and cooked when Ammalakka was on leave. When he was transferred and later returned, he and the author's cousin Deshikachar resumed relations after Deshikachar's wedding that had been kept from him. He had no ancestral property except a cattle-shed part of Nacharamma's house, which he sold; he later sold his wife's jewels to buy a garden that was lost in a dispute over a path. (pp. 13, 17, 24, 32, 105, 113)\n\nAt 95 he was still Branch Post Master at Nonavinakere. He was brought to Tumkur with Ammalakka when the author found it improper for him to keep working, and he lived there while the children studied. In his 97th year he fell ill and was admitted to Tumkur Hospital, and died on 9.6.1964 (Vaishakha Shuddha Ashtami) with his family beside him, with the author's mother-in-law coming from Kadaba and his grandson Nagaraja from Huliyar. Rites of two days were done at Tumkur and ten days at Madhuvana in Mysore. His retirement felicitation photograph is in Nagaraja's house. (pp. 11, 24, 51, 57)", "p68-garudamma-ammalakka": "Dr. Krishna Iyengar's eldest sister, second child of Narayana Iyengar and Ramakkamma, called \"Ammalakka\" because a Tamil neighbour used to call her \"Ammala\". She was married at about ten, before Dr. Krishna Iyengar was born, to Record Ramaswamy Iyengar of Kadaba, who died before she came of age, leaving her a child widow. After their mother died she raised Dr. Krishna Iyengar and his younger brother, and later his children, as her own, looking after the household even through travel sickness on the move to Kandikere. She fell ill with pneumonia soon after Alamelu came to the house. Her father got her two acres of wet land at Kadaba from her husband's property; Dr. Krishna Iyengar sold it and bought 4 acres in a better location, and with the added money the Someshwarapuram house in Tumkur for Rs. 7,500. She died peacefully in Seshadripuram, Bangalore, on the morning after the Ganapati festival in 1982, just before Shaila's wedding, after looking over the wedding clothes the day before. Her rites were held at Gaya and Varanasi with Nagaraj and Jairam. Dr. Krishna Iyengar says Jayalakshmi's slow nature and cooking remind him of her. (pp. 14–15, 21–22, 33, 101–109)", "p69-record-ramaswamy-iyengar": "Of Kadaba, the child husband of Dr. Krishna Iyengar's eldest sister Ammalakka, and the paternal uncle of Seetharama Iyengar of Kadaba. He died before she came of age. His wet land at Kadaba was obtained by Dr. Krishna Iyengar's father for her livelihood. (pp. 14–15)", "p70-bhagirathi-bai": "Dr. Krishna Iyengar's second sister, third child of Narayana Iyengar and Ramakkamma, called \"Bai\" or \"Bayamma\". She resembled Dr. Krishna Iyengar's eldest daughter Vinatalakshmi and could not speak Tamil until she was ten. About 1917 she was married as the second wife of Maramat Shamanna of Kadaba, who worked in the district office at Shimoga; his seven stepchildren harassed her, and Dr. Krishna Iyengar, who went with her and studied for a year in the primary school there, says they harassed him too. She was brought to Nonavinakere for her delivery, fell ill with cholera in the epidemic and died before the birth, in the same week as Nacharamma and Garudamma. (pp. 15–16, 19, 21)", "p71-maramat-shamanna": "Of Kadaba, the Srivatsa gotra, who worked in the district office at Shimoga. His first wife left seven children, the eldest daughter already married. He took Dr. Krishna Iyengar's sister Bhagirathi as a second wife around 1917 to manage the household. (p. 16)", "p72-pankaja": "The fourth child of Narayana Iyengar and Ramakkamma. She died in infancy before Dr. Krishna Iyengar was born. Elders said she was as fair and lovely as a glass doll, and Dr. Krishna Iyengar likens her to his granddaughter Chinnu. (p. 17)", "p75-dore-doraiswamy": "Dr. Krishna Iyengar's younger brother, sixth and last child of Narayana Iyengar and Ramakkamma, named Doraiswamy and called Dore. His mother died of infection soon after his birth. Fed on cow's and buffalo's milk, he developed cirrhosis of the liver, with a swollen belly, green veins and thin limbs. He was very sweet, handsome and extremely intelligent: listening to Dr. Krishna Iyengar study he could recite the verses, lessons and tables. His father ordered Dongre's Balamrit from Bombay for him by parcel, but he died aged eight. His father carried his body for the cremation. Dr. Krishna Iyengar writes that with the medical knowledge he later gained, Dore could have been saved, and that he cured his own son Shridhar of the same illness. (pp. 20–22)", "p74-alamelu": "Alamelu was born at Kadaba, the elder daughter of Appanna Iyengar and his second wife Rangamma. She and her younger sister Padma grew up there with their grandparents Chokkanna Iyengar and Mahalakshmamma, their aunt Puttatayamma and their mother; they had no contact with their father, and as small girls had once gone to Karachi to see their maternal grandfather and uncles. She was twelve and Dr. Krishna Iyengar twenty-two when they married around 1930, in an eight-day wedding at Kadaba arranged by Cheluva Bhatta, with Puttatayamma doing all the work. She attained puberty in the second year after the wedding. Until then she played in the prakara of the Ramadevara temple with friends and was afraid to give her husband coffee or to comb his tuft. Puttatayamma taught her music, the harmonium and handicrafts. (pp. 26–32)\n\nShe came to her husband's house two years after the wedding, in 1934, knowing no housework, and was trained by his sister Ammalakka and by the neighbours. When Ammalakka fell ill with pneumonia soon after and lay in bed for about a month, the town called her coming inauspicious, but she learned the housework, cooking and daily rituals, sang devotional songs, played the harmonium and taught other girls handicrafts, and the stigma faded. She stayed at Nonavinakere with his father and sister while he trained at Victoria Hospital. She bore ten children, mostly at her mother's house in Kadaba, where her mother also helped raise them. At Suttur she travelled with her mother and the two children to the hospital quarters; she dressed Nagaraja's plague wound for three months. (pp. 33–40, 44)\n\nAt Huliyar she was popular and clever among the town's women, who came to her for handicrafts and refinement, and her popularity helped his medical practice. She also did political and social work indirectly and was made President of the Women's wing of the Hobli Congress Committee. In Bangalore she went to Babanna's house at Balepet to arrange Sarala's wedding with Rangadhama, went to Secunderabad with Sarala, Nagaraja and another person to settle the engagement, and worked hard to find grooms for Sarala and Nalini. She attended Suparna's wedding at Nanjangud and went on a first tour of North India. She went to Gulbarga to see her granddaughter and named her Alamelu. (pp. 42–44, 63–64, 69, 72, 104)\n\nAfter Shaila's wedding, with the move from Seshadripuram to Malleshwaram, she was left with few companions in a house that had always held at least ten people. She had diabetes, then high blood pressure and heart trouble, and nursing two newly delivered daughters (Nalini and Shaila) worsened it. She was admitted to K.C. General Hospital three times, then Bowring and Jayadeva Hospitals, and died on 23.9.1985 (Bhadrapada Shukla Dashami) with Vinata and Nagaraja beside her; Sridhara arrived after the fire was lit. Jairam led the rites, which cost about Rs. 20,000. Her husband writes that all his difficulties were resolved through her shrewdness, efficiency and popularity, that the household's success is hers, that she got all the articles even for the daughters, and that she was the only woman of her family who died as a sumangali. Her ear-ornament went to Sridevi and her mangalya to Jayalakshmi. Her granddaughter Alamela was named for her. (pp. 80–84, 102, 107–111)", "p116-hiriyuru-jokkanna-chokka": "Alamelu's paternal grandfather, a renowned Vedic scholar of the Srivatsa gotra, Vadagalai, who was also Post Master at Kadaba, loved by the people and talented in worldly matters, like Dr. Krishna Iyengar's father, who had known him since living in Kadaba in his youth. His garden at Kadaba, with coconut, areca nut, bananas, roses and croton plants, stone benches, a small well and footpaths laid like a park, was famous across the town, and he visited it every morning and evening. He and his wife Mahalakshmamma had two sons, Srinivasa Deshikachar alias Appanna Iyengar and Sundararaja Iyengar, and two daughters, Puttatayamma and Kamalamma. He had died some years before Dr. Krishna Iyengar's wedding, and after his death a dispute over his property began. (pp. 27–30)", "p117-mahalakshmamma": "Wife of Hiriyuru Jokkanna (Chokkanna) Iyengar and Alamelu's paternal grandmother, whose own mother was Belagam Janakamma. She lived for some years after Dr. Krishna Iyengar's wedding, and after her husband's death she stayed inside the house without showing her face to anyone in the town until she died; Dr. Krishna Iyengar stayed in her house for many days without seeing her face, and saw it only when she died, while he was in Kadaba. After Puttatayamma's death she lived under the care of her daughter-in-law Rangamma, then, after ill feeling between them, in the Kadaba house of her daughter Kamalamma, where she died. She was alive when Vinata was born. (pp. 27, 31, 36)", "p118-rangamma-dodda": "Appanna Iyengar's first wife, daughter of Ramakrishna Iyengar of Bidadi, of the Kutsa gotra. She had two sons, Srinivasa and Raju, and two daughters, Indiramma and Ambujamma. She suffered fits, which led her father-in-law to arrange a second marriage for her husband; the fits are said to have stopped afterwards. The two wives could not get along in Mysore. (pp. 28, 30)", "p119-appanna-iyengar-srinivas": "Alamelu's father, Srinivasa Deshikachar alias Appanna Iyengar, elder son of Jokkanna Iyengar, employed in the Railway Workshop at Mysore. He had two wives, both named Rangamma: the first, daughter of Ramakrishna Iyengar of Bidadi of Dr. Krishna Iyengar's Kutsa gotra, had fits, so his father married him a second time to Rangamma, only daughter of Alasingachar of Kadaba. The fits were cured after the second marriage, but the two wives could not get along, and the second Rangamma went to live with her parents-in-law at Kadaba. After his own father's death a dispute over the property arose, and when he came to Kadaba he stayed in other people's houses. He did not attend Dr. Krishna Iyengar's wedding, and Alamelu and Padma had no contact with him. He also did not come to Paddu's wedding. (pp. 28, 30–32, 37)", "p120-rangamma-chikka": "Alamelu's mother, the only daughter of Alasingachar of Kadaba, who was a classmate of Dr. Krishna Iyengar's father; her mother was the sister of Dikshita Sri Rangachar of Kadaba, so she was a first cousin of H.R. Rangaswamy Iyengar's mother. She was married as second wife to Appanna Iyengar, after his first wife's fits, and since the co-wives could not get along she left Mysore for Kadaba, where she lived with her parents-in-law and raised her daughters Alamelu and Padma with the aunt Puttatayamma. Her own father and brothers moved to Karachi after her wedding. She lived alone at Kadaba afterwards, took in the grandmother Mahalakshmamma after Puttatayamma's death, and helped with Dr. Krishna Iyengar's household in childbirth. (pp. 28–32, 37, 44)\n\nShe went to Hassan to find a groom for Vinata and proposed the house where Vinata was later wed. She worked hard at Huliyar, then at Tiptur, and lived in Dr. Krishna Iyengar's household for some years. She died in 1966 at the house of her second daughter in Mysore; her stepson would not perform the rites, so her grandson Nagaraja's name was used and Krishna Iyengar performed them. Her two gold bangles were shared by her daughters. The Kadaba house was sold for Rs. 4,000 in 1964. (pp. 45, 58, 60)", "p121-srinivasa": "Elder son of Appanna Iyengar and his first wife Dodda Rangamma, a half-brother of Alamelu. He has died; only Raju and Ambujamma of that family were living when Dr. Krishna Iyengar wrote. (p. 28)", "p122-raju": "Son of Appanna Iyengar and Dodda Rangamma, a half-brother of Alamelu. He married the daughter of Dr. Krishna Iyengar's friend Ramaswamy Iyengar, son of Seshamma, elder sister of Tirunarayana Iyengar of Nonavinakere, and settled in Mysore. (p. 28)", "p124-indiramma": "Daughter of Appanna Iyengar and his first wife, a half-sister of Alamelu. She has died. (p. 28)", "p125-ambujamma": "Daughter of Appanna Iyengar and Dodda Rangamma, a half-sister of Alamelu. She was living when Dr. Krishna Iyengar wrote, with her brother Raju. (p. 28)", "p126-padmamma-paddu": "Alamelu's younger sister Padmamma, called Paddu or Paddakka, eight years old at Dr. Krishna Iyengar's wedding (though she said the gap with Alamelu was six years). She grew up at Kadaba with her mother, grandparents and aunt Puttatayamma. After Dr. Krishna Iyengar's first child was born, she married Krishna Iyengar, the daughter's son of Gundlapandita of Mysore, at the Sampige Srinivasa temple; Sundararaja Iyengar and Ranganayakamma poured the dhare, since her father did not come. She settled in Mysore. (pp. 31–32, 37)\n\nHer household was a base for Dr. Krishna Iyengar's family: Vinata stayed in her house through high school, Nagaraja stayed there during medical college until she told him they could not keep him, and she and her husband stood by the family at every turn, including the rites after Dr. Krishna Iyengar's father died, and Suparna's wedding at Nanjangud. Her house stood next to the one where Vinata lived in Mysore. (pp. 44, 50–52, 57, 63, 69)", "p127-krishna-iyengar": "Husband of Alamelu's sister Paddu, the daughter's son of Gundlapandita, a donor to the Mysore Ayurvedic College. Dr. Krishna Iyengar calls him his co-brother-in-law and lived in his grandfather's house. When Dr. Krishna Iyengar's own father died, he helped with the rites in Mysore, and Dr. Krishna Iyengar credits Gundlapandita's donation with getting Dr. Krishna Iyengar's son Nagaraja a seat despite being under age for medical study. He also performed the funeral rites of Dr. Krishna Iyengar's mother-in-law in Nagaraja's name. (pp. 37, 50, 57, 60)", "p128-sundararaja-iyengar": "Alamelu's paternal uncle, the second son of Jokkanna Iyengar, adopted by his maternal grandfather because that grandfather had no children. He married Ranganayakamma (Bapachitri), lived for some time at Kadur and Chikkamagaluru and then at Kadaba, where he died. With his wife he poured the water of giving at Paddu's wedding. His eldest son Annayya married Mahalakshmi, daughter of Dr. Krishna Iyengar's cousin Deshikachar. (pp. 27–28, 37)", "p129-ranganayakamma-bapachitr": "Wife of Sundararaja Iyengar and daughter of a coffee planter of Chikkamagaluru; Alamelu's paternal aunt by marriage, called Bapachitri. She was still living in Bangalore when Dr. Krishna Iyengar wrote, and poured the water of giving with her husband at Paddu's wedding. (pp. 28, 37)", "p131-puttatayamma": "Alamelu's paternal aunt, elder daughter of Jokkanna Iyengar, widow of a railway guard. She lived at Kadaba under her father's shelter, managed the house and the lands after his death, and was cultured, intelligent and clever, an expert in music, the harmonium and handicrafts, which she taught Alamelu. She carried out all the work for Dr. Krishna Iyengar's wedding. She spoke to her younger sister Kamalamma so that Dr. Krishna Iyengar could stay with them while training in Bangalore. She died of breast cancer in Victoria Hospital, Bangalore, while Dr. Krishna Iyengar was studying there. (pp. 28–29, 31, 33–34)", "p132-kamalamma": "Alamelu's youngest paternal aunt, Jokkanna Iyengar's daughter, who lived at Chamarajpet, Bangalore, with her husband Raja Iyengar. They housed Dr. Krishna Iyengar while he trained as a pharmacist at Victoria Hospital and did the most to help his livelihood; he says he remains forever indebted and must remember them every day. A disagreement with Alamelu's mother over some matter led to his staying in a hotel for the last month. She later lived at Kadaba, where Alamelu's grandmother died in her house. She and her husband have died; their children live. (pp. 29, 31, 33–34)", "p133-raja-iyengar": "Accountant at the Apex Bank, Chamarajpet, Bangalore, husband of Kamalamma, Alamelu's paternal aunt. He and his wife gave Dr. Krishna Iyengar a home and every facility during his pharmacist training and, in Dr. Krishna Iyengar's words, did the most to help his livelihood. (pp. 29, 33–34)", "p135-alasingachar-alasingacha": "Alamelu's maternal grandfather, of Kadaba, a classmate of Dr. Krishna Iyengar's father there. He married the sister of Dikshita Sri Rangachar. After his wife and then his daughter Rangamma's wedding, he took his sons to Karachi, where he too was employed. He came to Dr. Krishna Iyengar's wedding from Karachi. His house at Kadaba was opposite that of Soppinakatte Aprameya Iyengar. (pp. 29–30)", "p136-his-wife": "Wife of Alasingachar, Alamelu's maternal grandmother, sister of Dikshita Sri Rangachar of Kadaba and so the paternal aunt of Anna Durai. She died before Alasingachar moved to Karachi. Her Dikshitar family and that of Shaila's father-in-law are joined again through Anna Durai's elder sister. (pp. 29–30)", "p137-srinivasa-iyengar": "Elder son of Alasingachar, Alamelu's maternal uncle, who worked in a bank in Karachi. He has died; his wife Mohanamma (Amami) and children live in Bangalore. (p. 29)", "p138-mohanamma-amami": "Wife of Srinivasa Iyengar, Alamelu's maternal uncle. After his death she and their children live in Bangalore. (p. 29)", "p139-varadaraja-iyengar": "A son of Alasingachar and Alamelu's maternal uncle. He went swimming in a pool before his marriage and drowned. (p. 29)", "p140-krishna-iyengar-krishnam": "The youngest son of Alasingachar, Alamelu's maternal uncle, who worked in the Railway Department at Karachi. He and his wife sat on the wedding seat at Dr. Krishna Iyengar's wedding as Alamelu's maternal uncle and aunt. He has died. (pp. 29–30)", "p142-sri-rangachar-dikshita": "Dikshita Sri Rangachar of Kadaba, the father of Dikshita Anna Durai, whose sister married Alasingachar. So his sister was Alamelu's maternal grandmother, and his children are Alamelu's mother's cousins. (p. 29)", "p144-dikshita-anna-durai": "Dikshita Anna Durai of Kadaba. The book says that Alamelu's mother's mother was his paternal aunt, and that his elder sister was the mother of Shaila's father-in-law. He, Kasturiranga Iyengar and Dr. Krishna Iyengar's mother-in-law Rangamma played together as children. (pp. 30, 47)", "p145-anna-durai-s-elder-siste": "Elder sister of Dikshita Anna Durai and mother of H. R. Rangaswamy Iyengar, who became Shaila's father-in-law. She and Alamelu's maternal grandmother were both daughters of the Dikshitar family of Kadaba. (p. 30)", "p77-venkataranga-iyengar-raj": "Dr. Krishna Iyengar's eldest son-in-law, Lawyer Venkataranga Iyengar (Raju), a native of Hassan, a graduate and lawyer, the eldest son of Lawyer Shingayyangar's second family, cultured, experienced, fairly well-off. He was chosen for Vinatalakshmi when Dr. Krishna Iyengar's mother-in-law found the family. After the proposal had been approved and Dr. Krishna Iyengar had paid Rs. 1,000, the groom's side suddenly stopped the arrangements without a reason, because of an anonymous letter from Kadaba; the truth came out through relatives, and the wedding took place at Tumkur on 24.5.1957. Later he wrote complaint letters against Vinata and the household was split for twelve years before it became one again. He still repents the incident and has great sympathy for Dr. Krishna Iyengar's family. (pp. 45–48, 53–56, 88)", "p152-lawyer-shingayyangar": "Late Lawyer Shingayyangar of Hassan, father of Raju. His second family, with Jayamma, included Raju as eldest son. Dr. Krishna Iyengar went to his house to see the groom. (p. 45)", "p153-jayamma": "Srimati Jayamma, the second wife of Lawyer Shingayyangar and Raju's mother. She attended the wedding, but Dr. Krishna Iyengar says that from the beginning she was somewhat indifferent in the matter, which laid the foundation for the mishap after the wedding. (pp. 45, 48)", "p154-ramakrishna-iyengar": "Raju's elder brother, a lawyer in Hassan, married to a girl of Attavara whose mother Alamelamma was a close relative of Dr. Krishna Iyengar's mother. He was the one who told Dr. Krishna Iyengar that the wedding arrangements had been stopped, without giving a reason. Once the relationship through Alamelamma came to light, the groom's side realised the anonymous letter was written out of envy. His house in Hassan also sheltered Dr. Krishna Iyengar's cousin Shringaratte. (pp. 12, 46–48)", "p155-appu-srinivasa-raghavach": "Raju's elder brother, School Inspector at Gubbi. He had gone to Kadaba and collected all the facts about Dr. Krishna Iyengar's family. (p. 48)", "p156-keshava-prasad": "Raju's younger brother. A week after Vinatalakshmi arrived at Huliyar with her children, he came and took her elder son Shinganna, then about three, back to Hassan. (p. 55)", "p157-shanta": "Raju's unmarried sister, living in Hassan with three younger brothers and the mother-in-law; Dr. Krishna Iyengar says they had never given Vinatalakshmi any cooperation. (p. 54)", "p159-kasturiranga-iyengar": "Raju's brother-in-law, the late Kasturiranga Iyengar, related to the Dikshitars of Shantigrama. When the Hassan wedding was called off, he took Dr. Krishna Iyengar to his house and tried to console him. Dikshita Anna Durai had written a letter introducing Dr. Krishna Iyengar's family to him, recalling that he, Anna Durai and Dr. Krishna Iyengar's mother-in-law Rangamma had played together as children. (pp. 46–47)", "p9182-alamelamma": "Alamelamma of Attavara, mother-in-law of Raju's elder brother Ramakrishna, and a close relative of Dr. Krishna Iyengar's mother. When Dr. Krishna Iyengar visited Hassan after the wedding arrangements were stopped, she was there and enquired after him and his father. Her presence convinced the groom's side that the anonymous letter had been written out of envy. (pp. 47–48)", "p76-vinatalakshmi": "The author's eldest child, born at Kadaba around 1936 after a long wait and called \"Ammanni\", beautiful, lively and petted by everyone: her father, Ammalakka, Eggamma and Alamelu's mother and grandmother rejoiced. She was admitted to the single-teacher school at Suttur at five. While her father kept her in Mysore for an urban education she stayed with Paddu until she finished high school. When a groom at Tangli village in Kadur taluk was proposed, an electrical contractor and landlord, she said she did not want that village or house, and the horoscopes were declared mismatched. (pp. 36–37, 40, 44–45)\n\nHer grandmother (Alamelu's mother) found the Hassan groom, Lawyer Venkataranga Iyengar (Raju), eldest son of Lawyer Shingayyangar's second family, and the girl was shown to the family with six people. After a letter of approval and the author's Rs. 1,000 draft, the groom's family suddenly stopped the arrangement because of an anonymous letter from Kadaba; the truth emerged through relatives such as Alamelamma, and the wedding was held at Tumkur on 24.5.1957 at the choultry of Dharmaratnakara Rudrayya. The day before, Suparna's Upanayana was held at Kadaba. (pp. 45–48)\n\nHer second delivery took place at Huliyar. In Hassan she lived with her mother-in-law, an unmarried sister-in-law Shanta and three brothers-in-law, and there was non-cooperation. Her husband wrote complaint letters but was quiet when her father came. Pregnant a third time, she suddenly set out for Huliyar with her two children on Gokulashtami, telling her father they had said \"go to your town\"; her brothers-in-law refused to let her return and threatened she would sit in the street. A week later her brother-in-law Keshava Prasad took away her elder son Shinganna, about three years old. She withdrew from ceremonies, and at times in her unhappiness tried to end her life. Her father refused to go to court. (pp. 52–56)\n\nShe later lived in Tiptur and then in Bangalore with her children around 1968, where Ranji joined the nursery at the Seshadripuram convent and Jayashri joined Ambujamma's school, then Raju shifted her to Mysore next to Paddakka's house, and the family settled in Hassan around 1973–74. She was staying in her father's Bangalore house when Sarala was married, and Raju came on the morning of the wedding, ending the rumour. After twelve years the household became one again; she has a son and another daughter married and grandchildren. Her father calls her patient and devout like Sita and says her example shows honesty and devotion are rewarded. She found Jayalakshmi for Jairam. (pp. 60–64, 88, 101)", "p84-dr-nagaraj": "The author's eldest son, G. Nagaraja, born about two years after Vinata at Kadaba. At about three he developed a plague lump on his thigh that burst, which his mother dressed twice a day for three months, bathing him with a sponge and keeping the gauze nine inches deep; the author cut his unruly hair himself and later had the first haircut at Bindiganavile in front of the family deity, travelling by bus to Nagamangala and then by bullock cart. He grew up at Nonavinakere with his grandfather and Ammalakka, who loved him most and raised him with so much fear that he lacked the courage of his brothers. His Upanayana was performed there together with Narayana, the second son of Deshikachar. He passed the SSLC in the first class, rare in rural areas, and his grandfather held a feast for teachers and well-wishers. (pp. 37, 40, 45, 49)\n\nThe author feared a doctors' registration law that would end his own homeopathic practice, and could not afford engineering, so he sent Nagaraja for medical studies, applying for L.M.P. and L.A.M.S. Because he was under sixteen he was not called for L.M.P., but Gundlupandita's donation to the Mysore Ayurvedic College helped him into L.A.M.S. even under age. Nagaraja later complained that he preferred engineering, and the author answers that he himself did not send his own son Garudadhwaja for engineering after SSLC. In Mysore he lived in Krishna Iyengar's house until Paddu said they could not keep him, then in the Suttur Swamiji's hostel, and went to Madikeri for six months of clinical practicals. He then did house surgency at Tumkur General Hospital for a year, on a stipend of Rs. 100 that helped the Tumkur household; his nephew Shinganna was born in that hospital during this time. (pp. 49–52)\n\nHe joined his father's practice at Huliyar, but the author's plan for a nursing home failed for lack of his cooperation. After his grandfather's death in 1964 he complained that Huliyar was a village, and the author took a clinic in Tiptur and a house in K.R. Extension for him. There he was indifferent and the practice declined while Jairam and Sridhara opened the clinic each morning; he taught the two boys mathematics and science, which helped them pass the supplementary SSLC. He gained a government job by going to Bangalore for an interview when Dr. Nagappa Alva began appointing mixed-system doctors, without telling his father, and was appointed Assistant Surgeon at Hoysalakatte. The 1966 funeral rites of Dr. Krishna Iyengar's mother-in-law (Nagaraj's maternal grandmother) at Mysore were performed in Nagaraj's name. He was later transferred to Haridravati and then Gottigere near Bangalore. (pp. 56–59, 61)\n\nHis wedding to Hemalata followed Sarala's, on 16.5.1971, and the author's account of its aftermath is sharply critical of her family. Nagaraja refused to annul it, saying she should not suffer for her parents' betrayal. Within months he was transferred to Sidlaghatta, then through the author's influence to Kandikere, where the author's classmates were glad to see the grandson of their teacher as doctor, and later to a remote village, Kanva in Channapatna taluk. He lost interest in the profession and did not earn a good name. Alamelu died with him and Vinata beside her in 1985. The author calls him thrifty and law-abiding, law-abiding and afraid of debt, with great love among relatives; he holds a gazetted post, built a house at Kamalanagar, and toured North India with his father and mother on his L.T.C. in 1983. (pp. 65–68, 80, 95, 107)", "p100-suparna": "The author's second son, who studied at Banamayya High School in Mysore, had his Upanayana at Kadaba on the day before Vinata's wedding on 24.5.1957, and then lived at Nonavinakere with his grandfather and Ammalakka to pass the SSLC in the third-year class there. He did his B.Sc. at Tumkur with his grandfather but friction with his grandfather and aunt in their old age, with his grandmother's encouragement, led to his failing the final examination. He then lived at Huliyar. (pp. 48, 50–53)\n\nHe got a job at the Bangalore ITI Factory and then the Postal RMS for its pension, taking a rented room at Nehru Nagar, then a rented house in Seshadripuram, which began the family's settling in Bangalore. His salary, with Nagaraja's, was a help to his father, and Ramesh lived with him while studying and cooking at Renukacharya College. He rose to Postal Officer through departmental exams. (pp. 59–61, 98)\n\nAfter the deception in Nagaraja's wedding he chose his own bride, Prabha of Nanjangud, decided to take the Rs. 10,000 meant for the wedding himself, had the invitation printed in his name, and took the family to Nanjangud by bus. After a few months in his father's house he moved to a separate house in Seshadripuram and Srirampura. He has built a house on Mysore Road without telling his father and has not invited him. He visits his father once a week. They have two sons, Adarsh (Madhusudana) and Abhishek. The author is sad that he is unfamiliar with his relatives and did not invite him to the naming or tonsure ceremonies. (pp. 69–70, 98–100, 107)", "p104-jairam-jayaram": "The author's third son, Jairam, was sent to Tumkur to study at Siddaganga High School, and after his grandfather died, left with Alamelu's mother at Kadaba for his last SSLC year. He left home without telling anyone and returned after six or seven months, losing a year, then was admitted again in 1963. He and Sridhara failed one part of the SSLC at Kadaba in 1964 and passed the supplementary at Huliyar, helped by Nagaraja's teaching. At Tiptur he and Sridhara opened and cleaned the clinic each morning while Nagaraja was indifferent. He won a seat at the KGF Mining Polytechnic in 1964 but left to wander, becoming acquainted with North India, and reached Bangalore in March–April 1967, where he took a small job at the Khode firm, then one in the Electricity Department. (pp. 52, 57–58, 62)\n\nHe is employed at the K.E.B., Bangalore, generous, loves entertaining guests and spends beyond limit on festivals and holy days. He toured India young, knows Hindi, and helps colleagues; he has won senior officers' friendship but never took the departmental examination. He refused to marry while his mother lived, saying his brothers' wives had brought no help, and afraid his wife would separate him from his parents. After Shaila's wedding only the author, Alamelu, Jairam and Deepu remained at home. He led the arrangements for Shaila's wedding. At the time of Nalini's wedding he put the Tumkur house in his own name to take a loan; at the time of Shaila's wedding he sold it for Rs. 90,000 and repaid the loan, and gave no account of the remaining Rs. 30,000 (a note in the book). (pp. 74, 80, 94, 100, 106)\n\nAfter his mother's death he took the lead in her funeral rites and in the days of ceremonies, which cost about Rs. 20,000, shared by his brothers. He lived alone with his father, refusing meals even at his sisters' houses, and fell ill, being faint-hearted whenever his father or others are unwell. Vinatalakshmi found him a bride, Jayalakshmi of Belur, and they married on 11.5.1986 (Akshaya year, Vaishakha Shuddha Padyami, Sunday; p. 85 says Tadige) at Hassan with all his siblings present, taking no financial help and rejecting his father's advice at the time. The author now lives under his shelter; they have no children yet. His house is called \"Amma's house\", the author says, and relatives come often. He has not tried to build a house. (pp. 80–85, 100–102, 107)", "p106-shridhara": "Dr. Krishna Iyengar's fourth son, whom he calls \"the unfortunate\" Sridhara. As a child he recovered from a liver illness through Dr. Krishna Iyengar's medicine and his mother's care. At Kadaba and at Tiptur College he lived with his grandmother, whose pampering, Dr. Krishna Iyengar says, harmed his studies; he did not finish his P.U.C. He failed a part of the SSLC in 1964 and passed the supplementary. He joined the ITI course at NGEF in 1967 but left in 1968 after a few months; Suparna repaid the stipend. He had cirrhosis and rickets in his second year and recovered through his mother's nursing. For some years his whereabouts were unknown, which grieved his mother, and he returned in 1973, over age for employment. (pp. 22, 53, 58, 62, 86)\n\nHe entered politics, became acquainted with J. Lingaiah and through him Kengal Hanumanthaiah, a former Chief Minister, who made him his personal secretary and started a weekly, \"Sachiva\", with Sridhara as editor. He was later co-editor of \"Raitabandhu\" with Narayana Gowda, who died, and editor of \"Garibi Hatao\", which stopped when its patron Jairaj died. He founded the first Rajkumar Fans' Association in Bangalore, which later passed to others. He lived apart, visiting home now and then, and no effort was made for his Upanayana or wedding; he himself agreed to marry Sridevi, a Sri Vaishnava girl, out of love, and his sisters and Dr. Krishna Iyengar helped financially afterwards. Dr. Krishna Iyengar calls him less educated but better than all the children in talent and eloquence, courageous, self-respecting, never telling his troubles, with an influence in journalism that once reached Delhi. His mother grieved over him until the end, and Jairam has the most sympathy for him. (pp. 86–88, 102)", "p112-ramesh-mohanram": "Dr. Krishna Iyengar's youngest son. He appears as the editor of the book's presentation, writing in July 2022 that the text is exactly as his father wrote it. He passed the SSLC at Huliyar in 1966 and joined P.U.C. at Renukacharya College in Bangalore, living with Suparna and cooking for themselves. He got a B.Sc. and a job at the BEML Factory, studying further at his own expense: he acted in plays at Huliyar High School under Sri Satyanarayana Rao, took a B.A. in Drama at Central College, a B.A. in Journalism and an M.A. in Communication in first class, while the family teased him. He trained at \"Kannada Prabha\" under Khadri Shamanna, came to know B.V. Karanth, Girish Karnad and Lankesh, and directed plays at Kalakshetra. (pp. 2, 60–62, 75–79)\n\nHe joined the Communist party, avoided the household's religious functions and refused his Upanayana (p. 76), though a later passage says it was performed together with his wedding on 8.4.1983 (p. 103). After eight years at BEML he became a Programme Executive at All India Radio, Gulbarga, then moved to the Delhi TV centre, helped inaugurate the Bangalore TV centre, spent a short time at Madras, and is back at Bangalore. He built a house in Banashankari 3rd Stage on a BDA site and keeps a car. Dr. Krishna Iyengar says he keeps well-educated company, has little belief in God, custom and dharma, no acquaintance with relatives, is outspoken and dresses plainly with no pride of position. He married Ratna on 8.4.1983, in a one-day wedding without printed invitations; Dr. Krishna Iyengar wrote to reconsider, but after his wife and children noted a registered marriage was possible, he agreed. Many wealthy families had sought him; he married the girl he liked after waiting for Shaila's wedding. They have two daughters, Alamela, born on 6.7.1985, and Matangi. (pp. 75–82, 102–104)", "p108-shaila": "The author's youngest daughter, born at Huliyar fifteen days after Shinganna was born at Tumkur, with Alamelu's mother doing her postnatal care while Ammalakka cared for Vinata in Tumkur. She studied at Seshadripuram High School, then did a B.A. and learned typing. At a wedding the groom's sister Vimala mentioned her brother, then in Bangalore from Kota in Rajasthan, and after three days of consideration the groom's family approved. Because her results were pending and nothing was ready, the author asked for three more months. In the meantime Ammalakka died, the day after the Ganapati festival in 1982, after looking over the wedding textiles the day before. To fund it, he sold the Tumkur house for Rs. 90,000. (pp. 52, 62, 73–75)\n\nShe married Sridhar on 26.11.1982 (Dundubhi year, Karthika Shukla Dashami, Friday) at the Sri Rama Kalyana Mantapa in Malleshwaram, with Jairam leading the arrangements. This completed the weddings of five daughters. The family left Seshadripuram for Malleshwaram after she went to Rajasthan. She learned Hindi well at Kota and adapted courageously, The author calls her clever, talkative and courageous. Her first delivery coincided with Nalini's second, straining Alamelu, and she came to Bangalore from Rajasthan when her mother was dying. Her sons are Abhijit (Ranganath) and Sannu. (pp. 94–95, 110)", "p85-hemalata": "Only daughter of Sudarshana and Rukkamma, Babanna's niece. She married Dr. Nagaraj on 16.5.1971 at the Ubhaya Vedanta Sabha Kalyana Mantapa, Malleshwaram. Dr. Krishna Iyengar writes that her family did not tell his about an illness of hers, that she had not completed primary school nor learned housework or crafts, and that he felt cheated; he says her parents, though in Bangalore, gave her no proper childhood treatment, education or household training and tied her to others by deceit and lies. He also says the girl herself is very good, of very good nature, with great love for the household, though stubborn and of little discretion, and that she has since learned household work. Nagaraj refused advice to annul the marriage, saying she should not suffer for her parents' betrayal. Dr. Krishna Iyengar thinks she could have become fairly intelligent had she stayed longer with him and received his wife's training, but Nagaraj was soon transferred. They have a son and a daughter. (pp. 65–68, 90, 96)", "p88-sarala-chechamma": "The author's second daughter, Chechamma, completed high school at Huliyar, then was sent to Bangalore for marriage, since Huliyar had no contact with their community. Her mother searched hard, going to the house of Sri Babanna at Balepet where Rangadhama stayed. Babanna's suspicion that her elder sister's husband had abandoned Vinata was cleared when he and Rangadhama met the Hassan family and found no accusations. Her mother, with Nagaraja and another person, took her to Secunderabad to be shown to Rangadhama's sister, and the engagement was settled there before her father was told. (pp. 60–64)\n\nShe married Rangadhama at the Thimmayya Channamma Kalyana Mantapa on the main road of Seshadripuram on Vaishakha Shuddha Ekadashi, Sunday, 17.5.1970 (Sadharana year); her father paid by selling Ammalakka's share of paddy land at Kadaba. The Hassan kinsmen awaited whether Raju would come, and he came on the morning of the wedding, ending the slander. (p. 64)\n\nThey began in a small rented house in Kumara Park, with four vessels from her mother and her husband's one trunk, and she later built a two-storeyed house in Rajajinagar (the earlier account says Mariyappana Palya) with telephone, fridge and grinder. She is hospitable, clever and quick to anger over trifles. She takes in many guests, which the author credits to her mother and mother-in-law's training. Her mother did not live to see it. Their daughters are Nandini and Saumini. The book says she looks like her mother Ramakkamma. (pp. 14, 65, 90–91)", "p89-sri-rangadhama": "Dr. Krishna Iyengar's second son-in-law, Sarala's husband, a native of Belur and only son of Melagodu Rangaswamy Iyengar, of Kaushika gotra, Vadagalai. Both parents had died and his only sister lives in Hyderabad. He studied in the house of a distant relative, Lawyer Alasingachar of Hassan, earned an Electrical Diploma and became a Supervisor at the HMT Factory, Bangalore. Babanna introduced him; after he and Babanna asked Raju in Hassan and learned that no real accusations existed, the match was agreed. He rented a small house in Kumara Park near Dr. Krishna Iyengar's home, inherited only a house in Belur, bought a site and built a two-storeyed house at Mariyappana Palya. Dr. Krishna Iyengar calls him simple, intelligent, trustworthy and devout, who knows hardship from growing up under others' shelter, and says Sarala is his good fortune. (pp. 62–65, 89–90)", "p164-sri-babanna": "Of Balepet, Bangalore, from the Hassan side. Rangadhama was staying at his house or ashram. He helped arrange Sarala's wedding after checking the rumours about Vinata's household with Raju. He later proposed Hemalata, his sister Rukkamma's daughter, for Nagaraja; Dr. Krishna Iyengar, feeling Babanna had done the family a favour over Sarala's wedding, gave consent. Dr. Krishna Iyengar writes that after the wedding Babanna and his family slipped away, and that he felt betrayed because, he believed, they concealed an illness of their daughter. (pp. 63–67)", "p165-lawyer-alasingachar-of-h": "A distant relative of Sri Rangadhama, in whose house Rangadhama studied; this relative lived in Sri Babanna's house at Balepet, Bangalore. (p. 64)", "p166-sri-keshavamurthy": "The close friend of Sri Rangadhama, who lived in Seshadripuram. Their mother was well known to Alamelu, which helped bring about Sarala's match. (p. 63)", "p167-sri-sudarshana": "Husband of Babanna's sister Rukkamma and father of Hemalata. He proposed his only daughter for Nagaraja and agreed to everything Dr. Krishna Iyengar's family asked. Dr. Krishna Iyengar writes bitterly that, after the wedding on 16.5.1971, the family slipped away and he came to feel they had concealed their daughter's illness. (pp. 65–67)", "p168-rukkamma": "Babanna's sister and Hemalata's mother. After the wedding she and her children left the hall without saying goodbye, and Dr. Krishna Iyengar wrote that this was how he first understood he had been betrayed. (pp. 65–66)", "p101-prabha": "Second daughter of the late T. Narasimha Iyengar of Tondavadi, living in Nanjangud, and Suparna's wife; B.A. and good at tailoring, which helps the household. She is also related to Dr. Krishna Iyengar's paternal aunt Sriranagamma's family, whose wife was her mother's elder sister. The wedding was held at Nanjangud; Suparna arranged it himself and took the Rs. 10,000 meant for the expenses. Dr. Krishna Iyengar's family went without printed invitations, and he says the bride's people acted as if they had bought him. Afterwards the couple lived with Dr. Krishna Iyengar for a few months and then in a separate house in Seshadripuram and Srirampura. (pp. 6, 69–70)\n\nThe author says she has little contact with relatives, did not come on Alamelu's annual ceremony, and once left her house locked when Nalini and her husband were invited. He suspects Narasimha's gift to Suparna may have made her feel he had been bought from Dr. Krishna Iyengar's house, but says no quarrel has occurred and he cannot say whose fault it is. He calls her family worthy. (pp. 98–99)", "p169-t-narasimha-iyengar": "Of Tondavadi, living at Nanjangud, father of Prabha. He sent word to Dr. Krishna Iyengar, agreeing to hold the wedding briefly and giving the customary gifts. He had died by the time Dr. Krishna Iyengar wrote and is described as a good traditionalist. (pp. 69–70)", "p92-devaki": "The author's third daughter, who studied the first year of high school in Tiptur and then passed S.S.L.C. at Huliyar, came to Bangalore for college and did her degree at Maharani College, passing every class on the first attempt. She became a Telephone Operator in the Telephone Exchange (Postal Department) and, gentle and dignified in her youth, gave all but her own expenses of each month's salary to her mother. A groom from within the community had been settled, but she said she would marry a man she had loved, and refused the author's and the family's advice. (pp. 58, 60, 62, 70–71)\n\nVijayasimha, a Madhva Brahmin in her own department, young, educated and an only son, was not accepted by either family because each said the other was not their own. On the advice of friends they had a registered marriage that neither family attended. She was sent out of the house with her jewellery, the mangalya and clothes that had been made, and later was given the silver vessels. Afterwards the couple held a feast for friends, to which the children went. The author grieves that he could not give her away with dhare, says her marriage of a different tradition was rare and the first change of tradition on both sides, and that it alarmed them into hastily marrying Nalini. She knew no kitchen work while living in her parents' house, but set up a separate house, bought the necessary articles, and manages it alongside her government job on sufficient income. She managed the deliveries of her children without help. (pp. 71–72, 91–92)\n\nThe couple cooperate with the family now and live happily with two sons, Akshobhya and Ananda. The author calls her very courageous and of few words, says no fault lay with the parents on either side, and regrets that he could not do for her what he did for every other child. (pp. 91–92)", "p93-sri-vijayasimha": "Devaki's husband, a B.Sc. (Diploma) graduate working in the Telephone Department, the only son of devout parents, of the Madhva Vaishnava tradition, of good lineage, customary and intelligent. Devaki married him in a registered ceremony; neither family liked the match because each was not of the other's community. Dr. Krishna Iyengar calls him very worthy. They have two sons. (pp. 71–72, 91)", "p96-nalini": "The author's fourth daughter, who studied at Seshadripuram High School, did her B.Sc. in Bangalore and learned typewriting. Her mother worked hard to find a groom, anxious after Devaki's marriage; every prospective groom's house asked about Devaki. She married Prasannakumar, a B.Sc. from Magadi, on 29.11.1979 (Siddharthi year, Margashira Shukla Dashami, Thursday; an earlier passage gives 16.5.1979), with great splendour at the endowment choultry of the Anjaneya temple at Palace Guttahalli. The wedding was somewhat hurried because of Devaki's, and no one sought her a job. The Kadaba land that was her father's share was sold to pay for it, and he found it financially hard. (pp. 61, 72–73, 92–93)\n\nShe was quick-tempered, which lessened, and efficient. By her own effort she got her own job, rented a separate house, equipped it with modern appliances and runs the household with intelligence. Her second delivery came at the same time as Shaila's first, which strained Alamelu. Her father credits her mother's training. She and Prasannakumar have a daughter, Shruti, and a son, Shrivatsa. Prabha invited Nalini and her husband to a feast at her house, but when they came she had locked up and gone out. (pp. 80, 92–93, 99, 110)", "p97-prasannakumar": "Nalini's husband, B.Sc., the second son of his parents, of good lineage, few words and calm, employed at the Bangalore Silk Merchants Society; Dr. Krishna Iyengar thinks he could have had a better job had he tried. His father retired as Deputy Director in Sericulture; Magadi is the native place. They married on 29.11.1979 (an earlier passage says 16.5.1979) at the Palace Guttahalli Anjaneyaswamy Choultry. (pp. 73, 92–93)", "p173-prasannakumar-s-father": "Father of Prasannakumar, whom Dr. Krishna Iyengar calls good, worthy and traditional; a retired Deputy Director of Sericulture from Magadi. (pp. 73, 92–93)", "p109-sridhar": "Shaila's husband, the younger son of H. R. Rangaswamy Iyengar of Kota, born and educated in Rajasthan, a B.Sc. graduate employed in a factory in Kota (the Bharat Instrumentation Factory), owning a house there. Dr. Krishna Iyengar calls him very good, decent, patient and calm, with great regard for people. His paternal grandmother was the elder sister of the late Annadorai of the Dikshita house of Kadaba and a first cousin of Rangamma, Alamelu's mother (pp. 30, 74); one passage (p. 93) calls her his mother, though his mother is Padmamma, daughter of Raja Iyengar of Nuggehalli. His father has two sons and three daughters; all except Sridhar live in Karnataka. They married on 26.11.1982 in Malleshwaram. (pp. 74–75, 93–94)", "p147-h-r-rangaswamy-iyengar": "Shaila's father-in-law, whose ancestral place is Haltore. His father worked in the Railway Department at Kota in Rajasthan, and his mother was the sister of Dikshita Anna Durai of Kadaba, daughter of the maternal uncle of Dr. Krishna Iyengar's mother-in-law Rangamma. He lived in Kadaba in his youth, studied in Karnataka and worked at Kota. He and his wife Padmamma have three daughters and two sons. (pp. 74–75)", "p148-padmamma": "Wife of H. R. Rangaswamy Iyengar and mother of Sridhar, Srinatha and three daughters; daughter of Sri Raja Iyengar of Nuggehalli. Both sides of the Shaila match were known to Dr. Krishna Iyengar's family. (pp. 74–75)", "p149-srinatha": "The elder son of H. R. Rangaswamy Iyengar and Padmamma, Sridhar's brother, who works in Bangalore and built his own house at Nagarabhavi. (p. 75)", "p113-ratna": "Ramesh's wife, a B.A. graduate and sports medallist. Her father, the late Narayana Rao, was a traditional Dakshina Kannada Brahmin of good lineage; her parents are orthodox Advaita Brahmins of South Kanara, and she has four brothers and an elder sister, all gentle. Ramesh wrote from Gulbarga that he had seen a graduate Brahmin girl of a good family, not of the Sri Vaishnava community, and asked for consent, after another suitor, K. V. Narayan, wealthiest of the Hebbar Sri Vaishnavas, had been put forward. They married on 8.4.1983. Dr. Krishna Iyengar says she is devoted to God and elders, clever at running a household and outside affairs, thrifty and a good hostess. Under Alamelu's guidance she learned the Vishishtadvaita observances and cooking and follows the family's vratas, though her husband is bound to Communist principles; Alamelu admired her. He suggests she undergo Samashrayana and Chakrankita to become a Sri Vaishnava. She was at her mother's house for delivery when Alamelu died and came two days later with the baby. (pp. 79–82, 103–104)", "p180-narayana-rao": "Ratna's late father, a traditional Dakshina Kannada Brahmin of good lineage. The wedding was held in Bangalore, near Devaiah Park, on 8.4.1983. (p. 79)", "p114-alamelu-chinnu": "Born on 6.7.1985 to Ramesh and Ratna, the elder of their daughters, in primary school by the time of writing. Alamelu, though ill, went to Gulbarga to see her, was captivated by her beauty, and the planned name Ranganayaki was dropped for Alamelu; Alamelu died soon after. Dr. Krishna Iyengar likens his little sister Pankaja's looks to hers. (pp. 17, 82, 104)", "p105-jayalakshmi": "Third daughter of Keshava Iyengar of Belur, retired from the Police Department, and Sitalakshmi, retired from the Education Department, both natives of Belur, of good lineage; she has one elder sister and three brothers, all in Bangalore. She passed the SSLC and T.C.H., worked as a teacher, and resigned at Jairam's direction. They married on 11.05.1986 at Hassan. Vinatalakshmi's condition was that she look after Dr. Krishna Iyengar and his daughters well. Dr. Krishna Iyengar calls her very good, somewhat slow, gaining experience outside; he says she got Alamelu's mangalya, and in her slow nature and cooking resembles his sister Ammalakka. Since there was another Jayalakshmi in the house opposite, they called her Lakshmi. His daughters still call the house \"Amma's\" house. (pp. 84–85, 101)", "p176-keshava-iyengar-of-belur": "Retired from the Police Department; father of Jayalakshmi, of good lineage; he and his wife gave all the articles and performed the wedding at Hassan on 11.05.1986. (p. 85)", "p177-sitalakshmi": "Retired from the Education Department; mother of Jayalakshmi, with her husband Keshava Iyengar of Belur of good lineage and good householders. (p. 85)", "p78-shinga-shinganna": "Eldest son of Raju and Vinatalakshmi, grown up with his father in Hassan; a B.Com. graduate at Karnataka Bank, decent but a little lacking in courage. He married Lakshmi in Bangalore on 28.04.1989 and was soon to be a father. He did not know the facts of the earlier mishap in his father's household until Dr. Krishna Iyengar explained them to him. He is devoted to his parents, elders and God, and holds Dr. Krishna Iyengar and his wife in great regard. (pp. 88–89)", "p79-ramapriya-ranji": "Second son of Vinatalakshmi, who grew up in Dr. Krishna Iyengar's house in childhood and has great regard for everyone there. A B.E. graduate and Lecturer at Malnad Engineering College, Hassan, responsible and thrifty, who plays like a small child with Dr. Krishna Iyengar. (p. 89)", "p80-jayashri": "The only daughter of Vinatalakshmi, married very young to the distant relative Satyaprakash; she lives with two children in an Arab country where he works. Responsible and courageous, she grew up in Dr. Krishna Iyengar's household. The family comes to India for one month each year. (p. 89)", "p90-nandini": "First daughter of Rangadhama and Sarala; passed S.S.L.C. in first class, studying the final year of a Secretarial Practice Diploma, and trained in dance; intelligent like her parents. (p. 91)", "p91-saumini-babbi": "Second daughter of Rangadhama and Sarala (Babbi), of few words, who passed S.S.L.C. with the 18th rank in Karnataka State and studies in 1st P.U.C. at M.E.S. College. She wins first or second rank, awards and prizes, with a good memory, and is accomplished in handicrafts and drawing learned from her grandmother Alamelu, who would have rejoiced to see it. Born at K.C. General Hospital, Malleshwaram. Both sisters are shy and come only to Dr. Krishna Iyengar's house. (p. 91)", "p94-akshobhya": "First son of Devaki and Vijayasimha; in primary school, intelligent and extremely mischievous. (p. 92)", "p95-ananda": "Second son of Devaki and Vijayasimha; in nursery L.K.G., of few words and much mischief, intelligent. (p. 92)", "p98-shruti": "Elder daughter of Nalini and Prasannakumar; of few words like her father, intelligent, in primary school. (p. 93)", "p99-shrivatsa": "Second son of Nalini and Prasannakumar; intelligent, in primary school. (p. 93)", "p110-abhijit-ranganath": "First son of Shaila and Sridhar, called Ranganath; in primary school, ranks in every class, intelligent and clever, only lacking courage. He speaks Hindi well but no Kannada. (p. 94)", "p111-sannu": "Second son of Shaila and Sridhar, only one and a half years old at the time. (p. 95)", "p86-garudadhwaja-deepu": "Deepu, first son of Nagaraj and Hema. As a child he lived with his mother's parents and was naughty; Alamelu brought him to Dr. Krishna Iyengar's house from nursery and he progressed well. When she died he was in the 7th class and was admitted to the 8th class elsewhere. He passed S.S.L.C. in first class, then was selected for training at the Mico Factory and left college. Dr. Krishna Iyengar wanted him to be an engineer and regrets that his father has not performed his Upanayana though he is past the age. His great-aunt Ammalakka loved him dearly and he still loves the household. (pp. 96–97)", "p87-jyothi": "Daughter of Nagaraj and Hema, who stayed with her mother's mother to attend high school, passed S.S.L.C. and is in P.U.C. Dr. Krishna Iyengar says she is a very good girl, worries about her training there, and says Alamelu would not have left the children in others' custody. (p. 97)", "p102-adarsh-madhusudana": "Elder son of Suparna and Prabha (Madhusudana), who has passed S.S.L.C. and is in P.U.C. Dr. Krishna Iyengar has not seen him for years; he came to tell him of the result and Dr. Krishna Iyengar was glad. (p. 99)", "p103-abhishek": "Second son of Suparna and Prabha, born 12 years after the first; visits with his father and looks intelligent. (p. 99)", "p107-sridevi": "Sridhara's wife, whom Dr. Krishna Iyengar says he knows little but who appears to be of good nature. The wedding was at the Sri Srinivasa temple, Rajajinagar, Bangalore, attended by Jairam, Lakshmi and Chechamma. Vinatalakshmi gave her the ear-ornament that Alamelu used to wear. (p. 102)", "p115-matangi": "Second daughter of Ramesh and Ratna (Kalu), named Pankaja after Dr. Krishna Iyengar's late elder sister; not yet in school, beautiful, very active and courageous. Dr. Krishna Iyengar believes Alamelu would have raised both children herself. (pp. 104–105)", "p73-dr-n-krishna-iyengar": "Dr. Nonavinakere Krishna Iyengar wrote this memoir in 1991, in his eighty-third year. He was of the Kutsya gotra, Apastambha sutra, Yajur shakha, Vadagalai tradition, whose family deity is Sri Vainateya (Garuda) of Bindiganavile. He was born on 26.09.1908, the first day of Navaratri in the Keelaka year, at four in the afternoon, at Attavara near Dudda in Hassan taluk, in the courtyard house of the village accountant where his maternal uncle Narayana Iyengar and his mother's mother Ajamma lived. He was the fifth child, a boy born after a first son had died and three daughters, so he was pampered. He was named Ramakrishna after Rama-deva's Navaratri recitation and his grandfather Krishna; when he joined school the \"Rama\" dropped away. His father was then Head Master at Kanatur, and a Lingayat woman, Devirmma, brought a clay Ganapati to the house in the year after his birth, starting the family's practice of worshipping Ganapati. (pp. 3–4, 11–13, 17–19)\n\nHis mother Ramakkamma died of postnatal infection at his younger brother Dore's birth, when he was about four. He remembers being taken to the tank bund, his head shaved, and carrying a ladle of water for the corpse; his own first haircut was never done at Bindiganavile as vowed. His widowed eldest sister Ammalakka raised him, with his father, and the family later moved to Kandikere, where Dore died at eight. He passed the Kannada L.S. exam at Kandikere in 1922, had his Upanayana at Nonavinakere (Rukkamma and Kutta Shyama Iyengar sat on the plank), passed the English L.S. in 1925, and joined the Maharaja's High School in Mysore, staying with Eggamma's daughter Kuttiyamma, but gave up high school at Nagavalli because meals in other people's houses were poor. He took a temporary teacher's job at Huliyar through the inspector B. Cheluvaiyengar on Rs. 13 a month, then taught at Shindigere and Kelaguru in Chikkamagaluru district. He refused several brides, including a Nonavinakere girl, and later said the enmity this created led to the court order that stopped his house-building there. (pp. 19–25, 38)\n\nThrough his father's childhood friend Cheluva Bhatta, a girl from Kadaba, Alamelu, was settled for him; he was 22 and she 12, and they married at Kadaba in the month of Karthika, probably 1930 or 1932, in an eight-day wedding. He had no proper education, no government job and no property, which worried him, his father and his sister. After Alamelu came to his house two years later, he answered a Mysore Gazette advertisement for Pharmacist Training at Victoria Hospital, Bangalore, and was selected in 1934. He stayed in the house of Kamalamma and Raja Iyengar, Alamelu's aunt and uncle, in Chamarajpet, and trained under Dr. Ramalinga Reddy, Dr. Srinivasachar, Dr. Narayana Prasad and Dr. Nanjappa. He cut off his juttu (tuft) and returned to Nonavinakere in 1935. (pp. 26–34)\n\nAt Nonavinakere he made mixtures and tablets, traded coffee beans brought from Chikkamagaluru, and started \"Vinata Medical and Provision Stores\" with school books, stationery, clocks, bicycles and the town's first gramophone, which he played in the street at night to the whole town; his partner was Rangaswamy Iyengar. His house-building th
