<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonavinakere Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: slim masthead, large scrolling tree panel, cards tinted by role. Palette: ink teal, kumkum maroon, turmeric gold on cool ivory. */
:root{--paper:#f3f1ea;--panel:#fbfaf6;--ink:#1d2b29;--mut:#5d6a66;--rule:#d9d6ca;--line:#a9b3ae;--maroon:#8a2b3d;--maroon-bg:#f6e6e8;--gold:#b9852a;--gold-bg:#f7edd6;--card:#ffffff;--shadow:0 1px 2px rgba(29,43,41,.06),0 6px 16px rgba(29,43,41,.06);--disp:'Spectral',Georgia,serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121a19;--panel:#182322;--ink:#e8ecea;--mut:#9aa8a3;--rule:#2c3a38;--line:#5b6c67;--maroon:#e08796;--maroon-bg:#3a1f26;--gold:#e0b25c;--gold-bg:#3a2f17;--card:#1e2c2a;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121a19;--panel:#182322;--ink:#e8ecea;--mut:#9aa8a3;--rule:#2c3a38;--line:#5b6c67;--maroon:#e08796;--maroon-bg:#3a1f26;--gold:#e0b25c;--gold-bg:#3a2f17;--card:#1e2c2a;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);display:flex;gap:6px;align-items:center;padding:12px clamp(16px,3vw,32px);flex-wrap:wrap}
header h1{font:600 20px/1 var(--disp);margin:0 auto 0 0;letter-spacing:.01em}
header h1 span{color:var(--maroon)}
header a,header button{font:500 14px var(--body);color:var(--ink);text-decoration:none;background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer}
header a:hover,header button:hover{border-color:var(--rule);background:var(--panel)}
header a.on{background:var(--maroon);color:#fff}
header a:focus-visible,header button:focus-visible,.card:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding:28px clamp(16px,3vw,32px) 90px;max-width:100%}
h2{font:600 clamp(30px,4vw,44px)/1.1 var(--disp);margin:0 0 8px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 20px;max-width:760px}
.lab{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
.scroll{overflow:auto;border:1px solid var(--rule);border-radius:18px;background:var(--panel);background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:22px 22px;padding:40px 40px 50px;box-shadow:var(--shadow)}
.stage{position:relative;display:inline-block;min-width:100%}
.stage svg.ln{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;align-items:center}
.apars{display:flex;gap:44px;align-items:flex-end;margin-bottom:150px;justify-content:center}
.cp{display:flex;align-items:center}
.mar{width:22px;height:0;border-top:3px solid var(--gold)}
.groups{display:flex;gap:44px;align-items:flex-start;margin-top:60px}
.kids{display:flex;gap:26px;align-items:flex-start}
.card{display:block;width:196px;min-height:78px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--line);border-radius:12px;padding:9px 12px;color:inherit;text-decoration:none;position:relative;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card b{display:block;font:600 15px/1.25 var(--disp)}
.card small{color:var(--mut);font-size:11.5px;line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .rel{display:block;font:600 9.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.card .x{display:inline-block;margin-top:6px;font:500 10.5px var(--body);color:var(--maroon);background:var(--maroon-bg);border-radius:999px;padding:1px 8px}
.card.key{background:var(--maroon-bg);border-left-color:var(--maroon)}
.card.me{outline:3px solid var(--maroon);outline-offset:3px;background:var(--maroon-bg);border-left-color:var(--maroon)}
.card.grp{background:transparent;border-style:dashed;box-shadow:none}
.glab{position:absolute;font:500 11px var(--body);background:var(--panel);padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--mut);transform:translate(-50%,-50%);white-space:nowrap;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink);text-decoration:none}
a.chip:hover{border-color:var(--gold)}
.chip.fam{background:var(--gold-bg);border-color:transparent}
.cx{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--gold);border-radius:14px;padding:18px 20px;margin:0 0 14px;max-width:820px;box-shadow:var(--shadow)}
.cx h3{margin:0 0 6px;font:600 20px/1.2 var(--disp)}.cx p{margin:0 0 12px;color:var(--ink);max-width:68ch}
input[type=search]{font:inherit;padding:10px 16px;border:1px solid var(--rule);border-radius:999px;width:min(440px,100%);margin:6px 0 4px;background:var(--card);color:var(--ink)}
.legend{color:var(--mut);font-size:13px;margin-top:22px;max-width:760px}
@media (max-width:600px){.scroll{padding:24px 16px}}

.netwrap{background:var(--panel);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:0 0 26px;max-width:1040px}
svg.net{width:100%;height:auto;display:block}
.ed{fill:none;stroke:var(--gold);opacity:.55}
.eg{cursor:pointer}.eg:hover .ed,.eg.sel .ed{opacity:1;stroke:var(--maroon)}
.eb{fill:var(--card);stroke:var(--gold);stroke-width:1.5}.eg.sel .eb{stroke:var(--maroon)}
.et{font:600 11px var(--body);fill:var(--ink);text-anchor:middle}
.ng{cursor:pointer}.nr{fill:var(--card);stroke:var(--line);stroke-width:1.5}.ng.sel .nr,.ng:hover .nr{stroke:var(--maroon);fill:var(--maroon-bg)}
.nt{font:600 12.5px var(--disp);fill:var(--ink);text-anchor:middle}
.netinfo{margin-top:10px;padding:12px 14px;border-top:1px solid var(--rule);color:var(--mut);display:flex;flex-direction:column;gap:8px}
.netinfo b{color:var(--ink);font:600 16px var(--disp)}
@media (max-width:600px){.nt{font-size:15px}}
.card.ghost{border-style:dashed;border-left-style:solid;border-left-color:var(--gold);background:var(--gold-bg)}
.glab.kin{border-color:var(--gold);color:var(--ink);background:var(--gold-bg)}
a.go{display:inline-block;margin-top:12px;font-weight:600;color:var(--maroon);text-decoration:none}
a.go:hover{text-decoration:underline}
.pl{stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 5;opacity:.8}
.ng.au .nr{fill:var(--maroon-bg);stroke:var(--maroon)}
.ed{stroke-width:4}.eg:hover .ed,.eg.sel .ed{stroke-width:5}
.mini{display:flex;flex-direction:column;gap:4px;color:var(--ink);padding-top:6px}.mini b{font:600 15px var(--disp)}.mini span{color:var(--mut);font-size:13.5px;max-width:70ch}
.story{display:flex;flex-direction:column;gap:10px;max-width:820px}
.pg{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.pg p{margin:6px 0 0;max-width:70ch;line-height:1.6}.pn{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase}
.pn a{color:var(--gold);text-decoration:none}
mark{background:var(--gold-bg);color:inherit;border-radius:4px;padding:0 2px}
details.more summary{cursor:pointer;color:var(--maroon);font-weight:600;margin:6px 0 10px}
.page{max-width:720px;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:28px 34px;box-shadow:var(--shadow);font:17px/1.75 var(--disp)}
.page p{margin:0 0 14px}
a.nl{color:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
a.nl:hover{color:var(--maroon)}
.pnav{display:flex;gap:10px;margin-top:16px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:1000px}
a.tp{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink)}
a.tp:hover{border-color:var(--gold)}a.tp b{font:600 18px var(--disp);color:var(--maroon)}a.tp span{font-size:12px;color:var(--mut)}
.cite{color:var(--muted,#777);font-size:.85em}.cite a{color:var(--maroon);margin:0 1px}.story p.sum{line-height:1.65;margin:0 0 .9em}
.cover{max-width:680px;margin:2rem auto;padding:0 1rem}.cover h2{font-family:Spectral,serif;font-size:2.4rem;color:var(--maroon);margin:.2em 0}.cover .ck{letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;color:var(--gold)}.cover .lead{font-size:1.1rem;line-height:1.65}.cover .how{line-height:1.6;padding-left:1.2em}.cover .how li{margin:.6em 0}.cover .note{font-size:.88rem;opacity:.75;margin:1.4em 0}

header{flex-wrap:wrap}
.orow{display:block;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;text-decoration:none;color:var(--ink)}
.orow b{display:block;font:600 16px/1.25 var(--disp)}.orow small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35;margin-top:2px}
.orow.key{border-left-color:var(--maroon);background:var(--maroon-bg)}
.olist details{margin:8px 0}.olist summary{cursor:pointer;font-weight:600;color:var(--maroon);padding:6px 0}
.ind{margin-left:14px;border-left:2px solid var(--rule);padding-left:10px}
body.phone main{padding:16px 14px 80px}body.phone h2{font-size:28px}
body.phone header{padding:8px 12px;gap:2px}body.phone header h1{font-size:17px;flex-basis:100%;margin:0 0 2px}
body.phone header a,body.phone header button{font-size:13px;padding:5px 10px}
body.phone .page{padding:18px 16px;font-size:16px}body.phone .cx{padding:14px}
body.phone .toc{grid-template-columns:repeat(2,1fr)}
</style>
</head>

 "parents": [], "spouses": [], "children": [], "grp": false, "kin": [{"to": "p25-ramakkamma", "label": "close relative of"}], "al": ["Alamelamma"]}}, "author": "p73-dr-n-krishna-iyengar", "conn": [{"t": "Two sisters married into two families", "x": "Chennamma, the author’s grandmother, and her younger sister Nacharamma were daughters of Ramaswamy Iyengar of Nuggehalli. Chennamma married Krishna “Bhalyada”; Nacharamma married Kobbari Venkatachala Iyengar of Kadaba, a copra merchant. Nacharamma had no children, so Chennamma placed her firstborn, Srinivasa (Doddappa), in her sister’s lap to raise as her own. He grew up as a Kobbari, and his son is Kobbari Deshikachar.", "ids": ["p26-chennamma", "p27-nacharamma", "p28-kobbari-venkatachala-iye", "p29-srinivasa-iyengar-doddap", "p35-kobbari-deshikachar"], "focus": "p27-nacharamma"}, {"t": "The same two families joined again", "x": "Venkatachala’s younger brother, the famous Vadhyar Srinivasa Raghavachar of Kadaba, married Eggamma, Chennamma’s daughter. So Eggamma married her aunt’s husband’s brother, and the Nuggehalli family and the Kobbari family of Kadaba were tied twice.", "ids": ["p50-srinivasa-raghavachar", "p28-kobbari-venkatachala-iye", "p49-eggamma", "p26-chennamma"], "focus": "p49-eggamma"}, {"t": "The author’s parents were first cousins", "x": "Narayana Iyengar, Chennamma’s youngest son, married Ramakkamma, the daughter of Keshava Iyengar, Chennamma’s elder brother. Both children descend from Ramaswamy Iyengar and Lakshmamma, so the two sides of the author’s ancestry meet in one couple.", "ids": ["p66-narayana-iyengar", "p25-ramakkamma", "p5-keshava-iyengar", "p26-chennamma"], "focus": "p73-dr-n-krishna-iyengar"}, {"t": "The author’s family and Alamelu’s family married each other twice", "x": "Besides the author’s own marriage to Alamelu, Mahalakshmi (daughter of the author’s cousin Kobbari Deshikachar) married Annayya, eldest son of Sundararaja Iyengar, Alamelu’s uncle. Annayya is Alamelu’s cousin, so the two families were joined a second time.", "ids": ["p35-kobbari-deshikachar", "p38-mahalakshmi", "p39-annayya", "p128-sundararaja-iyengar", "p74-alamelu"], "focus": "p38-mahalakshmi"}, {"t": "Shaila’s in-laws and Alamelu’s mother’s family share an old tie", "x": "Alamelu’s maternal grandmother and Dikshita Anna Durai’s father were brother and sister. Anna Durai’s elder sister was the mother of H. R. Rangaswamy Iyengar, who became Shaila’s father-in-law. The book says the relationship was joined together again by Shaila’s marriage to Sridhar.", "ids": ["p136-his-wife", "p142-sri-rangachar-dikshita", "p144-dikshita-anna-durai", "p147-h-r-rangaswamy-iyengar", "p109-sridhar", "p108-shaila"], "focus": "p109-sridhar"}, {"t": "Prabha was already a relative", "x": "Ramaswamy Iyengar, son of Sriranagamma (the author’s paternal aunt), married the elder sister of Prabha’s mother. Prabha, Suparna’s wife, is therefore a cousin of the family at Bhashyam Park.", "ids": ["p42-sriranagamma", "p44-ramaswamy-iyengar", "p45-his-wife", "p170-his-wife", "p101-prabha"], "focus": "p101-prabha"}, {"t": "Raju’s family knew the author’s mother’s family", "x": "Raju’s elder brother Ramakrishna’s mother-in-law, Alamelamma of Attavara, was a close relative of the author’s mother. Through her the two families recognised each other, which saved Vinatalakshmi’s wedding after an anonymous letter had threatened it.", "ids": ["p9182-alamelamma", "p25-ramakkamma", "p154-ramakrishna-iyengar", "p77-venkataranga-iyengar-raj"], "focus": "p9182-alamelamma"}, {"t": "Hemalata is Babanna’s niece", "x": "Rukkamma, Babanna’s sister, was Hemalata’s mother. Babanna found Rangadhama for Sarala, so the same family helped arrange two of the author’s children’s marriages.", "ids": ["p164-sri-babanna", "p168-rukkamma", "p85-hemalata", "p89-sri-rangadhama"], "focus": "p85-hemalata"}], "roots": ["Nuggehalli family", "Garudachar’s paternal line", "Dr. Krishna Iyengar’s family", "Alamelu’s family (Kadaba)", "Alasingachar’s family (Karachi)", "Dikshitars of Kadaba", "Raju’s family (Hassan)", "Rangadhama’s family (Belur)", "Babanna’s family (Balepet)", "Hemalata’s family", "Prabha’s family (Nanjangud)", "Vijayasimha’s family", "Prasannakumar’s family", "Jayalakshmi’s family (Belur)", "Ratna’s family", "Sridevi"], "book": [{"n": 1, "b": ["My Life", "Dr. Nonavinakere Krishna Iyengar", "(26.09.1908 – 13.03.2006)", "1991"]}, {"n": 2, "b": ["The writing here is exactly as Appa wrote it. In some places, for the sake of clarification, (some things have been added). And where factual details were needed, notes have been given at the bottom of the page. Other than this, everything else is just what Appa wrote; no other changes have been made.", "Ramesh (Mohanram)", "July 2022"]}, {"n": 3, "b": ["Sri Vainateya Prasanna", "Srimad Ramanujaya Namah", "Sri Nigamanta Maha Desikaya Namah", "Kunkumankita Vanavaya |", "Kundhendra Dhavalayacha ||", "Vishnu Paada Namastumastubhyam", "Pakshirajayite Namah", "Namah Pannagadaya", "Vaikuntha Vashavartine", "Sri Sindhu Shubhotpaada", "Mandaraya Garutmate", "In my eighty-third year (1991), I am writing this autobiography.", "Ramanuja Paatram | Jnana Vairagya Bhushanam | Sri Madvenkatanathayam |", "Vande Vedanta Desikam || Lakshminatha Samarambha |", "Nathayamuni Madhyamam | Asmadacharya Paryantam", "Vande Guru Paramparam Bhagavan Pundarikaksha", "Hridyagama Mayashtatam Atmasashururevesha Bahyetvam Sarva Mangalayate", "Lineage\t:\tAngirasa, Ambarisha, Yauvanashva, Trayarsheya Dravaranvita", "Gotra\t:\tKutsya", "Sutra\t:\tApastambha", "Branch\t:\tYajur Shakha, Adhyayai", "Tradition\t:\tVadagalai"]}, {"n": 4, "b": ["My Father’s Lineage", "My father’s father (my grandfather), and his father (my great-grandfather) was Garudachar. His wife was Lakshmamma (my great-grandmother). The generation before them is not known. They are believed to have been natives of Bindinganavile village, where Sri Vainateya, our family deity, is enshrined.", "The only son of this couple was Krishna Iyengar, my father’s father (my grandfather). Nothing is known about his brothers and sisters. Perhaps he was an only son. His wife was Chennamma (my father’s mother), that is, my grandmother. Chennamma was from the place Nuggehalli (in Hassan district). The gotra of the house she was born into was Maudgalya. Vadagalai tradition. My father’s mother’s (my grandmother Chennamma’s) father was Ramaswamy Iyengar. His wife was Lakshmamma. My grandmother Chennamma’s father’s father (grandfather) was Channakeshava Iyengar. His wife was Ramakkamma. The generations before them are not known.", "To my father’s father (my grandfather) Krishna Iyengar and his wife Chennamma (my grandmother), 2 sons and 3 daughters were born. The first son was Srinivasa Iyengar (my father’s elder brother). My Doddappa (elder paternal uncle). The second was Sriranagamma, the third Garudamma, the fourth Eggamma – these are my paternal aunts (father’s sisters). The fifth (the last) was Narayana Iyengar. He is my father.", "My grandmother Chennamma’s younger sister was Nacharamma. She had been given in marriage to Venkatachala Iyengar of Kadaba village, of the Srivatsa gotra. Venkatachala Iyengar came from Kadaba to Nonavinakere, the land of coconuts, settled there and carried on the coconut-kernel (copra) trade. In those days there were no bullock carts. Two big cloth sacks were tied to the two sides of a bullock’s back – this was called a “heru” (pack-load). Filling copra (the peeled kind) into both sides of these sacks, walking on foot behind the bullock, from Nonavinakere to Bellary, about two hundred miles, that is, 400 miles of travel for the round trip"]}, {"n": 5, "b": ["they would carry on trade. Once, going to Bellary from Nonavinakere and returning used to take 15 days.", "Along the way, when night fell, they would halt in the villages they came across, get up at dawn, bathe, perform sandhyavandana (daily prayers) and the daily rituals, cook, eat, and then continue the journey. Their clothing was a panche (dhoti) to wear, one panche to cover themselves, and a towel wrapped around the head. At night, one kambali (blanket) to cover themselves. For sleeping at night, they would ask in the village where they had halted and borrow a mat; when leaving the village they would return that mat. For the bullock, they would ask for grass in the village where they had halted, bring it and feed it. Because he did the copra trade, he came to be called Kobbari Venkatachala Iyengar. Because he did the copra trade, in those days, as he carried on business, he was regarded as a sahukar (wealthy merchant-moneylender).", "In those days, only those who had 2–3 thousand rupees were sahukars. This couple had no children. Therefore, Nacharamma’s elder sister, that is, my grandmother Chennamma, as soon as she gave birth to her first son, that is, her eldest son (my Doddappa) Srinivasa Iyengar, placed him on the lap of her younger sister Nacharamma and said, “This is your child; raise him.” Because of this, my Doddappa Srinivasa Iyengar was adopted from the Kutsya gotra into the Srivatsa gotra, and he too came to be called Kobbari Srinivasa Iyengar from then on. Srinivasa Iyengar’s first wife passed away, and in his second wife he had a son, who is my elder brother Deshikachar, presently living in Malleswaram. He too is known as Kobbari Deshikachar in Nonavinakere. This Deshikachar was married to Thimmajamma, daughter of Garudachar of Bindinganavile and Yaggamma, and (he) had three sons and five daughters; the youngest daughter, Rukmini, passed away only recently. At the time of writing this account, my elder brother Kobbari Deshikachar is 90 years old, and his family and Thimmajamma too are in good health."]}, {"n": 6, "b": ["My grandfather Krishna Iyengar and Chennamma’s 2nd child was Sriranagamma. Sriranagamma was given in marriage to one Srinivasa Iyengar. This Srinivasa Iyengar was a high school teacher. His son Ramaswamy Iyengar had retired as an engineer. His children have built a house near Bhashyam Park in Malleswaram, Bangalore. These people are the children of the elder sister of the mother of Prabha, my second daughter-in-law. (This Ramaswamy Iyengar’s name is in the list of those welcoming guests in Ammanni’s wedding invitation. And this Ramaswamy Iyengar’s son K. R. Anantharaman was the Marketing Director of Bharat Earth Movers Limited (BEML).)", "My grandfather Krishna Iyengar and Chennamma’s 3rd daughter was Garudamma. She was called “Akkachi”. She had been given in marriage into the Kashyapa gotra. She had no children. She was a widow. After that she lived in our house itself. Though a woman, she was very capable in business. Her hair used to reach down to her knees. Seeing her knee-length braid, all the other girls would ask for a Garudamma-style braid to be done for them, and would have a chowri (hairpiece) added and get their braids done, it is said. Garudamma was very courageous. Later, after her aunt (her mother’s younger sister) Nacharamma’s husband, Kobbari Venkatachala Iyengar, passed away, she managed all the affairs of that household with efficiency and carried on the moneylending business that Venkatachala Iyengar used to run. (Levadevi means financial interest-bearing dealings.)", "My grandfather Krishna Iyengar and grandmother Chennamma’s 4th daughter was Eggamma. She had been given in marriage to Srinivasa Raghavachar, the famous Vadhyar of Kadaba, of the Srivatsa gotra. The said Srinivasa Raghavachar was the younger brother of the aforementioned Kobbari Venkatachala Iyengar, that is, the brother-in-law of Nacharamma. Eggamma had no sons. Only 3 daughters. The first was Rajamma, whose husband Krishna Iyengar was an officer in the Civil Munsif Court. They had 3 sons and 2 daughters. The sons"]}, {"n": 7, "b": ["have passed away, and I have learned that only the daughters are in Bangalore itself. I have not met them.", "Eggamma’s second daughter was Seetha alias Vanajamma alias Kuttamma. She had been given in marriage into the Daroga family of Nonavinakere. Her husband was a tahsildar at Anantapur and Gooty in Andhra. After the marriage, he used to teach his wife Seethamma the English language at home. I had seen Seethamma speaking and delivering speeches fluently in English. For some time he was an officer in the lower-level education department of the Mysore government. He was adept at playing the violin and at astrology, that is, telling the future. The queen of the Mysore palace would often invite (him) to the palace to hear predictions from him. In those days, because they (Seethamma and her husband) had gone to Delhi and returned, she was called “Delhi Kutti”. They had one son and 3 daughters. Their son became a veterinary doctor, served in the Andhra government and died at a young age. I have learned that his children and wife and 3 sisters are living. I have not met them. I had seen all these children when they were young. The son’s name was Raja Iyengar. The daughters’ names are Ambujamma, Sarojamma and Mahalakshmamma. Among them, I have learned that the family of Raja Iyengar, the veterinary doctor who passed away, lives in Belur. I have learned that Ambujamma lives in Jayanagar, Bangalore. I have not met them.", "My paternal aunt Eggamma’s daughter Jokkamma was the third. She had been given in marriage to one Srinivasa Iyengar of Mavanuru, Holenarasipura taluk. Both of them have passed away. They have one daughter and one son. I know that the son, Rangaraja, lives in Bangalore. I have not met him."]}, {"n": 8, "b": ["My Father’s History", "The history of my grandfather Krishna Iyengar and Chennamma’s eldest son Srinivasa Iyengar and his three sisters has been described above. The 5th and youngest son of this father and mother, Narayana Iyengar, is my father.", "My grandfather Krishna Iyengar was known as “Bhalyada” Krishna Iyengar. This name came about because he used to hold the ‘bhalya’ in the Mysore palace. That is, he was Body Guard to the Maharaja. My grandmother Chennamma had Cateract; therefore, since her eyes had gone blind, and since in those days there were no means of travel such as bullock carts, my grandfather used to carry her seated on his shoulders from Nuggehalli to Nonavinakere, about 100 miles on foot, it is said.", "It is a history in itself how my grandfather Krishna Iyengar used to meet officials. When the officials (of the kings of those days) were going to a different town every day, he too would go on foot to the towns they were going to, bathe at dawn, apply the namam on his forehead, go to the town where the official was, and offer his salutations every day – that was his work.", "Seeing him every day in the town where he had come, after many days the official asked, “Why do you come like this every day to the town I am visiting and see me?” Then my grandfather asked the official, “Please give me a job,” it is said*. Then they gave him the Body Guard job in the palace, it is said. While things were so, when my father was five years old, my grandfather Krishna Iyengar passed away, it is said. After that, my grandmother Chennamma and her five children grew up in Nonavinakere under the shelter of Chennamma’s younger sister Nacharamma and her husband Kobbari Venkatachala Iyengar (my Chikkajji and Chikka Tata, i.e. younger grandmother and younger grandfather).", "• This is a little doubtful. Because if he were the king’s bodyguard, his residence would have had to be in Mysore. No details about that are available. A person who had not learned the use of weapons cannot be appointed as the king’s bodyguard. Perhaps he may have been given the job of running about behind some official."]}, {"n": 9, "b": ["It was they who raised all five children and arranged their marriages and so on. It was to them that my Doddappa Srinivasa Iyengar had been given in adoption, as they had no children of their own.", "It is known that the primary and secondary education of my father Narayana Iyengar and my Doddappa Srinivasa Iyengar took place in Nonavinakere and, under the protection of their brother-in-law, the famous Vadhyar Srinivasa Raghavachar, in Kadaba. At that time there was a Mission School in Kadaba*. There was no English school in Nonavinakere. Along with the English and Kannada lessons at school, lessons in the Vedas and astrology were taught at home by their brother-in-law Vadhyar Srinivasa Raghavachar. Their brother-in-law Vadhyar Srinivasa Raghavachar was indeed a great scholar in astrology and the Vedas.", "Both my father and his elder brother Srinivasa Iyengar had lessons in the Vedas and in the Purva and Apara Prayoga (ritual procedures) from their brother-in-law Srinivasa Raghavachar, and had gained good experience in both. After completing English middle school studies in Kadaba, my father [studied] in Bangalore at the London Mission High School, which is now called Central High School. (It is still at Mysore Bank Circle. (But) now the Central School has been closed.) After high school studies at that school, he joined the Railway department for signal work and was a signalman at the Srirangapatna railway station. (As far as is known, Taata (grandfather) Narayana Iyengar had passed the SSLC in First Class. In those days that was a great achievement.) At that time, an order came selecting him to go to Calcutta to receive training in signalling.", "That same year, because plague had come to India, to Calcutta, his elders did not agree to send him to Calcutta for signalling training, and he submitted his resignation from the railway job. He", "* A Mission School means a school run by Christian fathers. English used to be taught there from the 5th class."]}, {"n": 10, "b": ["then joined the Education Department in a School Master’s job. At the start his salary was Rs. 8/- per month. First of all he joined as school master at the school in Karedakuppa village, Kunigal taluk. Later, in the villages of Eliyur and Huliyurdurga of the same taluk, Chandrashekharapura of Gubbi taluk, Honnudike of Tumkur taluk, Kanatur and Tandaga of Turuvekere taluk, Nonavinakere of Tiptur taluk, Kandikere and Yalanadu of Chikkanayakanahalli taluk, and Nagavalli of Tumkur taluk, he served as Head Master and took his pension. When he retired, his salary was Rs. 25/- per month. His specialty was that wherever he went he would get the postmaster’s job; in those days the work of branch post offices in villages was done by the school master along with his school master’s work, in his leisure time, as postmaster’s work. For that, the Postal department paid from Rs. 4 to Rs. 8 per month. He did postmaster’s work along with school master’s work in the villages of Chandrashekharapura, Honnudike, Kandikere and Nagavalli. Even after retiring from service, he received a salary of Rs. 12/- per month as Branch Post Master in Nonavinakere. His elder brother Srinivasa Iyengar too was a school master and Branch Post Master in Nonavinakere. Since in those days there were not many in Nonavinakere who knew English and Vedic lessons, they were held in great respect and regard in the village. After working in the Education department for 35 years, my father drew a pension for 40 years. His pension came to Rs. 15/- per month. *", "Since my father was also quite knowledgeable in worldly affairs, he had won great popular affection in Nonavinakere. He also had considerable experience in Ayurveda. Whether it was the virtue of his hand or what, many illnesses used to be cured by the amulets (taayita) that he tied. It can be surmised that the faith people had in him was the reason for this.", "* There are no details of the year in which Narayana Iyengar joined service. He must have been born around 1866. By that reckoning, he may have joined service in 1890. At the age of 58, that is in 1924, he may have retired from the teacher’s job."]}, {"n": 11, "b": ["Even at the age of 95 he was working as Branch Post Master in Nonavinakere. On 9.6.1964, at Tumkur, he reached the lotus feet of God. Further on, his life story has to be told.", "My Mother’s Lineage", "My mother Ramakkamma was the youngest daughter of the couple Keshava Iyengar and Ajamma, of Nuggehalli, of the Maudgalya gotra, Vadagalai tradition. My father’s mother (that is, my grandmother Chennamma) too was a daughter of this same house. That is, my mother is the daughter of my grandmother Chennamma’s elder brother. To my father, my mother was his maternal uncle’s daughter. Nacharamma, the adoptive mother of my Doddappa Srinivasa Iyengar, and my grandmother Chennamma were elder and younger sisters, and daughters of the house in Nuggehalli where my mother was born.", "My mother Ramakka had two elder sisters and one elder brother. The name of my mother’s eldest sister is not known. She had been given in marriage to Hiremagaluru. Her grandchildren are in Bangalore. My mother’s second elder sister was Yadugiriyamma; she had been given in marriage to one Ranganna of Shankhagrama, Hassan taluk.", "My Doddamma (elder maternal aunt) Yadugiriyamma had one son and three daughters. The son married and died at a young age. Of the three daughters, the eldest daughter Rukkamma had been given, as a third wife, to Kutta Shyama Iyengar, the younger grandfather (chikka taata) of Narayana Iyengar of Nonavinakere. She had no children. The second daughter Thirumalamma had been given, as a second wife, to my step-maternal-uncle Deshikachar of Attavara. Deshikachar had retired from a Sub-Registrar’s job. His sons are Gopala and Narasimha, who live in Malleswaram, Bangalore. Rukkamma, who had been married to Nonavinakere, after her husband’s death lived in the house of her younger sister Thirumalamma and passed away."]}, {"n": 12, "b": ["My Doddamma’s third daughter Kamalamma had been given in marriage to Dikshitar Ramanuja Iyengar of Shantigrama. After her husband’s death she lives with her children in Malleswaram, Bangalore. Kamalamma’s stepson is Vadhyar Srinivasa Deshikachar, who is currently in Bangalore. Kamalamma is of the same age as me.", "My mother’s elder brother, that is, my maternal uncle, was Narayana Iyengar. He had come to my wedding that took place in Kadaba. Though my maternal uncle was from Nuggehalli, he lived at Attavara in Hassan taluk. This is the birthplace of his mother, that is, my grandmother, that is, my mother’s mother Ajamma; my maternal uncle Narayana Iyengar lived at Attavara with his family and worked as a P.W.D. contractor. During the time of Diwan Visvesvaraya, near the Dudda station on the Arasikere–Mysore railway line, my maternal uncle Narayana Iyengar was doing railway contract work. Narayana Iyengar had no male issue. Three daughters. One lives in Shantigrama – Andalamma; the second is of the Dasa house of Belur, called Jokkamma; the third is called Shringaratte. She lives in Hassan, in the house of Ramakrishna Iyengar, the elder brother of my son-in-law Sri Raju. Sri Ramakrishna Iyengar’s wife, called Mani, is a relative on my mother’s side. My father’s wedding is said to have taken place at Shankha Grama, Hassan taluk, in the house of my mother’s elder sister Yadugiriyamma. The surprising thing is that at the time of the wedding there was no olaga (ceremonial music) at all, it seems. When asked, they apparently said that there were no olaga players in this village at all. This matter was often mentioned by my father’s elder sister Yaggamma in front of my father himself. My mother’s father and mother – Keshava Iyengar and Ajamma; my mother’s grandfather and grandmother – Ramaiyengar and Lakshmamma; my mother’s great-grandfather and great-grandmother – Channakeshava Iyengar and Ramakkamma"]}, {"n": 13, "b": ["Since my maternal uncle Narayana Iyengar lived at Attavara, I was born in the thotti-mane (courtyard house) of Attavara village. That thotti-mane has now collapsed. This house was famous as the house of the Attavara Shanubhoga (village accountant). The only Sri Vaishnava house in Attavara was that one. Since that house was large, 5–6 families belonging to the same family lived separately. Since I had seen this house at a young age, I remember it a little. My elder sister Ammalamma knew this house well. This is all I know about my mother’s house. Next I will tell about my father, mother, my sisters and brothers.", "My Sisters and Brothers", "That my father Narayana Iyengar was married to Ramakkamma, the daughter of his maternal uncle, I have already told earlier. My grandmother Chennamma, my younger grandmother Nacharamma, my Doddappa Srinivasa Iyengar, my elder aunt Garudamma and younger aunt Eggamma – since they were all widowed, all of them together with their children lived in a joint family in the house of my younger grandmother Nacharamma in Nonavinakere, and though they were women, they were capable and popular among the people. My younger grandmother Nacharamma had a house and garden in Nonavinakere, and a paddy field near Holenarasipura under canal irrigation. My younger aunt Eggamma had a house and a paddy field in Kadaba. The property of my younger grandmother Nacharamma went to her adopted grandson Deshikachar. The property of my aunt Eggamma went to her 3 daughters. My father had no ancestral property. (What there was) was only a part of my younger grandmother’s Nonavinakere house, the old house. This was used as a cattle shed. Only this came to my father, and my father sold it when leaving Nonavinakere. My Doddappa’s son Deshikachar, since his parents died in his very childhood, lived in Nonavinakere with my younger grandmother and aunts."]}, {"n": 14, "b": ["Since my father was away in other places as a school master, his family lived separately. Even when my father was later transferred to Nonavinakere, as my younger grandmother’s house was crowded like Kishkindha with quite a number of people with children, they lived in a separate house in Nonavinakere. I have only a slight memory that my mother Ramakkamma looked just like my second daughter Chechamma (Sarala). When my mother died I was only 4 years old. My father used to say that when my mother lived with my father in other places she was very popular, clever and intelligent. My mother was skilled in handicrafts – that is, in those days, rangoli, photos of gods in various colours made with beads, woollen yarn, and embroidery work. I had seen all those things in our house after her death. My elders used to say that both my father and mother were adept at the game of pagade (a dice board game).", "My parents’ first child was a boy. It died in infancy. Then the 2nd, 3rd and 4th children were girls. The 5th child, a son, was me. The 6th child was a boy. At the delivery of my younger brother, the 6th child, an infection set in and my mother died. In those days there were no medical treatments for postnatal infection as there are now. When my mother died, my father was a teacher in Nonavinakere itself.", "After my parents’ first child, a boy, died in infancy, the 2nd child, a girl, was Garudamma; we used to call her Ammalakka. The reason: when the child was small, my father was a teacher at Chandrashekharapura taluk. In the neighbouring house lived an Iyer Shekdar. He used to call this child “Ammala” in Tamil. Later that itself became her name, Ammalakka. In those days, according to the custom of marrying at the age of ten, my sister Ammalakka had been married, even before I was born, to one Record Ramaswamy Iyengar of Kadaba. This Ramaswamy Iyengar was the paternal uncle of Seetharama Iyengar of Kadaba. Even before my sister Ammalakka"]}, {"n": 15, "b": ["came of age, her husband Ramaswamy Iyengar died and my sister became a child widow. After my sister became a child widow, if my mother wore flowers in her hair, she would insist, “Put flowers in my hair too,” and if my mother went to other people’s houses for haldi-kumkum (turmeric and vermilion), she would insist that she would come too. In those days it was forbidden for widows to wear flowers or to apply turmeric and kumkum. My mother understood this and, it is said, gave up wearing flowers herself and going to other people’s houses for haldi-kumkum.", "After my mother Ramakkamma died, this sister herself raised all of us and became a mother to us. Till the end she lived in my household, raised all my children, and, living with me itself, on the morning after the Ganapati festival (1982) she woke up, perfectly fine, and passed away. Her passing away like this was a surprise not only to us but to everyone in our street. As long as she lived, she gave trouble to no one; without falling ill, without suffering, she passed away – in Seshadripuram, Bangalore. At that time the marriage of my youngest daughter Shaila had been fixed. Only the wedding invitation had not yet been done. The day before she died she looked at all the textiles brought for the wedding, and on the day she died she spoke with everyone and breathed her last peacefully. After conducting the 2 days’ death rites in Bangalore itself, I, my eldest son Nagaraj and Jairam went to Gaya, performed the 13 days’ rites and returned.", "After my sister’s husband’s death, for the convenience of her future livelihood, my father conducted court proceedings and obtained 2 acres of wet (tari) land in Kadaba belonging to her husband. In the end, that land came to my share.", "My parents’ 3rd child was a girl. Her name was Bhagirathi. Everyone called her “Bai”. In looks and complexion she resembled my eldest daughter Vinatalakshmi."]}, {"n": 16, "b": ["She was given in marriage, as the 2nd wife, to Maramat Shamanna of Kadaba, who was working in the district office in Shimoga, of the Srivatsa gotra. Probably in the year 1917. Shamanna’s first wife had 7 children. The first daughter had already been married; he married a second time to manage the household. My sister Bayamma suffered a great deal of harassment from those step-children. When my sister first went to her husband’s house after the wedding, I too went with her to Shimoga and stayed for a year, studying in the primary school there. Those step-children harassed me too.", "My sister Bayamma, when she was pregnant, had been brought to Nonavinakere for the delivery. Having come for the delivery, she fell victim to untimely death from cholera even before the delivery. She did not go to her husband’s house again. In that epidemic of the time, 4 people in our house died within one week. Among them, two died on the same day.", "First, my younger grandmother Nacharamma, under whose shelter this family was growing, passed away. She was my grandmother Chennamma’s younger sister. It was to her that my Doddappa Srinivasa Iyengar had been given in adoption. Even before this Nacharamma died, her adopted son Srinivasa Iyengar and his family (wife) had died. His son Deshikachar was still small. He is still alive. I never saw my Doddappa and his wife. On the third day after her (Nacharamma’s) death, my paternal aunt Garudamma and my pregnant sister Bayamma died, of cholera. Two days after that, a 9-year-old child named Seshadri, the son of Kuttamma, the daughter of my paternal aunt Eggamma, died of cholera. In those days there were neither proper medicines nor preventive measures for cholera. After 4 people in our house died of cholera within one week, the entire joint family that until then had been in the house of my younger grandmother Nacharamma in Nonavinakere was scattered and never came together again."]}, {"n": 17, "b": ["At that time, Kutteyamma, the daughter of my paternal aunt Eggamma, who lived in Mysore, took all of us and went to Mysore. Deshikachar, my Doddappa’s son, who until now had lived in the joint family without parents, separated from us. Deshikachar, my Doddappa’s son, lived for some days in the house of my paternal aunt Eggamma. There was an intention to marry this Deshikachar to Ambujamma, the eldest daughter of Kuttiyamma, the daughter of my paternal aunt Eggamma. But after Ambujamma was married elsewhere, Deshikachar separated from my paternal aunt Eggamma; Deshikachar alone remained in that house. By this time my father was transferred from Nonavinakere to Kandikere, Chikkanayakanahalli taluk, and our family left Nonavinakere. Deshikachar, who was still unmarried then, stayed alone in Nonavinakere and, on someone’s advice, got married at Mayasandra. Regarding this marriage, Deshikachar, my Doddappa’s son, did not mention anything at all to his paternal uncle, my father. The wedding invitation was in someone else’s name and came by post to my father at Kandikere. In those days wedding invitations were not printed. They used to be written on postcards. Because the invitation was written in someone else’s name, and because of the indifference of not mentioning anything about any matter to his own paternal uncle, my father did not go to this wedding. For many years we did not meet Deshikachar, since we were in a different town. After my father was again transferred to Nonavinakere, some years later, Deshikachar and we met and the relationship continued.", "My parents’ 4th child was a girl, a child named Pankaja. Elders used to say she was as fair and very lovely as a glass doll. (Like Sau. Chinnu.) This child had died an untimely death even before I was born.", "I was born as my parents’ 5th child. My birth was in the Keelaka year, in the month of Ashvija, Shukla paksha, Padyami, on a Saturday at four in the afternoon. Date"]}, {"n": 18, "b": ["26.09.1908. That day was the beginning of Navaratri. I was born at Attavara near Dudda, Hassan taluk, where my maternal uncle Narayana Iyengar and my mother’s mother Ajamma lived; my birth was in the thotti-mane of the Shanubhoga of Attavara. The family of the Shanubhoga of Attavara and my mother’s mother were siblings. That thotti-mane has now collapsed. In the middle, a tank (thotti) for the rain water to fall, houses all around, at the front a main door and wide verandahs on both sides. I remember men playing cards and pagade on the verandah. In this thotti-mane five or six related families lived separately. Because I was born on the Navaratri Padya day, because on that day the recitation of Rama-deva begins, and because my father’s father Krishna Iyengar intended to give his own name, they named me “Ramakrishna Iyengar”. Later, when I joined school, “Rama” went away and it became Krishna Iyengar. Even now, in my pravara I keep saying “Ramakrishna Sharmanam Aham Asmi Bho”. I have heard that since I was born as a boy after my parents’ very first boy had died an untimely death and after 3 girls, I was raised with great pampering in my childhood. My elders used to say that because of this great pampering I was very mischievous. When I was a child of 3 years, my father’s mother Chennamma was alive. She could not see because of a cataract in her eyes. I remember her seating me affectionately near her, touching me and feeling out my form, and fondling me. Since my grandfather’s name was Krishna Iyengar, my grandmother Chennamma, out of hesitation to utter her husband’s name, used to call me “Murthy”. My grandmother Chennamma was beautiful and fair, befitting her parents. After a little while she passed away.", "When I was born, my father was working as a school master in a village called Kanatur, four miles from Nonavinakere. Since my father worked in the villages of Kanatur, Chandrashekharapura and Honnudike, and was in the Smarta environment of those villages, my mother, and later my wife and children, had a great regard for Smartas. This"]}, {"n": 19, "b": ["association with the Smartas itself, my sister Bayamma could not speak Tamil until she was 10 years old. That I was born when my father was working in a village called Kanatur, I have already mentioned earlier.", "On the day of the Ganapati festival that came 11 months after I was born, at 12 noon, a Lingayat woman named Devirmma, a close acquaintance of my father, walked from Nonavinakere carrying a clay idol of Ganapati in a basket and said, “Master, a baby boy has been born to you. For this I have brought Ganapati from the village,” and placed Ganapati in the house, it is said. My parents were surprised and worshipped the unexpectedly arrived Ganapati that day, it is said. Though there is no custom of worshipping Ganapati among Sri Vaishnavas, from that day the practice of installing and worshipping an idol of Ganapati on the Ganapati festival day began in our house.", "My father was Head Master at Kanatur. His salary was Rs. 15/- per month. Assistant masters got Rs. 12/- and Rs. 10/-; the peon’s salary was Rs. 5/-. Even so, they lived better than those who now draw a salary of Rs. 1000/- per month. 15 seers of rice for Re. 1, 6 seers of toor dal for Re. 1, a tin of kerosene for Rs. 2, 26½ tolas of butter for 18 kaasu, the price of 1 sovereign (gold) Rs. 13. Our father was the Head Master; in that whole village he was the biggest officer.", "Our father was efficient and popular in all villages, and when he was transferred to another village, the people would send him off in a manner of sorrow. After our father was transferred from Kanatur to Nonavinakere, our family lived in a separate house. He was a teacher in Nonavinakere itself for twenty years. Many elders in Nonavinakere were his students, and recalling the way he taught and the way he punished, his elderly"]}, {"n": 20, "b": ["students, till the very end, addressed him as “Meshte” (Master) and showed him respect.", "After our father was transferred to Nonavinakere, a male child was born to my mother as her last child. In his delivery itself, our mother died of postnatal infection. At that time there were neither hospitals nor doctors. My mother could not be cured by the medicines of the native physicians. When my mother died, I had only just completed 3 years. I remember, as if in a dream, rice grains being put into my mother’s mouth after her death. At that time my first haircut (chaula) had not been done. They had vowed that my chaula be done at Bindinganavile, where our family deity is, and had arranged for the chaula when I completed 4 years and entered the 5th year. In the meantime my mother died, so my chaula did not take place. Since I was the karta (ritual performer) for my mother, my father used to perform my mother’s later rites in my name, until my upanayana (sacred thread ceremony).", "On the day my mother died, I remember being taken to the top of the Nonavinakere tank bund (kere), made to sit in a mantapa, and my head being shaved. Then, to purify the corpse, the custom of bringing water from the tank with olaga (music) still exists in villages. Accordingly, they filled a small copper ladle with water and put it in my hand. They brought it home and had me pour it on the corpse. Afterwards some woman of ours carried me to the cremation ground. I remember that after the fire touched the body, they brought me home and gave me a bath.", "After our mother’s death, those in our house were my father, my widowed sister Ammalakka, my other, unmarried sister Bhagirathi, myself, and my younger brother born at my mother’s last delivery, my younger grandmother Nacharamma, our paternal aunt Garudamma, another paternal aunt Eggamma, and our Doddappa’s son Deshikachar. By this time my Doddappa and Doddamma had died and Deshikachar had become an orphan; his grandmother and paternal aunts"]}, {"n": 21, "b": ["were his guardians. When my mother died, my father was 35–40 years old; though many people tried to change his mind so that he would marry again, sacrificing for the welfare of his children he did not marry again till the end. Further, since in his prime his wife, our mother, had died, it is no exaggeration to say that my father had an infatuation for other women.", "Thus the responsibility of raising all of us fell to my eldest sister Ammalakka. My sister was still young. With the help of the neighbours and my younger grandmother and paternal aunts, taking on the responsibility of our respective households, she raised us till the end, and after (their) death, living in my household, she looked after all my children and died. Along with us, she also had the responsibility of raising the male child of my mother’s last delivery.", "In the meantime, I have already written earlier about how my younger grandmother, my paternal aunt Garudamma, and my sister Bhagirathi, who had come for delivery after her marriage – 4 people – died of cholera in one week.", "Afterwards my father was transferred from Nonavinakere to Kandikere (Chikkanayakanahalli taluk), and my father, I, my sister Ammalakka, and my baby brother – this many of us went to live at Kandikere. Deshikachar, my Doddappa’s son, who had been together with us until now, remained alone in Nonavinakere, and it was only after his wedding that we saw each other again. (That is, only when my father was again transferred and came to Nonavinakere.)", "From Nonavinakere to Kandikere the distance was 35 miles. In those days there were no lorries or buses, so we travelled by bullock cart with our belongings. A journey of 1½ days; we used to cook in between. My sister Ammalakka would vomit on cart, bus and train journeys. On the cart journey, exhausted from fasting, she would lie down in the cart."]}, {"n": 22, "b": ["My father used to say that we were going with a corpse loaded in the cart. I was 10 years old at that time.", "My younger brother was very sweet and handsome. He had been named Dore, Doraiswamy. Because of cow’s and buffalo’s milk for a child without a mother, he developed a liver disease called cirrhosis of the liver; his belly swelled, all his veins turned green, and his arms and legs became like sticks. Without hospitals or medicines the illness worsened. Only the radiance of his face was very good. He was extremely intelligent. Listening to me studying at home, he would recite all the verses, lessons and multiplication tables. Not knowing the right medicine for that illness, my father, having seen an advertisement, used to order from Bombay a medicine called Dongre’s Balamrit by Post Parcel and give it to him. If I or my father had known as much medicine as is known now, he could have been saved. This same illness came to my 4th son Shridhar, and he was cured by my proper medicine and his mother’s care. Thus my younger brother lived till 8 years of age and died of this very illness. My father carried his body and performed the cremation. Now those remaining were only my father, my sister and I. Here too my father got the job of Branch Post Master along with that of School Head Master. Salary Rs. 6/- per month. The post came only 2 days a week. My student life at Kandikere was good. Later, when I was in Huliyar, and my son Nagaraj was Medical Officer for this same town, I used to go there often, see my old classmates and recall the old days. Now only two of my classmates are alive there.", "At Kandikere there were 20 houses of Smarta Brahmins. Here too we had contact with Smarta Brahmins. Here my father was Head Master for four years. In all 4 years, all the students he entered for the L.S. examination passed. The reason: our father used to teach all the"]}, {"n": 23, "b": ["students at night in our house itself. All the students would study at our house at night, sleep there itself, get up at dawn and study, and then go to school. For this our father took no fee. After the students passed, their parents would give gurudakshina (teacher’s gift) according to their means. Because of these examination results my father received distinction in the department and a commendation as an efficient teacher. In this village, in 1922, I passed the Kannada L.S. examination.", "There was no English school in this village. I alone went to Nonavinakere, stayed in someone else’s house and joined the English school. Six months later my father got himself transferred and came to Nonavinakere. It was then, at Nonavinakere, that my upanayana took place. Since my mother was not there, Rukkamma, the daughter of my mother’s elder sister (Doddamma) who was in Nonavinakere itself – her husband Kutti Shyama Iyengar sat on the plank (mane) at my upanayana. They had no children. Rukkamma is the Doddamma of Gopala and Narasimha who are in Bangalore.", "In 1925 I passed English L.S. In those days high school existed only at the District Head-Quarter. After that my father was transferred to a village called Nagavalli in Tumkur taluk. Here too he was a postmaster along with the school master’s job.", "After I passed English L.S. at Nonavinakere, I joined the Maharaja’s High School, staying in Mysore in the house of Kuttiyamma, one of the children of my paternal aunt Eggamma. My father and sister were at the village of Nagavalli. After staying for some days in Kuttiyamma’s house in Mysore, as the meals were not proper and I faced difficulty, I took a separate room and arranged to eat at different households on different days of the week (vaara). I informed my father of this difficulty, and said that arrangements for my studies be made at Tumkur, near Nagavalli, and that I would cook for myself and"]}, {"n": 24, "b": ["study; but my father did not agree. As meals and so on at other people’s houses were not proper, I gave up my high school studies and went to Nagavalli village, where my father was. After working 34 (1925?) years, my father drew a pension for 40 years. A photograph of my father at the felicitation gathering held when my father retired on pension is at home (my son Nagaraja’s).", "After my father’s pension, I got a school master’s job at Nagavalli itself, and six months later, because of an officer who was not on good terms with my father, my school master’s job was lost. Losing this job turned out to be good for my later livelihood.", "After retiring on pension and leaving his school master’s job, my father came and settled in his native place, Nonavinakere. Except for an old house in Nonavinakere, there were no other properties of any kind. Having gained scholarship in priesthood (paurohitya), and receiving a pension too, and as there was some money that had come from his insurance, it would have been very useful if he had come and settled in Bangalore instead of Nonavinakere.", "When my father’s friends put this matter before him, my father did not listen and, out of attachment to his native place, decided to live in Nonavinakere itself. In Nonavinakere he now got the job of Branch Post Master. He received a pension of Rs. 15 per month and a salary of Rs. 15 per month from the postmaster’s job. In addition, priesthood work. If he went to a shraddha (ancestral rite), he would bring Re. 1/-. If he went to a wedding, he would bring Rs. 15/-. He never pressed anyone to give so much. He was content with whatever they gave. Because of this he was very popular."]}, {"n": 25, "b": ["Those in the house were only we 3. That my education had stopped at the high school level was not satisfying to my father or to my sister, and since there was no facility for meals and care in other places, my studies stopping helplessly at the high school level left me too without peace of mind. The monthly fee I paid at high school was Rs. 2/-, being Half freeship. So everyone’s mind was filled with distress. Meanwhile, B. Cheluvaiyengar of Belur, the school inspector at Chikkanayakanahalli, who was acquainted with my father, gave me a temporary school master’s job and appointed me to Huliyar.", "When my sister was on leave for three days of the month, my father used to cook. I too had learnt to make rice and saaru. This helped me to cook for myself in other places.", "This was my first visit to Huliyar. And it became the beginning of my own life ahead. During this time at Huliyar I made many friends and close acquaintances. This later became the means for me to settle in Huliyar. The salary I then got was only Rs. 13/- per month. This temporary teacher’s job ended in 1 year. After that I got a teacher’s job in Chikkamagaluru district and went as a teacher to Shindigere village near Kalasapura. Then I was transferred to Kelaguru village near Mudigere.", "By this time 4–5 girls had come for my marriage but I did not approve. I did not give my consent to one girl from Nonavinakere, so, harbouring this very enmity, when I later began to build a house in Nonavinakere, they created trouble and in the end I could not build a house there."]}, {"n": 26, "b": ["In the meantime my father used to go to Kadaba frequently for land matters. (The 2 acres of land that came from the husband of Ammalamma alias Garudamma.) Cheluva Bhatta, a native of the same place, a retired school master and the postmaster at Kadaba, was my father’s childhood friend and his classmate in Kadaba. On his advice, a girl from Kadaba was settled for me and the wedding took place. Next, after describing the background of my marriage and my wife, I will describe my later life.", "Cheluva Bhatta himself was the main reason for the negotiation of this marriage of mine. When my father had gone to Kadaba on some business, the above-mentioned friend saw my future wife; as her family was well known to my father, for my consent he came to Nonavinakere with the girl’s photograph, accompanied by his close friend Cheluva Bhatta. They met me, told me the matter, and took me to Kadaba to see the girl.", "In those days my paternal aunt Eggamma lived in Kadaba itself. While informing the girl’s family about us in Kadaba, Bhatta had said, “Everything is fine, madam, but only the house they live in at Nonavinakere is not good. The cattle shed of your house in Kadaba is far better than their house.” Since the girl’s family was well acquainted with my father and my paternal aunt Eggamma, and since I gave my consent to the girl, this girl was settled for me and the wedding also took place.", "In those days the custom was to marry a girl before she attained puberty. Accordingly my wife Alamelu was 12 years old and I was 22 years old. Though I had no proper government job and no ancestral property, because of their acquaintance with our lineage and my father, they gave their consent to this alliance without taking any of this into account. Later, by this wife’s good fortune, family life too turned out to be happy."]}, {"n": 27, "b": ["Probably in the year 1932 (22 years — that would make it 1930), in the month of Karthika, my wedding was celebrated at Kadaba for 8 days, in a grand manner befitting those times. My father, my elder sister, my paternal uncle's son Deshikachar and his 3 children, my paternal aunt Eggamma's daughter Kuttamma, my elder paternal aunt's son — Retired Assistant Engineer Ramaswamy Iyengar of Bangalore — and my mother's brother (my maternal uncle) Narayana Iyengar, and my friend and his wife — in all 12 people went.", "Now I will introduce the family into which my wife Alamelu was born.", "Alamelu's House Lineage", "Alamelu's father's father (that is, her grandfather) was Hiriyuru Jokkanna Iyengar. Shrivatsa gotra. Vadagalai tradition. A renowned Vedic scholar, loved by the people, and very talented in worldly matters, just like my father. His wife Mahalakshmamma lived for some years after my wedding. At the time of my wedding, Jokkanna Iyengar had passed away some years earlier. Chokkanna Iyengar had also been the Post Master at Kadaba. Since my father had lived in Kadaba in his youth, my father knew him well. Jokkanna Iyengar took great interest in gardening. In his garden there were coconut, areca nut and banana, as well as all kinds of flowering plants and fruit trees; roses and croton plants too. He had laid out the garden like a park and built footpaths. There were stone benches to sit on, and a small house-well in the garden as well. Every morning and evening he went to the garden and took delight in it. His garden was famous throughout Kadaba. I do not know the earlier generations of this Jokkanna Iyengar and Mahalakshmamma. They had two sons, Srinivasa Deshikachar alias Appanna Iyengar and Sundararaja Iyengar, and two daughters, Puttatayamma"]}, {"n": 28, "b": ["and Kamalamma. The daughter of the elder son Appanna Iyengar is my wife Alamelu.", "This Appanna Iyengar had two wives. At the time of my wedding both wives were alive. Both wives were named Rangamma, and they were called Dodda Rangamma (Elder Rangamma) and Chikka Rangamma (Younger Rangamma). The first wife Rangamma was the daughter of Ramakrishna Iyengar of Bidadi, who was of our own Kutsa gotra. The elder wife Rangamma had two sons, Srinivasa and Raju, and two daughters, Indiramma and Ambujamma. Now only Ambujamma and Raju are living. Raju was married to the daughter of my friend Ramaswamy Iyengar, the son of Seshamma, the elder sister of Tirunarayana Iyengar of Nonavinakere. He (Raju) is now settled in Mysore.", "Jokkanna Iyengar's 2nd son Sundararaja Iyengar was married to Ranganayakamma (Bapachitri), the daughter of a coffee planter of Chikkamagaluru. This Ranganayakamma is still in Bangalore. Sundararaja Iyengar lived for some days in Kadur and in Chikkamagaluru, then came and settled at Kadaba, and passed away. Sundararaja Iyengar had been given in adoption to the father of his mother Mahalakshmamma — that is, to his grandfather — because he had no children. Mahalakshmamma — that is, the grandmother of my wife (Alamelu) — her mother was Belagam Janakamma. She was alive at the time of my wedding. The eldest son of this Sundararaja Iyengar, Annayya, was married to Mahalakshmi, the daughter of Deshikachar, the son of my paternal uncle.", "Chokkanna Iyengar's elder daughter Puttatayamma's husband had been working as a guard in the Railway Department and had died. After her husband died, Puttatayamma lived at Kadaba under the shelter of (her) father Chokkanna Iyengar. Puttatayamma was very intelligent and clever. She was accomplished in music and handicrafts. It was she who gave my wife Alamelu training in music,"]}, {"n": 29, "b": ["in playing the harmonium, and in handicrafts. Jokkanna Iyengar had died before my wedding. After the death of her father, Puttatayamma herself managed the affairs of the house and the lands. Puttatayamma herself carried out all the work of my wedding.", "Chokkanna Iyengar's youngest daughter Kamalamma's husband Raja Iyengar was an Accountant at the Apex Bank in Bangalore (in Chamarajpet). Neither of them is alive now. Their children are living.", "Now, an introduction to the family of my wife Alamelu's mother", "Alamelu's mother — that is, the father of my mother-in-law Rangamma — was Alasingacharya, who was also from Kadaba. He was a classmate of my father at Kadaba. Alasingachar had been married to the sister of Dikshita Sri Rangachar of Kadaba (the father of Anna Durai).", "Alasingachar's eldest daughter Rangamma is the mother of my wife Alamelu. The younger ones were three sons — Srinivasa Iyengar, Varadaraja Iyengar and Krishna Iyengar. Srinivasa Iyengar has passed away. His wife Mohanamma (Amami) and children are in Bangalore. Varadaraju went swimming in a pool before his marriage and died. The youngest son Krishna Iyengar is also no more. It was this Krishna Iyengar and his wife who sat on the wedding seat at my wedding. After Alasingachar's wife passed away, and after his daughter Rangamma's wedding, he went to Karachi with his children and settled there. There, the elder son Srinivasa Iyengar was working in a bank, the younger son Krishna Iyengar in the Railway Department, and Alasingachar too was employed there. At the time of my wedding they were still in Karachi and came to the wedding. They used to say that they too had helped a little with my wedding."]}, {"n": 30, "b": ["Alamelu's grandmother (her mother's mother) and the mother of Maava (father-in-law) of my younger daughter Shaila were both daughters of the Dikshitar family of Kadaba. Alamelu's mother's mother was the paternal aunt (father's elder sister) of Dikshita Anna Durai. The mother of Shaila's Maava was the elder sister of Anna Durai (that is, the daughter of the younger brother of Alamelu's grandmother); thus the relationship of the two was joined together again. Alasingachar's house in Kadaba was opposite the house of Soppinakatte Aprameya Iyengar.", "I have mentioned earlier that Alamelu's father, my father-in-law Appanna Iyengar, had two wives. At the time of my wedding both wives were alive. The reason for having two wives like this: the elder wife apparently had a Fits (fainting) illness. Because of that, Jokkanna Iyengar, the father of my father-in-law Appanna Iyengar, had a second marriage performed for his son with Rangamma, the only daughter of Alasingachar, who was known to him and lived in Kadaba itself. This Rangamma is the mother of my wife.", "My father-in-law Appanna Iyengar was employed in the Railway Workshop at Mysore. It seems that after his 2nd marriage, the fits that the first wife used to get were cured. After that, both wives lived for a short time in the husband's house at Mysore; later, since they could not get along with each other, Alamelu's mother, my mother-in-law, came to Kadaba and lived with her parents-in-law — this is what I came to know.", "It seems that while his father Jokkanna Iyengar was alive, my father-in-law used to come to Kadaba and stay at the house. After Jokkanna Iyengar passed away, before my wedding, it seems that even when my father-in-law came to Kadaba he did not come to their house but stayed in other people's houses. The reason was the dispute and quarrel over the father's property. My father-in-law, Alamelu's father, did not come even to my wedding. At the wedding, on the wedding seat, Alamelu's maternal uncle (her mother's younger brother Krishnamurthy) and her paternal aunt sat. I had seen him once earlier when I was studying in Mysore."]}, {"n": 31, "b": ["After Chokkanna Iyengar passed away, his wife, Alamelu's grandmother (Mahalakshmamma), though she lived for many years, stayed inside without showing her face to anyone in the town until she died. Even though I stayed in her house for many days, she would not show her face. When she died, I was in Kadaba itself. That day I saw her face. In the meantime, Alamelu's aunt Puttatayamma, who had been running the household as its mistress and looking after all affairs wisely, died of Breast Cancer in Victoria Hospital, Bangalore. At that time I was studying in Bangalore, in that same hospital. After this, Alamelu's grandmother Mahalakshmamma lived under the shelter of Rangamma. Because of ill feeling between mother-in-law and daughter-in-law, she lived in the house of her daughter Kamalamma, who was staying at Kadaba itself, and died there. The introduction of my wife Alamelu's father's household is complete. From here on, I will give details about myself and my household after my wedding.", "My mother-in-law Rangamma had two daughters, Alamelu and Padmamma. Both of them lived at Kadaba with their grandfather Chokkanna Iyengar, grandmother Mahalakshmamma, aunt Puttatayamma and mother Rangamma. These children had no contact at all with their father. When they were small, they had once gone to Karachi (to see their grandfather and maternal uncles) and returned. Their paternal aunt Puttatayamma was a widow. She had no children. Puttatayamma was a cultured woman, intelligent and clever. After the death of her father Chokkanna Iyengar she took up the responsibility of the household and managed it well. She was an expert in music, the harmonium and handicrafts. She had taught my wife Alamelu all the above-mentioned skills. She took up the responsibility of my wedding and managed it well."]}, {"n": 32, "b": ["At the time of my wedding I was 22 years old. Alamelu was 12 years old; her younger sister Padma was 8 (according to Paddakka, there was said to be a six-year difference between the two). In the second year after my wedding, Alamelu attained puberty.", "The wedding had indeed taken place for me. But I did not have enough education. There was no ancestral property either. There was no government job either. This was a worry within my mind. My father and elder sister had the same worry. But we did not show this matter openly. At that time there was one cow at home. After eating at 11 o'clock in the morning, I would take the cow to the garden to graze, come home at 6 o'clock in the evening, and go to Mahantayya's well to wash my clothes. My father also used to wash the clothes he wore himself. Since my father had income, there was no difficulty at all about food. When my father had no free time, I myself used to manage the Post Office work.", "In the meantime my father set out on a tour of North India along with 4 people from Nonavinakere: Bombay, Ahmedabad, Delhi, Haridwar, Rishikesh, Lakshman Jhula, Varanasi, Prayag, Gaya, Calcutta, Ayodhya, Puri, and via Madras — a tour of 1 (9) months. This was his 2nd tour of North India. The very first time, he had travelled with my paternal aunt Garudamma.", "After my wedding, it was the custom to go often to Kadaba to my mother-in-law's house. When I went to Kadaba, my wife would be within the prakara (outer enclosure) of the Ramadevara temple, playing with her friends. She was still very young. She did not even know what a husband was. Her paternal aunt would bring the girl who was playing home, saying, \"Your husband has come, come home.\" Alamelu was even afraid to give me coffee. On top of that, I had kept a juttu (tuft of hair). It had to be combed and tied in a knot. Water had to be poured over the head. All this she was unwilling (to do)"]}, {"n": 33, "b": ["with reluctance, Alamelu used to do out of fear. Two years after my wedding, Alamelu came to our house. We left the old house in which we had been living and took another house on rent. When Alamelu came to our house, she knew no housework at all. She was still very young. My elder sister was giving her training in housework. Within a few days of Alamelu coming to our house, my elder sister fell ill with pneumonia and lay in bed for about a month. Then all the housework fell to Alamelu's responsibility. Then the women close to us in the town trained Alamelu in housework. Because my elder sister fell ill soon after Alamelu came to the house and was in a condition in which she might not survive, Alamelu also became the target of the townspeople's objection that her coming to our house had not been auspicious.", "To me, who was brooding over unemployment, an advertisement that appeared in the Mysore Gazette became like nectar. In the Gazette advertisement, applications were invited for Pharmacist Training. Without telling anyone, I put the application in the post. At that time, Dr. S. Subba Rao, the head of the Medical Department, Senior Surgeon — I had applied and also had a recommendation made to him through people close to him. I was selected for Pharmacist Training at Victoria Hospital, Bangalore, and in 1934 the order also came. At that time my wife Alamelu's paternal aunt Kamalamma and her husband Raja Iyengar and children were living behind the Apex Bank in Chamarajpet. My wife's elder paternal aunt Puttatayamma spoke about me to her younger sister and arranged for me to stay in their house and study. This can be called the first stage of my livelihood.", "Then I came to Bangalore and began my studies, staying in their house. During this period my wife Alamelu stayed in Nonavinakere with my father and elder sister. In the middle of this course of study, my aunt Puttatayamma got Breast"]}, {"n": 34, "b": ["Cancer and died in Victoria Hospital. After that, those left behind in Kadaba were grandmother Mahalakshmamma, mother-in-law Rangamma and the girl Padmamma.", "In Bangalore, in my aunt Kamalamma's house, I had all the facilities. But some disagreement arose between my mother-in-law Rangamma and my aunt Kamalamma over some matter, and when 1 month remained of my period of study, because of their indifference in their house, I had to stay in a hotel for 1 month. Kamalamma and her husband did the most to help my livelihood; to remain forever indebted to them for the help they gave all my life, and to remember them every day, is my foremost duty.", "While I was at Victoria Hospital, the famous doctors who trained me were Dr. Ramalinga Reddy, Dr. Srinivasachar, Dr. Narayana Prasad, and Dr. Nanjappa — it was their training that made it possible for me to become proficient in medicine.", "In 1935, after my training was fully completed and I had passed, I went back to Nonavinakere and stayed with my father, elder sister and wife. My name was on the Waiting list for a government job and I was waiting for my selection. Until I received this training, during my student days, I had worn a full head of juttu (tuft of hair); I had it cut into a crop. In those days, keeping a crop was strictly forbidden both at home and in society.", "Because I received training from experts at Victoria Hospital and the Medical School and worked in all the wards, although my theory was less, I had gained a great deal of experience practically in the system of medicine."]}, {"n": 35, "b": ["After receiving this training, I went and settled in Nonavinakere and began my medical practice by making only mixtures and tablets of medicines. In those days there were no tablets at all. This laid the foundation for my earning a livelihood.", "At that time coffee beans were not available in Nonavinakere, and everyone used to bring coffee beans from Tiptur. Since I knew Chikkamagaluru from having been a teacher there, I got coffee beans and coffee powder brought from Chikkamagaluru by railway and began trading along with the medicines. My father gave a little money as capital for this. The business went well. School books and stationery were also not available in Nonavinakere. On the advice of my friends, trade in school books and stationery began along with coffee beans. I named this shop \"Vinata Medical and Provision Stores\". (That is, by that time, in 1936, Ammanni had been born.) Later, a man named Rangaswamy Iyengar of the same town joined me as a partner. He now lives with his son in Jayanagar, Bangalore. After that we expanded our business and used to get goods from Bangalore and sell them. Our firm earned a name not only in Nonavinakere but in the surrounding villages, and the business flourished.", "The sale of clocks, bicycles and gramophones also went on. It was I who first brought a gramophone to Nonavinakere. People used to come from the villages to hear and see this gramophone being played. When the Mangalarati was done in the temple, they would insist that our gramophone be brought and a record played. At that time electric lights had not come to Nonavinakere. At night, after closing the shop and eating, I would place a Petromax (a kind of advanced lantern) light in the street in front of the house, spread a mat in the street and play the gramophone, and the whole town would sit and listen until 12 o'clock at night, as if coming to watch a drama. This was a matter of pride for us."]}, {"n": 36, "b": ["My wife came to our house two years after the wedding (1934). After that, for two years we had no children. My elder sister, my wife's mother and my close ones, brooding that I had no children, used to make vows to the gods. My wife Alamelu, who had not done any housework, had by this time learned all the housework and cooking, and had also learned to do things neatly. She would play the harmonium and sing devotional songs. This was education received from her paternal aunt. She became skilled in handicrafts such as beadwork, drawing and embroidery, and other girls of the town too would come to her to learn.", "Before Alamelu came to our house, there were only 3 of us in the house: myself, my widowed elder sister and my father. We used to carry out the worship and rituals in brief. After Alamelu came to the house, she began to carry out all the worship and rituals in detail. After Alamelu came to our house, when my elder sister was lying with a fatal i
