nd the author's paternal great-grandmother. Her only recorded child is Krishna Iyengar. The book gives only her name. (p. 4)", "p32-krishna-iyengar-bhalyada": "The author's paternal grandfather, called \"Bhalyada\" because he is said to have held the ceremonial spear in the Mysore palace as bodyguard to the Maharaja. The author doubts this, since a bodyguard would have lived in Mysore and would have needed weapons training, and thinks he may have been an official's attendant instead. He won the job by walking daily to whichever town an official was visiting and greeting him until the official asked what he wanted. He is said to have carried his blind wife Chennamma on his shoulders from Nuggehalli to Nonavinakere. He died when the author's father was five. (pp. 4, 8)", "p33-first-wife": "First wife of the author's eldest uncle Srinivasa (Doddappa). She died, after which he married again. (p. 5)", "p34-second-wife": "Second wife of the author's eldest uncle Srinivasa (Doddappa) and the mother of Deshikachar. She and her husband both died while their son was very small. (pp. 5, 13, 16)", "p35-kobbari-deshikachar": "The author's elder cousin, son of Doddappa, called \"my elder brother\" and known as Kobbari Deshikachar at Nonavinakere. His parents died in his childhood and he grew up in the joint family there. He inherited Nacharamma's property as her adopted grandson. After the cholera deaths he stayed on alone, was once thought of as a match for Ambujamma, and then married at Mayasandra without telling his uncle, the author's father, so the father did not attend. The families were out of touch for years and the relationship resumed after the father was transferred back to Nonavinakere. He married Thimmajamma, had three sons and five daughters, and lived in Malleswaram. He was 90 years old when the author wrote. (pp. 5, 13, 16–17)", "p36-thimmajamma": "Wife of Kobbari Deshikachar, daughter of Garudachar of Bindinganavile and Yaggamma. They had three sons and five daughters; their youngest daughter, Rukmini, died recently. At the time of writing she and the family were in good health. (p. 5)", "p37-narayana": "Second son of Kobbari Deshikachar. He is named in the book among the cousins whose Upanayana was held along with the author's son Nagaraja's. (pp. 5, 16)", "p38-mahalakshmi": "Daughter of Kobbari Deshikachar, the author's cousin's daughter. She married Annayya, the eldest son of Sundararaja Iyengar, who was Alamelu's uncle, which joined the author's side of the family to his wife's side a second time. (p. 29)", "p39-annayya": "Eldest son of Sundararaja Iyengar of Kadaba, Alamelu's cousin. He married Mahalakshmi, daughter of Deshikachar who was the son of the author's paternal uncle. (p. 29)", "p40-rukmini": "The youngest daughter of Kobbari Deshikachar and Thimmajamma. She died shortly before the author wrote this account. (p. 5)", "p42-sriranagamma": "Second child of Krishna Iyengar and Chennamma, the author's paternal aunt. She was married to Srinivasa Iyengar, a high school teacher. Her son Ramaswamy Iyengar retired as an engineer and his children built a house near Bhashyam Park in Malleswaram. (pp. 4, 6)", "p43-srinivasa-iyengar": "A high school teacher who married the author's paternal aunt Sriranagamma. Their son Ramaswamy Iyengar became an engineer. (p. 6)", "p44-ramaswamy-iyengar": "Son of Sriranagamma and the high school teacher Srinivasa Iyengar; he retired as an engineer. His children built a house near Bhashyam Park in Malleswaram, Bangalore, and are the children of the elder sister of Prabha's mother. His name is on the list of welcoming guests in Vinatalakshmi (Ammanni)'s wedding invitation. His son K. R. Anantharaman was Marketing Director of BEML. (p. 6)", "p45-his-wife": "Wife of Ramaswamy Iyengar. The book says her children are the children of the elder sister of the mother of Prabha, the author's second daughter-in-law, which makes her Prabha's mother's elder sister and ties Prabha to the author's paternal family. She is not named. (p. 6)", "p46-k-r-anantharaman": "Son of Ramaswamy Iyengar and a grandson of the author's paternal aunt Sriranagamma. He was the Marketing Director of Bharat Earth Movers Limited (BEML). (p. 6)", "p48-garudamma-akkachi": "The author's paternal aunt, third child of Krishna Iyengar and Chennamma, called \"Akkachi\". She married into the Kashyapa gotra, was widowed and had no children, and lived afterwards in the author's family home. The book calls her very capable in business and very courageous; her braid reached her knees, and other girls asked for hairstyles like hers. After Kobbari Venkatachala Iyengar died she managed that household's affairs and carried on his moneylending. She died of cholera three days after Nacharamma in the epidemic. (pp. 6, 13, 16)", "p49-eggamma": "The author's paternal aunt, fourth child of Krishna Iyengar and Chennamma. She married the famous Vadhyar Srinivasa Raghavachar of Kadaba, younger brother of Nacharamma's husband, and had no sons, only three daughters: Rajamma, Seetha (Kuttamma) and Jokkamma. She was a widow living in the Nonavinakere joint family. She owned a house and paddy field in Kadaba which went to her three daughters. She later sheltered Deshikachar for some time in her house. (pp. 6–7, 13, 17)", "p50-srinivasa-raghavachar": "The famous Vadhyar (priest and scholar) of Kadaba, of the Srivatsa gotra, who married the author's aunt Eggamma. He was the younger brother of Kobbari Venkatachala Iyengar. He taught astrology and the Vedas, and the Purva and Apara Prayoga ritual procedures, to the author's father and uncle at Kadaba, and the brothers-in-law also studied English and Kannada at the mission school there under his protection. The book calls him a great scholar in astrology and the Vedas. (pp. 6, 9)", "p51-rajamma": "Eldest daughter of Eggamma, the author's cousin. Her husband Krishna Iyengar was an officer in the Civil Munsif Court. They had three sons and two daughters; the sons have died and the daughters live in Bangalore, whom the author has not met. (pp. 6–7)", "p52-krishna-iyengar": "Husband of Rajamma, an officer in the Civil Munsif Court. Their three sons died, and the two daughters are in Bangalore. (pp. 6–7)", "p55-seetha-alias-vanajamma-k": "Second daughter of Eggamma and the author's cousin, known as Seetha, Vanajamma, Kuttamma and, after she went to Delhi with her husband, \"Delhi Kutti\". Her husband taught her English at home, and the author heard her speak and give speeches fluently in English. She lived in Mysore and, after the cholera epidemic, took the author and his family there. She lost her nine-year-old son Seshadri to cholera. She had one son and three daughters. (pp. 7, 16–17)", "p56-daroga-of-nonavinakere": "Husband of Seetha (Kuttamma), from the Daroga family of Nonavinakere. He was a tahsildar at Anantapur and Gooty, taught his wife English at home, and was for some time an officer in the lower-level education department of the Mysore government. He played the violin and told the future by astrology, and the queen of the Mysore palace often invited him to hear his predictions. (p. 7)", "p57-raja-iyengar": "Son of Seetha (Kuttamma) and the tahsildar. He became a veterinary doctor in the Andhra government and died young. His wife and children live in Belur. (p. 7)", "p58-ambujamma": "Eldest daughter of Seetha (Kuttamma), living in Jayanagar, Bangalore. There had once been an intention to marry her to Deshikachar, but she was married elsewhere. The author has not met her. (pp. 7, 17)", "p59-sarojamma": "Second daughter of Seetha (Kuttamma) and the tahsildar. The author saw her as a child and says she and her sisters were living but he has not met them. (p. 7)", "p60-mahalakshmamma": "Youngest daughter of Seetha (Kuttamma). The author saw her as a child and has not met her since. (p. 7)", "p61-seshadri": "A nine-year-old son of Seetha (Kuttamma), who died of cholera two days after the author's aunt Garudamma and sister Bhagirathi died in the same epidemic at Nonavinakere. (p. 16)", "p62-jokkamma": "Third daughter of Eggamma. She married Srinivasa Iyengar of Mavanuru and has died, with one daughter and one son, Rangaraja. (p. 7)", "p63-srinivasa-iyengar": "Of Mavanuru in Holenarasipura taluk, husband of Eggamma's daughter Jokkamma. Both he and his wife have died; their son Rangaraja lives in Bangalore. (p. 7)", "p64-rangaraja": "Son of Jokkamma and Srinivasa Iyengar of Mavanuru, living in Bangalore. The author says he has not met him. (p. 7)", "p66-narayana-iyengar": "The author's father, fifth and youngest child of Krishna Iyengar and Chennamma, born around 1866. He studied English at Kadaba under his brother-in-law Srinivasa Raghavachar, then at the London Mission High School in Bangalore, passed the SSLC in the first class, and became a signalman at Srirangapatna station. When he was selected for training in Calcutta the plague was spreading there, his elders refused to send him, and he resigned. He became a schoolmaster at Rs. 8 a month and served in villages including Karedakuppa, Kanatur, Nagavalli, Kandikere and Nonavinakere, finishing as a headmaster at Rs. 25, running the branch post office in each, and drew a pension of Rs. 15 for 40 years after 35 years in the Education Department. (pp. 8–11, 19–24)\n\nHe was respected as a teacher: at Kandikere every student he taught at night, free, in his own house passed the L.S. examination. He knew Ayurveda, tied amulets people believed in, and did priestly work for small gifts. When his wife Ramakkamma died he was 35–40 and refused to remarry, bringing up the children with his eldest daughter Ammalakka. He nursed his small son Dore through his last illness and carried his body for the cremation. He refused the author's wish to study at Tumkur and declined friends' advice to settle in Bangalore, out of attachment to Nonavinakere. At 95 he was still Branch Post Master there. He died at Tumkur on 9 June 1964. (pp. 11, 14, 19–24, 32)\n\nHe had little money: he sold his wife's jewels while she lived to buy a garden at Nonavinakere, which was lost in a dispute over a path when the sale money vanished through a flaw in the deed and deceit by trusted friends, and he paid the disputants' court costs. He sold the inherited site behind the Bete Raya Swami temple, where the author's rebuilding had stopped after an objection in court. He made two tours of North India by train, except Badri, and walked to Melukote for the Vairamudi 12 years in succession. (pp. 105, 113)", "p68-garudamma-ammalakka": "The author's eldest sister, second child of Narayana Iyengar and Ramakkamma, called \"Ammalakka\" because a Tamil neighbour used to call her \"Ammala\". She was married at about ten, before the author was born, to Record Ramaswamy Iyengar of Kadaba, who died before she came of age, leaving her a child widow. After their mother died she raised the author and his younger brother, and later his children, as her own, looking after the household even through travel sickness on the move to Kandikere. She fell ill with pneumonia soon after Alamelu came to the house. Her father got her two acres of wet land at Kadaba from her husband's property; the author sold it and bought 4 acres in a better location, and with the added money the Someshwarapuram house in Tumkur for Rs. 7,500. She died peacefully in Seshadripuram, Bangalore, on the morning after the Ganapati festival in 1982, just before Shaila's wedding, after looking over the wedding clothes the day before. Her rites were held at Gaya and Varanasi with Nagaraj and Jairam. The author says Jayalakshmi's slow nature and cooking remind him of her. (pp. 14–15, 21–22, 33, 101–109)", "p69-record-ramaswamy-iyengar": "Of Kadaba, the child husband of the author's eldest sister Ammalakka, and the paternal uncle of Seetharama Iyengar of Kadaba. He died before she came of age. His wet land at Kadaba was obtained by the author's father for her livelihood. (pp. 14–15)", "p70-bhagirathi-bai": "The author's second sister, third child of Narayana Iyengar and Ramakkamma, called \"Bai\" or \"Bayamma\". She resembled the author's eldest daughter Vinatalakshmi and could not speak Tamil until she was ten. About 1917 she was married as the second wife of Maramat Shamanna of Kadaba, who worked in the district office at Shimoga; his seven stepchildren harassed her, and the author, who went with her and studied for a year in the primary school there, says they harassed him too. She was brought to Nonavinakere for her delivery, fell ill with cholera in the epidemic and died before the birth, in the same week as Nacharamma and Garudamma. (pp. 15–16, 19, 21)", "p71-maramat-shamanna": "Of Kadaba, the Srivatsa gotra, who worked in the district office at Shimoga. His first wife left seven children, the eldest daughter already married. He took the author's sister Bhagirathi as a second wife around 1917 to manage the household. (p. 16)", "p72-pankaja": "The fourth child of Narayana Iyengar and Ramakkamma. She died in infancy before the author was born. Elders said she was as fair and lovely as a glass doll, and the author likens her to his granddaughter Chinnu. (p. 17)", "p75-dore-doraiswamy": "The author's younger brother, sixth and last child of Narayana Iyengar and Ramakkamma, named Doraiswamy and called Dore. His mother died of infection soon after his birth. Fed on cow's and buffalo's milk, he developed cirrhosis of the liver, with a swollen belly, green veins and thin limbs. He was very sweet, handsome and extremely intelligent: listening to the author study he could recite the verses, lessons and tables. His father ordered Dongre's Balamrit from Bombay for him by parcel, but he died aged eight. His father carried his body for the cremation. The author writes that with the medical knowledge he later gained, Dore could have been saved, and that he cured his own son Shridhar of the same illness. (pp. 20–22)", "p74-alamelu": "The author's wife, born in Kadaba, daughter of Appanna Iyengar and his second wife Rangamma. The match was arranged through the author's father's friend Cheluva Bhatta; she was twelve and the author twenty-two when they married at Kadaba around 1930, in a wedding of eight days. She grew up in Kadaba with her younger sister Padma, her grandparents Jokkanna and Mahalakshmamma, her aunt Puttatayamma and her mother, and had no contact with her father. Puttatayamma taught her music, the harmonium and handicrafts. She was too shy at first to give the author coffee. (pp. 26–32)\n\nShe came to the author's house two years after the wedding, knowing no housework, and learned it from his sister Ammalakka and the neighbours. When Ammalakka fell ill soon after, townspeople called her arrival inauspicious, but this faded as she learned the household, the cooking and the daily worship. She sang devotional songs, played the harmonium and taught other girls handicrafts. She stayed at Nonavinakere with his father and sister while he trained in Bangalore, and dressed her son Nagaraja's plague wound twice a day for three months. At Huliyar she was popular and clever among the women, who came to learn handicrafts and refinement, and the book says this helped his medical practice. She did political and social work indirectly, and was made President of the Women's wing of the Hobli Congress Committee, though he declined invitations for her to take an active part. She toured North India for the first time with him, with Jairam on his L.T.C. (Delhi, Haridwar, Rishikesh, Mussoorie, Varanasi, Allahabad, Gaya, Agra, Mathura), and again with Nagaraj's family in 1983. (pp. 33–36, 40, 42, 44, 109, 112)\n\nIn the Malleshwaram house after the move from Seshadripuram, where she had lived for fourteen years among close companions, she was left with few companions after Shaila's wedding. She already had diabetes, then high blood pressure, and her heart weakened; she kept cooking despite the doctor's advice, and nursing two newly delivered daughters (Nalini and Shaila) added to the strain. She was treated at K.C. General, Victoria, Bowring and Jayadeva Hospitals and died in the early morning of 23.9.1985 (Bhadrapada Shukla Dashami), with her eldest daughter Vinata and eldest son Nagaraja beside her; Sridhara arrived just after the fire was lit. Jairam led the rites, which cost about Rs. 20,000. Ramesh named his newborn daughter Alamela for her. The author sums up her life: married young, a good housewife who bore and raised ten children and married them all, the only woman of the family who died as a sumangali, guided by the training of Puttatayamma and Ammalakka; he says all his difficulties were resolved through her shrewdness, efficiency and popularity, and the full credit for the household is hers. (pp. 80–84, 107–111)", "p116-hiriyuru-jokkanna-chokka": "Alamelu's grandfather, a renowned Vedic scholar of the Shrivatsa gotra, loved by the people and talented in worldly matters, the postmaster at Kadaba, and like the author's father. He laid out a famous garden with coconut, areca and banana, flowers and fruit trees, footpaths, stone benches and a well. He had two sons, Appanna Iyengar and Sundararaja Iyengar, and two daughters, Puttatayamma and Kamalamma. He arranged his son Appanna's second marriage to Rangamma because the first wife had fits. He died some years before the author's wedding, and a dispute over his property afterwards kept Appanna away. (pp. 27–28, 30)", "p117-mahalakshmamma": "Alamelu's grandmother, wife of Jokkanna (Chokkanna) Iyengar; her mother was Belagam Janakamma. She was alive at the author's wedding and lived for some years after. After her husband died she stayed indoors without showing her face to anyone in town; the author lived in her house for many days without seeing it, and saw her face only when she died. Because of ill feeling between her and her daughter-in-law Rangamma she lived with her daughter Kamalamma at Kadaba and died there. Her son Sundararaja was adopted by her own father. (pp. 28, 31, 36)", "p118-rangamma-dodda": "Appanna Iyengar's first wife, daughter of Ramakrishna Iyengar of Bidadi, of the Kutsa gotra. She had two sons, Srinivasa and Raju, and two daughters, Indiramma and Ambujamma. She suffered fits, which led her father-in-law to arrange a second marriage for her husband; the fits are said to have stopped afterwards. The two wives could not get along in Mysore. (pp. 28, 30)", "p119-appanna-iyengar-srinivas": "Alamelu's father, the elder son of Jokkanna Iyengar, who worked in the Railway Workshop at Mysore. He had two wives, both named Rangamma; the second was Alamelu's mother. After his father's death a dispute over property made him stay in other people's houses when he came to Kadaba, and he did not attend the author's wedding or his younger daughter's. Alamelu and her sister had no contact with him. (pp. 28, 30–31, 37)", "p120-rangamma-chikka": "Alamelu's mother, the only daughter of Alasingachar of Kadaba, married as second wife to Appanna Iyengar. Because the two wives did not get along she left Mysore and lived at Kadaba with her parents-in-law. She had two daughters, Alamelu and Padmamma. After Paddu's wedding she lived alone at Kadaba, and after Puttatayamma died the grandmother lived under her shelter until they quarrelled. She travelled to Hassan to find a groom for Vinatalakshmi and proposed the house in which Vinata was later wed. She died in 1966 at the house of the author's daughter. (pp. 28–31, 37, 45)", "p121-srinivasa": "Elder son of Appanna Iyengar and his first wife Dodda Rangamma, a half-brother of Alamelu. He has died; only Raju and Ambujamma of that family were living when the author wrote. (p. 28)", "p122-raju": "Son of Appanna Iyengar and Dodda Rangamma, a half-brother of Alamelu. He married the daughter of the author's friend Ramaswamy Iyengar, son of Seshamma, elder sister of Tirunarayana Iyengar of Nonavinakere, and settled in Mysore. (p. 28)", "p124-indiramma": "Daughter of Appanna Iyengar and his first wife, a half-sister of Alamelu. She has died. (p. 28)", "p125-ambujamma": "Daughter of Appanna Iyengar and Dodda Rangamma, a half-sister of Alamelu. She was living when the author wrote, with her brother Raju. (p. 28)", "p126-padmamma-paddu": "Alamelu's younger sister, called Paddu or Paddakka, eight years old when the author married. She married Krishna Iyengar, the daughter's son of Gundlapandita of Mysore, at the Sampige Srinivasa temple; their father did not come, and Sundararaja Iyengar and his wife poured the water of giving. She lived in Mysore, where the author's eldest daughter Vinatalakshmi stayed in her house until she finished high school. She went with the family to see Vinata when the wedding was arranged. (pp. 32, 37, 44–45)", "p127-krishna-iyengar": "Husband of Alamelu's sister Paddu, the daughter's son of Gundlapandita, a donor to the Mysore Ayurvedic College. The author calls him his co-brother-in-law and lived in his grandfather's house. When the author's own father died, he helped with the rites in Mysore, and the author credits Gundlapandita's donation with getting the author's son Nagaraja a seat despite being under age for medical study. (pp. 37)", "p128-sundararaja-iyengar": "Alamelu's paternal uncle, the second son of Jokkanna Iyengar, adopted by his maternal grandfather because that grandfather had no children. He married Ranganayakamma (Bapachitri), lived for some time at Kadur and Chikkamagaluru and then at Kadaba, where he died. With his wife he poured the water of giving at Paddu's wedding. His eldest son Annayya married Mahalakshmi, daughter of the author's cousin Deshikachar. (pp. 27–28, 37)", "p129-ranganayakamma-bapachitr": "Wife of Sundararaja Iyengar and daughter of a coffee planter of Chikkamagaluru; Alamelu's paternal aunt by marriage, called Bapachitri. She was still living in Bangalore when the author wrote, and poured the water of giving with her husband at Paddu's wedding. (pp. 28, 37)", "p131-puttatayamma": "Alamelu's paternal aunt, elder daughter of Jokkanna Iyengar, widow of a railway guard. She lived at Kadaba under her father's shelter, managed the house and the lands after his death, and was cultured, intelligent and clever, an expert in music, the harmonium and handicrafts, which she taught Alamelu. She carried out all the work for the author's wedding. She spoke to her younger sister Kamalamma so that the author could stay with them while training in Bangalore. She died of breast cancer in Victoria Hospital, Bangalore, while the author was studying there. (pp. 28–29, 31, 33–34)", "p132-kamalamma": "Alamelu's youngest paternal aunt, Jokkanna Iyengar's daughter, who lived at Chamarajpet, Bangalore, with her husband Raja Iyengar. They housed the author while he trained as a pharmacist at Victoria Hospital and did the most to help his livelihood; he says he remains forever indebted and must remember them every day. A disagreement with Alamelu's mother over some matter led to his staying in a hotel for the last month. She later lived at Kadaba, where Alamelu's grandmother died in her house. She and her husband have died; their children live. (pp. 29, 31, 33–34)", "p133-raja-iyengar": "Accountant at the Apex Bank, Chamarajpet, Bangalore, husband of Kamalamma, Alamelu's paternal aunt. He and his wife gave the author a home and every facility during his pharmacist training and, in the author's words, did the most to help his livelihood. (pp. 29, 33–34)", "p135-alasingachar-alasingacha": "Alamelu's maternal grandfather, of Kadaba, a classmate of the author's father there. He married the sister of Dikshita Sri Rangachar. After his wife and then his daughter Rangamma's wedding, he took his sons to Karachi, where he too was employed. He came to the author's wedding from Karachi. His house at Kadaba was opposite that of Soppinakatte Aprameya Iyengar. (pp. 29–30)", "p136-his-wife": "Wife of Alasingachar, Alamelu's maternal grandmother, sister of Dikshita Sri Rangachar of Kadaba and so the paternal aunt of Anna Durai. She died before Alasingachar moved to Karachi. Her Dikshitar family and that of Shaila's father-in-law are joined again through Anna Durai's elder sister. (pp. 29–30)", "p137-srinivasa-iyengar": "Elder son of Alasingachar, Alamelu's maternal uncle, who worked in a bank in Karachi. He has died; his wife Mohanamma (Amami) and children live in Bangalore. (p. 29)", "p138-mohanamma-amami": "Wife of Srinivasa Iyengar, Alamelu's maternal uncle. After his death she and their children live in Bangalore. (p. 29)", "p139-varadaraja-iyengar": "A son of Alasingachar and Alamelu's maternal uncle. He went swimming in a pool before his marriage and drowned. (p. 29)", "p140-krishna-iyengar-krishnam": "The youngest son of Alasingachar, Alamelu's maternal uncle, who worked in the Railway Department at Karachi. He and his wife sat on the wedding seat at the author's wedding as Alamelu's maternal uncle and aunt. He has died. (pp. 29–30)", "p142-sri-rangachar-dikshita": "Dikshita Sri Rangachar of Kadaba, the father of Dikshita Anna Durai, whose sister married Alasingachar. So his sister was Alamelu's maternal grandmother, and his children are Alamelu's mother's cousins. (p. 29)", "p144-dikshita-anna-durai": "Dikshita Anna Durai of Kadaba. The book says that Alamelu's mother's mother was his paternal aunt, and that his elder sister was the mother of Shaila's father-in-law. He, Kasturiranga Iyengar and the author's mother-in-law Rangamma played together as children. (pp. 30, 46, and later)", "p145-anna-durai-s-elder-siste": "Elder sister of Dikshita Anna Durai and mother of H. R. Rangaswamy Iyengar, who became Shaila's father-in-law. Her family and Alamelu's grandmother's family were both daughters of the Dikshitar family of Kadaba. (p. 30)", "p77-venkataranga-iyengar-raj": "The author's eldest son-in-law, Lawyer Venkataranga Iyengar (Raju), a native of Hassan, a graduate and lawyer, the eldest son of Lawyer Shingayyangar's second family, cultured, experienced, fairly well-off. He was chosen for Vinatalakshmi when the author's mother-in-law found the family. After the proposal had been approved and the author had paid Rs. 1,000, the groom's side suddenly stopped the arrangements without a reason, because of an anonymous letter from Kadaba; the truth came out through relatives, and the wedding took place at Tumkur on 24.5.1957. Later he wrote complaint letters against Vinata and the household was split for twelve years before it became one again. He still repents the incident and has great sympathy for the author's family. (pp. 45–48, 53–56, 88)", "p152-lawyer-shingayyangar": "Late Lawyer Shingayyangar of Hassan, father of Raju. His second family, with Jayamma, included Raju as eldest son. The author went to his house to see the groom. (p. 45)", "p153-jayamma": "Srimati Jayamma, the second wife of Lawyer Shingayyangar and Raju's mother. She attended the wedding, but the author says that from the beginning she was somewhat indifferent in the matter, which laid the foundation for the mishap after the wedding. (pp. 45, 48)", "p154-ramakrishna-iyengar": "Raju's elder brother, a lawyer in Hassan, married to a girl of Attavara whose mother Alamelamma was a close relative of the author's mother. He was the one who told the author that the wedding arrangements had been stopped, without giving a reason. Once the relationship through Alamelamma came to light, the groom's side realised the anonymous letter was written out of envy. His house in Hassan also sheltered the author's cousin Shringaratte. (pp. 12, 46–48)", "p155-appu-srinivasa-raghavach": "Raju's elder brother, School Inspector at Gubbi. He went to Kadaba on his own, collected all the facts about the author's family and helped clear the matter of the anonymous letter. (p. 48)", "p156-keshava-prasad": "Raju's younger brother. A week after Vinatalakshmi arrived at Huliyar with her children, he came and took her elder son Shinganna, then about three, back to Hassan. (p. 55)", "p157-shanta": "Raju's unmarried sister, living in Hassan with three younger brothers and the mother-in-law; the author says they had never given Vinatalakshmi any cooperation. (p. 54)", "p159-kasturiranga-iyengar": "Raju's brother-in-law, the late Kasturiranga Iyengar, related to the Dikshitars of Shantigrama. When the Hassan wedding was called off, he took the author to his house and tried to console him. Dikshita Anna Durai had written a letter introducing the author's family to him, recalling that he, Anna Durai and the author's mother-in-law Rangamma had played together as children. (pp. 46–47)", "p9182-alamelamma": "Alamelamma of Attavara, mother-in-law of Raju's elder brother Ramakrishna, and a close relative of the author's mother. When the author visited Hassan after the wedding arrangements were stopped, she was there and enquired after him and his father. Her presence convinced the groom's side that the anonymous letter had been written out of envy. (pp. 47–48)", "p76-vinatalakshmi": "The author's eldest child, born at Kadaba around 1936 after a long wait, called \"Ammanni\", beautiful, lively and petted by everyone. She stayed with her aunt Paddu in Mysore to finish high school, and when a groom from Tangli was proposed said she did not want that village or house. She married Lawyer Venkataranga Iyengar (Raju) of Hassan at Tumkur on 24.5.1957. After years of non-cooperation from her husband's household she came to Huliyar with her two children, was refused re-entry to Hassan, and in her unhappiness at times attempted to end her life. The author did not go to court, and after twelve years the family reunited. The author says that during this time she remained honest and devout, like Mother Sita, and now lives happier than anyone in her household, proof that honesty and devotion are rewarded. By about 1968 she had moved to Bangalore with her children, then to Mysore next to Paddakka's house, before settling in Hassan around 1973–74. Her children are Shinganna, Ramapriya and Jayashri. Through her efforts Jairam was married. (pp. 36–37, 44–45, 53–56, 61–63, 88)", "p84-dr-nagaraj": "The author's second child and eldest son, G. Nagaraja, born about two years after Vinata. He had a plague abscess on his thigh at three, which his mother dressed daily for three months. He grew up at Nonavinakere with his grandfather and aunt, who loved him most, and passed the SSLC in the first class. He liked Electrical Engineering, but because the author feared a doctors' registration law and could not afford engineering, he was sent for medical studies, entering the L.A.M.S. course under age with the help of Gundlupandita's donation. In Mysore he stayed with Paddu's household until the aunt said they could not keep him, then in the Suttur Swamiji's hostel. He did his house surgency at Tumkur and practised with his father at Huliyar, then took a government medical job. (pp. 37, 40, 49–52, 56–58, 95)\n\nHis wedding to Hemalata followed Sarala's. He was transferred to Sidlaghatta, then, through the author's influence, to Kandikere, where the author's classmates were glad to see their teacher's grandson as doctor, then Kanva in Channapatna taluk, and later Hoysalakatte, Haridravati and Gottigere. He refused to annul the marriage. The author is critical: he says Nagaraj lacked courage because of his upbringing, did not become popular as a doctor, shows little interest in the profession, and that the deception in his marriage dulled his mind; but he is thrifty, law-abiding and afraid of debt, holds a gazetted post and has built a house in Kamalanagar, Bangalore. (pp. 59, 61, 65–68, 95)", "p100-suparna": "The author's second son. His Upanayana was held at Kadaba the day before Vinata's wedding. He studied at Banamayya High School in Mysore, then at Nonavinakere with his grandfather, passed the SSLC and went to Tumkur College, where he did not pass the final B.Sc. exam, partly, the author says, because of friction with his grandfather and aunt in their old age and his grandmother's encouragement. He lived at Huliyar, then got a job at the Bangalore ITI Factory and later the Postal RMS, rising to Officer by his own departmental exams. He took a rented room in Nehru Nagar and later a rented house in Seshadripuram; the author says this began the family's settling in Bangalore, and he was a great help at first. (pp. 48, 50–53, 59–61, 98)\n\nReserved and self-reliant, he decided his own marriage to Prabha, after seeing the deception in Nagaraj's, without taking his parents' advice, at his own expense and with their approval. He has built and rented out a house on Mysore Road without telling his father, and visits once a week. The author is sad that he has no familiarity with relatives or siblings, and that he and Prabha did not invite him to the children's naming or tonsure ceremonies. (pp. 69–70, 98–100)", "p104-jairam-jayaram": "The author's third son, sent to Tumkur to study at Siddaganga High School. After the grandfather died he was left with the author's mother-in-law at Kadaba for his last SSLC year; he left home without telling anyone and returned after six or seven months, losing a year. He and Sridhara failed one part of the SSLC at Kadaba in 1964 and passed the supplementary at Huliyar, helped by Nagaraj's teaching. He won a seat for a diploma at the KGF Mining Polytechnic that year but left to wander, reaching Bangalore in March–April 1967, where he took a small job at the Khode firm and later one in the Electricity Department; the author thinks the wandering taught him the hardships and joys of life. (pp. 52–53, 58, 62)\n\nHe is now employed at the K.E.B., Bangalore: generous, fond of entertaining, spending beyond limit on festivals, and his house is called \"Amma's house\". He toured India young, knows Hindi, and helps colleagues; he won senior officers' friendship but never took the departmental exam. He refused to marry while his mother lived, afraid a daughter-in-law would separate him from his parents; he said \"Three daughters-in-law have already come; what benefit are we getting?\" He led the arrangements for Shaila's wedding and took the lead in his mother's funeral rites (Rs. 20,000, shared by his brothers). After her death he lived alone with his father, refusing meals even at his sisters', and fell ill, being faint-hearted whenever his father or others are ill. Vinatalakshmi found the bride, and he married Jayalakshmi on 11.5.1986 at Hassan, taking no financial help and rejecting his father's advice. The author now lives under his shelter and says he has immense love for him; the author also says Jairam most cherishes his sisters. (pp. 74, 80–85, 100–101)", "p106-shridhara": "The author's fourth son, whom he calls \"the unfortunate\" Sridhara. As a child he recovered from a liver illness through the author's medicine and his mother's care. At Kadaba and at Tiptur College he lived with his grandmother, whose pampering, the author says, harmed his studies; he did not finish his P.U.C. He failed a part of the SSLC in 1964 and passed the supplementary. He joined the ITI course at NGEF in 1967 but left in 1968 after a few months; Suparna repaid the stipend. He had cirrhosis and rickets in his second year and recovered through his mother's nursing. For some years his whereabouts were unknown, which grieved his mother, and he returned in 1973, over age for employment. (pp. 22, 53, 58, 62, 86)\n\nHe entered politics, became acquainted with J. Lingaiah and through him Kengal Hanumanthaiah, a former Chief Minister, who made him his personal secretary and started a weekly, \"Sachiva\", with Sridhara as editor. He was later co-editor of \"Raitabandhu\" with Narayana Gowda, who died, and editor of \"Garibi Hatao\", which stopped when its patron Jairaj died. He founded the first Rajkumar Fans' Association in Bangalore, which later passed to others. He lived apart, visiting home now and then, and no effort was made for his Upanayana or wedding; he himself agreed to marry Sridevi, a Sri Vaishnava girl, out of love, and his sisters and the author helped financially afterwards. The author calls him less educated but better than all the children in talent and eloquence, courageous, self-respecting, never telling his troubles, with an influence in journalism that once reached Delhi. His mother grieved over him until the end, and Jairam has the most sympathy for him. (pp. 86–88, 102)", "p112-ramesh-mohanram": "The author's youngest son. He appears as the editor of the book's presentation, writing in July 2022 that the text is exactly as his father wrote it. He passed the SSLC at Huliyar in 1966 and joined P.U.C. at Renukacharya College in Bangalore, living with Suparna and cooking for themselves. He got a B.Sc. and a job at the BEML Factory, studying further at his own expense: he acted in plays at Huliyar High School under Sri Satyanarayana Rao, took a B.A. in Drama at Central College, a B.A. in Journalism and an M.A. in Communication in first class, while the family teased him. He trained at \"Kannada Prabha\" under Khadri Shamanna, came to know B.V. Karanth, Girish Karnad and Lankesh, and directed plays at Kalakshetra. (pp. 2, 60–62, 75–79)\n\nHe joined the Communist party, avoided the household's religious functions and refused his Upanayana. After eight years at BEML he became a Programme Executive at All India Radio, Gulbarga, then moved to the Delhi TV centre, helped inaugurate the Bangalore TV centre, spent a short time at Madras, and is back at Bangalore. He built a house in Banashankari 3rd Stage on a BDA site and keeps a car. The author says he keeps well-educated company, has little belief in God, custom and dharma, no acquaintance with relatives, is outspoken and dresses plainly with no pride of position. He married Ratna on 8.4.1983, in a one-day wedding without printed invitations; the author wrote to reconsider, but after his wife and children noted a registered marriage was possible, he agreed. Many wealthy families had sought him; he married the girl he liked after waiting for Shaila's wedding. They have two daughters, Alamela, born on 6.7.1985, and Matangi. (pp. 75–82, 102–104)", "p108-shaila": "The author's youngest daughter, born at Huliyar fifteen days after her first nephew Shinganna was born at Tumkur. After her B.A. and typing a groom was found somewhat unexpectedly: at a wedding the groom's sister Vimala mentioned her brother, then in Bangalore from Kota in Rajasthan, and after three days the groom's family approved. Because her results were pending and nothing was ready, the author asked for three more months. To fund the wedding he sold the Tumkur house for Rs. 90,000; his sister Ammalakka died the day after the Ganapati festival while preparations were on. She married Sridhar on 26.11.1982 (Dundubhi year, Karthika Shukla Dashami, Friday) at the Sri Rama Kalyana Mantapa in Malleshwaram, with Jairam leading the arrangements. This completed the weddings of the author's five daughters. (pp. 15, 52, 73–75, 94)\n\nShe went to Kota, learned Hindi well and adapted courageously. The author calls her talkative, clever, courageous and efficient at running a household, and credits her mother's training; all her siblings loved her as the youngest. After she left, the family moved from Seshadripuram to the Malleshwaram house. She came to Bangalore from Rajasthan when her mother was dying, and has two sons. (pp. 80–82, 94)", "p85-hemalata": "Only daughter of Sudarshana and Rukkamma, Babanna's niece. She married Dr. Nagaraj on 16.5.1971 at the Ubhaya Vedanta Sabha Kalyana Mantapa, Malleshwaram. The author writes that her family did not tell his about an illness of hers, that she had not completed primary school nor learned housework or crafts, and that he felt cheated; he says her parents, though in Bangalore, gave her no proper childhood treatment, education or household training and tied her to others by deceit and lies. He also says the girl herself is very good, of very good nature, with great love for the household, though stubborn and of little discretion, and that she has since learned household work. Nagaraj refused advice to annul the marriage, saying she should not suffer for her parents' betrayal. The author thinks she could have become fairly intelligent had she stayed longer with him and received his wife's training, but Nagaraj was soon transferred. They have a son and a daughter. (pp. 56, 65–68, 96)", "p88-sarala-jechamma": "The author's second daughter, called Chechamma. After high school at Huliyar she was sent to Bangalore for marriage, since Huliyar had no contact with the family's own community. Her mother searched hard for a groom and arranged the match with Sri Rangadhama through Sri Babanna; the engagement was settled at Secunderabad, with her brother Nagaraja and her mother present, before her father was told. She married him on 17.5.1970 at the Thimmayya Channamma Kalyana Mantapa, Seshadripuram; the author sold his elder sister's share of paddy field in Kadaba to pay for it. (pp. 60–65)\n\nThey began in a small rented house in Kumara Park, with four vessels from her mother against her husband's one trunk; through her intelligence and good fortune she later built a two-storeyed house in Rajajinagar 2nd Stage with telephone, fridge, grinder and all comforts. Hospitable, clever in the kitchen and outside affairs, though quick to anger over trifles. The author credits the training of his elder sister and her mother, and says the household brings him joy; her mother did not live to see it. They have two daughters. (pp. 90–91)", "p89-sri-rangadhama": "The author's second son-in-law, Sarala's husband, a native of Belur and only son of Melagodu Rangaswamy Iyengar, of Kaushika gotra, Vadagalai. Both parents had died and his only sister lives in Hyderabad. He studied in the house of a distant relative, Lawyer Alasingachar of Hassan, earned an Electrical Diploma and became a Supervisor at the HMT Factory, Bangalore. Babanna introduced him; after he and Babanna asked Raju in Hassan and learned that no real accusations existed, the match was agreed. He rented a small house in Kumara Park near the author's home, inherited only a house in Belur, bought a site and built a two-storeyed house at Mariyappana Palya. The author calls him simple, intelligent, trustworthy and devout, who knows hardship from growing up under others' shelter, and says Sarala is his good fortune. (pp. 62–65, 89–90)", "p164-sri-babanna": "Of Balepet, Bangalore, from the Hassan side. Rangadhama was staying at his house or ashram. He helped arrange Sarala's wedding after checking the rumours about Vinata's household with Raju. He later proposed Hemalata, his sister Rukkamma's daughter, for Nagaraja, citing the favour done. The author writes that after the wedding Babanna and his family slipped away, and that he felt betrayed because, he believed, they concealed an illness of their daughter. (pp. 63–67)", "p165-lawyer-alasingachar-of-h": "A distant relative of Sri Rangadhama, in whose house Rangadhama studied; this relative lived in Sri Babanna's house at Balepet, Bangalore. (p. 64)", "p166-sri-keshavamurthy": "The close friend of Sri Rangadhama, who lived in Seshadripuram. Their mother was well known to Alamelu, which helped bring about Sarala's match. (p. 63)", "p167-sri-sudarshana": "Husband of Babanna's sister Rukkamma and father of Hemalata. He proposed his only daughter for Nagaraja and agreed to everything the author's family asked. The author writes bitterly that, after the wedding on 16.5.1971, the family slipped away and he came to feel they had concealed their daughter's illness. (pp. 65–67)", "p168-rukkamma": "Babanna's sister and Hemalata's mother. After the wedding she and her children left the hall without saying goodbye, and the author wrote that this was how he first understood he had been betrayed. (pp. 65–66)", "p101-prabha": "Second daughter of the late T. Narasimha Iyengar of Tondavadi, living in Nanjangud, and Suparna's wife; B.A. and good at tailoring, which helps the household. She is also related to the author's paternal aunt Sriranagamma's family, whose wife was her mother's elder sister. The wedding was held at Nanjangud; Suparna arranged it himself and took the Rs. 10,000 meant for the expenses. The author's family went without printed invitations, and he says the bride's people acted as if they had bought him. Afterwards the couple lived with the author for a few months and then in a separate house in Seshadripuram and Srirampura. (pp. 6, 69–70)\n\nThe author says she has little contact with relatives, did not come on Alamelu's annual ceremony, and once left her house locked when Nalini and her husband were invited. He suspects Narasimha's gift to Suparna may have made her feel he had been bought from the author's house, but says no quarrel has occurred and he cannot say whose fault it is. He calls her family worthy. (pp. 98–99)", "p169-t-narasimha-iyengar": "Of Tondavadi, living at Nanjangud, father of Prabha. He sent word to the author, agreeing to hold the wedding briefly and giving the customary gifts. He had died by the time the author wrote and is described as a good traditionalist. (pp. 69–70)", "p92-devaki": "The author's third daughter. She passed B.A., became a Telephone Operator in the Postal Department and gave her salary to her mother each month, keeping only what she needed. She refused the groom the family had chosen and married Vijayasimha, a Madhva Brahmin colleague, in a registered love marriage that neither family approved of or attended; she was sent out of the house with her jewellery, clothes and mangalya, and later the silver vessels. The author grieves that he could not give her away with dhare as scripture says, and that her marriage, a change of tradition on both sides, alarmed them into hastily marrying Nalini. She knew no kitchen work at home but set up a separate house, learned everything, and manages it with her government job; she managed her deliveries without help. The couple later cooperated with the family and live happily with two sons, Akshobhya and Ananda. (pp. 70–72, 91–92)", "p93-sri-vijayasimha": "Devaki's husband, a B.Sc. (Diploma) graduate working in the Telephone Department, the only son of devout parents, of the Madhva Vaishnava tradition, of good lineage, customary and intelligent. Devaki married him in a registered ceremony; neither family liked the match because each was not of the other's community. The author calls him very worthy. They have two sons. (pp. 71–72, 91)", "p96-nalini": "The author's fourth daughter. She did her B.Sc. and learned typewriting at Bangalore, and her mother worked hard to find a groom for her, with the family anxious after Devaki's marriage; every prospective groom's house asked about Devaki. She married Prasannakumar on 29.11.1979 (Siddharthi year, Margashira Shukla Dashami, Thursday), though an earlier passage gives 16.5.1979, with great splendour at the Anjaneya temple choultry at Palace Guttahalli. The wedding was hurried because of Devaki's, no one sought her a job, and the Kadaba land that was the author's share was sold for it; he found it financially hard. She is a B.Sc. with Senior Typewriting, efficient, once quick-tempered and now less so. She later got her own job, took a rented house, equipped it and manages it; the author credits her mother's training. (pp. 61, 72–73, 92–93)", "p97-prasannakumar": "Nalini's husband, B.Sc., the second son of his parents, of good lineage, few words and calm, employed at the Bangalore Silk Merchants Society; the author thinks he could have had a better job had he tried. His father retired as Deputy Director in Sericulture; Magadi is the native place. They married on 29.11.1979 (an earlier passage says 16.5.1979) at the Palace Guttahalli Anjaneyaswamy Choultry. (pp. 73, 92–93)", "p173-prasannakumar-s-father": "Father of Prasannakumar, whom the author calls good, worthy and traditional; a retired Deputy Director of Sericulture from Magadi. (p. 73)", "p109-sridhar": "Shaila's husband, the younger son of H. R. Rangaswamy Iyengar of Kota, born and educated in Rajasthan, a B.Sc. graduate employed in a factory in Kota (the Bharat Instrumentation Factory), owning a house there. The author calls him very good, decent, patient and calm, with great regard for people. His mother is the elder sister of the late Annadorai of the Dikshita house of Kadaba and a first cousin of Rangamma, Alamelu's mother. His father has two sons and three daughters; all except Sridhar live in Karnataka. They married on 26.11.1982 in Malleshwaram. (pp. 74–75, 93–94)", "p147-h-r-rangaswamy-iyengar": "Shaila's father-in-law, whose ancestral place is Haltore. His father worked in the Railway Department at Kota in Rajasthan, and his mother was the sister of Dikshita Anna Durai of Kadaba, daughter of the maternal uncle of the author's mother-in-law Rangamma. He lived in Kadaba in his youth, studied in Karnataka and worked at Kota. He and his wife Padmamma have three daughters and two sons. (pp. 74–75)", "p148-padmamma": "Wife of H. R. Rangaswamy Iyengar and mother of Sridhar, Srinatha and three daughters; daughter of Sri Raja Iyengar of Nuggehalli. Both sides of the Shaila match were known to the author's family. (pp. 74–75)", "p149-srinatha": "The elder son of H. R. Rangaswamy Iyengar and Padmamma, Sridhar's brother, who works in Bangalore and built his own house at Nagarabhavi. (p. 75)", "p113-ratna": "Ramesh's wife, a B.A. graduate and sports medallist. Her father, the late Narayana Rao, was a traditional Dakshina Kannada Brahmin of good lineage; her parents are orthodox Advaita Brahmins of South Kanara, and she has four brothers and an elder sister, all gentle. Ramesh wrote from Gulbarga that he had seen a graduate Brahmin girl of a good family, not of the Sri Vaishnava community, and asked for consent, after another suitor, K. V. Narayan, wealthiest of the Hebbar Sri Vaishnavas, had been put forward. They married on 8.4.1983. The author says she is devoted to God and elders, clever at running a household and outside affairs, thrifty and a good hostess. Under Alamelu's guidance she learned the Vishishtadvaita observances and cooking and follows the family's vratas, though her husband is bound to Communist principles; Alamelu admired her. He suggests she undergo Samashrayana and Chakrankita to become a Sri Vaishnava. She was at her mother's house for delivery when Alamelu died and came two days later with the baby. (pp. 79–82, 103–104)", "p180-narayana-rao": "Ratna's late father, a traditional Dakshina Kannada Brahmin of good lineage. The wedding was held in Bangalore, near Devaiah Park, on 8.4.1983. (p. 79)", "p114-alamelu-chinnu": "Born on 6.7.1985 to Ramesh and Ratna, the elder of their daughters, in primary school by the time of writing. Alamelu, though ill, went to Gulbarga to see her, was captivated by her beauty, and the planned name Ranganayaki was dropped for Alamelu; Alamelu died soon after. The author likens his little sister Pankaja's looks to hers. (pp. 17, 82, 104)", "p105-jayalakshmi": "Third daughter of Keshava Iyengar of Belur, retired from the Police Department, and Sitalakshmi, retired from the Education Department, both natives of Belur, of good lineage; she has one elder sister and three brothers, all in Bangalore. She passed the SSLC and T.C.H., worked as a teacher, and resigned at Jairam's direction. They married on 11.05.1986 at Hassan. Vinatalakshmi's condition was that she look after the author and his daughters well. The author calls her very good, somewhat slow, gaining experience outside; he says she got Alamelu's mangalya, and in her slow nature and cooking resembles his sister Ammalakka. Since there was another Jayalakshmi in the house opposite, they called her Lakshmi. His daughters still call the house \"Amma's\" house. (pp. 84–85, 101)", "p176-keshava-iyengar-of-belur": "Retired from the Police Department; father of Jayalakshmi, of good lineage; he and his wife gave all the articles and performed the wedding at Hassan on 11.05.1986. (p. 85)", "p177-sitalakshmi": "Retired from the Education Department; mother of Jayalakshmi, with her husband Keshava Iyengar of Belur of good lineage and good householders. (p. 85)", "p78-shinga-shinganna": "Eldest son of Raju and Vinatalakshmi, grown up with his father in Hassan; a B.Com. graduate at Karnataka Bank, decent but a little lacking in courage. He married Lakshmi in Bangalore on 28.04.1989 and was soon to be a father. He did not know the facts of the earlier mishap in his father's household until the author explained them to him. He is devoted to his parents, elders and God, and holds the author and his wife in great regard. (pp. 88–89)", "p79-ramapriya-ranji": "Second son of Vinatalakshmi, who grew up in the author's house in childhood and has great regard for everyone there. A B.E. graduate and Lecturer at Malnad Engineering College, Hassan, responsible and thrifty, who plays like a small child with the author. (p. 89)", "p80-jayashri": "The only daughter of Vinatalakshmi, married very young to the distant relative Satyaprakash; she lives with two children in an Arab country where he works. Responsible and courageous, she grew up in the author's household. The family comes to India for one month each year. (p. 89)", "p90-nandini": "First daughter of Rangadhama and Sarala; passed S.S.L.C. in first class, studying the final year of a Secretarial Practice Diploma, and trained in dance; intelligent like her parents. (p. 91)", "p91-saumini-babbi": "Second daughter of Rangadhama and Sarala (Babbi), of few words, who passed S.S.L.C. with the 18th rank in Karnataka State and studies in 1st P.U.C. at M.E.S. College. She wins first or second rank, awards and prizes, with a good memory, and is accomplished in handicrafts and drawing learned from her grandmother Alamelu, who would have rejoiced to see it. Born at K.C. General Hospital, Malleshwaram. Both sisters are shy and come only to the author's house. (p. 91)", "p94-akshobhya": "First son of Devaki and Vijayasimha; in primary school, intelligent and extremely mischievous. (p. 92)", "p95-ananda": "Second son of Devaki and Vijayasimha; in nursery L.K.G., of few words and much mischief, intelligent. (p. 92)", "p98-shruti": "Elder daughter of Nalini and Prasannakumar; of few words like her father, intelligent, in primary school. (p. 93)", "p99-shrivatsa": "Second son of Nalini and Prasannakumar; intelligent, in primary school. (p. 93)", "p110-abhijit-ranganath": "First son of Shaila and Sridhar, called Ranganath; in primary school, ranks in every class, intelligent and clever, only lacking courage. He speaks Hindi well but no Kannada. (p. 94)", "p111-sannu": "Second son of Shaila and Sridhar, only one and a half years old at the time. (p. 95)", "p86-garudadhwaja-deepu": "Deepu, first son of Nagaraj and Hema. As a child he lived with his mother's parents and was naughty; Alamelu brought him to the author's house from nursery and he progressed well. When she died he was in the 7th class and was admitted to the 8th class elsewhere. He passed S.S.L.C. in first class, then was selected for training at the Mico Factory and left college. The author wanted him to be an engineer and regrets that his father has not performed his Upanayana though he is past the age. His elder aunt loved him dearly and he still loves the household. (pp. 96–97)", "p87-jyothi": "Daughter of Nagaraj and Hema, who stayed with her mother's mother to attend high school, passed S.S.L.C. and is in P.U.C. The author says she is a very good girl, worries about her training there, and says Alamelu would not have left the children in others' custody. (p. 97)", "p102-adarsh-madhusudana": "Elder son of Suparna and Prabha (Madhusudana), who has passed S.S.L.C. and is in P.U.C. The author has not seen him for years; he came to tell him of the result and the author was glad. (p. 99)", "p103-abhishek": "Second son of Suparna and Prabha, born 12 years after the first; visits with his father and looks intelligent. (p. 99)", "p107-sridevi": "Sridhara's wife, whom the author says he knows little but who appears to be of good nature. The wedding was at the Sri Srinivasa temple, Rajajinagar, Bangalore, attended by Jairam, Lakshmi and Chechamma. Vinatalakshmi gave her the ear-ornament that Alamelu used to wear. (p. 102)", "p115-matangi": "Second daughter of Ramesh and Ratna (Kalu), named Pankaja after the author's late elder sister; not yet in school, beautiful, very active and courageous. The author believes Alamelu would have raised both children herself. (pp. 104–105)", "p73-dr-n-krishna-iyengar": "Author of the memoir. Loss of property: after his wedding he demolished the inherited house at Nonavinakere to rebuild, but an objection in court stopped it halfway and the materials were lost; he left with a government job and his father sold the site. He sold the Kadaba paddy field and the Huliyar site (Rs. 2,000, for Nagaraj's wedding), and ran a successful shop at Nonavinakere that his partner closed after paying only part. He has earned no property for his children, but is consoled that none was made a debtor and that they built their own houses. He deposited Rs. 10,000 in UTI from Alamelu's gold bangles. Politics: President of the Hobli Congress Committee, Hindi Prachar Sabha, Khadi Gramodyoga Mandal, town co-operative and house-building societies at Huliyar; founding director of co-operatives; member of Tumkur District and Chikkanayakanahalli Taluk Congress Committees, and others. It cost his practice but made his name known to the Vidhana Soudha; he sought no recommendation for his children. He receives the Freedom Fighters' pension of Rs. 300 a month. He survived one minor and three major operations (prostatitis at Hassan, Malleshwaram, Victoria under Dr. B.T. Sampathkumar, and a fourth by Dr. Srinivas at K.C. General), and now lives happily under Jairam and Lakshmi's shelter. (pp. 105–113)"}};
const P=D.people, AU=D.author;
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trail=[];
function card(id,opts={}){
  const p=P[id];const multi=p.fams.length>1;
  const cls='card'+(opts.ghost?' ghost':'')+(p.key?' key':'')+(opts.me?' me':'')+(p.grp?' grp':'');
  const inner=(opts.rel?'<span class="rel">'+opts.rel+'</span>':'')+'<b>'+esc(p.name)+'</b>'+(p.note?'<small>'+esc(p.note)+'</small>':'');
  let el;
  if(p.grp){el=$('div',cls,inner)}else{el=$('a',cls,inner);el.href='#'+id}
  el.dataset.id=id;return el;
}
let LINKS=[];
function anc(id,seen){
  const col=$('div','col');const p=P[id];
  const c=card(id,{});
  if(p.parents.length&&seen<12){
    const row=$('div','apars');const pc=[];
    p.parents.forEach(q=>{const r=anc(q,seen+1);row.appendChild(r.el);pc.push(r.card)});
    col.appendChild(row);LINKS.push({type:'up',child:c,parents:pc});
  }
  col.appendChild(c);return {el:col,card:c};
}
function desc(id,seen,me){
  const col=$('div','col');const p=P[id];
  const row=$('div','cp');const DN=['','Child','Grandchild','Great-grandchild','2nd great-grandchild','3rd great-grandchild'];const mc=card(id,{me,rel:me?'':DN[Math.min(seen,5)]});row.appendChild(mc);
  const sc={};
  p.spouses.forEach(s=>{row.appendChild($('div','mar'));const c=card(s,{rel:'Spouse'});row.appendChild(c);sc[s]=c});
  col.appendChild(row);
  const kids=p.children;
  if(kids.length&&seen<12){
    const groups={};
    kids.forEach(k=>{const o=P[k].parents.filter(x=>x!==id)[0]||'';(groups[o]=groups[o]||[]).push(k)});
    const gw=$('div','groups');const multi=Object.keys(groups).length>1;
    Object.entries(groups).forEach(([o,ks])=>{
      const g=$('div','kids');const cc=[];
      ks.forEach(k=>{const r=desc(k,seen+1,false);g.appendChild(r.el);cc.push(r.card)});
      gw.appendChild(g);
      LINKS.push({type:'down',from:[mc].concat(o&&sc[o]?[sc[o]]:[]),kids:cc,label:multi&&o?'with '+P[o].name:(multi?'':''),grp:g});
    });
    col.appendChild(gw);
  }
  return {el:col,card:mc,row,sc};
}
function draw(stage){
  const old=stage.querySelector('svg.ln');if(old)old.remove();
  stage.querySelectorAll('.glab').forEach(e=>e.remove());
  const sr=stage.getBoundingClientRect();
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','ln');
  svg.setAttribute('width',stage.scrollWidth);svg.setAttribute('height',stage.scrollHeight);
  const R=e=>{const r=e.getBoundingClientRect();return {l:r.left-sr.left,r:r.right-sr.left,t:r.top-sr.top,b:r.bottom-sr.top,cx:(r.left+r.right)/2-sr.left}};
  let d='';let kd='';let pd=[];
  const lane=new Map();const bk={};
  LINKS.filter(L=>L.type==='down').forEach(L=>{const f=L.from.map(R);const k=Math.round(Math.max(...f.map(x=>x.b))/24);const xs=L.kids.map(R).map(k=>k.cx).concat([f.reduce((a,b)=>a+b.cx,0)/f.length]);(bk[k]=bk[k]||[]).push({L,span:Math.max(...xs)-Math.min(...xs)})});
  Object.values(bk).forEach(a=>{a.sort((x,y)=>y.span-x.span);a.forEach((e,i)=>lane.set(e.L,i))});
  const HUES=[212,352,152,28,280,186,60,320];let hi=0;
  LINKS.forEach(L=>{
    if(L.type==='up'){
      const c=R(L.child);const ps=L.parents.map(R);const my=Math.max(...ps.map(p=>p.b))+30;
      d+=`M${c.cx} ${c.t}V${my}`;
      const xs=ps.map(p=>p.cx).concat([c.cx]);d+=`M${Math.min(...xs)} ${my}H${Math.max(...xs)}`;
      ps.forEach(p=>{d+=`M${p.cx} ${my}V${p.b}`});
    }else if(L.type==='kin'){
      const A=R(L.a),B=R(L.b);const left=A.cx<B.cx?A:B,right=A.cx<B.cx?B:A;
      const top=Math.min(A.t,B.t)-16;const x1=left.cx+34,x2=right.cx-34;
      kd+=`M${x1} ${A===left?A.t:B.t}V${top}H${x2}V${A===left?B.t:A.t}`;
      const lb=$('div','glab kin',esc(L.label));lb.style.left=(x1+x2)/2+'px';lb.style.top=top+'px';stage.appendChild(lb);
    }else{
      const f=L.from.map(R);const sx=f.reduce((a,b)=>a+b.cx,0)/f.length;
      const adj=f.length===2&&Math.abs(f[0].cx-f[1].cx)<260;const sy=adj?(f[0].t+f[0].b)/2:Math.max(...f.map(x=>x.b));
      const ks=L.kids.map(R);const my=Math.max(...f.map(x=>x.b))+26+(lane.get(L)||0)*16;
      let q=`M${sx} ${sy}V${my}`;const xs=ks.map(k=>k.cx).concat([sx]);q+=`M${Math.min(...xs)} ${my}H${Math.max(...xs)}`;
      ks.forEach(k=>{q+=`M${k.cx} ${my}V${k.t}`});pd.push([q,HUES[hi++%HUES.length]]);
      if(L.label){const l=$('div','glab',esc(L.label));l.style.left=(Math.min(...xs)+Math.max(...xs))/2+'px';l.style.top=my+'px';stage.appendChild(l)}
    }
  });
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);path.setAttribute('fill','none');path.style.stroke='var(--line)';path.setAttribute('stroke-width','2');path.setAttribute('stroke-linecap','round');
  const kp=document.createElementNS('http://www.w3.org/2000/svg','path');kp.setAttribute('d',kd);kp.setAttribute('fill','none');kp.style.stroke='var(--gold)';kp.setAttribute('stroke-width','2.5');kp.setAttribute('stroke-dasharray','7 5');kp.setAttribute('stroke-linecap','round');svg.appendChild(kp);
  pd.forEach(([q,h])=>{const pp=document.createElementNS('http://www.w3.org/2000/svg','path');pp.setAttribute('d',q);pp.setAttribute('fill','none');pp.style.stroke='hsl('+h+' 38% 56%)';pp.setAttribute('stroke-width','2.4');pp.setAttribute('stroke-linecap','round');pp.setAttribute('stroke-linejoin','round');svg.appendChild(pp)});
  svg.appendChild(path);stage.insertBefore(svg,stage.firstChild);
}
function chips(ids,cls){const w=$('div','chips');ids.forEach(i=>{const a=$('a','chip'+(cls?' '+cls:''),esc(P[i].name));a.href='#'+i;w.appendChild(a)});return w}

let MODE;try{MODE=localStorage.getItem('mode')}catch(e){}
if(MODE!=='phone'&&MODE!=='desktop')MODE=Math.min(screen.width,screen.height)<760?'phone':'desktop';
function applyMode(){document.body.classList.toggle('phone',MODE==='phone');document.getElementById('mode').textContent=MODE==='phone'?'Desktop view':'Phone view'}
function orow(id,rel,key){const p=P[id];const a=$('a','orow'+(key?' key':''),(rel?'<small style="color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:10px">'+esc(rel)+'</small>':'')+'<b>'+esc(p.name)+'</b>'+(p.note?'<small>'+esc(p.note.length>110?p.note.slice(0,108)+'…':p.note)+'</small>':''));a.href='#'+id;return a}
function ancTree(id,seen,depth){const w=$('div',depth?'ind':'');(P[id].parents||[]).forEach(q=>{if(seen.has(q))return;seen.add(q);w.appendChild(orow(q,depth?'':'Parent'));w.appendChild(ancTree(q,seen,depth+1))});return w}
function descTree(id,seen){const w=$('div','ind');P[id].children.forEach(c=>{if(seen.has(c))return;seen.add(c);w.appendChild(orow(c));const sp=P[c].spouses.filter(s=>!seen.has(s));sp.forEach(s=>{seen.add(s);w.appendChild(orow(s,'Spouse of '+P[c].name.split(' (')[0]))});w.appendChild(descTree(c,seen))});return w}
function personPhone(id){window.onresize=null;
  const p=P[id];const m=document.getElementById('m');m.innerHTML='';
  m.appendChild($('h2',null,esc(p.name)));m.appendChild($('p','sub',esc(p.note||'')));
  const ol=$('div','olist');
  if(p.spouses.length){ol.appendChild($('div','lab',p.spouses.length>1?'Spouses':'Spouse'));p.spouses.forEach(s=>ol.appendChild(orow(s,'',true)))}
  if(p.parents.length){ol.appendChild($('div','lab','Parents'));p.parents.forEach(q=>ol.appendChild(orow(q)))}
  if(p.children.length){ol.appendChild($('div','lab','Children'));p.children.forEach(c=>ol.appendChild(orow(c)))}
  const sib=[...new Set(p.parents.flatMap(q=>P[q].children))].filter(x=>x!==id);
  if(sib.length){ol.appendChild($('div','lab','Siblings'));sib.forEach(s=>ol.appendChild(orow(s)))}
  const kin=(p.kin||[]);
  if(kin.length){ol.appendChild($('div','lab','Also related'));kin.forEach(k=>ol.appendChild(orow(k.to,k.label)))}
  m.appendChild(ol);
  const rel=D.conn.filter(c=>c.ids.includes(id)||c.focus===id);
  if(rel.length){m.appendChild($('div','lab','Cross-connections involving '+esc(p.name)));rel.forEach(c=>m.appendChild(story(c)))}
  storySection(id,m);
  const ao=ancTree(id,new Set([id]),0);
  if(ao.children.length){const d=$('details',null,'<summary>Full ancestry</summary>');d.appendChild(ao);const w=$('div','olist');w.appendChild(d);m.appendChild(w)}
  const dd=descTree(id,new Set([id,...p.spouses]));
  if(dd.children.length){const d=$('details',null,'<summary>All descendants</summary>');d.appendChild(dd);const w=$('div','olist');w.appendChild(d);m.appendChild(w)}
}
function person(id){
